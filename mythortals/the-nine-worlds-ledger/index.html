<style>
:root{
  --bg:#0a1324; --bg2:#0f1b33; --panel:#142140; --panel2:#1a2a4e; --line:#2c3d66;
  --ink:#efe7d2; --muted:#bdb5a3; --dim:#8f8a80;
  --vellum:#efe5cb; --vellum2:#e4d7b5; --vink:#2a2216; --vmuted:#5b4d36;
  --gold:#d9b65c; --gold2:#f2d88f; --goldink:#7a5a12;
  --poetic:#72cdb9; --poeticD:#1f6f5e; --prose:#eba95c; --proseD:#8a4d0b;
  --sch:#bba9ee; --schD:#5b3fa6; --ed:#a7bfee; --edD:#2f4f8a; --fic:#a3a3ad; --ficD:#4b4b55;
  --good:#9fe3a8; --warn:#f5d27e; --bad:#ffa395;
  --radius:12px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 700px at 50% -200px,#1b2c55 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh}
a{color:var(--gold2)}
a:hover{color:#fff}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--gold);color:#111;padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{top:8px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(10,19,36,.85)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .crumbs{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.brand .crumbs a{color:var(--muted);text-decoration:none}
.brand .crumbs a:hover{color:var(--gold2);text-decoration:underline}
.brand .t{font-family:var(--serif);font-size:1.05rem;color:var(--ink)}
.proto{display:inline-block;font-size:.72rem;letter-spacing:.08em;font-weight:700;color:#1b1406;background:var(--warn);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.topnav{display:flex;flex-wrap:wrap;gap:6px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;min-height:44px;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--gold);background:#22355f}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1d1406;border-color:#b8913a;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:.9rem}
.btn[aria-pressed="true"]{background:var(--gold);color:#1d1406;border-color:var(--gold2)}
main{max-width:1320px;margin:0 auto;padding:16px}
main:focus{outline:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;color:var(--ink)}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:.2em 0}
h2{font-size:1.45rem;margin:.6em 0 .4em}
h3{font-size:1.12rem;margin:.6em 0 .3em}
p{margin:.5em 0}
.muted{color:var(--muted)}
.kicker{font-size:.8rem;letter-spacing:.18em;color:var(--gold2);font-weight:700;text-transform:uppercase}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.note{border-left:4px solid var(--gold);background:rgba(217,182,92,.08);padding:10px 12px;border-radius:8px}
.note.fic{border-left-color:var(--fic);background:rgba(163,163,173,.08)}
footer{max-width:1320px;margin:24px auto 0;padding:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}

/* title / door */
.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:center;margin:8px 0 18px}
.doorwrap{perspective:1200px;display:flex;justify-content:center}
.door{width:min(260px,70vw);aspect-ratio:3/5;position:relative}
.door svg{width:100%;height:100%;display:block}
.door .leaf{transform-origin:12% 50%;transition:transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1.1s}
.door.open .leaf{transform:rotateY(-78deg);filter:brightness(.6)}
.door .glow{opacity:0;transition:opacity 1.1s}
.door.open .glow{opacity:1}
.tagline{font-family:var(--serif);font-style:italic;color:var(--gold2);font-size:1.15rem}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin:14px 0}
.tiercard{display:flex;flex-direction:column;gap:6px}
.tiercard .seal{font-size:.92rem}
.tiercard .btn{margin-top:auto}
.medal{display:inline-flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.06em;font-size:.8rem;text-transform:uppercase}
.medal i{font-style:normal;width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid currentColor}
.m-bronze{color:#e0a46e}.m-silver{color:#d6dde8}.m-gold{color:var(--gold2)}.m-tutorial{color:var(--poetic)}
.keyring{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:8px}
.slot{border:1px dashed var(--line);border-radius:10px;min-height:42px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--dim);text-align:center;padding:2px}
.slot.active{border:2px solid var(--gold);color:var(--ink);grid-column:span 4;font-size:.8rem;gap:6px;flex-wrap:wrap;padding:6px}

/* workspace */
.wshead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.tasklist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-current="step"]{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(242,216,143,.35) inset;background:#22355f}
.chip .st{font-size:.85rem;width:1.1em;text-align:center}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"task" "drawer" "board" "ledger"}
.a-task{grid-area:task}.a-drawer{grid-area:drawer}.a-board{grid-area:board}.a-ledger{grid-area:ledger}
@media (min-width:1080px){
  .grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"task board" "drawer board" "drawer ledger"}
  .grid.silver{grid-template-areas:"task drawer" "board board" "ledger ledger"}
  .a-board{position:sticky;top:10px;align-self:start}
  .grid.silver .a-board{position:static}
}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:12px 0}
legend{padding:0 6px;font-weight:700;color:var(--gold2);font-size:.95rem}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;margin:4px 0;min-height:44px}
.opt:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.opt input{margin-top:.25em;width:20px;height:20px;flex:0 0 auto;accent-color:var(--gold)}
.opt.sel{background:rgba(217,182,92,.12);border-color:var(--gold)}
.opt small{display:block;color:var(--muted)}
.itemhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.kind{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#1d1406;background:var(--gold);padding:2px 8px;border-radius:99px;font-weight:700}
.prompt{font-size:1.05rem}
.pinned{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.pinrow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--vellum);color:var(--vink);border-radius:8px;padding:6px 8px 6px 10px;flex-wrap:wrap}
.pinrow b{font-family:var(--serif)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.feedback{margin-top:12px;border-radius:10px;padding:10px 12px;background:#0d1730;border:1px solid var(--line)}
.feedback:empty{display:none}
.feedback ul{margin:6px 0 0;padding-left:0;list-style:none}
.feedback li{margin:4px 0;padding-left:1.6em;text-indent:-1.6em}
.fb-good::before{content:"\2713  ";color:var(--good);font-weight:700}
.fb-warn::before{content:"\25B3  ";color:var(--warn);font-weight:700}
.fb-bad::before{content:"\2715  ";color:var(--bad);font-weight:700}
.verdict{font-weight:700}
.v-sound{color:var(--good)}.v-partial{color:var(--warn)}.v-unsound{color:var(--bad)}
.stale{color:var(--warn);font-size:.9rem}
.coach{border:1px solid var(--poetic);background:rgba(114,205,185,.08);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.coach ol{margin:6px 0 0 0;padding-left:1.4em}
.coach li.done{color:var(--good)}
.coach li.done::marker{content:"\2713  "}

/* drawer cards */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--vellum);color:var(--vink);border-radius:10px;padding:12px 12px 10px;border-left:8px solid var(--vmuted);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.card.f-poetic{border-left-color:var(--poeticD)}
.card.f-prose{border-left-color:var(--proseD)}
.card.f-scholarly{border-left-color:var(--schD)}
.card.f-editor{border-left-color:var(--edD)}
.card.f-fiction{border-left-color:var(--ficD);background:#e2e0dc}
.card.pinnedc{outline:3px solid var(--goldink);outline-offset:0}
.card h4{margin:2px 0 4px;font-family:var(--serif);font-size:1.05rem;color:var(--vink)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.68rem;letter-spacing:.08em;font-weight:800;padding:2px 6px;border-radius:5px;background:#fff8;color:var(--vink);border:1px solid #0002;text-transform:uppercase}
.tag.fam-poetic{background:var(--poeticD);color:#fff}.tag.fam-prose{background:var(--proseD);color:#fff}.tag.fam-scholarly{background:var(--schD);color:#fff}.tag.fam-editor{background:var(--edD);color:#fff}.tag.fam-fiction{background:var(--ficD);color:#fff}
.excerpt{font-family:var(--serif);font-size:1.02rem;line-height:1.5;margin:6px 0;white-space:pre-line}
.cite{font-size:.82rem;color:var(--vmuted)}
.cite a{color:#6b3f00}
.cardbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cbtn{appearance:none;border:1px solid #8a7550;background:#fffaf0;color:var(--vink);border-radius:8px;padding:6px 10px;min-height:40px;cursor:pointer;font-weight:600}
.cbtn:hover{background:#fff}
.cbtn[aria-pressed="true"]{background:var(--goldink);color:#fff;border-color:var(--goldink)}
.cbtn[disabled]{opacity:.5;cursor:not-allowed}
.cdetail{font-size:.85rem;color:var(--vmuted);border-top:1px dashed #8a755066;margin-top:6px;padding-top:6px;overflow-wrap:anywhere}

/* board */
.boards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.boards.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.boardbox{background:radial-gradient(700px 400px at 50% 30%,#1c2d57,#0b152b);border:1px solid var(--line);border-radius:12px;padding:8px}
.boardbox h3{margin:4px 6px 0;font-size:1rem}
.boardbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;color:var(--muted);margin:8px 2px}
.legend svg{vertical-align:middle}
.inwords{font-size:.9rem;color:var(--muted);margin:6px 2px}
.inwords summary{cursor:pointer;color:var(--ink);min-height:32px}
.inwords ul{margin:4px 0;padding-left:1.2em}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--gold2);font-weight:700;font-size:.85rem;letter-spacing:.03em}
td .btn{min-height:36px}
@media (max-width:640px){
  table.stack thead{position:absolute;left:-9999px}
  table.stack tr{display:block;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 8px}
  table.stack td{display:block;border:0;padding:3px 0}
  table.stack td::before{content:attr(data-label) ": ";color:var(--gold2);font-weight:700;font-size:.8rem}
}
.score{font-family:var(--serif);font-size:2.2rem;color:var(--gold2)}
.sealbig{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sealbig .disc{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#1d1406;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 60%,#8b6a1d);box-shadow:0 0 0 4px #00000040, 0 0 30px rgba(242,216,143,.35);text-align:center}
.confirm{border:1px solid var(--bad);background:rgba(255,163,149,.08);border-radius:10px;padding:10px 12px;margin-top:8px}
.cols2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.reg h4{margin:10px 0 2px;font-family:var(--serif)}
.reg .excerpt{font-size:.95rem}
.regcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.regcard .excerpt{color:var(--ink)}
.regcard .cite{color:var(--muted)}
.regcard .cite a{color:var(--gold2)}
@media (max-width:720px){
  .hero{grid-template-columns:minmax(0,1fr);text-align:center}
  .top{padding:8px 12px}
  main{padding:12px}
  .panel{padding:12px}
  .slot.active{grid-column:span 6}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
.rm *,.rm *::before,.rm *::after{transition:none!important;animation:none!important}
.big .excerpt{font-size:1.15rem}
body.big{font-size:18px}
@media (min-width:1080px){
  .a-drawer .cards{max-height:78vh;overflow-y:auto;padding-right:6px;scrollbar-color:var(--gold) transparent}
}

</style>

      text: 'Ydalir call they the place where Ull / A hall for himself hath set; / And Alfheim the gods to Freyr once gave / As a tooth-gift in ancient times.',
      note: 'Checked against the 1936 printing of Bellows’ translation. Alfheim is named as a gift to the god Freyr; the stanza gives no location.' },
    GRM26: { family: 'poetic', work: 'Grímnismál', passage: 'stanza 26', tr: BELLOWS, mode: 'quote', checked: URLS.grmBellows, alt: URLS.grmWikisource,
      short: 'Grímnismál 26',
      text: 'Eikthyrnir is the hart who stands by Heerfather’s hall / And the branches of Lærath he bites; / From his horns a stream into Hvergelmir drops, / Thence all the rivers run.',
      note: 'Bellows reads Lærath as “presumably the ash Yggdrasil”. The stanza places Hvergelmir under no root.' },
    GRM31: { family: 'poetic', work: 'Grímnismál', passage: 'stanza 31', tr: BELLOWS, mode: 'quote', checked: URLS.grmBellows, alt: URLS.grmWikisource,
      short: 'Grímnismál 31',
      text: 'Three roots there are that three ways run / ’Neath the ash-tree Yggdrasil; / ’Neath the first lives Hel, ’neath the second the frost-giants, / ’Neath the last are the lands of men.',
      note: 'Translations differ in wording and order of the three. This is Bellows’ rendering.' },
    GRM35: { family: 'poetic', work: 'Grímnismál', passage: 'stanza 35', tr: BELLOWS, mode: 'quote', checked: URLS.grmBellows, alt: URLS.grmWikisource,
      short: 'Grímnismál 35',
      text: 'Yggdrasil’s ash great evil suffers, / Far more than men do know; / The hart bites its top, its trunk is rotting, / And Nithhogg gnaws beneath.',
      note: '' },
    VAF43: { family: 'poetic', work: 'Vafþrúðnismál', passage: 'stanza 43', tr: BELLOWS, mode: 'quote', checked: URLS.vafBellows,
      short: 'Vafþrúðnismál 43',
      text: 'Of the runes of the gods and the giants’ race / The truth indeed can I tell, / (For to every world have I won;) / To nine worlds came I, to Niflhel beneath, / The home where dead men dwell.',
      note: 'The giant Vafthruthnir is speaking. Old Norse line 4: “níu kom ek heima fyr Niflhel neðan”.' },

    GYL3: { family: 'prose', work: 'Gylfaginning', passage: 'section III', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning III',
      text: '…and all men shall live, such as are just in action, and be with himself in the place called Gimlé. But evil men go to Hel and thence down to the Misty Hel; and that is down in the ninth world.',
      note: 'Spoken by Thridi. Section numbers follow Brodeur (1916); other editions number chapters differently.' },
    GYL4: { family: 'prose', work: 'Gylfaginning', passage: 'section IV', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning IV',
      text: 'It was many ages before the earth was shaped that the Mist-World was made; and midmost within it lies the well that is called Hvergelmir… Yet first was the world in the southern region, which was named Múspell; it is light and hot…',
      note: 'Abridged (…). The “Mist-World” is Niflheim.' },
    GYL8: { family: 'prose', work: 'Gylfaginning', passage: 'section VIII', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning VIII',
      text: '…along the strand of that sea they gave lands to the races of giants for habitation. But on the inner earth they made a citadel round about the world against the hostility of the giants, and for their citadel they raised up the brows of Ymir the giant, and called that place Midgard.',
      note: '' },
    GYL9: { family: 'prose', work: 'Gylfaginning', passage: 'section IX', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning IX',
      text: 'Next they made for themselves in the middle of the world a city which is called Ásgard; men call it Troy. There dwelt the gods and their kindred…',
      note: '' },
    GYL13: { family: 'prose', work: 'Gylfaginning', passage: 'section XIII', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XIII',
      text: '…has it not been told thee, that the gods made a bridge from earth, to heaven, called Bifröst? Thou must have seen it; it may be that ye call it ‘rainbow.’',
      note: 'Used in the tutorial only.' },
    GYL15A: { family: 'prose', work: 'Gylfaginning', passage: 'section XV (roots)', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XV · roots',
      text: 'The Ash is greatest of all trees and best: its limbs spread out over all the world and stand above heaven. Three roots of the tree uphold it and stand exceeding broad: one is among the Æsir; another among the Rime-Giants, in that place where aforetime was the Yawning Void; the third stands over Niflheim, and under that root is Hvergelmir, and Nídhöggr gnaws the root from below.',
      note: 'Spoken by Jafnhárr.' },
    GYL15B: { family: 'prose', work: 'Gylfaginning', passage: 'section XV (Mímir)', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XV · Mímir',
      text: 'But under that root which turns toward the Rime-Giants is Mímir’s Well, wherein wisdom and understanding are stored; and he is called Mímir, who keeps the well.',
      note: '' },
    GYL15C: { family: 'prose', work: 'Gylfaginning', passage: 'section XV (Urdr)', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XV · Urdr',
      text: 'The third root of the Ash stands in heaven; and under that root is the well which is very holy, that is called the Well of Urdr; there the gods hold their tribunal. Each day the Æsir ride thither up over Bifröst…',
      note: 'Comes a few lines after the roots passage, in the same section.' },
    GYL15D: { family: 'prose', work: 'Gylfaginning', passage: 'section XV (Norns)', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XV · Norns',
      text: 'A hall stands there, fair, under the ash by the well, and out of that hall come three maids, who are called thus: Urdr, Verdandi, Skuld; these maids determine the period of men’s lives: we call them Norns…',
      note: '' },
    GYL16: { family: 'prose', work: 'Gylfaginning', passage: 'section XVI', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XVI',
      text: 'The squirrel called Ratatöskr runs up and down the length of the Ash, bearing envious words between the eagle and Nídhöggr… Moreover, so many serpents are in Hvergelmir with Nídhöggr, that no tongue can tell them…',
      note: 'Abridged.' },
    GYL17: { family: 'prose', work: 'Gylfaginning', passage: 'section XVII', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XVII',
      text: '“Thou knowest many tidings to tell of the heaven. What chief abodes are there more than at Urdr’s Well?” Hárr said: “Many places are there, and glorious. That which is called Álfheimr is one, where dwell the peoples called Light-Elves; but the Dark-Elves dwell down in the earth…”',
      note: 'Gangleri asks; Hárr answers.' },
    GYL34: { family: 'prose', work: 'Gylfaginning', passage: 'section XXXIV', tr: BRODEUR, mode: 'quote', checked: URLS.gylBrodeur, alt: URLS.gylWikisource,
      short: 'Gylfaginning XXXIV',
      text: 'Hel he cast into Niflheim, and gave to her power over nine worlds, to apportion all abodes among those that were sent to her: that is, men dead of sickness or of old age.',
      note: '“He” is Allfather (Odin).' },

    BEL_VSP2: { family: 'scholarly', work: 'Bellows’ note on Völuspá 2', passage: 'note to stanza 2 (1923)', tr: BELLOWS, mode: 'quote', checked: URLS.vspBellows, reconstruction: true,
      short: 'Bellows’ 1923 note · Vsp 2',
      text: 'Nine worlds: the worlds of the gods (Asgarth), of the Wanes (Vanaheim…), of the elves (Alfheim), of men (Mithgarth), of the giants (Jotunheim), of fire (Muspellsheim…), of the dark elves (Svartalfaheim), of the dead (Niflheim), and presumably of the dwarfs (perhaps Nithavellir… but the ninth world is uncertain).',
      note: 'A 20th-century editor’s commentary, not medieval text. Cross-references omitted (…).' },
    BEL_GRM31: { family: 'scholarly', work: 'Bellows’ note on Grímnismál 31', passage: 'note to stanza 31', tr: BELLOWS, mode: 'quote', checked: URLS.grmBellows,
      short: 'Bellows’ note · Grm 31',
      text: 'The first of these roots is the one referred to in stanza 26; the second in stanza 29 (cf. notes). Of the third root there is nothing noteworthy recorded.',
      note: 'An editor connecting stanzas. This is interpretation, not text from the poem.' },
    BEL_VSP29: { family: 'scholarly', work: 'Bellows’ note on Völuspá 29', passage: 'note to stanza 29', tr: BELLOWS, mode: 'quote', checked: URLS.vspBellows,
      short: 'Bellows’ note · Vsp 29',
      text: 'The first line, not in either manuscript, is a conjectural emendation based on Snorri’s paraphrase.',
      note: 'So the line “I know where Othin’s eye is hidden” was supplied by editors with help from Snorri’s prose.' },
    BEL_VSP20: { family: 'scholarly', work: 'Bellows’ note on Völuspá 20', passage: 'note to stanza 20', tr: BELLOWS, mode: 'quote', checked: URLS.vspBellows,
      short: 'Bellows’ note · Vsp 20',
      text: 'Dwelling: Regius has “sae” (sea) instead of “sal” (hall, home), and many editors have followed this reading, although Snorri’s prose paraphrase indicates “sal.”',
      note: 'The manuscript says the maidens come from a lake; Snorri’s hall reading has influenced editors.' },

    ED_VAF43: { family: 'editor', work: 'Editor’s note on Vafþrúðnismál 43', passage: 'game editor’s summary', tr: null, mode: 'paraphrase',
      short: 'Editor’s note · Vaf 43',
      text: 'The Old Norse line is níu kom ek heima fyr Niflhel neðan. Bellows translates it “To nine worlds came I, to Niflhel beneath”. The words fyr … neðan are usually understood as “below”, so the line is often read as “nine worlds below Niflhel”. On that reading the giant may mean a different nine from the “nine in the tree” of Völuspá 2.',
      note: 'Original paraphrase written for this game. It is not a quotation and has not been independently reviewed.' },
    ED_SNORRI: { family: 'editor', work: 'Editor’s note on Snorri Sturluson', passage: 'game editor’s summary', tr: null, mode: 'paraphrase',
      short: 'Editor’s note · Snorri',
      text: 'Snorri Sturluson (1179–1241) was a Christian Icelandic scholar and chieftain. The Prose Edda is usually dated to the 1220s. Its Prologue explains the Æsir as people from Troy, a learned medieval framing rather than a record of pre-Christian belief. Scholars debate how much of Gylfaginning rests on lost poems and oral tradition, and how much is Snorri’s own systematising.',
      note: 'Original paraphrase written for this game. It is not a quotation and has not been independently reviewed.' },

      note: 'FICTIONAL GAME FRAME. It provides no historical evidence and supports no entry.' }
