<script>
/* =====================================================================
   CALCORTALS ENGINE — Calcortal #001 · The Two Gauges
   Pure mathematical + game engine. No DOM, no storage, no timers,
   no randomness, no network. Everything here is deterministic and
   can be exercised headlessly (Node) or in the page.
   Units: time t in HOURS, position/distance in KILOMETRES,
   velocity in KILOMETRES PER HOUR. The interface converts to minutes
   and seconds for display only.
   ===================================================================== */
(function (root) {
'use strict';

var ENGINE_VERSION = '1.0.0';
var LIMITS = Object.freeze({
  MAX_N: 1000,          // largest subdivision count accepted
  MAX_READINGS: 40,
  MAX_WINDOWS: 40,
  MAX_SECANTS: 60,
  MAX_SUMS: 60,
  MAX_X0: 12,
  MAX_ACTIONS: 3000,    // per recording
  MIN_ABS_H: 1e-4       // hours (0.006 min): floor for exact-trace secants
});
var TIERS = ['bronze', 'silver', 'gold'];
var TIER_NAMES = { bronze: 'Bronze — Apprentice Observer', silver: 'Silver — Railway Analyst', gold: 'Gold — Master of the Instruments' };

/* ---------------- numeric helpers ---------------- */
function isNum(x) { return typeof x === 'number' && isFinite(x); }
function roundTo(x, dp) {
  var f = Math.pow(10, dp);
  var r = Math.round(x * f) / f;
  return r === 0 ? 0 : r;           // normalise -0
}
function near(a, b, eps) { return Math.abs(a - b) <= (eps === undefined ? 1e-9 : eps); }
function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }
function ok(value, extra) { var r = { ok: true, value: value }; if (extra) for (var k in extra) r[k] = extra[k]; return r; }

  function idxL(t) { for (var i = 0; i < segs.length; i++) if (t <= segs[i].t1) return i; return segs.length - 1; }

    domain: [segs[0].t0, segs[segs.length - 1].t1], segs: segs,

/* ---------------- stage framework helpers ---------------- */
var U_KMH = { 'km/h': 1, 'km/min': 60, 'm/s': 3.6 };
var U_KM = { 'km': 1, 'm': 0.001 };
var U_T = { 'h': 1, 'min': 1 / 60, 's': 1 / 3600 };
var UNIT_OPTS_V = ['km/h', 'km/min', 'm/s', 'km', 'h'];
var UNIT_OPTS_X = ['km', 'm', 'km/h', 'h'];

var UNIT_MSGS = {
  'km': 'Kilometres measure distance, not this quantity.',
  'm': 'Metres measure distance, not this quantity.',
  'km/h': 'km/h is a velocity, not this quantity.',
  'km/min': 'km/min is a velocity, not this quantity.',
  'm/s': 'm/s is a velocity, not this quantity.',
  'h': 'Hours measure time, not this quantity.',
  'min': 'Minutes measure time, not this quantity.',
  's': 'Seconds measure time, not this quantity.'
};

function AUTO(id, prompt, points, test, progress) {
  return { id: id, kind: 'auto', prompt: prompt, points: points, test: test, progress: progress || null, required: true, requires: [] };
}
function NUM(id, prompt, points, o) {
  return { id: id, kind: 'numeric', prompt: prompt, points: points, units: o.units, unitOptions: o.unitOptions || Object.keys(o.units),
    expect: o.expect, requires: o.requires || [], misc: o.misc || null, integer: !!o.integer, required: true, rounding: o.rounding || null };
}
function CHOICE(id, prompt, points, options, correct, o) {
  o = o || {};
  return { id: id, kind: 'choice', prompt: prompt, points: points, options: options.map(function (p) { return { id: p[0], text: p[1] }; }),
    correct: correct, requires: o.requires || [], feedback: o.feedback || {}, explain: o.explain || '', required: true };
}
function PREDICT(id, prompt, points, options, correct, lockedWhen, o) {
  o = o || {};
  return { id: id, kind: 'predict', prompt: prompt, points: points, options: options.map(function (p) { return { id: p[0], text: p[1] }; }),
    correct: correct, lockedWhen: lockedWhen, requires: [], explain: o.explain || '', required: false };
}
function DESIGN(id, prompt, points, evaluateFn, o) {
  o = o || {};
  return { id: id, kind: 'design', prompt: prompt, points: points, evaluateDesign: evaluateFn, requires: o.requires || [], required: true };
}
function notReady(msg) { return { notReady: msg }; }
function expectVal(value, tol) { return { value: value, tol: tol }; }

function bench(s) { return s.inst.bench; }
function viewer(s) { return s.inst.viewer; }
function accum(s) { return s.inst.accum; }
function readingAt(s, t) { var r = bench(s).readings; for (var i = r.length - 1; i >= 0; i--) if (near(r[i].t, t)) return r[i]; return null; }

  var b = bench(s); if (!b.pair) return null;

  b.readings.forEach(function (r) { if (r.id === b.pair[0]) A = r; if (r.id === b.pair[1]) B = r; });
  if (!A || !B) return null;
  return A.t <= B.t ? [A, B] : [B, A];
}
function secantsAt(s, instIdx) { return viewer(s).secants.filter(function (e) { return e.inst === instIdx; }); }

function sumsOn(s, a, b) { return accum(s).sums.filter(function (e) { return near(e.a, a) && near(e.b, b); }); }
function anyExists(arr, f) { for (var i = 0; i < arr.length; i++) if (f(arr[i])) return arr[i]; return null; }
function mOf(cfg, key) { return MODELS[cfg.models[key || 'main']]; }
function fm(h) { return fmtMin(h, h * 60 === Math.round(h * 60) ? 0 : 2); }
function pick(tier, b, s, g) { return tier === 'bronze' ? b : tier === 'silver' ? s : g; }

/* ======================================================================
   THE FIFTEEN STAGES

var CHAPTERS = [
  { n: 1, title: 'The Broken Speedometer', theme: 'Discovering average velocity.' },
  { n: 2, title: 'The Tangent in the Dark', theme: 'Discovering instantaneous change.' },
  { n: 3, title: 'The Silent Odometer', theme: 'Discovering accumulation.' },
  { n: 4, title: 'The Journey Reconstructed', theme: 'Signed accumulation and initial conditions.' },
  { n: 5, title: 'The Two Gauges', theme: 'Unifying derivatives and integrals.' }
];

/* ---------- 001 · Midnight Departure ---------- */
defStage('001', 1, 'Midnight Departure', function (tier) {
  var model = pick(tier, 'm_const72', 'm_accel', 'm_cubic');
  var tol = pick(tier, 0.5, 0.2, 0.05);
  var cfg = {
    models: { main: model }, gauges: { speed: 'failed', odometer: 'ok', position: 'absent' },
    instruments: ['bench'], primary: 'bench',
    bench: { model: 'main', mode: 'manual', reads: { odo: true }, start: 0, step: [1, 0.1] },
    story: 'The Meridian Express leaves Hollin Cross at midnight. Somewhere in the dark the speedometer needle drops to zero and stays there — but the train is plainly still moving. The odometer still turns.',
    task: 'Take two odometer readings at different times and work out, by hand, how fast the train travelled between them.',
    tierNote: pick(tier, 'The train runs at a steady pace tonight. Readings at least a minute apart work best.',
      'The train is gathering speed. Do the arithmetic yourself — the bench will not do it for you.',
      'The train accelerates unevenly. You will also need the average from 60 to 90 minutes exactly.'),
    hints: [
      'Set the clock, press Capture, then move the clock and capture again. Two readings are all you need.',
      'Change in distance = later reading − earlier reading. Change in time = later time − earlier time.',
      'Average velocity = change in distance ÷ change in time. If your time is in minutes, convert to hours first (÷ 60), so the answer comes out in km/h.'
    ],
    discovery: 'An average velocity needs two moments. It tells you how fast the train went over the interval — not what the needle would have said at either instant.',
    objectives: [
      AUTO('readings', 'Capture two odometer readings at least 1 minute apart.', 10, function (s) {
        var r = bench(s).readings; for (var i = 0; i < r.length; i++) for (var j = i + 1; j < r.length; j++) if (Math.abs(r[i].t - r[j].t) >= 1 / 60 - 1e-12) return true; return false;
      }),
      NUM('dx', 'Distance travelled between readings A and B', 15, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['readings'],
        expect: function (s) { var p = pairOf(s); if (!p || Math.abs(p[1].t - p[0].t) < 1 / 60 - 1e-12) return notReady('Mark two readings at least a minute apart as A and B.'); return expectVal(roundTo(p[1].odo - p[0].odo, 3), 0.0015); },
        misc: function (s) { var p = pairOf(s); return p ? [{ value: -(p[1].odo - p[0].odo), tol: 0.0015, msg: 'Subtract the earlier reading from the later one: the odometer only counts upward.' }] : []; } }),
      NUM('dt', 'Time elapsed between readings A and B', 15, { units: U_T, unitOptions: UNIT_OPTS_T, requires: ['readings'],
        expect: function (s) { var p = pairOf(s); if (!p || Math.abs(p[1].t - p[0].t) < 1 / 60 - 1e-12) return notReady('Mark two readings at least a minute apart as A and B.'); return expectVal(p[1].t - p[0].t, 0.0005); } }),
      NUM('vavg', 'Average velocity between A and B', 25, { units: U_KMH, unitOptions: UNIT_OPTS_V, requires: ['dx', 'dt'],
        expect: function (s) { var p = pairOf(s); if (!p) return notReady('Mark readings A and B.'); return expectVal((p[1].odo - p[0].odo) / (p[1].t - p[0].t), tol); },
        misc: function (s) { var p = pairOf(s); if (!p) return []; var dx = p[1].odo - p[0].odo, dt = p[1].t - p[0].t;
          return [{ value: dx / (dt * 60), tol: tol / 60 + 1e-6, msg: 'That is kilometres per minute. The gauge is calibrated in km/h: divide by the time in hours, not minutes.' },
            { value: dt / dx, tol: 1e-3, msg: 'That is time ÷ distance. Velocity is distance ÷ time.' }]; } }),
      CHOICE('meaning', 'What does your number tell the crew?', 15, [
        ['instant', 'The exact needle reading at the moment of reading B, on any journey.'],
        ['average', 'How fast the train travelled on average between readings A and B.'],
        ['perMin', 'How many kilometres the train covers each minute.'],
        ['total', 'The total distance the train has travelled since Hollin Cross.']
      ], 'average', { requires: ['vavg'], feedback: { instant: 'Two readings can only describe the interval between them. On a changing journey the needle at B could read something quite different.', perMin: 'Your number is per hour, not per minute.', total: 'That would be the odometer itself, not a rate.' } })
    ].concat(tier === 'gold' ? [
      NUM('vavg2', 'Average velocity from 60 min to 90 min exactly', 20, { units: U_KMH, unitOptions: UNIT_OPTS_V, requires: ['vavg'],
        expect: function (s) { var a = readingAt(s, 1), b = readingAt(s, 1.5); if (!a || !b) return notReady('Capture readings at exactly 60.00 min and 90.00 min.'); return expectVal((b.odo - a.odo) / 0.5, 0.05); } })
    ] : [])
  };
  return cfg;
});

/* ---------- 002 · Between the Signals ---------- */
defStage('002', 1, 'Between the Signals', function (tier) {
  var model = pick(tier, 'm_accel', 'm_brake', 'm_sine');
  var sig = pick(tier, [0.1, 0.2, 0.4, 0.6, 0.8], [0.1, 0.25, 0.5, 0.75, 1.0], [0.1, 0.2, 0.6, 1.1, 1.6]);
  var names = ['Signal 0 (Ashby)', 'Signal 1 (Brant)', 'Signal 2 (Coldwell)', 'Signal 3 (Dunmere)', 'Signal 4 (Eyre)'];
  var m = MODELS[model];
  function avgS(k) { return (readOdometer(m, sig[k]) - readOdometer(m, sig[0])) / (sig[k] - sig[0]); }
  function trend() {
    var d = [avgS(2) - avgS(1), avgS(3) - avgS(2), avgS(4) - avgS(3)];
    if (d.every(function (x) { return Math.abs(x) < 1e-6; })) return 'same';
    if (d.every(function (x) { return x > 0; })) return 'rise';
    if (d.every(function (x) { return x < 0; })) return 'fall';
    if (d[0] > 0 && d[d.length - 1] < 0) return 'risefall';
    return 'other';
  }
  function hasAvg(s, k) { return anyExists(bench(s).avgs, function (e) { return near(e.t1, sig[0]) && near(e.t2, sig[k]); }); }
  var trendOpts = [['rise', 'Rise steadily'], ['fall', 'Fall steadily'], ['same', 'Stay exactly the same'], ['risefall', 'Rise at first, then fall']];
  var why = pick(tier, 'faster', 'slower', 'both');
  return {
    models: { main: model }, gauges: { speed: 'failed', odometer: 'ok', position: 'absent' },
    instruments: ['bench'], primary: 'bench',
    bench: { model: 'main', mode: 'auto', reads: { odo: true }, start: sig[0], step: [1, 0.1], signals: sig.map(function (t, i) { return { t: t, label: names[i] }; }) },
    story: 'Signal lamps flick past in the dark: Ashby, Brant, Coldwell, Dunmere, Eyre. The guard has a theory that the average speed depends on which two signals you time between. Test it.',
    task: 'Using Signal 0 as the start every time, measure the average velocity to each of the four later signals. The bench now does the division for you.',
    tierNote: pick(tier, 'The train is speeding up through this stretch.', 'The driver is braking for the valley.', 'The line rolls over the hills — speed rises and falls.'),
    hints: ['Use the signal buttons to jump the clock to each signal. Capture a reading at every signal.',
      'Mark Signal 0 as A and a later signal as B, then press Calculate. Repeat for each later signal.',
      'Longer intervals include more of the later journey. Ask: is the later journey faster or slower than the start?'],
    discovery: 'An average depends on the interval. The shortest interval from Signal 0 gives the average closest to the speed at Signal 0 itself — a clue for what comes next.',
    signals: sig,
    objectives: [
      PREDICT('predict', 'Before measuring: as the far signal gets further from Signal 0, the average velocity will…', 10, trendOpts, trend,
        function (s) { return bench(s).avgs.length >= 2; }, { explain: 'Predictions lock once you have calculated two averages.' }),
      AUTO('avgs', 'Calculate the average from Signal 0 to each of Signals 1–4.', 20, function (s) { return [1, 2, 3, 4].every(function (k) { return !!hasAvg(s, k); }); },
        function (s) { return [1, 2, 3, 4].filter(function (k) { return !!hasAvg(s, k); }).length + ' of 4'; }),
      CHOICE('actual', 'What did the averages actually do as the far signal moved further away?', 20, trendOpts, trend, { requires: ['avgs'] }),
      CHOICE('why', 'Which explanation fits your measurements?', 20, [
        ['faster', 'The later part of the journey is faster, so longer intervals pull the average up.'],
        ['slower', 'The later part of the journey is slower, so longer intervals pull the average down.'],
        ['both', 'The train speeds up and then slows: long intervals first gain fast motion, then add slow motion.'],
        ['instrument', 'The odometer drifts over longer intervals.']
      ], why, { requires: ['actual'], feedback: { instrument: 'The odometer is accurate to one metre throughout. The differences come from the motion itself.' } })
    ].concat(tier === 'bronze' ? [] : [
      CHOICE('closest', 'Which interval gave the average closest to the train’s speed at the moment it passed Signal 0?', 20,
        [[1, 'Signal 0 → 1'], [2, 'Signal 0 → 2'], [3, 'Signal 0 → 3'], [4, 'Signal 0 → 4']].map(function (p) { return [String(p[0]), p[1]]; }),
        function () { var best = 1, be = Infinity; for (var k = 1; k <= 4; k++) { var e = Math.abs(avgS(k) - m.v(sig[0])); if (e < be) { be = e; best = k; } } return String(best); },
        { requires: ['why'] })
    ])
  };
});

/* ---------- 003 · A Narrower Window ---------- */
defStage('003', 1, 'A Narrower Window', function (tier) {
  var model = pick(tier, 'm_accel', 'm_brake', 'm_cubic');
  var anchor = pick(tier, 0.5, 0.5, 0.85);
  var wMin = hours(pick(tier, 1, 0.5, 0.01)), wReq = hours(pick(tier, 1, 0.5, 0.1));
  var tol = pick(tier, 1.0, 0.5, 0.3);
  var m = MODELS[model];
  var windowsDistinct = function (s) { return distinctBy(bench(s).windows, function (e) { return e.w; }); };
  var dir = function () { return m.acc(anchor) > 0 ? 'fall' : 'rise'; };
  var objs = [
    PREDICT('predict', 'Before shrinking: as the window gets narrower, the estimates will…', 10,
      [['fall', 'Fall toward a value'], ['rise', 'Rise toward a value'], ['same', 'Stay the same'], ['random', 'Jump about at random']], dir,
      function (s) { return bench(s).windows.length >= 2; }, { explain: 'Locks after your second window.' }),
    AUTO('sequence', 'Record at least four different window sizes, the smallest no wider than ' + fm(wReq) + '.', 20, function (s) {
      var d = windowsDistinct(s); return d.length >= 4 && Math.min.apply(null, d.map(function (e) { return e.w; })) <= wReq + 1e-12;
    }, function (s) { return windowsDistinct(s).length + ' sizes'; }),
    NUM('settle', 'The value your estimates settle toward (the speed at ' + fm(anchor) + ')', 30, { units: U_KMH, unitOptions: UNIT_OPTS_V, requires: ['sequence'],
      expect: function () { return expectVal(m.v(anchor), tol); },
      misc: function (s) { var w = bench(s).windows; if (!w.length) return []; var widest = w.reduce(function (p, q) { return q.w > p.w ? q : p; });
        return [{ value: widest.est, tol: 1e-6, msg: 'That is the average over your widest window. Look at where the narrow windows are heading.' }]; } }),
    CHOICE('meaning', 'That settled value is…', 20, [
      ['inst', 'The train’s velocity at the instant ' + fm(anchor) + ' — what the broken needle would show.'],
      ['last', 'The average over the last window you measured.'],
      ['trip', 'The average over the whole journey.']
    ], 'inst', { requires: ['settle'] })
  ];
  if (tier === 'gold') {
    objs.push(AUTO('tiny', 'Record a window no wider than 0.02 min (1.2 s).', 5, function (s) { return !!anyExists(bench(s).windows, function (e) { return e.w <= hours(0.02) + 1e-12; }); }));
    objs.push(CHOICE('erratic', 'Your tiniest windows give worse estimates than slightly wider ones. Why?', 15, [
      ['rounding', 'The odometer shows whole metres. A rounding error of up to a metre is divided by a tiny Δt, which magnifies it.'],
      ['nolimit', 'The instantaneous velocity does not exist, so the estimates cannot settle.'],
      ['random', 'The train’s speed fluctuates randomly from second to second.'],
      ['digits', 'Computers cannot divide by small numbers.']
    ], 'rounding', { requires: ['tiny', 'settle'], feedback: { nolimit: 'The motion here is smooth, so the limit exists. What fails is the measurement, not the mathematics.' } }));
  }
  return {
    models: { main: model }, gauges: { speed: 'failed', odometer: 'ok', position: 'absent' },
    instruments: ['bench'], primary: 'bench',
    bench: { model: 'main', mode: 'window', reads: { odo: true }, start: anchor, anchor: anchor, wMin: wMin, wMax: hours(30),
      presets: pick(tier, [20, 10, 5, 2, 1], [10, 5, 2, 1, 0.5], [10, 1, 0.2, 0.05, 0.01]) },
    story: 'The dispatcher at Coldwell needs the train’s speed at one precise moment — ' + fm(anchor) + ' — to clear the next block. One interval gives only an average. What if you made the interval smaller?',
    task: 'Fix the moment, then repeatedly shrink the observation window after it. Watch where the estimates head.',
    tierNote: pick(tier, 'Choose from the preset windows.', 'Windows down to half a minute.', 'Any window down to 0.01 min. The odometer still shows whole metres.'),
    hints: ['Each window captures a reading at ' + fm(anchor) + ' and another a little later, then divides.',
      'List your estimates from widest to narrowest window. Are they creeping in one direction?',
      tier === 'gold' ? 'The best estimate need not come from the very smallest window: compare the trend of moderate windows and think about the odometer’s 1-metre resolution.' : 'The value the estimates approach, but never quite reach, is the answer.'],
    discovery: 'Shrinking the interval turns an average into an instantaneous velocity: the limit of the averages. Real instruments limit how far you can push that — but the idea doesn’t depend on the instrument.',
    objectives: objs
  };
});

/* ---------- 004 · The Moving Secant ---------- */
defStage('004', 2, 'The Moving Secant', function (tier) {
  var model = pick(tier, 'm_accel', 'm_brake', 'm_sine');
  var t0 = pick(tier, 0.5, 0.5, 0.8);
  var hReq = hours(pick(tier, 1, 0.2, 0.05)), tol = pick(tier, 0.5, 0.15, 0.03);
  var m = MODELS[model];
  var side = function () { return m.acc(t0) > 0 ? 'above' : 'below'; };
  function sideSet(s, sign) { return distinctBy(secantsAt(s, 0).filter(function (e) { return sign > 0 ? e.h > 0 : e.h < 0; }), function (e) { return e.h; }); }
  function sideOK(s, sign, count) { var d = sideSet(s, sign); return d.length >= count && Math.min.apply(null, d.map(function (e) { return Math.abs(e.h); })) <= hReq + 1e-12; }
  var objs = [
    PREDICT('predict', 'Before you start: as Q slides in from the right toward P, the secant slopes will lie…', 10,
      [['above', 'Above the tangent’s slope, coming down to it'], ['below', 'Below the tangent’s slope, coming up to it'], ['equal', 'Exactly on the tangent’s slope all along']], side,
      function (s) { return viewer(s).secants.length >= 1; }, { explain: 'Locks after your first recorded secant.' }),
    AUTO('right', 'Record four secants with Q to the right of P, narrowing to Δt ≤ ' + fm(hReq) + '.', 20, function (s) { return sideOK(s, 1, 4); },
      function (s) { return sideSet(s, 1).length + ' recorded'; })
  ];
  var req = ['right'];
  if (tier !== 'bronze') {
    objs.push(AUTO('left', 'Record three secants with Q to the left of P, narrowing to |Δt| ≤ ' + fm(hReq) + '.', 15, function (s) { return sideOK(s, -1, 3); },
      function (s) { return sideSet(s, -1).length + ' recorded'; }));
    req = ['right', 'left'];
  }
  objs.push(NUM('tangent', 'Slope of the tangent at P', 30, { units: U_KMH, unitOptions: UNIT_OPTS_V, requires: req,
    expect: function () { return expectVal(m.v(t0), tol); },
    misc: function (s) { var e = viewer(s).secants; if (!e.length) return []; var w = e.reduce(function (p, q) { return Math.abs(q.h) > Math.abs(p.h) ? q : p; });
      return [{ value: w.slope, tol: 1e-6, msg: 'That is the slope of your widest secant. The tangent is where the narrowing secants are heading.' }]; } }));
  objs.push(CHOICE('meaning', 'The tangent’s slope on the position graph is the train’s…', 15, [
    ['vel', 'Velocity at that instant'], ['pos', 'Position at that instant'], ['avg', 'Average velocity over the whole trip'], ['acc', 'Acceleration']
  ], 'vel', { requires: ['tangent'] }));
  if (tier === 'gold') objs.push(CHOICE('sides', 'The left-hand and right-hand secant slopes…', 15, [
    ['same', 'Approach the same value from opposite sides'], ['diff', 'Approach two different values'], ['diverge', 'Grow without bound as Δt shrinks']
  ], 'same', { requires: ['tangent'] }));
  return {
    models: { main: model }, gauges: { speed: 'failed', odometer: 'ok', position: 'ok' },
    instruments: ['viewer'], primary: 'viewer',
    viewer: { model: 'main', instants: [{ t: t0, label: 'P at ' + fm(t0) }], hMin: hours(pick(tier, 0.5, 0.05, 0.005)), hInit: hours(20),
      presets: pick(tier, [20, 10, 5, 2, 1], [20, 5, 1, 0.2, -0.2, -1, -5], [20, 2, 0.2, 0.05, -0.05, -0.2, -2]) },
    story: 'In the observation car a pen recorder draws the train’s position against time on a long paper roll. A secant is a straight line through two points of that curve. Its slope is an average velocity.',
    task: 'Hold P fixed at ' + fm(t0) + '. Slide Q toward it and watch the secant line pivot.',
    tierNote: pick(tier, 'The train is accelerating.', 'The train is braking. Approach from both sides.', 'The train is easing over a crest. Both sides, finer steps.'),
    hints: ['Use the Δt controls (or drag Q) to move Q, then press Record secant.',
      'As Δt shrinks, look at the slope readout settling. Turn on the zoom to see the curve straighten near P.',
      'The line the secants approach just touches the curve at P: the tangent. Its slope is the instantaneous velocity.'],
    discovery: 'Zoom in on a smooth curve and it looks straight. The secants pivot into that straight line, the tangent, and its slope is the instantaneous velocity: the derivative.',
    objectives: objs
  };
});

/* ---------- 005 · The Engineer's Estimate ---------- */
defStage('005', 2, 'The Engineer’s Estimate', function (tier) {
  var model = pick(tier, 'm_accel', 'm_cubic', 'm_quartic');
  var ts = pick(tier, [0.25, 0.75, 1.25], [1 / 3, 1, 5 / 3], [0.3, 0.8, 1.6]);
  var hReq = hours(pick(tier, 0.5, 0.1, 0.02)), tol = pick(tier, 0.5, 0.2, 0.05);
  var m = MODELS[model];
  var objs = [];
  ts.forEach(function (t, i) {
    objs.push(NUM('v' + (i + 1), 'Velocity at instant ' + (i + 1) + ' (' + fm(t) + ')', 20, { units: U_KMH, unitOptions: UNIT_OPTS_V,
      expect: function (s) { if (!anyExists(secantsAt(s, i), function (e) { return Math.abs(e.h) <= hReq + 1e-12; })) return notReady('Record a secant at instant ' + (i + 1) + ' with |Δt| ≤ ' + fm(hReq) + ' first.'); return expectVal(m.v(t), tol); } }));
  });
  objs.push(CHOICE('approx', 'The viewer can now show the exact x′(t) from the model’s formula. Your recorded secant slopes are…', 15, [
    ['approx', 'Approximations: averages over tiny intervals, very close to but not exactly x′(t)'],
    ['exact', 'Exactly the instantaneous velocity, because Δt was small'],

/* ---------- 006 · The Corner in the Track ---------- */

    expect: function (s) { var r = readingAt(s, tq); if (!r) return notReady('Capture a gauge reading at ' + fm(tq) + ' first.'); return expectVal(r.vel, 0.1); },
    misc: function (s) { var r = readingAt(s, tq); return r && r.vel < 0 ? [{ value: -r.vel, tol: 0.1, msg: 'That is the speed. Velocity is signed: the train is moving backward, so its velocity is negative.' }] : []; } }));
  objs.push(AUTO('sum', 'Record a total over the whole journey within ' + dTol + ' km of the true displacement.', 15, function (s) {
    return !!anyExists(sumsOn(s, a, b), function (e) { return Math.abs(e.value - disp) <= dTol + 1e-12; }); }));
  objs.push(NUM('disp', 'Displacement over the whole journey (where it ends up relative to where it started)', 15, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['sum'],
    expect: function () { return expectVal(disp, dTol); }, misc: function () { return [{ value: dist, tol: dTol, msg: 'That is the total distance travelled. Displacement counts backward motion as negative.' }]; } }));
  objs.push(NUM('dist', 'Total distance travelled (what the odometer counts)', 15, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['disp'],
    expect: function () { return expectVal(dist, dTol); }, misc: function () { return [{ value: disp, tol: dTol, msg: 'That is the displacement. The odometer counts every kilometre, forward or back.' }]; } }));
  objs.push(CHOICE('odo', 'While the train reverses, the odometer…', 10, [

  return {

    accum: { model: 'main', fixed: null, methods: METHODS.slice(), nInit: 10, intervalInit: [a, b], presets: [1, 10, 50, 100, 500, 1000], showReference: 'after:disp' },
    story: 'At Gallow Junction the Express overshoots the points and must reverse into the siding. Now three instruments disagree: the velocity gauge’s REVERSE lamp glows, the position register counts down, and the odometer… keeps counting up.',
    task: 'Separate signed displacement from total distance travelled.',
    tierNote: pick(tier, 'One reversal.', 'One reversal on a longer run.', 'A shunting move: forward, back, forward again.'),
    hints: ['The turning point is where the velocity graph crosses zero.', 'Strips below the axis subtract: they are backward motion.',
      'Distance = area above the axis + area below it, both counted as positive. Odometer readings at the start and end give it directly.'],
    discovery: 'Integrating signed velocity gives displacement: backward motion cancels forward motion. Distance travelled integrates speed, |v|, and never decreases.',
    objectives: objs
  };
});

/* ---------- 012 · The Missing Starting Point ---------- */
defStage('012', 4, 'The Missing Starting Point', function (tier) {
  var model = pick(tier, 'm_accel_x', 'm_cubic_x', 'm_quartic_x');
  var m = MODELS[model];
  var T = pick(tier, 1, 1.5, 2), tRef = pick(tier, 0, 0, 0.5), xRef = roundTo(m.x(tRef), 3);
  var tol = pick(tier, 0.2, 0.1, 0.05);
  var refName = tier === 'gold' ? 'Wren Signal' : 'Kestrel Signal';
  var objs = [
    CHOICE('can', 'From the velocity record alone, can you say which kilometre post the train is at, at ' + fm(T) + '?', 10, [
      ['no', 'No. Velocity tells us how position changes, not where the train started.'],
      ['yes', 'Yes. Integrate the velocity and you get the position.']
    ], 'no', { feedback: { yes: 'Integrating velocity gives the change in position. Without a starting point, every vertical shift of the curve fits the same velocities.' } }),
    AUTO('family', 'Try at least three different starting positions in the reconstruction.', 15, function (s) { return distinctBy(s.inst.recon.tried, function (x) { return x; }).length >= 3; },
      function (s) { return distinctBy(s.inst.recon.tried, function (x) { return x; }).length + ' tried'; }),
    CHOICE('shift', 'Curves reconstructed from different starting positions…', 15, [
      ['shift', 'Are vertical shifts of one another, with identical slopes everywhere: the same velocity.'],
      ['cross', 'Cross each other somewhere.'], ['diff', 'Have different velocities.']
    ], 'shift', { requires: ['family'] }),
    NUM('dx', 'Change in position from ' + fm(tRef) + ' to ' + fm(T), 20, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['shift'],
      expect: function () { return expectVal(m.x(T) - m.x(tRef), tol); } }),
    AUTO('placed', 'Anchor the reconstruction so that it passes through the signal report.', 10, function (s) {
      var x0 = s.inst.recon.x0; return isNum(x0) && Math.abs(x0 + (m.x(tRef) - m.x(0)) - xRef) <= 0.01; }),
    NUM('xT', 'Position (km post) at ' + fm(T), 20, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['dx', 'placed'],
      expect: function () { return expectVal(xRef + (m.x(T) - m.x(tRef)), tol); },
      misc: function () { return [{ value: m.x(T) - m.x(tRef), tol: tol, msg: 'That is only the change in position. Add the starting position from the signal report.' }]; } })
  ];
  if (tier === 'gold') objs.push(NUM('x0', 'Position (km post) at departure, 0 min', 15, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['xT'],
    expect: function () { return expectVal(xRef - (m.x(tRef) - m.x(0)), tol); },
    misc: function () { return [{ value: xRef + (m.x(tRef) - m.x(0)), tol: tol, msg: 'Going back in time, subtract the distance covered between 0 and 30 min. Don’t add it.' }]; } }));
  return {

    recon: { model: 'main', tRef: tRef, xRef: xRef, refName: refName, x0Init: 0, T: T },
    accum: { model: 'main', fixed: null, methods: METHODS.slice(), nInit: 10, intervalInit: [tRef, T], presets: [1, 10, 100, 500, 1000], showReference: 'after:dx' },
    story: 'Both position instruments are dark. The velocity record is intact, but the dispatcher at Meridian needs a kilometre post, not a speed. Then a telegraph arrives: “Express passed ' + refName + ' at km ' + xRef.toFixed(3) + ' at ' + fm(tRef) + '.”',
    task: 'Reconstruct the train’s actual position curve from velocity plus one known position.',
    tierNote: pick(tier, 'The report gives the position at departure.', 'The report gives the position at departure; the climb is curved.', 'The report is from part-way through, at 30 min. Reconstruct both forward and backward.'),
    hints: ['Change the starting position slider: watch the whole curve move up and down without changing shape.',
      'The accumulation bench gives the change in position over any interval.',
      'Position at time T = known position + change in position between the known time and T.'],
    discovery: 'Integrating velocity recovers position only up to a constant. One known position, an initial condition, pins down the whole curve.',
    objectives: objs
  };
});

/* ---------- 013 · The Instruments Agree ---------- */

  var objs = [
    AUTO('dcheck', 'At two different instants, record a secant whose slope matches the velocity gauge within ' + dTol + ' km/h.', 20, function (s) {
      var good = viewer(s).secants.filter(function (e) { return Math.abs(e.slope - m.v(ts[e.inst])) <= dTol; });
      return distinctBy(good, function (e) { return e.inst; }).length >= 2; },
      function (s) { return distinctBy(viewer(s).secants.filter(function (e) { return Math.abs(e.slope - m.v(ts[e.inst])) <= dTol; }), function (e) { return e.inst; }).length + ' of 2 instants'; }),
    AUTO('icheck', 'Over an interval of at least 30 min, record a strip total that matches the position register’s change within ' + iTol + ' km.', 20, function (s) {
      return !!anyExists(accum(s).sums, function (e) { return e.b - e.a >= 0.5 - 1e-12 && Math.abs(e.value - (m.x(e.b) - m.x(e.a))) <= iTol; }); }),
    CHOICE('ftc1', 'The slope of the position graph at any instant equals…', 15, [
      ['vel', 'The velocity gauge reading at that instant.'], ['pos', 'The position reading at that instant.'], ['area', 'The area under the velocity graph up to that instant.']
    ], 'vel', { requires: ['dcheck'] }),
    CHOICE('ftc2', 'The area under the velocity graph from a to b equals…', 15, [
      ['diff', 'x(b) − x(a): the change in position.'], ['xb', 'x(b): the position at b.'], ['odo', 'The odometer reading at b.']
    ], 'diff', { requires: ['icheck'] })
  ];
  if (tier === 'gold') {
    objs.push(AUTO('acheck', 'Record the slope of the accumulation function A(t) = ∫ v from 0, at an instant, with |Δt| ≤ 0.1 min; it should match v there.', 15, function (s) {
      return !!anyExists(viewer(s).accSlopes, function (e) { return Math.abs(e.h) <= hours(0.1) + 1e-12 && Math.abs(e.value - m.v(e.t)) <= 0.05; }); }));
    objs.push(CHOICE('assume', 'The rule “the rate of change of accumulated velocity is the velocity” is guaranteed at an instant when…', 15, [
      ['cont', 'The velocity is continuous at that instant.'], ['pos', 'The velocity is positive.'], ['const', 'The velocity is constant.']
    ], 'cont', { requires: ['acheck'] }));
  }
  return {
    models: { main: model }, gauges: { speed: 'ok', odometer: 'ok', position: 'ok' },
    instruments: ['viewer', 'accum'], primary: 'dual',
    viewer: { model: 'main', instants: ts.map(function (t, i) { return { t: t, label: 'Instant ' + (i + 1) + ' · ' + fm(t) }; }), hMin: hours(0.005), hInit: hours(5),
      presets: [5, 1, 0.1, 0.02, -0.02, -1], accumSlope: tier === 'gold', dual: true },
    accum: { model: 'main', fixed: null, methods: METHODS.slice(), nInit: 10, intervalInit: [ts[0], ts[2]], presets: [1, 10, 50, 100, 500, 1000], dual: true },
    story: 'Repairs at Hollin depot. For the first time tonight, every instrument works at once. The chief engineer wants proof that they agree.',
    task: 'Check both directions: the slope of position against the velocity gauge, and the area under velocity against the change in position.',
    tierNote: pick(tier, 'Generous tolerances.', 'Tighter tolerances.', 'Tight tolerances, and the accumulation function itself.'),
    hints: ['In the dual view, the selected instant is marked on both graphs.', 'Shrink Δt until the secant slope matches the gauge needle.',
      'Pick an interval at least 30 minutes long and refine the strips until the total matches the register’s change.'],
    discovery: 'Differentiate position and you get velocity. Accumulate velocity and you get the change in position. The two gauges are inverse views of one motion.',
    objectives: objs
  };
});

/* ---------- 014 · The Mountain Passage ---------- */

    CHOICE('flat', 'During the stop, the position graph is…', 10, [

    ], 'flat', { requires: ['stopEnd'] }),

    AUTO('trip', 'Record a whole-journey total within ' + sTol + ' km of the true displacement' + (tier === 'gold' ? ', using no more than ' + nCap + ' strips.' : '.'), 20, function (s) {
      return !!anyExists(sumsOn(s, a, b), function (e) { return e.n <= nCap && Math.abs(e.value - ex) <= sTol + 1e-12; }); }),
    NUM('tripv', 'Total displacement over the passage', 20, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['trip'], expect: function () { return expectVal(ex, sTol); } })
  ];
  if (tier === 'gold') objs.push(CHOICE('why', 'Why can’t the left-endpoint sum meet this tolerance within 80 strips?', 10, [

  ], 'order', { requires: ['tripv'] }));
  return {

    accum: { model: 'main', fixed: null, methods: METHODS.slice(), nInit: 8, intervalInit: [a, b], presets: [1, 8, 16, 40, 80, 200, 1000], showReference: 'after:tripv', dual: true },
    story: 'The climb to Kestrel Gorge: away from the platform, a long cruise, a careful brake, a red signal' + (tier === 'bronze' ? '.' : ', and away again over the summit.') + ' The record must be reconstructed segment by segment, and every number checked against every other.',

/* ---------- 015 · The Two Gauges ---------- */
defStage('015', 5, 'The Two Gauges', function (tier) {
  var m = MODELS.m_final;
  var times = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5];
  var bad = pick(tier, 2, 3, 1);                 // zero-based row index of the faulty entry
  var rows = times.map(function (t, i) {
    var r = { id: 'r' + (i + 1), t: t, x: readPosition(m, t), v: readVelocity(m, t) };
    if (i === bad) { if (tier === 'gold') r.x = roundTo(r.x + 0.6, 3); else r.v = roundTo(r.v + pick(tier, 15, 6, 0), 1); }
    return r;
  });
  var tq = 0.9, hReq = hours(pick(tier, 0.5, 0.2, 0.05)), vTol = pick(tier, 0.3, 0.15, 0.05), iTol = pick(tier, 0.2, 0.1, 0.02);
  var iv = [0.25, 1.25];
  var knotTimes = [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5];
  var target = pick(tier, 60, 65, 55), limit = 80, dTarget = pick(tier, 1, 0.5, 0.25);
  var instants = times.map(function (t, i) { return { t: t, label: 'Log ' + (i + 1) + ' · ' + fm(t) }; }).concat([{ t: tq, label: 'Check · ' + fm(tq) }]);
  var objs = [];
  if (tier === 'gold') {
    objs.push(AUTO('investigate', 'Integrate the velocity trace over at least three consecutive logbook intervals (n ≥ 20).', 10, function (s) {
      var c = 0; for (var i = 0; i < times.length; i++) { var a0 = i === 0 ? 0 : times[i - 1]; if (anyExists(sumsOn(s, a0, times[i]), function (e) { return e.n >= 20; })) c++; } return c >= 3; }));
  } else {
    objs.push(AUTO('investigate', 'Check the position trace’s slope at three or more logbook times (|Δt| ≤ ' + fm(hReq) + ').', 10, function (s) {
      var good = viewer(s).secants.filter(function (e) { return e.inst < times.length && Math.abs(e.h) <= hReq + 1e-12; });
      return distinctBy(good, function (e) { return e.inst; }).length >= 3; }));
  }
  objs.push(CHOICE('faulty', 'Which logbook entry is inconsistent with the instruments?', 20, rows.map(function (r, i) { return [r.id, 'Entry ' + (i + 1) + ' (' + fm(r.t) + ')']; }), rows[bad].id, { requires: ['investigate'] }));
  objs.push(NUM('vfromx', 'From the position trace alone: velocity at ' + fm(tq), 15, { units: U_KMH, unitOptions: UNIT_OPTS_V, requires: ['faulty'],
    expect: function (s) { if (!anyExists(secantsAt(s, times.length), function (e) { return Math.abs(e.h) <= hReq + 1e-12; })) return notReady('Record a secant at ' + fm(tq) + ' with |Δt| ≤ ' + fm(hReq) + '.'); return expectVal(m.v(tq), vTol); } }));
  objs.push(NUM('dxfromv', 'From the velocity trace alone: displacement from ' + fm(iv[0]) + ' to ' + fm(iv[1]), 15, { units: U_KM, unitOptions: UNIT_OPTS_X, requires: ['vfromx'],
    expect: function (s) { if (!sumsOn(s, iv[0], iv[1]).length) return notReady('Record a strip total over ' + fm(iv[0]) + ' – ' + fm(iv[1]) + '.'); return expectVal(m.x(iv[1]) - m.x(iv[0]), iTol); } }));
  objs.push(DESIGN('run', 'Design the final run to Meridian Terminus: ' + target + ' km in 90 min, starting and ending at rest, never above ' + limit + ' km/h' +
    (tier === 'gold' ? ', at most 40 km/h through Gallow Tunnel (45–60 min), and never reversing.' : '.'), 20, function (s) {
    var k = s.inst.design.knots, dm = designModel(knotTimes, k), disp = dm.x(1.5) - dm.x(0), probs = [];
    if (Math.abs(disp - target) > dTarget + 1e-12) probs.push('The run covers ' + roundTo(disp, 2) + ' km; Meridian is ' + target + ' km away (±' + dTarget + ').');
    if (k[k.length - 1] !== 0) probs.push('The train must be at rest (0 km/h) on arrival at 90 min.');
    if (Math.max.apply(null, k) > limit) probs.push('The speed limit is ' + limit + ' km/h.');
    if (tier === 'gold') { if (k[3] > 40 || k[4] > 40) probs.push('Gallow Tunnel (45–60 min) is restricted to 40 km/h.'); if (Math.min.apply(null, k) < 0) probs.push('The final run may not reverse.'); }
    return { ok: probs.length === 0, problems: probs, displacement: disp };
  }, { requires: ['dxfromv'] }));
  objs.push(CHOICE('both', 'Which statement captures both gauges?', 10, [
    ['both', 'Velocity is the rate of change of position, and the change in position is the accumulated velocity.'],
    ['same', 'The two gauges measure the same thing in different units.'],
    ['one', 'Only the odometer is fundamental; velocity is an estimate.']
  ], 'both', { requires: ['run'] }));
  if (tier !== 'bronze') objs.push(CHOICE('constant', 'To place the reconstructed train on the map at a kilometre post, you also need…', 5, [
    ['start', 'One known position: an initial condition.'], ['accel', 'The acceleration.'], ['nothing', 'Nothing more.']
  ], 'start', { requires: ['both'] }));
  if (tier === 'gold') objs.push(CHOICE('jump', 'In Stage 6’s timetable model the velocity jumps from 80 to 30 km/h at 60 min. There, the accumulated distance…', 10, [
    ['corner', 'Is continuous but has no derivative: its one-sided slopes are 80 and 30.'],
    ['broken', 'Jumps, because the velocity jumps.'], ['fine', 'Still has derivative v(60 min), as the rule always holds.']
  ], 'corner', { requires: ['constant'] }));
  return {
    models: { main: 'm_final' }, gauges: { speed: 'ok', odometer: 'ok', position: 'ok' },
    instruments: ['logbook', 'viewer', 'accum', 'design'], primary: 'dual',
    logbook: { rows: rows, kind: tier === 'gold' ? 'position' : 'velocity' },
    viewer: { model: 'main', instants: instants, hMin: hours(0.005), hInit: hours(2), presets: [2, 0.5, 0.2, 0.05, -0.05, -0.5], dual: true },
    accum: { model: 'main', fixed: null, methods: METHODS.slice(), nInit: 20, intervalInit: [0, 0.25], presets: [1, 10, 20, 100, 500], dual: true, logTimes: [0].concat(times) },
    design: { knotTimes: knotTimes, init: [0, 30, 30, 30, 30, 30, 30], lo: -30, hi: 140, target: target, limit: limit, tunnel: tier === 'gold' ? [0.75, 1.0] : null },
    story: 'The final carriage: brass and lamplight, both gauges working side by side, and a logbook with a lie in it. Beyond the summit lies Meridian Terminus. Bring the Express home.',
    task: 'Expose the faulty entry, rebuild each quantity from the other, then design the last run, watching one graph become the slope of the other.',
    tierNote: pick(tier, 'One logged speed is wrong. Check it against the slope of the position trace.', 'A smaller error hides in one logged speed.', 'A logged position is wrong. Find it by integrating the velocity trace between entries.'),
    hints: ['Compare each logbook entry with what the traces say at that time.',
      tier === 'gold' ? 'Between consecutive entries, the change in logged position should equal the area under the velocity trace. The bad row spoils both intervals it touches.' : 'The slope of the position trace at a logged time should match the logged speed.',
      'For the final run, the area under your velocity profile is the distance covered. Raise or lower the knots until it reaches the target.'],
    discovery: 'One gauge is the slope of the other; the other is the accumulation of the first. That two-way relationship is the Fundamental Theorem of Calculus.',
    objectives: objs
  };
});

/* ======================================================================
   STAGE CONFIGURATION, STATE, ACTIONS, SCORING
   ====================================================================== */
var CONFIG_CACHE = {};
var HINT_COST = { bronze: 0, silver: 2, gold: 4 };
var ACTION_FIELDS = {
  setTime: ['t'], capture: [], selectPair: ['a', 'b'], calcAvg: [], captureWindow: ['w'],
  setInstant: ['i'], setH: ['h'], recordSecant: [], recordAccumSlope: [],
  setInterval: ['a', 'b'], setMethod: ['method'], setN: ['n'], inspect: ['i'], recordSum: [],
  setX0: ['x0'], setKnot: ['i', 'v'], check: ['obj', 'value', 'unit'], hint: [], submit: []
};

function stageIds() { return STAGE_LIST.map(function (s) { return s.id; }); }
function getConfig(stage, tier) {
  if (!BUILDERS[stage]) return null;
  if (TIERS.indexOf(tier) < 0) return null;
  var key = stage + ':' + tier;
  if (CONFIG_CACHE[key]) return CONFIG_CACHE[key];
  var cfg = BUILDERS[stage](tier);
  var meta = STAGE_LIST.filter(function (s) { return s.id === stage; })[0];
  cfg.id = stage; cfg.tier = tier; cfg.title = meta.title; cfg.chapter = meta.chapter;
  cfg.chapterTitle = CHAPTERS[meta.chapter - 1].title;
  cfg.hintCost = HINT_COST[tier];
  var allowed = ['check', 'hint', 'submit'];
  var ins = cfg.instruments;
  if (ins.indexOf('bench') >= 0) {
    allowed.push('setTime');
    if (cfg.bench.mode === 'window') allowed.push('captureWindow');
    else { allowed.push('capture', 'selectPair'); if (cfg.bench.mode === 'auto') allowed.push('calcAvg'); }
  }
  if (ins.indexOf('viewer') >= 0) { allowed.push('setInstant', 'setH', 'recordSecant'); if (cfg.viewer.accumSlope) allowed.push('recordAccumSlope'); }
  if (ins.indexOf('accum') >= 0) {

function helpScreen() {
  return '<main class="wrap"><h1 tabindex="-1">Help, notation and assumptions</h1>' +
    '<div class="card"><h2>Controls</h2><ul><li>Every control is an ordinary button, field or slider. You can play everything with a keyboard (Tab, Shift+Tab, Enter, Space, arrow keys on sliders), with touch or with a mouse.</li>' +

    '<li>Answers: type a number, choose its unit, and press <b>Check</b>. Formatting does not matter: <span class="mono">18</span>, <span class="mono">18.000</span> and <span class="mono">18,0</span> are all accepted. Equivalent units are converted for you (minutes or hours, km/h or km/min or m/s).</li></ul></div>' +
    '<div class="card"><h2>Scoring</h2><ul><li>Each objective carries points. A correct answer on the first try earns full points, and each wrong attempt removes 20% (to a floor of 40%). A correct prediction earns full points; a wrong one earns 40%, since predicting is part of the work.</li>' +
    '<li>Hints are free at Bronze and cost 2 points (Silver) or 4 points (Gold) each.</li><li>Grades: Distinction ◆◆◆ (90+), Merit ◆◆ (75+), Pass ◆ (all required objectives complete). Speed never affects your score.</li>' +
    '<li>Tolerances are stated per question and scale with the tier. The engine compares your answer with values computed from the active motion function, or from your own recorded measurements where the question is about them.</li></ul></div>' +

    '<li><b>Velocity gauge:</b> signed velocity (km/h) to 0.1 km/h, with FWD/REV lamps. Its magnitude is the speed.</li><li><b>Pen recorder (tangent viewer):</b> the exact position trace. Secant slopes are computed from it in full precision.</li><li>Time is in hours inside the engine; the screen shows minutes. A strip contributes km/h × h = km.</li></ul></div>' +
    '<div class="card"><h2>Model assumptions</h2><ul><li>All journeys are deterministic mathematical models: polynomials, sinusoids and piecewise combinations of them. They are teaching models, not a physical simulation. Friction, gradients and traction are not modelled.</li>' +

    '<div class="card"><h2>Accessibility</h2><p>Settings include high contrast, larger text, reduced motion (respecting your system preference by default) and optional sound (off by default). Colour is never the only signal: right-hand and left-hand secants use different marker shapes, and negative strips are hatched as well as coloured.</p></div>' +

}

function replayUI(rec) {
  var prevTest = S.testMode; S.testMode = true;
  try {
    startStage(rec.stage, rec.tier, { fresh: true, silent: true });
    for (var i = 0; i < rec.actions.length; i++) { var r = dispatch(rec.actions[i]); if (!r.ok) return { ok: false, error: 'action ' + i + ': ' + r.error }; }
    var ses = S.session, ev = E.evaluate(ses.state), hash = E.hashState(ses.state);
    var ok = ses.state.submitted && ev.score === rec.expect.score && hash === rec.expect.hash && ses.state.tick === rec.expect.tick;
    return { ok: ok, score: ev.score, hash: hash, error: ok ? '' : 'mismatch' };
  } finally { S.testMode = prevTest; }
}

/* ---------- stage session ---------- */
function defaultTab(cfg) { return cfg.instruments[0]; }
function startStage(stage, tier, opts) {
  opts = opts || {};
  stopAnim();
  var cfg = E.stages.config(stage, tier), st = E.initState(stage, tier), actions = [], key = stage + ':' + tier, msg = '';
  if (!opts.fresh && !S.testMode && Store.data.saves[key]) {
    var r = E.replay(stage, tier, Store.data.saves[key].actions);
    if (r.ok && !r.state.submitted) { st = r.state; actions = Store.data.saves[key].actions.slice(); msg = 'Resumed your saved progress.'; }
    else { delete Store.data.saves[key]; Store.save(); msg = 'Saved progress for this stage could not be restored and was discarded.'; }
  }
  if (opts.fresh && !S.testMode) { delete Store.data.saves[key]; Store.save(); }
  S.session = { stage: stage, tier: tier, cfg: cfg, state: st, actions: actions,
    ui: { tab: defaultTab(cfg), geom: true, zoom: !!(cfg.bench && cfg.bench.mode === 'window'), drafts: {}, feedback: {}, feed: msg ? [{ m: msg, k: '' }] : [], windowDraft: '', newKeys: [], cursor: 0.75, play: null } };
  S.screen = 'stage';
  if (!opts.silent) { render(); window.scrollTo(0, 0); var h = $('#stage-title'); if (h) h.focus({ preventScroll: true }); }
  else render();
}
function pushFeed(m, k) { var f = S.session.ui.feed; f.unshift({ m: m, k: k || '' }); if (f.length > 8) f.length = 8; }
function dispatch(action) {
  var ses = S.session; if (!ses) return { ok: false, error: 'No stage loaded.' };
  var r = E.apply(ses.state, action);
  if (!r.ok) { pushFeed(r.error, 'err'); if (!S.testMode) { announce(r.error); UI.sound('bad'); } renderStageParts(); return r; }
  ses.state = r.state; ses.actions.push(action);
  var good = r.value && r.value.correct === true, bad = r.value && r.value.correct === false;
  if (action.type === 'check' && good && r.value.reference !== undefined) {
    var oc = ses.cfg.objIndex[action.obj], cu = Object.keys(oc.units)[0];
    r = { ok: true, state: r.state, value: r.value, message: 'Accepted. Reference value: ' + fmt(r.value.reference, oc.integer ? 0 : 4) + (cu ? ' ' + cu : '') + '.' };
  }
  if (action.type === 'check') ses.ui.feedback[action.obj] = { msg: r.message, good: good, bad: bad };
  if (action.type === 'hint') pushFeed('Hint: ' + r.value, '');
  else if (r.message) pushFeed(r.message, good ? 'good' : bad ? 'err' : '');
  if (!S.testMode) {
    if (action.type === 'capture' || action.type === 'recordSecant' || action.type === 'recordSum' || action.type === 'captureWindow' || action.type === 'calcAvg') UI.sound('tick');
    if (good) UI.sound('good'); if (bad) UI.sound('bad');
    if (r.message) announce(r.message);
    var keys = awardKeys(ses);
    if (ses.state.submitted) keys = keys.concat(recordResult(ses));
    else Store.data.saves[ses.stage + ':' + ses.tier] = { actions: ses.actions.slice() };
    ses.ui.newKeys = ses.ui.newKeys.concat(keys);
    Store.save();
  }
  renderStageParts();
  if (action.type === 'submit' && !S.testMode) { var c = $('#complete h2'); if (c) { c.setAttribute('tabindex', '-1'); c.focus(); } }
  return r;
}
UI.dispatch = dispatch;

      if (p[0] !== null && p[1] !== null) dispatch({ type: 'selectPair', a: p[0], b: p[1] }); break; }
    case 'hval': v = num(el.value); if (v === null) { pushFeed('Enter Δt as a number of minutes.', 'err'); renderStageParts(); } else dispatch({ type: 'setH', h: v / 60 }); break;
    case 'ia': case 'ib': { v = num(el.value); var A = ses.state.inst.accum; if (v === null) { pushFeed('Enter the time in minutes.', 'err'); renderStageParts(); break; }
      if (k === 'ia') dispatch({ type: 'setInterval', a: v / 60, b: ses.cfg.accum.maxLen ? Math.min(mainModel().domain[1], v / 60 + (A.b - A.a)) : A.b }); else dispatch({ type: 'setInterval', a: A.a, b: v / 60 }); break; }
    case 'method': dispatch({ type: 'setMethod', method: el.value }); break;
    case 'nval': v = num(el.value); if (v === null) { pushFeed('Enter a whole number of strips.', 'err'); renderStageParts(); } else dispatch({ type: 'setN', n: v }); break;
    case 'x0val': v = num(el.value); if (v === null) { pushFeed('Enter a position in km.', 'err'); renderStageParts(); } else dispatch({ type: 'setX0', x0: v }); break;
    case 'knot': v = num(el.value); if (v === null) { pushFeed('Enter a velocity in km/h.', 'err'); renderStageParts(); } else dispatch({ type: 'setKnot', i: Number(el.getAttribute('data-i')), v: v }); break;
    case 'unit': { var o = el.getAttribute('data-obj'); (ses.ui.drafts[o] = ses.ui.drafts[o] || {}).u = el.value; break; }
    case 'opt': { var o2 = el.getAttribute('data-obj'); (ses.ui.drafts[o2] = ses.ui.drafts[o2] || {}).v = el.value; break; }
  }
});
root.addEventListener('keydown', function (ev) {
  var el = ev.target; if (ev.key !== 'Enter' || !el.getAttribute) return;
  if (el.getAttribute('data-input') === 'ans') { ev.preventDefault(); doCheck(el.getAttribute('data-obj')); }
  else if (el.getAttribute('data-input') === 'win') { ev.preventDefault(); var w = num(el.value); if (w !== null) dispatch({ type: 'captureWindow', w: w / 60 }); }
});
document.getElementById('dlg').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-dlg]'); if (!b) return; var a = b.getAttribute('data-dlg');
  if (a === 'save-settings') {
    var st = Store.data.settings; st.contrast = $('#set-contrast').checked; st.text = Number($('#set-text').value); st.motion = $('#set-motion').value; st.sound = $('#set-sound').checked;
    Store.save(); closeDialog(); render();
  } else if (a === 'do-reset') { Store.reset(); closeDialog(); go('map'); announce('All progress erased.'); }
  else if (a === 'do-restart') { closeDialog(); startStage(S.session.stage, S.session.tier, { fresh: true }); }
  else closeDialog();
});

function runUIReplay() {
  var keepScreen = S.screen, keepSession = S.session, rows = [], passed = 0;
  E.recordings.forEach(function (rec) { var r = replayUI(rec); rows.push({ stage: rec.stage, tier: rec.tier, ok: r.ok, score: r.score, hash: r.hash, error: r.error }); if (r.ok) passed++; });
  S.session = keepSession; S.screen = keepScreen === 'stage' && !keepSession ? 'validation' : 'validation';
  VAL.ui = { passed: passed, total: rows.length, rows: rows }; render();
  return VAL.ui;
}

/* ---------- test hooks (documented; they use the same dispatch path as the buttons) ---------- */
UI.test = { replayUI: replayUI, runUIReplay: runUIReplay, startStage: startStage, dispatch: function (a) { return dispatch(a); }, session: function () { return S.session; }, go: go, render: render };

/* ---------- boot ---------- */
Store.load(); applySettings(); render();
})();

</script>
