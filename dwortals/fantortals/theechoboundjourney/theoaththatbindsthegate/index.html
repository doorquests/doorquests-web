  var OBSERVATIONS = {

  };

  var KNOWLEDGE_LABELS = {
    camp_surveyed: 'Who waits outside: 9 families (28 people), 4 unarmed travelers, 2 armed drovers',
    refused_at_gate: 'The runes pushed back the refugees at the wicket',
    oath_literal: 'The oath counts only the walls and those within as "the citadel"',
    authority_terms: 'Ysolde\'s offer: temporary authority to clarify, never to erase',
    postern_known: 'The postern exists in the north wall',
    armory_link: 'The postern opens onto the armory passage',
    stair_warned: 'Someone warned you that the stair to the lower ward is cracking',
    stair_inspected: 'You inspected the stair yourself and marked the weak steps',
    defenders_known: 'Twelve defenders on the walls, exhausted',
    main_gate_hold: 'The main gate will not be opened with the enemy this close',
    shelter_cap: 'The shelter yard holds thirty',
    stores_thin: 'Kitchen stores are thin',
    side_known: 'An old cistern side passage exists; bracing costs 3 loads and needs escorts',

    runes_read: 'You read the oath on the lintel yourself',

    embers_bought: 'Messenger\'s report: someone is buying up the last living embers of the realm',
    kitchen_emergency: 'Kitchen stores and exhausted defenders are the next emergency'
  };

  // ---------- Grammar evaluation (shared by preview and commit) ----------
  function clauseStatus(clauses, know, pressure) {
    // Returns {valid, complete, reasons:[codes]} from grammar + state-dependent gating
    var r = [];
    var s = clauses && clauses.s, rt = clauses && clauses.r, c = clauses && clauses.c;
    var complete = !!(s && rt && c);
    if (s && DIMS.shelter.indexOf(s) < 0) r.push('INCOMPLETE');
    if (rt && DIMS.route.indexOf(rt) < 0) r.push('INCOMPLETE');
    if (c && DIMS.condition.indexOf(c) < 0) r.push('INCOMPLETE');
    if (!complete) r.push('INCOMPLETE');
    if (s === 'S0' && (rt === 'R1' || rt === 'R2')) r.push('S0_OPEN');
    if ((s === 'S1' || s === 'S2') && rt === 'R0') r.push('SHELTER_NO_DOOR');
    if (s === 'S0' && (c === 'C1' || c === 'C2')) r.push('S0_CONDITION');
    if (s === 'S2' && (c === 'C0' || c === 'C2')) r.push('SEARCH_NEEDS_ESCORT');
    if (rt === 'R2' && (c === 'C0' || c === 'C2')) r.push('SIDE_NEEDS_ESCORT');
    if (know) {
      if (rt === 'R1' && !know.postern_known) r.push('UNKNOWN_POSTERN');
      if (rt === 'R2' && !know.side_known) r.push('UNKNOWN_SIDE');
    }
    if (typeof pressure === 'number' && c === 'C2' && pressure > 9) r.push('HORN_TOO_LATE');
    var uniq = [];
    r.forEach(function (x) { if (uniq.indexOf(x) < 0) uniq.push(x); });
    return { valid: uniq.length === 0, complete: complete, reasons: uniq };
  }

  function grammarValid(s, r, c) { return clauseStatus({ s: s, r: r, c: c }, null, null).valid; }

  function vowText(clauses) {
    var parts = [OATH_TEXT];
    if (clauses.s) parts.push(CLAUSES[clauses.s].text);
    if (clauses.r) parts.push(CLAUSES[clauses.r].text);
    if (clauses.c) parts.push(CLAUSES[clauses.c].text);
    return parts.join(' ');
  }

  function flexibility(cl) {
    var f = cl.s === 'S2' ? 2 : cl.s === 'S1' ? 1 : 0;
    if (cl.r !== 'R0') f += 1;
    if (cl.r !== 'R0' && cl.c === 'C0') f += 1;
    return f;
  }

  // Policy evaluator (single authority for previews, enactment and the schematic).
  // Given a clause set and the pressure at which enactment begins, returns the intended routes, the ordered
  // staged events of the enactment, admissions, and the physical/armory/escort state at the end of the enactment
  // (including a horn closure caused by the enactment's own ticks).
  var DOOR_INTENT = {
    R1C0: 'open, unescorted', R1C1: 'open under escort, then closed behind the last entrant', R1C2: 'open until the horn of closing',
    R2C1: 'open under escort, then closed behind the last entrant'
  };
  var ARMORY_HIST = {
    C0: { exposure: 'high', controlDuringAdmission: 'lost (no one guarding the passage)', lossIfOpened: ['one crate of arrows', 'two spears'] },
    C1: { exposure: 'low', controlDuringAdmission: 'shared with the escorts', lossIfOpened: [] },
    C2: { exposure: 'moderate', controlDuringAdmission: 'lost while the postern is open', lossIfOpened: ['one crate of arrows'] }
  };
  var CLOSED_C1 = 'closed behind the last entrant (C1)';
  var CLOSED_HORN = 'closed by the horn of closing (C2)';
  var OPEN_UNTIL_HORN = 'open until the horn of closing (C2)';
  var OPEN_C0 = 'open, unescorted (C0)';
  var NEVER_OPENED = 'barred; never opened (the horn sounded first)';
  var ARMORY_OPEN_C0 = { access: 'open passage past the racks', control: 'lost: the postern is still open and unguarded' };
  var ARMORY_OPEN_C2 = { access: 'open passage until the horn', control: 'lost while the postern stays open' };
  var ARMORY_RESTORED_C1 = { access: 'watch only', control: 'retained (restored after the escorts closed the postern)' };
  var ARMORY_RESTORED_HORN = { access: 'watch only', control: 'retained (restored after the horn closed the postern)' };
  var ARMORY_UNTOUCHED = { access: 'watch only', control: 'retained' };

  function evaluatePolicy(cl, pressureAtEnact) {
    var st = clauseStatus(cl, null, null);
    if (!st.valid) return { valid: false, reasons: st.reasons };
    var p0 = pressureAtEnact;
    var policy = cl.r === 'R0' ? 'strict' : cl.r === 'R1' ? 'postern' : 'side';
    var door = cl.r === 'R1' ? 'postern' : cl.r === 'R2' ? 'side' : null;
    var ev = {
      valid: true, policy: policy, door: door, clauses: { s: cl.s, r: cl.r, c: cl.c }, text: vowText(cl), flexibility: flexibility(cl),
      groups: { families: cl.s !== 'S0', travelers: cl.s === 'S2', drovers: false },
      intendedRoutes: { main: 'barred', postern: 'barred', side: 'closed' },
      escortsPlanned: (cl.c === 'C1' && door) ? 2 : 0, repair: { side: cl.r === 'R2' ? 3 : 0 },
      enactTicks: cl.r === 'R0' ? 1 : cl.r === 'R1' ? 2 : 3, hornLimited: cl.c === 'C2'
    };
    if (door) ev.intendedRoutes[door] = DOOR_INTENT[cl.r + cl.c];
    // Eligibility under the exact wording (independent of time)
    ev.eligiblePeople = (ev.groups.families ? FAMILY_PEOPLE : 0) + (ev.groups.travelers ? UNARMED_TRAVELERS : 0);
    ev.ineligiblePeople = OUTSIDE_TOTAL - ev.eligiblePeople;
    // Admissions (unchanged R1 rule)
    var fam = 0;
    if (ev.groups.families) {
      fam = FAMILIES.length;
      if (cl.c === 'C2') { if (p0 >= PRESSURE_CAP) fam = 0; else if (p0 === PRESSURE_CAP - 1) fam = HORN_PARTIAL_FAMILIES; }
    }
    var famPeople = 0;
    for (var i = 0; i < fam; i++) famPeople += FAMILIES[i].size;
    ev.admittedFamilies = fam;
    ev.travelersAdmitted = ev.groups.travelers ? UNARMED_TRAVELERS : 0;
    ev.admittedPeople = famPeople + ev.travelersAdmitted;
    ev.eligibleLeftOutside = ev.eligiblePeople - ev.admittedPeople;
    ev.excludedPeople = OUTSIDE_TOTAL - ev.admittedPeople;
    ev.lapsed = policy === 'postern' && ev.admittedPeople === 0;
    ev.opened = !!door && ev.admittedPeople > 0;
    ev.outcome = ev.lapsed ? 'postern_lapsed' : policy;
    ev.shelterOverflow = Math.max(0, ev.admittedPeople - SHELTER_CAP);
    // Staged events within the enactment action, in order (pressure is applied afterwards)
    var events = [];
    var routes = { main: 'barred', postern: 'barred', side: 'closed' };
    if (policy === 'strict') events.push({ kind: 'bars-confirmed', door: 'all', cause: 'R0: the main gate is held barred and no other door is opened' });
    else if (ev.lapsed) { events.push({ kind: 'not-opened', door: 'postern', cause: 'C2: the horn of closing had already sounded before the bar could be lifted' }); routes.postern = NEVER_OPENED; }
    else {
      if (ev.escortsPlanned) events.push({ kind: 'escort-assigned', door: door, count: 2 });
      if (door === 'side') events.push({ kind: 'braced', door: 'side', cause: 'Corrib\'s crew braces the cistern arch (3 loads of timber)' });
      events.push({ kind: 'opened', door: door });
      events.push({ kind: 'admitted', door: door, people: ev.admittedPeople, families: ev.admittedFamilies, travelers: ev.travelersAdmitted });
      if (cl.c === 'C1') {
        events.push({ kind: 'closed', door: door, cause: 'C1: the escorts closed the way behind the last eligible entrant' });
        events.push({ kind: 'escort-returned', door: door, count: 2 });
        routes[door] = door === 'postern' ? CLOSED_C1 : CLOSED_C1;
      } else if (cl.c === 'C0') routes.postern = OPEN_C0;
      else routes.postern = OPEN_UNTIL_HORN;
    }
    ev.stagedEvents = events;
    ev.routesAfterAdmission = clone(routes);
    // Historical armory (what happened while open) vs current armory (after this enactment)
    ev.armoryHistorical = (door === 'postern' && ev.opened) ? { exposure: ARMORY_HIST[cl.c].exposure, controlDuringAdmission: ARMORY_HIST[cl.c].controlDuringAdmission, loss: ARMORY_HIST[cl.c].lossIfOpened.slice() }
      : { exposure: 'none', controlDuringAdmission: 'retained', loss: [] };
    var cur = ARMORY_UNTOUCHED;
    if (door === 'postern' && ev.opened) cur = cl.c === 'C0' ? ARMORY_OPEN_C0 : cl.c === 'C1' ? ARMORY_RESTORED_C1 : ARMORY_OPEN_C2;
    ev.armoryAfterAdmission = clone(cur);
    // Horn closure caused by the enactment's own ticks
    ev.hornDuringEnactment = cl.c === 'C2' && ev.opened && p0 < PRESSURE_CAP && p0 + ev.enactTicks >= PRESSURE_CAP;
    ev.routesAtEnd = clone(routes); ev.armoryAtEnd = clone(cur);
    if (ev.hornDuringEnactment) { ev.routesAtEnd.postern = CLOSED_HORN; ev.armoryAtEnd = clone(ARMORY_RESTORED_HORN); }
    ev.escortDeployment = (ev.escortsPlanned && ev.opened) ? { count: 2, wallsDuring: DEFENDERS - 2, returned: true } : null;
    return ev;
  }

  // Projection of the remaining enactment for a state whose vow is spoken but not yet enacted.
  function enactProjection(s) {
    if (!s.vow || s.enacted) return null;
    var cl = { s: s.vow.s, r: s.vow.r, c: s.vow.c };
    var pNow = s.loc === 'stairfoot' ? s.pressure : Math.min(PRESSURE_CAP, s.pressure + 1);
    return { direct: evaluatePolicy(cl, pNow), oneDelay: evaluatePolicy(cl, Math.min(PRESSURE_CAP, pNow + 1)), pressureDirect: pNow, pressureDelay: Math.min(PRESSURE_CAP, pNow + 1) };
  }

  function admitPhrase(ev, counts) {
    if (ev.admittedPeople === 0) return 'no one is admitted';
    if (ev.admittedPeople === ev.eligiblePeople) return counts ? 'all ' + ev.eligiblePeople + ' eligible people are admitted' : 'everyone eligible is admitted';
    return counts ? 'only ' + ev.admittedPeople + ' of ' + ev.eligiblePeople + ' eligible people are admitted; ' + ev.eligibleLeftOutside + ' eligible people are left outside' : 'only part of the eligible queue is admitted; the rest are left outside';
  }

  // Preview for the player: same evaluator; redacts what the visitor has not learned.
  function previewVow(state, cl) {
    var know = state.know;
    var st = clauseStatus(cl, know, state.pressure);
    if (state.vow) st.reasons.push('ALREADY');
    if (state.authority !== 'granted') st.reasons.push('NO_AUTHORITY');
    var out = {
      stage: 'draft', text: vowText(cl), complete: st.complete, valid: st.reasons.length === 0,
      reasons: st.reasons.map(function (c) { return { code: c, text: REASONS[c] }; }),
      projectedPressureAtEnact: Math.min(PRESSURE_CAP, state.pressure + 2),
      delayedPressureAtEnact: Math.min(PRESSURE_CAP, state.pressure + 3)
    };
    if (!clauseStatus(cl, null, null).valid) return out;
    var p0 = out.projectedPressureAtEnact;
    var ev = evaluatePolicy(cl, p0);
    var evD = evaluatePolicy(cl, out.delayedPressureAtEnact);
    out.evaluation = ev; out.delayed = evD;
    var counts = !!know.camp_surveyed;
    out.countsKnown = counts;
    function cnt(n, unit) { return counts ? n + ' ' + unit : 'number not yet surveyed'; }
    // Eligibility under the exact wording
    var elig = ['Those already within the walls (already inside; not outsiders)'];
    var inel = [];
    if (cl.s === 'S0') inel.push('Everyone waiting outside (' + cnt(34, 'people') + ')');
    if (cl.s === 'S1') {
      elig.push('Families stranded at the gate at dusk who give their names (' + cnt(28, 'people in 9 families') + ')');
      inel.push('Travelers who are not part of a family (' + (counts ? '6 people: 4 unarmed travelers and 2 armed drovers' : 'number not yet surveyed') + ')');
    }
    if (cl.s === 'S2') {
      elig.push('Travelers at the gate who come unarmed and submit to search: the families and the unarmed travelers (' + cnt(32, 'people') + ')');
      inel.push(counts ? 'The 2 armed drovers, who told Tamsin they will not give up their blades' : 'Anyone who will not come unarmed or refuses the search (number unknown)');
    }
    out.eligibleGroups = elig; out.ineligibleGroups = inel;
    out.eligibleCount = counts ? ev.eligiblePeople : null;
    out.projectedAdmittedDirect = counts ? ev.admittedPeople : null;
    out.projectedEligibleLeftOutDirect = counts ? ev.eligibleLeftOutside : null;
    out.projectedAdmittedDelayed = counts ? evD.admittedPeople : null;
    out.directSummary = 'Going straight down (enactment begins at pressure ' + p0 + '): ' + admitPhrase(ev, counts) + '.';
    out.delaySummary = 'With one extra delay, such as examining something on the way (enactment at pressure ' + out.delayedPressureAtEnact + '): ' + admitPhrase(evD, counts) + (evD.lapsed ? ', and your promise lapses: the postern never opens.' : '.');
    out.intendedRoutes = ev.intendedRoutes;
    out.physicalNow = { main: 'barred', postern: 'barred', side: 'closed' };
    var postKnown = !!know.armory_link;
    out.armory = (cl.r === 'R1' && !postKnown) ? { exposure: 'unknown', controlDuringAdmission: 'unknown', afterwards: 'unknown' }
      : { exposure: (ev.door === 'postern') ? ARMORY_HIST[cl.c].exposure : 'none', controlDuringAdmission: (ev.door === 'postern') ? ARMORY_HIST[cl.c].controlDuringAdmission : 'retained', afterwards: ev.armoryAtEnd.access + '; ' + ev.armoryAtEnd.control };
    out.escorts = ev.escortsPlanned;
    out.repair = cl.r === 'R2' ? (know.side_known ? '3 loads of timber and the mason crew\'s night' : 'unknown') : 'none from the vow';
    out.enactTicks = ev.enactTicks;
    out.flexibility = ev.flexibility;
    var notes = [];
    if (ev.door === 'postern' && cl.c === 'C0' && postKnown) notes.push('Rule, not a guess: if the postern is opened unescorted, Voss cannot keep count, and in this chapter that always leaves one crate of arrows and two spears unaccounted for. No one is shown taking them, and nothing marks the admitted families as thieves. The postern stays open afterwards.');
    if (ev.door === 'postern' && cl.c === 'C2' && postKnown) notes.push('While the postern is open, Voss cannot keep count. In this chapter that always leaves one crate of arrows unaccounted for, but only if the postern actually opens. The horn closes it.');
    if (cl.c === 'C1') notes.push('Temporary: two defenders leave the walls to escort' + (know.defenders_known ? ' (12 on the walls become 10)' : '') + '. They close the way behind the last eligible entrant and then return to the walls, still exhausted.');
    if (cl.c === 'C2') notes.push('The postern stays open until the horn of closing sounds at pressure 12. If the enactment ends before then, it is still open when the chapter ends.');
    if (ev.shelterOverflow > 0) notes.push(know.shelter_cap ? 'The yard holds 30; ' + ev.shelterOverflow + ' would sleep in the gatehouse passage where the watch rests.' : 'The shelter yard\'s capacity has not been confirmed.');
    if (cl.s === 'S0') notes.push('No one outside is sheltered. People who asked for shelter will see the gate held against them.');
    notes.push('Shelter is not safety: anyone outside when outriders reach bowshot (pressure 8) may be hurt, including eligible people still waiting to come in.');
    notes.push('Unavoidable: enacting any vow means going down the stair to the lower ward to set the bars.');
    out.notes = notes;
    out.critical = cl.c === 'C2' && (ev.admittedPeople !== evD.admittedPeople);
    return out;
  }

  // ---------- State ----------
  function initialState(mode) {
    if (mode !== 'epic' && mode !== 'free') throw new Error('unknown mode');
    var s = {
      mode: mode, build: BUILD, grammarVersion: GRAMMAR_VERSION,
      loc: mode === 'free' ? 'hall' : 'road', pressure: 0, hornSounded: false,
      hero: { vit: MAX_VIT, maxVit: MAX_VIT, history: 'neutral', talent: 'none', downed: false },
      wounds: [],
      items: {
        knife: { state: 'carried', provenance: 'starting kit' },
        cloak: { state: 'worn', provenance: 'starting kit' },
        bandage: { state: 'carried', provenance: 'starting kit' },
        rope: mode === 'free' ? { state: 'carried', provenance: 'lent by Corrib Thane (Free Exploration local tool)', frayed: false } : { state: 'none', provenance: null, frayed: false }
      },
      know: {}, topics: {}, observed: {},
      authority: mode === 'free' ? 'granted' : 'none',
      sentinel: { aided: false },
      cloakGiven: false,
      vow: null, stair: { collapsed: false, damage: 0, factors: [] },
      enacted: null, runesExamined: false,
      gate: { current: { main: 'barred', postern: 'barred', side: 'closed' }, events: [] },
      armory: { current: { access: 'watch only', control: 'retained' }, historical: { exposure: 'none', controlDuringAdmission: 'retained', loss: [] } },
      defenders: { total: DEFENDERS, onWalls: DEFENDERS, onEscort: 0, deployments: [] },
      messenger: null,
      outside: { injured: 0, injuredWhere: [] },

    };
    if (mode === 'free') {
      s.obligations.push({ id: 'rope', text: 'Return Corrib\'s rope', status: 'open', at: 0 });
      s.obligations.push({ id: 'authority', text: 'Temporary authority lent for this night only', status: 'open', at: 0 });
      s.events.push({ i: 0, kind: 'start', text: 'Free Exploration: you are a traveler asked to help during the siege. You start in the gatehouse with temporary authority already lent and Corrib\'s rope in hand. Nothing here is written to the Epic Journey.' });
    } else {
      s.events.push({ i: 0, kind: 'start', text: 'You reach Crownspire at dusk with a knife, a cloak and a bandage. No one here knows you.' });
    }
    return s;
  }

  function slotsUsed(s) {
    var n = 0;
    if (s.items.knife.state === 'carried') n++;
    if (s.items.cloak.state === 'worn') n++;
    if (s.items.bandage.state === 'carried') n++;
    if (s.items.rope.state === 'carried') n++;
    return n;
  }

  function learn(s, keys, source) {
    keys.forEach(function (k) {
      if (!s.know[k]) s.know[k] = { at: s.actionIndex, source: source };
    });
  }

  function addEvent(s, kind, text) { s.events.push({ i: s.actionIndex, kind: kind, text: text }); }
  function gateEvent(s, e) {
    var rec = { seq: s.gate.events.length + 1, at: s.actionIndex, pressure: s.pressure };
    Object.keys(e).forEach(function (k) { rec[k] = e[k]; });
    s.gate.events.push(rec);
  }

  function outsideList(s) {
    // Ordered groups still outside, for injury targeting. The Fenn family camps at the exposed edge.
    var adm = s.enacted ? s.enacted.admittedFamilies : 0;
    var travelersIn = s.enacted ? s.enacted.travelersAdmitted : 0;
    var out = [];
    var fennIdx = 7;
    if (fennIdx >= adm) out.push({ who: 'the Fenn family', n: FAMILIES[fennIdx].size, group: 'family', familyIdx: fennIdx });

  // ---------- Actions ----------
  // Action shapes (exact fields):

  // {type:'aid_sentinel'}, {type:'give_cloak'}, {type:'borrow_rope'},

    if (to === 'hall' && from === 'barbican' && s.authority !== 'granted') return 'The runes will not let a stranger through the wicket. Only someone carrying a Sentinel\'s lent authority may pass.';
    if (s.pressure >= PRESSURE_CAP && FORWARD[from] !== to) return 'The vanguard is at the ditch. There is no time to go back.';
    return null;
  }

  // Returns a reason string if illegal, otherwise null.

      }
      case 'accept_authority':

      case 'aid_sentinel':

        if (a.knife !== 'sheathed' && a.knife !== 'hand') return 'Malformed action.';

  function collapseDamage(s, a) {

      b.appendChild(h('button', { class: 'btn', type: 'button', onclick: function () { close(); render(); } }, 'Done'));
    });
  }
  function openAbout() {
    openModal('About, rules and credits', function (b) {
      b.appendChild(h('p', { text: 'The Echo-Bound Journey is the fourth independent Fantortals epic. It shares no characters, lore, saves or rewards with the other three.' }));
      b.appendChild(h('ul', { class: 'list' },
        h('li', { text: 'Siege pressure runs from 0 to 12 and rises only with moving and physical actions. Talking, reading, drafting the vow, Settings and the Keyring are always free.' }),
        h('li', { text: 'At pressure 4 scouts arrive; at 8 outriders loose arrows at anyone still outside; at 12 the horn of closing sounds and you can only move forward.' }),
        h('li', { text: 'Your vow is built from fixed clauses: whom the citadel shelters, which door opens, and under what condition. The preview and the result come from the same rules. There is no free-text magic and no hidden keyword.' }),
        h('li', { text: 'There is no combat. Every outcome can be reached by talking, looking and choosing.' })));
      b.appendChild(credits());
    });
  }

  // ---------- Read-only QA hook (frozen; returns defensive copies; cannot mutate state) ----------
  try {
    Object.defineProperty(window, '__CROWNSPIRE_QA__', { value: Object.freeze({
      build: E.BUILD, engine: E.ENGINE_VERSION,
      snapshot: function () { return app.state ? JSON.parse(JSON.stringify({ mode: app.mode, runId: app.runId, log: app.log, draft: app.draft, state: app.state, conflict: app.conflict, cpStatus: app.cpStatus, saveErr: app.saveErr })) : null; },
      storageAvailable: function () { return store.available; }
    }), writable: false, configurable: false });
  } catch (e) { /* ignore */ }

  applySettings();
  render();
})();

</script>
