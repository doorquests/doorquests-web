          s.evidence.seal_plate = { held: true, fate: 'carried', at: s.i, how: parts[1] === 'tackle' ? 'Wrenched from a fleeing thief\'s satchel in Tanner\'s Alley' : 'Dropped by a fleeing thief in Tanner\'s Alley when you called out in the Warden\'s name' };
          learn(s, 'plate_stamp', 'Read from the recovered seal-plate itself');
          s.town.platesRecovered = 1;
          chron(s, 'In Tanner\'s Alley you recovered one silver seal-plate (' + (parts[1] === 'tackle' ? 'taken from a thief' : 'dropped as they fled') + '). It bears Bramwell mint\'s crossed-hammer stamp. Five plates went with the thieves.');
        } else { s.detours.thieves = 'left'; chron(s, 'You let the thieves go.'); }
        s.scene = 'square'; break;
      case 'descend':
        s.scene = 'catwalk';
        chron(s, 'You went down through the Barrow-Gate. Rainwater was pouring down the stair.');
        break;
      case 'fall':
        var dmg = ({ magnet: fallDmg(s0, 2), pry: fallDmg(s0, 3), chain: fallDmg(s0, 4) })[parts[1]];
        addPanic(s, 1, 'climbing out of the cistern after the fall');
        s.catwalk.fall = parts[1]; s.catwalk.damage = dmg;
        if (dmg >= 3) s.injuries.push({ id: 'fall_' + parts[1], i: s.i, text: 'Wrenched shoulder and bruised ribs from the catwalk fall.' });
        else if (dmg === 2) s.injuries.push({ id: 'fall_' + parts[1], i: s.i, text: 'Scraped hands and a bruised hip from the catwalk fall.' });
        chron(s, 'The waterlogged catwalk gave way. ' + ({ magnet: 'Your magnetized crowbar caught the iron rail and you slid down under control', pry: 'Your crowbar bit into the masonry and slowed you', chain: 'You caught the slick chain, lost it, and dropped' })[parts[1]] + ' (Vitality -' + dmg + (has(s, 'ward_lantern') ? '; the ward-lantern showed you the ledge' : '') + ').');
        s.scene = 'cistern';
        hurt(s, dmg, 'the catwalk fall');
        break;
      case 'cistern':
        if (parts[1] === 'rest') { s.rested = true; addPanic(s, 1, 'resting on the cistern ledge'); heal(s, 1, 'rest on the cistern ledge'); chron(s, 'You caught your breath on the ledge (+1 Vitality).'); }
        else { s.scene = 'vault'; chron(s, 'You reached the Warden vault: four sarcophagi and a sealed door with four empty sockets.'); }
        break;
      case 'sarc': doSarc(s, parts); break;
      case 'vault': s.scene = 'gallery'; s.drake.met = true; learn(s, 'drake_blind', 'Seen with your own eyes in the ember gallery'); chron(s, 'In the ember gallery you found a juvenile Cinder-Drake, small, smoke-blind and terrified.'); break;
      case 'drake': doDrake(s, parts[1]); break;
      case 'gallery': s.scene = 'tithe'; chron(s, 'You entered the tithe chamber. A great iron scale stood tilted toward its tithe stone.'); break;
      case 'scale': doScale(s, parts); break;
      case 'tithe':
        s.scene = 'mirrors';
        learn(s, 'shim_seen', 'Seen with your own eyes in the mirror gallery');
        chron(s, 'In the mirror gallery you set the Sun-Prism Shard in the emitter cradle. A thin silver wedge glinted, jammed into mirror M2 to stop it turning.');
        break;
      case 'grid': doGrid(s, parts); break;
      case 'mirrors': s.scene = 'heart'; break;
      case 'finale': finalize(s); break;
      case 'dawn': case 'carried':
        if (parts[0] === 'carried') finalizeCarried(s);
        s.complete = true; s.ended = true; s.scene = 'ending';
        chron(s, 'Mira Vance gave her orders. ' + s.dispatch.summary);
        break;
      case 'use':
        s.broth--; s.brothLog.push({ i: s.i, how: 'drunk' });
        heal(s, RULES.brothHeal, 'Hearth-Broth');
        chron(s, 'You drank your Hearth-Broth.');
        break;
      default: throw Illegal('unknown action');
    }
    if (s.scene === 'carried' && !s.ended) { /* awaiting carried:accept */ }
    return s;
  }

  function doInspect(s, what) {
    if (what === 'well') learn(s, 'well_filings', 'Your own close inspection of the split well');
    else if (what === 'gate') learn(s, 'gate_sound', 'Heard with your own ears at the Barrow-Gate');
    else if (what === 'catwalk') { s.catwalk.tested = true; learn(s, 'catwalk_rot', 'Your own test of the catwalk planks'); }
    else if (what === 'door') { s.sarc.inspected.push('door'); learn(s, 'sarc_door', 'Read on the vault seal door'); }
    else if (/^sarc[1-4]$/.test(what)) { s.sarc.inspected.push(what); learn(s, 'clue_' + what, 'Read on the sarcophagus of ' + SARC_CLUES[+what.charAt(4) - 1].warden); }
    else if (what === 'scale') { s.scale.inspected = true; learn(s, 'scale_rule', 'Read on the tithe scale'); }
  }

  function grantShard(s, cond, how) {
    addItem(s, 'sun_prism_shard');
    s.shard = { held: true, cond: cond, fate: 'carried', at: s.i, how: how, origin: 'Hearth prism of the Warden vault beneath Oakhaven\'s Barrow-Gate' };
    s.prism = { pattern: PRISM_ANSWER, at: s.i, how: cond === 'whole' ? 'Deduced and committed by you' : 'Read from the light-pattern that flared as you forced the door', origin: 'Warden vault beneath Oakhaven\'s Barrow-Gate' };
    learn(s, 'prism_order', s.prism.how);
  }
  function doSarc(s, p) {
    var S = s.sarc;
    if (p[1] === 'arrange') {
      S.slots = p[2].split('').map(function (c) { return c === '_' ? null : c; });
    } else if (p[1] === 'commit') {
      var order = S.slots.join('');
      S.attempts.push(order);
      addPanic(s, 1, 'setting the sun-prisms');
      if (order === PRISM_ANSWER) {
        S.result = S.hint ? 'ordered_assisted' : (S.attempts.length > 1 ? 'ordered_after_retry' : 'ordered');
        grantShard(s, 'whole', 'Released by the vault door when the prisms were set in true order');
        chron(s, 'You set the prisms ' + orderNames(order) + '. The door blazed open and a whole shard slid free of the Hearth prism.');
      } else {
        chron(s, 'Wrong order (' + orderNames(order) + '): the sockets spat the prisms out in a flash of heat (Vitality -1).');
        S.slots = S.hint ? [PRISM_ANSWER.charAt(0), null, null, null] : [null, null, null, null];
        hurt(s, 1, 'a flare from a wrong prism order');
      }
    } else if (p[1] === 'hint') {
      S.hint = true; addPanic(s, 1, 'tracing the dust lines');
      var cur = S.slots.indexOf('B'); if (cur >= 0) S.slots[cur] = null;
      if (S.slots[0]) S.slots[0] = null; S.slots[0] = 'B';
      learn(s, 'sarc_hint', 'Traced from worn dust lines in the vault floor');
      chron(s, 'Worn dust lines showed the Beacon prism belongs in the first socket.');
    } else if (p[1] === 'force') {
      addPanic(s, 1, 'forcing the seal door');
      S.result = 'forced';
      grantShard(s, 'chipped', 'Chipped from the Hearth prism as you forced the vault door');
      chron(s, 'You forced the seal door. Light flared through the prisms in their true order as it gave way, and a chipped shard fell from the Hearth prism. The cluortal seal is marked forced.');
    }
  }
  function orderNames(o) { return o.split('').map(function (k) { return PRISMS[k].name; }).join(', '); }

  function doDrake(s, act) {
    var d = s.drake;
    function lunge(why) { if (d.fear >= 4) hurt(s, drakeHit(s), 'the drake lashing out blindly (' + why + ')'); }
    switch (act) {
      case 'observe':
        d.used.push('observe'); learn(s, 'drake_signs', 'Watched by you in the ember gallery');
        chron(s, 'You watched before acting. It flinches from your lantern glare, swings its head toward every footstep, and coughs hardest where smoke pools by a blocked vent.'); break;
      case 'speak': d.used.push('speak'); d.fear = Math.max(0, d.fear - 1); chron(s, 'You spoke low. The drake\'s head swung toward your voice and its snapping slowed.'); break;
      case 'shade': d.used.push('shade'); d.fear = Math.max(0, d.fear - 1); chron(s, 'You shaded your lantern; the drake stopped flinching.'); break;
      case 'still': d.used.push('still'); d.fear = Math.max(0, d.fear - 1); chron(s, 'You crouched and kept still. With no footsteps to track, the drake\'s head sank.'); break;
      case 'ward': d.used.push('ward'); d.fear = Math.max(0, d.fear - 2); if (!d.aggression) d.trust++; chron(s, 'The ward-lantern\'s clear light parted the smoke. For the first time the drake could see you' + (d.aggression ? ', and the blade you struck it with.' : '.')); break;
      case 'vent':
        d.used.push('vent'); d.fear = Math.max(0, d.fear - 1); d.trust++; addPanic(s, 1, 'clearing the drake\'s smoke vent');
        if (!has(s, 'crowbar')) hurt(s, 1, 'hot stone in the smoke vent');
        chron(s, 'You opened the choked vent. Clean air poured in and the drake gulped it.'); break;
      case 'broth':
        d.used.push('broth'); s.broth--; s.brothLog.push({ i: s.i, how: 'offered to the Cinder-Drake' }); d.fear = Math.max(0, d.fear - 2); d.trust++;
        chron(s, 'You poured out your Hearth-Broth. The drake lapped it up, shivering less.'); break;
      case 'pillar': d.pillar = true; chron(s, 'You put the stone pillar between you and the drake.'); break;
      case 'intimidate':
        lunge('startled by the noise'); if (s.scene !== 'gallery' || d.fate) break;
        d.fear = Math.min(6, d.fear + 2);
        if (d.fear >= 6) { d.fate = 'driven_off'; addPanic(s, 1, 'driving off the drake'); chron(s, d.injured ? 'The drake bolted down a deep vent, still bleeding from your earlier blow.' : 'The drake bolted down a deep vent, unhurt but terrified.'); }
        else chron(s, 'The drake hissed and backed away, still blocking the passage.');
        break;
      case 'strike':
        lunge('you closed the distance'); if (s.scene !== 'gallery' || d.fate) break;
        d.aggression = true; d.hp -= 2; d.injured = true; d.trust = 0;
        d.fear = Math.min(6, d.fear + 1);
        if (d.hp <= 2 || d.fear >= 6) { d.fate = 'driven_off'; addPanic(s, 1, 'driving off the drake'); chron(s, 'Your blade cut its wing-membrane. The drake fled wounded down a deep vent.'); }
        else chron(s, 'Your blade cut the drake\'s shoulder. It screamed and backed into the smoke, still blocking the way.');
        break;
      case 'slip': d.fate = 'left_in_barrow'; addPanic(s, 1, 'creeping past the drake'); chron(s, 'You slipped past along the far wall. The drake stayed behind, trapped in the smoke.'); break;
      case 'release': d.fate = 'spared'; addPanic(s, 1, 'opening the upper vent'); chron(s, 'You opened the upper vent. The drake climbed toward the night air and was gone.'); break;
      case 'bond':
        d.fate = 'spared'; d.bond = true; addPanic(s, 1, 'earning the drake\'s trust');
        s.bonds.push({ id: 'drake_friend', i: s.i, text: 'The juvenile Cinder-Drake pressed its warm snout to your palm before climbing to the night air. It knows your scent.' });
        chron(s, 'The drake pressed its warm snout into your palm, then climbed free. A Drake-Friend bond formed.'); break;
    }
    if (!d.fate && !d.calm && d.fear <= 1 && s.scene === 'gallery') { d.calm = true; chron(s, 'The drake settled, breathing easily.'); }
  }

  function doScale(s, p) {
    var S = s.scale;
    if (p[1] === 'fish') {
      S.four = 'vault'; S.fourBy = p[2];
      if (p[2] === 'hand') hurt(s, 1, 'sharp stone in the scale pit');
      chron(s, 'You recovered the 4-notch stone from the pit ' + (p[2] === 'magnet' ? 'with the magnetized crowbar.' : 'by hand (Vitality -1).'));
      if (s.scene !== 'tithe') return;
    } else if (p[1] === 'arrange') {
      var sides = p[2].split('.');
      S.left = sides[0].split('').filter(Boolean).map(function (c) { return FROM_CODE[c]; });
      S.right = sides[1].split('').filter(Boolean).map(function (c) { return FROM_CODE[c]; });
    }
    else if (p[1] === 'commit') {
      addPanic(s, 1, 'paying the tithe');
      var t = scaleTotals(s);
      S.result = 'balanced'; S.committed = { left: S.left.slice(), right: S.right.slice(), leftTotal: t.left, rightTotal: t.right };
      S.left.concat(S.right).forEach(function (w) {
        if (!ITEM_WEIGHTS[w]) return;
        S.sacrificed.push(w);
        if (w === 'hearth_broth') { s.broth--; s.brothLog.push({ i: s.i, how: 'left as tithe on the Warden scale' }); }
        else removeItem(s, w);
        if (w === 'seal_plate') { s.evidence.seal_plate.held = false; s.evidence.seal_plate.fate = 'surrendered as tithe on the Warden scale'; }
        if (w === 'crowbar') s.crowbarFate = 'surrendered as tithe on the Warden scale';
        if (w === 'ward_lantern' && s.loan) {
          s.loan.held = false; s.loan.fate = 'surrendered_as_tithe'; s.loan.fateAt = s.i;
          s.promises.forEach(function (pr) { if (pr.id === 'return_ward_lantern') { pr.status = 'broken_restitution_due'; pr.statusAt = s.i; pr.reason = 'You surrendered the borrowed Ward-Lantern as tithe on the Warden scale. It cannot be returned.'; } });
          s.obligations.push({ id: 'restitution_ward_lantern', owedTo: s.loan.lender, status: 'outstanding', at: s.i, reason: 'Make good the Temple Ward-Lantern you surrendered as tithe. Nothing has been replaced or forgiven yet.' });
          chron(s, 'The borrowed Ward-Lantern stays with the scale. Your promise to return it to Acolyte Wren is broken, and you owe the temple restitution.');
        }
      });
      chron(s, 'The tithe balanced at ' + t.left + ' against ' + t.right + '. The beam locked level.' + (S.sacrificed.length ? ' Kept as tithe: ' + S.sacrificed.map(function (w) { return ITEMS[w].name; }).join(', ') + '.' : ''));
    } else if (p[1] === 'lash') {
      addPanic(s, 1, 'lashing the beam'); S.result = 'lashed'; S.committed = { left: S.left.slice(), right: S.right.slice() }; S.left = []; S.right = [];
      chron(s, 'You lashed the beam level with your belt. It will hold for now, but the chaortal seal is imperfect.');
    } else if (p[1] === 'wedge') {
      addPanic(s, 1, 'wedging the beam'); S.result = 'wedged'; S.committed = { left: S.left.slice(), right: S.right.slice() }; S.left = []; S.right = [];
      removeItem(s, 'crowbar'); s.crowbarFate = 'left wedged in the tithe beam';
      chron(s, 'You wedged the beam level with your crowbar and left it there. The chaortal seal is imperfect.');
    }
  }

  function doGrid(s, p) {
    var G = s.grid;
    if (p[1] === 'arrange') {
      G.st = decodeGrid(p[2]);
    } else if (p[1] === 'shim') {
      G.shim = 'removed';
      if (!has(s, 'crowbar') && !has(s, 'short_sword')) hurt(s, 1, 'a silver edge cutting your fingers');
      if (s.scene !== 'mirrors') return;
      if (packUsed(s) + ITEMS.silver_shim.size <= RULES.capacity) addItem(s, 'silver_shim');
      s.evidence.silver_shim = { held: true, fate: 'carried', at: s.i, how: 'Pried by you from mirror M2 in the Warden mirror gallery' };
      learn(s, 'shim_stamp', 'Read from the shim itself');
      chron(s, 'You removed the silver shim from M2. It is stamped with Bramwell mint\'s crossed hammers. Someone jammed this mirror on purpose.');
    } else if (p[1] === 'commit') {
      addPanic(s, 1, 'locking the mirrors');
      var t = traceBeam(G.st);
      G.result = t.solved ? 'aligned' : 'partial'; G.lit = t.litCount; G.heart = t.heart; G.committedSt = G.st;
      chron(s, t.solved ? 'Light ran through all three sockets into the seal heart. The gamortal grid is aligned.' : 'You locked the mirrors with ' + t.litCount + ' of 3 sockets lit' + (t.heart ? '' : ' and no light reaching the seal heart') + '. The gamortal grid is only partly aligned.');
    }
  }

  function interferenceProofs(s) {
    var P = [{ id: 'well_drillholes', kind: 'witnessed', text: 'Fresh drill holes in the split well stones, shown to you by Mira Vance' }];
    if (s.know.well_filings) P.push({ id: 'well_filings', kind: 'observed', text: 'Bright mint-grade silver filings packed into the drill holes (your own inspection)' });
    if (s.know.shim_seen) P.push({ id: 'shim_seen', kind: 'observed', text: 'A silver wedge deliberately jammed into mirror M2 (seen by you)' });
    if (s.evidence.silver_shim && s.evidence.silver_shim.held) P.push({ id: 'silver_shim', kind: 'physical', text: 'The Bramwell-stamped silver shim itself, in your oath-pouch' });
    return P;
  }
  function bramwellLeads(s) {
    var L = [{ id: 'thieves_road', kind: 'witnessed', text: 'The thieves\' cart took the Bramwell road (seen from the market square)' }];
    if (s.know.plate_stamp) L.push({ id: 'plate_stamp', kind: s.evidence.seal_plate.held ? 'physical' : 'remembered', text: s.evidence.seal_plate.held ? 'The recovered seal-plate, stamped with Bramwell mint\'s crossed hammers (carried)' : 'The recovered seal-plate bore Bramwell\'s crossed-hammer stamp (plate surrendered as tithe; stamp recorded in your sworn account)' });
    if (s.know.thief_words) L.push({ id: 'thief_words', kind: 'heard', text: 'The pinned thief gasped that "the mint at Bramwell pays by the plate"' });
    if (s.know.shim_stamp) L.push({ id: 'shim_stamp', kind: s.evidence.silver_shim && s.evidence.silver_shim.held ? 'physical' : 'remembered', text: 'The mirror shim carries the same Bramwell mint mark' });

  }

  function confidenceOf(clean, peak) {
    if (clean) return peak <= 8 ? 'restored' : peak < 12 ? 'steadied' : 'wary';
    return peak < 12 ? 'shaken' : 'broken';
  }

  function finalize(s) {
    var weak = [];
    if (s.sarc.result === 'forced') weak.push('cluortal door forced, prisms not seated by hand');
    if (s.scale.result !== 'balanced') weak.push(s.scale.result === 'lashed' ? 'tithe beam held by a belt lashing' : 'tithe beam held by a wedged crowbar');
    if (s.grid.result !== 'aligned') weak.push('mirror grid only ' + s.grid.lit + ' of 3 sockets lit' + (s.grid.heart ? '' : ', light not reaching the heart'));
    var clean = weak.length === 0;
    if (!clean) {
      s.town.injured += 1;
      s.town.damage.push('Cold seal-smoke vented into the Well Street cellars');
      s.town.events.push({ i: s.i, id: 'seal_backlash', injured: 1, text: 'The imperfect seal vented cold smoke into Well Street. 1 neighbour injured.' });
    }
    s.seal = { condition: clean ? 'clean' : 'partial', weakPoints: weak };
    s.outcome = clean ? (s.panicPeak < 12 ? 'clean_reseal' : 'clean_reseal_wary') : 'partial_reseal';
    s.town.confidence = confidenceOf(clean, s.panicPeak);
    s.scene = 'dawn';
    var pin = clean || s.panicPeak < 12;
    s.rewards = rewardList(s, pin);
    if (pin) s.pin = { at: s.i, why: clean ? 'Awarded by Mira Vance for a clean reseal' : 'Awarded by Mira Vance for holding the seal and the town together' };
    s.dispatch = buildDispatch(s, clean ? 'assignment' : 'emergency_assignment');
    chron(s, clean ? 'The seal closed clean. Dawn light came through the Barrow-Gate.' : 'The seal closed imperfectly: ' + weak.join('; ') + '. Cold smoke vented into Well Street.');
  }
  function finalizeCarried(s) {
    s.seal = { condition: 'unrepaired', weakPoints: ['Barrow-Gate held only by the watch\'s temporary chains'] };
    s.outcome = 'carried_out';
    s.town.confidence = 'broken';
    s.rewards = rewardList(s, false);
    s.dispatch = buildDispatch(s, 'emergency_handoff');
  }
  function rewardList(s, pin) {
    var R = [];
    if (pin) R.push('silver_lantern_pin');
    if (s.shard && s.shard.held) R.push('sun_prism_shard');
    if (s.evidence.seal_plate && s.evidence.seal_plate.held) R.push('bramwell_seal_plate_evidence');
    if (has(s, 'crowbar') && s.crowbarMod === 'magnetized') R.push('magnetized_crowbar');
    if (s.drake.bond) R.push('drake_friend_bond');
    return R;
  }
  function buildDispatch(s, type) {
    var lines = [];
    var proofs = interferenceProofs(s), leads = bramwellLeads(s);
    if (type === 'emergency_handoff') {
      lines.push('EMERGENCY HANDOFF, Iron-Lantern Wardens of Oakhaven. From Quartermaster Mira Vance.');
      lines.push('Warden collapsed below the Barrow-Gate and was carried out by temple acolytes and the watch. The gate is held by temporary chains; the seal is unrepaired.');
      lines.push('The Warden must recover before any further duty (Vitality 0 at handoff).');
    } else {
      lines.push((type === 'emergency_assignment' ? 'EMERGENCY DISPATCH' : 'DISPATCH') + ', Iron-Lantern Wardens of Oakhaven. From Quartermaster Mira Vance.');
      lines.push('Seal condition: ' + (s.seal.condition === 'clean' ? 'clean reseal' : 'partial reseal (' + s.seal.weakPoints.join('; ') + '). A watch is posted on the Barrow-Gate') + '.');
    }
    lines.push('Town: peak panic ' + s.panicPeak + ' of 12; ' + s.town.injured + ' neighbour' + (s.town.injured === 1 ? '' : 's') + ' injured' + (s.town.damage.length ? '; damage: ' + s.town.damage.join('; ') : '') + '.');
    lines.push('Proof of deliberate interference: ' + proofs.map(function (p) { return p.text; }).join('; ') + '.');
    lines.push('Leads to Bramwell: ' + leads.map(function (p) { return p.text; }).join('; ') + '.');
    if (s.obligations.length) lines.push('Outstanding obligation: restitution owed to ' + s.obligations[0].owedTo + ' for the Temple Ward-Lantern surrendered as tithe.');
    lines.push('Orders: ' + (type === 'emergency_handoff' ? 'once recovered, the Warden is to trace the stolen silver to Bramwell\'s flooded mint.' : 'trace the stolen silver seal-plates through Bramwell\'s flooded mint.'));
    return { from: 'Quartermaster Mira Vance', type: type, lines: lines, summary: type === 'emergency_handoff' ? 'Emergency handoff recorded; Bramwell investigation assigned after recovery.' : 'Assigned to trace the stolen silver through Bramwell\'s flooded mint.' };
  }

  // ---- Handoff for chapter #002 (pure function of final state) ----
  function handoff(s, meta) {
    if (!s.complete) return null;
    var knowledge = Object.keys(s.know).sort().map(function (k) { return { id: k, provenance: s.know[k].src, atAction: s.know[k].at }; });
    var ev = [];
    ['seal_plate', 'silver_shim'].forEach(function (id) { if (s.evidence[id]) ev.push({ id: id, held: s.evidence[id].held, fate: s.evidence[id].fate, provenance: s.evidence[id].how, atAction: s.evidence[id].at }); });
    return {
      ids: { campaign: CAMPAIGN, chapter: CHAPTER, schema: SCHEMA, build: BUILD, runId: meta.runId, mode: s.mode },
      outcome: s.outcome,
      vitality: { current: s.vit, max: s.vitMax, collapses: s.collapses, recoveryRequired: s.vit === 0 },
      worn: s.worn.slice(), pack: s.pack.slice(), consumables: { hearth_broth: s.broth },
      crowbar: { held: s.pack.indexOf('crowbar') >= 0, modification: s.crowbarMod, fate: s.pack.indexOf('crowbar') >= 0 ? 'carried' : (s.crowbarFate || 'carried') },
      evidence: ev,
      knowledge: knowledge,
      prism: { pattern: s.prism ? s.prism.pattern : null, patternNames: s.prism ? orderNames(s.prism.pattern) : null, learnedBy: s.prism ? s.prism.how : null, origin: s.prism ? s.prism.origin : null,
        shard: s.shard ? { held: s.shard.held, condition: s.shard.cond, fate: s.shard.fate, origin: s.shard.origin, provenance: s.shard.how } : null },
