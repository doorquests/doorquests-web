<style>

.art svg { display: block; width: 100%; height: auto; max-height: 240px; }

.label-strip { background: var(--paper-2); color: var(--ink); padding: 7px 12px; border-radius: 4px; font-size: .95rem; box-shadow: 0 1px 0 rgba(0,0,0,.4); }

.radio { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; }
.radio input { width: 22px; height: 22px; margin: 2px 0 0; flex: 0 0 22px; accent-color: var(--brass); }

.slip .hand { font-size: 1.12rem; }
.slip select, .bi select, .matchrow select { background: #fff8e6; color: var(--ink); border: 1px solid #a8916a; border-radius: 8px; padding: 8px; min-height: 44px; max-width: 100%; }
.bi select, .matchrow select { background: var(--deep); color: var(--ivory); border-color: var(--line-2); }
.slip .matchrow select { background: #fff8e6; color: var(--ink); }
.slip .ok { color: #2f6a2a; } .slip .err { color: #8a3a12; }
.want { margin: 0 0 8px; padding-left: 20px; }
.matchrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
.stamp { display: inline-block; border: 3px double #7a2a2a; color: #7a2a2a; padding: 2px 10px; font-weight: 600; letter-spacing: .08em; transform: rotate(-3deg); }
.line { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; counter-reset: st; }
.line li { display: grid; grid-template-columns: 1fr; padding: 6px 10px 6px 30px; position: relative; background: var(--deep); border-radius: 8px; }
.line li::before { content: ""; position: absolute; left: 12px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--brass); }
.line li span { color: var(--brass-2); font-variant-numeric: tabular-nums; font-size: .92rem; }
.line li small { color: var(--mist); }
@media (min-width: 1000px) { .line { grid-template-columns: repeat(6, 1fr); } .line li { padding: 26px 8px 8px; } .line li::before { left: 50%; top: 9px; margin-left: -5px; } .line li { text-align: center; } }
.board-items { display: grid; gap: 10px; margin: 12px 0; }

.bi { background: var(--deep); margin: 0; }
.bi .art.small { float: right; margin-left: 8px; }
.bi-info p { font-size: .9rem; margin-bottom: .4em; }

.checkres { background: var(--deep); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }

.asks { display: flex; flex-direction: column; gap: 6px; }
.asks button { text-align: left; }
.asks button.asked { opacity: .55; }
.mabel-ask { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.talk { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.talklog { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; max-height: 70vh; overflow: auto; }
.talklog .q, .mabel-ask .q { color: var(--brass-2); font-weight: 500; }
form.decide { background: var(--deep); border: 1px solid var(--line-2); border-radius: var(--r); padding: 16px; margin-top: 18px; }

#screen-end { max-width: 760px; margin: 0 auto; }
.epi h3 { color: var(--brass-2); font-family: var(--display); font-variant-numeric: tabular-nums; }

.ledger-inline { margin: 20px 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.ledger-inline summary { cursor: pointer; font-weight: 500; min-height: 32px; }
.shiftledger { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; }
.shiftledger .when { color: var(--brass-2); font-variant-numeric: tabular-nums; display: inline-block; min-width: 3.4em; }

dialog { border: 1px solid var(--line-2); border-radius: 16px; background: var(--panel); color: var(--ivory); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.6); }

.marks li { background: none; padding: 0; }

.marks .locked { color: var(--mist); }
.help fieldset { margin-top: 10px; }
#toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: var(--lav); color: #140c22; padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 70; box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: calc(100vw - 32px); }
footer.foot { border-top: 1px solid var(--line); margin-top: 30px; padding-top: 14px; color: var(--mist); font-size: .88rem; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

/* motion: gentle and optional */
@media (prefers-reduced-motion: no-preference) {
  body:not(.reduce-motion) .hero .rain { animation: fall 1.6s linear infinite; }
  body:not(.reduce-motion) .phono.playing .phono-drum { animation: spin .5s linear infinite; transform-box: fill-box; transform-origin: center; }
  body:not(.reduce-motion) dialog[open] { animation: rise .25s ease-out; }
}
body.full-motion .hero .rain { animation: fall 1.6s linear infinite; }
body.full-motion .phono.playing .phono-drum { animation: spin .5s linear infinite; transform-box: fill-box; transform-origin: center; }

@keyframes fall { from { transform: translateY(-10px); opacity: 0; } 30% { opacity: .8; } to { transform: translateY(24px); opacity: 0; } }
@keyframes spin { 0% { opacity: 1; } 50% { opacity: .75; } 100% { opacity: 1; } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (forced-colors: active) { .tag, .slip, .label-strip, .transcript { border: 1px solid CanvasText; } }
</style>

(function () {
/* ---- engine.js ---- */
/* Hollin Cross engine. Pure and deterministic: state = replay(seed, actions).
   No DOM, storage, clock or network access. apply() never mutates its input. */
var HCEngine = (function () {
  'use strict';
  var VERSION = '1.0.0';

  /* ---------- deterministic helpers ---------- */
  function strHash(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function canon(o) {
    if (o === null || typeof o !== 'object') return JSON.stringify(o);
    if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
    return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(o[k]); }).join(',') + '}';
  }
  function hash(state) {
    var s = canon(state), h1 = 0x811c9dc5, h2 = 0x9747b28c;

  /* the phonograph */
  function resetPhono() { stopPhono(); U.ph = { t: 0, playing: false, full: false, timer: null, shown: 0 }; }
  function stopPhono() { if (U.ph && U.ph.timer) { clearInterval(U.ph.timer); U.ph.timer = null; } if (U.ph) U.ph.playing = false; SND.phonoStop(); }
  function playPhono() {
    var ph = U.ph, R = T.RECORDING;
    if (ph.t >= R.length) ph.t = 0;
    ph.playing = true; SND.phonoStart(R.cues, ph.t); SND.sfx('click');
    var last = Date.now();
    ph.timer = setInterval(function () {
      var now = Date.now(); ph.t += (now - last) / 1000; last = now;
      if (ph.t >= R.length) { ph.t = R.length; stopPhono(); if (ST && !ST.heard) act({ t: 'heard', how: 'played' }); }
      updatePhono();

  }
  function renderMachineIfOpen() { if (ST && ST.phase === 'shift' && U.tab === 'machine') { var y = window.scrollY; render(); window.scrollTo(0, y); var b = $('btnPlay'); if (b && document.activeElement === document.body) b.focus(); } }
