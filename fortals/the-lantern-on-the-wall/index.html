  function composeLetter(story, st) {

      if (!v) return;
      out.push(fld[2] ? fld[2] + ' ' + v : v, '');

    out.push('Your reader', '', '--- From my Margin Ledger ---', 'Story: ' + story.title, '');
    out.push('My first claim: ' + (st.firstClaim ? st.firstClaim.text : '(not written)'));
    var fe = firstEntries(st);
    if (fe.length) {
      out.push('Sentences I used for my first claim:');
      fe.forEach(function (e) {
        out.push('  (' + e.line + ') ' + lineOf(story, e.line).text);
        out.push('      My reason: ' + (e.reason || '(no reason written)'));
        if (e.secondLook) out.push('      My second look, after the missing page: ' + e.secondLook);
      });
    }
    out.push('');
    var r = st.reconsider;
    if (r.savedAt && r.path) {
      out.push('After the missing page, I chose to ' + PATHS[r.path].letter + '.');
      out.push(PATHS[r.path].field.replace(/ \(.*\)$/, '') + ': ' + r.text.trim());

      out.push('Sentences I used for my later thinking:');
      le.forEach(function (e) {
        out.push('  (' + e.line + ') ' + lineOf(story, e.line).text);
        out.push('      My reason: ' + (e.reason || '(no reason written)'));

      h('p', null, h('strong', null, 'First evidence: '), firstEntries(st).map(function (e) { return 'sentence ' + e.line; }).join(', ') || 'none'),
      h('p', null, h('strong', null, 'Later thinking (' + PATHS[st.reconsider.path].label.toLowerCase() + '): '), h('span', { class: 'user-text' }, st.reconsider.text)),
      h('p', null, h('strong', null, 'Later evidence: '), laterEntries(st).map(function (e) { return 'sentence ' + e.line; }).join(', ') || 'none yet'));
    sec.appendChild(auto);
    var reqs = requirements(st);
    sec.appendChild(h('h3', { id: 'ready-h' }, 'Before you send'));
    sec.appendChild(h('ul', { class: 'checklist', 'aria-labelledby': 'ready-h' }, reqs.map(function (q) {
      return h('li', null, q.ok ? '✓ Done: ' : '○ To do: ', q.label);
    })));
    sec.appendChild(h('p', { class: 'hint' }, 'Any interpretation is welcome, including one that stayed the same. This list only checks that each step has been done, not what you wrote.'));
    if (L.history.length) sec.appendChild(h('details', { class: 'help' }, h('summary', null, 'Earlier versions of your letter (' + L.history.length + ')'),
      L.history.map(function (v) { return h('div', null, h('p', { class: 'hint' }, v.sentAt ? 'Sent ' + fmt(v.sentAt) : 'Earlier version'), h('pre', { class: 'letter' }, v.text)); })));
    LETTER_FIELDS.forEach(function (f) {
      var k = f[0];
      var label = k === 'message' ? 'A short message to ' + story.short + ' (optional)' : f[1];
      sec.appendChild(h('label', { for: 'letter-' + k }, label + (k === 'why' ? ' (needed to send)' : '')));
      sec.appendChild(h('textarea', { id: 'letter-' + k, 'data-key': 'letter-' + k, maxlength: String(CONFIG.MAX_TEXT), value: L[k], oninput: function (ev) { L[k] = ev.target.value; saveSoon(); } }));
    });
    sec.appendChild(h('div', { class: 'row', style: 'margin-top:10px' },
      h('button', { type: 'button', class: 'secondary', 'data-key': 'letter-preview', 'aria-expanded': ui.showPreview ? 'true' : 'false', onclick: function () { save(); ui.showPreview = !ui.showPreview; render(); } }, ui.showPreview ? 'Hide preview' : 'Preview my letter'),
      h('button', { type: 'button', class: 'gold', 'data-key': 'letter-send', onclick: sendLetter }, 'Send the letter to ' + story.short),
      L.sentAt ? h('button', { type: 'button', class: 'secondary', onclick: function () { ui.rewriting = false; pendingFocus = 'letter-heading'; render(); } }, 'Keep the letter I already sent') : null));
    if (ui.showPreview) {
      var text = composeLetter(story, st);
      sec.appendChild(h('pre', { class: 'letter', tabindex: '0', 'aria-label': 'Letter preview' }, text));
      sec.appendChild(letterTools(story, text));
    }
    return sec;
  }
  function letterTools(story, text) {
    return h('div', { class: 'row' },
      h('button', { type: 'button', class: 'secondary small', 'data-key': 'letter-copy', onclick: function () { copyText(text, 'Your letter was'); } }, 'Copy letter'),
      h('button', { type: 'button', class: 'secondary small', 'data-key': 'letter-download', onclick: function () { downloadText('letter-to-' + story.short.toLowerCase() + '.txt', text); say('Your letter was downloaded as a text file.'); } }, 'Download as a text file'),
      h('button', { type: 'button', class: 'secondary small', 'data-key': 'letter-print', onclick: function () { printLetter(text); } }, 'Print letter'));
  }

  function doneSection(story, st) {
    var others = STORIES.filter(function (s) { return s.id !== story.id; });
    return h('section', { class: 'card', 'aria-labelledby': 'done-h', style: 'border:3px solid var(--gold)' },
      h('h2', { id: 'done-h', 'data-key': 'done-heading', tabindex: '-1' }, 'The door closes softly'),
      h('p', { class: 'speak', style: 'font-size:1.15rem' }, h('strong', null, story.short + ': '), '“' + story.closing + '”'),
      h('p', null, 'The print never changed. Your margins grew.'),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'secondary', 'data-key': 'done-read', onclick: function () { pendingFocus = 'printed-heading'; render(); } }, 'Read the story again'),
        h('button', { type: 'button', class: 'secondary', 'data-key': 'done-ledger', onclick: function () { pendingFocus = 'ledger-heading'; render(); } }, 'Reopen the ledger'),
        h('button', { type: 'button', class: 'secondary', 'data-key': 'done-letter', onclick: function () { pendingFocus = 'letter-heading'; render(); } }, 'Revisit the letter'),
        others.map(function (s) { return h('button', { type: 'button', class: 'secondary', 'data-key': 'done-try-' + s.id, onclick: function () { openStory(s.id); } }, 'Try ', h('cite', null, s.title)); }),
        h('a', { class: 'btn secondary', href: CONFIG.COLLECTION_URL, 'data-key': 'done-collection' }, 'Return to the Gradortals collection')));
  }

  /* ================= BOOT ================= */
  function boot() {
    document.getElementById('collection-link').setAttribute('href', CONFIG.COLLECTION_URL);
    document.getElementById('import-file').addEventListener('change', function (ev) { handleImportFile(ev.target.files && ev.target.files[0]); });
    state = load();
    if (state.current && state.stories[state.current] && state.stories[state.current].started) ui.view = 'story';
    renderBanner();
    render();
    if (lastWritten) say('Welcome back. Your saved work was restored.');
  }
  /*@@TEST_HOOK_START*/
  window.__DQ_TEST__ = { config: CONFIG, stories: STORIES, getState: function () { return JSON.parse(JSON.stringify(state)); } };
  /*@@TEST_HOOK_END*/
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
