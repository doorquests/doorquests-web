<style>:root{

  --ivory:#f4ecda; --muted:#c3c9d8; --dim:#9aa6c0; --gold:#d8b46a; --gold2:#f0d595; --goldInk:#1c1406;
  --brass:#c9a35a; --brass2:#e9cf8f; --brassDk:#7a5a22;
  --parch:#f3ead2; --parchInk:#2a2215; --parchLine:#d6c69c; --parchDim:#5d5038;
  --ok:#8fe0b5; --okInk:#0f3a26; --bad:#ff9d8a; --badInk:#5a1408; --warn:#f0c86a; --info:#a9b8ff;
  --radius:14px; --shadow:0 18px 40px rgba(0,0,0,.45);
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fs:16px;
}
html.large{--fs:18.5px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--ivory)}
body{font-family:var(--body);font-size:var(--fs);line-height:1.55;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1200px 700px at 50% -10%,#1b2850 0%,var(--night) 45%,var(--ink) 100%) fixed}
a{color:var(--gold2)} a:hover{color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:var(--goldInk);padding:8px 12px;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
.proto{background:repeating-linear-gradient(45deg,#3a2a08,#3a2a08 12px,#2e2106 12px,#2e2106 24px);color:var(--gold2);text-align:center;
  font-size:.82rem;font-weight:700;letter-spacing:.04em;padding:6px 12px;border-bottom:1px solid #5a4410}
header.top{position:sticky;top:0;z-index:40;background:rgba(10,16,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ivory);margin-right:auto}
.brand-mark{font-size:1.6rem;color:var(--gold)}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-kicker{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.brand-name{font-family:var(--display);font-size:1.3rem;font-weight:700}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.92rem;min-height:40px}
.nav button:hover{color:#fff;border-color:var(--line2)}
.nav button[aria-current="page"]{color:var(--goldInk);background:var(--gold);border-color:var(--gold)}
.storage-note{max-width:1240px;margin:10px auto 0;padding:10px 14px;border:1px solid var(--warn);border-radius:10px;color:var(--warn);background:#2b2210}
main{max-width:1240px;margin:0 auto;padding:20px 16px 40px;outline:none}
.foot{text-align:center;color:var(--dim);font-size:.85rem;padding:20px 16px 34px;border-top:1px solid var(--line)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:.2em 0 .4em}
h1{font-size:clamp(2rem,4.6vw,3.1rem)} h2{font-size:1.75rem} h3{font-size:1.35rem}
h4{margin:.4em 0;font-size:1rem}
p{margin:.45em 0 .8em}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.lead{font-size:1.08rem;color:var(--muted);max-width:68ch}
.muted{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:999px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--ivory);font-weight:700;cursor:pointer;text-decoration:none;font-size:.96rem}
.btn:hover{border-color:var(--gold);color:#fff}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--goldInk);border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.06);color:var(--goldInk)}
.btn.small{min-height:36px;padding:5px 12px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{border-color:#7a3022;color:var(--bad)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line2);color:var(--muted)}
.pill.ok{color:var(--okInk);background:var(--ok);border-color:var(--ok)}
.pill.lock{color:var(--dim)}
.pill.open{color:var(--goldInk);background:var(--gold2);border-color:var(--gold2)}

/* door */
.door-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;min-height:62vh}
@media (max-width:820px){.door-wrap{grid-template-columns:minmax(0,1fr)}}
.door-art{display:flex;justify-content:center}
.door-art svg{width:min(340px,80vw);height:auto}
.door-art .leaf{transform-origin:62px 50%;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.door-art.opening .leaf{transform:perspective(600px) rotateY(-70deg)}
.tagline{font-family:var(--display);font-style:italic;font-size:1.45rem;color:var(--gold2)}

/* map */
.rooms{display:grid;gap:18px}
.room h2{margin-bottom:.1em}
.room .theme{color:var(--dim);margin:0 0 10px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.casecard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);
  background:var(--panel);cursor:pointer;min-height:96px;color:var(--ivory)}
.casecard:hover{border-color:var(--gold)}
.casecard[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.casecard .no{font-size:.75rem;color:var(--dim);font-weight:700;letter-spacing:.08em}
.casecard .t{font-family:var(--display);font-size:1.18rem;font-weight:700;line-height:1.15}

/* case */
.case-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.brief{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.brief{grid-template-columns:minmax(0,1fr)}}
.ask{font-family:var(--display);font-size:1.4rem;color:var(--gold2);font-weight:700;margin:.3em 0}
.domain{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(216,180,106,.08);border-radius:0 8px 8px 0}
.domain h3{font-family:var(--body);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.domain ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.part{margin-top:18px}
.part > h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bench svg{width:100%;height:auto;display:block;background:radial-gradient(ellipse at 50% 30%,#22305a 0%,#141e38 70%);border-radius:12px;border:1px solid var(--line)}
.beam{transition:transform 1.25s cubic-bezier(.34,1.45,.5,1)}
.pan{transition:transform 1.25s cubic-bezier(.34,1.45,.5,1)}
.needle{transition:transform 1s cubic-bezier(.34,1.3,.5,1)}
html.still .beam,html.still .pan,html.still .needle,html.still .door-art .leaf{transition:none!important}
.balance-text{font-size:.94rem;color:var(--muted);margin:8px 2px}
.state-line{font-weight:700;color:var(--ivory)}
.tray{display:grid;gap:6px;margin-top:10px}
.tray-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.tray-row .nm{font-weight:600}
.tray-row .ct{color:var(--dim);font-size:.86rem;font-weight:400}
.tray-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.coin-tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pans.single{grid-template-columns:1fr}
.panbox{border:1px dashed var(--line2);border-radius:10px;padding:8px;min-height:64px}
.panbox h4{margin:0 0 6px;font-size:.86rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.panbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.panbox li{display:flex;justify-content:space-between;align-items:center;gap:6px}
.release-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.seals{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:.92rem}
.seal{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e0574a,#8e1e16);border:1px solid #5d130d;display:inline-block}
.seal.used{background:none;border:1px dashed var(--line2)}
.msg{padding:8px 12px;border-radius:10px;margin:8px 0;font-size:.95rem}
.msg.err{background:#3a1710;border:1px solid #7a3022;color:var(--bad)}
.msg.ok{background:#0f2c1f;border:1px solid #2f7a55;color:var(--ok)}
.msg.note{background:#1b2547;border:1px solid var(--line2);color:var(--muted)}

/* ledger (parchment) */
.ledger{background:var(--parch);color:var(--parchInk);border-radius:12px;padding:14px 16px;border:1px solid var(--parchLine);
  box-shadow:inset 0 0 40px rgba(120,90,30,.15)}
.ledger h3{color:var(--parchInk);margin-top:0}
.ledger ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ledger li{border-bottom:1px solid var(--parchLine);padding-bottom:8px}
.ledger .lno{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--parchDim)}
.ledger .eq{font-family:Georgia,"Times New Roman",serif;font-size:1.12rem;font-weight:700;color:#1c160c}
.ledger .eq2{font-family:Georgia,serif;color:#3b2f17}
.ledger .concl{font-weight:700;color:#1d5a37}
.ledger .words{font-size:.9rem;color:var(--parchDim)}
.ledger .empty{color:var(--parchDim);font-style:italic}
.ledger .tag{display:inline-block;font-size:.72rem;font-weight:800;padding:1px 7px;border-radius:999px;background:#e6d8b2;color:#4a3c1d;margin-left:6px}

/* certificate */
.cert{margin-top:14px}
.goal{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.02)}
.goal label.lbl{font-weight:700;display:block;margin-bottom:4px}
.goal input[type=text],.goal select,.qa input[type=text],.design input{background:#0c1430;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:42px;min-width:0;width:11em;max-width:100%}
.goal .echo{font-size:.86rem;color:var(--dim);margin-top:4px}
.goal .result{margin-top:6px}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;min-height:36px}
.chk input{width:20px;height:20px}
.res-ok{color:var(--ok);font-weight:700}
.res-bad{color:var(--bad);font-weight:700}
.res-mid{color:var(--warn);font-weight:700}
.witness{margin:6px 0 0;padding:8px 10px;border-radius:8px;background:#0f1733;border:1px solid var(--line);font-size:.92rem}
.order-sel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.order-sel select{width:auto}
.radios{display:flex;flex-direction:column;gap:4px}

/* side tools */
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px}
@media (max-width:820px){.tools{grid-template-columns:minmax(0,1fr)}}
textarea.notes{width:100%;min-height:110px;background:#0c1430;border:1px solid var(--line2);border-radius:10px;padding:10px}
.hint{border-left:3px solid var(--info);padding:6px 10px;margin:6px 0;background:rgba(169,184,255,.07);border-radius:0 8px 8px 0}
.insight{border:1px solid var(--gold);background:linear-gradient(180deg,#2a2412,#171a2c);border-radius:var(--radius);padding:16px 18px;margin-top:18px}
.kind{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--gold);color:var(--goldInk)}

/* tree */
.tnode{border:1px solid var(--line2);border-radius:12px;padding:10px;margin:8px 0;background:rgba(255,255,255,.02)}
.tnode .tnode{margin-left:6px}
.tnode h4{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cnt{font-size:.82rem;font-weight:700;padding:1px 8px;border-radius:999px;background:#1d2a52;color:var(--muted)}
.cnt.zero{opacity:.6}
.coinset{border:0;padding:0;margin:4px 0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.coinset legend{font-size:.84rem;color:var(--dim);font-weight:700;margin-right:6px;float:left}
.coinset label{display:inline-flex;gap:3px;align-items:center;min-height:32px;cursor:pointer}
.coinset input{width:18px;height:18px}
details.branch{margin:6px 0 0 4px;border-left:2px solid var(--line2);padding-left:10px}
details.branch > summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:.82rem;color:var(--dim)}
.tstat{font-size:.86rem}
.leafrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leafrow select{background:#0c1430;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;min-height:38px}

/* design */
.design .wts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.design input{width:5.5em}
.strip{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px;margin:10px 0}
.strip span{font-size:.62rem;text-align:center;padding:3px 0;border-radius:3px;background:#2a1a1a;color:#ffb3a5}
.strip span.on{background:#163a2a;color:var(--ok)}

/* questions */
.qa{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin:8px 0}
.qa .q{font-weight:700;margin:0 0 6px}
.qa .radios label{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:8px;cursor:pointer}
.qa .radios label:hover{background:rgba(255,255,255,.04)}
.qa .radios input{margin-top:4px;width:18px;height:18px;flex:none}

/* keyring */
.keyring{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:96px;background:var(--panel)}
.slot.active{border-color:var(--gold);background:linear-gradient(180deg,#2a2412,var(--panel))}
.slot .sid{font-weight:800;font-size:.8rem;letter-spacing:.08em;color:var(--dim)}
.slot.reserved{opacity:.5}
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0}
.mark{border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.mark .sym{font-size:1.8rem;line-height:1;color:var(--dim);width:36px;text-align:center}
.mark.earned{border-color:var(--gold)}
.mark.earned .sym{color:var(--gold2)}
.certlist{display:grid;gap:10px}
.certitem{border:1px solid var(--parchLine);background:var(--parch);color:var(--parchInk);border-radius:12px;padding:12px 14px}
.certitem h3{color:var(--parchInk);margin:0 0 4px;font-size:1.2rem}
.certitem .seal{float:right;margin-left:8px;width:28px;height:28px}
table.simple{border-collapse:collapse;width:100%;font-size:.94rem}
table.simple th,table.simple td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.helpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.helpgrid{grid-template-columns:minmax(0,1fr)}}
.setting{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.setting select{background:#0c1430;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;min-height:40px}
@media (max-width:560px){
  header.top{position:static}
  .nav button{padding:6px 9px;font-size:.86rem}
  .card{padding:14px}
  .strip{grid-template-columns:repeat(10,minmax(0,1fr))}
  .pans{grid-template-columns:1fr}
  .btn.small{min-height:44px}
  .coinset label,.chk{min-height:44px}
  .coinset input,.chk input{width:22px;height:22px}
}

.tryit{border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;margin:0 0 10px;color:var(--gold2);font-weight:600}
</style>
</head>

        c.entries.forEach((e, i) => { h += '<label class="chk"><input type="radio" name="' + id + '" value="' + i + '"' + (a.e === i && !a.u ? ' checked' : '') + '> ' + (c.id === 'w20' ? 'Note ' : 'Entry ') + (i + 1) + '</label>'; });
        h += '<label class="chk"><input type="radio" name="' + id + '" value="u"' + (a.u ? ' checked' : '') + '> Cannot be determined</label></div></fieldset>';
      } else if (g.kind === 'order') {
        h += '<fieldset style="border:0;padding:0;margin:0"><legend class="lbl" style="font-weight:700">' + esc(g.label) + '</legend><div class="order-sel">';
        for (let p = 0; p < g.vars.length; p++) {
          h += '<label class="sr-only" for="' + id + '-' + p + '">Position ' + (p + 1) + (p === 0 ? ' (lightest)' : p === g.vars.length - 1 ? ' (heaviest)' : '') + '</label><select id="' + id + '-' + p + '" data-pos="' + p + '"><option value="">—</option>' +
            g.vars.map((v) => '<option value="' + v + '"' + (a.o && a.o[p] === v ? ' selected' : '') + '>' + esc(E.item(c, v).label) + '</option>').join('') + '</select>' + (p < g.vars.length - 1 ? '<span aria-hidden="true">&lt;</span>' : '');
        }
        h += '</div><p class="muted" style="margin:4px 0 0">Lightest on the left, heaviest on the right.</p></fieldset>';
      } else {
        h += '<label class="lbl" for="' + id + '">' + esc(g.label) + (g.unit ? ' (' + esc(g.unit) + ')' : '') + '</label><div class="row"><input type="text" id="' + id + '" inputmode="decimal" autocomplete="off" spellcheck="false" value="' + esc(a.raw || '') + '"' + (a.u ? ' disabled' : '') + ' aria-describedby="' + id + '-echo">' +
          '<label class="chk"><input type="checkbox" id="' + id + '-u"' + (a.u ? ' checked' : '') + '> Cannot be determined</label></div><div class="echo" id="' + id + '-echo">' + echoFor(c, g, a.raw || '') + '</div>';
      }
      h += '<div class="result" id="' + id + '-res" aria-live="polite">' + (ui.results[g.id] || '') + '</div></div>';
    }
    return h + '<div class="row"><button class="btn primary" type="submit">Submit certificate</button></div><div id="certSummary" aria-live="polite">' + (ui.results._summary || '') + '</div></form>';
  }
  function echoFor(c, g, raw) {
    if (!raw.trim()) return '';
    const p = E.parseNumber(raw, { allowNegative: !!g.allowNegative });
    if (!p.ok) return p.error === 'zeroDen' ? 'A fraction can’t have 0 underneath.' : p.error === 'negative' ? 'Masses can’t be negative.' : 'Not a number I can read. Try 7, 2.5, 5/2 or 2 1/2.';
    const f = E.fmtQ(p.value), m = E.fmtMixed(p.value);
    return 'Reads as ' + esc(f) + (m !== f ? ' (' + esc(m) + ')' : '') + (g.unit ? ' ' + esc(g.unit) : '') + '.';
  }
  function readCert(c) {
    const k = cs(c.id); const answers = {};
    for (const g of c.goals) {
      const id = 'g-' + g.id; const a = { raw: '', u: false, e: null, o: null };
      if (g.kind === 'falseEntry') { const r = $('input[name="' + id + '"]:checked'); if (r) { if (r.value === 'u') a.u = true; else a.e = parseInt(r.value, 10); } }
      else if (g.kind === 'order') { a.o = g.vars.map((v, p) => $('#' + id + '-' + p).value); }
      else { a.raw = $('#' + id).value; a.u = $('#' + id + '-u').checked; }

      else if (g.kind === 'falseEntry') answers[g.id] = a.e === null ? {} : { e: a.e };
      else if (g.kind === 'order') answers[g.id] = a.o.every((x) => x) ? { o: a.o.slice() } : {};
      else { const p = E.parseNumber(a.raw, { allowNegative: !!g.allowNegative }); answers[g.id] = p.ok ? { v: E.qkey(p.value) } : {}; }
    }
    persist();
    return answers;
  }
  function worldText(c, w) {
    if (!w) return '';
    if (c.distinct) return c.vars.slice().sort((a, b) => w[a.id] - w[b.id]).map((v) => v.label).join(' < ');
    const parts = c.vars.map((v) => (v.sym || v.id) + ' = ' + E.fmtQ(E.Q(w[v.id], v.den || c.massDen || 1)) + ' ' + (v.unit || 'g'));
    if (w._false !== undefined) parts.push((c.id === 'w20' ? 'note ' : 'entry ') + (w._false + 1) + ' false');
    return parts.join(', ');
  }
  function valueText(c, g, key) {
    if (g.kind === 'falseEntry') return (c.id === 'w20' ? 'note ' : 'entry ') + (parseInt(key, 10) + 1);
    if (g.kind === 'order') return key.split('<').map((v) => E.item(c, v).label).join(' < ');
    const q = E.qFromKey(key); return E.fmtQ(q) + (g.unit === 'g' ? ' g' : '');
  }
  function outWords(c, inst, out) {
    if (inst.type === 'spring') return 'a reading of ' + E.fmtQ(E.springReadingQ(c, out));
    if (out === '=' || out === 'd0') return '“level”';
    if (out === '>') return '“left heavier”'; if (out === '<') return '“right heavier”';
    if (out === '>>') return '“left heavier beyond the rider’s scale”'; if (out === '<<') return '“right heavier beyond the rider’s scale”';
    const d = parseInt(out.slice(1), 10); return '“' + (d > 0 ? 'left' : 'right') + ' heavier by ' + Math.abs(d) + ' g”';
  }
  function resultHTML(c, g, r, ans) {
    const claim = ans && !ans.u ? (g.kind === 'falseEntry' ? ans.e : g.kind === 'order' ? (ans.o || []).join('<') : ans.v) : null;
    const claimTxt = claim !== null && claim !== undefined ? valueText(c, g, String(claim)) : '';
    const lab = esc(g.label);
    switch (r.status) {
      case 'correct':
        if (ans.u) return '<p class="res-ok">✓ Correct: the evidence cannot settle ' + lab.toLowerCase() + '.</p>' + (r.witness ? '<p class="witness">Two worlds fit every entry:<br>World 1: ' + esc(worldText(c, r.witness[0])) + '<br>World 2: ' + esc(worldText(c, r.witness[1])) + '</p>' : '');
        return '<p class="res-ok">✓ Certified: ' + esc(claimTxt) + '.</p>';
      case 'correctSoFar': return '<p class="res-mid">True for now: your weighings don’t settle this yet. The certificate needs a value, so weigh again.</p>' + (r.witness ? '<p class="witness">Still possible: ' + esc(worldText(c, r.witness[0])) + ' — or ' + esc(worldText(c, r.witness[1])) + '.</p>' : '');
      case 'settled': return '<p class="res-mid">Your evidence already settles this. Work it out from the ledger.</p>';
      case 'notProven': return '<p class="res-mid">Possible, but not proven. ' + esc(claimTxt) + ' fits your evidence, but so does another answer.</p><p class="witness">Fits everything: ' + esc(worldText(c, r.witness[0])) + '<br>Also fits everything: ' + esc(worldText(c, r.witness[1])) + '</p>';
      case 'contradicts': {
        const w = r.why || {};
        let why = 'No world fits all the evidence with that answer.';
        if (w.at === 'domain') why = 'That answer is impossible here: ' + c.domain;
        else if (w.at === 'obs') why = 'If it were ' + claimTxt + ', weighing ' + (w.index + 1) + ' would have shown ' + outWords(c, c.instrument, w.would) + '. It showed ' + outWords(c, c.instrument, w.observed) + '.';
        else if (w.at === 'entry') why = 'If it were ' + claimTxt + ', entry ' + (w.index + 1) + ' could not be true.';
        else if (w.at === 'entries') why = 'With that answer, no single false ' + (c.id === 'w20' ? 'note' : 'entry') + ' can explain the ledger.';
        return '<p class="res-bad">✗ That contradicts the evidence. ' + esc(why) + '</p>';
      }
      default: return '<p class="res-bad">Enter an answer, or tick “cannot be determined”.</p>';
    }
  }
  function submitCert(c, partIndex) {
    const answers = readCert(c); const k = cs(c.id);
    const obs = c.parts[partIndex].type === 'evidence' ? [] : k.attempt.obs;
    const chk = E.checkCertificate(c, obs, answers);
    ui.results = {};
    for (const g of c.goals) ui.results[g.id] = resultHTML(c, g, chk.results[g.id], answers[g.id]);
    if (chk.ok) {
      k.parts[partIndex] = cleanProof(c.parts[partIndex], { obs: obs.map((x) => E.cleanCfg(x)), cert: answers });
      ui.results._summary = '<p class="msg ok">Certificate accepted and sealed.</p>';
    } else ui.results._summary = '<p class="msg note">Not yet. Each line above says what the evidence does and doesn’t show.</p>';

  }
  function afterSubmit(c, msg) {

    go('case', c.id, { keepResults: true });
    window.scrollTo(0, pos);
    const f = focusId && document.getElementById(focusId); if (f) f.focus({ preventScroll: true });
    say(msg + (solved(c.id) && !was ? ' Investigation certified.' : ''));
    if (solved(c.id) && !was) { const ib = $('#insightBox'); if (ib) ib.scrollIntoView({ block: 'start', behavior: still() ? 'auto' : 'smooth' }); }
  }

  /* ---------------- interval ---------------- */
  function intervalForm(c) {
    const k = cs(c.id); const p = c.interval;
    return '<h3>Certificate</h3><p class="muted">State an interval your weighings guarantee: the sachet weighs between L and U grams, inclusive. It must be no wider than ' + esc(E.fmtQ(E.qFromKey(p.width))) + ' g. Exact fractions such as 7/3 are welcome.</p>' +
      '<form id="intForm" novalidate><div class="goal"><div class="row"><label class="lbl" for="intL" style="margin:0">From L =</label><input type="text" id="intL" value="' + esc(k.interval.L) + '" autocomplete="off" aria-describedby="intL-echo"><label class="lbl" for="intU" style="margin:0">to U =</label><input type="text" id="intU" value="' + esc(k.interval.U) + '" autocomplete="off" aria-describedby="intU-echo"> g</div>' +
      '<div class="echo" id="intL-echo">' + echoFor(c, { unit: 'g' }, k.interval.L) + '</div><div class="echo" id="intU-echo">' + echoFor(c, { unit: 'g' }, k.interval.U) + '</div><div class="result" id="intRes" aria-live="polite">' + (ui.results.int || '') + '</div></div>' +
      '<button class="btn primary" type="submit">Submit certificate</button></form>';
  }
  function submitInterval(c) {
    const k = cs(c.id); k.interval.L = $('#intL').value; k.interval.U = $('#intU').value; persist();
    const pl = E.parseNumber(k.interval.L), pu = E.parseNumber(k.interval.U);
    if (!pl.ok || !pu.ok) { ui.results.int = '<p class="res-bad">Enter both ends as numbers or fractions.</p>'; afterSubmit(c, 'Certificate returned.'); return; }
    const r = E.checkInterval(c, k.attempt.obs, E.qkey(pl.value), E.qkey(pu.value));
    const F = (q) => E.fmtQ(q);
    let h;
    if (r.status === 'correct') { h = '<p class="res-ok">✓ Certified: ' + F(pl.value) + ' g to ' + F(pu.value) + ' g, width ' + F(r.width) + ' g.</p>'; k.parts[0] = { obs: k.attempt.obs.map((x) => E.cleanCfg(x)), L: E.qkey(pl.value), U: E.qkey(pu.value) }; }
    else if (r.status === 'reversed') h = '<p class="res-bad">The lower end is above the upper end.</p>';
    else if (r.status === 'noUpper') h = '<p class="res-mid">Your weighings don’t give the sachet an upper limit yet. Nothing has outweighed it.</p>';
    else if (r.status === 'unsupported') h = '<p class="res-bad">✗ Not proven: a sachet of ' + F(r.example) + ' g would give exactly the results you saw, and it lies outside your interval.</p>';
    else if (r.status === 'tooWide') h = '<p class="res-mid">True, but ' + F(r.width) + ' g wide. The duty office needs ' + F(E.qFromKey(c.interval.width)) + ' g or narrower.</p>';
    else h = '<p class="res-bad">Enter both ends.</p>';
    ui.results.int = h; afterSubmit(c, r.status === 'correct' ? 'Certificate accepted.' : 'Certificate returned.');
  }

  /* ---------------- practice (adversary) ---------------- */
  function practiceState(c) {
    const k = cs(c.id); let alive = E.buildWorlds(c); const outs = [];
    for (const cfg of k.practice.obs) { const r = E.adversaryOutcome(c, alive, E.cleanCfg(cfg)); outs.push(r.outcome); alive = r.alive; }
    return { alive: alive, outs: outs };
  }
  function practiceLedger(c) {
    const k = cs(c.id); const st = practiceState(c);
    let h = '<h3>The Assayer’s game</h3><p class="words">Suspects still possible: <strong>' + st.alive.length + '</strong> — ' + esc(st.alive.map((w) => oddLabel(w._odd)).join(', ')) + '</p>';
    if (k.practice.obs.length) {
      h += '<ol>'; k.practice.obs.forEach((cfg, i) => { const d = E.describe(c, cfg, st.outs[i]); h += '<li><span class="lno">Weighing ' + (i + 1) + '</span><div class="eq">' + esc(d.eq) + '</div><div class="words">' + esc(d.short) + '</div></li>'; }); h += '</ol>';
    }
    if (st.alive.length === 1) h += '<p class="concl">Only ' + esc(oddLabel(st.alive[0]._odd)) + ' remains. The Assayer concedes.</p>';
    else if (k.practice.obs.length >= c.seals) h += '<p class="words"><strong>Out of weighings.</strong> The Assayer can still choose between ' + st.alive.length + ' possibilities, so she wins this round.</p>';
    return h;
  }
  function oddLabel(o) { const m = /^(\d+)([HL])$/.exec(o); return 'coin ' + m[1] + (m[2] === 'H' ? ' heavy' : ' light'); }

  /* ---------------- strategy tree ---------------- */
  function treeIntro(c) {
    return '<p class="muted">Write the whole plan in advance. Choose the coins for each weighing, and the next weighing after each possible result. Then say what you will conclude at the end of each path. Counts show how many of the ' + E.buildWorlds(c).length + ' possibilities reach each point. Aim for at most ' + Math.pow(3, c.tree.depth - 1) + ' after the first weighing' + (c.tree.depth > 2 ? ', at most 3 after the second' : '') + ', and exactly one at each conclusion.</p>';
  }
  function draftTree(c) { const k = cs(c.id); if (!k.tree) k.tree = E.sanitizeTree(c, null); return k.tree; }
  function nodeAt(t, path) { let n = t; for (const ch of path) n = n.k[ch]; return n; }
  const OUTNAME = { '<': 'If the right pan sinks', '=': 'If the beam is level', '>': 'If the left pan sinks' };
  function treeHTML(c) {
    const t = draftTree(c); const ev = E.treeEval(c, t);
    const reach = reachMap(c, t);
    const rec = (n, path, d) => {
      const cnt = ev.counts[path] || 0; const who = (reach[path] || []).map(oddLabel).join(', ');
      if (d === c.tree.depth) {
        const opts = ['<option value="">— choose a conclusion —</option>'];
        for (let i = 1; i <= c.coins.n; i++) { opts.push('<option value="' + i + 'H"' + (n.v === i + 'H' ? ' selected' : '') + '>Coin ' + i + ' is heavy</option>'); if (c.coins.light) opts.push('<option value="' + i + 'L"' + (n.v === i + 'L' ? ' selected' : '') + '>Coin ' + i + ' is light</option>'); }
        return '<div class="leafrow"><label for="leaf-' + pid(path) + '">Conclusion</label><select id="leaf-' + pid(path) + '" data-leaf="' + path + '">' + opts.join('') + '</select><span class="cnt' + (cnt ? '' : ' zero') + '" data-cnt="' + path + '">' + cnt + ' possible</span><span class="who" data-who="' + path + '">' + esc(who || (cnt ? '' : 'no possibility reaches here')) + '</span></div>';
      }
      const label = 'Weighing ' + (d + 1) + (path ? ' after ' + path.split('').map((x) => ({ '<': 'right sinks', '=': 'level', '>': 'left sinks' }[x])).join(', then ') : '');
      let h = '<div class="tnode" data-node="' + path + '"><h4>' + esc(label) + ' <span class="cnt' + (cnt ? '' : ' zero') + '" data-cnt="' + path + '">' + cnt + ' possible</span></h4>' +
        '<p class="who" data-who="' + path + '">' + esc(who) + '</p>' + coinSet(c, n, path, 'L') + coinSet(c, n, path, 'R') + '<p class="tstat" data-tstat="' + path + '">' + weighStatus(c, n) + '</p>';

      }
      return h + '</div>';
    };
    return rec(t, '', 0);
  }
  const pid = (path) => path.replace(/</g, 'l').replace(/>/g, 'g').replace(/=/g, 'e') || 'root';
  function coinSet(c, n, path, side) {
    let h = '<fieldset class="coinset"><legend>' + (side === 'L' ? 'Left pan' : 'Right pan') + '</legend>';
    for (let i = 1; i <= c.coins.n; i++) { const on = n[side].indexOf(i) >= 0; h += '<label><input type="checkbox" data-coin="' + i + '" data-side="' + side + '" data-path="' + path + '"' + (on ? ' checked' : '') + '><span>' + i + '</span></label>'; }
    return h + '</fieldset>';
  }
  function weighStatus(c, n) {
    const e = E.treeWeighingError(c, n);

    if (e === 'unequal') return '<span class="res-bad">' + n.L.length + ' against ' + n.R.length + ': use equal numbers of coins.</span>';

  }
  function reachMap(c, t) {

    return m;
  }
  function refreshTreeCounts(c) {
    const t = draftTree(c); const ev = E.treeEval(c, t); const reach = reachMap(c, t);
    $$('[data-cnt]').forEach((el) => { const n = ev.counts[el.dataset.cnt] || 0; el.textContent = n + ' possible'; el.classList.toggle('zero', !n); });
    $$('[data-who]').forEach((el) => { const p = el.dataset.who; const list = (reach[p] || []).map(oddLabel).join(', '); el.textContent = list || (p.length === c.tree.depth ? 'no possibility reaches here' : ''); });
    $$('[data-tstat]').forEach((el) => { el.innerHTML = weighStatus(c, nodeAt(t, el.dataset.tstat)); });
  }
  function checkTree(c, partIndex) {
    const k = cs(c.id); const t = draftTree(c); const ev = E.treeEval(c, t);
    let h;
    if (ev.ok) { k.parts[partIndex] = { tree: JSON.parse(JSON.stringify(t)) }; h = '<p class="msg ok">✓ Your plan gives the right conclusion for all ' + ev.total + ' possibilities. Plan certified.</p>'; }
    else {
      const bad = ev.results.filter((r) => r.fail);
      h = '<div class="msg err"><p style="margin:0 0 6px"><strong>The plan fails for ' + bad.length + ' of ' + ev.total + ' possibilities.</strong></p><ul style="margin:0;padding-left:18px">' + bad.slice(0, 8).map((r) => '<li>' + esc(cap(oddLabel(r.world))) + ': ' + esc(failText(c, r)) + '</li>').join('') + (bad.length > 8 ? '<li>… and ' + (bad.length - 8) + ' more.</li>' : '') + '</ul></div>';

  }
  function failText(c, r) {
    const steps = r.fail.at.split('').map((x) => ({ '<': 'right sinks', '=': 'level', '>': 'left sinks' }[x]));
    const where = steps.length ? 'after ' + steps.join(', then ') : 'at the first weighing';
    if (r.fail.err === 'wrongVerdict') return where + ', your plan concludes ' + oddLabel(r.fail.verdict) + '.';
    if (r.fail.err === 'noVerdict') return where + ', your plan has no conclusion.';
    return 'the weighing ' + where.replace('after', 'after') + ' is not set up yet (equal numbers of coins on each pan).';
  }

  /* ---------------- design ---------------- */
  function designHTML(c, p, i) {
    const k = cs(c.id); if (!k.design) k.design = { vals: p.count ? Array(p.count).fill('') : ['', '', ''] };
    const vals = k.design.vals;
    let h = '<div class="card design" data-design="' + i + '"><p>' + esc(p.prompt) + '</p><div class="wts" role="group" aria-label="Your weights">';
    vals.forEach((v, j) => { h += '<label class="sr-only" for="dw' + j + '">Weight ' + (j + 1) + ' in grams</label><input type="text" inputmode="numeric" id="dw' + j + '" data-dw="' + j + '" value="' + esc(v) + '" placeholder="g"> '; });
    if (!p.count) h += '<button class="btn small" type="button" id="dwAdd"' + (vals.length >= 8 ? ' disabled' : '') + '>Add a weight</button><button class="btn small" type="button" id="dwDel"' + (vals.length <= 1 ? ' disabled' : '') + '>Remove one</button>';
    h += '</div><div id="cover">' + coverHTML(c, p) + '</div><div class="row"><button class="btn primary" type="button" id="dwSubmit">Submit this design</button></div><div id="dres" aria-live="polite">' + (ui.results.design || '') + '</div></div>';
    return h;
  }
  function designWeights(c) { const k = cs(c.id); return k.design.vals.map((v) => /^\s*\d{1,3}\s*$/.test(v) ? parseInt(v, 10) : null); }
  function coverHTML(c, p) {
    const ws = designWeights(c); if (ws.some((x) => x === null || x < 1)) return '<p class="muted">Enter whole-gram weights in every box to see what they can measure.</p>';
    const cov = new Set(E.coverage(ws, p.mode)); let cells = ''; const miss = [];
    for (let m = 1; m <= p.target; m++) { const on = cov.has(m); if (!on) miss.push(m); cells += '<span class="' + (on ? 'on' : '') + '" aria-hidden="true">' + m + '</span>'; }
    return '<div class="strip">' + cells + '</div><p>' + (miss.length ? 'Cannot measure: ' + esc(ranges(miss)) + '.' : 'Every whole mass from 1 to ' + p.target + ' g can be measured.') + ' (' + (p.mode === 'both' ? 'weights on both pans' : 'weights on one pan only') + ')</p>';
  }
  function ranges(a) { const out = []; let s = a[0], prev = a[0]; for (let i = 1; i <= a.length; i++) { if (a[i] === prev + 1) { prev = a[i]; continue; } out.push(s === prev ? String(s) : s + '–' + prev); s = prev = a[i]; } return out.join(', '); }
  function submitDesign(c, i) {
    const p = c.parts[i]; const ws = designWeights(c); const k = cs(c.id);
    if (ws.some((x) => x === null)) { ui.results.design = '<p class="res-bad">Every box needs a whole number of grams.</p>'; }
    else {
      const r = E.checkDesign(p, ws);
      if (r.status === 'correct') { k.parts[i] = { weights: ws.slice() }; ui.results.design = '<p class="msg ok">✓ Design certified: ' + ws.join(', ') + ' g.</p>'; }
      else if (r.status === 'missing') ui.results.design = '<p class="res-bad">✗ These weights can’t measure ' + esc(ranges(r.missing)) + ' g.</p>';
      else if (r.status === 'tooMany') ui.results.design = '<p class="res-mid">That works, but it uses ' + ws.length + ' weights. Can fewer do the job?</p>';
      else if (r.status === 'count') ui.results.design = '<p class="res-bad">Use exactly ' + p.count + ' weights.</p>';
      else ui.results.design = '<p class="res-bad">Weights must be whole grams from 1 to 200.</p>';
    }
    afterSubmit(c, partSolved(c.id, i) ? 'Design certified.' : 'Design returned.');
  }

  /* ---------------- questions ---------------- */
  function questionsHTML(c, p, i) {
    const k = cs(c.id);
    let h = '<form class="card" data-qform="' + i + '" novalidate>';
    for (const q of p.questions) {
      const v = k.qa[q.id] || ''; const id = 'q-' + q.id;
      h += '<div class="qa">';
      if (q.type === 'number') h += '<label class="q" for="' + id + '">' + esc(q.prompt) + '</label><input type="text" inputmode="numeric" id="' + id + '" value="' + esc(v) + '" autocomplete="off">';
      else { h += '<fieldset style="border:0;padding:0;margin:0"><legend class="q">' + esc(q.prompt) + '</legend><div class="radios">' + q.options.map((o) => '<label><input type="radio" name="' + id + '" value="' + o.id + '"' + (v === o.id ? ' checked' : '') + '><span>' + esc(o.text) + '</span></label>').join('') + '</div></fieldset>'; }
      h += '<div aria-live="polite" id="' + id + '-res">' + (ui.results[id] || '') + '</div></div>';
    }
    return h + '<button class="btn primary" type="submit">Submit answers</button><div id="qsum" aria-live="polite">' + (ui.results.qsum || '') + '</div></form>';
  }
  function submitQuestions(c, i) {
    const p = c.parts[i]; const k = cs(c.id); const answers = {}; let all = true;
    for (const q of p.questions) {
      const id = 'q-' + q.id; let v = '';
      if (q.type === 'number') v = $('#' + id).value; else { const r = $('input[name="' + id + '"]:checked'); v = r ? r.value : ''; }
      k.qa[q.id] = v; answers[q.id] = v;
      const r = E.checkQuestion(q, v);
      if (r.status === 'correct') ui.results[id] = '<p class="res-ok">✓ Correct.' + (r.option ? ' ' + esc(r.option.why) : '') + '</p>';
      else { all = false; ui.results[id] = r.status === 'invalid' ? '<p class="res-bad">Answer this one.</p>' : '<p class="res-bad">✗ Not quite. ' + esc(r.option ? r.option.why : (q.hint || '')) + '</p>'; }
    }
    if (all) { k.parts[i] = { answers: answers }; ui.results.qsum = '<p class="msg ok">✓ Answers certified.</p>'; } else ui.results.qsum = '';
    afterSubmit(c, all ? 'Answers certified.' : 'Some answers need another look.');
  }

  /* ---------------- binding ---------------- */
  function bindView() {
    $$('[data-case]').forEach((b) => b.addEventListener('click', () => {
      const c = byId[b.dataset.case];
      if (!isOpen(c)) { say('Locked. Certify the previous investigation first.'); return; }
      go('case', c.id);
    }));
    const eb = $('#enterBtn');
    if (eb) eb.addEventListener('click', () => {
      const art = $('#doorArt');
      if (!save.seen && art && !still()) { art.classList.add('opening'); save.seen = true; setTimeout(() => go('map'), 900); }
      else go('map');
    });
    if (ui.view === 'help') bindHelp();
  }
  function afterCase(c) {
    const k = cs(c.id); ui.solvedBefore = solved(c.id);
    const notes = $('#notes'); notes.value = k.notes; notes.addEventListener('input', () => { k.notes = notes.value.slice(0, 4000); persist(); });
    const hb = $('#hintBtn'); if (hb) hb.addEventListener('click', () => { k.hints = Math.min(c.hints.length, k.hints + 1); persist(); $('#hintList').innerHTML = hintsHTML(c); if (k.hints >= c.hints.length) hb.remove(); else hb.textContent = 'Show hint ' + (k.hints + 1) + ' of ' + c.hints.length; say('Hint ' + k.hints + ': ' + c.hints[k.hints - 1]); });
    const main = $('#main');
    main.onclick = (ev) => {
      const b = ev.target.closest('button[data-act]'); if (!b) return;
      benchAction(c, b.dataset.act, b.dataset.which, b.dataset.side, b.dataset.item, b);
    };
    const cf = $('#certForm');
    if (cf) {
      const pi = c.parts.findIndex((p) => p.type === 'bench' || p.type === 'evidence');
      cf.addEventListener('submit', (ev) => { ev.preventDefault(); submitCert(c, pi); });
      for (const g of c.goals) {
        if (g.kind !== 'value' && g.kind !== 'ratio') continue;
        const inp = $('#g-' + g.id), u = $('#g-' + g.id + '-u');
        inp.addEventListener('input', () => { $('#g-' + g.id + '-echo').innerHTML = echoFor(c, g, inp.value); const a = k.cert[g.id] || (k.cert[g.id] = {}); a.raw = inp.value.slice(0, 40); persist(); });
        u.addEventListener('change', () => { inp.disabled = u.checked; const a = k.cert[g.id] || (k.cert[g.id] = {}); a.u = u.checked; persist(); });
      }
    }
    const intf = $('#intForm');
    if (intf) {
      intf.addEventListener('submit', (ev) => { ev.preventDefault(); submitInterval(c); });
      ['L', 'U'].forEach((s) => { const inp = $('#int' + s); inp.addEventListener('input', () => { $('#int' + s + '-echo').innerHTML = echoFor(c, { unit: 'g' }, inp.value); k.interval[s] = inp.value.slice(0, 40); persist(); }); });
    }
    const tr = $('#tree');
    if (tr) {
      const pi = c.parts.findIndex((p) => p.type === 'tree');
      tr.addEventListener('change', (ev) => {
        const t = draftTree(c); const el = ev.target;
        if (el.dataset.coin) {
          const n = nodeAt(t, el.dataset.path); const coin = parseInt(el.dataset.coin, 10); const side = el.dataset.side, other = side === 'L' ? 'R' : 'L';
          n[side] = n[side].filter((x) => x !== coin); if (el.checked) { n[side].push(coin); n[side].sort((a, b) => a - b); n[other] = n[other].filter((x) => x !== coin);
            const twin = $('input[data-coin="' + coin + '"][data-side="' + other + '"][data-path="' + CSS.escape(el.dataset.path) + '"]'); if (twin) twin.checked = false; }
        } else if (el.dataset.leaf !== undefined) { nodeAt(t, el.dataset.leaf).v = el.value; }
        persist(); refreshTreeCounts(c);
      });
      $('#treeCheck').addEventListener('click', () => checkTree(c, pi));
      $('#treeClear').addEventListener('click', () => { k.tree = E.sanitizeTree(c, null); persist(); ui.results.tree = ''; go('case', c.id); });
      if (ui.results.tree) $('#treeResult').innerHTML = ui.results.tree;
    }
    $$('[data-design]').forEach((box) => {
      const i = parseInt(box.dataset.design, 10); const p = c.parts[i];
      box.addEventListener('input', (ev) => { const j = ev.target.dataset.dw; if (j === undefined) return; k.design.vals[j] = ev.target.value.slice(0, 6); persist(); $('#cover').innerHTML = coverHTML(c, p); });
      const add = $('#dwAdd'), del = $('#dwDel');
      if (add) add.addEventListener('click', () => { if (k.design.vals.length < 8) k.design.vals.push(''); persist(); go('case', c.id, { keepResults: true }); $('#dw' + (k.design.vals.length - 1)).focus(); });
      if (del) del.addEventListener('click', () => { if (k.design.vals.length > 1) k.design.vals.pop(); persist(); go('case', c.id, { keepResults: true }); $('#dwDel').focus(); });
      $('#dwSubmit').addEventListener('click', () => submitDesign(c, i));
    });
    $$('[data-qform]').forEach((f) => f.addEventListener('submit', (ev) => { ev.preventDefault(); submitQuestions(c, parseInt(f.dataset.qform, 10)); }));
  }
  function benchAction(c, act, which, side, itemId, btn) {
    const k = cs(c.id); const st = which === 'practice' ? k.practice : k.attempt; const msg = $('#bmsg-' + which);
    if (msg) msg.innerHTML = '';
    if (act === 'place' || act === 'remove') {
      const it = E.item(c, itemId); const pans = st.pans;
      if (act === 'place') { if (remaining(c, pans, it) <= 0) return; pans[side][itemId] = (pans[side][itemId] || 0) + 1; }
      else { if (!pans[side][itemId]) return; pans[side][itemId]--; if (!pans[side][itemId]) delete pans[side][itemId]; }
      st.released = false; persist(); refreshBench(c, which, false);
      say((act === 'place' ? 'Placed ' : 'Removed ') + it.label + '. ' + balanceText(c, which, true));
      const again = $('button[data-act="' + act + '"][data-side="' + side + '"][data-item="' + itemId + '"][data-which="' + which + '"]');
      if (again && !again.disabled) again.focus(); else { const r = $('#rel-' + which + ' button[data-act="release"]'); if (r) r.focus(); }
      return;
    }
    if (act === 'clear') { st.pans = E.emptyCfg(); st.released = false; persist(); refreshBench(c, which, false); say('Pans cleared.'); return; }
    if (act === 'restart') {
      st.pans = E.emptyCfg(); st.obs = []; st.released = false; persist();
      if (which === 'practice') { $('#pledger').innerHTML = practiceLedger(c); refreshBench(c, which, false); }
      else { ui.results = {}; go('case', c.id); }
      say('Started again. The ledger for this attempt is clear' + (c.seals ? ' and your seals are restored.' : '.')); return;
    }
    if (act === 'release') {
      const cfg = E.cleanCfg(st.pans); const err = E.validateCfg(c, cfg);
      if (err) { msg.innerHTML = '<p class="msg err">' + esc(err) + '</p>'; say(err); return; }
      if (c.seals !== null && c.seals !== undefined && st.obs.length >= c.seals) { msg.innerHTML = '<p class="msg err">No seals left. Start again to try a different plan.</p>'; return; }
      st.obs.push(cfg); st.released = true; persist();
      refreshBench(c, which, true);
      if (which === 'practice') $('#pledger').innerHTML = practiceLedger(c);
      else $('#ledger').innerHTML = ledgerInner(c);
      say(balanceText(c, which, true) + (sealsLeft(c, which) !== null ? ' ' + sealsLeft(c, which) + ' seals left.' : ''));
      const rb = $('#rel-' + which + ' button[data-act="release"]'); if (rb && !rb.disabled) rb.focus(); else { const r2 = $('#rel-' + which + ' button[data-act="restart"]'); if (r2) r2.focus(); }
    }
  }

  /* ---------------- gallery ---------------- */
  function viewGallery() {
    let h = '<p class="kicker">Gallery of completed certifications</p><h1>Certificates</h1>';
    const done = LEVELS.filter((c) => solved(c.id));
    if (!done.length) return h + '<p class="lead">No certificates yet. The first parcel is waiting on the counter.</p><button class="btn primary" type="button" data-nav="map">Go to the weighhouse</button>';
    h += '<p class="lead">' + done.length + ' of 20 certified. Each was re-checked from its recorded evidence when this page loaded.</p><div class="certlist">';
    for (const c of done) {
      const k = cs(c.id); const lines = [];
      c.parts.forEach((p, i) => {
        const pr = k.parts[i]; if (!pr) return;
        if (pr.cert) for (const g of c.goals) { const a = pr.cert[g.id]; lines.push(esc(g.label) + ': ' + (a.u ? 'cannot be determined' : esc(valueText(c, g, String(g.kind === 'falseEntry' ? a.e : g.kind === 'order' ? a.o.join('<') : a.v))))); }
        if (pr.L) lines.push('One sachet: between ' + E.fmtQ(E.qFromKey(pr.L)) + ' g and ' + E.fmtQ(E.qFromKey(pr.U)) + ' g');
        if (pr.tree) lines.push('A complete ' + c.tree.depth + '-weighing plan, correct in all ' + E.buildWorlds(c).length + ' cases');
        if (pr.weights) lines.push('Weight set: ' + pr.weights.join(', ') + ' g');
        if (pr.answers && c.id === 'w15') lines.push('Counting proof: 24 possibilities, 9 result sequences');
        if (pr.obs && p.type !== 'evidence') lines.push('Evidence: ' + pr.obs.length + ' weighing' + (pr.obs.length === 1 ? '' : 's'));
      });
      h += '<article class="certitem"><span class="seal" aria-hidden="true"></span><p class="lno" style="margin:0;font-weight:800;font-size:.78rem;letter-spacing:.1em;color:#5d5038">CERTIFICATE NO. ' + String(c.no).padStart(2, '0') + ' · ROOM ' + roman(c.room) + '</p><h3>' + esc(c.title) + '</h3><p style="margin:0">' + lines.join(' · ') + '</p></article>';
    }
    return h + '</div>';
  }

  /* ---------------- keyring ---------------- */
  function viewKeyring() {
    const slot = ring.slots['MATH-001'];
    let h = '<p class="kicker">Mathortals Keyring</p><h1>Keyring</h1><p class="lead">Thirty-one positions, one for each planned Mathortal. MATH-001 is active; the rest are reserved. Marks are earned only by certified work, and they are re-checked from that work every time this page loads.</p>';
    h += '<h2>MATH-001 · The Weight of Evidence</h2><div class="marks">';
    for (const m of E.MARKS) { const e = !!slot.marks[m.id]; h += '<div class="mark' + (e ? ' earned' : '') + '"><span class="sym" aria-hidden="true">' + m.sym + '</span><div><strong>' + esc(m.name) + '</strong> — ' + (e ? '<span class="res-ok">earned</span>' : '<span class="muted">not yet</span>') + '<br><span class="muted">' + esc(m.crit) + '</span></div></div>'; }
    h += '</div><h2>All positions</h2><div class="keyring" role="list">';
    for (let i = 1; i <= 31; i++) {
      const id = 'MATH-' + String(i).padStart(3, '0'); const s = ring.slots[id];
      h += '<div role="listitem" class="slot ' + (s.status === 'active' ? 'active' : 'reserved') + '"' + (s.status === 'active' ? '' : ' aria-disabled="true"') + '><div class="sid">' + id + '</div>' + (s.status === 'active' ? '<div><strong>The Weight of Evidence</strong></div><div>' + E.MARKS.map((m) => '<span aria-label="' + esc(m.name) + (s.marks[m.id] ? ' earned' : ' not earned') + '" style="opacity:' + (s.marks[m.id] ? 1 : .3) + ';font-size:1.2rem;margin-right:4px">' + m.sym + '</span>').join('') + '</div>' : '<div class="muted">Reserved</div>') + '</div>';
    }
    return h + '</div><p class="muted" style="margin-top:12px">Stored in this browser only, under its own Mathortals keys. A browser game cannot prove to anyone else who did the work, so these marks are not external certificates of skill.</p>';
  }

  /* ---------------- help ---------------- */
  function viewHelp() {
    const s = save.settings;
    return '<p class="kicker">Help &amp; settings</p><h1>How the weighhouse works</h1><div class="helpgrid"><section class="card"><h2>Playing</h2>' +
      '<ul><li>Put items on a pan with the <strong>◂ Left</strong> and <strong>Right ▸</strong> buttons, or <strong>Hook</strong> on the spring. Take them off with <strong>Remove</strong>.</li><li>The beam is locked while you load it. <strong>Release the beam</strong> to weigh. The result goes into the ledger as words and as an equation.</li>' +
      '<li>Some rooms give you a limited number of <strong>wax seals</strong>, one per release. <strong>Start again</strong> clears the attempt and restores them.</li>' +
      '<li>Submit a <strong>certificate</strong> when you can prove each answer. If the evidence can’t settle something, say so. That is an answer too, and the game shows two different worlds that fit the same evidence.</li>' +
      '<li>Everything works with a keyboard: Tab to move, Enter or Space to press. The text under each drawing says exactly what is on each pan.</li><li>There is no timer and no penalty for hints or wrong certificates.</li></ul>' +
      '<h2>Kinds of explanation</h2><ul><li><strong>Worked example</strong>: one way through, step by step.</li><li><strong>Proof</strong>: an argument that covers every possibility.</li><li><strong>Exhaustive check</strong>: a computer test of every case, which is a proof by cases.</li><li><strong>Experiment</strong> and <strong>approximation</strong> appear in later Mathortals: they suggest, but don’t prove.</li></ul></section>' +
      '<section class="card"><h2>Settings</h2><div class="setting"><label for="setMotion">Motion</label><select id="setMotion"><option value="auto"' + (s.motion === 'auto' ? ' selected' : '') + '>Follow my device</option><option value="on"' + (s.motion === 'on' ? ' selected' : '') + '>Animate the balance</option><option value="off"' + (s.motion === 'off' ? ' selected' : '') + '>No animation</option></select></div>' +
      '<div class="setting"><label class="chk"><input type="checkbox" id="setLarge"' + (s.large ? ' checked' : '') + '> Larger text</label></div>' +
      '<h2>Your progress</h2><p class="muted">Saved only in this browser, under the keys <code>dq-mathortal-001-save-v1</code> and <code>dq-mathortals-keyring-v1</code>. Nothing is sent anywhere.</p>' +
      '<div class="row"><button class="btn" type="button" id="exportBtn">Export progress</button><label class="btn" for="importFile" style="cursor:pointer">Import progress</label><input type="file" id="importFile" accept="application/json,.json" class="sr-only"></div>' +
      '<div id="ioMsg" aria-live="polite"></div><div class="row" style="margin-top:10px"><button class="btn small danger" type="button" id="resetProgress">Reset investigations (keep Keyring marks)</button><button class="btn small danger" type="button" id="resetAll">Reset everything</button></div><div id="resetConfirm"></div>' +
      
      '<h2>About this experience</h2><p><strong>Implemented:</strong> all 20 investigations in four rooms, exact fraction answers, “cannot be determined” with two-world proofs, false-entry detection, strategy-tree plans checked against every case, weight-set design, the Keyring, and export/import.</p><p><strong>Not yet built:</strong> Assay Mode (generated replay cases), drag-and-drop, MathML equation markup, and sound.</p></section></div>';
  }
  function bindHelp() {
    $('#setMotion').addEventListener('change', (e) => { save.settings.motion = e.target.value; applySettings(); persist(); say('Motion setting saved.'); });
    $('#setLarge').addEventListener('change', (e) => { save.settings.large = e.target.checked; applySettings(); persist(); });

    $('#exportBtn').addEventListener('click', () => {
      const data = JSON.stringify({ kind: 'doorquests-mathortal-001-export', v: 1, exportedAt: new Date().toISOString(), save: save, keyring: ring }, null, 1);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = 'weight-of-evidence-progress.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      $('#ioMsg').innerHTML = '<p class="msg ok">Progress exported.</p>';
    });
    $('#importFile').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      if (f.size > MAX_IMPORT) { $('#ioMsg').innerHTML = '<p class="msg err">That file is too large to be a Weight of Evidence export.</p>'; return; }
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(rd.result);
          if (!d || d.kind !== 'doorquests-mathortal-001-export' || d.v !== 1) throw new Error('kind');
          const s2 = sanitizeSave(d.save); const ring0 = ring; ring = freshRing(); const rej = d.keyring ? loadRing(d.keyring) : [];
          save = s2; applySettings(); persist(true); persistRing(); syncMarks(false);
          const n = LEVELS.filter((c) => solved(c.id)).length;
          go('help'); $('#ioMsg').innerHTML = '<p class="msg ok">Imported. ' + n + ' certified investigation' + (n === 1 ? '' : 's') + ' re-verified from their evidence.' + (rej.length ? ' Rejected marks that could not be verified: ' + esc(rej.join(', ')) + '.' : '') + '</p>';
          void ring0;
        } catch (err) { $('#ioMsg').innerHTML = '<p class="msg err">That file isn’t a valid Weight of Evidence export. Nothing was changed.</p>'; }
      };
      rd.readAsText(f);
    });
    const confirmBox = (label, fn) => { $('#resetConfirm').innerHTML = '<p class="msg err">' + esc(label) + ' This cannot be undone. <button class="btn small danger" type="button" id="yesReset">Yes, reset</button> <button class="btn small" type="button" id="noReset">Cancel</button></p>'; $('#yesReset').focus(); $('#yesReset').addEventListener('click', fn); $('#noReset').addEventListener('click', () => { $('#resetConfirm').innerHTML = ''; $('#resetProgress').focus(); }); };
    $('#resetProgress').addEventListener('click', () => confirmBox('Clear every investigation, keeping Keyring marks?', () => { const st = save.settings; save = freshSave(); save.settings = st; persist(true); go('help'); $('#ioMsg').innerHTML = '<p class="msg ok">Investigations reset. Keyring marks kept.</p>'; }));
    $('#resetAll').addEventListener('click', () => confirmBox('Clear all progress and Keyring marks for The Weight of Evidence?', () => { save = freshSave(); ring = freshRing(); store.remove(SAVE_KEY); store.remove(RING_KEY); persist(true); persistRing(); applySettings(); go('help'); $('#ioMsg').innerHTML = '<p class="msg ok">Everything reset.</p>'; }));
  }

  /* ---------------- start ---------------- */
  load(); applySettings(); if (mq && mq.addEventListener) mq.addEventListener('change', applySettings);
  showStorageNote(notices.join(' '));
  const hash = (location.hash || '').slice(1);
  if (byId[hash] && isOpen(byId[hash])) go('case', hash); else if (['map', 'gallery', 'keyring', 'help'].indexOf(hash) >= 0) go(hash); else go('door');
  window.addEventListener('beforeunload', () => persist(true));
})();
