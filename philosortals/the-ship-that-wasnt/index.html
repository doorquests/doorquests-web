<script id="ship-engine">/* ==========================================================================

    not:   { label: 'Not the same vessel',    short: 'Not the same' },
    indet: { label: 'No determinate answer',  short: 'Open' },
    verbal:{ label: 'Partly a dispute about words', short: 'Verbal' }
  };
  var OBJ_VERDICTS = {
    same:  { label: 'The same object',        short: 'Same' },
    not:   { label: 'A different object',     short: 'Different' },
    indet: { label: 'No determinate answer',  short: 'Open' },
    verbal:{ label: 'Partly a dispute about words', short: 'Verbal' }
  };
  var INST_VERDICTS = {
    same:  { label: 'The same institution',   short: 'Same' },
    not:   { label: 'A different institution',short: 'Different' },

  /* ---------------- materials ---------------- */
  var MATERIALS = {
    H: { name: 'Original Halcyon oak', glyph: 'O' },
    N: { name: 'New replacement timber', glyph: 'R' },

    P: { name: 'Timber from the Petrel', glyph: 'P' }

  var LOCS = ['A', 'B', 'rack', 'store', 'lost', 'spare'];

  function newYard() {
    var y = {
      A: new Array(N).fill(null), B: new Array(N).fill(null),
      rack: [], store: [], lost: [], spare: [],
      pieces: {}, nid: 0,
      cont: { A: {}, B: {} },          // which originals each berth is continuous with
      design: { A: null, B: null },    // 'H','P','altered','mixed'
      service: { A: null, B: null },   // which vessel's role the berth's ship performs
      reg: { A: null, B: null },       // registry entry held
      name: { A: null, B: null },
      years: 0, stages: [],
      bronze: null, inst: null,

  /* --- conservation audit used by tests and by the UI after every operation --- */
  function audit(y) {

      var arr = y[loc];
      for (var i = 0; i < arr.length; i++) {
        var id = arr[i]; if (!id) continue;
        if (seen[id]) errs.push('Piece ' + id + ' appears in both ' + seen[id] + ' and ' + loc);
        seen[id] = loc;
        if ((loc === 'A' || loc === 'B') && y.pieces[id].home !== i) errs.push('Piece ' + id + ' sits at the wrong position');
      }
    });
    Object.keys(y.pieces).forEach(function (id) { if (!seen[id]) errs.push('Piece ' + id + ' is unaccounted for'); });
    var H = 0; Object.keys(y.pieces).forEach(function (id) { if (y.pieces[id].origin === 'H') H++; });

  var FEATURES = {
    matter:     { label: 'Share of the original’s own material', fmt: function (v) { return v == null ? 'not applicable' : pct(v); } },
    assembled:  { label: 'Assembled as a complete whole', fmt: yn },
    continuous: { label: 'Unbroken history from the original (no gap, no sudden rebuild)', fmt: yn },
    gap:        { label: 'Put back together from the original’s parts after they were apart', fmt: yn },
    branch:     { label: 'Another object has an equally unbroken history', fmt: yn },
    form:       { label: 'Keeps the original’s design or shape', fmt: yn },
    service:    { label: 'Continues the original’s role or service', fmt: yn },
    register:   { label: 'Holds the original’s registry entry or charter', fmt: yn },
    kind:       { label: 'Same kind of thing as the original', fmt: yn },
    agree:      { label: 'Timber, continuity and design all point the same way', fmt: yn }

  function yn(v) { return v == null ? 'not applicable' : v ? 'yes' : 'no'; }
  var FEATURE_ORDER = ['matter', 'assembled', 'continuous', 'gap', 'branch', 'form', 'service', 'register', 'kind'];

  function vesselFacts(y, berth, target) {
    var arr = y[berth], other = berth === 'A' ? 'B' : 'A';
    var full = filled(arr) === N, fromT = count(arr, target, y);
    var cont = !!(y.cont[berth] && y.cont[berth][target]);
    var otherCont = !!(y.cont[other] && y.cont[other][target]) && filled(y[other]) === N;
    var reg = y.reg[berth];
    return {
      kind: 'vessel', sameKind: true,
      matter: fromT / N,
      assembled: full,
      continuous: cont,
      gap: !cont && fromT > 0,
      branch: cont && otherCont,
      form: y.design[berth] === target,
      service: y.service[berth] === target,
      register: reg === target || (reg === 'shared' && target === 'H'),
      causal: cont || fromT > 0

  }
  function bronzeFacts(y, target) {
    var b = y.bronze;
    if (target === 'lump') {
      return { kind: 'object', sameKind: b.shape === 'lump', matter: 1 - b.added, assembled: true, continuous: true,
        gap: false, branch: false, form: b.shape === 'lump', service: null, register: null, causal: true };
    }
    // target = an earlier shape (the figurehead)
    var still = b.shape === target;
    return { kind: 'object', sameKind: still, matter: 1 - b.added, assembled: true, continuous: still,
      gap: false, branch: false, form: still, service: null, register: null, causal: true };
  }
  function institutionFacts(inst) {
    return { kind: 'institution', sameKind: true, matter: null, assembled: null, continuous: !!inst.continuous,
      gap: false, branch: !!inst.branch, form: null, service: !!inst.purpose, register: !!inst.register, causal: true };
  }
  function rowFacts(y, row) {
    if (row.kind === 'object') return bronzeFacts(y, row.target);

  function factView(f) {
    var out = [];
    FEATURE_ORDER.forEach(function (k) {

      if (k === 'service' && f.service == null) return;
      if (k === 'register' && f.register == null) return;
      if (f.kind === 'institution' && (k === 'matter' || k === 'assembled' || k === 'gap' || k === 'form')) return;
      if (f.kind === 'object' && (k === 'branch')) return;
      out.push({ key: k, label: FEATURES[k].label, value: FEATURES[k].fmt(v), raw: v });
    });

  }

  /* ==========================================================================

  function r(v, why) { return { v: v, why: why }; }
  var PRINCIPLES = {
    allTimber: {
      title: 'Every original piece', family: 'Material',
      plain: 'A thing survives only if it keeps all of its original material, put together as a whole.',
      rule: 'Same if 100% of the original material is present and assembled; otherwise not the same.',
      relevant: ['matter', 'assembled'],
      apply: function (f) {

        if (f.matter === 1 && f.assembled) return r('same', 'All of the original material is present and assembled.');

      }
    },
    mostTimber: {
      title: 'Most of the original', family: 'Material',
      plain: 'A thing is wherever most of its original material is, put together as a whole.',
      rule: 'Same if more than 50% of the original material is present and assembled; not the same below 50%; open at exactly 50%.',
      relevant: ['matter', 'assembled'],
      apply: function (f) {

    },
    unbroken: {

      plain: 'A thing survives through gradual, continuous change with no gap and no sudden total rebuild.',
      rule: 'Same if there is an unbroken history from the original; otherwise not the same. (It does not rule out two continuers.)',
      relevant: ['continuous'],
      apply: function (f) {
        if (f.continuous) return r('same', 'There is an unbroken history from the original.');
        return r('not', f.gap ? 'The history was broken: it was apart before being put back together.' : 'There is no unbroken history from the original.');
      }
    },
    unrivalled: {
      title: 'Unbroken and unrivalled', family: 'Continuity',
      plain: 'Unbroken repair keeps a thing going — but if two things have equally unbroken histories, neither is the original.',
      rule: 'Same if the history is unbroken and no other object has an equally unbroken history; otherwise not the same.',
      relevant: ['continuous', 'branch'],
      apply: function (f) {

        if (f.branch) return r('not', 'Another object has an equally unbroken history, so neither is the original.');

    designRole: {
      title: 'Same design, same role', family: 'Form and function',
      plain: 'A vessel survives if it keeps its design and carries on its job, descended from the original by repair or parts.',

      relevant: ['form', 'service'],
      apply: function (f) {

        if (!f.causal) return r('not', 'It is not descended from the original by repair or by parts.');
        if (!f.form) return r('not', 'The original design or shape has not been kept.');
        if (f.service === false) return r('not', 'It no longer carries on the original’s role.');
        return r('same', 'The design is kept' + (f.service ? ' and the role continues' : '') + '.');

    register: {

      plain: 'Which vessel counts as the original is settled by the official record.',

      relevant: ['register'],
      apply: function (f) {

    noFurtherFact: {

      plain: 'Once the facts about material, continuity and design are known, there may be nothing more to discover. When they agree, so do I; when they pull apart, there is no single answer.',
      rule: 'Checks the material (most), continuity and design criteria (for institutions: continuity and charter). If all that apply agree, gives that answer; otherwise gives no determinate answer (or, where the case asks, calls it partly verbal).',
      relevant: ['agree'],
      apply: function (f, ctx) {
