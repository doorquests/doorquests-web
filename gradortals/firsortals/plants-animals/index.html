function dispatch(a, focusAfter){
  var r = reduce(ROOT, a);
  if (r.ok){
    ROOT = r.state;
    if (!ROOT.current || !ROOT.current.finished || a.t==='finish') {}
    persist();
  } else if (a.t==='undo' && r.state && r.state!==ROOT){ ROOT = r.state; }
  UI.focusId = focusAfter || null;
  var msg = r.ok ? (r.msg || autoAnnounce(a)) : r.msg;
  if (a.t==='sort' && r.ok){ var c = caseOf(ROOT.current.caseId), st = findStmt(c, a.stmtId); if (a.bin!==st.kind){ UI.sortHint[st.id]=true; } else { delete UI.sortHint[st.id]; } }
  if (a.t==='showMe' && r.ok) delete UI.sortHint[a.stmtId];
  render();
  if (!r.ok){ showStageMessage(r.msg); if (a.t!=='undo'){ var sm = document.getElementById('stage-msg'); if (sm && !sm.hidden) sm.focus(); } }
  announce(msg);
  if (UI.read && r.ok && a.t!=='undo') speakStage(a);
  return r;
}
function autoAnnounce(a){
  var s = ROOT.current; if (!s) return ''; var c = caseOf(s.caseId);
  switch(a.t){
   case 'inspect': var cl = findClue(c, a.clueId); return 'Found: ' + cl.text;
   case 'sort': var st = findStmt(c, a.stmtId); return a.bin===st.kind ? ('Placed in ' + (a.bin==='see'?'I see':'I think') + '. ' + st.text) : ('Placed in ' + (a.bin==='see'?'I see':'I think') + '. Trundle has a question about this card.');
   case 'showMe': return 'Trundle moved the card to its home.';
   case 'choose': return 'Your idea: the ' + NAME[a.cand] + '.';
   case 'toggleSupport': return (s.support.indexOf(a.clueId)>=0 ? 'Chosen: ' : 'Not chosen: ') + findClue(c,a.clueId).short + '.';
   case 'checkClaim': return 'Trundle looked at your clues.';
   case 'nightNext': var n = c.night[s.nightSeen-1]; return n.when + ': ' + n.text;
   case 'protect': return c.outcomes[a.prot].text;
   case 'removeProt': return 'The ' + PROTS[activeProtOf(s)||a.prot||'fence'].title.toLowerCase() + ' was taken away. What it showed stays in your journal.';
   case 'finish': return 'Case journal ready.';
   default: return '';
  }
}
function activeProtOf(s){ var last = s.interventions[s.interventions.length-1]; return last ? last.prot : null; }
function speakStage(a){
  var s = ROOT.current; if (!s || ROOT.showDoor) { speak('Open the round green door to visit Bean Row.'); return; }
  var c = caseOf(s.caseId);
  if (a.t==='inspect') { speak(findClue(c,a.clueId).text); return; }
  if (a.t==='nightNext') { var n = c.night[s.nightSeen-1]; speak(n.when+'. '+n.text); return; }
  if (a.t==='protect') { speak(c.outcomes[a.prot].text); return; }
  var h = document.getElementById('stage-h'); if (h) speak(h.textContent);
}
function showStageMessage(msg){ var m = document.getElementById('stage-msg'); if (m) { m.textContent = msg; m.hidden = false; } }

  stopSpeechIfStale();
  main.textContent = '';
  var s = ROOT.current;
  if (ROOT.showDoor || !s) renderDoor();
  else {
    var c = caseOf(s.caseId);

    ({model:rModel, inspect:rInspect, sort:rSort, claim:rClaim, night:rNight, protect:rProtect, result:rResult, journal:rJournal})[s.stage](card, s, c);
    card.insertBefore(msg, card.children[2] || null);

  renderDialog();

  var f = UI.focusId ? document.getElementById(UI.focusId) : null;

  }
  if (upd){
    var act0 = activeIntervention(s), fin0 = lastAfterNightClaim(s);
    if (current && act0 && act0.effective){
      if (isSolved(c, fin0)) card.appendChild(btn('📔 Write my case journal', {t:'finish'}, {cls:'big'}));
      else card.appendChild(trundleSays(unsolvedPrompt(c, fin0), 'think'));
    }
    var canFinish = current && act0 && act0.effective && isSolved(c, fin0);
    if (current) card.appendChild(canFinish ? btn('🛡 Change how we protect the beans', {t:'goProtect'}) : btn('🛡 Next: protect the beans ➜', {t:'goProtect'}, {cls:'big'}));
    else if (fin0) card.appendChild(stale);
    else card.appendChild(el('p', {cls:'small'}, 'Check your idea again to go on.'));
    card.appendChild(btn('🌙 Look at the night-view again', {t:'lookNight'}));
  }
}

function rNight(card, s, c){
  card.className += ' night';
  card.appendChild(heading('The night-view'));
  card.appendChild(trundleSays('Last night, a garden camera made pictures in the dark. Look one moment at a time.', 'think'));
  c.night.forEach(function(n, i){
    if (i < s.nightSeen){
      var fr = el('figure', {cls:'frame', id:'nf-'+i, tabindex:'-1'});
      fr.appendChild(svgBox(svgWrap('0 0 400 240', ART[n.art](), 'Night-view picture ' + (i+1) + '. ' + n.text)));
      var cap = el('figcaption');
      cap.appendChild(el('p', null, el('span', {cls:'tag night'}, n.when), ' ', n.text));
      var h = hearBtn(n.when + '. ' + n.text, 'night-view moment ' + (i+1)); if (h) cap.appendChild(h);
      fr.appendChild(cap);
      card.appendChild(fr);
    } else {
      card.appendChild(el('div', {cls:'frame unseen'}, 'Moment ' + (i+1) + ': not watched yet.'));
    }
  });
  if (s.nightSeen < c.night.length) card.appendChild(btn(s.nightSeen ? '▶ Show the next moment' : '▶ Show the first moment', {t:'nightNext'}, {cls:'big', focus:'nf-'+s.nightSeen}));
  else if (s.phase==='first' || !lastAfterNightClaim(s)) card.appendChild(btn('💭 Think again with this evidence', {t:'goUpdate'}, {cls:'big'}));
  else card.appendChild(btn('Back to my idea', {t:'goUpdate'}, {cls:'big'}));
}

function rProtect(card, s, c){
  var cl = lastAfterNightClaim(s);
  card.appendChild(heading('Protect the bean plants'));
  card.appendChild(trundleSays('Your idea now: the ' + NAME[cl.candidate] + '. The animal is not bad. It was hungry! Which way should we protect the beans? We do not hurt anyone.', 'think'));
  PROT_IDS.forEach(function(p){
    var P = PROTS[p];
    var tried = s.interventions.filter(function(iv){return iv.prot===p;}).length;
    var b = btn(el('span'), {t:'protect', prot:p}, {cls:'prot', aria:P.title + '. ' + P.text + (tried?' Tried before.':'')});
    b.textContent='';
    b.appendChild(svgBox(svgWrap('0 0 120 90', ART['p_'+p]())));
    b.appendChild(el('span', null, el('b', null, P.title), el('br'), P.text, tried ? el('span', {cls:'small'}, ' (tried before)') : null));
    card.appendChild(b);
  });
  card.appendChild(el('p', {cls:'small'}, 'Trundle can carry one way at a time. Picking a new way takes the old one away.'));
}

function rResult(card, s, c){
  var iv = activeIntervention(s), o = c.outcomes[iv.prot], P = PROTS[iv.prot];
  card.appendChild(heading(o.effective ? 'It worked in Bean Row!' : 'Hmm, a new clue!'));
  card.appendChild(svgBox(svgWrap('0 0 400 240', resultScene(c.id, iv.prot, o.effective), 'Bean Row the next morning with the ' + P.title.toLowerCase() + '. ' + o.text), 'result'));
  card.appendChild(el('p', null, el('span', {cls:'tag see'}, 'I see'), ' ', o.text));
  if (!o.effective){
    var f = c.follow[iv.prot];
    card.appendChild(trundleSays('The beans still got nibbled. That is not a mistake. It is new evidence! Let us look again.', 'think'));
    if (f) card.appendChild(el('p', {cls:'notice'}, el('span', {cls:'tag new'}, 'New clue'), ' ', f.text));
    var row = el('div', {cls:'row'});
    row.appendChild(btn('💭 Look at the clue and think again', {t:'lookAgain'}));
    row.appendChild(btn('🛡 Try a different way', {t:'removeProt'}, {dataAct:'removeProt:retry'}));
    card.appendChild(row);
  } else {
    var finC = lastAfterNightClaim(s);
    if (isSolved(c, finC)){
      card.appendChild(trundleSays('The beans can grow now. Let us write our case journal!', 'happy'));
      card.appendChild(btn('📔 Write my case journal', {t:'finish'}, {cls:'big'}));
    } else {
      card.appendChild(trundleSays(unsolvedPrompt(c, finC), 'think'));
      var row2 = el('div', {cls:'row'});
      row2.appendChild(btn('🌙 Look at the night-view again', {t:'lookNight'}));
      row2.appendChild(btn('💭 Think again about my idea', {t:'lookAgain'}));
      card.appendChild(row2);
    }
    card.appendChild(btn('↩ Take the ' + P.title.toLowerCase() + ' away', {t:'removeProt'}));
  }
}

function unsolvedPrompt(c, claim){
  var m = eatMoment(c);
  if (claim.candidate !== c.truth)
    return 'The beans are safe now! But is our mystery solved? Your idea is the ' + NAME[claim.candidate] + '. Look again at the night-view moment “' + m.when + '”. Who is eating the bean plant? Does it fit your idea? You can think again.';
  return 'The beans are safe now! Your idea is the ' + NAME[claim.candidate] + '. Which clue shows it eating, or the marks it left? Pick that clue and check your idea again.';
}
function journalModel(s, c){
  var J = {};
  var mc = modelClue(c);
  J.modeled = {clue:mc.text, statement:c.model.text, bin:'I see'};
  J.seen = c.stmts.filter(function(st){return st.kind==='see';}).map(function(st){return st.text;});
  J.learnerFound = s.learnerRevealed.filter(function(id){return clueGroup(c,id)==='ground';}).map(function(id){return findClue(c,id).text;});
  J.thought = c.stmts.filter(function(st){return st.kind==='think';}).map(function(st){return st.text;});
  var first = s.claims[0];
  J.firstIdea = first ? {cand:first.candidate, because:first.support.map(function(id){return findClue(c,id).short;})} : null;
  J.night = c.night.slice(0, s.nightSeen).map(function(n){ return n.when + ': ' + n.text; });
  var fin = lastAfterNightClaim(s);
  J.finalIdea = fin ? {cand:fin.candidate, because:reasonList(c, fin.candidate, fin.support)} : null;
  J.revisions = s.revisions.map(function(r){ return {from:r.from, to:r.to, because:reasonList(c, r.to, r.because)}; });
  J.protections = s.interventions.map(function(iv){ return {title:PROTS[iv.prot].title, result:c.outcomes[iv.prot].text, effective:iv.effective, removed:iv.removed, followup: iv.followup ? findClue(c, iv.followup).text : null}; });
  J.truth = c.truth; J.truthSeen = c.night.filter(function(n){return n.sup[c.truth]==='eat';})[0].text;
  J.match = fin ? fin.candidate===c.truth : false;
  J.hints = s.hintEvents.filter(function(h){return h.kind!=='undo';}).length;
  J.firstTry = s.interventions.length ? s.interventions[0].effective : false;
  return J;
}
function rJournal(card, s, c){
  var J = journalModel(s, c);
  card.className += ' journal';
  card.appendChild(heading('My case journal'));
  card.appendChild(svgBox(svgWrap('0 0 400 240', resultScene(c.id, activeIntervention(s).prot, true), 'Bean Row with healthy bean plants and a smiling Trundle.')));
  card.appendChild(el('p', null, c.ending));
  var path = [];
  if (J.revisions.length) path.push('You changed your mind when the evidence showed something new. That is what good investigators do.');
  else if (J.match) path.push('Your idea held up when you looked for more evidence.');
  if (!J.firstTry) path.push('Your first way to protect the beans did not stop the nibbling, but it gave you a new clue, and you used it.');
  if (!J.match) path.push('Trundle notes: your idea was the ' + NAME[J.finalIdea.cand] + ', and the night-view showed the ' + NAME[J.truth] + ' eating. Next time, look at the night-view clues again!');
  path.forEach(function(t){ card.appendChild(trundleSays(t, 'happy')); });
  function sec(title, items, tagCls, tagText){
    card.appendChild(el('h3', null, title));
    var ul = el('ul'); items.forEach(function(t){ ul.appendChild(el('li', null, tagCls ? el('span', {cls:'tag '+tagCls}, tagText) : null, tagCls ? ' ' : null, t)); }); card.appendChild(ul);
  }
  sec('Trundle showed me', [J.modeled.clue + ' (sorted into I see by Trundle)'], 'model', 'Trundle');
  sec('What I saw', J.seen.concat(J.learnerFound.map(function(t){return 'I found: ' + t;})), 'see', 'I see');
  sec('What I thought', J.thought, 'think', 'I think');
  sec('My first idea', [J.firstIdea ? ('The ' + NAME[J.firstIdea.cand] + ', because of: ' + J.firstIdea.because.join('; ').toLowerCase() + '.') : '—']);
  sec('New evidence from the night-view', J.night, 'night', 'Night');
  var after = [J.finalIdea ? ('My idea now: the ' + NAME[J.finalIdea.cand] + ', because of: ' + J.finalIdea.because + '.') : '—'];
  J.revisions.forEach(function(r){ after.push('I changed my mind from the ' + NAME[r.from] + ' to the ' + NAME[r.to] + ' because of: ' + r.because + '.'); });
  if (!J.revisions.length) after.push('I kept my idea.');
  sec('My idea after more evidence', after);
  sec('Ways I tried to protect the beans', J.protections.map(function(p){ return p.title + ': ' + p.result + (p.followup ? ' ' + p.followup : '') + (p.removed ? ' (Then I took it away.)' : ''); }));
  sec('What the night-view showed eating', ['The night-view showed: ' + J.truthSeen + ' My idea ' + (J.match ? 'matches this.' : 'was different.')]);
  card.appendChild(el('p', {cls:'small'}, 'Trundle gave ' + J.hints + ' hint' + (J.hints===1?'':'s') + '. This journal shows what you chose and did. It does not measure what you understand.'));
  var others = CASE_IDS.filter(function(id){return id!==c.id;});
  card.appendChild(el('h3', null, 'Another mystery?'));
  var row = el('div', {cls:'row'});
  others.forEach(function(id){ row.appendChild(btn(caseOf(id).title, {t:'start', caseId:id})); });
  row.appendChild(btn('Play this one again', {t:'start', caseId:c.id}, {dataAct:'start:again:'+c.id}));
  row.appendChild(btn('Back to the green door', {t:'door'}));
  card.appendChild(row);
}

/* ---- dialogs / menu ---- */
function confirmDlg(text, okLabel, onOk){ UI.dlg = {text:text, ok:okLabel, onOk:onOk, ret:document.activeElement && document.activeElement.id}; renderDialog(); }
function renderDialog(){
  var host = document.getElementById('dlg-host'); host.textContent = '';
  if (!UI.dlg) return;
  var back = el('div', {cls:'dlg-back'});
  var d = el('div', {cls:'card dlg', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'dlg-t'});
  d.appendChild(el('h2', {id:'dlg-t'}, UI.dlg.title || 'Are you sure?'));
  if (UI.dlg.text) d.appendChild(el('p', null, UI.dlg.text));
  if (UI.dlg.menu){
    UI.dlg.menu.forEach(function(m){ var b = el('button', {type:'button', cls:'big', 'data-act':m.act}, m.label); b.addEventListener('click', m.fn); d.appendChild(b); });
  } else {
    var ok = el('button', {type:'button', cls:'big', id:'dlg-ok', 'data-act':'dlg-ok'}, UI.dlg.ok);

    if (e.key==='Tab'){ var f = d.querySelectorAll('button'); var first=f[0], last=f[f.length-1];
      if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } }
  });
  var first = d.querySelector('button'); if (first) first.focus();
}
function closeDlg(){ var ret = UI.dlg && UI.dlg.ret; UI.dlg = null; renderDialog(); var r = ret && document.getElementById(ret); (r || document.getElementById('t-menu')).focus(); }
function openMenu(){
  var items = [];
  items.push({label:'🚪 Back to the green door', act:'menu-door', fn:function(){ UI.dlg=null; renderDialog(); if (ROOT.current && !ROOT.showDoor) dispatch({t:'door'}); else render(); }});
  items.push({label:'🧹 Erase this game\'s saved progress', act:'menu-reset', fn:function(){

/* ---- toolbar ---- */
document.getElementById('t-read').addEventListener('click', function(){ UI.read = !UI.read; this.setAttribute('aria-pressed', UI.read?'true':'false'); if (!speechOK && UI.read){ announce('Reading aloud is not available in this browser. All words are on the screen.'); } else { announce(UI.read ? 'Read to me is on.' : 'Read to me is off.'); if (UI.read){ var h=document.getElementById('stage-h'); if (h) speak(h.textContent); } else stopSpeech(); } });
document.getElementById('t-calm').addEventListener('click', function(){ UI.calm = !UI.calm; this.setAttribute('aria-pressed', UI.calm?'true':'false'); document.body.classList.toggle('calm', UI.calm); announce(UI.calm ? 'Calm motion is on.' : 'Calm motion is off.'); });
document.getElementById('t-undo').addEventListener('click', function(){ if (curStage()==='door'){ announce('Nothing to undo here.'); return; } dispatch({t:'undo'}, 't-undo'); });
document.getElementById('t-menu').addEventListener('click', openMenu);

/* ================================================================
   8. DIAGNOSTICS (read-only) + PATH ENUMERATION
   ================================================================ */
function snapshot(){
  var s = ROOT.current;
  var o = {storageKey:KEY, version:VERSION, showDoor:ROOT.showDoor, done:ROOT.done.slice(), storageAvailable:storageOK, speechAvailable:speechOK,
    current: s ? {caseId:s.caseId, truth:caseOf(s.caseId).truth, stage:s.stage, phase:s.phase, revealed:s.revealed.slice(), learnerRevealed:s.learnerRevealed.slice(),
      sorts:clone(s.sorts), candidate:s.candidate, support:s.support.slice(), claims:clone(s.claims), nightSeen:s.nightSeen,
      interventions:clone(s.interventions), activeProt:s.activeProt, revisions:clone(s.revisions), hintEvents:clone(s.hintEvents), finished:s.finished,
      journal: s.finished ? journalModel(s, caseOf(s.caseId)) : null} : null,
    invariants: checkInvariants(ROOT)};
  return deepFreeze(o);
}
function deepFreeze(o){ if (o && typeof o==='object'){ Object.keys(o).forEach(function(k){ deepFreeze(o[k]); }); Object.freeze(o); } return o; }
function enumerateCases(){
  return deepFreeze(CASE_IDS.map(function(id){ var c = caseOf(id);
    return {caseId:id, title:c.title, truth:c.truth,
      clues:allClues(c).map(function(cl){ return {id:cl.id, group:clueGroup(c,cl.id), text:cl.text, origin:cl.origin, support:clone(cl.sup)}; }),
      statements:[{id:c.model.id, kind:c.model.kind, text:c.model.text, modeled:true}].concat(c.stmts.map(function(st){ return {id:st.id, kind:st.kind, text:st.text, src:st.src}; })),
      outcomes:PROT_IDS.map(function(p){ return {prot:p, effective:c.outcomes[p].effective, result:c.outcomes[p].result, followup: c.follow[p] && !c.outcomes[p].effective ? c.follow[p].id : null, text:c.outcomes[p].text}; })};
  }));
}
/* Pure exhaustive enumeration over the real reducer on private copies. */
function enumeratePaths(){
  var report = {paths:0, finished:0, failures:[], endings:{}};
  CASE_IDS.forEach(function(id){
    var c = caseOf(id);
    var base = reduce(freshRoot(), {t:'start', caseId:id}).state;
    base = reduce(base, {t:'modelDone'}).state;
    c.clues.forEach(function(cl){ base = reduce(base, {t:'inspect', clueId:cl.id}).state; });
    base = reduce(base, {t:'goSort'}).state;
    c.stmts.forEach(function(st){ base = reduce(base, {t:'sort', stmtId:st.id, bin:st.kind}).state; });
    base = reduce(base, {t:'goClaim'}).state;
    CANDS.forEach(function(first){
      var a = reduce(base, {t:'choose', cand:first}).state;
      a = reduce(a, {t:'toggleSupport', clueId:c.clues[1].id}).state;
      a = reduce(a, {t:'checkClaim'}).state;
      a = reduce(a, {t:'goNight'}).state;
      for (var k=0;k<c.night.length;k++) a = reduce(a, {t:'nightNext'}).state;
      a = reduce(a, {t:'goUpdate'}).state;
      CANDS.forEach(function(second){
        var b = reduce(a, {t:'choose', cand:second}).state;
        b = reduce(b, {t:'toggleSupport', clueId:c.night[c.night.length-1].id}).state;
        b = reduce(b, {t:'checkClaim'}).state;
        b = reduce(b, {t:'goProtect'}).state;
        /* every ordered sequence of distinct protections, stopping at the first effective one */
        (function walk(st, used){
          PROT_IDS.forEach(function(p){
            if (used.indexOf(p)>=0) return;
            var r = reduce(st, {t:'protect', prot:p});
            if (!r.ok){ report.failures.push(id+': protect refused '+p); return; }
            var x = r.state; report.paths++;
            var inv = checkInvariants(x); if (!inv.ok) report.failures.push(id+' '+first+'>'+second+' '+used.concat(p).join(',')+': '+inv.failures.join('|'));
            var iv = activeIntervention(x.current);
            if (iv.effective !== c.outcomes[p].effective) report.failures.push('outcome not from truth');
            if (iv.effective){
              var fin = reduce(x, {t:'finish'});
              var solvedNow = isSolved(c, lastAfterNightClaim(x.current));
              if (fin.ok !== solvedNow){ report.failures.push(id+' finish '+(fin.ok?'allowed unsolved':'refused solved')); return; }
              var rethought = false;
              if (!fin.ok){
                /* BR-01 path: protection worked but explanation unsolved -> think again, cite the eating moment, finish from the claim screen */
                var y2 = reduce(x, {t:'lookAgain'}).state;
                y2 = reduce(y2, {t:'choose', cand:c.truth}).state;
                y2.current.support.slice().forEach(function(sid){ y2 = reduce(y2, {t:'toggleSupport', clueId:sid}).state; });
                y2 = reduce(y2, {t:'toggleSupport', clueId:eatMoment(c).id}).state;
                var stale = reduce(y2, {t:'finish'}); if (stale.ok) report.failures.push(id+' finished with unchecked idea');
                y2 = reduce(y2, {t:'checkClaim'}).state;
                fin = reduce(y2, {t:'finish'});
                if (!fin.ok){ report.failures.push(id+' rethink finish refused: '+fin.msg); return; }
                rethought = true;
              }
              var J = journalModel(fin.state.current, c);
              var invF = checkInvariants(fin.state); if (!invF.ok) report.failures.push('final '+invF.failures.join('|'));
              if (J.truth !== c.truth) report.failures.push('journal truth mismatch');
              if (!J.match) report.failures.push('journal finished without a matching idea');
              var nChanges = 0, cl2 = fin.state.current.claims; for (var q=1;q<cl2.length;q++) if (cl2[q].candidate!==cl2[q-1].candidate) nChanges++;
              if (J.revisions.length !== nChanges) report.failures.push('revision count wrong');
              report.finished++;
              var fam = id+'|'+(J.firstTry?'first-try':'after-retry')+'|'+(J.revisions.length?'changed':'kept')+'|'+(rethought?'rethought-after-protecting':'solved-before-protecting');
              report.endings[fam] = (report.endings[fam]||0)+1;
            } else {
              var nf = reduce(x, {t:'finish'}); if (nf.ok) report.failures.push('finished with ineffective protection');
              var y = reduce(x, {t:'removeProt'}).state;
              walk(y, used.concat(p));
            }
          });
        })(b, []);
      });
    });
  });
  report.endingFamilies = Object.keys(report.endings).length;
  return deepFreeze(report);
}
function simulate(caseId, actions){
  var r = reduce(freshRoot(), {t:'start', caseId:caseId}), log = [];
  var st = r.state;
  (actions||[]).forEach(function(a){ var x = reduce(st, a); log.push({t:a.t, ok:x.ok, msg:x.msg}); if (x.ok) st = x.state; });
  return deepFreeze({log:log, stage:st.current.stage, invariants:checkInvariants(st), state:clone(st.current)});
}
Object.defineProperty(window, 'DQBeanRow', {value:Object.freeze({version:'firsortals-plants-animals-001 v1', storageKey:KEY,
  snapshot:snapshot, checkInvariants:function(){ return deepFreeze(checkInvariants(ROOT)); }, enumerateCases:enumerateCases, enumeratePaths:enumeratePaths, simulate:simulate}),
  writable:false, configurable:false, enumerable:false});

function renderDiag(){
  var host = document.getElementById('diag-host'); host.textContent='';
  if (location.hash !== '#diag') return;
  var s = snapshot();
  var pre = el('pre', {id:'diag', 'aria-label':'Auditor diagnostics'});
  pre.textContent = 'DIAGNOSTICS (read-only)\n' + JSON.stringify({case:s.current&&s.current.caseId, stage:s.current&&s.current.stage, revealed:s.current&&s.current.revealed, candidate:s.current&&s.current.candidate, claims:s.current&&s.current.claims, protections:s.current&&s.current.interventions, invariants:s.invariants}, null, 1);
  host.appendChild(pre);
}
window.addEventListener('hashchange', renderDiag);

/* ================================================================
   9. BOOT
   ================================================================ */
ROOT = load();
render();
})();
