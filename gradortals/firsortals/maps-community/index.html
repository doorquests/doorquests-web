var KEY = 'doorquests.firsortals.maps-community.001.v1';
var MAX_SAVE_CHARS = 200000;
var MAX_HISTORY = 600;
var MAX_PLAN = 12;
var START = 'pier';

/* ---------------- Island geometry (shared by every case) ------------- */
var NODES = {

var EDGE_ORDER = ['road', 'lane', 'bridge', 'foot', 'clocklane', 'front', 'gpath', 'ramp', 'board', 'dune', 'alley'];

function W(open, stepFree, extra) {

}
function M(open, stepFree) { return { open: !!open, stepFree: !!stepFree }; }

/* ---------------- Authored cases (immutable ground truth) ------------ */
var CASES = {
  main: {
    id: 'main', order: 1,
    title: 'The Welcome Map',
    mapName: 'the old Welcome Map',
    intro: 'Pip found the old Welcome Map at the pier. Pip wants to visit the library.',
    world: {

        foot: W(1, 1), clocklane: W(1, 1),
        front: W(1, 0, { steps: 6, note: 'Six stone steps go up to the front door. There is no ramp here.' }),
        gpath: W(1, 1),
        ramp: W(1, 1, { note: 'A new smooth ramp goes up to the side door.' }),
        board: W(1, 1, { note: 'The boardwalk is new. Its flat boards follow the shore.' })
      }
    },
    map: {
      library: 'clock',
      edges: { road: M(1, 1), lane: M(1, 1), bridge: M(1, 1), foot: M(1, 1), clocklane: M(1, 1), front: M(1, 1), gpath: M(1, 1), ramp: M(1, 0) }
    },
    places: {
      clock: { text: 'Clock House is a bakery now. A note on the door says: "The library moved to Harbor Hall."', note: true },
      hall: { text: 'Harbor Hall has a big LIBRARY sign. Inside are shelves of books.' }
    },
    demo: ['road', 'bridge'],
    ending: 'The library moved from Clock House to Harbor Hall, the Old Bridge is closed for repairs, and a new boardwalk follows the shore. Your map now shows the front steps and the side door ramp, so the next visitor can pick a way that works for them.'
  },
  storm: {
    id: 'storm', order: 2,
    title: 'After the Storm',
    mapName: 'the Storm Map from the ferry',
    intro: 'A storm blew past last night. The ferry gave Pip a "Storm Map" made during the storm. Pip wants to visit the library.',
    world: {
      library: 'clock',
      edges: {
        road: W(1, 1), lane: W(1, 1),
        bridge: W(1, 1, { note: 'The bridge has new boards. The barrier is gone. It is open and flat.' }),
        foot: W(1, 0, { steps: 8, note: 'The storm broke the old footbridge. The new one has eight wooden steps.' }),
        clocklane: W(1, 1),
        front: W(1, 0, { steps: 6, note: 'Six stone steps go up to the front door.' }),
        gpath: W(1, 1),
        ramp: W(1, 1, { note: 'A smooth ramp goes up to the side door.' }),
        board: W(0, 1, { why: 'Storm waves broke some boards. A rope and a sign say CLOSED.' }),
        dune: W(1, 1, { note: 'A new Dune Path, packed flat and firm, goes between the Old Mill and Clock House.' })
      }
    },
    map: {
      library: 'hall',
      edges: { road: M(1, 1), lane: M(1, 1), bridge: M(0, 1), foot: M(1, 1), clocklane: M(1, 1), front: M(1, 0), gpath: M(1, 1), ramp: M(1, 1), board: M(1, 1) }
    },
    places: {
      clock: { text: 'A sign says LIBRARY. Books are here in Clock House while Harbor Hall gets a new roof.' },
      hall: { text: 'Harbor Hall has ladders and roof workers. A note on the door says: "Library is at Clock House for now."', note: true }
    },
    demo: ['board', 'ramp'],
    ending: 'After the storm, the library moved into Clock House for a while. The Old Bridge opened again, the boardwalk closed, the footbridge got steps, and a new Dune Path appeared. Your Storm Map is now a true map for today.'
  },
  market: {
    id: 'market', order: 3,
    title: 'Market Day',
    mapName: "last summer's map",
    intro: "It is Market Day! Pip has last summer's map. Pip wants to visit the library.",
    world: {
      library: 'hall',
      edges: {
        road: W(1, 1), lane: W(1, 1),
        bridge: W(1, 0, { steps: 8, note: 'The Old Bridge was rebuilt as a hump bridge. It has four steps up and four steps down.' }),
        foot: W(1, 1), clocklane: W(1, 1),
        front: W(1, 1, { note: 'A new ramp now goes up to the front door. No steps!' }),
        gpath: W(0, 1, { why: 'Market stalls fill Garden Path today. A sign says PATH CLOSED FOR MARKET.' }),
        ramp: W(0, 1, { why: 'The side door ramp is being painted. A sign says WET PAINT, CLOSED.' }),
        board: W(1, 1),
        alley: W(1, 1, { note: 'Lantern Alley is new. It is flat and lit with paper lanterns.' })
      }
    },
    map: {
      library: 'garden',
      edges: { road: M(1, 1), lane: M(1, 1), bridge: M(1, 1), foot: M(1, 1), clocklane: M(1, 1), front: M(1, 0), gpath: M(1, 1), ramp: M(1, 1), board: M(1, 1) }
    },
    places: {
      garden: { text: 'Seed and flower stalls fill Shell Garden. A note says: "The summer reading tent is gone. Find books at Harbor Hall."', note: true },
      hall: { text: 'Harbor Hall has a big LIBRARY sign. Inside are shelves of books.' }
    },
    demo: ['board'],
    ending: "Last summer's map sent Pip to a reading tent that is gone. Today the library is at Harbor Hall, the front door has a ramp, the side door is closed for paint, market stalls close Garden Path, and the rebuilt bridge has steps. A new Lantern Alley helps too."
  }
};
var CASE_ORDER = ['main', 'storm', 'market'];

Object.keys(CASES).forEach(function (id) { deepFreeze(CASES[id]); });
deepFreeze(NODES); deepFreeze(EDGES);

function deepFreeze(o) {
  Object.getOwnPropertyNames(o).forEach(function (k) {
    var v = o[k];
    if (v && typeof v === 'object') deepFreeze(v);
  });
  return Object.freeze(o);
}
function has(o, k) { return o !== null && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k); }
function otherEnd(edgeId, node) { var e = EDGES[edgeId]; return e.from === node ? e.to : e.from; }
function touches(edgeId, node) { var e = EDGES[edgeId]; return e.from === node || e.to === node; }

/* ---------------- Differences (derived, never hand-listed) ----------- */
function diffs(C) {
  var out = [];
  EDGE_ORDER.forEach(function (id) {
    var w = C.world.edges[id], m = C.map.edges[id];
    if (w && !m) out.push({ type: 'add', edge: id });
    else if (m && !w) out.push({ type: 'remove', edge: id });
    else if (w && m) {
      if (w.open !== m.open) out.push({ type: 'open', edge: id });
      if (w.stepFree !== m.stepFree) out.push({ type: 'step', edge: id });
    }
  });
  if (C.world.library !== C.map.library) out.push({ type: 'library', node: C.world.library });
  return out;
}

/* ---------------- Pure world simulator ------------------------------- */
function simulate(world, who, plan, start) {
  var at = start || START, visited = [at], traversed = [];
  for (var i = 0; i < plan.length; i++) {
    var id = plan[i];
    if (typeof id !== 'string' || !has(EDGES, id) || !has(world.edges, id)) {
      return { ok: false, reason: 'no-path', edge: id, at: at, visited: visited, traversed: traversed, stepIndex: i };
    }
    if (!touches(id, at)) {
      return { ok: false, reason: 'not-here', edge: id, at: at, visited: visited, traversed: traversed, stepIndex: i };
    }
    var w = world.edges[id];
    if (!w.open) return { ok: false, reason: 'closed', edge: id, at: at, visited: visited, traversed: traversed, stepIndex: i };
    if (who === 'teo' && !w.stepFree) return { ok: false, reason: 'steps', edge: id, at: at, visited: visited, traversed: traversed, stepIndex: i };
    at = otherEnd(id, at);
    visited.push(at);
    traversed.push(id);
  }
  if (at !== world.library) return { ok: false, reason: 'not-library', edge: null, at: at, visited: visited, traversed: traversed, stepIndex: plan.length };
  return { ok: true, reason: 'arrived', edge: null, at: at, visited: visited, traversed: traversed, stepIndex: plan.length };
}

/* ---------------- Game state + reducer ------------------------------- */
function initialState(C) {
  var m = { library: C.map.library, edges: {} };
  Object.keys(C.map.edges).forEach(function (id) {
    var e = C.map.edges[id];
    m.edges[id] = { present: true, open: e.open, stepFree: e.stepFree };
  });
  return { map: m, seen: {}, seenOrder: [], revealed: {}, edits: [], trips: [], hints: 0, helper: false,
           demoDone: false, teoArrived: false, completed: null, n: 0 };
}
function cloneState(S) { return JSON.parse(JSON.stringify(S)); }

function edgeOnMap(S, id) { return has(S.map.edges, id) && S.map.edges[id].present === true; }
function edgeVisible(S, id) { return edgeOnMap(S, id) || S.revealed[id] === true; }

function mapSaidEdge(S, id) {
  if (!edgeOnMap(S, id)) return 'not on the map';
  var m = S.map.edges[id];
  return (m.open ? 'open' : 'closed') + ', ' + (m.stepFree ? 'no steps' : 'steps');
}
function mapSaidNode(S, id) { return S.map.library === id ? 'library symbol here' : 'no library symbol here'; }

function stepWords(C, id) {
  var w = C.world.edges[id];
  if (w.stepFree) return EDGES[id].kind === 'door' ? 'a ramp, no steps' : 'flat, no steps';
  return (w.steps ? w.steps + ' steps' : 'steps');
}
function sawEdge(C, id) {
  var w = C.world.edges[id];
  return (w.open ? 'open' : 'closed') + ', ' + stepWords(C, id);
}
function sawNode(C, id) { return C.world.library === id ? 'the library is here' : 'no library here'; }

function record(C, S, key, src) {
  var parts = key.split(':');
  var said = parts[0] === 'n' ? mapSaidNode(S, parts[1]) : mapSaidEdge(S, parts[1]);
  var saw = parts[0] === 'n' ? sawNode(C, parts[1]) : sawEdge(C, parts[1]);
  S.seen[key] = { key: key, src: src, at: S.n, mapSaid: said, saw: saw };
  S.seenOrder.push(key);
  if (parts[0] === 'n') revealFrom(C, S, parts[1]);
}
function revealFrom(C, S, node) {
  EDGE_ORDER.forEach(function (id) {
    if (has(C.world.edges, id) && !edgeOnMap(S, id) && touches(id, node)) S.revealed[id] = true;
  });

function planCheck(C, S, who, plan) {
  if (!Array.isArray(plan) || plan.length < 1 || plan.length > MAX_PLAN) return { ok: false, reason: 'plan-size' };
  var at = START, seenNodes = {}; seenNodes[at] = true;
  for (var i = 0; i < plan.length; i++) {
    var id = plan[i];
    if (typeof id !== 'string' || !has(EDGES, id) || !edgeOnMap(S, id)) return { ok: false, reason: 'not-on-map' };
    if (!S.map.edges[id].open) return { ok: false, reason: 'map-closed' };
    if (!touches(id, at)) return { ok: false, reason: 'not-connected' };
    at = otherEnd(id, at);
    if (seenNodes[at]) return { ok: false, reason: 'loop' };
    seenNodes[at] = true;
  }
  if (at !== S.map.library) return { ok: false, reason: 'not-at-symbol' };
  return { ok: true, end: at };

  if (S.n >= MAX_HISTORY) return no('full');
  var e, w, m;
  switch (a.t) {
    case 'demo':
      if (S.demoDone) return no('already');
      S.demoDone = true;
      break;

function stopWords(t) {

    case 'stop': stopSpeech(); return;

      ui.focus = ui.view === 'street' ? 'view-street' : 'view-map';

    case 'look':

      lookAt(ds.k === 'e' ? 'e' : 'n', ds.id); return;
    case 'fix-open': doEdit({ t: 'open', edge: ds.id, value: ds.v === '1' }, edgeName(ds.id) + ' marked ' + (ds.v === '1' ? 'open' : 'closed')); return;
    case 'fix-step': doEdit({ t: 'step', edge: ds.id, value: ds.v === '1' }, edgeName(ds.id) + ' marked ' + (ds.v === '1' ? 'no steps' : 'steps')); return;
    case 'add': doEdit({ t: 'add', from: ds.from, to: ds.to }, 'new path drawn between ' + nodeName(ds.from) + ' and ' + nodeName(ds.to)); return;
    case 'draw':
      var f = $('add-from'), tt = $('add-to');
      ui.addFrom = f ? f.value : ui.addFrom; ui.addTo = tt ? tt.value : ui.addTo;
      if (!has(NODES, ui.addFrom) || !has(NODES, ui.addTo)) return;

    case 'lib': doEdit({ t: 'lib', node: ds.id }, 'library symbol moved to ' + nodeName(ds.id)); return;
    case 'undo':
      var r = act({ t: 'undo' });
      setMsg(r.ok ? 'info' : 'bad', r.ok ? 'Undone. The map is back the way it was before your last fix. Your notes are still in the notebook.' + (r.wasReady && !r.isReady ? ' You finished this day earlier, but now part of the map needs checking again.' : '') : reasonWords(r.code));
      ui.focus = 'btn-undo'; render(); return;
    case 'who': if (ds.w === 'teo' && !S().teoArrived) return; if (ui.who !== ds.w) ui.plan = []; ui.who = ds.w; ui.focus = 'who-' + ds.w; render(); return;
    case 'plan-add':
      Sx = S();
      if (ui.plan.length >= MAX_PLAN) return;
      if (!edgeOnMap(Sx, ds.id) || !Sx.map.edges[ds.id].open || !touches(ds.id, planEnd())) return;

        if (d.type === 'add') return edgeName(d.edge) + ' (' + edgeEnds(d.edge) + ') is missing from the map.';
        if (d.type === 'open') return edgeName(d.edge) + ' is really ' + (C().world.edges[d.edge].open ? 'open' : 'closed') + '.';
        if (d.type === 'step') return edgeName(d.edge) + ' really has ' + (C().world.edges[d.edge].stepFree ? 'no steps' : 'steps') + '.';

/* ---------------- Boot ------------------------------------------- */
function boot() {
  loadSave();
  if (storageGet() === null && !store.ok) { /* storage denied */ }
  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) return;
    if (el.disabled) return;
    if (el.tagName === 'SELECT') return;
    ev.preventDefault();
    handle(el.getAttribute('data-act'), el.dataset || {}, el);
  });
  document.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'add-from') ui.addFrom = ev.target.value;
    if (ev.target && ev.target.id === 'add-to') ui.addTo = ev.target.value;
  });
  var d = $('dlg');
  d.addEventListener('cancel', function (ev) { ev.preventDefault(); closeDialog(); });
  d.addEventListener('close', function () { stopSpeech(); });
  render();
  if (/(^|[?&#])qa=1(\b|$)/.test(location.search + '&' + location.hash)) exposeDiag();
}

function exposeDiag() {
  var diag = {
    key: KEY,
    nodes: NODES, edges: EDGES,
    caseIds: CASE_ORDER.slice(),
    caseData: function (id) { return has(CASES, id) ? CASES[id] : null; },
    diffs: function (id) { return deepFreeze(diffs(CASES[id])); },
    simulate: function (id, who, plan) { return deepFreeze(simulate(CASES[id].world, who, plan.slice(), START)); },
    snapshot: function () { return deepFreeze(cloneState(S())); },
    active: function () { return G.active; },
    history: function () { return deepFreeze(JSON.parse(JSON.stringify(G.histories[G.active]))); },
    replayCheck: function (id, history) { var r = replay(CASES[id], JSON.parse(JSON.stringify(history))); return deepFreeze({ ok: r.ok, index: r.index === undefined ? null : r.index, completed: r.ok ? !!r.S.completed : false, invariants: r.ok ? checkInvariants(CASES[id], r.S) : [] }); },
    invariants: function () { return checkInvariants(C(), S()); },
    readyNow: function () { return readyNow(C(), S()); },
    uiPlan: function () { return Object.freeze(ui.plan.slice()); },
