<!doctype html>
<html lang="en">

<style>
:root{
  --dq-navy:#0b1a3c; --dq-blue:#13295c; --dq-gold:#e8b84a; --dq-gold-2:#f6d98b;
  --paper:#fbf5e6; --paper-2:#f1e5c8; --ink:#1d2342; --muted:#555b74;
  --card:#fffdf7; --accent:#b8481f; --ok:#2c7448; --focus:#ffbf1f; --line:#d9c9a3;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--dq-navy);line-height:1.45;font-size:18px;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--dq-gold);color:var(--dq-navy);padding:.6rem 1rem;border-radius:10px;z-index:9;font-weight:700}
.skip:focus{top:.5rem}

/* Top bar */
.topbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.5rem .75rem;background:var(--dq-navy);color:#fff;border-bottom:2px solid var(--dq-gold)}
.brand{font-weight:700;letter-spacing:.02em;color:var(--dq-gold-2);font-size:.92rem}
.brand small{display:block;color:#c9d2ee;font-weight:400;font-size:.78rem}
.tools{display:flex;gap:.35rem;flex-wrap:wrap}
.tbtn{background:transparent;color:#fff;border:2px solid rgba(232,184,74,.75);border-radius:999px;padding:.4rem .8rem;font-size:.88rem;min-height:44px;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--dq-gold);color:var(--dq-navy);font-weight:700}
.tbtn[disabled]{opacity:.55;cursor:not-allowed}

main{max-width:860px;margin:0 auto;padding:.75rem .75rem 2rem}

/* Generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:52px;padding:.55rem 1.1rem;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 var(--ink);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--dq-gold)}
.btn.quiet{border-width:2px;box-shadow:none;font-weight:600;font-size:.95rem;min-height:46px;background:#fff}
.btn.waiting{opacity:.6;box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.4;box-shadow:none;border-style:dotted;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row.spread-nav{justify-content:space-between;margin-top:.9rem}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em}

/* Welcome */
.welcome{color:#fff;text-align:center;padding:1rem .5rem 2rem}
.welcome .door{width:min(220px,55vw);height:auto;display:block;margin:0 auto .5rem}
.kicker{color:var(--dq-gold-2);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;margin:.2rem 0}
.welcome h1{font-size:clamp(1.7rem,6vw,2.6rem);margin:.2rem 0;line-height:1.15}
.welcome .sub{color:#c9d2ee;margin:.2rem 0 1rem}
.welcome .lead{max-width:34rem;margin:0 auto 1.2rem;font-size:1.1rem}
.welcome .row{justify-content:center}
.tag{margin-top:1.6rem;color:var(--dq-gold-2);font-style:italic}
.credit{color:#c9d2ee;font-size:.9rem;margin:.3rem 0}
.note-dark{color:#c9d2ee;font-size:.9rem;max-width:32rem;margin:.8rem auto 0}

/* Book */
.book{background:var(--paper);border-radius:18px;border:3px solid var(--dq-gold);box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem .9rem;background:var(--paper-2);border-bottom:2px solid var(--line)}
.pagehead h2{margin:0;font-size:1.15rem}
.dots{display:flex;gap:.35rem}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots span.on{background:var(--ink)}
.dots span.done{background:var(--dq-gold)}
.scene{display:block;width:100%;aspect-ratio:400/240;background:#fff;border-bottom:2px solid var(--line)}
.scene svg{display:block;width:100%;height:100%}
.storyline{margin:0;padding:.8rem 1rem .4rem;font-size:1.15rem;line-height:1.9}
.storyline .ctx{color:var(--ink)}
.ctxnote{display:block;font-size:.78rem;color:var(--muted);line-height:1.3}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:5.2rem;min-height:3rem;margin:0 .25rem;vertical-align:middle;border:3px dashed var(--accent);border-radius:12px;background:#fff7ea;cursor:pointer;padding:.15rem .5rem}
.slot.filled{border-style:solid;border-color:var(--ink);background:#fff}
.slot.ready{box-shadow:0 0 0 4px rgba(232,184,74,.55)}
.caption{margin:.2rem 1rem .9rem;padding:.7rem .9rem;background:#fff;border-left:6px solid var(--dq-gold);border-radius:10px;font-size:1.05rem}
.caption strong{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.changed{margin:.2rem 1rem;padding:.5rem .8rem;background:#e8f4ec;border-radius:10px;font-weight:700;color:var(--ok)}
.hearrow{padding:0 1rem .6rem}

.work{background:#fff;border-top:3px solid var(--line);padding:.9rem}
.guide{display:flex;gap:.6rem;align-items:flex-start;font-size:1.1rem;font-weight:700;margin:0 0 .6rem}
.guide .nubmini{flex:none;width:44px;height:44px}
.steps{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;margin:0 0 .8rem;padding:0}
.steps li{display:flex;align-items:center;gap:.3rem;padding:.25rem .6rem .25rem .3rem;border:2px solid var(--line);border-radius:999px;font-size:.88rem;background:var(--card)}
.steps li .n{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--ink);font-weight:700;font-size:.85rem;background:#fff}
.steps li.done{border-color:var(--ok)}
.steps li.done .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps li.now{border-color:var(--dq-gold);box-shadow:0 0 0 3px rgba(232,184,74,.4)}

.tray{display:flex;flex-wrap:wrap;gap:.7rem;margin:.2rem 0 .8rem}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:7.5rem;padding:.6rem .8rem .4rem;border:3px solid var(--ink);border-radius:16px;background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.wcard.open{background:#fff8e2}
.wcard.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(184,72,31,.3)}
.wcard .tagline{font-size:.75rem;font-weight:700;color:var(--muted);min-height:1.1em}
.wcard.sel .tagline{color:var(--accent)}
.word{display:inline-flex;gap:.15rem;align-items:flex-end}
.glyph{display:block;height:2.6rem;width:auto}
.slot .glyph{height:2.1rem}
.chip .glyph{height:1.6rem}

.bench{border:3px solid var(--ink);border-radius:18px;padding:.8rem;background:#fffaf0;margin:.4rem 0 .8rem}
.bench h3{margin:0 0 .5rem;font-size:1rem}
.letters{display:flex;gap:.5rem;align-items:flex-end;justify-content:center;flex-wrap:nowrap;position:relative;padding-bottom:1.4rem}
.lbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:4.4rem;min-height:6rem;padding:.4rem .3rem .5rem;border:3px solid var(--ink);border-radius:16px;background:#fff;cursor:pointer}
.lbtn .glyph{height:4rem}
.lbtn .dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.lbtn.done .dot{background:var(--ink)}
.lbtn.next{border-color:var(--dq-gold);box-shadow:0 0 0 5px rgba(232,184,74,.55)}
.lbtn.cur{background:#fff1c6}
.lbtn .ord{font-size:.7rem;color:var(--muted);font-weight:700}
.letters.blended{gap:.05rem}
.letters.blended .lbtn{border-color:var(--ok)}
.arrow{position:absolute;left:10%;right:10%;bottom:.2rem;height:12px}
.sweep{position:absolute;bottom:0;left:6%;width:28px;height:28px;border-radius:50%;background:var(--dq-gold);border:3px solid var(--ink)}
.sweep.go{animation:sweep 1.1s ease-in-out forwards}
@keyframes sweep{from{left:6%}to{left:calc(94% - 28px)}}
.bubble{margin:.6rem 0;padding:.6rem .8rem;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:1rem}
.scard{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.scard .kwimg{width:56px;height:56px;flex:none;border:2px solid var(--line);border-radius:12px;background:#fff;padding:3px}
.scard .glyph{height:3rem}
.scard .cue{flex:1 1 12rem;min-width:10rem}
.scard .cue b{display:block}
.blendline{margin:.4rem 0;padding:.5rem .8rem;background:#eef6ff;border-radius:12px;font-weight:700}
.model{color:var(--ok)}
.bench .row{margin-top:.5rem}
.notice{margin:.4rem 0;padding:.55rem .8rem;border-radius:12px;background:#fff3d6;border:2px solid var(--dq-gold);font-weight:700}
.confirm{margin:.5rem 0;padding:.8rem;border-radius:14px;background:#fff3d6;border:3px solid var(--dq-gold)}
.confirm p{margin:0 0 .5rem;font-weight:700}
.swap{margin:.5rem 0;padding:.8rem;border-radius:14px;background:#eef6ff;border:3px solid #6c93c9}
.swap .word{margin:.3rem 0}
.swap .hole{display:inline-grid;place-items:center;width:2.4rem;height:2.6rem;border:3px dashed var(--accent);border-radius:8px;font-size:1.4rem;color:var(--accent)}
.placerow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.4rem 0}

/* Ending */
.end h2{margin:.2rem 0 .1rem;font-size:1.5rem}
.endbody{padding:.9rem 1rem}
.retell{list-style:none;padding:0;margin:.6rem 0}
.retell li{display:flex;gap:.7rem;align-items:center;padding:.6rem .7rem;margin:.4rem 0;background:#fff;border-radius:12px;border:2px solid var(--line)}
.retell .pg{font-size:.8rem;font-weight:700;color:var(--muted);min-width:3.8rem}
.chip{display:inline-flex;align-items:center;padding:.2rem .5rem;border:2px solid var(--ink);border-radius:10px;background:#fff}
details.hist{margin:.8rem 0;padding:.6rem .8rem;background:#f6f1e3;border-radius:12px}
details.hist summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.replaybar{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;padding:.6rem .9rem;background:var(--paper-2)}

/* Grown-up guide */
dialog.grown{max-width:min(720px,94vw);width:100%;max-height:90vh;border:3px solid var(--dq-gold);border-radius:16px;padding:0;color:var(--ink);background:var(--paper)}
dialog.grown::backdrop{background:rgba(5,10,30,.7)}
.grown .gh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem .9rem;background:var(--dq-navy);color:#fff}
.grown .gh h2{margin:0;font-size:1.1rem;color:var(--dq-gold-2)}
.grown .gb{padding:.4rem 1rem 1rem;font-size:.98rem}
.grown h3{margin:1rem 0 .3rem;font-size:1.02rem}
.grown table{border-collapse:collapse;width:100%;font-size:.9rem;margin:.3rem 0}
.grown th,.grown td{border:1px solid var(--line);padding:.3rem .4rem;text-align:left;vertical-align:top}
.grown th{background:var(--paper-2)}
.grown .script{background:#fff;border:2px solid var(--line);border-radius:10px;padding:.5rem .8rem}
.obs{background:#fff;border-radius:10px;padding:.4rem .8rem;border:2px solid var(--line)}
.diag{margin-top:1rem;background:#111;color:#cfe;padding:.7rem;border-radius:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.diag button{font:12px ui-monospace,monospace;margin:.2rem .3rem .4rem 0;min-height:36px;background:#e8b84a;color:#111;border:0;border-radius:6px;padding:0 .7rem}

/* Animations (art) */
.a-rise{animation:rise 1.2s ease-out both}
@keyframes rise{from{transform:translateY(120px);opacity:.2}to{transform:translateY(0);opacity:1}}
.a-drop{animation:drop .9s cubic-bezier(.3,1.4,.6,1) both}
@keyframes drop{from{transform:translateY(-220px)}to{transform:translateY(0)}}
.a-flutter{animation:flutter 1.2s ease-out both}
@keyframes flutter{0%{transform:translate(-30px,-200px) rotate(-25deg)}50%{transform:translate(20px,-80px) rotate(15deg)}100%{transform:translate(0,0) rotate(0)}}
.a-bound{animation:bound 1.2s ease-out both}
@keyframes bound{0%{transform:translateX(-200px)}70%{transform:translateX(10px)}100%{transform:translateX(0)}}
.a-roll{animation:roll 1.1s ease-out both}
@keyframes roll{from{transform:translate(-160px,-60px)}to{transform:translate(0,0)}}
.a-pop{animation:pop .5s ease-out both}
@keyframes pop{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}

@media (min-width:700px){
  .letters{gap:.9rem}
  .lbtn{min-width:5.2rem}
}
@media (max-width:380px){
  body{font-size:17px}
  .lbtn{min-width:3.9rem}
  .lbtn .glyph{height:3.4rem}
}
</style>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------
   DATA — word bank, sounds, story text. All authored constants.
------------------------------------------------------------------- */
var KEY = 'doorquests.firsortals.reading-phonics.001.v1';

// Grapheme -> sound teaching data. "kw" is a keyword whose FIRST sound matches.
var SND = {
  s:{kw:'snake',  cue:'sss — a long hiss. Keep it going.',              kind:'continuous consonant', ipa:'/s/'},
  u:{kw:'up',     cue:'the first sound in “up”.',                         kind:'short vowel',          ipa:'/ʌ/'},
  n:{kw:'nest',   cue:'nnn — hum it through your nose.',                  kind:'continuous consonant', ipa:'/n/'},
  t:{kw:'tent',   cue:'t — one quick tap of the tongue. Not “tuh”.',      kind:'stop consonant',       ipa:'/t/'},
  h:{kw:'hen',    cue:'h — a soft breath out. Not “huh”.',                kind:'breath consonant',     ipa:'/h/'},
  a:{kw:'apple',  cue:'the first sound in “apple”.',                      kind:'short vowel',          ipa:'/æ/'},
  m:{kw:'moon',   cue:'mmm — lips together, hum.',                        kind:'continuous consonant', ipa:'/m/'},
  p:{kw:'pig',    cue:'p — one quick pop of the lips. Not “puh”.',        kind:'stop consonant',       ipa:'/p/'},
  d:{kw:'duck',   cue:'d — one quick tap of the tongue. Not “duh”.',      kind:'stop consonant',       ipa:'/d/'},
  o:{kw:'octopus',cue:'the first sound in “octopus”.',                    kind:'short vowel',          ipa:'/ɒ/ or /ɑ/ (accent varies)'},
  g:{kw:'goat',   cue:'g — one quick sound at the back of the mouth. Not “guh”.', kind:'stop consonant', ipa:'/ɡ/'},
  l:{kw:'leaf',   cue:'lll — tongue up behind your top teeth. Keep it going.', kind:'continuous consonant', ipa:'/l/'}
};

var WORDS = {
  sun:{sp:1, g:['s','u','n']},
  nut:{sp:2, g:['n','u','t']},
  hat:{sp:2, g:['h','a','t']},
  map:{sp:2, g:['m','a','p']},
  dog:{sp:3, g:['d','o','g']},
  log:{sp:3, g:['l','o','g']}
};
var TRAY = {1:['sun'], 2:['map','nut','hat'], 3:['dog','log']};
var STATUSES = ['modeled','independent-attempt','assisted','assisted-full','previously-read','placed-before-reading','not-recorded'];

// Story text (adult-read context; NOT assessed). The blank is where the child's word goes.
var LINE = {
  1:['It is dark on this page. Nub needs the', 'to see.'],
  2:['Nub wants to bring something home. Down from the top of the page came a', '.'],
  3:['A river runs across this page. Nub’s home, a little inkwell, is on the other side. Then along came a', '.']
};

function caption(sp, st){
  var w = st.placed[sp]; if(!w) return '';
  if(sp===1) return 'The page said sun, so a big warm sun rose. Now Nub can see the way!';
  if(sp===2) return ({
    nut:'The page said nut, so down came a nut — a GIANT nut, bigger than Nub! Nub will roll it home.',
    hat:'The page said hat, so down floated a big red hat. It fits Nub just right.',
    map:'The page said map, so down fluttered a map. It shows a dotted path to Nub’s home.'
  })[w];
  var it = st.placed[2];
  if(w==='dog') return 'The page said dog, so a friendly dog bounded in, wagged its tail and said “Woof!” Then it paddled across the river with Nub on its back. ' +
    ({nut:'It carried the giant nut in its mouth, too.', hat:'The big red hat kept Nub dry.', map:'Nub held up the map and pointed the way.'})[it];
  return 'The page said log, so a log rolled down the bank and landed across the river. It made a bridge, and Nub walked over. ' +
    ({nut:'Nub rolled the giant nut across, too.', hat:'Nub held on to the big red hat.', map:'The dotted path on the map went right over the log.'})[it];
}

function retellLine(sp, st){
  var w = st.placed[sp];
  if(sp===1) return 'A sun rose and lit up the dark page.';
  if(sp===2) return ({nut:'A giant nut came down, bigger than Nub.', hat:'A big red hat floated down onto Nub.', map:'A map came down, showing the way home.'})[w];
  return ({dog:'A dog paddled Nub across the river.', log:'A log made a bridge over the river.'})[w];
}

var ENDINGS = {
  'nut-log':{title:'Rolling Home', text:'Nub rolled the giant nut over the log bridge and all the way to the inkwell. Everyone shared it at a giant-nut picnic.'},
  'nut-dog':{title:'A Nut for Two', text:'The dog carried the giant nut across the river. At the inkwell, Nub and the dog shared it, crunch by crunch.'},
  'hat-log':{title:'Hats Off, Home at Last', text:'Nub walked over the log bridge in the big red hat, and hung it on the hook by the inkwell door.'},
  'hat-dog':{title:'Dry Under the Hat', text:'Splash! The dog paddled hard, but the big red hat kept Nub dry. At the inkwell, the dog curled up for a nap.'},
  'map-log':{title:'Follow the Dotted Path', text:'Nub followed the dotted path on the map, over the log bridge, right to the inkwell door.'},
  'map-dog':{title:'The Dog and the Map', text:'Nub held up the map and pointed, and the dog paddled that way, all the way home to the inkwell.'}
};
function endingId(st){ return (st.placed[2] && st.placed[3]) ? st.placed[2]+'-'+st.placed[3] : null; }

function sceneDesc(sp, st){
  if(sp===1) return st.placed[1] ? 'Picture: a bright sun has risen over the page, and Nub smiles in the sunshine.' : 'Picture: a dark, blank page. Nub sits in the dark.';
  var sun = 'Picture: the sun shines. ';
  if(sp===2){
    var w2 = st.placed[2];
    if(!w2) return sun + 'The rest of the page is blank. Nub looks up, waiting.';
    return sun + ({nut:'A giant nut, much bigger than Nub, sits beside Nub.', hat:'Nub wears a big red hat.', map:'Nub holds a map with a dotted path to a little house.'})[w2];
  }
  var base = sun + 'A river runs down the middle of the page. Nub’s inkwell home is on the far bank. ';
  var it = st.placed[2], w3 = st.placed[3];
  if(!w3) return base + 'Nub waits on this side, ' + ({nut:'next to the giant nut.', hat:'wearing the big red hat.', map:'holding the map.'})[it];
  if(w3==='dog') return base + 'A brown dog swims across the river with Nub on its back. ' + ({nut:'The dog carries the giant nut in its mouth.', hat:'Nub wears the big red hat.', map:'Nub holds up the map.'})[it];
  return base + 'A log lies across the river like a bridge, and Nub walks over it. ' + ({nut:'The giant nut rolls along beside Nub.', hat:'Nub wears the big red hat.', map:'Nub holds the map.'})[it];
}
function endDesc(st){
  var it = st.placed[2], w3 = st.placed[3];
  return 'Picture: Nub is home at the inkwell under the sun. ' +
    ({nut:'The giant nut sits by the door.', hat:'Nub wears the big red hat.', map:'The map is pinned up by the door.'})[it] + ' ' +
    ({dog:'The friendly dog sits beside Nub.', log:'Behind them, the log bridge still crosses the river.'})[w3];
}

/* ------------------------------------------------------------------
   ART — authored SVG fragments, chosen only by whitelisted keys.
------------------------------------------------------------------- */
// Single-storey "school print" letters drawn as strokes, so a/g shapes don't depend on device fonts.
var GLYPH = {
  s:'<path d="M27,30 C24,24 8,24 8,32 C8,40 27,36 27,44 C27,53 9,53 6,46"/>',
  u:'<path d="M7,26 V41 C7,51 26,52 26,41 M26,26 V50"/>',

  var p = o.placed; if(!p || typeof p!=='object' || Array.isArray(p)) return null;

    var w = p[k];

  }
  if(!s.placed[1] && (s.placed[2] || s.placed[3])) return null;
  if(!s.placed[2] && s.placed[3]) return null;
  var e = (o.ev && typeof o.ev==='object') ? o.ev : {};

    if(x && typeof x==='object' && STATUSES.indexOf(x.st)>=0 && x.st!=='modeled'){

  s.spread = (isInt(o.spread) && o.spread>=1 && o.spread<=3) ? Math.min(o.spread, maxSp) : 1;

    o.history.slice(-20).forEach(function(hh){
      if(hh && typeof hh==='object' && (hh.s===2 || hh.s===3) && typeof hh.from==='string' && typeof hh.to==='string' &&

var storageOk = true, loadNote = null;

  var raw;

  catch(err){ storageOk = false; loadNote = 'blocked'; return null; }
  if(raw===null || raw===undefined) return null;
  if(typeof raw!=='string' || raw.length>20000){ loadNote='invalid'; return null; }
  var o; try{ o = JSON.parse(raw); }catch(err){ loadNote = 'corrupt'; return null; }
  var v = validate(o); if(!v) loadNote = 'invalid';

  if(!storageOk) return;
  try{ window.localStorage.setItem(KEY, JSON.stringify(state)); }

/* Reading-attempt records (UI-only, never saved).
   One record per word for the CURRENT attempt only. An attempt ends when any word
   is placed, the page changes, or a letter is changed — then every record is
   discarded, so a later attempt can never inherit earlier taps, blends or help.
   `seen` (session-only) remembers which words had their steps completed earlier in
   this book, so re-placing one without re-reading is labelled "previously-read". */
var seen = {};

function rec(w){
  if(!ui.rec[w]) ui.rec[w] = freshRec();

}
function endAttempts(){ ui.rec = {}; }
function evidenceFor(sp, w, unread){
  if(sp===1) return {st:'modeled', help:0, rev:false, swap:false};
  var r = rec(w), st;

  else if(r.full) st = 'assisted-full';
  else if(r.seg.length) st = 'assisted';
  else st = 'independent-attempt';
  var stepsDone = st!=='previously-read' && st!=='placed-before-reading';
  return {st:st, help: stepsDone ? r.seg.length : 0, rev:false, swap: stepsDone && sp===3 && r.kept===true};

      h('span', {text:'Keyword: ' + S.kw + ' — it starts with this sound.'})),
    TTS ? h('button', {type:'button', class:'btn quiet', 'data-fk':'kw-'+ch, onclick: act(function(){ A.hearKw(ch); }), text:'🔈 Hear “'+S.kw+'”'}) : null);
}

function renderBench(w){
  var sp = state.spread, r = rec(w), g = WORDS[w].g, model = sp===1, next = r.t.indexOf(false);
  var sweepNow = ui.sweep===w;
  var letters = h('div', {class:'letters' + (r.blended ? ' blended' : ''), role:'group', 'aria-label':'Letters, read from left to right'},
    g.map(function(ch, i){
      var cls = 'lbtn' + (r.t[i] ? ' done' : '') + (i===next ? ' next' : '') + (r.cur===i ? ' cur' : '');
      return h('button', {type:'button', class:cls, 'data-fk':'L'+i+'-'+w,
          'aria-label':'Letter ' + ch + ', ' + ['first','middle','last'][i] + ' letter.' + (r.t[i] ? ' Tapped.' : (i===next ? ' Tap this one next.' : '')),
          onclick: act(function(){ A.tap(w, i); })},
        h('span', {class:'ord', 'aria-hidden':'true', text: i===0 ? 'start' : (i===2 ? 'end' : '')}),
        h('span', {svg: glyphSVG(ch), 'aria-hidden':'true'}),
        h('span', {class:'dot', 'aria-hidden':'true'}));
    }),
    h('svg', {}), // placeholder replaced below
    h('span', {class:'sweep' + (sweepNow ? ' go' : ''), 'aria-hidden':'true', style: r.blended && !sweepNow ? 'left:calc(94% - 28px)' : null})
  );
  // replace placeholder with arrow svg (authored)
  var arrowHolder = h('span', {class:'arrow', 'aria-hidden':'true', svg:'<svg viewBox="0 0 100 12" preserveAspectRatio="none" width="100%" height="12"><path d="M2,6 H94 M86,1 L96,6 L86,11" stroke="#1d2342" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg>'});
  letters.replaceChild(arrowHolder, letters.childNodes[g.length]);

  var bubble = null;
  if(r.shown>=0) bubble = h('div', {class:'bubble'}, soundCard(g[r.shown], model));
  else if(r.cur>=0 && !r.blended) bubble = h('div', {class:'bubble'}, h('b', {text:'Say the sound for this letter. '}), h('span', {text:'Stuck? Press “Help with a sound”.'}));
  else if(r.kept && r.t[0]===false) bubble = h('div', {class:'bubble'}, h('b', {text:'You changed the first letter. '}), h('span', {text:'The other two letters stay the same. Tap the new letter, then blend.'}));

  var blendLine = null;
  if(r.blended){
    if(model) blendLine = h('p', {class:'blendline model', text:'Blend left to right: sss… uuu… nnn… → sun!'});
    else if(r.full) blendLine = h('p', {class:'blendline model', text:'Grown-up help shows the word: ' + g.join('… ') + '… → ' + w});
    else blendLine = h('p', {class:'blendline', text:'Say the sounds faster and faster until they join into one word. What word is it?'});
  }
  var readyToChoose = r.blended;
  return h('section', {class:'bench', 'aria-label':'Read this word'},
    h('h3', {text: model ? 'Read it with me' : 'Read this word'}),
    letters, bubble, blendLine,
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn' + (next<0 ? '' : ' waiting'), 'data-fk':'blend-'+w, onclick: act(function(){ A.blend(w); })},
        '➜ Blend the sounds', next<0 ? null : h('span', {class:'sr', text:' (not ready yet: tap each letter first)'})),
      h('button', {type:'button', class:'btn quiet', 'data-fk':'help-'+w, onclick: act(function(){ A.help(w); }), text:'💡 Help with a sound'}),
      model ? null : h('button', {type:'button', class:'btn quiet', 'data-fk':'full-'+w, onclick: act(function(){ A.full(w); }), text:'🧑‍🏫 Show me the whole word (tells you the word)'})),
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn' + (readyToChoose ? ' primary' : ''), 'data-fk':'choose-'+w, 'aria-pressed': String(ui.selected===w),
        onclick: act(function(){ A.choose(w); }), text: ui.selected===w ? '✓ Chosen' : 'Choose this word'}))
  );
}

function renderSwap(cur){
  var first = cur.charAt(0), other = first==='d' ? 'l' : 'd';
  return h('div', {class:'swap', role:'group', 'aria-label':'Change one letter'},
    h('p', {text:'Change the first letter. The other two stay the same.'}),
    h('div', {class:'word', 'aria-hidden':'true'}, h('span', {class:'hole', text:'?'}), h('span', {svg: glyphSVG('o') + glyphSVG('g')})),
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn', 'data-fk':'swap-first', 'aria-label':'Change the first letter to ' + other, onclick: act(function(){ A.swapTo(other); })},
        h('span', {svg: glyphSVG(other), 'aria-hidden':'true'})),
      h('button', {type:'button', class:'btn quiet', 'data-fk':'swap-cancel', onclick: act(A.swapOpen), text:'Keep my word'})));
}

function renderEnd(){
  var id = endingId(state), E = ENDINGS[id];
  return h('div', {class:'book end'},
    h('div', {class:'pagehead'}, h('h2', {id:'endtitle', tabindex:'-1', 'data-fk':'endtitle', text:'The End: ' + E.title}),
      h('div', {class:'dots', 'aria-hidden':'true'}, [1,2,3].map(function(){ return h('span', {class:'done'}); }))),
    h('div', {class:'scene', role:'img', 'aria-label': endDesc(state), svg: endArt(state)}),
    h('div', {class:'endbody'},
      h('p', {class:'caption', text: E.text}),
      h('h3', {text:'Your finished book'}),
      h('p', {text:'Each page did exactly what its word said:'}),
      h('ol', {class:'retell'},
        [1,2,3].map(function(s){
          return h('li', {},
            h('span', {class:'pg', text:'Page '+s}),
            h('span', {class:'chip', 'aria-label':'word: '+state.placed[s]}, wordGlyphs(state.placed[s])),
            h('span', {text: (s===1 ? 'We read sun together. ' : 'The page said ' + state.placed[s] + '. ') + retellLine(s, state)}));
        })),
      state.history.length ? h('details', {class:'hist'},
        h('summary', {text:'How your story changed (optional)'}),
        h('p', {text:'These words were on a page for a while and then changed. They are not in your finished book.'}),
        h('ul', {}, state.history.map(function(x){ return h('li', {text:'Page '+x.s+': '+x.from+' → '+x.to}); }))) : null,
      h('div', {class:'row'},
        h('button', {type:'button', class:'btn primary', 'data-fk':'replay', onclick: act(A.replay), text:'📖 Read my book again'}),
        TTS ? h('button', {type:'button', class:'btn', 'data-fk':'hearbook', onclick: act(A.hearBook), text:'🔈 Hear my book'}) : null,
        h('button', {type:'button', class:'btn', 'data-fk':'endback', onclick: act(A.toEndBack), text:'◀ Back to page 3'})),
      h('div', {class:'row', style:'margin-top:.8rem'},
        ui.confirmReset ? [
          h('span', {text:'Start a brand-new book? This book will be cleared from this device.'}),
          h('button', {type:'button', class:'btn primary', 'data-fk':'reset-yes', onclick: act(A.resetYes), text:'Yes, try another path'}),
          h('button', {type:'button', class:'btn', 'data-fk':'reset-no', onclick: act(A.resetNo), text:'Keep my book'})
        ] : h('button', {type:'button', class:'btn', 'data-fk':'resetask', onclick: act(A.resetAsk), text:'↺ Try another path (new book)'}))
    ));
}

function renderReplay(){
  var n = ui.replay;
  var body;
  if(n<=3){
    body = [
      h('div', {class:'scene', role:'img', 'aria-label': sceneDesc(n, state), svg: artFor(n, state, false)}),
      h('p', {class:'storyline'}, h('span', {text: LINE[n][0]}), ' ', h('span', {class:'slot filled', 'aria-label':'word: '+state.placed[n]}, wordGlyphs(state.placed[n])), LINE[n][1]==='.' ? '' : ' ', h('span', {text: LINE[n][1]})),
      h('div', {class:'caption'}, h('strong', {text:'What the book did'}), h('span', {text: caption(n, state)}))
    ];
  } else {
    var E = ENDINGS[endingId(state)];
    body = [h('div', {class:'scene', role:'img', 'aria-label': endDesc(state), svg: endArt(state)}), h('p', {class:'caption', text: 'The End: ' + E.title + '. ' + E.text})];
  }
  return h('div', {class:'book'},
    h('div', {class:'pagehead'}, h('h2', {id:'rtitle', tabindex:'-1', 'data-fk':'rtitle', text: n<=3 ? 'Reading again · Page '+n+' of 3' : 'Reading again · The End'})),
    body,
    h('div', {class:'replaybar'},
      h('button', {type:'button', class:'btn', 'data-fk':'r-back', disabled: n>1 ? null : true, onclick: act(function(){ A.replayGo(-1); }), text:'◀ Back'}),
      h('button', {type:'button', class:'btn', 'data-fk':'r-close', onclick: act(A.replayClose), text:'Close'}),
      h('button', {type:'button', class:'btn primary', 'data-fk':'r-next', disabled: n<4 ? null : true, onclick: act(function(){ A.replayGo(1); }), text:'Next ▶'})));
}

/* ------------------------------------------------------------------
   GROWN-UP GUIDE (dialog)
------------------------------------------------------------------- */
var STATUS_TEXT = {
  'modeled':'Read together with the built-in model (not independent).',
  'independent-attempt':'In this attempt, every letter was tapped in order and Blend was pressed, with no sound help. The book cannot hear the child, so this does not show the word was read correctly aloud.',
  'assisted':'In this attempt, the letter steps were completed with sound help on one or more letters.',
  'assisted-full':'The whole word was shown by “Show me the whole word”.',
  'previously-read':'Placed again without new letter steps. The steps for this word were completed earlier in this book, not in this attempt.',
  'placed-before-reading':'Placed before the letters were tapped and blended (exploring).',
  'not-recorded':'Placed in an earlier session; how it was read was not recorded.'
};
function renderGuide(){
  var d = document.getElementById('grown');
  var obs = [1,2,3].map(function(s){
    var w = state.placed[s], e = state.ev[s];
    if(!w) return h('li', {text:'Page '+s+': no word yet.'});
    return h('li', {text:'Page '+s+' — “'+w+'”: ' + STATUS_TEXT[e ? e.st : 'not-recorded'] + (e && e.st==='assisted' ? ' (letters helped: '+e.help+')' : '') + (e && e.swap ? ' This attempt began by changing one letter: the two unchanged letters were carried over, and only the new first letter was tapped before blending.' : '') + (e && e.rev ? ' This word replaced an earlier word (exploratory revision).' : '')});
  });
  var rows = ['sun','nut','hat','map','dog','log'].map(function(w){
    return h('tr', {}, h('td', {text:'Page '+WORDS[w].sp}), h('td', {text:w}), h('td', {text: WORDS[w].g.join(' · ')}),
      h('td', {text: WORDS[w].g.map(function(c){ return SND[c].ipa; }).join(' ')}));
  });
  var sndRows = Object.keys(SND).map(function(c){ var S = SND[c]; return h('tr', {}, h('td', {text:c}), h('td', {text:S.ipa}), h('td', {text:S.kind}), h('td', {text:S.kw}), h('td', {text:S.cue})); });
  var content = [
    h('div', {class:'gh'}, h('h2', {id:'grown-title', text:'For grown-ups'}), h('button', {type:'button', class:'tbtn', id:'grown-close', 'data-fk':'grown-close', text:'Close'})),
    h('div', {class:'gb'},
      h('h3', {text:'What this door teaches'}),
      h('p', {text:'Decoding three-letter CVC words: each letter stands for a sound, we read left to right, and blending the sounds makes a word. The book then does exactly what the placed word says, so the child sees that the letters — not a picture — decide what happens.'}),
      h('p', {text:'Page 1 is a model (sun). Page 2 is guided practice with a small set (map, nut, hat). Page 3 asks for more independence with dog and log, and lets the child change one letter (d ↔ l) to change the word and the story.'}),
      h('h3', {text:'How to say the sounds'}),
      h('p', {text:'Keep stretchy sounds long (sss, mmm, nnn, lll). Say quick sounds short and crisp with no added “uh” (t, not “tuh”; d, not “duh”). Vowels here are short: u as in up, a as in apple, o as in octopus. Accents differ — say the vowels the way they are said where you live.'}),
      h('table', {}, h('thead', {}, h('tr', {}, ['Letter','Sound','Type','Keyword','How to say it'].map(function(x){ return h('th', {text:x}); }))), h('tbody', {}, sndRows)),
      h('h3', {text:'Read-aloud script (if the device has no voice)'}),
      h('div', {class:'script'},
        h('p', {text:'Page 1: “Touch the first letter. It says /s/ — sss. Next, /u/ as in up. Last, /n/ — nnn. Now slide them together: sssuuunnn… sun! Choose it, then put it on the page.”'}),
        h('p', {text:'Pages 2–3: “Touch each letter and say its sound. Then slide the sounds together. What word did you make?” Let the child answer before they place the word. If they are stuck, give one sound at a time rather than the whole word.'}),
        h('p', {text:'Story words around the box may be read aloud by you; only the word in the box is for the child to sound out.'})),
      h('h3', {text:'What the sound features can and cannot do'}),
      h('ul', {},
        h('li', {text:'There are no recorded letter-sound clips in this prototype. The book never plays an isolated sound, so a child who does not yet know these letter sounds will need a grown-up to say them (see the script below).'}),
        h('li', {text:'If your device has a speech voice, “Read aloud” and the 🔈 buttons use it to say story sentences, keywords (snake, up, nest…) and — only after help is asked for or a word is placed — whole words. Device voices vary and are not checked for accuracy.'}),
        h('li', {text:'The book never listens. It has no microphone access and cannot hear or check the child’s reading.'})),
      h('h3', {text:'Words in this book'}),
      h('table', {}, h('thead', {}, h('tr', {}, ['Page','Word','Letters','Sounds'].map(function(x){ return h('th', {text:x}); }))), h('tbody', {}, rows)),
      h('h3', {text:'What the book saw on this device'}),
      h('div', {class:'obs'}, h('ul', {}, obs),
        h('p', {text:'These notes describe button presses in the attempt that placed each word. They are not evidence of reading skill: finishing the book is not proof that a child read, said or understood the words, and this is not a reading assessment or screener.'})),
      h('h3', {text:'Access'}),
      h('p', {text:'Everything works with touch, mouse or keyboard (Tab, Enter, Space). Every action is a button; nothing needs dragging. “Calm motion” turns off animation (it is also off when the device asks for reduced motion). Pictures have written descriptions after a word is placed. Before a word is placed, labels name only its letters, never the word.'}),
      h('p', {text:'Children who cannot hear speech sounds can still follow the letters, sound dots and keyword pictures, but these do not replace hearing a sound. A grown-up or specialist can adapt the model.'}),
      h('h3', {text:'Privacy'}),
      h('p', {text:'No accounts, no tracking, no network requests. Progress is kept only in this browser under one key for this book' + (storageOk ? '.' : ' — saving is not available here, so progress will not be kept after closing. The story still works.')})
    )
  ];
  d.replaceChildren.apply(d, content);
  document.getElementById('grown-close').addEventListener('click', closeGrown);
}
function openGrown(){
  var d = document.getElementById('grown');
  renderGuide();
  if(typeof d.showModal==='function'){ try{ d.showModal(); }catch(err){ d.setAttribute('open',''); } } else d.setAttribute('open','');
  var c = document.getElementById('grown-close'); if(c) c.focus();
}
function closeGrown(){
  var d = document.getElementById('grown');
  if(typeof d.close==='function'){ try{ d.close(); }catch(err){ d.removeAttribute('open'); } } else d.removeAttribute('open');
  var t = document.getElementById('t-grown'); if(t) t.focus();
}

/* ------------------------------------------------------------------
   DIAGNOSTICS (only with #diag in the address) + read-only snapshot
------------------------------------------------------------------- */
function snapshot(){ return JSON.parse(JSON.stringify({state:state, seen:Object.keys(seen).sort(), ui:{open:ui.open, selected:ui.selected, notice:ui.notice, confirmUnread:ui.confirmUnread, swap:ui.swap, replay:ui.replay, rec:ui.rec}, gen:gen, storageOk:storageOk, tts:TTS, key:KEY})); }
function combos(){
  var out = [];
  TRAY[2].forEach(function(a){ TRAY[3].forEach(function(b){
    var st = fresh(); st.placed = {1:'sun',2:a,3:b};
    var id = endingId(st), E = ENDINGS[id], c3 = caption(3, st), other = b==='dog' ? 'log' : 'dog';
    var ok = !!E && c3.indexOf('said '+b)>=0 && c3.indexOf('said '+other)<0 && retellLine(3,st).toLowerCase().indexOf(other)<0 && caption(2,st).indexOf('said '+a)>=0;
    out.push({spread2:a, spread3:b, ending:id, title:E ? E.title : null, ok:ok});
  }); });
  return out;
}
function selfCheck(){
  var res = [];
  var c = combos(); res.push({name:'6 reachable combinations each map to a unique ending', ok: c.length===6 && c.every(function(x){return x.ok;}) && new Set(c.map(function(x){return x.ending;})).size===6});
  res.push({name:'validate rejects wrong-spread word', ok: validate({v:1,placed:{1:'sun',2:'dog',3:null}})===null});
  res.push({name:'validate rejects gap in placements', ok: validate({v:1,placed:{1:'sun',2:null,3:'log'}})===null});
  res.push({name:'validate rejects unknown version', ok: validate({v:2,placed:{1:null,2:null,3:null}})===null});
  var cl = validate({v:1,screen:'end',spread:3,placed:{1:'sun',2:null,3:null}});
  res.push({name:'validate clamps spread and screen', ok: !!cl && cl.spread===2 && cl.screen==='book'});
  res.push({name:'every assessed word is 3 letters, CVC from the sound table', ok: Object.keys(WORDS).every(function(w){ var g=WORDS[w].g; return g.length===3 && g.every(function(x){return SND.hasOwnProperty(x);}) && /[aeiou]/.test(g[1]) && !/[aeiou]/.test(g[0]+g[2]); })});
  return res;
}
window.DQBook = Object.freeze({ snapshot: snapshot, combos: combos, selfCheck: selfCheck, storageKey: KEY });

function renderDiag(){
  var on = /(^|[#&])diag\b/.test(location.hash);
  var el = document.getElementById('diagpanel');
  if(!on){ if(el) el.remove(); return; }
  if(!el){ el = h('section', {id:'diagpanel', class:'diag', 'aria-label':'Diagnostics'}); document.querySelector('main').appendChild(el); }
  var pre = h('pre', {id:'diag-state', text: JSON.stringify(snapshot(), null, 1)});
  var out = h('pre', {id:'diag-out'});
  el.replaceChildren(h('strong', {text:'Diagnostics (grown-up / QA only)'}), h('br'),
    h('button', {type:'button', onclick: function(){ out.textContent = JSON.stringify({selfCheck:selfCheck(), combos:combos()}, null, 1); }, text:'Run self-check'}),
    out, pre);
}
window.addEventListener('hashchange', renderDiag);

/* Top-bar wiring */
document.getElementById('t-cover').addEventListener('click', act(A.cover));
document.getElementById('t-narr').addEventListener('click', act(A.narr));
document.getElementById('t-calm').addEventListener('click', act(A.calm));
document.getElementById('t-grown').addEventListener('click', function(){ gen++; stopSpeech(); openGrown(); });
document.getElementById('grown').addEventListener('close', function(){ var t = document.getElementById('t-grown'); if(t && document.activeElement===document.body) t.focus(); });

render();
})();
</script>
