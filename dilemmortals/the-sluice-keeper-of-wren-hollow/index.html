    var noteStatus = h('span', { class: 'small', role: 'status' });
    add(book, h('label', { for: noteId }, 'A private note (optional)'));
    add(book, ta);
    add(book, h('p', { class: 'small muted', id: noteId + '-d' }, 'Kept only if you tick the box, and only in this browser. Up to 2,000 characters.'));
    add(book, h('div', { class: 'row' }, h('label', { for: noteId + '-k' }, keep, ' Keep this note in this browser'), h('button', { class: 'btn ghost', type: 'button', on: { click: function () {
      if (keep.checked) { journal.setNote(r.id, ta.value); noteStatus.textContent = ta.value.trim() ? 'Note kept in this browser.' : 'Nothing to keep.'; }
      else { journal.setNote(r.id, ''); noteStatus.textContent = 'Not kept.'; }
    } } }, 'Save note choice'), noteStatus));

    add(book, h('h3', null, 'Where next'));
    var row = h('div', { class: 'row' });
    add(row, h('button', { class: 'btn', type: 'button', on: { click: function () { ui.screen = 'hindsight-pick'; render(); } } }, 'Replay with hindsight'));
    add(row, h('button', { class: 'btn ghost', type: 'button', on: { click: function () { openDoorstepPick(r.id); } } }, 'See it from a doorstep'));
    add(row, h('button', { class: 'btn ghost', type: 'button', on: { click: function () { exportJournal([r]); } } }, 'Export this season as text'));
    add(row, h('button', { class: 'btn ghost', type: 'button', on: { click: function () { ui.screen = 'title'; render(); } } }, 'Back to the start'));
    add(book, row);
    add(app, book);
  }

  /* ---------- Journal export ---------- */
  function journalText(runs) {
    var lines = ['THE KEEPER\'S JOURNAL — Wren Hollow', 'DoorQuests · Dilemmortal No. 001 · The Sluice Keeper of Wren Hollow', 'A fictional season. Exported from this browser at your request.', ''];
    runs.forEach(function (r) {
      var s; try { s = WH.replay(r.scenario, r.seed, r.actions); } catch (e) { return; }
      if (!s.ended) return;
      var L = Story.ledger(s);
      lines.push('=== ' + (r.label || modeName(r.mode) + ' season') + ' · ' + L.scenario + ' · ' + code(r.scenario, r.seed) + ' · ' + (r.finishedAt || '').slice(0, 10));
      lines.push('Decisions:'); L.decisions.forEach(function (d) { lines.push('  Week ' + d.week + ' — ' + d.title + ': ' + d.text); });
      lines.push('Releases (orchard / dairy / school / Fennet End):');
      s.history.forEach(function (hh) { lines.push('  Week ' + hh.week + ': ' + hh.alloc.orchard + ' / ' + hh.alloc.dairy + ' / ' + hh.alloc.school + ' / ' + hh.alloc.hamlet + ' ML; reservoir ' + hh.S0 + ' -> ' + hh.S2 + ' ML'); });
      lines.push('The valley:'); L.valley.forEach(function (v) { lines.push('  ' + v.name + ': ' + v.facts.join('; ')); lines.push('    ' + v.voice); });
      lines.push('After:'); L.after.forEach(function (x) { lines.push('  ' + x); });
      var note = journal.get(r.id); if (note) { lines.push('My note:'); lines.push('  ' + note.replace(/\n/g, '\n  ')); }
      lines.push('');
    });
    return lines.join('\n');
  }
  function exportJournal(runs) {
    var text = journalText(runs);
    makeDialog('Export the Keeper\'s Journal', function (box, close) {
      add(box, h('p', null, 'A plain-text record of the season' + (runs.length > 1 ? 's' : '') + ', for you to keep. It stays on this device unless you choose to share it.'));
      var ta = h('textarea', { readonly: true, style: 'width:100%;min-height:220px;background:#0e1320;color:#f5ecdc;border:1px solid rgba(223,179,142,.4);border-radius:10px;padding:10px', 'aria-label': 'Journal text' });
      ta.value = text; add(box, ta);
      var status = h('p', { role: 'status', class: 'small' });
      add(box, h('div', { class: 'row', style: 'margin-top:10px' },
        h('button', { class: 'btn', type: 'button', on: { click: function () {
          var done = function () { status.textContent = 'Copied to the clipboard.'; };
          try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { ta.select(); status.textContent = 'Select-all done; press Ctrl+C or Cmd+C to copy.'; }); else { ta.select(); status.textContent = 'Select-all done; press Ctrl+C or Cmd+C to copy.'; } } catch (e) { ta.select(); }
        } } }, 'Copy'),
        h('button', { class: 'btn ghost', type: 'button', on: { click: function () {
          try { var blob = new Blob([text], { type: 'text/plain;charset=utf-8' }); var url = URL.createObjectURL(blob); var a = h('a', { href: url, download: 'wren-hollow-keepers-journal.txt' }); doc.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500); status.textContent = 'Download started.'; } catch (e) { status.textContent = 'Download is not available here; use Copy instead.'; }
        } } }, 'Download .txt'),
        h('button', { class: 'btn ghost', type: 'button', on: { click: close } }, 'Close')));
      add(box, status);
    }).open();
  }

  /* ---------- Doorstep ---------- */
  function openDoorstepPick(runId) {
    var r = store.run(runId); if (!r) return;
    var done = store.get().doorstep.done.filter(function (d) { return d.runId === runId; }).map(function (d) { return d.who; });
    var cur = store.get().doorstep.current;
    makeDialog('Doorstep: whose season?', function (box, close) {
      add(box, h('p', null, 'Live through ' + (r.label || 'this season') + ' (' + code(r.scenario, r.seed) + ') from inside one household. The keeper\'s decisions and the weather are fixed; what the household does with them is up to you.'));
      if (cur && cur.runId === runId) add(box, h('p', null, h('button', { class: 'btn', type: 'button', on: { click: function () { close(); ui.ds = cur; ui.screen = 'doorstep'; render(); } } }, 'Continue: ' + Story.PERSPECTIVES.filter(function (p) { return p.id === cur.who; })[0].title)));
      var list = h('div', { class: 'cards' });
      Story.PERSPECTIVES.forEach(function (p) {
        add(list, h('article', { class: 'card' }, h('h4', null, p.title + (done.indexOf(p.id) >= 0 ? ' ✓' : '')), h('p', { class: 'small muted' }, p.who), h('p', { class: 'small' }, p.blurb),
          h('div', { class: 'row' }, h('button', { class: 'btn ghost', type: 'button', 'aria-label': 'Begin Doorstep: ' + p.title, on: { click: function () { close(); ui.ds = { runId: runId, who: p.id, step: 0, choices: {} }; store.setDoorstep(ui.ds); ui.screen = 'doorstep'; render(); } } }, done.indexOf(p.id) >= 0 ? 'Again' : 'Begin'))));
      });
      add(box, list);
    }).open();
  }

  function renderDoorstep() {
    var ds = ui.ds, r = ds && store.run(ds.runId);
    if (!r) { ui.screen = 'title'; renderTitle(); return; }
    var s = WH.replay(r.scenario, r.seed, r.actions);
    var v = Story.doorstepView(s, ds.who, ds.step, ds.choices);
    var P = Story.PERSPECTIVES.filter(function (p) { return p.id === ds.who; })[0];
    var box = h('section', { class: 'panel', 'aria-labelledby': 'ds-h' });
    add(box, h('span', { class: 'eyebrow' }, 'Doorstep · ' + P.title + ' · ' + code(r.scenario, r.seed)));
    add(box, h('h2', { id: 'ds-h', 'data-focus': '1' }, v.title));
    function next() { ds.step++; store.setDoorstep(ds); render(); }
    function choiceBlock(prompt, options, picked, key, reply) {
      if (picked) { add(box, h('p', null, h('strong', null, prompt + ' '), options.filter(function (o) { return o.id === picked; })[0].label)); if (reply) add(box, h('p', { class: 'reply' }, reply)); return true; }
      var chosen = null, b;
      add(box, radioGroup('ds-' + key, prompt, options, null, function (id) { chosen = id; b.disabled = false; }));
      b = h('button', { class: 'btn', type: 'button', disabled: true, on: { click: function () { if (chosen && Story.validDoorstepChoice(ds.who, key, chosen)) { ds.choices[key] = chosen; store.setDoorstep(ds); render(); } } } }, 'Choose');
      add(box, h('div', { class: 'row end' }, b));
      return false;
    }
    if (v.kind === 'intro') { v.paras.forEach(function (x) { add(box, h('p', { class: 'lede' }, x)); }); add(box, h('div', { class: 'row end' }, h('button', { class: 'btn', type: 'button', on: { click: next } }, 'Begin week 1'))); }
    if (v.kind === 'week') {
      add(box, h('h3', null, 'What reached them'));
      add(box, h('ul', { class: 'ds-received' }, v.received.map(function (x) { return h('li', null, x); })));
      add(box, h('p', { class: 'lede', style: 'font-family:var(--serif)' }, v.scene));
      if (choiceBlock(v.prompt, v.options, v.picked, v.week, v.reply)) add(box, h('div', { class: 'row end' }, h('button', { class: 'btn', type: 'button', on: { click: next } }, v.week < 6 ? 'Week ' + (v.week + 1) : 'After the six weeks')));
    }
    if (v.kind === 'after') { v.paras.forEach(function (x) { add(box, h('p', null, x)); }); add(box, h('div', { class: 'row end' }, h('button', { class: 'btn', type: 'button', on: { click: next } }, 'The letter'))); }
    if (v.kind === 'letter') {
      if (choiceBlock(v.prompt, v.options, v.picked, 'letter', null)) {
        add(box, h('blockquote', { class: 'reply' }, h('p', null, v.letter.body), h('p', null, '— ' + v.letter.from)));
        add(box, h('div', { class: 'row end' }, h('button', { class: 'btn', type: 'button', on: { click: next } }, 'What they never knew')));
      }
    }
    if (v.kind === 'end') {
      add(box, h('ul', { class: 'notes' }, v.items.map(function (x) { return h('li', null, x); })));
      if (v.diary.length) { add(box, h('h3', null, 'The household\'s season, in their own words')); add(box, h('ul', { class: 'notes' }, v.diary.map(function (x) { return h('li', null, x); }))); }
      add(box, h('div', { class: 'row end' }, h('button', { class: 'btn', type: 'button', on: { click: function () {
        store.doorstepDone(ds.runId, ds.who);
        award('heard', 'h-' + ds.runId + '-' + ds.who);
        ui.ds = null; ui.screen = 'ledger'; ui.ledgerRun = r.id; render();
      } } }, 'Close the door')));
    }
    add(box, h('div', { class: 'row', style: 'margin-top:16px' }, h('button', { class: 'tbtn', type: 'button', on: { click: function () { ui.screen = 'title'; render(); } } }, 'Pause and go back to the start')));
    add(app, box);
  }

  /* ---------- Dialogs ---------- */
  function makeDialog(title, build, onCancel) {
    var dlg = h('dialog', { 'aria-labelledby': 'dlg-t' });
    var inner = h('div', { class: 'dlg' });
    var opener = doc.activeElement;
    var closed = false;
    function close() { if (closed) return; closed = true; try { dlg.close(); } catch (e) { /* ignore */ } if (dlg.parentNode) dlg.parentNode.removeChild(dlg); if (opener && opener.focus && doc.contains(opener)) opener.focus(); }
    add(inner, h('div', { class: 'dlg-head' }, h('h2', { id: 'dlg-t' }, title), h('button', { class: 'xbtn', type: 'button', 'aria-label': 'Close', on: { click: function () { close(); if (onCancel) onCancel(); } } }, '×')));
    build(inner, close);
    add(dlg, inner);
    dlg.addEventListener('cancel', function (e) { e.preventDefault(); close(); if (onCancel) onCancel(); });
    return { el: dlg, open: function () { doc.body.appendChild(dlg); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); var f = dlg.querySelector('[data-yes]') || dlg.querySelector('button, input, textarea'); if (f && f.className !== 'xbtn') f.focus(); }, close: close };
  }

  function openGuide() {
    makeDialog('How Wren Hollow works', function (box) {
      var S = [
        ['The idea', ['You are the sluice keeper of a drought-stricken valley for the six weeks before the autumn rains. There is not enough water for everyone. You decide who gets what, how you decide it, and what you tell people.', 'There is no score, no winning and no right answer. Every option you are offered can be defended by a thoughtful person. The Keeper\'s Ledger at the end records what happened and lets the people of the valley speak.']],
        ['The water', ['All quantities are in megalitres (ML). The reservoir holds up to 400 ML. The bottom 20 ML is the dead pool: it lies below the outlet and cannot be released. Each week some water leaks through the old spillway gate, some evaporates, and a little flows in. The inflow forecast is a range; the actual figure falls within it.', 'The autumn rains will come in week 7, 8 or 9. The brief shows the forecasters\' honest odds, which are updated in week 6. After your six weeks, the Water Board\'s standing rule shares whatever is left until the rain comes.']],
        ['The valley', ['Ashby Orchard holds a 1921 right to the first 15 ML each week. Corrow Dale Dairy employs much of the valley. The school garden is small, and it feeds the Harvest Supper. Fennet End\'s forty households have wells that fill only when the Fennet runs, and no seat on the Water Board. The sluice house speaks for the water held back: the fire brigade, the trout and the weeks after.']],
        ['A week', ['Brief: figures, forecast, petitions and news. Valley: three visits; what you say is remembered, and some answers are commitments. Decide: most weeks bring one decision that is not about quantities. Gates: set the four gates. Review: check everything, then open the gates. Nothing is final until then, except visits.']],
        ['Promises', ['Some choices create commitments, to a household or to the reserve. The review screen shows plainly whether your gates meet them. You are free to break a commitment; people will remember.']],
        ['Replays', ['Hindsight replays a finished season from any week, with notes on what happened the first time. Doorstep lets you live through a finished season from inside one household. Other seasons change the starting conditions. Each season card always brings the same weather, so a replay is a fair comparison.']],
        ['Keyring and privacy', ['The Dilemmortals Keyring has 31 positions; only No. 001 is open. Its four marks (Considered, Witnessed, Heard, Revisited) record what you have explored, never what you chose.', 'Everything is saved only in this browser. Nothing you choose or write is sent anywhere. A private note is kept only if you tick the box. You can erase everything in Settings.']],
        ['Keys and controls', ['Everything works with a keyboard: Tab moves between controls, Space or Enter activates them, and the arrow keys move sliders and radio choices. Each gate also has − and + buttons and a number box.']]
      ];
      S.forEach(function (s) { add(box, h('h3', null, s[0])); s[1].forEach(function (p) { add(box, h('p', null, p)); }); });
    }).open();
  }

  function openKeyring() {
    makeDialog('Dilemmortals Keyring', function (box) {
      add(box, h('p', null, 'Thirty-one positions, one for each Dilemmortal. Marks record what you have explored, never which choices you made. None of them is needed to reach any part of the story.'));
      if (keyring.notice()) add(box, h('p', { class: 'storage-note' }, keyring.notice()));
      var ring = h('ul', { class: 'ring', 'aria-label': 'Dilemmortals Keyring, 31 positions' });
      keyring.view().forEach(function (s) {
        var num = 'No. ' + ('00' + s.number).slice(-3);
        if (s.status === 'active') {
          var earned = s.marks.filter(function (m) { return m.earned; }).length;
          var li = h('li', { class: 'slot active', 'aria-label': num + ', ' + s.title + ', open. ' + earned + ' of ' + s.marks.length + ' marks recorded.' });
          add(li, h('span', { class: 'no' }, num + ' · Open'), h('span', { class: 'title' }, s.title));
          add(li, h('ul', { class: 'marks' }, s.marks.map(function (m) {
            return h('li', { class: 'mark' + (m.earned ? ' earned' : '') }, h('span', { class: 'sym', 'aria-hidden': 'true' }, m.earned ? m.symbol : '○'), h('span', null, h('strong', null, m.label)), h('span', { class: 'state' }, (m.earned ? 'Recorded ' + fmtDate(m.at) + '. ' : 'Not yet. ') + m.text));
          })));
          add(ring, li);
        } else add(ring, h('li', { class: 'slot', 'aria-label': num + ', reserved, not yet open' }, h('span', { class: 'no' }, num), h('span', null, 'Reserved'), h('br'), h('span', { class: 'small' }, '🔒 Not yet open')));
      });
      add(box, ring);
      add(box, h('p', { class: 'small muted', style: 'margin-top:10px' }, 'Marks are kept in this browser only. They are a record of your visits, not proof of anything.'));
    }).open();
  }

  function openJournal() {
    var runs = store.get().runs.slice().reverse();
    makeDialog('The Keeper\'s Journal', function (box, close) {
      if (!runs.length) { add(box, h('p', null, 'Finished seasons will appear here.')); return; }
      add(box, h('p', null, 'Your finished seasons in this browser. Pinned seasons are never removed automatically; up to ' + Persist.MAX_RUNS + ' are kept.'));
      runs.forEach(function (r) {
        var s; try { s = WH.replay(r.scenario, r.seed, r.actions); } catch (e) { return; }
        var sm = Story.summary(s);
        add(box, h('section', { class: 'card', style: 'margin-bottom:10px' }, h('h4', null, (r.label || modeName(r.mode) + ' season') + (r.pinned ? ' 📌' : '')), h('p', { class: 'seasoncode' }, code(r.scenario, r.seed) + ' · ' + fmtDate(r.finishedAt)),
          h('p', { class: 'small' }, Story.decisions(s).map(function (d) { return d.text; }).join(' ')),
          h('p', { class: 'small muted' }, 'Rain in week ' + sm.rain + ' · ' + sm.handover + ' ML at handover' + (journal.get(r.id) ? ' · has a private note' : '')),
          h('div', { class: 'row' }, h('button', { class: 'tbtn', type: 'button', on: { click: function () { close(); ui.ledgerRun = r.id; ui.screen = 'ledger'; render(); } } }, 'Open ledger'))));
      });
      add(box, h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', on: { click: function () { close(); exportJournal(runs.slice().reverse()); } } }, 'Export all seasons as text')));
    }).open();
  }

  function openSettings() {
    makeDialog('Settings', function (box, close) {
      var p = prefs.get();
      add(box, radioGroup('pm', 'Motion', [{ id: 'system', label: 'Follow my device setting' }, { id: 'reduce', label: 'Reduce motion' }, { id: 'full', label: 'Allow gentle motion' }], p.motion, function (id) { prefs.set('motion', id); applyPrefs(); }));
      add(box, radioGroup('pt', 'Text size', [{ id: 'normal', label: 'Standard' }, { id: 'large', label: 'Larger' }], p.text, function (id) { prefs.set('text', id); applyPrefs(); }));
      add(box, radioGroup('pc', 'Visits', [{ id: 'full', label: 'Full scenes' }, { id: 'condensed', label: 'Condensed scenes (for replays): first lines and facts, with the rest on request' }], p.condensed ? 'condensed' : 'full', function (id) { prefs.set('condensed', id === 'condensed'); }));
      add(box, h('h3', null, 'Erase saved data'));
      add(box, h('p', { class: 'small muted' }, 'Each of these asks you to confirm first. Other DoorQuests collections are never touched.'));
      function eraser(label, body, fn) {
        return h('button', { class: 'btn ghost', type: 'button', on: { click: function () { close(); confirmDialog(label + '?', body, 'Erase', 'Keep it').then(function (y) { if (y) { fn(); toast('Erased.'); ui.screen = 'title'; st = null; run = null; render(); } }); } } }, label);
      }
      add(box, h('div', { class: 'row' },
        eraser('Erase seasons and ledgers', 'This removes the season in progress, every finished season and its ledger, and Doorstep progress from this browser. Keyring marks and private notes are kept unless you erase them separately.', function () { store.resetAll(); store.load(); }),
        eraser('Erase Keyring marks', 'This removes the four Wren Hollow participation marks from this browser. Your seasons are kept.', function () { keyring.reset(); keyring.load(); }),
        eraser('Erase private notes', 'This removes every private note you chose to keep.', function () { journal.erase(); journal.load(); })));
    }).open();
  }

  /* ---------- Developer panel (only with ?dev=1) ---------- */
  function renderDev() {
    var d = h('div', { class: 'dev' }, h('strong', null, 'Developer mode. '), st ? 'Season ' + code(st.scenario, st.seed) + ' · week ' + st.week + ' · actions ' + actions.length + ' · state hash ' + WH.hash(st) : 'No season loaded.');

  }

  /* ---------- Boot ---------- */
  function boot() {

        WH: WH, Story: Story, Persist: Persist,
        state: function () { return st ? WH.clone(st) : null; }, actions: function () { return actions.slice(); }, hash: function () { return st ? WH.hash(st) : null; },
        ui: function () { return WH.clone({ screen: ui.screen, step: ui.step, draft: ui.draft }); },
        keyring: function () { return keyring.data(); }, store: function () { return WH.clone(store.get()); }
      };
    }
  }
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot); else boot();
})(self.WH, self.WHStory, self.WHPersist);

})();
