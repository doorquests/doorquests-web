<!doctype html>
<html lang="en">

<style>
:root {
  --night: #0e1320;
  --dusk: #171d2c;
  --dusk-2: #1f2638;
  --panel: rgba(31, 38, 56, .82);
  --panel-2: rgba(40, 46, 64, .9);
  --line: rgba(223, 179, 142, .28);
  --line-2: rgba(223, 179, 142, .5);
  --copper: #dfb38e;
  --copper-2: #f2d2ae;
  --amber: #e9b26a;
  --ivory: #f5ecdc;
  --ivory-dim: #cdc4b4;
  --mist: #aeb4c2;
  --water: #8ec3d4;
  --water-deep: #4f8aa0;
  --dry: #c49a62;
  --paper: #f3e9d4;
  --paper-ink: #2c241b;
  --paper-dim: #6b5b47;
  --warn: #ffc77d;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; font-family: var(--sans); color: var(--ivory); line-height: 1.55; font-size: 16px;
  background: radial-gradient(130% 70% at 50% -10%, #3a2f33 0%, #1e2232 42%, var(--night) 100%) fixed;
  background-color: var(--night); overflow-x: hidden;
}
body.large { font-size: 18.5px; }
a { color: var(--copper-2); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--copper-2); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--copper); color: var(--night); padding: 8px 14px; border-radius: 8px; z-index: 50; font-weight: 600; }
.skip:focus { top: 10px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 56px; position: relative; }
header.top { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 0 10px; border-bottom: 1px solid rgba(223,179,142,.16); margin-bottom: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
.home { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; color: var(--copper-2); text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.home svg { width: 16px; height: 22px; }
.coll { color: var(--mist); font-size: .88rem; letter-spacing: .04em; }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--night); background: var(--amber); padding: 3px 8px; border-radius: 999px; }
nav.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn { background: transparent; border: 1px solid var(--line); color: var(--ivory); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: .9rem; min-height: 40px; }
.tbtn:hover { border-color: var(--line-2); background: rgba(223,179,142,.08); }

h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.15; margin: 0 0 .5em; font-weight: 700; }
h1 { font-size: clamp(2.1rem, 6vw, 3.6rem); color: var(--copper-2); letter-spacing: -.01em; }
h2 { font-size: clamp(1.5rem, 3.6vw, 2.1rem); color: var(--ivory); }
h3 { font-size: 1.25rem; color: var(--copper-2); }
h4 { font-size: 1.05rem; color: var(--ivory); font-family: var(--sans); font-weight: 650; letter-spacing: .01em; }
[data-focus]:focus, [data-focus]:focus-visible { outline: none; }
p { margin: 0 0 .9em; }
.lede { font-size: 1.08rem; color: var(--ivory-dim); max-width: 62ch; }
.eyebrow { display: block; font-size: .74rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--copper); margin-bottom: 6px; }
.tagline { font-family: var(--serif); font-style: italic; color: var(--copper); font-size: clamp(1.05rem, 2.4vw, 1.35rem); margin: 4px 0 18px; }
.muted { color: var(--mist); }
.small { font-size: .88rem; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin: 0 0 16px; }
.panel.tight { padding: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 999px; border: 1px solid transparent; font-weight: 650; cursor: pointer; text-decoration: none; background: linear-gradient(180deg, var(--copper-2), var(--copper)); color: #22180f; }
.btn:hover { box-shadow: 0 6px 24px rgba(223,179,142,.28); }
.btn.ghost { background: transparent; color: var(--ivory); border-color: var(--line-2); }
.btn.ghost:hover { background: rgba(223,179,142,.08); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

/* Title scene */
.scene-art { width: 100%; height: auto; display: block; border-radius: var(--r); border: 1px solid var(--line); background: #241f2a; }
.notice { border-left: 4px solid var(--amber); background: rgba(233,178,106,.08); padding: 12px 14px; border-radius: 0 10px 10px 0; margin: 0 0 14px; }
.notice p:last-child { margin: 0; }
.principles { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.principles li::before { content: "— "; color: var(--copper); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h4 { margin: 0; }
.card .row { margin-top: auto; }
.card p { margin: 0; }
.seasoncode { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .82rem; color: var(--mist); }

/* Season frame */
.seasonbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.weeks { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0; flex-wrap: wrap; }
.weeks li { min-width: 40px; text-align: center; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); font-size: .85rem; color: var(--mist); }
.weeks li.done { color: var(--ivory-dim); background: rgba(223,179,142,.08); }
.weeks li.done::before { content: "✓ "; }
.weeks li[aria-current="step"] { color: #22180f; background: var(--copper); border-color: var(--copper); font-weight: 700; }
.modebadge { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px; color: var(--copper-2); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; padding: 0; list-style: none; }
.steps button { background: transparent; border: 1px solid var(--line); color: var(--ivory-dim); border-radius: 999px; padding: 8px 14px; min-height: 42px; cursor: pointer; }
.steps button[aria-current="step"] { background: rgba(223,179,142,.16); color: var(--ivory); border-color: var(--copper); font-weight: 650; }
.steps button .n { display: inline-block; min-width: 1.4em; color: var(--copper); font-weight: 700; }

.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 0 0 12px; }
.fig { background: rgba(14,19,32,.5); border: 1px solid rgba(223,179,142,.18); border-radius: 10px; padding: 10px 12px; }
.fig .k { display: block; font-size: .78rem; color: var(--mist); letter-spacing: .03em; }
.fig .v { display: block; font-size: 1.35rem; font-family: var(--serif); font-weight: 700; color: var(--ivory); }
.fig .u { font-size: .85rem; color: var(--mist); font-family: var(--sans); font-weight: 400; }

.gauge { margin: 6px 0 4px; }
.gauge svg { width: 100%; height: 42px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--mist); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; background: var(--c); }

table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(223,179,142,.14); vertical-align: top; }
th { color: var(--copper-2); font-weight: 650; font-size: .85rem; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
caption { text-align: left; font-family: var(--serif); font-size: 1.05rem; color: var(--ivory); padding-bottom: 6px; }

.outlook { display: grid; gap: 6px; }
.obar { display: grid; grid-template-columns: 70px 1fr 48px; gap: 8px; align-items: center; font-size: .9rem; }
.obar .t { height: 12px; background: rgba(255,255,255,.07); border-radius: 6px; overflow: hidden; }
.obar .f { height: 100%; background: var(--water-deep); }

.notes { margin: 0; padding-left: 1.1em; }
.notes li { margin: 0 0 6px; }
.events { list-style: none; padding: 0; margin: 0 0 12px; }
.events li { border-left: 3px solid var(--amber); padding: 6px 10px; margin: 0 0 8px; background: rgba(233,178,106,.07); border-radius: 0 8px 8px 0; }

.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.place { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 120px; color: var(--ivory); }
.place:hover:not(:disabled) { border-color: var(--copper); background: rgba(52,58,78,.95); }
.place:disabled { cursor: not-allowed; opacity: .62; }
.place .pn { font-family: var(--serif); font-weight: 700; font-size: 1.12rem; color: var(--copper-2); }
.place .pw { font-size: .86rem; color: var(--mist); }
.place .ps { font-size: .86rem; color: var(--ivory-dim); }
.place .tag { align-self: flex-start; font-size: .74rem; border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 8px; color: var(--copper-2); margin-top: auto; }

.visit { background: rgba(243,233,212,.04); border: 1px solid var(--line-2); border-radius: var(--r); padding: 18px; }
.visit .speech p { font-family: var(--serif); font-size: 1.08rem; line-height: 1.6; color: var(--ivory); }
.factlist { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.factlist li { font-size: .84rem; background: rgba(14,19,32,.55); border: 1px solid rgba(223,179,142,.18); border-radius: 999px; padding: 3px 10px; color: var(--ivory-dim); }
.reply { font-family: var(--serif); font-style: italic; color: var(--copper-2); border-left: 3px solid var(--copper); padding: 4px 12px; margin: 10px 0 14px; }

fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; margin: 0 0 14px; min-width: 0; }
legend { padding: 0 6px; font-family: var(--serif); font-weight: 700; color: var(--copper-2); font-size: 1.08rem; }
.opt { display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; align-items: start; padding: 10px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
.opt:hover { background: rgba(223,179,142,.06); }
.opt input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--copper); }
.opt .ol { font-weight: 650; }
.opt .od { grid-column: 2; font-size: .9rem; color: var(--ivory-dim); }
.opt:has(input:checked) { border-color: var(--copper); background: rgba(223,179,142,.1); }

/* Gates */
.chan { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: 10px 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(223,179,142,.14); }
.chan:last-of-type { border-bottom: 0; }
.chan .cn { font-family: var(--serif); font-weight: 700; font-size: 1.1rem; color: var(--copper-2); }
.chan .cm { font-size: .85rem; color: var(--mist); }
.ctl { display: grid; grid-template-columns: 46px minmax(0, 1fr) 46px 84px; gap: 8px; align-items: center; }
.ctl button { min-height: 44px; min-width: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(14,19,32,.6); color: var(--ivory); font-size: 1.2rem; cursor: pointer; }
.ctl input[type=range] { width: 100%; accent-color: var(--copper); min-height: 44px; }
.ctl input[type=number] { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(14,19,32,.7); padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 2; }
.quick button { font-size: .8rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ivory-dim); padding: 4px 10px; min-height: 34px; cursor: pointer; }
.cwarn { grid-column: 1 / -1; font-size: .88rem; color: var(--warn); }
.cwarn::before { content: "⚠ "; }
.cinfo { grid-column: 1 / -1; font-size: .88rem; color: var(--ivory-dim); }
@media (max-width: 700px) {
  .chan { grid-template-columns: 1fr; }
  .quick { grid-column: 1; }
  .ctl { grid-template-columns: 44px minmax(0, 1fr) 44px; grid-template-areas: "minus num plus" "range range range"; }
  .ctl button:first-child { grid-area: minus; } .ctl input[type=number] { grid-area: num; } .ctl button:nth-child(3) { grid-area: plus; } .ctl input[type=range] { grid-area: range; }
  .totals { padding: 8px 12px; }
  .totals .big { font-size: 1rem; }
  .totals .small { display: none; }
  .totals > div:nth-child(2) { font-size: .85rem; }
}
.totals { position: sticky; bottom: 0; z-index: 5; background: rgba(23,29,44,.97); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; margin-top: 12px; display: grid; gap: 4px; }
.totals .big { font-family: var(--serif); font-size: 1.15rem; }
.over { color: var(--warn); font-weight: 650; }

.checks { list-style: none; padding: 0; margin: 0 0 12px; }
.checks li { padding: 6px 0; border-bottom: 1px dashed rgba(223,179,142,.18); }
.checks li .m { font-weight: 700; margin-right: 6px; }

/* Ledger: a handwritten book */
.ledger { background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: clamp(18px, 4vw, 40px); box-shadow: 0 18px 50px rgba(0,0,0,.45); border: 1px solid #d8c7a5; }
.ledger h2, .ledger h3, .ledger h4 { color: var(--paper-ink); }
.ledger h3 { border-bottom: 1px solid #d4c1a0; padding-bottom: 4px; margin-top: 1.4em; }
.ledger .muted, .ledger .small { color: var(--paper-dim); }
.ledger a { color: #7a4a1d; }
.ledger table th { color: #5a3d20; }
.ledger table td, .ledger table th { border-bottom-color: #dccdb0; }
.ledger .voice { font-family: var(--serif); font-style: italic; font-size: 1.05rem; line-height: 1.6; margin: 6px 0 4px; }
.ledger .stake { border-top: 1px solid #dccdb0; padding: 12px 0 6px; }
.ledger .stake:first-of-type { border-top: 0; }
.ledger ul { padding-left: 1.2em; }
.ledger .btn.ghost { color: var(--paper-ink); border-color: #b99c74; }
.ledger :focus-visible { outline-color: #7a4a1d; }
.ledger textarea { width: 100%; min-height: 110px; border-radius: 10px; border: 1px solid #c7b18c; background: #fbf5e8; color: var(--paper-ink); padding: 10px; }
.ledger label { color: var(--paper-ink); }
.kept { font-weight: 700; }

/* Keyring */
.ring { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.slot { border: 1px dashed rgba(174,180,194,.35); border-radius: 10px; padding: 8px; min-height: 76px; font-size: .82rem; color: var(--mist); }
.slot .no { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; color: var(--ivory-dim); display: block; }
.slot.active { border: 1px solid var(--copper); color: var(--ivory); grid-column: 1 / -1; background: rgba(223,179,142,.07); }
.slot.active .title { font-family: var(--serif); font-size: 1.1rem; color: var(--copper-2); display: block; margin: 2px 0 8px; }
.marks { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.mark { border: 1px solid rgba(223,179,142,.3); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 28px 1fr; gap: 2px 8px; }
.mark .sym { font-size: 1.3rem; line-height: 1; grid-row: span 2; }
.mark.earned { border-color: var(--copper); background: rgba(223,179,142,.12); }
.mark.earned .state { color: var(--copper-2); font-weight: 650; }
.mark .state { font-size: .8rem; color: var(--mist); }

/* Dialogs */
dialog { border: 1px solid var(--line-2); border-radius: 16px; background: var(--dusk); color: var(--ivory); padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(5, 8, 14, .72); }
.dlg { padding: 20px; overflow-y: auto; max-height: calc(100vh - 34px); }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.xbtn { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ivory); font-size: 1.3rem; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--dusk-2); border: 1px solid var(--copper); border-radius: 12px; padding: 10px 16px; z-index: 60; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.storage-note { font-size: .88rem; color: var(--warn); margin: 0 0 12px; }

.hindsight { border: 1px dashed var(--water); background: rgba(142,195,212,.07); border-radius: var(--r); padding: 12px 14px; margin: 0 0 16px; }
.hindsight h3 { color: var(--water); font-size: 1.05rem; }
.cmp td:nth-child(2), .cmp td:nth-child(3) { font-variant-numeric: tabular-nums; }
.diff { font-weight: 700; }

.ds-received { list-style: none; padding: 0; margin: 0 0 12px; }
.ds-received li { padding: 5px 0 5px 12px; border-left: 3px solid var(--water-deep); margin-bottom: 4px; }

footer.foot { border-top: 1px solid rgba(223,179,142,.16); margin-top: 28px; padding-top: 16px; font-size: .85rem; color: var(--mist); display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }
footer.foot a { color: var(--copper); text-decoration: none; }

.dev { margin-top: 18px; border: 1px dashed #6f7d9a; border-radius: 10px; padding: 10px; font-size: .82rem; color: var(--mist); }

/* Motion */
.water-shimmer { animation: shimmer 6s ease-in-out infinite alternate; }
@keyframes shimmer { from { opacity: .55; } to { opacity: .85; } }
.fade-in { animation: fadein .35s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.reduced *, .reduced *::before, .reduced *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) {
  body:not(.full-motion) *, body:not(.full-motion) *::before, body:not(.full-motion) *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
  .weeks li[aria-current="step"], .steps button[aria-current="step"], .mark.earned { outline: 2px solid CanvasText; }
}
@media print {
  header.top, nav.tools, .steps, footer.foot, .row { display: none !important; }
  body { background: #fff; color: #000; }
  .ledger { box-shadow: none; }
}

</style>
</head>

    var shape = validateAllocShape(a);
    var u = usable(st);
    if (shape) return { ok: false, errors: [shape], total: 0, usable: u, held: u };
    var total = sum(a);
    var errors = [];
    if (total > u) errors.push('Releases total ' + total + ' ML, but only ' + u + ' ML can be drawn above the dead pool.');
    return { ok: errors.length === 0, errors: errors, total: total, usable: u, held: u - total, afterRelease: st.S - total };
  }

  function apply(state, action) {
    if (!action || typeof action !== 'object' || typeof action.t !== 'string') return err('malformed action');
    if (state.ended) return err('the season has ended');
    var st = clone(state);
    var r;
    switch (action.t) {
      case 'visit': r = doVisit(st, action); break;
      case 'say': r = doSay(st, action); break;
      case 'leave': r = doLeave(st); break;
      case 'morning': r = doMorning(st, action); break;
      case 'gov': r = doGov(st, action); break;
      case 'alloc': r = doAlloc(st, action); break;
      case 'confirm': r = doConfirm(st); break;
      default: return err('unknown action ' + action.t);
    }
    if (r) return err(r);
    st.seq++;
    return { ok: true, state: st };
  }

  function doVisit(st, a) {
    if (st.scene) return 'finish the current visit first';
    if (st.week === 5 && !st.morning) return 'answer the petition first';
    var place = a.place;
    if (place === 'hall') {
      if (!(st.week === 5 && st.morning === 'hall')) return 'there is no meeting this week';
      if (st.visited.indexOf('hall') >= 0) return 'the meeting has already been held';
      st.visited.push('hall');
      st.scene = { place: 'hall', said: null };
      for (var i = 0; i < CH.length; i++) remember(st, CH[i], 'hall');
      remember(st, 'hut', 'hall');
      return null;
    }
    if (PLACES.indexOf(place) < 0) return 'unknown place';
    if (st.visitsLeft <= 0) return 'no visits left this week';
    if (st.visited.indexOf(place) >= 0) return 'already visited this week';
    st.visitsLeft--;
    st.visited.push(place);
    st.scene = { place: place, said: null };
    remember(st, place, 'visited');
    return null;
  }

  function doSay(st, a) {
    if (!st.scene) return 'no visit in progress';
    if (st.scene.said) return 'already answered';
    var place = st.scene.place, opts = visitOptions(st, place), o = null;
    for (var i = 0; i < opts.length; i++) if (opts[i].id === a.opt) o = opts[i];
    if (!o) return 'option not available';
    st.scene.said = o.id;
    var w = st.week;
    if (place === 'hall') { return null; }
    if (place === 'hut') {
      remember(st, 'hut', o.id);
      if (o.id === 'log') addCommit(st, { kind: 'reserve', who: 'hut', min: 40, from: w, until: w, label: 'Hold at least 40 ML after releases (keeper\'s log)' });
      if (o.id === 'history') st.insights.push({ week: w, place: 'hut', text: 'Ada\'s log: in the last three long droughts the rains came in week 7, week 8 and week 9 after the dry began. Her note in the margin: "Nobody knew which, at the time."' });
      if (o.id === 'brigade') st.insights.push({ week: w, place: 'hut', text: 'Sol Barrow: if the dry runs past week 7, a grass fire on Hob\'s Ridge is likely. The brigade would draw about 25 ML from the reservoir to fight it, and has first call on whatever is there.' });
      return null;
    }
    remember(st, place, o.id);
    if (o.id === 'listen') st.insights.push({ week: w, place: place, text: insightText(st, place) });
    if (o.id === 'candid') {
      if (!st.knows[place] && place === 'hamlet') bumpTrust(st, 'hamlet', 1);
      st.knows[place] = true;
      if (place === 'dairy' && !st.flags.earlySale && w <= 3) { st.flags.earlySale = true; st.flags.earlySaleWeek = w + 1; st.out.earlySold = 20; }
    }
    if (o.id === 'promise') addCommit(st, { kind: 'promise', who: place, min: o.min, from: w, until: w, label: 'At least ' + o.min + ' ML to ' + NAMES[place].place + ' (week ' + w + ')' });
    return null;
  }

  function doLeave(st) {
    if (!st.scene) return 'no visit in progress';
    if (!st.scene.said && st.scene.place !== 'hall') remember(st, st.scene.place, 'brief');
    st.scene = null;
    return null;
  }

  function doMorning(st, a) {
    var d = morningDef(st);
    if (!d) return 'no morning decision this week';
    if (st.morning) return 'already decided';
    var ok = d.options.some(function (o) { return o.id === a.opt; });
    if (!ok) return 'option not available';
    st.morning = a.opt;
    st.flags.hall = a.opt;
    if (a.opt === 'rounds') st.visitsLeft = 5;
    if (a.opt === 'hall') {
      st.visitsLeft = 0; st.flags.hallRec = hallRecommendation(st);
      bumpTrust(st, 'hamlet', 2); bumpTrust(st, 'school', 1);
      if (st.trust.orchard < 2) bumpTrust(st, 'orchard', -1);
    }
    if (a.opt === 'alone') { bumpTrust(st, 'orchard', 1); bumpTrust(st, 'hamlet', -1); remember(st, 'hamlet', 'refused_hall'); }
    return null;
  }

  function doGov(st, a) {
    var d = govDef(st);
    if (!d) return 'no decision this week';
    if (d.groups) {
      var o = a.opt;
      if (!o || typeof o !== 'object' || Array.isArray(o)) return 'report needs one choice per question';
      var keys = Object.keys(o);
      if (keys.length !== d.groups.length) return 'report needs one choice per question';
      for (var i = 0; i < d.groups.length; i++) {
        var g = d.groups[i];
        if (!has(o, g.id) || !g.options.some(function (x) { return x.id === o[g.id]; })) return 'bad choice for ' + g.id;
      }
      st.draft.gov = { voice: o.voice, deed: o.deed, reserve: o.reserve };
      return null;
    }
    if (!d.options.some(function (x) { return x.id === a.opt; })) return 'option not available';
    st.draft.gov = a.opt;
    return null;
  }

  function doAlloc(st, a) {
    var shape = validateAllocShape(a.a);
    if (shape) return shape;
    st.draft.alloc = { orchard: a.a.orchard, dairy: a.a.dairy, school: a.a.school, hamlet: a.a.hamlet };
    return null;
  }

  /* Ready-to-confirm checks (also used by the UI review screen). */
  function readiness(st) {
    var problems = [];
    if (st.ended) problems.push('The season has ended.');
    if (st.scene) problems.push('Finish your visit first.');
    if (st.week === 5 && !st.morning) problems.push('Answer the petition from Fennet End.');
    var d = govDef(st);
    if (d && !st.draft.gov) problems.push('Choose: ' + d.title + '.');
    var c = checkAlloc(st, st.draft.alloc);
    if (!c.ok) problems = problems.concat(c.errors);
    return { ok: problems.length === 0, problems: problems };
  }

  /* ------------------------------------------------------------------ */
  /* The hall's recommendation (week 5)                                  */
  /* ------------------------------------------------------------------ */
  function hallRecommendation(st) {
    // The room's advice: keep households and the children's garden whole,
    // hold back what the brigade asked for, and split the rest between the
    // two livelihoods in proportion to their need. It is advice, not law.
    var n = needs(st, 5), u = usable(st);
    var rec = { orchard: 0, dairy: 0, school: 0, hamlet: 0 };
    var left = Math.max(0, u - BRIGADE_ML);
    rec.hamlet = Math.min(n.hamlet, left, CH_MAX.hamlet); left -= rec.hamlet;
    rec.school = Math.min(n.school, left, CH_MAX.school); left -= rec.school;
    var share = n.orchard + n.dairy;
    var o = share ? Math.floor(left * n.orchard / share) : 0;
    rec.orchard = Math.min(o, n.orchard, CH_MAX.orchard);
    rec.dairy = Math.min(left - rec.orchard, n.dairy, CH_MAX.dairy);
    if (rec.dairy < 0) rec.dairy = 0;
    return rec;
  }

  /* ------------------------------------------------------------------ */
  /* Confirm: resolve the week                                           */
  /* ------------------------------------------------------------------ */
  function doConfirm(st) {
    var rd = readiness(st);
    if (!rd.ok) return rd.problems[0];
    var sc = scenarioOf(st), w = st.week, f = st.flags;
    var a = clone(st.draft.alloc), gov = st.draft.gov;
    var n = needs(st, w);
    var notes = [];
    var S0 = st.S;
    var total = sum(a);

    /* 1. Governance decided this week takes effect before the water moves
          where it physically would (repairs, the bore). */
    var govNotes = applyGovernance(st, gov, a, notes);

    /* 2. Effective supply. */
    var eff = clone(a);
    var extra = { bore: 0, night: 0, share: 0 };
    if (f.bore && (f.boreStopWeek === null || w < f.boreStopWeek)) { eff.orchard += 6; eff.hamlet = Math.max(0, eff.hamlet - 4); extra.bore = 1; }
    if (w === 4 && f.nightWater > 0) { eff.hamlet += f.nightWater; extra.night = f.nightWater; }
    if (w === 6 && f.sharing === 'share') {
      var give = Math.min(3, eff.orchard); eff.orchard -= give; eff.school += give;
      var bow = Math.min(2, eff.dairy); eff.dairy -= bow; eff.hamlet += bow;
      extra.share = give + bow;
    }

    /* 3. Water. */
    var S1 = S0 - total;
    var seep = Math.min(seepage(st, w), S1); S1 -= seep;
    var evap = Math.round(S1 * sc.evap[w - 1]); S1 -= evap;
    var inflow = st.weather.inflow[w - 1];
    var S2 = S1 + inflow, spill = 0;
    if (S2 > sc.capacity) { spill = S2 - sc.capacity; S2 = sc.capacity; }
    st.S = S2;
    st.minStorage = Math.min(st.minStorage, S2);

    /* 4. Conditions. */
    var ratio = {};
    for (var i = 0; i < CH.length; i++) { var k = CH[i]; ratio[k] = n[k] ? Math.min(1.2, eff[k] / n[k]) : 1; }
    var before = clone(st.out);
    stressWeek(st, ratio, W_ORCH[w - 1], W_HAM[w - 1], true);
    st.minSeason = Math.min(st.minSeason, S2);
    if (eff.hamlet < 4) st.out.streamStopped++;

    /* 5. Commitments. */
    var cl = evaluateCommitments(st, a, S0 - total, w);

    /* 6. Relationships. */
    relationships(st, a, ratio, cl, w);

    /* 7. Narrative notes for this week. */
    conditionNotes(st, before, ratio, eff, notes);
    cl.forEach(function (c) { notes.push(c.note); });
    if (extra.bore) notes.push('The Ashby bore ran all week: about 6 ML more for the orchard, about 4 ML less reaching Fennet End\'s wells.');
    if (extra.share) notes.push('Neighbours shared without being asked: the Ashbys ran 3 ML down the school pipe, and the dairy\'s bowser went to Fennet End.');

    st.history.push({
      week: w, S0: S0, alloc: a, eff: eff, need: n, total: total, seep: seep, evap: evap,
      inflow: inflow, spill: spill, S2: S2, night: w === 4 ? f.nightWater : 0, gov: gov,
      morning: st.morning, visited: st.visited.slice(), said: [], ratio: ratio,
      notes: notes.slice(), govNotes: govNotes, extra: extra, out: clone(st.out)
    });

    st.notes = notes;
    /* 8. Advance. */
    if (w === WEEKS) { postSeason(st); return null; }
    st.week = w + 1;
    st.visitsLeft = 3;
    st.visited = [];
    st.scene = null;
    st.morning = null;
    st.draft = { alloc: clampAllocTo(st, a), gov: null };
    weekStart(st);
    return null;
  }

  function clampAllocTo(st, a) {
    // Carry last week's gates forward as a starting point (the player can change them).
    return { orchard: a.orchard, dairy: a.dairy, school: a.school, hamlet: a.hamlet };
  }

  function stressWeek(st, ratio, wo, wh, inSeason) {
    var s = st.stress, sc = scenarioOf(st), o = st.out;
    var d = {};
    CH.forEach(function (k) { d[k] = Math.max(0, 1 - ratio[k]); });
    // orchard
    if (d.orchard > 0) { s.orchard += wo * p15(d.orchard); if (inSeason) o.harvest *= Math.max(0, 1 - 0.45 * d.orchard * wo); }
    else s.orchard = Math.max(0, s.orchard - 0.15);
    // dairy
    if (d.dairy > 0) s.dairy += p125(d.dairy); else s.dairy = Math.max(0, s.dairy - 0.2);
    // school
    if (d.school > 0) s.school += p15(d.school); else s.school = Math.max(0, s.school - 0.2);
    // hamlet
    if (d.hamlet > 0) s.hamlet += wh * p125(d.hamlet); else s.hamlet = Math.max(0, s.hamlet - 0.25);

    o.youngLost = Math.max(o.youngLost, Math.round(sc.young * clamp((s.orchard - 0.9) / 2.0, 0, 1)));
    o.oldLost = Math.max(o.oldLost, Math.round(sc.old * clamp((s.orchard - 2.2) / 2.0, 0, 1)));
    o.cowsSold = Math.max(o.cowsSold, Math.round((sc.herd - o.earlySold) * clamp((s.dairy - 0.5) / 4, 0, 0.7)));
    o.jobsLost = Math.max(o.jobsLost, Math.round(sc.jobs * clamp((s.dairy - 1.2) / 4, 0, 0.6)));
    o.bedsLost = Math.max(o.bedsLost, Math.round(sc.beds * clamp((s.school - 0.6) / 2.4, 0, 1)));
    o.wellsDry = Math.round(sc.households * clamp((s.hamlet - 0.6) / 2.8, 0, 1));
    o.maxWellsDry = Math.max(o.maxWellsDry, o.wellsDry);
    if (o.wellsDry >= 4) o.bowserWeeks++;
  }

  /* Plain lines about what this week's water did. Facts, never verdicts. */
  function conditionNotes(st, before, ratio, eff, notes) {
    var o = st.out, sc = scenarioOf(st), w = st.week;
    // Orchard
    if (o.oldLost > before.oldLost) notes.push('Ashby Orchard: ' + plural(o.oldLost - before.oldLost, 'old pear') + ' on the Founders\' Row ' + (o.oldLost - before.oldLost === 1 ? 'has' : 'have') + ' died back past saving.');
    if (o.youngLost > before.youngLost) notes.push('Ashby Orchard: ' + plural(o.youngLost - before.youngLost, 'young tree') + ' in the east rows lost.');
    if (ratio.orchard >= 1) notes.push('Ashby Orchard had all it needed this week. The fruit is sizing.');
    else if (ratio.orchard >= 0.7 && o.youngLost === before.youngLost) notes.push('Ashby Orchard was short, but the trees held. The pears will be smaller.');
    else if (o.youngLost === before.youngLost && o.oldLost === before.oldLost) notes.push('Ashby Orchard went short. Leaves are dropping on the young trees.');
    // Dairy
    if (st.flags.earlySale && st.flags.earlySaleWeek === w + 1) notes.push('Corrow Dale Dairy will send 20 cows to next week\'s sale, while prices hold.');
    if (o.cowsSold > before.cowsSold) notes.push('Corrow Dale Dairy sold ' + plural(o.cowsSold - before.cowsSold, 'cow') + ' at a falling market.');
    if (o.jobsLost > before.jobsLost) notes.push('Corrow Dale Dairy cut ' + plural(o.jobsLost - before.jobsLost, 'job') + ' at the creamery. ' + (o.jobsLost - before.jobsLost > 1 ? 'Some of them live at Fennet End.' : ''));
    if (ratio.dairy >= 1) notes.push('Corrow Dale Dairy had its full need. Yield held.');
    else if (o.cowsSold === before.cowsSold && o.jobsLost === before.jobsLost) notes.push(ratio.dairy >= 0.7 ? 'Corrow Dale Dairy managed. Milk yield is down a little.' : 'Corrow Dale Dairy got through the week by trucking water at its own cost.');
    // School
    if (o.bedsLost > before.bedsLost) notes.push('The school garden lost ' + plural(o.bedsLost - before.bedsLost, 'bed') + '. The children pulled up what had died, and kept the seeds.');
    else if (ratio.school >= 1) notes.push('The school garden had all it needed.');
    else notes.push('The school garden went short. The children carried washing-up water to the beans.');
    // Hamlet
    if (o.wellsDry > before.wellsDry) notes.push('Fennet End: ' + plural(o.wellsDry, 'well') + ' now dry, ' + (o.wellsDry - before.wellsDry) + ' more than last week.');
    else if (o.wellsDry < before.wellsDry) notes.push('Fennet End: the stream came back enough for ' + plural(before.wellsDry - o.wellsDry, 'well') + ' to recover.');
    else if (o.wellsDry === 0) notes.push(ratio.hamlet >= 1 ? 'Fennet End: the Fennet ran clear all week and every well drew.' : 'Fennet End: every well still draws, though lower.');
    else notes.push('Fennet End: ' + plural(o.wellsDry, 'well') + ' still dry.');
    if (o.wellsDry >= 4 && before.wellsDry < 4) notes.push(o.bowserWeeks > 1 ? 'The county water bowser is back at Fennet End.' : 'The county water bowser started coming to Fennet End on Tuesdays and Fridays.');
    if (eff.hamlet < 4) notes.push('The Fennet stopped flowing under the footbridge.');
    // Reservoir
    if (st.S < 35) notes.push('The reservoir is below 35 ML. Nia Pryce found dead trout along the margin.');
    else if (st.S < 60) notes.push('The reservoir is below 60 ML. The trout are crowding the deep water by the dam.');
  }

  function evaluateCommitments(st, a, held, w) {
    var out = [];
    activeCommits(st, w).forEach(function (c) {
      var actual = c.kind === 'reserve' || c.kind === 'floor' ? held : a[c.who];
      var kept = actual >= c.min;
      var note;
      var who = c.who === 'hut' ? 'the reserve' : NAMES[c.who].place;
      if (c.kind === 'reserve' || c.kind === 'floor') note = (kept ? 'Held ' : 'Held only ') + actual + ' ML after releases, against the ' + c.min + ' ML ' + (c.kind === 'floor' ? 'floor promised to the river warden' : 'written in the keeper\'s log') + '.';
      else note = (kept ? 'Kept: ' : 'Not kept: ') + c.label.replace(/ \(week \d\)$/, '') + ' — released ' + actual + ' ML.';
      var rec = { id: c.id, kind: c.kind, who: c.who, week: w, min: c.min, actual: actual, kept: kept, note: note };
      st.commitLog.push(rec);
      out.push(rec);
    });
    return out;
  }

  function relationships(st, a, ratio, cl, w) {
    var f = st.flags;
    // Being visited
    st.visited.forEach(function (p) { if (CH.indexOf(p) >= 0) bumpTrust(st, p, 1); });
    // Allocation against what each considers their fair claim
    CH.forEach(function (k) {
      var n = needs(st, w)[k];
      var expect = k === 'orchard' ? (f.deedOutcome === 'loan' ? 10 : 15) : Math.ceil(n * 0.66);
      var r = expect ? a[k] / expect : 1;
      var dlt = r < 0.35 ? -2 : r < 0.7 ? -1 : 0;
      if (k === 'orchard' && f.deed === 'vary' && dlt < 0 && hasMem(st, 'orchard', 'visited')) dlt += 1; // asked to their face
      bumpTrust(st, k, dlt);
      if (dlt <= -2) remember(st, k, 'short');
    });
    // Seeing someone else's trough run full while yours runs dry
    var full = CH.filter(function (k) { return ratio[k] >= 1; });
    if (full.length) CH.forEach(function (k) {
      if (ratio[k] <= 0.4 && full.indexOf(k) < 0 && full.some(function (x) { return x !== 'school'; })) { bumpTrust(st, k, -1); remember(st, k, 'saw_unfair'); }
    });
    // Commitments
    cl.forEach(function (c) {
      if (c.who === 'hut') { remember(st, 'hut', c.kept ? 'kept_reserve' : 'broke_reserve'); return; }
      if (c.kind === 'promise') { bumpTrust(st, c.who, c.kept ? 1 : -2); remember(st, c.who, c.kept ? 'promise_kept' : 'promise_broken'); }
      else if (!c.kept) {
        var hit = c.kind === 'deal' ? -3 : -2;
        bumpTrust(st, c.who, hit);
        remember(st, c.who, c.kind + '_broken');
      }
    });
    // Week 5 hall: following or setting aside the room's advice
    if (w === 5 && f.hall === 'hall' && f.hallRec) {
      var follow = CH.every(function (k) { return Math.abs(a[k] - f.hallRec[k]) <= 2; });
      f.hallFollowed = follow;
      if (follow) { bumpTrust(st, 'hamlet', 1); bumpTrust(st, 'school', 1); }
      else { bumpTrust(st, 'hamlet', -2); bumpTrust(st, 'school', -1); remember(st, 'hamlet', 'ignored_hall'); }
    }
  }

  /* Governance resolution. Returns a list of plain lines describing what happened. */
  function applyGovernance(st, gov, a, notes) {
    var w = st.week, f = st.flags, out = [];
    function line(s) { out.push(s); notes.push(s); }
    if (w === 1) {
      f.notice = gov;
      if (gov === 'honest') {
        CH.forEach(function (k) { st.knows[k] = true; });
        bumpTrust(st, 'hamlet', 1);
        if (!f.earlySale) { f.earlySale = true; f.earlySaleWeek = 2; st.out.earlySold = 20; }
        line('Your notice went up on Monday: storage, releases and the honest forecast. By Wednesday it had been photographed, discussed at the Kingfisher, and read aloud at Fennet End.');
      } else if (gov === 'calm') {
        line('Your calm notice went up on Monday. Nobody at the Kingfisher argued with it.');
      } else {
        line('No notice went up this week. People asked one another what the keeper had said.');
      }
    }
    if (w === 2) {
      f.deed = gov;
      if (gov === 'honor') {
        f.deedOutcome = 'honor';
        addCommit(st, { kind: 'deed', who: 'orchard', min: 15, from: 2, until: 6, label: 'At least 15 ML to Ashby Orchard (the 1921 right)' });
        bumpTrust(st, 'orchard', 2); bumpTrust(st, 'hamlet', -1); bumpTrust(st, 'dairy', -1);
        remember(st, 'orchard', 'deed_honored'); remember(st, 'hamlet', 'deed_honored');
        line('You honored the Ashby right in full. Hannah Ashby wrote one line on the back of your notice: "Thank you for remembering."');
      } else if (gov === 'vary') {
        f.deedOutcome = 'vary';
        bumpTrust(st, 'orchard', hasMem(st, 'orchard', 'visited') ? -1 : -2);
        remember(st, 'orchard', 'deed_varied');
        line('You varied the Ashby right under the Drought Order. Owen Ashby has asked the Board for the appeal forms.');
      } else if (gov === 'loan') {
        var willing = st.trust.orchard + (st.visited.indexOf('orchard') >= 0 ? 1 : 0) + (hasMem(st, 'orchard', 'askloan') ? 1 : 0);
        if (willing >= 2) {
          f.deedOutcome = 'loan';
          addCommit(st, { kind: 'loan', who: 'orchard', min: 10, from: 2, until: 6, label: 'At least 10 ML to Ashby Orchard (the right, as lent)' });
          bumpTrust(st, 'orchard', 1);
          remember(st, 'orchard', 'deed_loan');
          line('The Ashbys agreed to lend a third of their right. Hannah signed; Owen witnessed. The paper names the first refill after the rains as theirs.');
        } else {
          f.deedOutcome = 'honor';
          addCommit(st, { kind: 'deed', who: 'orchard', min: 15, from: 2, until: 6, label: 'At least 15 ML to Ashby Orchard (the 1921 right)' });
          remember(st, 'orchard', 'loan_declined');
          line('The Ashbys declined to lend any part of their right. It stands as written: 15 ML a week to the end of the season.');
        }
      }
    }
    if (w === 3) {
      f.spill = gov;
      if (gov === 'deal') {
        f.spillOutcome = 'deal'; st.seepFixedFrom = 4;
        addCommit(st, { kind: 'deal', who: 'dairy', min: 22, from: 4, until: 6, label: 'At least 22 ML to Corrow Dale Dairy (the spillway agreement)' });
        bumpTrust(st, 'dairy', 2); remember(st, 'dairy', 'spill_deal');
        if (f.notice === 'honest') { f.dealRevealed = true; bumpTrust(st, 'hamlet', -1); bumpTrust(st, 'orchard', -1); remember(st, 'hamlet', 'heard_deal'); remember(st, 'orchard', 'heard_deal'); }
        line('Rosalind Corrow\'s crew had the spillway gate sealed by Saturday. The agreement is on the Board\'s record: at least 22 ML a week to the dairy, weeks 4 to 6.');
      } else if (gov === 'repair') {
        var will = st.trust.dairy + (st.visited.indexOf('dairy') >= 0 ? 1 : 0) + (hasMem(st, 'dairy', 'askrepair') ? 1 : 0);
        if (will >= 3) {
          f.spillOutcome = 'repair'; st.seepFixedFrom = 4; bumpTrust(st, 'dairy', 1); remember(st, 'dairy', 'repaired_free');
          line('Rosalind Corrow\'s crew sealed the spillway gate on Friday and asked for nothing in writing. "Put it down as the dairy\'s turn," she said.');
        } else {
          f.spillOutcome = 'board'; st.seepFixedFrom = 6; remember(st, 'dairy', 'declined_repair');
          line('Rosalind Corrow declined to repair the gate without an agreement. The job went to the Water Board\'s crew, booked for week 6.');
        }
      } else if (gov === 'board') {
        f.spillOutcome = 'board'; st.seepFixedFrom = 6;
        line('You reported the leaking gate to the Water Board. Their crew is booked for week 6.');
      } else if (gov === 'party') {
        var keen = CH.filter(function (k) { return st.trust[k] + (st.visited.indexOf(k) >= 0 ? 1 : 0) >= 1; });
        if (keen.length >= 2) {
          f.spillOutcome = 'party'; st.seepFixedFrom = 5;
          keen.forEach(function (k) { bumpTrust(st, k, 1); remember(st, k, 'party'); });
          line('The work party turned out on Saturday: ' + keen.map(function (k) { return NAMES[k].place; }).join(', ') + '. The gate is shored and will be sealed for week 5.');
        } else {
          f.spillOutcome = 'party-thin'; st.seepFixedFrom = 6;
          line('Only a handful came to the work party. The gate was shored but not sealed; the Board\'s crew will finish it in week 6.');
        }
      }
    }
    if (w === 4) {
      f.w4choice = gov;
      if (f.w4 === 'night') {
        if (gov === 'report') { bumpTrust(st, 'orchard', 1); bumpTrust(st, 'hamlet', -2); remember(st, 'hamlet', 'kit_reported'); remember(st, 'orchard', 'kit_reported'); f.w4outcome = 'reported';
          line('You reported the diversion. The Board\'s officer came on Thursday; Kit Fennick was cautioned and fined £120. Fennet End took up a collection by Friday.'); }
        if (gov === 'quiet') { bumpTrust(st, 'hamlet', 1); bumpTrust(st, 'orchard', -1); remember(st, 'hamlet', 'kit_quiet'); remember(st, 'orchard', 'kit_quiet'); f.w4outcome = 'quiet';
          line('You spoke to Kit and Edie at their kitchen table and made no report. Hannah Ashby nailed the ditch board down herself.'); }
        if (gov === 'open') {
          addCommit(st, { kind: 'kit', who: 'hamlet', min: 10, from: 4, until: 6, label: 'At least 10 ML to Fennet End (after the night water)' });
          bumpTrust(st, 'hamlet', 2); bumpTrust(st, 'orchard', st.trust.orchard >= 1 ? 1 : -1);
          remember(st, 'hamlet', 'kit_open'); remember(st, 'orchard', st.trust.orchard >= 1 ? 'kit_open_ok' : 'kit_open_sore'); f.w4outcome = 'open';
          line('Kit walked up the Ashby lane on Tuesday and knocked. What was said is between them; she came back down with a sack of windfall pears. Fennet End is promised at least 10 ML a week.');
        }
      } else if (f.w4 === 'bore') {
        if (gov === 'ask') {
          if (st.trust.orchard + (st.visited.indexOf('orchard') >= 0 ? 1 : 0) >= 1) {
            f.boreStopWeek = 5; f.w4outcome = 'stopped';
            addCommit(st, { kind: 'bore', who: 'orchard', min: 18, from: 4, until: 6, label: 'At least 18 ML to Ashby Orchard (the bore agreement)' });
            remember(st, 'orchard', 'bore_agreed');
            line('The Ashbys agreed to switch the bore off from week 5, on your word of 18 ML a week.');
          } else {
            f.w4outcome = 'refused'; remember(st, 'orchard', 'bore_refused'); bumpTrust(st, 'hamlet', -1);
            line('The Ashbys refused to stop pumping. "It is our water, under our land," Owen said.');
          }
        }
        if (gov === 'accept') { f.w4outcome = 'continued'; bumpTrust(st, 'orchard', 1); bumpTrust(st, 'hamlet', -1); remember(st, 'hamlet', 'bore_accepted');
          line('You let the bore run. The orchard pump hums day and night now.'); }
        if (gov === 'hearing') { f.boreStopWeek = 6; f.w4outcome = 'hearing'; bumpTrust(st, 'orchard', -2); bumpTrust(st, 'hamlet', 1); remember(st, 'orchard', 'bore_hearing');
          line('You referred the bore to the Board\'s groundwater hearing, set for week 6. The Ashbys received the letter on Thursday.'); }
      } else {
        if (gov === 'floor') { addCommit(st, { kind: 'floor', who: 'hut', min: 60, from: 4, until: 6, label: 'At least 60 ML held after releases (the trout)' }); f.w4outcome = 'floor';
          line('You committed to a 60 ML floor for the trout. Nia Pryce wrote it on the board by the dam.'); }
        if (gov === 'rescue') { f.troutRescue = true; f.w4outcome = 'rescue'; bumpTrust(st, 'school', 1); remember(st, 'school', 'rescue');
          line('The fish rescue ran on Saturday. Ms Oduya\'s oldest pupils carried buckets to the Kell pool; Nia counted 212 trout moved.'); }
        if (gov === 'decline') { f.w4outcome = 'declined';
          line('You declined both requests. Nia Pryce thanked you for answering quickly.'); }
      }
    }
    if (w === 6) {
      f.report = gov;
      line('Your report to the Water Board went in the Friday post.');
    }
    return out;
  }

  /* Setup at the start of each week. */
  function weekStart(st) {
    var w = st.week, f = st.flags;
    if (w === 2 && f.notice === 'private') {
      var sharePerNeed = function (k) { var h = st.history[0]; return h.alloc[k] / (h.need[k] || 1); };
      if (sharePerNeed('dairy') > sharePerNeed('hamlet') + 0.15) { f.rumor = true; bumpTrust(st, 'hamlet', -1); remember(st, 'hamlet', 'rumor'); }
    }
    if (w === 4) {
      if (st.stress.hamlet >= 0.55) {
        f.w4 = 'night';
        var take = Math.min(6, usable(st));
        f.nightWater = take; st.S -= take; st.minStorage = Math.min(st.minStorage, st.S); st.minSeason = Math.min(st.minSeason, st.S);
      } else if (st.stress.orchard >= 0.6 && (st.knows.orchard || f.deed === 'vary')) {
        f.w4 = 'bore'; f.bore = true;
      } else f.w4 = 'trout';
      if (f.notice === 'calm') {
        var hard = st.history.slice(1).some(function (h) { return CH.some(function (k) { return h.ratio[k] < 0.5; }); });
        if (hard) { f.calmBroken = true; CH.forEach(function (k) { bumpTrust(st, k, -1); remember(st, k, 'calm_broken'); }); }
      }
    }
    if (w === 5 && f.spill === 'deal' && !f.dealRevealed) {
      // the hall or rounds bring it out; handled when the morning is chosen? Keep simple: revealed in week 5 by the Board's published minutes.
      f.dealRevealed = true; bumpTrust(st, 'hamlet', -1); bumpTrust(st, 'orchard', -1);
      remember(st, 'hamlet', 'heard_deal'); remember(st, 'orchard', 'heard_deal');
    }
    if (w === 6) {
      var avg = CH.reduce(function (s, k) { return s + st.trust[k]; }, 0) / CH.length;
      var together = f.hall === 'hall' || f.spillOutcome === 'party';
      if (together && avg >= 1) f.sharing = 'share';
      else if (avg <= -1) f.sharing = 'quarrel';
      else f.sharing = 'none';
    }
  }

  /* ------------------------------------------------------------------ */
  /* After the six weeks                                                 */
  /* ------------------------------------------------------------------ */
  function postSeason(st) {
    var sc = scenarioOf(st), wx = st.weather, dry = wx.rainWeek - 7;
    var weeks = [];
    var fire = 'none', brigadeDrawn = 0, fireWeek = null;
    for (var i = 0; i < dry; i++) {
      var wk = 7 + i, S0 = st.S, n = clone(sc.need), u = Math.max(0, S0 - sc.deadPool);
      if (st.flags.earlySale) n.dairy = Math.max(0, n.dairy - 3);
      var rec = { week: wk, S0: S0, brigade: 0, alloc: { orchard: 0, dairy: 0, school: 0, hamlet: 0 } };
      if (i === 0 && wx.fire) {
        brigadeDrawn = Math.min(BRIGADE_ML, u);
        rec.brigade = brigadeDrawn; u -= brigadeDrawn; st.S -= brigadeDrawn;
        fire = brigadeDrawn >= BRIGADE_ML ? 'contained' : 'spread';
        fireWeek = wk;
      }
      // The Board's standing rule after the keeper's term: 60% of need, pro rata, from what is there.
      var want = {}, wantTotal = 0;
      CH.forEach(function (k) { want[k] = Math.round(n[k] * 0.6); wantTotal += want[k]; });
      var give = Math.min(u, wantTotal);
      rec.alloc = proRata(want, give);
      var total = sum(rec.alloc);
      var S1 = st.S - total;
      var seep = Math.min(seepage(st, wk), S1); S1 -= seep;
      var evap = Math.round(S1 * sc.postEvap); S1 -= evap;
      var inflow = wx.post[i];
      st.S = Math.min(sc.capacity, S1 + inflow);
      st.minStorage = Math.min(st.minStorage, st.S);
      var ratio = {};
      CH.forEach(function (k) { ratio[k] = n[k] ? Math.min(1.2, rec.alloc[k] / n[k]) : 1; });
      stressWeek(st, ratio, POST_WO, POST_WH, false);
      rec.seep = seep; rec.evap = evap; rec.inflow = inflow; rec.S2 = st.S; rec.total = total; rec.ratio = ratio;
      weeks.push(rec);
    }
    var acres = fire === 'spread' ? 140 : fire === 'contained' ? 12 : 0;
    var fireLoss = { cows: 0, jobs: 0 };
    if (fire === 'spread') {
      // The fire takes the dairy's winter hay on the ridge barns.
      var herdLeft = sc.herd - st.out.earlySold - st.out.cowsSold;
      fireLoss.cows = Math.round(herdLeft * 0.12);
      fireLoss.jobs = Math.min(2, sc.jobs - st.out.jobsLost);
      st.out.cowsSold += fireLoss.cows; st.out.jobsLost += fireLoss.jobs;
    }
    st.post = { rainWeek: wx.rainWeek, dryWeeks: dry, weeks: weeks, fire: fire, fireWeek: fireWeek, acres: acres, brigadeDrawn: brigadeDrawn, fireLoss: fireLoss };
    st.ended = true;
    st.scene = null;
    st.ending = computeEnding(st);
  }

  function proRata(want, give) {
    var total = sum(want), out = { orchard: 0, dairy: 0, school: 0, hamlet: 0 };
    if (total <= 0 || give <= 0) return out;
    if (give >= total) return clone(want);
    var rem = [], used = 0;
    CH.forEach(function (k) { var exact = want[k] * give / total; out[k] = Math.floor(exact); used += out[k]; rem.push({ k: k, r: exact - out[k] }); });
    rem.sort(function (x, y) { return y.r - x.r || CH.indexOf(x.k) - CH.indexOf(y.k); });
    for (var i = 0; used < give && i < rem.length; i++) { out[rem[i].k]++; used++; }
    return out;
  }

  function computeEnding(st) {
    var sc = scenarioOf(st), o = st.out, p = st.post;
    var trout = st.minSeason < 35 ? (st.flags.troutRescue ? 'rescued' : 'kill') : st.minSeason < 60 ? 'stressed' : 'well';
    var troutAfter = p.dryWeeks > 0 && st.minStorage < 35 && st.minSeason >= 35 ? 'kill-after' : null;
    var lastEff = st.history[WEEKS - 1].eff;
    var bedsLeft = sc.beds - o.bedsLost;
    var supper = bedsLeft >= Math.ceil(sc.beds / 2) ? 'garden' : bedsLeft > 0 ? 'mixed' : 'bought';
    var fireHurt = p.fire === 'spread';
    return {
      orchard: { youngLost: o.youngLost, oldLost: o.oldLost, young: sc.young, old: sc.old, harvestPct: Math.max(0, pct(o.harvest)) },
      dairy: { herd: sc.herd, sold: o.cowsSold + o.earlySold, earlySold: o.earlySold, jobs: sc.jobs, jobsLost: o.jobsLost, hayBurned: fireHurt, fireCows: p.fireLoss.cows, fireJobs: p.fireLoss.jobs },
      school: { beds: sc.beds, bedsLost: o.bedsLost, supper: supper, lastWeek: lastEff.school },
      hamlet: { households: sc.households, maxDry: o.maxWellsDry, dryAtEnd: o.wellsDry, bowserWeeks: o.bowserWeeks, streamStopped: o.streamStopped },
      reserve: { end: st.S, handover: st.history[WEEKS - 1].S2, min: st.minStorage, minSeason: st.minSeason, trout: trout, troutAfter: troutAfter, fire: p.fire, acres: p.acres, rainWeek: p.rainWeek, dryWeeks: p.dryWeeks },
      commitments: { kept: st.commitLog.filter(function (c) { return c.kept; }).length, broken: st.commitLog.filter(function (c) { return !c.kept; }).length }
    };
  }

  /* ------------------------------------------------------------------ */
  /* Replay & hashing                                                    */
  /* ------------------------------------------------------------------ */
  function replay(scenarioId, seed, actions, opts) {
    var st = newSeason(scenarioId, seed);
    var stopWeek = opts && opts.untilWeek;
    for (var i = 0; i < actions.length; i++) {
      if (stopWeek && st.week >= stopWeek) break;
      var r = apply(st, actions[i]);
      if (!r.ok) throw new Error('Replay failed at action ' + i + ' (' + JSON.stringify(actions[i]) + '): ' + r.error);
      st = r.state;
    }
    return st;
  }
  /* Number of leading actions that finish before week `k` starts. */
  function prefixBeforeWeek(scenarioId, seed, actions, k) {
    var st = newSeason(scenarioId, seed);
    for (var i = 0; i < actions.length; i++) {
      if (st.week >= k) return i;
      var r = apply(st, actions[i]);
      if (!r.ok) throw new Error('bad log');
      st = r.state;
    }
    return st.week >= k ? actions.length : -1;
  }

  function fnv(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ('0000000' + (h >>> 0).toString(16)).slice(-8);
  }
  function hash(st) {
    var o = clone(st); delete o.seq;
    return fnv(JSON.stringify(o));
  }

  function validateActions(list) {
    if (!Array.isArray(list) || list.length > 2000) return false;
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      if (!a || typeof a !== 'object' || Array.isArray(a) || typeof a.t !== 'string') return false;
      if (['visit', 'say', 'leave', 'morning', 'gov', 'alloc', 'confirm'].indexOf(a.t) < 0) return false;
      if (JSON.stringify(a).length > 300) return false;
    }
    return true;
  }

  /* ------------------------------------------------------------------ */
  /* Words                                                               */
  /* ------------------------------------------------------------------ */
  function mood(st, who) {
    var t = st.trust[who];
    return t <= -3 ? 'bitter' : t <= -1 ? 'wary' : t === 0 ? 'uncertain' : t <= 2 ? 'trusting' : 'warm';
  }

  function statusOf(st, who) {
    var s = st.stress[who];
    return s < 0.3 ? 'Holding' : s < 0.9 ? 'Under strain' : s < 1.8 ? 'Suffering' : 'Severe losses';
  }

  function factsOf(st, who) {
    var sc = scenarioOf(st), o = st.out;
    if (who === 'orchard') return [
      plural(sc.young - o.youngLost, 'young tree') + ' of ' + sc.young + ' alive in the east rows',
      (sc.old - o.oldLost) + ' of ' + sc.old + ' old pears alive on the Founders\' Row',
      'Harvest outlook: about ' + Math.max(0, pct(o.harvest)) + '% of a normal year'
    ].concat(st.flags.bore && (st.flags.boreStopWeek === null || st.week < st.flags.boreStopWeek) ? ['The family bore is pumping'] : []);
    if (who === 'dairy') {
      var sold = o.cowsSold + (st.flags.earlySale && st.week >= st.flags.earlySaleWeek ? o.earlySold : 0);
      return [(sc.herd - sold) + ' of ' + sc.herd + ' cows still in the herd', (sc.jobs - o.jobsLost) + ' of ' + sc.jobs + ' jobs at the dairy and creamery'];
    }
    if (who === 'school') return [(sc.beds - o.bedsLost) + ' of ' + sc.beds + ' garden beds growing', 'Harvest Supper: end of week 6'];
    if (who === 'hamlet') return [plural(o.wellsDry, 'well') + ' dry of ' + sc.households + ' households', o.bowserWeeks ? 'County water bowser has come for ' + plural(o.bowserWeeks, 'week') : 'No water bowser needed yet'];
    return [];
  }

  function insightText(st, p) {
    var w = st.week, sc = scenarioOf(st);
    var T = {
      orchard: [
        'Hannah: the Founders\' Row is deep-rooted and can stand a dry spell. The young east rows cannot. "If it comes to it, the young ones go first. I would rather it did not come to it."',
        'Hannah: the fruit is sizing now. Water short this week means smaller pears in September, not dead trees, unless it runs on.',
        'Owen Ashby, quietly: half the young trees were his idea. A buyer from the cider company has already called twice.',
        'Hannah: "My grandfather dug that bore in 1934 and swore never to use it unless the river failed. I keep thinking about that word, failed."',
        'Hannah: the old trees are showing it now: leaves curling at the crown. "A tree that old does not come back the way a young one does."',
        'Hannah: whatever happens, the family will be at the Harvest Supper. "Somebody has to bring pears."'
      ],
      dairy: [
        'Rosalind: below about two-thirds of the dairy\'s need she starts selling cows, and below about half for more than a week or two the creamery cuts hours. "Thirty-eight wages in this valley come through my gate."',
        'Dev Mistry, head herdsman: the young stock could go to the far pasture spring, but it is half a day\'s walk and the spring is failing too.',
        'Rosalind: she has not told the staff about the spillway offer. "I would rather they heard it from the keeper than from the Kingfisher."',
        'Rosalind: the cattle buyer is offering half of what he paid in spring. "Everyone is selling. That is the price of everyone selling."',
        'Dev: three of the creamery staff are from Fennet End. "Whatever you give us, you are partly giving to them."',
        'Rosalind: "If the rains come in week 7, I will have sold cows I did not need to sell. If they come in week 9, I will wish I had sold more. Nobody can tell me which."'
      ],
      school: [
        'Ms Oduya: the garden takes 3 ML a week at full need. "I know how small that sounds next to a dairy. It is the only place forty children learn that food comes from somewhere."',
        'Poppy, aged nine, has drawn a chart of which beds were watered on which days. She has drawn the keeper too, with a very large key.',
        'Ms Oduya: the Harvest Supper feeds the whole valley one evening a year, and half of it comes from these beds. "It is the one night the Ashbys and Fennet End sit at the same table."',
        'Ms Oduya: the children have started carrying their washing-up water out to the beans. "I did not ask them to."',
        'Arlo, aged ten, asks whether the trout will be all right. Ms Oduya does not know what to tell him.',
        'Ms Oduya: "Whatever happens this week, the supper goes ahead. I just need to know whether it is our food or the shop\'s."'
      ],
      hamlet: [
        'Edie Fennick, 84: Fennet End\'s wells fill from the stream, and the stream only runs when the keeper sends water down it. "When the board was drawn up, Fennet End was a few cottages. Nobody thought to give us a seat."',
        'Bram Toller: the oldest wells go first, and they are the oldest people\'s wells. Four households share Edie\'s.',
        'Kit Fennick, 19, at the gate: "Gran won\'t ask for anything. So I\'m asking."',
        'Edie: "We are not asking to be first. We are asking to be in the room when it is decided who is."',
        'Bram: the county bowser comes on Tuesdays and Fridays. "You queue with a bucket. Edie can\'t carry a bucket."',
        'Edie: "Whatever you decide this week, come and tell us yourself. That is all I will ask."'
      ]
    };
    var list = T[p];
    var base = list ? list[w - 1] : '';
    if (p === 'dairy' && sc.id === 'new-neighbours' && w === 1) base = 'Rosalind: after last year\'s sale the dairy is smaller: ' + sc.herd + ' cows, ' + sc.jobs + ' jobs. "Smaller is not safe. Smaller just means there is less left to lose."';
    if (p === 'school' && sc.id === 'new-neighbours' && w === 1) base = 'Ms Oduya: the garden now supplies the valley food bank every Thursday. "Twenty-six families collected last week. That is the number I think about."';
    if (p === 'hamlet' && sc.id === 'new-neighbours' && w === 1) base = 'Bram Toller: sixteen new homes at Fennet End share the same wells. "The new families do not know anyone here yet. They do not know whom to ask."';
    return base;
  }

  /* The words of a visit. Returns {title, who, paras[], facts[], options[]} */
  function sceneView(st, place) {
    var w = st.week, f = st.flags, sc = scenarioOf(st), m = mood(st, place === 'hall' || place === 'hut' ? 'hamlet' : place);
    var paras = [];
    var n = needs(st, w);
    if (place === 'hall') {
      var rec = f.hallRec;
      paras.push('The chapel hall at Fennet End is fuller than anyone can remember. Bram Toller has borrowed chairs from the Kingfisher. Hannah Ashby sits near the door with Owen. Rosalind Corrow stands at the back with Dev Mistry and half the creamery shift. Ms Oduya has brought Poppy\'s chart.');
      paras.push('Edie Fennick speaks first, sitting down: "I have lived on this stream eighty-four years. I am not here to ask for more than anyone else. I am here because this is the first time I have been asked."');
      paras.push('Hannah Ashby: "My family was promised that water a hundred years ago, by people who meant it. I do not think a promise gets smaller because the weather does." Owen adds, more quietly, that the old trees will not come back.');
      paras.push('Rosalind Corrow: "' + sc.jobs + ' wages. That is all I will say, and I will keep saying it." Dev Mistry says three of those wages go home to Fennet End every night.');
      paras.push('Ms Oduya holds up the chart. "Three megalitres. I know. It is the supper, and it is where the children learn this." Sol Barrow, from the brigade, asks the room to remember that a fire does not wait for anyone\'s turn.');
      paras.push('After two hours the room settles on its advice, by a show of hands: keep Fennet End and the school garden whole this week, hold back the ' + BRIGADE_ML + ' ML the brigade asked for, and divide what remains between the orchard and the dairy in proportion to their need. In figures: Ashby Orchard ' + rec.orchard + ' ML, Corrow Dale Dairy ' + rec.dairy + ' ML, the school garden ' + rec.school + ' ML, Fennet End ' + rec.hamlet + ' ML.');
      paras.push('The vote was not unanimous. Hannah Ashby kept her hands in her lap. Rosalind Corrow voted against it and then shook Bram\'s hand. Bram says: "It is advice, keeper. Nobody here thinks it binds you. But we will all know whether you took it."');
      return { title: 'The chapel hall', place: 'hall', paras: paras, facts: [], options: visitOptions(st, 'hall') };
    }
    if (place === 'hut') {
      paras.push(hutText(st));
      var facts = ['Usable water now: ' + usable(st) + ' ML above the dead pool', 'The brigade\'s request: ' + BRIGADE_ML + ' ML held if the dry runs past week 7', 'Trout start to struggle below about 60 ML in the reservoir; below about 35 they die off'];
      return { title: 'The sluice house', place: 'hut', paras: paras, facts: facts, options: visitOptions(st, 'hut') };
    }
    paras = paras.concat(visitText(st, place));
    return { title: NAMES[place].place, place: place, paras: paras, facts: factsOf(st, place).concat(['Need this week: ' + n[place] + ' ML · says it can live with ' + minimumOf(st, place, w) + ' ML']), options: visitOptions(st, place) };
  }

  function hutText(st) {
    var w = st.week;
    var T = [
      'Ada Merrow has left the kettle, the key and thirty-one years of logbooks. Inside the front cover she has written: "There is never enough in a dry year. The job is to decide who goes without, and to be able to look them in the eye." Sol Barrow from the fire brigade has left a note asking that something be kept back for the end of the season.',
      'The sluice house smells of oil and old paper. Ada comes by with a tin of biscuits and declines, firmly, to tell you what she would do. "I had my turn. They will remember yours."',

    add(book, h('h3', null, 'What stays unresolved'));
    add(book, h('ul', null, L.unresolved.map(function (x) { return h('li', null, x); })));

    var wt = h('details', null, h('summary', null, 'The water, week by week'));
    var tbl = h('table', null, h('caption', null, 'Megalitres'), h('thead', null, h('tr', null, ['Week', 'Start', 'Orchard', 'Dairy', 'School', 'Fennet End', 'Leak', 'Evap.', 'Inflow', 'Other', 'End'].map(function (c, i) { return h('th', { scope: 'col', class: i ? 'num' : '' }, c); }))));
    var tbd = h('tbody');
    L.water.forEach(function (w) {
      var other = (w.night ? 'night water ' + w.night : '') + (w.brigade ? 'brigade ' + w.brigade : '') + (w.spill ? ' spill ' + w.spill : '');
      add(tbd, h('tr', null, h('th', { scope: 'row' }, w.week + (w.after ? ' (after)' : '')), [w.start, w.released.orchard, w.released.dairy, w.released.school, w.released.hamlet, w.seep, w.evap, w.inflow].map(function (x) { return h('td', { class: 'num' }, String(x)); }), h('td', { class: 'num' }, other || '—'), h('td', { class: 'num' }, String(w.end))));
    });
    add(tbl, tbd);
    add(wt, h('div', { class: 'tablewrap' }, tbl));
    add(wt, h('p', { class: 'small' }, 'Balance check: starting ' + L.balance.start + ' ML, plus inflows, minus releases, leak, evaporation and other draws, gives ' + L.balance.computedEnd + ' ML; the reservoir holds ' + L.balance.end + ' ML.' + (L.balance.ok ? ' It balances.' : ' It does not balance (please report this).')));
    add(book, wt);

    add(book, h('h3', null, 'For reflection'));
    add(book, h('p', { class: 'small muted' }, 'These are questions, not a test. Nothing you write is required, read, scored or sent anywhere.'));
    add(book, h('ul', null, L.reflect.map(function (q) { return h('li', null, q); })));
    var noteId = 'note-' + r.id;
    var ta = h('textarea', { id: noteId, maxlength: '2000', 'aria-describedby': noteId + '-d' });
    ta.value = journal.get(r.id);
