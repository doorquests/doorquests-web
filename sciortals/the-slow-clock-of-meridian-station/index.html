<script>
/* SCI-001 · The Slow Clock of Meridian Station — physics model.
   Pure functions only. No DOM. Loaded in the page and in Node tests.
   All quantities SI internally (m, kg, s, rad); angles in degrees only at the interface. */
(function (root) {
  'use strict';
  var PI = Math.PI;
  var DEG = PI / 180;

  /* ---------- Gravity ---------- */
  // GRS80 / WGS84 normal gravity on the ellipsoid (Somigliana closed form).
  var GE = 9.7803253359, KS = 0.00193185265241, E2 = 0.00669437999013;
  // Free-air gradient, mGal/m -> m/s^2 per m.
  var FREE_AIR = 3.086e-6;
  function gNormal(latDeg) {
    var s2 = Math.pow(Math.sin(latDeg * DEG), 2);
    return GE * (1 + KS * s2) / Math.sqrt(1 - E2 * s2);
  }
  // Model: normal gravity minus the free-air gradient times height.
  // Assumes zero free-air anomaly (broad, isostatically compensated terrain).
  function gModel(latDeg, h) { return gNormal(latDeg) - FREE_AIR * h; }

  var STATIONS = {
    meridian: { id: 'meridian', name: 'Meridian Station', short: 'Meridian', lat: 0.0, h: 3000, note: 'equatorial plateau, 3,000 m' },
    home:     { id: 'home', name: 'Kestrel Head Observatory (home port)', short: 'Kestrel Head', lat: 50.0, h: 0, note: '50.0° N, sea level' },
    port:     { id: 'port', name: 'Port Calder (equatorial coast)', short: 'Port Calder', lat: 0.0, h: 0, note: '0.0°, sea level' },
    peak:     { id: 'peak', name: 'Halvard Peak Hut', short: 'Halvard Peak', lat: 50.0, h: 3000, note: '50.0° N, 3,000 m' },
    pole:     { id: 'pole', name: 'Polar Camp (hypothetical)', short: 'Polar Camp', lat: 90.0, h: 0, note: '90° N, sea level — a thought-experiment site' }
  };
  function gStation(id) { var s = STATIONS[id]; return gModel(s.lat, s.h); }

  /* ---------- Materials (linear expansion, per °C, near room temperature) ---------- */
  var MATERIALS = {
    steel: { id: 'steel', name: 'Steel', alpha: 11.5e-6, range: '10.8–13.0' },
    brass: { id: 'brass', name: 'Brass', alpha: 19.0e-6, range: '18–21' },
    wood:  { id: 'wood',  name: 'Pine (along the grain)', alpha: 5.0e-6, range: '3–6' },
    invar: { id: 'invar', name: 'Invar', alpha: 1.2e-6, range: '0.6–2.0' }
  };
  var BENCH_REF_TEMP = 20; // bench lengths are as measured at 20 °C

  /* ---------- Period ---------- */
  function agm(a, b) {
    for (var i = 0; i < 60; i++) {
      var an = (a + b) / 2, bn = Math.sqrt(a * b);
      if (Math.abs(an - bn) < 1e-16 * an) { a = an; b = bn; break; }
      a = an; b = bn;
    }
    return (a + b) / 2;
  }
  // Exact finite-amplitude factor T/T0 = 1 / AGM(1, cos(theta0/2)) for the undamped pendulum.
  function amplitudeFactor(theta0Deg) { return 1 / agm(1, Math.cos(theta0Deg * DEG / 2)); }
  function periodSmall(L, g) { return 2 * PI * Math.sqrt(L / g); }
  function periodExact(L, g, theta0Deg) { return periodSmall(L, g) * amplitudeFactor(theta0Deg); }

  // Rigid physical pendulum: uniform rod (pivot to bob centre, length D) + solid sphere bob.
  function equivalentLength(D, rodMass, bobMass, bobRadius) {
    var I = rodMass * D * D / 3 + bobMass * (0.4 * bobRadius * bobRadius + D * D);
    var Md = rodMass * D / 2 + bobMass * D;
    return I / Md;
  }

  var Q_BY_DAMPING = { air: 800, paddle: 60, vane: 15 };
  var MAGNET_BOOST = 0.012; // illustrative: extra downward pull on an iron bob = 1.2 % of g (fictional magnet)

  // Effective g for a run (station gravity, plus the illustrative magnet on an iron bob).
  function gEffective(s) {
    var g = gStation(s.station);
    if (s.bobMat === 'iron' && s.magnet === 'near') g *= (1 + MAGNET_BOOST);
    return g;
  }
  // Length after thermal expansion from the 20 °C bench reference.
  function thermalScale(s) {
    var a = MATERIALS[s.material || 'steel'].alpha;
    return 1 + a * ((s.temp == null ? BENCH_REF_TEMP : s.temp) - BENCH_REF_TEMP);
  }
  function effectiveLength(s) {
    var k = thermalScale(s);
    if (s.pend === 'physical') return equivalentLength(s.D * k, s.rodMass, s.mass, s.bobR * k);
    return s.L * k;
  }
  // True period for the timing bench.
  function truePeriod(s) {
    var Le = effectiveLength(s), g = gEffective(s);
    var T0 = periodSmall(Le, g);
    if (s.damping && s.damping !== 'air') {
      // Linear damped oscillator (small-angle model): T = T0 / sqrt(1 - 1/(4Q^2)).
      var Q = Q_BY_DAMPING[s.damping];
      return T0 / Math.sqrt(1 - 1 / (4 * Q * Q));
    }
    return T0 * amplitudeFactor(s.theta);
  }
  function amplitudeAfter(s, t) {
    var Q = Q_BY_DAMPING[s.damping || 'air'];
    var T0 = periodSmall(effectiveLength(s), gEffective(s));
    var gamma = (2 * PI / T0) / (2 * Q);
    return s.theta * Math.exp(-gamma * t);
  }

  /* ---------- The station clock ---------- */
  var CLOCK = {
    material: 'steel',
    homeVaultTemp: 12, meridianRoomTemp: 22,
    homeArc: 2.0, meridianArc: 2.1,
    nutMmPerTurn: 0.5, nutDivsPerTurn: 50 // one division = 0.01 mm
  };
  // Clock pendulum effective length at the home vault temperature, set so T = 2.000000 s at home.
  var L_CLOCK_HOME = gStation('home') * Math.pow(2 / (2 * PI) / amplitudeFactor(CLOCK.homeArc), 2);
  // Clock period at a station. nutDivs > 0 raises the bob (shortens the pendulum) by 0.01 mm per division.
  function clockPeriod(stationId, nutDivs) {
    var a = MATERIALS[CLOCK.material].alpha;
    var atMeridian = stationId !== 'home';
    var temp = atMeridian ? CLOCK.meridianRoomTemp : CLOCK.homeVaultTemp;
    var arc = atMeridian ? CLOCK.meridianArc : CLOCK.homeArc;
    var L = L_CLOCK_HOME * (1 + a * (temp - CLOCK.homeVaultTemp)) - (nutDivs || 0) * 1e-5;
    return periodSmall(L, gStation(stationId)) * amplitudeFactor(arc);
  }
  // Seconds lost per day against an exact time signal (positive = slow).
  // The escapement advances one second per beat; one beat = half a period.
  function clockLossPerDay(stationId, nutDivs) { return 86400 * (1 - 2 / clockPeriod(stationId, nutDivs)); }
  // Divisions that make the Meridian clock exactly right (continuous value).
  function idealNutDivs() {
    var a = MATERIALS[CLOCK.material].alpha;
    var Lnow = L_CLOCK_HOME * (1 + a * (CLOCK.meridianRoomTemp - CLOCK.homeVaultTemp));
    var Lneed = gStation('meridian') * Math.pow(2 / (2 * PI) / amplitudeFactor(CLOCK.meridianArc), 2);
    return (Lnow - Lneed) / 1e-5;
  }

  // Linearised budget shares (s/day), each computed on its own from the clock model.
  function budget() {
    var gH = gStation('home'), gP = gStation('port'), gM = gStation('meridian');
    var a = MATERIALS.steel.alpha;
    var d = function (ratio) { return 86400 * (1 - 1 / ratio); };
    return {
      latitude: d(Math.sqrt(gH / gP)),
      altitude: d(Math.sqrt(gP / gM)),
      thermal: d(Math.sqrt(1 + a * (CLOCK.meridianRoomTemp - CLOCK.homeVaultTemp))),
      arc: d(amplitudeFactor(CLOCK.meridianArc) / amplitudeFactor(CLOCK.homeArc)),
      mass: 0, gears: 0,
      total: clockLossPerDay('meridian', 0)
    };

      '<p><b>Fiction and fact.</b> Meridian Station, Kestrel Head, Port Calder, Halvard Peak, the keeper, the clockmaker and the rival are fictional. The physics is standard. ' + tag('Established principle') + '</p>' +
      '<h3>Pendulum period ' + tag('Established principle') + '</h3><p class="eq">T₀ = 2π √(L / g)</p> small-swing ideal pendulum. <p class="eq">T = T₀ / AGM(1, cos(θ₀/2))</p> exact undamped period for release angle θ₀ (arithmetic–geometric mean form of the complete elliptic integral). For small angles T ≈ T₀(1 + θ₀²/16), θ₀ in radians.' +
      '<p>Physical pendulum (uniform rod to the bob centre, solid sphere bob): <span class="eq">T = 2π √(I / (M g d))</span>, I = m_rod D²/3 + m_bob(2r²/5 + D²), M·d = m_rod D/2 + m_bob D.</p>' +
      '<p><b>Beats and periods.</b> A full oscillation (there and back) takes T ≈ 2 s; the escapement advances the seconds hand once per <i>beat</i> (half an oscillation). Clock rate = 86,400 × (2/T − 1) s/day.</p>' +
      '<h3>Gravity ' + tag('Model output') + '</h3><p>Normal gravity on the GRS80/WGS84 ellipsoid (Somigliana closed form):</p><p class="eq">g(φ) = 9.7803253359 (1 + 0.00193185265241 sin²φ) / √(1 − 0.00669437999013 sin²φ)</p><p>minus the free-air gradient 3.086×10⁻⁶ m/s² per metre of height. <b>Assumption:</b> the plateau is broad and isostatically compensated, so its free-air anomaly is taken as zero. Real gravity anomalies of tens of milligals (10⁻⁴ m/s²) are ignored. A Bouguer-plate correction is <i>not</i> applied for that reason.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Station (fictional)</th><th class="num">Latitude</th><th class="num">Height</th><th class="num">Model g (m/s²)</th></tr></thead><tbody>' + ['home', 'port', 'peak', 'meridian'].map(st).join('') + '</tbody></table></div>' +
      '<h3>Thermal expansion ' + tag('Model output') + '</h3><p>L(T) = L₂₀(1 + α(T − 20 °C)) on the bench; the clock’s steel rod is referenced to its 12 °C calibration. α (per °C, typical room-temperature values, ranges vary with alloy): steel 11.5×10⁻⁶ (10.8–13), brass 19×10⁻⁶ (18–21), pine along the grain 5×10⁻⁶ (3–6), Invar 1.2×10⁻⁶ (0.6–2). <span class="pending">PENDING SCIENTIFIC REVIEW</span> of exact coefficients against a handbook.</p>' +
      '<p>Gridiron (simplified): effective length = steel length − brass length, each expanding from 20 °C; perfect compensation needs α_s L_s = α_b L_b. Real gridirons fold several rods and have friction and lag; not modelled.</p>' +
      '<h3>The daily-loss budget ' + tag('Model output') + '</h3><p>Clock: steel rod, calibrated to T = 2.000000 s at Kestrel Head (50° N, sea level) in a 12 °C vault, 2.0° arc. At Meridian (0°, 3,000 m): clock room 22 °C, arc 2.1° (less air drag).</p><div class="tablewrap"><table><thead><tr><th>Cause</th><th class="num">s/day lost</th></tr></thead><tbody>' +
      [['Latitude: g ' + gH.toFixed(5) + ' → ' + gP.toFixed(5), B.latitude], ['Altitude: g ' + gP.toFixed(5) + ' → ' + gM.toFixed(5), B.altitude], ['Heat: steel, +10 °C', B.thermal], ['Arc 2.0° → 2.1°', B.arc], ['Bob mass, gears', 0]].map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td class="num">' + r[1].toFixed(2) + '</td></tr>'; }).join('') +
      '<tr><td>Sum of separate shares</td><td class="num">' + (B.latitude + B.altitude + B.thermal + B.arc).toFixed(2) + '</td></tr><tr><td><b>Exact combined model</b></td><td class="num"><b>' + B.total.toFixed(2) + '</b></td></tr></tbody></table></div><p class="small">Adding shares is a first-order approximation; here it differs from the exact product by ' + Math.abs(B.latitude + B.altitude + B.thermal + B.arc - B.total).toFixed(2) + ' s/day. Not modelled: air buoyancy and the air carried with the bob (both change with air density at altitude; a rough estimate for a brass bob is 1–3 s/day of gain at 3,000 m), drag beyond the arc change, rod elasticity, escapement error, temperature cycles.</p>' +
      '<p>Rating nut: 0.50 mm per turn, 50 divisions per turn (0.01 mm each, ≈ 0.43 s/day). Ideal correction in this model: raise the bob ' + (P.idealNutDivs() / 100).toFixed(3) + ' mm.</p>' +
      '<h3>Measurement ' + tag('Model output') + '</h3><p>Stopwatch: start and stop errors each Gaussian, σ = 0.07 s (combined ≈ 0.10 s per timing), reading 0.01 s. Photogate: σ = 0.0003 s per event, reading 0.001 s (stated ≈ 0.0006 s). All scatter comes from a seeded generator (mulberry32 + Box–Muller); the seed is logged with every run. Bench lengths are exact in the simulation; the 0.5 mm ruler uncertainty is a stated value for uncertainty budgets only.</p>' +
      '<h3>Damping, driving, coupling, rotation ' + tag('Model output') + '</h3><p>Damping (investigation 9): linear damped oscillator, small-angle model, T = T₀/√(1 − 1/(4Q²)), amplitude ∝ e^(−ω₀t/2Q); Q = 800, 60, 15. Finite-amplitude correction is ignored there (≤ 3×10⁻⁴ at 4°).</p><p>Driven (17): steady-state linear response A ∝ 1/√((1 − r²)² + (r/Q)²), r = f/f₀, Q = 150.</p><p>Coupled (18): two identical linear pendulums, spring coupling ε = k/ω₀²; full transfer time π/(ω₀(√(1 + 2ε) − 1)). <b>Simplified:</b> the anti-phase synchronisation seen with real escapement clocks needs nonlinear driving and dissipation and is not modelled.</p><p>Foucault (19): ideal precession 360° × sin φ per sidereal day (23.934 h); zero at the equator; reading error σ = 0.3°. It does not change the period.</p><p>Magnet (16): the lodestone’s 1.2 % extra pull on an iron bob is an illustrative value, not a measured one; magnetism has no effect on brass in this model.</p>' +
      '<h3>Historical note</h3><p>The premise echoes a well-known 17th-century report that a pendulum clock ran slow near the equator, an early clue that gravity varies over Earth. <span class="pending">PENDING VERIFICATION</span> of names, dates and details against scholarly sources before any of it is presented in the game as fact.</p>' +
      '<h3>Model limits</h3><p>Sliders are bounded to ranges where the model is meaningful. The small-angle and linear models are labelled where used. This is a virtual laboratory: do not attempt hazardous real-world experiments.</p>' +
      '<h3>References to check</h3><ul class="small"><li>Moritz, H. “Geodetic Reference System 1980.” <i>Journal of Geodesy</i> (normal-gravity constants).</li><li>NIMA TR8350.2, <i>Department of Defense World Geodetic System 1984</i> (WGS84 normal gravity).</li><li>Standard free-air gradient, 0.3086 mGal/m (geodesy and geophysics texts).</li><li>Thermal-expansion coefficients: a materials handbook (e.g. CRC Handbook of Chemistry and Physics).</li><li>Pendulum theory: any undergraduate classical-mechanics text (elliptic-integral period, physical pendulum, damped and driven oscillators, normal modes, Foucault pendulum).</li></ul><p class="small pending">These references were not consulted live for this prototype; values come from the developer’s knowledge and must be checked.</p></div>';
  }
  function vSettings() {
    var s = state.settings;
    return noticesHtml() + '<h1>Settings & Help</h1><div class="grid g2"><section class="panel"><h2>Settings</h2>' +
      '<fieldset><legend>Level</legend>' + S.LEVELS.map(function (l) { return '<label class="opt"><input type="radio" name="setLvl" value="' + l.id + '"' + (state.level === l.id ? ' checked' : '') + '><span><b>' + esc(l.label) + '</b> — ' + esc(l.blurb) + '</span></label>'; }).join('') + '</fieldset>' +
      '<fieldset><legend>Motion</legend>' + [['auto', 'Follow my device setting'], ['on', 'Always animate'], ['off', 'Reduce motion (no animation)']].map(function (o) { return '<label class="opt"><input type="radio" name="setMot" value="' + o[0] + '"' + (s.motion === o[0] ? ' checked' : '') + '><span>' + o[1] + '</span></label>'; }).join('') + '</fieldset>' +
      '<label class="opt"><input type="checkbox" id="setSound"' + (s.sound ? ' checked' : '') + '><span>Tick sound while the pendulum swings (never needed to play)</span></label>' +
      '<label class="opt"><input type="checkbox" id="setPg"' + (s.photogate ? ' checked' : '') + '><span>Always offer the photogate, including in One Swing or Twenty (that investigation still needs stopwatch runs for its lesson)</span></label>' +
      '<label class="opt"><input type="checkbox" id="setBig"' + (s.big ? ' checked' : '') + '><span>Larger text</span></label>' +
      '<div class="field"><label for="setSeed">Fixed seed for new runs (blank = random). Identical settings and seed reproduce identical data.</label><div class="row"><input type="text" inputmode="numeric" id="setSeed" value="' + esc(s.fixedSeed) + '" maxlength="10"><button type="button" class="btn small" id="setSeedBtn">Apply</button></div></div>' +
      '<label class="opt"><input type="checkbox" id="setOpen"' + (s.openAll ? ' checked' : '') + '><span><b>Prototype only:</b> open every investigation (for founder playtesting; remove before release)</span></label></section>' +
      '<section class="panel"><h2>Save data</h2><p class="small">Saved in this browser under <code>' + SAVE_KEY + '</code> and <code>' + RING_KEY + '</code>. No other DoorQuests collection’s data is read or changed.</p>' + (storageOk ? '' : '<div class="notice err">Storage is unavailable: progress lasts only while this page is open.</div>') +
      '<div class="toolbar"><button type="button" class="btn" id="expBtn">Export save (JSON)</button><label class="btn" for="impFile">Import save…</label><input type="file" id="impFile" accept="application/json,.json" class="sr"></div><div id="impOut" role="status"></div>' +
      '<div class="toolbar"><button type="button" class="btn" id="resLvl">Reset this level</button><button type="button" class="btn" id="resAll">Reset all SCI-001 progress</button></div></section></div>' +
      '<section class="panel"><h2>How to play</h2><ol><li>Choose a level: <b>Discover</b> (qualitative, guided), <b>Investigate</b> (comparisons, units, controls), or <b>Verify</b> (quantitative predictions, repeats, uncertainty). The same mystery unfolds at each level; completions are kept separately.</li><li>In each investigation: <b>lock a prediction</b>, <b>run</b> experiments on the bench (each run is logged with settings and seed), then <b>submit a conclusion</b>. The game re-checks your logged evidence; a guessed answer without the evidence will not pass.</li><li>Use the <b>notebook graph</b> to choose axes, see a least-squares line and read the data table.</li><li>Suspects on the <b>Evidence Board</b> move only when the related investigation is verified. Sometimes <i>Unresolved</i> is the honest verdict.</li><li>Investigations unlock in order at each level. 16–19 are optional; 20 opens after 15.</li></ol>' +
      '<h3>Medals versus levels</h3><p>Levels set how hard the task is. Medals are optional distinctions for the quality of evidence: <b>Bronze</b> = verified; <b>Silver</b> = every condition you tested was repeated; <b>Gold</b> = Silver and your locked prediction matched the outcome. Medals never depend on speed or the number of attempts.</p>' +
      '<h3>Accessibility</h3><p>Every control is a native, labelled input usable with keyboard and touch; sliders have number fields. Results are written as text and announced to screen readers; every graph has a data table and a written trend. Nothing depends on colour, sound, animation or reaction time: the stopwatch’s human error is simulated.</p></section>';
  }
  after.settings = function () {
    var s = state.settings;
    $$('input[name="setLvl"]').forEach(function (x) { x.addEventListener('change', function () { setLevel(x.value); }); });
    $$('input[name="setMot"]').forEach(function (x) { x.addEventListener('change', function () { s.motion = x.value; applyPrefs(); save(); announce('Motion setting saved.'); }); });
    $('#setSound').addEventListener('change', function (e) { s.sound = e.target.checked; save(); });
    $('#setPg').addEventListener('change', function (e) { s.photogate = e.target.checked; save(); });
    $('#setBig').addEventListener('change', function (e) { s.big = e.target.checked; applyPrefs(); save(); });
    $('#setOpen').addEventListener('change', function (e) { s.openAll = e.target.checked; save(); announce(s.openAll ? 'All investigations opened (prototype).' : 'Normal unlocking restored.'); });
    $('#setSeedBtn').addEventListener('click', function () { var v = $('#setSeed').value.trim(); if (v !== '' && (!/^\d{1,10}$/.test(v) || +v > 4294967295)) { announce('Seed must be a whole number from 0 to 4294967295.'); return; } s.fixedSeed = v; save(); announce(v === '' ? 'Random seeds restored.' : 'Fixed seed ' + v + ' applied to new runs.'); });
    $('#expBtn').addEventListener('click', doExport);
    $('#impFile').addEventListener('change', function (e) { var fl = e.target.files[0]; if (fl) doImport(fl); e.target.value = ''; });
    $('#resLvl').addEventListener('click', function () { confirmReset('level'); });
    $('#resAll').addEventListener('click', function () { confirmReset('all'); });
  };

  /* ================= export / import / reset ================= */
  function fnv64(str) { var h = 0xcbf29ce484222325n, p = 0x100000001b3n, m = (1n << 64n) - 1n; for (var i = 0; i < str.length; i++) { h ^= BigInt(str.charCodeAt(i)); h = (h * p) & m; } return h.toString(16).padStart(16, '0'); }
  function exportPayload() { var payload = JSON.parse(JSON.stringify(state)); var body = JSON.stringify(payload); return { format: 'doorquests-sciortals-sci001-export', version: 1, exportedAt: new Date().toISOString(), checksum: { algorithm: 'FNV-1a-64', value: fnv64(body), note: 'Detects accidental corruption only; every record is re-verified on import.' }, save: payload }; }
  function doExport() {
    var data = JSON.stringify(exportPayload(), null, 1);
    var blob = new Blob([data], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'sci001-slow-clock-save-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    announce('Save exported.');
  }
  function importText(text) {
    var out = [];
    if (typeof text !== 'string' || text.length > MAX_IMPORT) return { ok: false, msg: ['The file is too large to be a SCI-001 save.'] };
    var d; try { d = JSON.parse(text); } catch (e) { return { ok: false, msg: ['The file is not valid JSON.'] }; }
    if (!d || d.format !== 'doorquests-sciortals-sci001-export' || d.version !== 1 || !d.save) return { ok: false, msg: ['This is not a SCI-001 export file.'] };
    if (!d.checksum || d.checksum.value !== fnv64(JSON.stringify(d.save))) out.push('The checksum does not match: the file was edited or damaged. Every record will still be re-verified.');
    var v; try { v = validateSave(d.save, true); } catch (e) { return { ok: false, msg: ['The save was rejected: ' + e.message + '. Your current progress is unchanged.'] }; }
    var claimedDone = Object.keys(d.save.records || {}).filter(function (k) { var r = d.save.records[k]; return r && r.completedAt; }).length;
    var prev = state, prevCache = cache;
    state = v.state; cache = {}; verifyAll();
    var verifiedDone = Object.keys(cache).filter(function (k) { return cache[k] && cache[k].completed; }).length;
    if (claimedDone > verifiedDone) out.push((claimedDone - verifiedDone) + ' claimed completion(s) failed replay and were not counted.');
    Object.keys(state.records).forEach(function (k) { var r = state.records[k]; if (r.completedAt && !(cache[k] && cache[k].completed)) { r.completedAt = null; r.answers = null; } });
    var claimedMarks = d.save.marksAt ? Object.keys(d.save.marksAt).length : 0, m = marks();
    if (claimedMarks > Object.keys(m).length) out.push((claimedMarks - Object.keys(m).length) + ' claimed mark(s) were not supported by the evidence and were not awarded.');
    v.problems.forEach(function (p) { out.push(p); });
    out.unshift('Imported: ' + verifiedDone + ' verified completion(s), ' + Object.keys(m).length + ' mark(s).');
    void prev; void prevCache;
    save();
    return { ok: true, msg: out };
  }
  function doImport(file) {
    if (file.size > MAX_IMPORT) { $('#impOut').innerHTML = '<div class="notice err">The file is too large to be a SCI-001 save.</div>'; return; }
    var rd = new FileReader();
    rd.onload = function () { var res = importText(String(rd.result)); applyPrefs(); go('settings', null, true); $('#impOut').innerHTML = res.msg.map(function (m) { return '<div class="notice' + (res.ok ? '' : ' err') + '">' + esc(m) + '</div>'; }).join(''); announce(res.msg[0]); };
    rd.readAsText(file);
  }
  function confirmReset(scope) {
    var t = scope === 'level' ? 'all SCI-001 investigations at ' + lvlObj(state.level).name + ' (other levels are kept; marks earned elsewhere stay if their evidence remains)' : 'all SCI-001 progress at every level, and the SCI-001 marks in the Sciortals Keyring';
    dialog('Reset ' + (scope === 'level' ? 'this level' : 'everything') + '?', '<p>This deletes ' + esc(t) + '. It never touches any other DoorQuests collection, or other Keyring slots.</p>', [{ label: 'Delete', value: 'y', primary: true }, { label: 'Cancel', value: null }]).then(function (v) {
      if (v !== 'y') return;
      if (scope === 'level') Object.keys(state.records).forEach(function (k) { if (k.split('-')[1] === state.level) delete state.records[k]; });
      else { var keep = state.settings; state = freshState(); state.settings = keep; state.entered = true; }
      cache = {}; bench = {}; verifyAll(); save(); go('settings', null, true); announce('Reset complete.');
    });
  }

  /* ================= start ================= */
  load(); verifyAll(); checkStoredRing(); applyPrefs(); save();
  if (window.matchMedia) { var mq = window.matchMedia('(prefers-reduced-motion: reduce)'); if (mq.addEventListener) mq.addEventListener('change', function () { applyPrefs(); if (view.name === 'inv') go('inv', view.inv, true); }); }
  go(state.entered ? 'map' : 'entrance', null, true);
  window.__sci001 = { importText: importText, exportPayload: exportPayload, state: function () { return state; }, verifyAll: verifyAll, done: done, marks: marks, cardStates: cardStates, SAVE_KEY: SAVE_KEY, RING_KEY: RING_KEY };
})();

</script>
