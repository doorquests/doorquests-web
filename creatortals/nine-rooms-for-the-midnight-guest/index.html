<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Rooms for the Midnight Guest — Creatortal No. 1 — DoorQuests</title>
<meta name="description" content="Build a nine-room house of keys, locks, one-way doors and lever gates. The Guest checks every possible state, shows you exactly where it breaks, and walks your finished house.">
<meta name="robots" content="noindex">
<style>
:root{
  --ink:#0e1a3a; --night:#14234d; --room:#1f3268; --room-hi:#28407f; --wall:#0a1330;
  --brass:#d4a548; --candle:#f2cf7a; --text:#eef0f8; --muted:#b9c3e2; --line:#33488a;
  --ember:#f39a7d; --moss:#94d8ab; --parch:#efe3c4; --parch-ink:#2a2213; --focus:#ffe08a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.55 var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 50% -10%,#24387a 0%,rgba(20,35,77,.6) 40%,var(--ink) 75%)}
a{color:var(--candle)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--candle);color:var(--ink);padding:10px 14px;z-index:20;font-weight:600;border-radius:4px}
.skip:focus{top:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid rgba(212,165,72,.25)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-top:10px;padding-bottom:10px}
.crumb{font-size:.86rem;color:var(--muted);margin:0}
.crumb b{color:var(--candle);font-weight:600}
nav.main{display:flex;gap:6px;flex-wrap:wrap}
nav.main button{background:none;border:1px solid transparent;color:var(--muted);min-height:44px;padding:0 12px;font:inherit;font-size:.95rem;border-radius:22px;cursor:pointer}
nav.main button[aria-current="page"]{color:var(--candle);border-color:rgba(242,207,122,.45)}
nav.main button:hover{color:var(--text)}
main{padding:20px 0 64px}
section.screen{display:none}
section.screen.on{display:block}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;letter-spacing:.005em}
h1{font-size:clamp(2rem,6vw,3.3rem);margin:.2em 0 .3em}
h2{font-size:clamp(1.45rem,4vw,1.9rem);margin:.2em 0 .5em}
h3{font-size:1.2rem;margin:1.1em 0 .4em}
p{margin:.5em 0 .8em;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:.9rem}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:6px;border:1px solid var(--line);background:var(--night);color:var(--text);text-align:left;line-height:1.3}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);color:#1b1404;border-color:var(--brass);font-weight:650}
.btn.primary:hover{background:var(--candle)}
.btn.quiet{background:none}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;border-style:dashed}
.btn.block{display:flex;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack>*+*{margin-top:12px}
/* intro */
.hero{display:grid;gap:24px;align-items:center;padding-top:10px}
@media(min-width:860px){.hero{grid-template-columns:1.05fr .95fr}}
.hero p.lede{font-family:var(--serif);font-size:1.25rem;line-height:1.6;color:#dfe5f6}
.hero svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.door-glow{transform-origin:220px 150px;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
/* editor layout */
.ed{display:grid;gap:20px}
@media(min-width:900px){.ed{grid-template-columns:minmax(340px,460px) 1fr;align-items:start}.ed .planCol{position:sticky;top:12px}}
.planBox{background:rgba(10,19,48,.55);border:1px solid rgba(212,165,72,.22);border-radius:10px;padding:10px}
.planBox svg{width:100%;height:auto;display:block;touch-action:manipulation}
.planBox .hit{cursor:pointer}
.caption{font-size:.88rem;color:var(--muted);margin:8px 2px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.slots button{min-height:44px;padding:6px 14px;border-radius:22px;border:1px solid var(--line);background:none;color:var(--muted)}
.slots button[aria-pressed="true"]{background:var(--night);color:var(--candle);border-color:var(--brass)}
.panel{border-left:3px solid var(--brass);background:rgba(20,35,77,.7);padding:14px 16px;border-radius:0 8px 8px 0}
.panel.quietp{border-left-color:var(--line)}
.panel h3:first-child,.panel h2:first-child{margin-top:0}
label{display:block;font-weight:600;margin:10px 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:.88rem}
input[type=text],textarea,select{font:inherit;width:100%;max-width:100%;min-height:44px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:#0c1838;color:var(--text)}
textarea{min-height:72px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px 12px;margin:10px 0}
legend{font-weight:600;padding:0 6px}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:400;margin:0}
.radio input{width:22px;height:22px;accent-color:var(--brass)}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.85rem;border:1px solid var(--line);color:var(--muted)}
.chip.pass{color:var(--moss);border-color:rgba(148,216,171,.5)}
.chip.fail{color:var(--ember);border-color:rgba(243,154,125,.55)}
.chip.inc{color:var(--candle);border-color:rgba(242,207,122,.5)}
.status-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:6px}
.status-line h2{margin:0}
/* the Guest speaks */
.guest-says{position:relative;margin:12px 0;padding:16px 18px 16px 56px;background:linear-gradient(180deg,rgba(242,207,122,.13),rgba(242,207,122,.04));border:1px solid rgba(242,207,122,.35);border-radius:10px;font-family:var(--serif);font-style:italic;font-size:1.12rem;line-height:1.6;color:#f6ecd0}
.guest-says::before{content:"";position:absolute;left:18px;top:18px;width:22px;height:30px;border-radius:6px 6px 9px 9px;background:radial-gradient(circle at 50% 60%,#fff3c4 0,#f2cf7a 35%,rgba(242,207,122,0) 70%);box-shadow:0 0 18px rgba(242,207,122,.55)}
.guest-says .who{display:block;font-style:normal;font-family:var(--sans);font-size:.82rem;color:var(--candle);margin-bottom:2px}
.keeper{border-left:3px solid var(--moss);padding:12px 16px;background:rgba(148,216,171,.07);border-radius:0 8px 8px 0;margin:12px 0}
.keeper .who{display:block;font-size:.82rem;color:var(--moss)}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid rgba(51,72,138,.6)}
.checks li:first-child{border-top:0}
.mark{font-weight:700;font-size:.82rem;padding:2px 8px;border-radius:4px;align-self:start;white-space:nowrap}
.mark.PASS{background:rgba(148,216,171,.16);color:var(--moss)}
.mark.FAIL{background:rgba(243,154,125,.16);color:var(--ember)}
.mark.INCONCLUSIVE{background:rgba(242,207,122,.14);color:var(--candle)}
.checks .why{grid-column:2;font-size:.92rem;color:var(--muted)}
.checks .why ul{margin:4px 0;padding-left:18px}
ol.route{padding-left:1.6em;margin:8px 0}
ol.route li{margin:4px 0}
ol.route li .inv{display:block;font-size:.86rem;color:var(--muted)}
ol.route li.cross{color:var(--ember)}
.repairs{list-style:none;padding:0;margin:8px 0}
.repairs li{padding:10px 0;border-top:1px solid rgba(51,72,138,.6);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.repairs li span.what{flex:1 1 220px}
.notes{padding-left:18px}
details.words{margin-top:18px}
details.words>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--serif);font-size:1.15rem;color:var(--candle)}
.wordlist{list-style:none;padding:0;margin:0}
.wordlist>li{padding:10px 0;border-top:1px solid rgba(51,72,138,.6)}
.wordlist .exits{margin:4px 0 6px;padding-left:18px;font-size:.93rem}
.note-q{font-family:var(--serif);font-style:italic;color:#e9dfc0;overflow-wrap:anywhere}
.counter{font-size:.85rem;color:var(--muted)}
.counter.over{color:var(--ember)}
.msg{margin:8px 0;padding:8px 12px;border-radius:6px;background:rgba(243,154,125,.12);border:1px solid rgba(243,154,125,.4)}
.msg.ok{background:rgba(148,216,171,.1);border-color:rgba(148,216,171,.4)}
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.marks label{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:400;margin:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.marks input{accent-color:var(--brass);width:20px;height:20px}
.marks svg{width:22px;height:22px;flex:none}
/* guest view */
.gview{max-width:720px}
.roomcard{border:1px solid rgba(242,207,122,.35);border-radius:12px;padding:18px 18px 8px;background:radial-gradient(120% 90% at 50% 0%,rgba(242,207,122,.12),rgba(20,35,77,.85) 60%)}
.roomcard h3{font-size:clamp(1.6rem,6vw,2.2rem);margin:.1em 0 .2em}
.roomcard blockquote{margin:6px 0 12px;padding:0;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:#f2e6c4;overflow-wrap:anywhere}
.pockets{font-size:.95rem;color:var(--muted);margin:6px 0}
.ways{list-style:none;padding:0;margin:12px 0}
.ways li{margin:8px 0}
.ways .btn{width:100%;justify-content:flex-start}
.banner{border:1px dashed var(--brass);border-radius:8px;padding:10px 14px;margin:10px 0}
.trapnote{border-left:3px solid var(--ember);padding:10px 14px;background:rgba(243,154,125,.09);margin:10px 0;border-radius:0 8px 8px 0}
/* street */
.street{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:760px){.street{grid-template-columns:repeat(3,1fr)}}
.lot{border-bottom:2px solid rgba(212,165,72,.35);padding-bottom:14px}
.lot svg{width:100%;max-width:240px;height:auto;display:block;margin:0 auto 8px}
.lot h3{text-align:center;margin:.3em 0 .1em;overflow-wrap:anywhere}
.lot p{text-align:center;margin:.2em auto .6em}
.lot .row{justify-content:center}
.gold-new{animation:hang 1.6s ease-out 1}
@keyframes hang{0%{opacity:0;transform:translateY(-14px)}60%{opacity:1}100%{transform:none}}
.ground{height:2px;background:linear-gradient(90deg,transparent,var(--brass),transparent);margin:6px 0 18px}
/* deed */
#deed{background:var(--parch);color:var(--parch-ink);border-radius:6px;padding:28px clamp(16px,5vw,48px);max-width:760px;margin:12px auto;box-shadow:0 0 0 6px rgba(212,165,72,.35),0 18px 50px rgba(0,0,0,.35);font-family:var(--serif);line-height:1.6}
#deed h2{color:#3a2a0c;text-align:center;font-size:clamp(1.6rem,5vw,2.2rem);margin:.1em 0}
#deed .sub{text-align:center;margin:0 0 14px;font-family:var(--sans);font-size:.9rem;color:#5e4c27}
#deed h3{color:#3a2a0c;border-top:1px solid rgba(58,42,12,.25);padding-top:10px}
#deed .seal{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
#deed .seal svg{width:40px;height:40px;color:#7a5a17}
#deed .dis{font-style:italic;font-size:1.15rem;text-align:center;margin:18px auto 6px;max-width:48ch}
#deed ol{padding-left:1.4em}
#deed .tick{color:#2d6b3e;font-weight:700;font-family:var(--sans);font-size:.85rem}
.deedbar{max-width:760px;margin:0 auto}
/* dialog */
dialog{background:var(--night);color:var(--text);border:1px solid var(--brass);border-radius:10px;max-width:min(92vw,460px);padding:18px}
dialog::backdrop{background:rgba(5,10,25,.7)}
.help dl dt{font-weight:650;margin-top:10px;font-family:var(--serif);font-size:1.08rem}
.help dl dd{margin:2px 0 6px 0}
.qa-out{font-size:.85rem;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:#0c1838}
.scrollnote{font-size:.85rem;color:var(--muted)}
footer.site{border-top:1px solid rgba(212,165,72,.2);padding:18px 0 30px;color:var(--muted);font-size:.88rem}
body.textfirst .planArt{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.still *,body.still *::before,body.still *::after{animation:none!important;transition:none!important}
@media print{
  body{background:#fff;color:#000}
  body::before{display:none}
  body.on-deed header.top,body.on-deed footer.site,body.on-deed .noprint,body.on-deed .skip{display:none!important}
  body.on-deed main{padding:0}
  body.on-deed #deed{box-shadow:none;max-width:none;margin:0;background:#fff}
}
</style>
</head>

<script data-part="content">
/* DoorQuests · Creatortal #001 · Nine Rooms for the Midnight Guest — authored content (no logic beyond data building) */
(function (G) {
  'use strict';

  // The 3x3 plan. Rooms are numbered 0..8 internally (shown to people as 1..9), row by row from the north-west.
  // Exactly twelve boundaries can exist between grid-adjacent rooms: six east-west and six north-south.
  var PAIRS = [[0, 1], [1, 2], [3, 4], [4, 5], [6, 7], [7, 8], [0, 3], [1, 4], [2, 5], [3, 6], [4, 7], [5, 8]];
  var BOUNDARIES = PAIRS.map(function (p, i) {
    return Object.freeze({ id: i, a: p[0], b: p[1], axis: p[1] === p[0] + 1 ? 'ew' : 'ns' });
  });

  var POSITIONS = ['north-west', 'north', 'north-east', 'west', 'centre', 'east', 'south-west', 'south', 'south-east'];

  var KEYS = [
    { id: 0, name: 'brass', letter: 'B' },
    { id: 1, name: 'iron', letter: 'I' },
    { id: 2, name: 'silver', letter: 'S' }
  ];
  var LEVERS = [
    { id: 0, name: 'copper', letter: 'C' },
    { id: 1, name: 'oak', letter: 'O' }
  ];

  var LIMITS = Object.freeze({
    roomName: 24, roomNote: 60, houseName: 32, monogram: 3,
    locks: 4, keys: 3, levers: 2, slots: 3, saveBytes: 20000,
    // Proven bound (see creation report): 9 rooms x 27 key states x 16 lock states x 4 lever states, plus one "stepped out" state.
    provenStateBound: 9 * 27 * 16 * 4 + 1,
    defaultCap: 20000
  });

  var PRESET_NAMES = ['Hall', 'Kitchen', 'Pantry', 'Cellar', 'Study', 'Library', 'Parlour', 'Attic', 'Gallery',
    'Observatory', 'Conservatory', 'Larder', 'Scullery', 'Nursery', 'Chapel', 'Music Room', 'Map Room',
    'Clock Room', 'Boot Room', 'Wine Cellar', 'Lantern Room', 'Glasshouse', 'Bell Tower', 'Laundry'];

  var DEFAULT_NAMES = ['Attic', 'Study', 'Observatory', 'Pantry', 'Parlour', 'Gallery', 'Hall', 'Kitchen', 'Cellar'];

  var MARKS = [
    { id: 'moon', name: 'Crescent moon' }, { id: 'star', name: 'Star' }, { id: 'key', name: 'Key' },
    { id: 'owl', name: 'Owl' }, { id: 'lantern', name: 'Lantern' }, { id: 'compass', name: 'Compass' },
    { id: 'crown', name: 'Crown' }, { id: 'feather', name: 'Feather' }, { id: 'bell', name: 'Bell' },
    { id: 'eye', name: 'Eye' }, { id: 'wave', name: 'Wave' }, { id: 'spiral', name: 'Spiral' }
  ];

  // Build a blueprint in the canonical stored shape from a compact authoring spec.
  // walls: { 'a-b': 'arch' | ['lock', key] | ['oneway', from, to] | ['gate', lever] }
  function build(spec) {
    var b = BOUNDARIES.map(function () { return ['wall']; });
    Object.keys(spec.walls || {}).forEach(function (k) {
      var ab = k.split('-').map(Number);
      var lo = Math.min(ab[0], ab[1]), hi = Math.max(ab[0], ab[1]);
      var id = -1;
      BOUNDARIES.forEach(function (x) { if (x.a === lo && x.b === hi) id = x.id; });
      if (id < 0) throw new Error('Not an adjacent pair: ' + k);
      var w = spec.walls[k];
      if (w === 'arch') b[id] = ['arch'];
      else if (w[0] === 'lock') b[id] = ['lock', w[1]];
      else if (w[0] === 'gate') b[id] = ['gate', w[1]];
      else if (w[0] === 'oneway') b[id] = ['oneway', w[1] === lo ? 0 : 1];
      else throw new Error('Unknown wall spec');
    });
    return {
      v: 1, name: spec.name, mark: spec.mark || 'moon', mono: spec.mono || '',
      rooms: spec.rooms.map(function (r) { return [r[0], r[1] || '']; }),
      b: b, keys: spec.keys || [null, null, null], levers: spec.levers || [null, null],
      front: spec.front, final: spec.final
    };
  }

  // Tutorial: the half-built house. The brass key lies in the Study; the only way into the Study is the brass door.
  var TUTORIAL = build({
    name: 'The Half-Built House', mark: 'lantern',
    rooms: [
      ['Attic', 'Dust, and a fine view of nothing.'],
      ['Study', 'Brass for brass. Mind where you leave things.'],
      ['Observatory', 'The stars are the way out.'],
      ['Pantry', 'Jam, mostly.'],
      ['Parlour', 'The brass door creaks to the north.'],
      ['Gallery', 'Portraits of earlier Doorwrights.'],
      ['Hall', 'Wipe your boots. The house is listening.'],
      ['Kitchen', 'Still warm. Someone was here.'],
      ['Cellar', 'Cold, damp and empty.']
    ],
    walls: { '6-7': 'arch', '3-6': 'arch', '7-8': 'arch', '4-7': 'arch', '4-5': 'arch', '0-3': 'arch', '1-4': ['lock', 0], '1-2': 'arch' },
    keys: [1, null, null], front: 6, final: 2
  });

  // A passing sample to start from: a lever, a one-way door and two locks.
  var LANTERN = build({
    name: 'The Lantern House', mark: 'star',
    rooms: [
      ['Attic', 'Silver, for the last door.'],
      ['Library', 'The way up only goes one way.'],
      ['Observatory', 'Step out. The night is waiting.'],
      ['Pantry', 'A ladder climbs into the dark.'],
      ['Parlour', 'Someone left the fire burning.'],
      ['Conservatory', 'Ferns, and something that glints.'],
      ['Hall', 'Lanterns light the way, if you light them.'],
      ['Kitchen', 'A gate to the north, held shut.'],
      ['Cellar', 'Pull, and somewhere a gate will rise.']
    ],
    walls: { '6-7': 'arch', '3-6': 'arch', '7-8': 'arch', '4-7': ['gate', 0], '4-5': 'arch', '1-4': ['lock', 0], '0-1': ['oneway', 1, 0], '0-3': 'arch', '1-2': ['lock', 2] },
    keys: [5, null, 0], levers: [8, null], front: 6, final: 2
  });

  // A house with a real softlock: spend the iron key on the Cellar and the Attic is gone for good.
  var IRON_TRAP = build({
    name: 'The Iron Key Trap', mark: 'key',
    rooms: [
      ['Attic', 'Up here, the stairs to the stars.'],
      ['Study', 'Nearly there.'],
      ['Observatory', 'Out into the night.'],
      ['Pantry', 'One iron key. Choose well.'],
      ['Cellar', 'Wine, and nothing you need.'],
      ['Gallery', 'A long way round.'],
      ['Hall', 'Two iron doors, one iron key.'],
      ['Kitchen', 'The back stairs go down.'],

  function burnAll() {
    confirmDlg('Burn all three houses and remove anything saved in this browser? This cannot be undone.', 'Burn them all').then(function (yes) {
      if (!yes) return;
      A.slots = [null, null, null]; A.report = null; A.sel = null; A.storeMsgs = [];
      try { window.localStorage.removeItem(M.STORAGE_KEY); } catch (e) { /* storage unavailable */ }
      A.persist = false;
      renderStreet(); announce('All three houses are gone, and nothing is saved in this browser.'); $('hStreet').focus();
    });
  }

  /* ---------- deed ---------- */
  function openDeed(i) {
    var sl = A.slots[i], info = St.slotStatus({ design: sl.hist.present, sealed: sl.sealed });
    if (info.status !== 'gold') { announce('This house has no current gold door, so there is no deed.'); return; }
    A.deed = { slot: i, deed: De.fromVerifiedResult(sl.hist.present, info.report) };
    show('deed');
  }
  function renderDeed() {
    var el = clear($('scrDeed')), dd = A.deed && A.deed.deed;
    if (!dd) { el.appendChild(h('h2', { id: 'hDeed' }, 'No deed to show')); return; }
    el.appendChild(h('div', { class: 'deedbar noprint row' },
      btn('Print the deed', function () { window.print(); }, { cls: 'primary', id: 'bPrint' }),
      btn('Back to the street', function () { show('street'); }, { id: 'bDeedBack' }),
      h('label', { class: 'radio' }, h('input', { type: 'checkbox', id: 'cbDate', checked: A.deedDate, onchange: function () { A.deedDate = this.checked; withFocus(renderDeed); } }), 'Add today’s date to the deed')));
    var art = h('article', { id: 'deed', 'aria-labelledby': 'hDeed' });
    art.appendChild(h('h2', { id: 'hDeed', tabindex: '-1' }, dd.name));
    art.appendChild(h('p', { class: 'sub' }, 'Deed of a house that lets the Guest through'));
    art.appendChild(h('div', { class: 'seal' }, markIcon(dd.mark), h('span', null, "Maker's mark: " + markName(dd.mark) + (dd.mono ? ', monogram ' + dd.mono : ''))));
    art.appendChild(h('p', { class: 'sub' }, 'Blueprint revision ' + dd.rev + (A.deedDate ? ', dated ' + new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : '')));
    art.appendChild(h('h3', null, 'Four checks, all passed'));
    art.appendChild(h('ul', null, dd.checks.map(function (c) { return h('li', null, h('span', { class: 'tick' }, 'PASS '), c); })));
    art.appendChild(h('p', null, 'The Guest searched all ' + dd.states.toLocaleString('en') + ' reachable states of this house (and ' + dd.edges.toLocaleString('en') + ' moves between them). No house under these rules can have more than ' + dd.bound.toLocaleString('en') + '.'));
    art.appendChild(h('h3', null, 'The shortest way through: ' + dd.routeLength + ' actions'));
    art.appendChild(h('p', { class: 'small' }, 'Each move through a doorway, each lever pulled and opening the final door counts as one action. Keys are picked up automatically.'));
    art.appendChild(h('p', null, dd.route[0]));
    art.appendChild(h('ol', null, dd.route.slice(1).map(function (l) { return h('li', null, l); })));
    art.appendChild(h('h3', null, 'Real decisions on that route: ' + dd.decisions));
    art.appendChild(h('p', { class: 'small' }, dd.decisionDefinition));
    if (dd.notes.length) { art.appendChild(h('h3', null, 'Notes')); art.appendChild(h('ul', null, dd.notes.map(function (n) { return h('li', null, n); }))); }
    art.appendChild(h('p', { class: 'dis' }, '“' + dd.disclaimer + '”'));
    art.appendChild(h('p', { class: 'sub' }, 'The Guest'));
    art.appendChild(h('p', { class: 'sub' }, 'DoorQuests · Creatortal No. 1 · Nine Rooms for the Midnight Guest · Created by The Axiom Continuum'));
    el.appendChild(art);
  }

  /* ---------- help ---------- */
  function renderHelp() {
    var el = clear($('scrHelp'));
    var dl = h('dl', null,
      h('dt', null, 'Rooms and walls'), h('dd', null, 'Nine rooms on a 3 by 3 plan. Between each pair of side-by-side rooms there is one wall: twelve in all. A wall can stay solid or become one of four connections.'),
      h('dt', null, 'Open arch'), h('dd', null, 'Both ways, any time.'),
      h('dt', null, 'Locked door and keys'), h('dd', null, 'There are three keys (brass, iron, silver), one of each. The Guest picks a key up automatically on entering its room. A locked door takes one matching key the first time it is opened: the key is used up and the door stays open for good, both ways. Up to four locked doors, so two doors can want the same key, and the Guest must choose.'),
      h('dt', null, 'One-way door'), h('dd', null, 'Opens only from the side you choose.'),
      h('dt', null, 'Lever gate'), h('dd', null, 'Bound to the copper or the oak lever. Pulling a lever (in the room where it stands) raises all its gates for good.'),
      h('dt', null, 'Front door and final door'), h('dd', null, 'The Guest enters by the front door. Opening the final door from inside its room ends the visit. They must be in different rooms, and the final door never needs a key.'),
      h('dt', null, 'What the Guest checks'), h('dd', null, '1. Every room can be reached on at least one visit. 2. The final door can be opened on at least one visit. 3. Every key has a door that takes it, every lever raises a gate, and every lock and gate has its key or lever in the house. 4. From every state the Guest can possibly reach, the final door can still be reached.'),
      h('dt', null, 'States and the limit'), h('dd', null, 'A state is where the Guest stands, what each key is doing (not yet found, carried, used up), which locked doors are open and which levers are pulled. Under these rules no house can have more than 9 × 27 × 16 × 4 + 1 = 15,553 states, so the Guest can always search them all.'),
      h('dt', null, 'What the checks cannot tell you'), h('dd', null, M.TEXT.disclaimer),
      h('dt', null, 'Privacy'), h('dd', null, 'Nothing leaves this page. Your street is kept in this browser only if you turn that on in the street, and you can burn it at any time.'));
    el.appendChild(h('div', { class: 'help' }, h('h2', { id: 'hHelp' }, 'How the house works'), dl,
      h('h3', null, 'For auditors'),
      h('p', { class: 'small' }, 'Run the built-in engine self-tests. These are the author’s own checks, not an independent audit; checks that need a real browser are listed as NOT RUN.'),
      btn('Run the built-in engine self-tests', function () {
        var res = window.CreatortalQA.run(), sm = window.CreatortalQA.summary(res), out = $('qaOut');
        clear(out); out.appendChild(h('p', null, sm.pass + ' pass, ' + sm.fail + ' fail, ' + sm.notRun + ' not run (of ' + sm.total + ').'));
        out.appendChild(h('ul', null, res.map(function (r) { return h('li', null, r.status + ' ' + r.id + ': ' + r.assertion); })));
        announce('Self-tests finished: ' + sm.pass + ' pass, ' + sm.fail + ' fail, ' + sm.notRun + ' not run.');
      }, { id: 'bQA' }),
      h('div', { id: 'qaOut', class: 'qa-out', tabindex: '0', 'aria-label': 'Self-test results' }),
      h('h3', null, 'Motion'),
      h('label', { class: 'radio' }, h('input', { type: 'checkbox', id: 'cbStill', checked: A.still, onchange: function () { A.still = this.checked; document.body.classList.toggle('still', A.still); announce(A.still ? 'Still frames on: nothing moves.' : 'Gentle motion allowed again.'); } }), 'Still frames: turn off every animation')));
  }

  /* ---------- dialog ---------- */
  function confirmDlg(msg, okLabel) {
    var dlg = $('dlg'), opener = document.activeElement;
    if (!dlg.showModal) return Promise.resolve(window.confirm(msg));
    return new Promise(function (resolve) {
      $('dlgMsg').textContent = msg; $('dlgOk').textContent = okLabel || 'Yes';
      function done(v) { $('dlgOk').onclick = null; $('dlgNo').onclick = null; dlg.onclose = null; if (dlg.open) dlg.close(); if (opener && opener.focus && document.contains(opener)) opener.focus(); resolve(v); }
      $('dlgOk').onclick = function () { done(true); };
      $('dlgNo').onclick = function () { done(false); };
      dlg.onclose = function () { done(false); };
      dlg.showModal(); $('dlgNo').focus();
    });
  }

  /* ---------- start ---------- */
  function boot() {
    loadSaved();
    Array.prototype.forEach.call(document.querySelectorAll('nav.main button'), function (b) {
      b.addEventListener('click', function () {
        var go = b.getAttribute('data-go');
        if (go === 'workshop') { A.mode = 'workshop'; A.report = null; A.repairToken++; A.repairs = null; show('editor'); }
        else show(go);
      });
    });
    document.addEventListener('keydown', function (e) {
      if (A.screen !== 'editor') return;
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); doRedo(); }
    });
    window.addEventListener('pagehide', save);
    show('intro', { keepFocus: true });
  }
  window.NineRoomsUI = { state: A, show: show }; // for the browser test harness only; holds no secrets
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
