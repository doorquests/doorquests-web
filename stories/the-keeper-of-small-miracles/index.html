  <h1>The Keeper of Small Miracles</h1>

  <div class="sparks"><span class="lbl" id="sparkLbl"></span></div>
  <div class="clock" id="clock" aria-hidden="true"></div>
</header>

<div class="wrap">

    <details class="ref-fold" open><summary>The Keeper's Notebook</summary><section><h3>The Keeper's Notebook</h3><p class="sub">Granted, and let be</p><ul class="notebook" id="book"></ul></section></details>
  </aside>
</div>

<script>
const PEOPLE={J:["Jonah",17],P:["Pilar",44],O:["Mr. Okafor",71],S:["Saoirse",8],M:["Margit",66],V:["Vera",63],T:["Theo",29]};
const ORDER=["J","P","O","S","M","V","T"];
const TIMES=[["06:40","Jonah"],["07:30","Pilar"],["09:30","Okafor"],["12:15","Saoirse"],["15:00","the café"],["18:30","Theo"],["22:00","St Bride's"]];
const ENDINGS={E1:"The Bells of St Bride's",E2:"Seven Kindnesses",E3:"The Keeper's Hour",E4:"Let It Be",E5:"Empty Hands",E6:"Too Big"};
const said=(who,t)=>`<span class="said">${t}<b>${who}</b></span>`;
const rip=(t)=>`<span class="ripple"><span class="h">A ripple from earlier</span>${t}</span>`;
const rule=(t)=>`<span class="rule"><span class="h">The rules, as Mrs. Abernathy gave them</span>${t}</span>`;

const S={
start:{t:`Seven a Day`,slot:-1,who:`Yesterday evening`,p:[
 `Yesterday, in a hospice bed on Saint Bride's Row, a very old woman you'd met exactly once took your hand and said, "It's yours now, love. I can't do it any more." And put something into your palm that felt like nothing at all, and then like a warm coal, and then like seven.`,
 rule(`1. Seven a day. They don't keep past midnight.<br>2. Nothing bigger than a sneeze. A pigeon, a gust, a green light, a song.<br>3. Nothing anybody could prove.<br>4. No raising the dead. No lottery numbers. No making anyone love anyone.<br>5. Watch where it goes after. It always goes somewhere.`),
 `Mrs. Abernathy kept the miracles of Saint Bride's Row for fifty-one years. You've been the Keeper for fourteen hours. It's twenty to seven on a grey Tuesday morning, and somewhere on the Row an alarm clock has just failed to go off.`],
 o:[[`Begin the day`,`s1`],[`Practise first: blow a dandelion clock into a perfect circle`,`s1`,{cost:1,note:"A practice miracle: a dandelion clock"},`Spends a spark on nothing`],[`Ask Mrs. Abernathy one last question before you go`,`ask`]]},
ask:{t:`One Question`,slot:-1,who:`Mrs. Abernathy, in the hospice bed`,set:["asked"],p:[
 `"Just one," she says. "I'm tired."`,
 `You ask her how you're meant to choose.`,
 said(`Mrs. Abernathy`,`Don't pick the saddest. Pick the ones that touch. A miracle that only helps one person stops at them. One that puts two people in the same place, that one keeps going after you've forgotten it. And keep one back for the night, love. The night always wants one.`)],
 o:[[`Begin the day`,`s1`],[`Thank her, and begin`,`s1`],[`Kiss her forehead, and begin`,`s1`]]},

s1:{t:`The Alarm That Didn't`,slot:0,who:`Jonah, seventeen, asleep`,p:[
 `In a box room above the launderette, Jonah is fast asleep with his good shirt ironed on the back of the chair. His phone died in the night. At nine o'clock he has an interview at the university, the first person in his family to get one. The No. 9 bus that would get him there leaves the stop on the corner at seven-oh-two.`,
 `At the depot, the No. 9's driver is finishing her tea. And at the far end of the Row, an old woman in a good coat is walking very fast toward the same stop, and won't make it either.`],
 o:[[`Send a pigeon to tap on Jonah's window until he wakes`,`s2`,{cost:1,f:["jonahOK"],note:"Woke Jonah with a pigeon"}],
   [`Delay the No. 9 by forty seconds at the depot`,`s2`,{cost:1,f:["jonahOK","margitBus"],link:["J","M"],note:"Held the No. 9 for forty seconds"},`Someone else is running for that bus`],
   [`Let it be`,`s2`,{note:"Let Jonah sleep"}]]},

s2:{t:`Fourteen Hours`,slot:1,who:`Pilar, forty-four, night-shift nurse`,p:s=>{const a=[];
 if(s.f.margitBus) a.push(rip(`Jonah caught the No. 9 at a dead run, shirt untucked. So did the old woman in the good coat: Margit, a retired professor of languages, who sat down beside him, saw his interview letter, and spent twenty minutes telling him exactly what they'd ask.`));
 else if(s.f.jonahOK) a.push(rip(`A pigeon tapped on Jonah's window for eleven minutes, until he threw a sock at it, saw the time, and ran. He made the No. 9 with seconds to spare.`));
 a.push(`Pilar has been on her feet for fourteen hours on the hospice ward at St Bride's. She's driving home through the town in a small blue car with the window open to keep herself awake. It isn't working. At the long red light by the gasworks, her eyes start to close.`);
 return a;},
 o:[[`Turn every light green from St Bride's to her front door`,`s3`,{cost:1,f:["pilarOK"],note:"Green lights all the way home for Pilar"}],
   [`Put her favourite song on the radio, just as her eyes close`,`s3`,{cost:1,f:["pilarOK","pilarSong"],link:["P","T"],note:"Pilar's song on the radio"},`Whose song is it?`],
   [`Let it be`,`s3`,{f:["pilarShaken"],note:"Let Pilar drive"}]]},

s3:{t:`Grace's Cake`,slot:2,who:`Mr. Okafor, seventy-one, widower`,p:s=>{const a=[];
 if(s.f.pilarSong) a.push(rip(`The song on the radio was a thin, lovely thing, one guitar and a voice. Pilar sang along all the way home. She doesn't know who sings it. The DJ just called it "a local lad, Theo something, recorded in a kitchen."`));
 else if(s.f.pilarShaken) a.push(rip(`At the gasworks light Pilar's head dropped, and she only woke because the bus behind her leaned on its horn. She sat shaking in a lay-by for twenty minutes before she could drive on.`));
 a.push(`At the bakery-café on the corner of the Row, Mr. Okafor is standing at the counter in his Sunday suit on a Tuesday. It would have been his wife Grace's seventieth birthday. Every year for forty-four years she made the same cake, and he never once watched her do it. He's turned the house upside down for her recipe card. It's not anywhere.`,
 `"I just want to make it the once," he tells the woman behind the counter. She's Vera, who owns the place: sixty-three, sharp-tongued, kind underneath.`);
 return a;},
 o:[[`Let Grace's recipe card fall out of the old cookbook on his shelf`,`s4`,{cost:1,f:["recipe"],note:"Grace's recipe card falls from a cookbook"}],
   [`Let Vera remember: Grace ordered the very same cake here, every year, for her sister`,`s4`,{cost:1,f:["recipe"],link:["O","V"],note:"Vera remembers Grace's cake"},`Vera's been baking it for years`],
   [`Let it be`,`s4`,{note:"Let Mr. Okafor go home without it"}]]},

s4:{t:`Biscuit`,slot:3,who:`Saoirse, eight, and a dog called Biscuit`,p:s=>{const a=[];
 if(s.links.some(l=>l.join()==="O,V")) a.push(rip(`Vera stopped wiping the counter. "Grace Okafor? Lemon and cardamom, with the burnt-sugar top? She ordered it here every June for her sister." She's writing it out for him on the back of a till receipt. They're both crying a bit. She's giving him the afternoon off from being alone: he's going to bake it in her kitchen, after closing.`));
 else if(s.f.recipe) a.push(rip(`A card slid out of a cookbook and onto Mr. Okafor's kitchen floor: lemon and cardamom, in Grace's round hand. He's been in the kitchen since ten.`));
 a.push(`Lunchtime in the little park at the top of the Row. Saoirse is eight and has been crying for an hour. Her dog Biscuit, small, brown and stupid, slipped his lead at the bandstand this morning and hasn't come back. She's taping a felt-tip poster to the railings, LOST BISCUIT VERY FRENDLY, and the tape won't stick.`,
 `Biscuit, as it happens, is asleep on the back step of the bakery-café, where somebody has been feeding him toast crusts all morning.`);
 return a;},
 o:[[`Let Biscuit bark once, loud, from where he is`,`s5`,{cost:1,f:["dog"],note:"Biscuit barks once"}],
   [`Let a gust carry Saoirse's poster all the way down the Row to the bakery's back step`,`s5`,{cost:1,f:["dog"],link:["S","O"],note:"A gust carries Saoirse's poster"},`Someone's on that back step`],
   [`Let it be`,`s5`,{note:"Let Biscuit wander"}]]},

s5:{t:`The Café`,slot:4,who:s=>s.f.margitBus?`Margit and Vera, sisters, eleven years apart`:`Vera, sixty-three, alone`,p:s=>{const a=[];
 if(s.links.some(l=>l.join()==="S,O")) a.push(rip(`The poster blew down the Row and wrapped itself around Mr. Okafor's ankle as he sat on the bakery's back step with a brown dog asleep on his shoe. He walked Biscuit up to the park himself. Saoirse's mother has asked him to tea on Sunday. Saoirse has asked if he can be her grandad, which is not how it works, but nobody's said no.`));
 else if(s.f.dog) a.push(rip(`Biscuit barked, once, and Saoirse ran the whole length of the Row toward it. He was on the bakery's back step, covered in crumbs.`));
 if(s.f.margitBus){
  a.push(`Three o'clock. In the window seat of Vera's café, by pure chance, sits Margit, back from walking Jonah to his interview. She doesn't know this is her sister's café. They haven't spoken in eleven years, not since their mother's house was sold and both of them said things that can't be unsaid.`);
  a.push(`Vera comes out of the kitchen with a tray, sees who's in the window, and stops dead.`);
 } else {
  a.push(`Three o'clock, and Vera's café is quiet. Vera stands at the window. She has a sister, Margit, she hasn't spoken to in eleven years, who lives four streets away and might as well be on the moon.`);
  a.push(`Margit isn't here today. Margit missed her bus this morning, and went home, and is sitting in her front room with the phone in her lap, as she does most afternoons.`);
 }
 return a;},
 o:s=>s.f.margitBus?[[`Let Vera bring Margit's order without asking: oat milk, two sugars, burnt toast`,`s6`,{cost:1,f:["sisters"],link:["M","V"],note:"Vera remembers how Margit takes her coffee"}],
   [`Let their mother's song come on the café radio`,`s6`,{cost:1,f:["sisters"],link:["M","V"],note:"Their mother's song on the café radio"}],
   [`Let it be`,`s6`,{note:"Let the sisters be"}]]:
  [[`Make Margit's phone ring, from a wrong number that's Vera's`,`s6`,{cost:2,f:["sisters"],link:["M","V"],note:"A wrong number that isn't"},`Bigger than a sneeze`],
   [`Give Vera one good afternoon: a full café, all compliments`,`s6`,{cost:1,note:"A full café for Vera"}],
   [`Let it be`,`s6`,{note:"Let the sisters be"}]]},

s6:{t:`The Underpass`,slot:5,who:`Theo, twenty-nine, busker`,p:s=>{const a=[];
 if(s.f.sisters) a.push(rip(s.f.margitBus?`Vera set the tray down in front of her sister: oat milk, two sugars, burnt toast. "You still take it like that, then," she said. Margit said, "You still burn it." They've been in the window seat for three hours. The café sign's turned to CLOSED.`:`Margit's phone rang. A wrong number, a voice she'd have known anywhere: "Oh — sorry — I —" Neither of them hung up.`));
 a.push(`Half past six. In the underpass under the ring road, Theo is playing the same four songs he's played every evening for three years to people hurrying home. He's twenty-nine. On Monday he starts a job in a call centre in Leeds. Tonight is the last time. Nobody's stopped all day. Nobody ever really stops.`);
 if(s.f.pilarSong) a.push(`One of the four songs is the one they played on the radio this morning. He doesn't know that. He doesn't know anyone heard it at all.`);
 return a;},
 o:s=>[s.f.jonahOK?[`Let one person stop and really listen: Jonah, on his way home from the interview`,`s7`,{cost:1,f:["listened"],link:["J","T"],note:"Jonah stops to listen to Theo"},`He's had quite a day`]:[`Let one stranger stop and really listen`,`s7`,{cost:1,f:["listened"],note:"A stranger stops for Theo"}],
   [`Fill his guitar case with coins`,`s7`,{cost:1,f:["coins"],note:"Theo's case fills with coins"}],
   [`Let it be`,`s7`,{note:"Let Theo pack up"}]]},

s7:{t:`St Bride's, at Night`,slot:6,who:`Mrs. Abernathy, ninety-four, the last Keeper`,p:s=>{const a=[];
 if(s.links.some(l=>l.join()==="J,T")) a.push(rip(`Jonah stopped in the underpass, still in his good shirt, and listened to all four songs, twice, and then said, "That one. That was on the radio this morning. My mum was singing it." Theo had to sit down. He's not going to Leeds on Monday. He hasn't decided what instead. Jonah says the interview went fine; a woman on the bus told him what they'd ask.`));
 else if(s.f.listened) a.push(rip(`A stranger stopped in the underpass and listened to all four songs. Theo played them better than he ever has. He'll still go to Leeds. But he'll go knowing.`));
 else if(s.f.coins) a.push(rip(`Theo's case filled with coins, and he stared at it, and bought a train ticket to Leeds with it.`));
 a.push(`Ten o'clock. The hospice at St Bride's is quiet. ${s.f.pilarShaken?"Pilar has called in sick tonight; the agency nurse doesn't know anyone's name.":"Pilar is back on shift, humming."} In the end room, Mrs. Abernathy is awake, very small in the bed, looking at you.`);
 a.push(said(`Mrs. Abernathy`,`Well? What did you spend them on?`));
 a.push(`You tell her. She listens with her eyes shut. When you've finished she's quiet so long you think she's asleep.`);
 a.push(said(`Mrs. Abernathy`,`Fifty-one years. Do you know what I always wanted, and never let myself have? Those bells. Saint Bride's bells. They've not rung since nineteen-ninety, the frame's rotten. I always thought: that's not a small miracle, everybody'd hear it. That's the point of it, mind.`));
 a.push(`You have ${s.sparks===0?"no sparks left":s.sparks===1?"one spark left":s.sparks+" sparks left"}. They're gone at midnight either way.`);
 return a;},
 o:s=>{const o=[];
  o.push(s.sparks>=1?[`Ring the bells of Saint Bride's, once, for her`,s=>webConnected(s)?"E1":"E2",{cost:1,f:["bells"],note:"The bells of St Bride's"},`Everyone will hear it`]:[`Wish you'd kept one back for her`,`E5`,{note:"Nothing left"}]);
  o.push(s.sparks>=2?[`Give her one clear hour without pain`,`E3`,{cost:2,note:"An hour without pain for Mrs. Abernathy"},`Bigger than a sneeze`]:[`Sit with her, and hold her hand. That one's free.`,s.sparks>=1?`E4`:`E5`,{note:"Sat with her"}]);
  o.push([`Make her well again. Never mind the rules.`,`E6`,{note:"Tried to make her well"},`Breaks rule four`]);
  return o;}},

E1:{end:true,best:true,slot:7,t:`The Bells of St Bride's`,p:s=>[
 `At eleven minutes past ten, for the first time since nineteen-ninety, the bells of Saint Bride's ring. Just once: a single long peal, rolling down the Row.`,
 `And everyone you touched today looks up at the same moment. Jonah, in his good shirt, walking Theo to the chip shop. Pilar, at the ward window. Mr. Okafor, in Vera's kitchen, with a lemon-and-cardamom cake just out of the oven. Vera and Margit, in the window seat of a café with its sign turned to CLOSED. Saoirse, in her pyjamas, with a small brown dog. They're all, without knowing it, tied together now, by forty seconds and a song and a gust of wind.`,
 said(`Mrs. Abernathy`,`There. Everybody heard. That's the point of it.`),
 `She dies a little before midnight, peacefully, with Pilar humming and you holding her hand. The last spark goes out at twelve, the way they do. In the morning, there are seven new ones.`,
 `On Sunday, at Mr. Okafor's, there's tea and cake for eight, and nobody can quite work out how they all know each other.`]},

E2:{end:true,slot:7,t:`Seven Kindnesses`,p:s=>[
 `The bells of Saint Bride's ring once, at eleven minutes past ten, for the first time in thirty-six years, and the whole Row looks up.`,
 `It's beautiful. Mrs. Abernathy smiles with her eyes shut. ${s.links.length?"Some of the people you helped today hear it together.":"Everyone you helped today hears it alone."} ${lonely(s).length?lonely(s).join(", ")+" "+(lonely(s).length===1?"hears":"hear")+" it on their own, and goes back to an evening that's a little better, and just as solitary.":""}`,
 `*Seven kindnesses, all good ones. The truest day ties the whole street together: every person connected to someone else, so that when the bells ring, they ring for a web, not seven separate people.*`]},

E3:{end:true,slot:7,t:`The Keeper's Hour`,p:[
 `You spend two sparks, more than a sneeze, on one hour.`,
 `For one hour Mrs. Abernathy has no pain at all. She sits up. She asks for tea and actually drinks it. She tells you about the miracles of nineteen-sixty-two, and the boy who became a bishop because of a bus, and a woman she let win a raffle once, against the rules, "because she'd never won anything, and I thought, sod it."`,
 said(`Mrs. Abernathy`,`You broke the rule for love. Good. I did too, every year or so. Don't tell the next one.`),
 `She dies a little before midnight. The bells don't ring. But you were there, and so was she, properly, for an hour.`,
 `*Warm, and true, and not quite the thing she asked for. She wanted the bells, so everybody would hear.*`]},

E4:{end:true,slot:7,t:`Let It Be`,p:s=>[
 `You sit with her and hold her hand, and keep the last of your sparks, and at midnight ${s.sparks===1?"it goes":"they go"} out in your palm like a match.`,
 `Mrs. Abernathy dies a little after. Peacefully. You were there.`,
 `You let a lot be, today. Some of it was wise. Rule five, she told you: watch where it goes. It goes somewhere even when you don't do anything at all.`,
 `*Restraint is part of the job. But a miracle unspent is gone at midnight anyway. The truest day spends all seven, each one on a thread between people.*`]},

E5:{end:true,slot:7,t:`Empty Hands`,p:[
 `You've nothing left. You spent all seven before ten o'clock, every one on somebody who needed it.`,
 `"The last one's always the hardest to save," Mrs. Abernathy says, not unkindly. "Took me twenty years to learn that." She asks you to tell her about the pigeon again, and laughs, and coughs, and laughs.`,
 `She dies a little before midnight. The bells don't ring. In the morning, there are seven new sparks, and you put one aside, before anything else, and leave it there.`,
 `*Every spark today went somewhere good. The truest day keeps exactly one for the night.*`]},

E6:{end:true,slot:7,t:`Too Big`,p:[
 `You close your hand around every spark you have left and push, with everything in you: *be well*.`,
 `Nothing happens. Then something does. The sparks go out, all of them, at once, like a fuse blowing. Your palm goes cold.`,
 `Mrs. Abernathy opens her eyes and looks at you with great tenderness. "Oh, love," she says. "Everybody tries that once. It doesn't work. It just ends you."`,
 `In the morning there are no sparks. Somewhere else in the town, a stranger is lying in bed with a palm that's suddenly warm, and seven, and doesn't know why.`,
 `*Rule four is there for a reason. The miracles are small on purpose.*`]}
};
function adj(s){const A={};ORDER.forEach(k=>A[k]=new Set());s.links.forEach(([a,b])=>{A[a].add(b);A[b].add(a)});return A}
function webConnected(s){const A=adj(s);const seen=new Set(["J"]);const q=["J"];while(q.length){const x=q.pop();A[x].forEach(y=>{if(!seen.has(y)){seen.add(y);q.push(y)}})}return seen.size===ORDER.length}
function lonely(s){const A=adj(s);return ORDER.filter(k=>A[k].size===0).map(k=>PEOPLE[k][0])}

/* ---------- engine ---------- */
const SAVE_KEY="tac-keeper-small-miracles-daily-door-v1";
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return d&&d.state&&S[d.state.scene]&&Array.isArray(d.history)?d:null}catch(e){return null}}
let state,history=[];
const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,sparks:7,links:[],notes:[],slot:-1});
const val=(x,s)=>typeof x==="function"?x(s):x;
function loadE(){try{return JSON.parse(localStorage.getItem("miracle-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("miracle-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function step(s,opt){
  let [,to,e0]=opt; const e=e0||{};
  if(e.cost&&e.cost>s.sparks) return null;
  const slot=S[s.scene].slot;
  if(e.cost) s.sparks-=e.cost;
  (e.f||[]).forEach(k=>s.f[k]=1);
  if(e.link) s.links.push(e.link);
  if(e.note&&slot>=0) s.notes.push({t:TIMES[slot][0],n:e.note,c:e.cost||0});
  to=val(to,s);
  s.scene=to; s.seen[to]=1;
  if(S[to].slot!=null) s.slot=S[to].slot;
  return s;
}
function go(opt){
  const snap=JSON.stringify(state);
  if(!step(state,opt)) return;
  history.push(snap); if(history.length>60) history.shift();
  state.n++;
  if(S[state.scene].end) saveE(state.scene);
  render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).map(t=>/^<span class="(said|ripple|rule)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span><b>${sc.end?"Midnight":sc.slot>=0?TIMES[sc.slot][0]:"Monday, dusk"}</b></span><span>${state.sparks} of 7 sparks left</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2>${sc.who?`<p class="who">${smart(val(sc.who,state))}</p>`:""}<div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"An ending"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="endnote">${7-state.sparks} of 7 sparks spent · ${state.links.length} threads tied · ${webConnected(state)?"the whole street connected":lonely(state).length+" "+(lonely(state).length===1?"person":"people")+" left on their own"}.${sc.best?"":"<br>The truest day: spend each spark on a miracle that ties two people together, connect all seven, and keep exactly one for the bells."}</p>
     <button class="begin" id="again">Wake up on Tuesday again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>{const e=o[2]||{};const dis=e.cost&&e.cost>state.sparks;
      const tags=[];tags.push(`<span class="c${e.cost?(e.cost>1?" big":""):" free"}">${e.cost?"✦".repeat(e.cost)+" "+e.cost+" spark"+(e.cost>1?"s":""):"free"}</span>`);
      if(o[3]) tags.push(`<span class="r">${smart(o[3])}</span>`);
      if(dis) tags.push(`<span class="c big">not enough sparks</span>`);
      return `<li><button class="choice" data-i="${i}"${dis?' disabled aria-disabled="true"':""}><span class="num">${i+1}</span><span>${smart(o[0])}<span class="tag">${tags.join("")}</span></span></button></li>`}).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose · seven sparks for the whole day</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".wrap");if(window.scrollY>top.offsetTop)window.scrollTo({top:top.offsetTop-10,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function flame(on){return `<svg viewBox="0 0 24 34" class="${on?"lit":""}" aria-hidden="true">${on?`<ellipse cx="12" cy="20" rx="11" ry="12" fill="var(--gold)" opacity=".16"/><g class="fl"><path d="M12 3 C17 11 19 15 19 20 a7 7 0 0 1 -14 0 C5 15 8 11 12 3 Z" fill="var(--gold)"/><path d="M12 12 C14.5 16 15.5 18 15.5 21 a3.5 3.5 0 0 1 -7 0 C8.5 18 10 16 12 12 Z" fill="#fff3cf"/></g>`:`<path d="M12 3 C17 11 19 15 19 20 a7 7 0 0 1 -14 0 C5 15 8 11 12 3 Z" fill="none" stroke="var(--line)" stroke-width="1.5"/><path d="M12 27 q-2 -4 1 -7" stroke="var(--muted)" stroke-width="1" fill="none" opacity=".6"/>`}</svg>`}
function side(){
  const s=state, sc=S[s.scene];
  document.getElementById("sparks").innerHTML=[...Array(7)].map((_,i)=>flame(i<s.sparks)).join("");
  document.getElementById("sparkLbl").textContent=`${s.sparks} of 7 sparks · they go out at midnight`;
  const slot=sc.end?7:s.slot;
  document.getElementById("clock").innerHTML=`<div class="bar"></div><div class="fill" style="width:${Math.max(0,Math.min(100,(slot+0.5)/7*100))}%"></div>`+TIMES.map(([t,w],i)=>`<div class="tk${i<slot?" on":""}${i===slot?" now on":""}" style="left:${(i+.5)/7*100}%">${t}<span><br>${w}</span></div>`).join("");
  // web
  const cx=160,cy=128,R=96;const pos={};ORDER.forEach((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/7;pos[k]=[cx+Math.cos(a)*R,cy+Math.sin(a)*R]});
  const A=adj(s);let g="";
  if(s.f.bells) ORDER.forEach(k=>{g+=`<line x1="${cx}" y1="${cy}" x2="${pos[k][0]}" y2="${pos[k][1]}" stroke="var(--rose)" stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>`});
  s.links.forEach(([a,b])=>{const[x1,y1]=pos[a],[x2,y2]=pos[b];const mx=(x1+x2)/2+(cy-(y1+y2)/2)*.18,my=(y1+y2)/2+((x1+x2)/2-cx)*.18;
    g+=`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" stroke="var(--thread)" stroke-width="2.4" fill="none" stroke-linecap="round"/>`});
  g+=`<circle cx="${cx}" cy="${cy}" r="${s.f.bells?16:11}" fill="${s.f.bells?"var(--rose)":"var(--card)"}" stroke="var(--rose)" stroke-width="1.4" opacity="${s.f.bells?.9:.7}"/><text x="${cx}" y="${cy+30}" text-anchor="middle" font-size="9" fill="var(--rose)">St Bride's</text>`;
  ORDER.forEach(k=>{const[x,y]=pos[k];const on=A[k].size>0;const met=metAt(s,k);
    g+=`<circle cx="${x}" cy="${y}" r="${on?13:11}" fill="${on?"var(--gold)":met?"var(--card)":"transparent"}" stroke="${on?"var(--gold)":"var(--line)"}" stroke-width="1.6" opacity="${met?1:.45}"/>${on?`<circle cx="${x}" cy="${y}" r="19" fill="var(--gold)" opacity=".14"/>`:""}
     <text x="${x}" y="${y+(y>cy?28:-20)}" text-anchor="middle" font-size="10" fill="var(--ink)" opacity="${met?1:.5}">${PEOPLE[k][0]}</text>`});
  document.getElementById("web").innerHTML=`<svg viewBox="0 0 320 262" role="img" aria-label="Web of connections: ${s.links.length} threads">${g}</svg>`;
  const lon=lonely(s).filter(n=>{const k=ORDER.find(x=>PEOPLE[x][0]===n);return metAt(s,k)});
  document.getElementById("webnote").innerHTML=`<b>${s.links.length}</b> thread${s.links.length===1?"":"s"} tied · ${webConnected(s)?"<b>everyone connected</b>":lon.length?lon.join(", ")+" still on their own":"the day's still young"}`;
  document.getElementById("book").innerHTML=s.notes.length?s.notes.map(n=>`<li class="${n.c?"":"let"}"><b>${n.t}</b><span>${smart(n.n)}${n.c?" "+"✦".repeat(n.c):""}</span></li>`).join(""):`<li class="none">Nothing yet. The day hasn't started.</li>`;
}
function metAt(s,k){const first={J:0,P:1,O:2,S:3,M:s.f.margitBus?0:4,V:2,T:5}[k];return S[s.scene].end||s.slot>=first}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){const saved=d&&d.state&&S[d.state.scene]&&Array.isArray(d.history)?d:restore();state=saved?saved.state:fresh();history=saved?saved.history:[];render(false);persist();if(matchMedia("(max-width:900px)").matches)document.querySelectorAll(".ref-fold").forEach(x=>x.open=false)}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body></html>
