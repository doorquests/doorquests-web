<header class="mast">
  <p class="pre">Inishcorran, Ireland · Cape Sable, Nova Scotia · Daily Door No. 23</p>
  <h1>Three Hundred <b>Bottles</b></h1>
  <div class="chart" id="chart"></div>
  <div class="yearbar" id="yearbar"></div>
</header>

<div class="wrap">
  <main id="main" aria-live="polite"></main>

    <section class="sidebar-section"><h3>The Tin</h3><p class="sub">What's crossed the water</p><ul class="tin" id="tin"></ul></section>

  </aside>
</div>

<script>
const ENDINGS={E1:"The Three Hundredth Bottle",E2:"Cape Sable",E3:"Message Unsent",E4:"Return to Sender",E5:"Washed Up",E6:"Across the Water"};
const teo=(hd,body,sg="T.")=>`<span class="letter teo"><span class="hd">${hd}</span>${body}<span class="sg">${sg}</span></span>`;
const june=(hd,body)=>`<span class="letter june"><span class="hd">${hd}</span>${body}<span class="sg">June Lund</span></span>`;
const KEEPS={seapink:["A pressed sea pink","you → him"],photo:["Your school photograph","you → him"],ticket:["A ticket on the Empress of Canada","him → you"],ticketBack:["The ticket, returned","you → him"],juneLetter:["A letter for June","you → June"],juneFlower:["A sea pink for June","you → June"],photo60:["A photograph, sixty, not scowling","you → him"],light:["A drawing of the light","you → him"],ticketLate:["The Empress ticket, 34 years late","you → him"]};
const Y=s=>s.year;

const S={
c1:{t:`The First Bottle`,year:1962,bottles:1,p:s=>[
 `Inishcorran is a rock off the west of Ireland with a lighthouse on it, your father, forty sheep and you. You are sixteen. In the whole of your life, nothing has ever arrived on Inishcorran that wasn't brought by the mail boat.`,
 `Then, one March morning, there's a green bottle on the shingle below the light, corked and sealed with candle wax, with paper inside.`,
 teo(`Thrown off the government wharf, Cape Sable, Nova Scotia · August 1961`,`To whoever finds this. My name is Teodor Lund but everybody says Teo. I'm seventeen. I live at Cape Sable, at the bottom of everything, where my father mends nets and I mend them with him. I want to see the world, and the end of this wharf is as far as I can throw. If you find it, write back. I know you can't. Write anyway.`,`Teo Lund`),
 `You read it on the cliff until the light goes. Then you go in and find a pen.`],
 o:[[`Begin your reply`,`c1b`,{line:`Dear Teo, I live on a rock with a lighthouse, my father and forty sheep, and some days I'm so lonely I talk to the gannets.`,c:1,f:["honest"]}],
   [`Begin your reply`,`c1b`,{line:`Dear Teo, I am a mermaid and this is my rock. Mermaids are very bad at letters, so you'll have to be patient.`,f:["playful"]}],
   [`Begin your reply`,`c1b`,{line:`Found your bottle. Ireland. Nell.`,f:["guarded"]}]]},

c1b:{t:`What Goes in the Bottle`,year:1962,p:s=>[
 s.f.guarded?`That's all you can make yourself write. It looks very small on the page.`:`You write two more pages: the light, the sheep, your father's pipe, the mail boat on Thursdays. Then you stop, because the bottle is only so big.`,
 `There's room for one more thing in the bottle.`],
 o:[[`Put in a sea pink, pressed in the fold`,`c2`,{line:`P.S. This is a sea pink. They grow on the cliff where I read.`,keep:"seapink",send:1}],
   [`Put in your school photograph`,`c2`,{line:`P.S. That's me on the left, scowling.`,keep:"photo",send:1}],
   [`Put in nothing but the letter`,`c2`,{send:1},`Throw it off the cliff as it is`]]},

c2:{t:`Three Years Later`,year:1965,bottles:22,p:s=>{const a=[];
 a.push(`Most bottles thrown off Inishcorran go north to Norway, or nowhere. You throw yours off the west cliff anyway, and then you stop expecting anything.`,`Three years later, in a winter gale, a brown bottle comes in on the shingle.`);
 let open=s.f.honest?`Dear Nell. The gannets are lucky. I read your letter on the end of the wharf four times, and then I went home and told no one, because I'm lonely too and I've never said so to anybody.`:s.f.playful?`Dear Mermaid. I have taken your advice and been patient for three years. I'm writing this one to a rock in the sea and I don't feel foolish at all.`:`Dear Nell of Ireland. That is the shortest letter in the history of the sea. I've read it a hundred times anyway.`;
 let kp=s.f.seapink?` The sea pink is in my mother's Bible, between Ruth and Samuel.`:s.f.photo?` Your photograph is on my mirror. You don't scowl as much as you think.`:` You didn't send anything, so I've had to imagine you. You are very tall in my imagination.`;
 a.push(teo(`Thrown from the trawler Marguerite, off Yarmouth · 1963`,`${open}${kp} I'm on a trawler now. I've written you twenty bottles. This is the first one I believe in. Tell me something true: what do you want, more than anything?`));
 return a;},
 o:[[`Answer him`,`c2b`,{line:`I want to leave this island and see everything, every single thing, before I'm old.`,c:1,f:["wantLeave"]}],
   [`Answer him`,`c2b`,{line:`I want to keep the light after Dad. I want to be the one who never lets it go out.`,c:1,f:["wantStay"]}],
   [`Answer him`,`c2b`,{line:`Honestly? Your next letter. That's what I want more than anything.`,c:1,f:["wantYou"]}]]},

c2b:{t:`A Promise to the Sea`,year:1965,p:[
 `At the bottom of his letter, squeezed in sideways: *I'll throw a bottle every midsummer and every midwinter, so that at least some of them reach you.*`,
 `Two a year, against the whole Atlantic. You do the arithmetic, and then you decide not to.`],
 o:[[`Promise the same`,`c3`,{line:`I'll throw one too, midsummer and midwinter, at the same hour, so they pass each other in the dark.`,f:["promise"],c:1,send:1}],
   [`Make no promise`,`c3`,{line:`I'll write when I've something worth saying, which on this rock may be never.`,send:1}],
   [`Warn him`,`c3`,{line:`Don't promise things to the sea, Teo. It doesn't keep them.`,f:["warned"],send:1}]]},

c3:{t:`The Ticket`,year:1969,bottles:58,p:s=>[
 `${s.f.promise?"Midsummer and midwinter, every year. ":"You write when you can. "}Eleven of his bottles have reached Inishcorran now, out of who knows how many. You keep them in your mother's biscuit tin. Your father has stopped teasing you about it.`,
 `Your father has stopped doing a great many things. His lungs are bad. Most nights now it's you who climbs the hundred and twelve steps to light the lamp.`,
 teo(`Thrown from the Ruth, my own boat, off Cape Sable · 1968`,`Nell. I've saved for three years. Inside this bottle is a ticket: Liverpool to Halifax, the Empress of Canada, sailing the 4th of May. I'll be on the pier at Halifax. If you're not on it I'll understand, and I'll keep writing. But I've never wanted anything so much in my life, and you told me to tell you true things.`),
 `The ticket is real. It's a little damp. It's for the fourth of May, and it's the first of April.`],
 o:[[`Go. Pack one bag and take the mail boat to the mainland`,`E2`,{keep:"ticket"},`Ends the letters`],
   [`Stay, and write him the truth about Dad and the light`,`c3b`,{keep:"ticket",line:`Teo, I can't come. Dad can't climb the tower any more, and if I go the light goes out. I have never wanted anything more than to be on that ship.`,c:1,f:["toldWhy"]}],
   [`Stay, and send the ticket back with no letter`,`c3b`,{keep:"ticketBack",f:["silentNo"],send:1},`Say nothing`]]},

c3b:{t:`The Fourth of May`,year:1969,p:s=>[
 `On the fourth of May you light the lamp at dusk as usual, and stand at the rail, and think about the Empress of Canada steaming out of the Mersey without you.`,
 s.f.toldWhy?`Your letter is still on the table. There's room for one more line.`:`The ticket has gone back to the sea in a bottle with nothing else in it. You go down and write in your diary instead: *I didn't know how to say it.*`],
 o:s=>s.f.toldWhy?[[`Add a line`,`c4`,{line:`Keep a light on for me anyway, Teo. One day I'll come.`,f:["oneDay"],send:1}],[`Add a line`,`c4`,{line:`Don't wait for me. I mean that. Write anyway.`,send:1}],[`Add nothing, and throw it`,`c4`,{send:1},`Throw it as it is`]]:
   [[`Climb up and trim the wick`,`c4`],[`Go to bed early`,`c4`],[`Sit up with your father`,`c4`]]},

c4:{t:`Fergal Rooney`,year:1974,bottles:96,p:s=>[
 `Your father died in the winter of '71. The Commissioners of Irish Lights, after a great deal of fuss, made you keeper. There are very few women keepers. There is one.`,
 `And Fergal Rooney, who runs the mail boat and has brought you every one of Teo's bottles that washed up on the mainland side, has asked you to marry him. He's kind and steady and he laughs at your jokes. You've said yes.`,
 teo(`Thrown from the Ruth · 1973`,`${s.f.silentNo?"I stood on the pier at Halifax until the last passenger came down the gangway. Then I went home and wrote you this anyway, because you never said not to.":s.f.toldWhy?"Keep the light, Nell. I'd rather a light that's lit than a pier with you on it and a dark island behind you.":"I waited at the pier. I knew you had your reasons. I still keep a light on for your letters."} I've bought a bigger boat. I named her the ${s.f.seapink?"Sea Pink":s.f.playful?"Mermaid":"Inishcorran"}. Tell me everything.`),
 `Everything. You sit with the pen for a long time.`],
 o:[[`Tell him in the first line`,`c4b`,{line:`Teo, I'm getting married. His name is Fergal, he runs the mail boat, he's kind, and I wanted you to hear it from me first.`,c:1,f:["toldFergal"]}],
   [`Tell him in the last line, after the island news`,`c4b`,{line:`…and one more thing. I'm marrying Fergal Rooney in June. I didn't know how to begin with it.`,f:["toldFergal"]}],
   [`Don't tell him`,`c4b`,{line:`The sheep are well. The light is well. I am well.`,f:["hidFergal"]},`Keep it to yourself`]]},

c4b:{t:`The Lamp Room`,year:1974,p:[
 `A week before the wedding, Fergal climbs up to the lamp room with your tea and finds you corking a bottle. He looks at it, and then at the tin of letters on the shelf, and then at you.`,
 `"Who's that one for, Nell?"`],
 o:[[`Tell Fergal everything about the bottles, and keep writing as friends`,`c5`,{f:["open"],c:1,send:1}],
   [`Tell him it's a pen-friend, and say no more`,`c5`,{f:["half"],send:1}],
   [`Tell him it's the last one, and mean it`,`E3`,{send:1},`Ends the letters`]]},

c5:{t:`The Long Middle`,year:1988,bottles:172,p:s=>{const a=[`You're forty-two. The years go the way years go on an island: weather, sheep, the light, Fergal's boat coming in.${s.f.open?" Fergal carries your bottles out past the headland himself now and throws them where the current's strongest. He says it's the least he can do for the competition.":""}`];
 if(s.f.hidFergal) a.push(teo(`Thrown from the Sea Pink · 1987`,`I saw it in the Halifax paper. The lifeboat medal for Mr. Fergal Rooney of Inishcorran, "pictured with his wife, Mrs. Nell Rooney, the lighthouse keeper." Thirteen years. Why didn't you tell me, Nell?`));
 else a.push(teo(`Thrown from the Sea Pink · 1987`,`I married Annie in '76, you know that, and our June is ten and wants to know everything about the mermaid. Last winter I lost the boat in a storm off Seal Island. I was in the water two hours holding a fish crate, and I'll tell you a true thing: I thought about your light the whole time. I'm all right. Annie says I'm a fool. She's not wrong.`));
 return a;},
 o:s=>s.f.hidFergal?[[`Tell him the truth: you were afraid he'd stop writing`,`c5b`,{line:`I didn't tell you because I was afraid you'd stop writing, and I couldn't bear it. That's the truth, and I'm sorry.`,c:1,f:["apologised"]}],
   [`Tell him it didn't seem important`,`E4`,{line:`It didn't seem important.`,send:1},`A small lie`],[`Don't answer`,`E3`,{},`Ends the letters`]]:
  [[`Tell him how you felt when you read it`,`c5b`,{line:`When I read about the fish crate I sat down on the lamp-room floor and couldn't get up for an hour. Don't you ever do that again.`,c:1}],
   [`Write him something to make him laugh`,`c5b`,{line:`Annie is right. Tell her a lighthouse keeper said so, and they're never wrong about the sea.`}],
   [`Send him a photograph of the island`,`c5b`,{line:`Here's the island in July, so you can see what you were thinking about.`}]]},

c5b:{t:`A Line for June`,year:1988,p:[
 `In the corner of his letter, in pencil, in a child's careful capitals: *DEAR MRS ROONEY. DAD READS YOUR LETTERS TO ME. IS IT TRUE ABOUT THE MERMAID? JUNE (10)*`],
 o:[[`Write June a letter of her own`,`c6`,{line:`Dear June: it's true. Don't tell your father I said so.`,keep:"juneLetter",f:["june"],send:1}],
   [`Press a sea pink for June`,`c6`,{keep:"juneFlower",f:["june"],send:1}],
   [`Leave June's question for her father to answer`,`c6`,{send:1}]]},

c6:{t:`The Hard Year`,year:2003,bottles:240,p:s=>[
 `You're fifty-seven. The light was automated in '98, and you aren't the keeper any more, though you still climb the hundred and twelve steps most evenings out of habit.`,
 `Fergal died in January, quickly, in his chair by the stove. ${s.f.open?"Near the end he said, \"Write to your Canadian. He'll want to know.\"":"He never asked about the bottles again."}`,
 teo(`Thrown from the wharf at Cape Sable · 2001`,`Annie died in the spring. Forty years I've been writing to you and I don't know how to write this. June is with me. The house is very quiet. I keep getting two cups down.`),
 `It's midwinter${s.f.promise?", your night for bottles":""}. You sit at the kitchen table with the pen, and nothing comes for a long time.`],
 o:[[`Write him the truest letter you've ever written`,`c6b`,{line:`Teo, Fergal's gone too. I keep getting two cups down as well. I have loved two people in my life, and one of them was at the bottom of a bottle for forty years, and I'm not sorry for either.`,c:1,f:["grief"]}],
   [`Write about the weather and the sheep`,`c6b`,{line:`It's been a wet winter. The sheep are well. I'm sorry about Annie.`,f:["weather"]}],
   [`Don't write this year`,`c6b`,{f:["skipped"]},`Leave the pen`]]},

c6b:{t:`The Last Thing in the Bottle`,year:2003,p:s=>[
 s.f.skipped?`You don't write. Midwinter passes. Then midsummer. It gets harder to begin again, the longer you leave it, and you leave it.`:`There's room for one more thing in the bottle.`],
 o:s=>s.f.skipped?[[`Leave it another year`,`c7`],[`Tell yourself you'll write when you're ready`,`c7`],[`Put the pen in the drawer`,`c7`]]:
  [[`A photograph of yourself, fifty-seven and not scowling`,`c7`,{keep:"photo60",send:1}],
   s.f.toldWhy||s.f.silentNo?[`The ticket for the Empress, thirty-four years late`,`c7`,{keep:s.f.toldWhy?"ticketLate":"light",send:1}]:[`A drawing of the light`,`c7`,{keep:"light",send:1}],
   [`A sea pink, the last of the season`,`c7`,{keep:"seapink",send:1}]]},

c7:{t:`The Two Hundred and Ninety-Ninth`,year:2016,bottles:299,p:s=>{
 if(s.f.skipped) return [`You're seventy. One June morning there's a brown bottle on the shingle, the first in thirteen years.`,
  june(`Thrown from the wharf at Cape Sable · 2015`,`Mrs. Rooney. You don't know me except as a ten-year-old with a question about a mermaid. My father died in March. He threw a bottle every midsummer and midwinter for thirteen years after your letters stopped. He never once said you'd stopped writing. He said the sea was slow. I'm throwing this one for him.`)];
 return [`You're seventy. There have been two hundred and ninety-eight bottles between you, as near as either of you can count. A hundred and forty-odd of yours reached Cape Sable. You have a hundred and nineteen of his, in four biscuit tins.`,
  `The two hundred and ninety-ninth comes in on the shingle in June, in brown glass.`,
  june(`Thrown from the wharf at Cape Sable · 2015`,`Mrs. Rooney, Nell, Dad says to call you Nell. He's in the hospital in Yarmouth. He's all right, mostly. He wants me to tell you he has every one of your bottles on shelves in the kitchen, and that the three hundredth one shouldn't go by sea. He says you'll know what that means. There's a ferry, a train, a plane and me. I'll be at Halifax.`)];},
 o:s=>s.f.skipped?[[`Throw a bottle anyway, for him`,`E5`],[`Climb the light, and sit there till dark`,`E5`],[`Write to June`,`E5`]]:
  [[`Go. Carry the three hundredth bottle yourself`,(s.c>=6&&s.f.open&&s.f.grief&&s.f.promise&&(!s.f.hidFergal||s.f.apologised))?`E1`:`go`,{},`Ferry, train, plane`],
   [`Throw the three hundredth from the cliff, the way it's always been`,`E6`],
   [`Write to June, and ask her to read it to him`,`E6`]]},

go:{t:`Halifax`,year:2016,p:s=>[
 `You go. Ferry, train, a plane, a long white sky, and June at Halifax, forty years old and tall, holding a cardboard sign that says MERMAID.`,
 `But at the hospital in Yarmouth, Teo is polite and tired and careful with you, the way people are careful with a stranger who knows too much about them. ${s.f.hidFergal&&!s.f.apologised?"There's a newspaper cutting from 1987 in the drawer by his bed.":!s.f.promise?"You were never sure, all those years, whether you'd write back. Neither was he.":!s.f.open?"You never did tell Fergal. Some part of you has always been half in a bottle.":"Something in the letters was always a little held back, and it's still held back now."}`,
 `You stay a week. It's lovely. It's not the same.`],
 o:[[`Go home, and keep writing`,`E6`],[`Leave him the bottle and go home`,`E6`],[`Promise to come back next summer`,`E6`]]},

E1:{end:true,best:true,t:`The Three Hundredth Bottle`,p:s=>[
 `You go. Ferry, train, a plane, a long white sky, and June at Halifax holding a cardboard sign that says MERMAID.`,
 `He isn't in the hospital. He's discharged himself, against advice, and he's waiting at the end of the government wharf at Cape Sable in a coat too big for him now, exactly where he threw the first one fifty-five years ago.`,
 `You don't say anything for a long time. Then you take the three hundredth bottle out of your bag and put it in his hands. Green glass, corked, sealed with candle wax. Inside is one line.`,
 `<span class="letter"><span class="hd">The three hundredth bottle · delivered by hand</span><span style="font-family:var(--nell);font-size:1.5rem">Dear Teo. I came.</span></span>`,
 `${s.f.seapink?"He's brought something for you too: a Bible, falling apart, and between Ruth and Samuel, very flat and very brown, a sea pink. ":""}His kitchen has shelves on three walls, and on them, in rows, every bottle that ever reached him, green glass catching the light off the water.`,
 `You stay for the summer. Then for the winter. June says you're both fools. She isn't wrong.`]},

E2:{end:true,t:`Cape Sable`,p:[
 `You pack one bag. Your father, coughing, puts the money for the mainland train in your hand himself and won't hear a word.`,
 `On the 4th of May you sail from Liverpool on the Empress of Canada, and eight days later he's on the pier at Halifax, exactly as he said: thin, freckled, terrified, holding a sea-glass bottle like a bunch of flowers.`,
 `You marry that autumn. You have forty-seven years. It's a good life, a real one, full of boats and children and arguments about the dishes.`,
 `But the light on Inishcorran is dark for a month before the Commissioners send a man, and your father goes to the mainland to die among strangers. And you never write another letter, because there's nobody to write to. He's in the next room.`,
 `*Some stories end when they stop being letters. The truest one lasts for three hundred bottles.*`]},

E3:{end:true,t:`Message Unsent`,p:s=>[
 `You throw one last bottle off the west cliff and climb back up without watching where it goes.`,
 `For a few years more, his bottles keep coming, one or two a year, in brown glass. You don't open them. You put them in the tin with the others, corks still in, and the tin in the press under the stairs.`,
 `When you're very old, a niece clearing the house finds them: thirty-one unopened bottles from Nova Scotia. She asks what they are. You tell her it was a long time ago and you can't remember, which is the first lie you've told about him in fifty years.`,
 `*The letters only last as long as somebody keeps writing. Tell the truth, and keep going.*`]},

E4:{end:true,t:`Return to Sender`,p:[
 `Two years later a brown bottle comes in on the shingle. Inside it is your own letter, unopened, with one line written across the outside in his hand:`,
 `<span class="letter teo"><span class="hd">Returned · 1990</span>It was important to me.<span class="sg">T.</span></span>`,
 `There are no more bottles after that. Every midsummer and midwinter you throw one anyway, for twenty-six years, and none of them comes back.`,
 `*You hid Fergal, then called it unimportant. The truest ending needs the truth, even late, even when it costs you.*`]},

E5:{end:true,t:`Washed Up`,p:[
 `You throw a bottle off the west cliff that midsummer, the first in thirteen years. Inside it you've written the letter you should have written in 2003, every word of it.`,
 `It goes north, probably, to Norway, or nowhere.`,
 `June writes back, once, kindly. She's put her father's bottles, all of yours that reached him, in a glass case at the Cape Sable museum, with a card that says: *Correspondence with a lighthouse keeper, Inishcorran, Ireland, 1962–2003.*`,
 `*The hard year is the one that matters most. He kept the promise. The truest ending needs you to keep it too.*`]},

E6:{end:true,t:`Across the Water`,p:s=>[
 `${s.seen.go?"You go home to Inishcorran at the end of the week, and the next midsummer you throw a bottle from the cliff, as always.":"You throw the three hundredth bottle from the west cliff at midsummer, as you always have, and watch it go."} The current takes it north and west.`,
 `Two years later June writes: it reached him. He read it on the wharf, she says, four times, and didn't tell her what was in it.`,
 `You never do meet${s.seen.go?" again":""}. You are, for fifty-odd years, the dearest friends either of you ever had, and the Atlantic never once gets in the way.`,
 `*A warm ending, and a true one. The truest asks for more: a promise kept to the sea, the whole truth told to everyone, and the hardest letter written in the hardest year.*`]}
};

/* ---------- engine ---------- */
const SAVE_KEY="tac-three-hundred-bottles-daily-door-v1";
let state,history=[];
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return d&&d.state&&S[d.state.scene]?d:null}catch(e){return null}}
const fresh=()=>({scene:"c1",f:{},seen:{c1:1},n:0,c:0,year:1962,bottles:1,draft:[],sent:false,keep:[],told:[],newLine:false});
const val=(x,s)=>typeof x==="function"?x(s):x;
function loadE(){try{return JSON.parse(localStorage.getItem("bottles-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("bottles-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  const [,to,e]=opt; const x=e||{};
  state.newLine=false;
  if(state.sent){state.draft=[];state.sent=false}
  if(x.line){state.draft.push(x.line);state.newLine=true;if(x.c)state.told.push(x.line)}
  if(x.c) state.c+=x.c;
  (x.f||[]).forEach(k=>state.f[k]=1);
  if(x.keep&&!state.keep.includes(x.keep)) state.keep.push(x.keep);
  if(x.send) state.sent=true;
  const sc=S[to];
  if(sc.year&&sc.year!==state.year){state.year=sc.year; if(!state.sent) state.draft=[];}
  if(sc.bottles) state.bottles=sc.bottles;
  if(to==="E1") state.bottles=300;
  state.scene=to; state.n++; state.seen[to]=1;
  if(sc.end) saveE(to);
  render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());state.newLine=false;persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).map(t=>/^<span class="letter/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span>${sc.end?"The last page":"Inishcorran, "+state.year}</span><span>${state.bottles} of 300</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(!sc.end&&(state.draft.length||sc.o)){
    const L=state.draft;
    html+=`<div class="draft${state.sent?" sent":""}"><div class="hd"><span>Your letter${state.sent?"":", unsent"}</span><span>${L.length} ${L.length===1?"line":"lines"}</span></div>${L.length?L.map((l,i)=>`<p class="ln${i===L.length-1&&state.newLine?" new":""}">${smart(l)}</p>`).join(""):`<p class="empty">Nothing written yet.</p>`}</div>`;
  }
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"An ending"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="endnote">${state.bottles} bottles · ${state.told.length} true things told · ${state.keep.length} keepsakes in the tin.${sc.best?"":" The truest ending: keep your promise to the sea, tell everyone the whole truth, and write the hardest letter in the hardest year."}</p>
     <button class="begin" id="again">Find the first bottle again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>{const e=o[2]||{};
      return `<li><button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${e.line?`<span class="w">${smart(e.line)}</span><span class="tag">${smart(o[0])}${o[3]?" · "+smart(o[3]):""}</span>`:`${smart(o[0])}${o[3]?`<span class="tag">${smart(o[3])}</span>`:""}`}</span></button></li>`}).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".wrap");if(window.scrollY>top.offsetTop)window.scrollTo({top:top.offsetTop-10,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const s=state, b=s.bottles, ended=S[s.scene].end;
  const stop=["E2","E3","E4"].includes(s.scene);
  document.getElementById("shelf").innerHTML=[...Array(300)].map((_,i)=>`<i class="${i<b?(i%2?"t":"n"):""}${i===b-1&&!stop?" last":""}"></i>`).join("");
  document.getElementById("shelfSub").textContent=`${b} of 300 bottles thrown between you`;
  document.getElementById("tin").innerHTML=s.keep.length?s.keep.map(k=>`<li><span>${smart(KEEPS[k][0])}</span><span>${KEEPS[k][1]}</span></li>`).join(""):`<li><span style="font-style:italic;color:var(--muted)">Empty, so far</span><span></span></li>`;
  document.getElementById("told").innerHTML=s.told.length?s.told.slice(-6).map(t=>`<li>${smart(t.length>110?t.slice(0,107)+"…":t)}</li>`).join(""):`<li class="none">Nothing yet.</li>`;
  const age=y=>[y-1946,y-1945];const [na,ta]=age(s.year);
  document.getElementById("yearbar").innerHTML=`<span>Teo, ${ta}</span><span><b>${ended&&s.scene==="E1"?2016:s.year}</b></span><span>Nell, ${na}</span>`;
  drawChart();
}
function drawChart(){
  const s=state, sc=s.scene, chapters=["c1","c2","c3","c4","c5","c6","c7"].filter(k=>s.seen[k]).length;
  const W=600,H=170;
  let g=`<rect width="${W}" height="${H}" fill="var(--sea-soft)"/>`;
  for(let i=0;i<6;i++) g+=`<path d="M60 ${30+i*24} Q300 ${20+i*24} 540 ${34+i*24}" stroke="var(--sea)" stroke-width=".6" fill="none" opacity=".35"/>`;
  g+=`<path d="M0 0 L54 0 Q70 40 46 70 Q72 110 50 ${H} L0 ${H} Z" fill="var(--line)"/>`;
  g+=`<path d="M${W} 0 L${W-46} 0 Q${W-64} 50 ${W-40} 84 Q${W-70} 120 ${W-52} ${H} L${W} ${H} Z" fill="var(--line)"/>`;
  g+=`<circle cx="${W-62}" cy="84" r="4" fill="var(--amber)"/><path d="M${W-62} 84 l-40 -14 M${W-62} 84 l-40 14" stroke="var(--amber)" stroke-width="1" opacity="${sc==="E2"?0:.5}"/>`;
  g+=`<text x="12" y="${H-10}" style="font-size:12px;font-style:italic;fill:var(--muted)">Cape Sable</text><text x="${W-12}" y="${H-10}" text-anchor="end" style="font-size:12px;font-style:italic;fill:var(--muted)">Inishcorran</text>`;
  g+=`<text x="${W/2}" y="${H-10}" text-anchor="middle" style="font-size:11px;letter-spacing:.2em;fill:var(--muted)">THE NORTH ATLANTIC</text>`;
  const bottle=(x,y,c,r)=>`<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-8" y="-3.5" width="13" height="7" rx="3" fill="${c}"/><rect x="5" y="-1.6" width="5" height="3.2" fill="${c}"/><rect x="9" y="-1.8" width="2.4" height="3.6" fill="var(--amber)" opacity=".6"/></g>`;
  for(let i=0;i<chapters;i++){
    const y=34+((i*37)%96), east=i%2===0;
    g+=`<path d="M${east?72:W-72} ${y} Q${W/2} ${y+(east?-18:18)} ${east?W-72:72} ${y+8}" stroke="${east?"var(--amber)":"var(--glass)"}" stroke-width="1.2" stroke-dasharray="3 5" fill="none" opacity=".75"/>`;
    const t=i===chapters-1?.5:.92, x=east?72+(W-144)*t:W-72-(W-144)*t;
    g+=bottle(x,y+(i===chapters-1?(east?-9:9):6),east?"var(--amber)":"var(--glass)",(i*23)%40-20);
  }
  if(sc==="E1"){g+=`<circle cx="62" cy="70" r="16" fill="var(--rose)" opacity=".18"/>`+bottle(78,70,"var(--glass)",0)}
  document.getElementById("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Drift chart of bottles crossing the North Atlantic between Cape Sable and Inishcorran">${g}</svg>`;
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
document.querySelectorAll(".sidebar-section h3").forEach(h=>{h.setAttribute("role","button");h.setAttribute("tabindex","0");h.setAttribute("aria-expanded","true");const toggle=()=>{const sec=h.closest(".sidebar-section");sec.classList.toggle("collapsed");h.setAttribute("aria-expanded",String(!sec.classList.contains("collapsed")))};h.addEventListener("click",toggle);h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}})});
function start(d){const saved=d&&d.state?d:restore();state=saved&&saved.state&&S[saved.state.scene]?saved.state:fresh();history=saved&&Array.isArray(saved.history)?saved.history:[];render(false)}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>

</body></html>
