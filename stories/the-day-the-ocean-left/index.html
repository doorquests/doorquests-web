<script>
const LOG=[
 ["legend","0","Old Ezra's saying: 'The sea goes to drink at dawn, and comes home at the next dawn, thirsty.'"],
 ["bell","8","Ravenser church bell, 1362: 'Ye sea went forth at break of day, and came again at break of the next.'"],
 ["spiral","25","Doggerland, 8,000 years old: a carved stone with spirals, and children's footprints walking out to sea."],
 ["fuse","15","A radio valve and fuse, given by the soldiers you helped."],
 ["kit","35","Kit, alive on the Meridian. Ankle broken."],
 ["hum","35","Kit's readings: the pillars' hum is falling. At zero, at dawn, they let the sea go."],
 ["called","35","Warning sent to the shore."]
];
const ENDINGS={E1:"The Third Wave",E2:"The Long Walk Home",E3:"High Water",E4:"Turned Back",E5:"The Land Rush",E6:"Beyond the Wall"};
const find=(h,t)=>`<span class="find"><span class="h">${h}</span>${t}</span>`;
const radio=t=>`<span class="radio">${t}</span>`;
const RET=1800;

const S={
start:{t:`Low Tide`,km:0,cost:0,p:[
 `At 04:12 this morning, the tide went out at Saltby and kept going.`,
 `By dawn the North Sea had gone. From the top of the cliff path you can see the seabed stretching east like a desert: ridged sand, stranded boats lying on their sides, rocks furred with weed, glittering pools, and miles further out, things that were never meant to be seen.`,
 `And at the very edge of sight, where the horizon should be, a line of light. A wall. The sea is standing up out there, sixty kilometres away, like a cliff of glass.`,
 `You are Rhona Gale, mechanic at the Saltby lifeboat station. Your sister Kit was out on the research ship *Meridian*, thirty-five kilometres offshore on the Dogger Bank. Her radio went silent at 04:13.`,
 `The coastguard says nobody goes out. You've already filled your pack: five litres of water, a torch, a toolkit, and a flask of tea.`],
 o:[[`Go down the slipway and start walking`,`leg1`],[`Ask old Ezra on the harbour wall what he makes of it`,`ezra`],[`Check with the coastguard first`,`coast`]]},

ezra:{t:`Old Ezra`,km:0,set:[`legend`],p:[
 `Ezra Pike has fished out of Saltby for sixty years and is sitting on the harbour wall in his best cap as if he's been expecting this.`,
 `"My gran used to say it," he says. "Her gran told her. *The sea goes to drink at dawn, and comes home at the next dawn, thirsty.*" He spits over the wall, onto what used to be water. "Thought it was a story for children. Kept us off the rocks."`,
 `"The next dawn. You mean tomorrow?"`,
 `"I mean get your sister and get home before the sun comes up, lass. And don't stop for treasure."`],
 o:[[`Go down the slipway and start walking`,`leg1`],[`Check with the coastguard`,`coast`],[`Ask him what else his gran said`,`ezra2`]]},

ezra2:{t:`What Gran Said`,km:0,p:[
 `"Only that there's a town out there. Ravenser. Drowned in a storm in the old days, church and all." He squints east. "And past that, the old country, where folk walked before there was a sea. She said the sea leaves to let us see what we've forgotten."`,
 `He pats your arm. "Thirsty, mind. It comes home thirsty."`],
 o:[[`Go down the slipway`,`leg1`],[`Check with the coastguard`,`coast`],[`Thank him and go`,`leg1`]]},

coast:{t:`The Coastguard`,km:0,p:[
 `The coastguard station is chaos: phones, maps, a television showing satellite pictures of the whole North Sea floor laid bare, and of the Channel, and the Baltic.`,
 `The duty officer recognises you. "Don't, Rhona. The Army's putting a cordon across at fifteen kilometres. And there's something out at the Dogger Bank. Satellites show a ring of... structures. Two hundred metres tall. They weren't on any survey."`,
 `He lowers his voice. "The *Meridian* was right next to them."`,
 `On the television, a man in a hard hat is already talking about "the greatest land opportunity in history".`],
 o:[[`Go anyway`,`leg1`],[`Ask old Ezra on the harbour wall`,`ezra`],[`Take a spare litre of water from the station`,`coastwater`]]},

coastwater:{t:`A Spare Litre`,km:0,water:1,p:[
 `The duty officer watches you take a litre bottle from the station's emergency crate and says nothing at all. Then he hands you a second torch battery.`,
 `"Bring her home," he says.`],
 o:[[`Go down the slipway`,`leg1`],[`Ask old Ezra first`,`ezra`],[`Go`,`leg1`]]},

leg1:{t:`The Wrecks`,km:2,cost:60,water:-0.5,p:[
 `The slipway ends in sand that's still wet and gives under your boots. Then it firms up, ridged like the roof of a mouth.`,
 `Two kilometres out, you're walking among wrecks: the trawler *Good Intent* that went down in '87, lying on her side like a sleeping dog; a rusted steamship nobody remembers; a crab boat from last week, still with its pots aboard. The smell is enormous.`,
 `In the pools between the rocks, fish are flapping in water that's getting shallower by the minute. In one deep pool, a grey seal pup is crying for a mother who isn't there.`,
 `And sitting on the hull of the crab boat, a boy of ten with a sheepdog, scanning the seabed through binoculars.`],
 o:[[`Pour a litre into the seal pup's pool`,`seal`],[`Talk to the boy`,`boy`],[`Keep walking east`,`leg2`]]},

seal:{t:`The Pup`,km:2,water:-1,set:[`sealed`],p:[
 `You kneel and pour a whole litre into the seal pup's pool. It's not much. It's enough to cover its back.`,
 `The pup stops crying and looks at you with black, wet eyes. You know it's a small thing. You do it anyway.`,
 `The boy on the crab boat has been watching. He climbs down.`],
 o:[[`Talk to the boy`,`boy`],[`Keep walking east`,`leg2`],[`Leave the pup a little shade, then walk on`,`leg2`]]},

boy:{t:`Ollie`,km:2,p:[
 `His name is Ollie, he's ten, and the dog is Pilot. His dad's boat, the *Bright Star*, was out on the Dogger last night with the *Meridian*.`,
 `"I'm going to find him," he says, with the terrible certainty of ten-year-olds. He has a backpack with two cartons of juice and a packet of biscuits.`,
 `You know exactly how he feels. You also know that a boy and a dog will slow you down, and drink your water, and that the sea is coming back.`],
 o:[[`Take him with you`,`leg2`,"ollie"],[`Send him back to shore`,`leg2`,"sentback"],[`Walk him to the coastguard yourself, then come back`,`backtrack`]]},

backtrack:{t:`Back to Shore`,km:0,cost:120,set:[`safeollie`],p:[
 `You walk Ollie back to the slipway and hand him to the coastguard officer, who promises to find his mum. It costs you two hours.`,
 `"Find my dad," Ollie says, as you turn back east. "Please."`],
 o:[[`Walk east again, faster`,`leg2`],[`Walk east`,`leg2`],[`Go`,`leg2`]]},

leg2:{t:`Ravenser`,km:8,cost:120,water:-1,p:s=>[
 s.f.ollie?`Ollie keeps pace better than you'd feared. Pilot ranges ahead, barking at gulls.`:``,
 `At eight kilometres the seabed rises into a low island of mud and stone, and on it, impossibly, there are streets.`,
 `Cobbles. The stumps of walls. A market cross, toppled. A church with its tower broken off at the height of a man, its font full of crabs. This is Ravenser, the town that drowned in the great storms of the 1360s, and nobody has walked these streets in six hundred years.`,
 `Half-buried in the silt by the church door is a bronze bell, green as a beetle.`],
 o:[[`Scrape the silt off the bell and read it`,`bell`],[`Search the church for anything useful`,`church`],[`Keep walking. Don't stop for treasure`,`leg3`]]},

bell:{t:`The Bell`,km:8,cost:30,set:[`bell`],p:[
 `You scrape the silt away with your knife. Round the lip of the bell, in old letters, is an inscription.`,
 find(`Ravenser church bell, cast 1362`,`Ye sea went forth at break of day, and came again at break of ye next. God have mercy on them that walked out after.`),
 `They saw it too. Six hundred years ago, the sea left, and the people of Ravenser walked out on the bare floor, and at the next dawn it came back.`,
 `Dawn tomorrow. You have until dawn tomorrow.`],
 o:[[`Keep walking, fast`,`leg3`],[`Search the church quickly`,`church`],[`Ring the bell once, for them, then go`,`leg3`]]},

church:{t:`The Church`,km:8,cost:30,p:[
 `Inside the broken church there's nothing but silt, crabs, and a stone coffin lid carved with a ship. A couple of men in high-vis jackets are already here with crowbars, prising at it.`,
 `"Finders keepers," one says, cheerfully. "It's nobody's land now, is it?"`,
 `You leave them to it.`],
 o:[[`Read the bell on the way out`,`bell`],[`Keep walking`,`leg3`],[`Warn them about the tide`,`leg3`]]},

leg3:{t:`The Cordon`,km:15,cost:120,water:-1,p:s=>[
 `At fifteen kilometres there's a line of Army trucks across the seabed, with soldiers and tape and a sign that says AUTHORISED PERSONNEL ONLY in letters a metre high.`,
 `One of the trucks is stuck. Its front axle has gone down into a soft patch, and a young lieutenant is shouting at a driver who's making it worse.`,
 `${s.f.ollie?"Ollie hides behind you. Pilot does not. ":""}The lieutenant, Imogen Pryce, sees you. "No further. Orders."`,
 `You're a lifeboat mechanic. You've dug more vehicles out of sand than she's had hot dinners.`],
 o:[[`Offer to get her truck out`,`fix`],[`Wait for a gap in the line and slip through`,`sneak`],[`Turn back and leave it to the Army`,`E5`]]},

fix:{t:`Dug Out`,km:15,cost:60,water:2,set:[`fuse`,`pryce`],p:[
 `It takes an hour, two sand ladders, a lot of digging, and teaching the driver what a low gear is for. When the truck rolls free, the soldiers cheer.`,
 `Pryce looks at you differently now. "My sister's a vet in Whitby," she says, apropos of nothing. "I'd walk out too." She hands you two litres of water and, from the truck's radio kit, a spare valve and a fuse. "If you find anything with a radio, call me. Channel 16. And for God's sake be back by dawn. The Met Office says the sea's 'stable'. I don't trust it."`,
 `She lifts the tape for you.`],
 o:[[`Walk on into the old country`,`leg4`],[`Tell her about the next dawn`,`leg4`],[`Thank her and go`,`leg4`]]},

sneak:{t:`Through the Line`,km:15,cost:30,p:[
 `You wait behind a wreck until the lieutenant turns away to shout at the driver again, and walk quickly through a gap between two trucks with your head down.`,
 `Nobody stops you. Nobody notices you. Nobody will know where you've gone, either.`],
 o:[[`Walk on into the old country`,`leg4`],[`Keep walking`,`leg4`],[`Go`,`leg4`]]},

leg4:{t:`The Old Country`,km:25,cost:180,water:-1,p:s=>[
 `Beyond the cordon the seabed changes. It isn't sand any more. It's peat: black, springy, full of the roots of trees that drowned eight thousand years ago. There are stumps of an ancient forest, lying in rows. You're walking across Doggerland, the country that lay between Britain and Europe before the sea came in.`,
 s.f.ollie?`Ollie is tired now and quiet. You've given him some of your water. Pilot pads beside him.`:`It's very quiet. Only the wind, and the clicking of drying weed.`,
 `In a hollow by an old riverbed you see a ring of flat stones round a hearth, and among them a standing stone the height of your hip, carved all over.`],
 o:[[`Look at the carved stone`,`spiral`],[`Keep walking. The structures are close now`,`leg5`],[`Rest ten minutes`,`leg5`]]},

spiral:{t:`The Carved Stone`,km:25,cost:30,set:[`spiral`],p:[
 `The stone is carved with spirals, dozens of them, and between them, unmistakably, a ring of tall upright shapes. The same ring the satellites saw.`,
 `In the hardened clay beside the hearth, there are footprints. Small ones. Children's, and an adult's, eight thousand years old, all walking east, towards the structures.`,
 find(`Doggerland hearth, c. 6000 BCE`,`Spirals and a ring of pillars, carved on stone. Footprints in the clay, walking out. None walking back.`),
 `They saw this too. Every time the sea leaves, people walk out to look.`],
 o:[[`Walk on to the pillars`,`leg5`],[`Walk on, faster`,`leg5`],[`Go`,`leg5`]]},

leg5:{t:`The Tideworks`,km:35,cost:180,water:-1,p:s=>[
 `They rise out of the seabed like the fingers of a buried hand: a ring of black glass pillars, twenty of them, each two hundred metres tall, humming a note so low you feel it in your fillings.`,
 `Beyond them, closer now, the wall of the sea stands up out of the horizon, shimmering, impossibly still, the light coming through it green.`,
 `And lying against the base of the nearest pillar, tipped on her side with her mast snapped, is the *Meridian*.${s.f.ollie?" Beside her, a smaller boat: the *Bright Star*. Ollie runs.":""}`],
 o:[[`Run to the Meridian`,`kit`],[`Shout Kit's name`,`kit`],[`Run`,`kit`]]},

kit:{t:`Kit`,km:35,set:[`kit`],p:s=>[
 `Kit is in the *Meridian*'s lab, which is now sideways. She's wedged against a bulkhead with her left ankle swollen purple, surrounded by instruments, and when she sees you her face crumples.`,
 `"Rhona. You *walked*? You absolute idiot." She hugs you so hard it hurts. "Broke my ankle when we grounded. The others went for help at dawn. I stayed with the readings."`,
 s.f.ollie?`Outside, Ollie is shouting. His dad, it turns out, was with the *Meridian*'s crew, walking home for help. "They passed us," you realise. "They'll be at the cordon by now." Ollie sits down on the sand, and Pilot licks his face.`:``,
 `"What readings?"`],
 o:[[`Ask Kit what the pillars are doing`,`hum`],[`Look at the Meridian's radio`,`radiolook`],[`"We're leaving. Now. I'll carry you."`,`finale`]]},

hum:{t:`The Hum`,km:35,cost:30,set:[`hum`],p:s=>[
 `Kit shows you a screen: the pillars' hum, recorded since 04:12. A note, falling, slowly and perfectly steadily, like a breath going out.`,
 `"They're *holding* it," she says. "The sea. Every one of these pillars is pushing against it. And they're running down. I've fitted the curve." She taps the screen. "It hits zero at 06:02 tomorrow. Dawn."`,
 s.f.bell||s.f.legend?`"The next dawn," you say. "The bell at Ravenser said it. Ezra said it."`:`"Dawn," you repeat.`,
 `"And everyone on the seabed," Kit says, "will be standing where the sea wants to be."`,
 `On the shore, by now, there'll be thousands out on the sand.`],
 o:[[`Look at the Meridian's radio`,`radiolook`],[`Go out and touch a pillar`,`pillar`],[`Time to decide`,`finale`]]},

radiolook:{t:`The Radio`,km:35,p:s=>[
 `The *Meridian*'s VHF set took a knock in the grounding. You pull the panel. A valve is cracked and a fuse has blown. It's a ten-minute repair for a lifeboat mechanic.`,
 s.f.fuse?`You have a spare valve and a fuse in your pocket, from Lieutenant Pryce.`:`You don't have the parts. You go through Kit's toolbox twice. Nothing that fits.`],
 o:s=>[ s.f.hum?[`Time to decide`,`finale`]:[`Ask Kit what the pillars are doing`,`hum`],[`Go out and touch a pillar`,`pillar`],[`Time to decide`,`finale`]]},

pillar:{t:`The Pillar`,km:35,p:[
 `You walk out to the nearest pillar and put your palm flat against the black glass.`,
 `It's warm. The hum comes up through your hand into your chest, and for a second you see, not with your eyes: the whole sea, everywhere, all at once, standing patient at the edges of the world. Waiting to come home.`,
 `It doesn't feel angry. It feels like a tide. It always has been.`,
 `When you take your hand away, your palm is wet with seawater.`],
 o:[[`Go back to Kit`,`finale`],[`Look at the radio`,`radiolook`],[`Stay a moment longer, then go`,`finale`]]},

finale:{t:`The Last Light`,km:35,cost:0,p:s=>{
 const a=[`It's ${clockStr(s.clock)}. The sun is going down behind the cliffs of England, thirty-five kilometres away. To the east, the wall of the sea has turned gold.`];
 a.push(s.f.hum?`The sea comes back at 06:02. You have ${Math.max(0,Math.round((RET-s.clock)/60))} hours.`:`You don't know when the sea is coming back. You only know it will.`);
 a.push(`Kit can't walk. Rig a sled from a hatch cover and drag her, and you might make four kilometres an hour.${s.f.ollie?" And there's a ten-year-old boy and a tired dog.":""}`);
 return a;},
 o:s=>{
  const carryTime=Math.round(35/4*60*(s.f.ollie?1.15:1));
  return [ s.f.fuse?[`Fix the Meridian's radio and call the shore`,s.f.hum?`E1`:`E2b`]:[`Try to fix the radio with what's aboard`,`E3`],
   [`Drag Kit home across the seabed on a sled`,s.clock+carryTime<RET?`E2`:`E3`],
   [`Walk towards the wall of the sea`,`E6`]];}},

E1:{end:true,best:true,set:[`called`],t:`The Third Wave`,p:s=>[
 `The valve goes in. The fuse goes in. The set crackles and warms, and you key Channel 16.`,
 radio(`Meridian to Lieutenant Pryce, Meridian to Saltby Coastguard. The sea returns at 06:02 tomorrow. Repeat, 06:02. Clear the seabed. All of it.`),
 `There's a pause. Then Pryce's voice: "Copy, Meridian. I believe you. God knows why." Then, to someone else: "Get me the brigadier. Now."`,
 `All night, on every radio and television in every country around the North Sea, the warning goes out. *Off the seabed by dawn.* The Army turns its trucks around. The men with crowbars come home from Ravenser. The land-rush speculators are booed off the beach.`,
 `At two in the morning a helicopter lands beside the black pillars with Pryce in it. "Room for a sister${s.f.ollie?", a boy and a dog":""}," she says.`,
 `At 06:02, the hum stops. The pillars sigh. And the sea comes home: not as a wave, but as a tide, a long gentle rising all the way to the cliffs, filling Ravenser's streets, and Doggerland's old forest, and the pool where a seal pup${s.f.sealed?" you watered":""} was waiting.`,
 `Nobody who heard the warning is lost. Kit's paper on the pillars wins every prize going. In Saltby, they put a plaque on the harbour wall where Ezra sits: *THE SEA GOES TO DRINK AT DAWN, AND COMES HOME AT THE NEXT DAWN.*`]},

E2b:{end:true,t:`The Long Walk Home`,alias:"E2",p:s=>[
 `The radio comes alive. You call Channel 16. "The sea's coming back," you say. "I don't know when. Tonight. Tomorrow."`,
 `"On what evidence?" says a tired voice at headquarters. You don't have an answer. It's logged as "unconfirmed".`,
 `In the end, you and Kit and${s.f.ollie?" Ollie and Pilot and":""} a borrowed Army quad bike make it to the cliffs at four in the morning. At dawn, the sea comes home. Thousands are still out on the sand.`,
 `*You had the radio, but not the time. Kit's readings would have given the warning its hour.*`]},

E2:{end:true,t:`The Long Walk Home`,p:s=>[
 `You lash a hatch cover into a sled and drag Kit behind you. ${s.f.ollie?"Ollie carries the torch. Pilot leads. ":""}All night across the seabed: through the drowned forest, past the empty cordon, through the streets of Ravenser in the dark.`,
 `At 05:40 you reach the bottom of the slipway at Saltby with your legs shaking. At 06:02, behind you, the sea comes home with a long, rising roar.`,
 `You're safe. Kit's safe. From the cliff you watch the water fill the bay, and the little torches still out on the sand, the treasure-hunters and the land-claimers and the sightseers, start to run.`,
 `Not all of them make it.`,
 `*You saved who you could carry. A working radio and Kit's readings could have warned everyone.*`]},

E3:{end:true,t:`High Water`,p:s=>[
 `It takes too long. ${s.f.fuse?"":"You strip wires from every instrument aboard and none of them will do. "}By the time you know you won't make it, you hear it: a roar from the east like every train in the world arriving at once.`,
 `You get Kit${s.f.ollie?", and Ollie, and Pilot,":""} onto the *Meridian*'s upturned hull, against the base of the black pillar, and hold on.`,
 `The sea comes home. It lifts the *Meridian* off the seabed, spins her once, and floats her upright, groaning, against the pillar. You're afloat. Around you, the whole North Sea is back, black and enormous, with the pillars standing out of it like the masts of a drowned ship.`,
 `A lifeboat from Saltby finds you at noon. Of course it's Saltby's.`,
 `The pillars sink slowly back beneath the water over the next week. On the shore, hundreds who were still out on the sand at dawn are never found.`,
 `*You survived. ${!s.f.fuse?"The soldiers at the cordon had the part you needed, if you'd stopped to help.":"Time ran out on the walk home."}*`]},

E4:{end:true,t:`Turned Back`,p:s=>[
 `Your water runs out at ${s.km} kilometres. Your head is pounding, your mouth is sand, and your legs won't do what you tell them.`,
 `A patrol from the Army cordon finds you sitting on a rock and drives you back to shore${s.f.ollie?" with Ollie and Pilot":""}. You argue the whole way. It doesn't help.`,
 `At dawn the next morning, the sea comes home.`,
 `At ten past six the *Meridian*, lifted off the seabed by the returning tide, drifts upright, and at nine her crew radio in. Kit is aboard, ankle splinted, furious, alive. The sea brought her home.`,
 `*You gave away${s.f.sealed?" a litre to a seal pup and":""} more water than you had. The soldiers at the cordon would have refilled it if you'd helped them.*`]},

E5:{end:true,t:`The Land Rush`,p:[
 `You turn back. The Army will find her, you tell yourself. They have trucks, and helicopters, and orders.`,
 `On the shore that night it's a carnival: floodlights, food vans, men with clipboards selling "seabed claims", families walking out with torches to see Ravenser. The television says the sea is "stable". The Prime Minister says it's "an opportunity".`,
 `At 06:02, the sea comes home.`,
 `Kit is found three days later, alive, on the refloated *Meridian*. Many others are not. The inquiry runs for years. It concludes that nobody could have known.`,
 `You know that isn't quite true. There was an old man on the harbour wall who knew.`]},

E6:{end:true,t:`Beyond the Wall`,p:s=>[
 `You walk east. Past the last pillar. Across the bare seabed towards the wall of the sea, which stands up out of the floor ahead of you, three hundred metres high, perfectly still, lit green from inside like a cathedral window.`,
 `Up close it's not a wall. It's the sea, looking at you. There are fish in it, hanging in the light. A whale, enormous and slow, turns one eye to you.`,
 `You put your hand into it. It's cool. It doesn't fall.`,
 `${s.f.hum?"Kit's voice is on the radio behind you, screaming your name. ":""}You step inside.`,
 `They find the *Meridian* the next morning, refloated, with Kit aboard, alive. They never find you. Kit says, for the rest of her life, that she saw you turn and wave.`,
 `On still nights in Saltby, old men on the harbour wall say there's a woman's voice in the tide, talking to the sea about engines.`]}
};

/* ---------- engine ---------- */
let state,history=[];
const SAVE_KEY="tac-ocean-daily-door-v1";
function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const o=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return o&&o.state&&S[o.state.scene]&&Array.isArray(o.history)?o:{};}catch(e){return {}}}

const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,clock:360,km:0,water:5});
const val=(x,s)=>typeof x==="function"?x(s):x;
function clockStr(m){const d=m>=1440?2:1, mm=m%1440;return `Day ${d} · ${String(Math.floor(mm/60)).padStart(2,"0")}:${String(mm%60).padStart(2,"0")}`}
function loadE(){try{return JSON.parse(localStorage.getItem("oceanleft-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("oceanleft-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  let [,to,flag]=opt;
  if(flag) state.f[flag]=1;
  let sc=S[to]; const first=!state.seen[to];
  if(!sc.end){
    let c=sc.cost==null?15:sc.cost; if(state.f.ollie&&sc.km&&sc.km>state.km) c=Math.round(c*1.15);
    state.clock+=c;
    if(first&&sc.water){let w=sc.water; if(w<0&&state.f.ollie&&sc.km>state.km) w-=0.5; state.water=Math.round((state.water+w)*10)/10}
    if(sc.km!=null) state.km=sc.km;
    if(state.water<=0&&!state.f.kit){to="E4";sc=S.E4}
  }
  state.scene=to; state.n++;
  state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(sc.alias||to);
  render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());saveProgress();render(true)}
function restart(){history=[];state=fresh();saveProgress();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).filter(Boolean).map(t=>/^<span class="(find|radio)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span>${sc.end?"<b>Ending</b>":`<b>${state.km} km out</b>`}</span><span>${clockStr(state.clock)}</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length, c=LOG.filter(x=>state.f[x[0]]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 16px">${c} of 7 log entries · ${state.km} km out · ${Math.max(0,state.water)} litres left.${sc.best?"":" The truest ending needs a working radio and Kit's reading of when the sea returns."}</p>
     <button class="begin" id="again">Walk out again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>{const t=S[o[1]];let tag="";
      if(t&&!t.end&&t.km!=null&&t.km>state.km) tag=`<span class="tag">${t.km-state.km} km east · about ${Math.round((t.cost||0)*(state.f.ollie?1.15:1)/60*10)/10} h · ${Math.abs((t.water||0)+(state.f.ollie?-0.5:0))} L</span>`;
      else if(t&&t.water&&t.water<0) tag=`<span class="tag o">Uses ${-t.water} L of water</span>`;
      else if(t&&t.water>0) tag=`<span class="tag">+${t.water} L of water</span>`;
      return `<li><button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${smart(o[0])}${tag}</span></button></li>`}).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".mast");if(window.scrollY>top.offsetHeight)window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  document.getElementById("clock").textContent=clockStr(state.clock);
  document.getElementById("km").textContent=state.km+" km";
  const known=state.f.hum||state.f.bell||state.f.legend;
  const left=RET-state.clock;
  document.getElementById("ret").textContent=!known?"unknown":state.f.hum?(left>0?`in ${Math.floor(left/60)}h ${String(left%60).padStart(2,"0")}m`:"now"):"next dawn";
  const W=Math.max(0,state.water);
  document.getElementById("water").innerHTML=Array.from({length:7},(_,i)=>`<i style="--f:${Math.max(0,Math.min(1,W-i))*100}%"></i>`).join("");
  document.getElementById("water").setAttribute("aria-label",`${W} litres of water`);
  const c=LOG.filter(x=>state.f[x[0]]).length;
  document.getElementById("lCount").textContent=`${c} of 7 entries`;
  document.getElementById("log").innerHTML=LOG.map(([k,km,t])=>state.f[k]?`<li><span class="km">${km} km</span>${smart(t)}</li>`:`<li class="unk"><span class="km">${km} km</span>Not yet logged</li>`).join("");
  const P=[["Kit Gale",state.f.kit?"Found · ankle broken":"Somewhere at 35 km"],["Ollie & Pilot",state.f.ollie?"Walking with you":state.f.safeollie?"Safe on shore":state.f.sentback?"Sent back":"—"],["Lt. Imogen Pryce",state.f.pryce?"Owes you one":"The cordon"]];
  document.getElementById("party").innerHTML=P.map(([n,s])=>`<li><span>${n}</span><span class="s">${s}</span></li>`).join("");
  drawProfile();
}

/* ---------- bathymetric profile ---------- */
const cv=document.getElementById("prof"), ctx=cv.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let col={};
function readCol(){const cs=getComputedStyle(document.documentElement);["--sand","--sand2","--rock","--sea","--orange","--ink","--muted","--glass","--sky"].forEach(k=>col[k]=cs.getPropertyValue(k).trim())}
function depthAt(x){ // x 0..1 across 0..60 km; returns 0..1 depth
  const km=x*60; let d=Math.min(1,km/14)*0.35 + Math.max(0,(km-14)/40)*0.25;
  if(km>28&&km<40) d-=0.12*Math.sin((km-28)/12*Math.PI); return d+0.03*Math.sin(km*1.7);
}
let raf=0;
function drawProfile(){if(!raf){raf=1;requestAnimationFrame(loop)}else if(reduce) loop(0)}
function loop(t){
  readCol();
  const d=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W*d||cv.height!==H*d){cv.width=W*d;cv.height=H*d}
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);
  const top=H*0.32, span=H*0.58, X=km=>18+km/60*(W-36);
  // sea level line
  ctx.strokeStyle=col["--muted"];ctx.setLineDash([4,5]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(W,top);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=col["--muted"];ctx.font="10px 'Red Hat Mono', monospace";ctx.fillText("OLD SEA LEVEL",X(1.5),top-6);
  // seabed
  ctx.fillStyle=col["--sand"];ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,top-34);ctx.lineTo(X(0),top-34);ctx.lineTo(X(0.3),top);
  for(let i=0;i<=200;i++){const x=i/200;ctx.lineTo(X(x*60),top+depthAt(x)*span)}ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=col["--rock"];ctx.fillRect(0,top-34,X(0),H);
  // features
  const feat=[[2,"WRECKS"],[8,"RAVENSER"],[15,"CORDON"],[25,"DOGGERLAND"],[35,"TIDEWORKS"]];
  ctx.font="9px 'Red Hat Mono', monospace";
  feat.forEach(([km,l])=>{const y=top+depthAt(km/60)*span;ctx.fillStyle=col["--ink"];ctx.fillText(l,X(km)-l.length*2.6,y+16)});
  // pillars
  for(let i=0;i<5;i++){const km=33+i*1.1,y=top+depthAt(km/60)*span;ctx.fillStyle=col["--glass"];ctx.fillRect(X(km)-2,y-H*0.62,4,H*0.62)}
  // wall of sea / returning water
  const known=state.f.hum||state.f.bell||state.f.legend;
  const prog=Math.max(0,Math.min(1,(state.clock-360)/(RET-360)));
  const end=state.scene;
  let wallKm=60-prog*6;
  if(end==="E1"||end==="E2"||end==="E2b"||end==="E3"||end==="E4"||end==="E5") wallKm=-1;
  const shimmer=reduce?0:Math.sin(t/600)*0.06;
  ctx.globalAlpha=.75;ctx.fillStyle=col["--sea"];
  if(wallKm<0){ctx.fillRect(X(0.3),top,W,H)}
  else{ctx.fillRect(X(wallKm),4,W,H);ctx.globalAlpha=.35+shimmer;ctx.fillStyle="#fff";ctx.fillRect(X(wallKm),4,3,H)}
  ctx.globalAlpha=1;
  if(wallKm>=0){ctx.fillStyle=col["--ink"];ctx.font="9px 'Red Hat Mono', monospace";ctx.fillText("THE SEA",X(wallKm)-44,16)}
  // town
  ctx.fillStyle=col["--ink"];ctx.fillText("SALTBY",4,top-40);
  // you
  if(!end.startsWith("E")||end==="E6"){const k=end==="E6"?59:state.km;const y=top+depthAt(k/60)*span-8;
    ctx.fillStyle=col["--orange"];ctx.beginPath();ctx.arc(X(k),y,5,0,6.3);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=col["--orange"];ctx.font="bold 10px 'Red Hat Mono', monospace";ctx.fillText("YOU",X(k)-9,y-10)}
  // km ticks
  ctx.fillStyle=col["--muted"];ctx.font="8px 'Red Hat Mono', monospace";
  for(let k=0;k<=60;k+=10){ctx.fillText(k+" km",X(k)-8,H-4)}
  if(!reduce) requestAnimationFrame(loop);
}
window.addEventListener("resize",()=>drawProfile());

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName||""))return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){state=d&&d.state&&S[d.state.scene]?d.state:fresh();history=d&&Array.isArray(d.history)?d.history:[];render(false)}
const detailsToggle=document.getElementById("detailsToggle");
detailsToggle.addEventListener("click",()=>{const a=document.getElementById("details");const expanded=a.dataset.collapsed==="true";a.dataset.collapsed=expanded?"false":"true";detailsToggle.setAttribute("aria-expanded",String(expanded));detailsToggle.textContent=expanded?"Hide field log and companions":"Show field log and companions";});
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>

</body></html>
