const S={
start:{t:`The Door You Never Noticed`,room:"lobby",cost:0,p:[
 `You've walked down Fennick Street a thousand times. Today, between the dry cleaner and the bookshop that closed in the spring, there's a narrow door painted the green of old bottles. A brass plate beside it reads THE MUSEUM OF ALMOST. OPEN UNTIL SIX. ADMISSION FREE.`,
 `Inside it is tall and very quiet and smells of floor wax. Corridors of glass cases run away in three directions. A guard in a grey uniform sits on a folding chair reading a paperback.`,
 `At the front desk, a small elderly woman with her silver hair in a knot and spectacles on a chain looks up as though she has been expecting you for years.`,
 `"Welcome. I'm Miss Varnum, the curator. Everything here comes from a life that very nearly happened." She slides a card across the desk. "Visitors may borrow one object. Do read the terms."`],
 o:[[`Read the lending terms`,`rules`],[`Sign the guest book`,`guestbook`],[`Walk straight into the galleries`,`near`]]},

rules:{t:`Lending Terms`,room:"lobby",set:[`rules`],p:[
 card(`The Museum of Almost · Lending Terms`,`<ol><li>Each visitor may borrow one object.</li><li>While you carry it, you will know the life it came from.</li><li>In its place you will leave something from your own life that you use every day.</li><li>All objects must be returned by closing.</li><li>Objects not returned by closing are considered exchanged.</li></ol>`),
 `"Exchanged?" you ask.`,
 `"The object becomes yours," says Miss Varnum. "And your life becomes ours." She smiles, not unkindly. "It happens less than you'd think. People are very attached to their own lives, once they've seen the alternatives."`],
 o:[[`Sign the guest book`,`guestbook`],[`Ask whether she has ever borrowed anything`,`office`],[`Go into the galleries`,`near`]]},

 vit(s.borrowed==="letter"?{loan:1,acc:OBJ.letter.acc}:OBJ.letter),
 `The handwriting on the envelope is careful, the way handwriting gets when it has been tried eleven times.`],
 o:s=>[borrowOpt(s,`letter`,`Borrow the letter`),[`Go on to the Room of Other Careers`,`careers`],[`Go and find the Permanent Collection`,`perm`]]},

careers:{t:`Room of Other Careers`,room:"careers",p:s=>[
 `A bright, crowded room, like a junk shop of ambition. An astronaut application with every box filled in. The key to a bakery called Crumb & Co. that never opened. An empty trumpet case, its velvet worn into the shape of a horn that isn't there.`,
 `And in the centre, on its own plinth, a cello small enough for a child.`,
 vit(s.borrowed==="cello"?{loan:1,acc:OBJ.cello.acc}:OBJ.cello)],
 o:s=>[borrowOpt(s,`cello`,`Borrow the cello`),[`Ask the guard about the empty trumpet case`,`perm`],[`Go on to the Long Gallery`,`roads`]]},

roads:{t:`The Long Gallery`,room:"roads",p:s=>[
 `The Long Gallery is exactly what it sounds like: a corridor so long you can't see the end of it, lined with roads not taken. Hiking boots, never worn, for the Camino. A lease for a flat in Montreal, unsigned. A boarding pass for a flight that left without its passenger.`,
 vit(s.borrowed==="ticket"?{loan:1,acc:OBJ.ticket.acc}:OBJ.ticket),
 `Somebody, years ago, nearly got on that train. You can feel it from here.`],
 o:s=>[borrowOpt(s,`ticket`,`Borrow the ticket`),[`Turn the placard over`,`reverse`],[`Go and find the curator's office`,`office`]]},

borrow_cello:{t:`The Cello`,room:"careers",cost:15,p:[
 `Miss Varnum appears at your elbow with a small velvet tray. "Something you use every day, please."`,
 `You put your house key on the tray. She sets it in the case, and the placard quietly rewrites itself.`,
 `Then she hands you the cello. The moment its neck touches your palm, your fingers know where to go.`,
 `You're on a stage in Lisbon. The hall is dark and warm, and the last note of the Elgar is still hanging in the air, and two thousand people are holding their breath. You have never been this good at anything in your life. You've given it everything: every summer, every birthday, every friend who asked if you were free.`,
 `In the applause you look for the third row, where somebody should be. There's never anybody in the third row.`],
 o:[[`Hold on to that feeling and keep exploring`,`perm`],[`Find Miss Varnum`,`office`],[`Sit on the bench for a while`,`hub`]]},

borrow_letter:{t:`The Letter`,room:"unsent",cost:15,p:[
 `Miss Varnum appears at your elbow with a small velvet tray. "Something you use every day, please."`,
 `You put your house key on the tray. She sets it in the case, and the placard quietly rewrites itself. Then she hands you the envelope.`,
 `It's sealed. You don't open it. You don't need to. You already know what it says, because in this life you posted it.`,
 `He rings on the Sunday. His voice is rough. Neither of you mentions the letter, not then and not ever, but he rings the next Sunday too, and the one after, for nine years. You learn his opinions about cricket, which are terrible. At the end there's nothing left unsaid, and it's still the hardest day of your life.`,
 `You stand in the gallery holding a sealed envelope with your eyes shut.`],
 o:[[`Keep exploring, with the letter in your pocket`,`perm`],[`Find Miss Varnum`,`office`],[`Sit on the bench for a while`,`hub`]]},

borrow_ticket:{t:`The Ticket`,room:"roads",cost:15,p:[
 `Miss Varnum appears at your elbow with a small velvet tray. "Something you use every day, please."`,
 `You put your house key on the tray. She sets it in the case, and the placard quietly rewrites itself. Then she hands you the ticket.`,
 `Blue tiles. A tram grinding up a hill. The smell of your own bakery at five in the morning, and a language that has slowly become yours, so that you dream in it. You're brave there. Everyone says so.`,
 `The calls home get shorter every year. Somebody's wedding, missed. Somebody's funeral, flown in late for. You send postcards. They're beautiful postcards.`,
 `The ticket is warm in your hand, like it has just been printed.`],
 o:[[`Keep exploring, ticket in hand`,`perm`],[`Turn the placard over`,`reverse`],[`Find Miss Varnum`,`office`]]},

perm:{t:`The Permanent Collection`,room:"perm",set:[`thomas`],p:[
 `One room off the main hall has a single large case and a single bench. The placard is longer than the others.`,
 vit({d:"drawing",t:"The Life of Thomas Reyes",date:"Actual, 1931 to 1961. Exchanged 14 June 1961, 6:04 p.m.",b:"Wristwatch, stopped. Wedding photograph. A child's crayon drawing, labeled DADDY. A lunch tin, still packed.",acc:"Acc. no. P-1961-0614 · Permanent collection"}),
 `Ade has come in behind you. "He borrowed a trumpet," he says. "Jazz. New Orleans. He meant to come back. He was four minutes late."`,
 `In the drawing, a stick man holds a horn the shape of the empty case next door. His daughter coloured his hat in very carefully, staying inside the lines.`],
 o:[[`Ask Ade what happened to Thomas`,`ade`],[`Go and find Miss Varnum`,`office`],[`Go back out to the galleries`,`hub`]]},

ade:{t:`Four Minutes`,room:"perm",p:[
 `"He's out there somewhere playing that trumpet, I suppose," Ade says. "Happy enough. He doesn't remember this life. That's the mercy of it."`,
 `He looks at the drawing. "But somebody does. His daughter came in once, forty-odd years later. Stood right where you're standing for an hour. Didn't borrow anything. Didn't say a word. Just signed the book on the way out: *I'd have liked to hear him play.*"`,
 `He goes back to his chair and opens his paperback, but he doesn't turn a page.`],
 o:[[`Go and find Miss Varnum`,`office`],[`Turn one of the placards over`,`reverse`],[`Go back out to the galleries`,`hub`]]},

office:{t:`The Curator's Office`,room:"office",set:[`ilse`],p:s=>[
 `Miss Varnum's office is small and lined floor to ceiling with card catalogues. There's a kettle, two cups, and a desk with one drawer locked.`,
 s.f.guestbook||s.f.thomas?`"You've found Mr. Reyes," she says, before you can ask. "We were here the same June, he and I."`:`"Have I ever borrowed anything?" She pours two cups of tea without asking. "Once."`,
 `"Nineteen sixty-one. A red scarf: the life where I went to Paris with a painter instead of staying home to nurse my mother. I came back with four minutes to spare." She unlocks the drawer, and there it is, folded small, red as a postbox. "I was so frightened of what I'd nearly done that I never left again. I've been the curator ever since."`,
 `She closes the drawer and takes a small brass key from her chain. "There's a room here that belongs to you. There's one for every visitor. Most never ask."`],
 o:[[`Take the key to your room`,`zero`],[`Ask whether she regrets coming back`,`regret`],[`Go back out to the galleries`,`hub`]]},

regret:{t:`On Tuesdays`,room:"office",p:[
 `"Every day, for a year," Miss Varnum says. "Then every month. Now on Tuesdays, mostly." She laughs at herself.`,
 `"Do you know what nobody tells you? The other life doesn't miss you. It doesn't know you exist. Only this one does." She taps the desk. "That's what makes it yours."`,
 `She sips her tea. "Turn one of the placards over sometime. Nobody ever does."`],
 o:[[`Take the key to your room`,`zero`],[`Go and turn a placard over`,`reverse`],[`Go back out to the galleries`,`hub`]]},

reverse:{t:`The Back of the Placard`,room:"roads",set:[`reverse`],p:[
 `You lift a placard from its little brass hook and turn it over. On the back, in small grey type:`,
 card(`Conservation note`,`This object is on reciprocal loan from the Museum of Almost on the other side. Every almost in this building is somebody's actual. In return, we have lent them one of yours.`),
 `You look down the Long Gallery at all those roads not taken. Somewhere, every one of them was taken. Somebody lives there. Somebody is looking back.`],
 o:s=>[ s.f.ilse?[`Go to your room with Miss Varnum's key`,`zero`]:[`Ask Miss Varnum what this means`,`office`],[`Go back to the Hall of Near Misses`,`near`],[`Wander for a while`,`hub`]]},

zero:{t:`Room Zero`,room:"zero",set:[`wing`],p:[
 `The key fits a narrow door you hadn't noticed at the end of the Hall of Near Misses. Behind it is a room exactly the size of your kitchen. The cases are small. The placards say *you*.`,
 vit(OBJ.brush),
 `There's a phone with a number on the screen that you didn't call. A coat for a city you didn't move to. A card with a sentence on it you nearly said, once, and you know exactly when. You don't read it twice.`,
 `One plinth is empty. Its placard says only: *Reserved.*`,
 `In the far wall there's a tall window with a velvet curtain drawn across it. A small sign: *The View from the Other Side.*`],
 o:s=>[[`Draw back the curtain`,`mirror`], s.borrowed?[`Slip the paintbrush under your coat as well`,`E6`]:[`Borrow the paintbrush`,`borrow_brush`],[`Close the door quietly and go`,`hub`]]},

borrow_brush:{t:`The Paintbrush`,room:"zero",cost:15,p:[
 `Miss Varnum is in the doorway with her velvet tray. She doesn't say anything. You give her your house key.`,
 `The brush is lighter than you remember. In the other life there's a room with north light and forty canvases leaning against the walls, and your hands are stained blue to the wrist. The paintings are good. Some of them are very good.`,
 `You've painted the same face over and over: someone you never met in that life, because you were home painting on the evening you would have met them.`],
 o:[[`Draw back the curtain`,`mirror`],[`Go back to the galleries`,`hub`],[`Find Miss Varnum`,`office`]]},

mirror:{t:`The View from the Other Side`,room:"zero",set:[`mirror`],p:[
 `You draw back the curtain.`,
 `Through the glass is another museum, identical to this one: the same green walls, the same brass hooks. In the centre case, under a small spotlight, are your things.`,
 vit({d:"mug",t:"The Life That Happened",date:"Actual. On loan from the visitor",b:"Morning mug, chipped. House keys. A shopping list in your handwriting. A photograph of the people you love, slightly out of focus, everyone laughing at something off camera.",acc:"Acc. no. Y-0000-0000"}),
 `On the other side of the glass, a visitor stands in front of the case with one hand flat against it. A cellist's calluses. Paint on the cuffs. A tan from somewhere with blue tiles.`,
 `It's you. Every you who went the other way, it seems, standing in their museum and looking at your ordinary life the way you looked at the cello.`],
 o:[[`Put your hand on the glass`,`hand`],[`Draw the curtain and go and find Miss Varnum`,`finale`],[`Close the door and wander until closing`,`hub`]]},

hand:{t:`Is It Good?`,room:"zero",p:[
 `You put your hand on the glass. On the other side the visitor does the same, palm to palm, and for a moment neither of you breathes.`,
 `They mouth something. It takes you a second. *Is it good?*`,
 `You think about the mug, and the chip in it, and who made you tea in it this morning, or didn't. About the shopping list. About the laugh in the photograph.`,
 `You nod.`,
 `They smile the way people smile at a museum when something is more beautiful than they expected. Then, somewhere on both sides of the glass, a bell rings for closing.`],
 o:[[`Go to the front desk`,`finale`],[`Take one last look at your room`,`finale`],[`Walk back slowly through the galleries`,`finale`]]},

hub:{t:`Quarter to Six`,room:"near",p:s=>{
 const a=[`The light in the Hall of Near Misses has gone long and gold. The other visitors, if there were any, have gone. Somewhere a clock ticks in a room you haven't found.`];
 if(s.borrowed) a.push(`You're still holding ${OBJ[s.borrowed].name}. It's begun to feel familiar in your hand, the way a thing does when you've owned it for years.`);
 else a.push(`Your hands are empty. You've borrowed nothing yet.`);
 if(s.f.thomas) a.push(`You keep thinking about a watch that stopped at four minutes past six.`);
 return a;},
 o:s=>hubOpts(s)},

finale:{t:`Closing Time`,room:"lobby",cost:0,clockTo:1080,p:s=>{
 const a=[`The closing bell rings through the galleries. Miss Varnum is at the front desk with the lending ledger open and her pen uncapped. Ade folds his chair.`];
 if(s.borrowed) a.push(`Your house key is in a glass case somewhere behind you. ${OBJ[s.borrowed].name[0].toUpperCase()+OBJ[s.borrowed].name.slice(1)} is in your hand, and it would be very easy to keep walking.`);
 else a.push(`You've borrowed nothing. Miss Varnum studies you over her spectacles. "We could use someone like you here," she says lightly. "Someone who looks properly."`);
 if(s.f.thomas) a.push(`Behind you, in the Permanent Collection, a wristwatch says four minutes past six. It always will.`);
 if(s.f.mirror) a.push(`You're thinking about a face behind glass, and a mouthed question, and your own nod.`);
 if(s.f.ilse) a.push(`Miss Varnum's hand rests, without her noticing, on the locked drawer where the red scarf is kept.`);
 return a;},
 o:s=>{
  const o=[];
  if(s.borrowed){o.push([`Return ${OBJ[s.borrowed].name} and go home`,`E1`]);o.push([`Keep ${OBJ[s.borrowed].name} and walk out`,`E2`]);}
  else{o.push([`Thank her and go home, empty-handed`,`E3`]);o.push([`Accept her offer to stay on`,`E4`]);}
  if(s.f.mirror&&s.f.ilse) o.push([s.borrowed?`Return it, then hold the door open for Miss Varnum`:`Hold the door open for Miss Varnum`,`E5`]);
  else o.push(s.borrowed?[`Ask whether you could stay on here instead`,`E4`]:[`Slip the little cello under your coat on the way out`,`E6`]);
  return o;}},

E1:{end:true,t:`Returned by Closing`,p:s=>[
 `You set ${OBJ[s.borrowed||"cello"].name} back on its velvet. Miss Varnum takes your house key out of the case and presses it into your palm. It's warm, as if somebody has been holding it.`,
 `*Returned, ${s.f.mirror?"5:58":"5:51"}*, she writes in the ledger.`,
 `Fennick Street is the same as ever: the dry cleaner, the closed bookshop, a bus going by with its windows lit. Your own front door. The key turns the way it always turns.`,
 `Inside, everything is where you left it. The chipped mug. The list on the fridge. You stand in your own kitchen for a long moment and look at it the way you'd look at something in a glass case.`,
 `Then you put the kettle on.`,
 s.f.mirror?``:`*There was a curtain in Room Zero you never drew back. Someone was waiting behind it.*`]},

E2:{end:true,t:`Exchanged`,p:s=>[
 `You keep walking. Past the desk, past Miss Varnum's quiet "Oh," out through the green door, just as the bell finishes.`,
 `Fennick Street isn't there. ${s.borrowed==="ticket"?"There's a steep street of blue tiles, and a tram grinding up it, and the smell of your bakery.":s.borrowed==="cello"?"There's a stage door in Lisbon, and a car waiting, and a concert in an hour.":s.borrowed==="letter"?"It's Sunday, and the phone is ringing, and you know exactly whose voice it will be.":"There's a room with north light and forty canvases, and wet paint on your hands."}`,
 `It's wonderful. You don't remember that it was ever otherwise. That is the mercy of it.`,
 `Back in the museum, Ade carries a new case into the Permanent Collection. Inside: a chipped mug, a shopping list, a photograph of people laughing at something off camera. A house key, still warm.`,
 `Some years later, somebody who loved you will stand in front of it for an hour, and sign the book on the way out.`,
 `*The other life doesn't miss you. Only this one does.*`]},

E3:{end:true,t:`Just Looking`,p:s=>[
 `"Just looking today, thank you," you say. Miss Varnum nods as if that's the most sensible thing anyone has said all week.`,
 `You write in the guest book: *Couldn't do it. Only looked. That was enough.* It's only on the walk home that you realise somebody wrote exactly the same thing, years ago, in a hand very like yours.`,
 `The next morning the green door is gone. Between the dry cleaner and the bookshop there's only brick.`,
 `Your life is exactly as it was. Mostly that's fine. Some evenings, for no reason, you think about a quarter-size cello, and a velvet curtain you never drew back.`,
 s.f.wing?``:`*There was a room in that museum with your name on it. You had only to ask the curator.*`]},

E4:{end:true,t:`The New Curator`,p:s=>[
 `"Yes," you say, surprising both of you.`,
 `Miss Varnum looks at you for a long moment. Then she takes the brass key off her chain and puts it in your hand, and unlocks her desk drawer, and takes out the red scarf, and puts it on.`,
 `"The kettle sticks," she says. "Ade takes two sugars. Don't let anyone borrow the near misses." At the green door she stops. "I'm not going to Paris, you know. I'm eighty-four. I'm going to the café on the corner to have a terrible cup of coffee among strangers. I haven't done that since 1961."`,
 `You become the curator of the Museum of Almost. You're good at it. You know the exact moment to appear with the velvet tray.`,
 `You never go home again. You never quite decide whether that was your bravest choice or your most frightened one.`,
 s.borrowed?`Your house key stays in its case in the gallery. You dust it every Tuesday.`:`Your own room, Room Zero, stays locked. You keep meaning to go in.`]},

E5:{end:true,best:true,t:`On Reciprocal Loan`,p:s=>[
 s.borrowed?`You put ${OBJ[s.borrowed].name} back on its velvet and take your house key. It's warm, as if somebody on the other side has been holding it.`:`You leave with empty hands. You've never felt less empty-handed.`,
 `Then you go to the green door and hold it open, and turn round.`,
 `"Miss Varnum. Come and see the street."`,
 `She laughs. "I'm the curator, dear. Somebody has to—"`,
 `"Four minutes to spare, sixty years ago," you say. "You've got more than four minutes now."`,
 `She looks at the drawer for a long time. Then she unlocks it and takes out the red scarf and winds it twice around her neck. Ade, from his folding chair, says "About time," and turns a page.`,
 `Fennick Street is full of evening: buses, a dog barking, the smell of somebody's dinner through a window. Miss Varnum stands on the pavement with her eyes closed and breathes it in like a woman who has just stepped off a train in a foreign city.`,
 `"It's good," she says. "Isn't it? All of it. It's very good."`,
 `You walk her to the café on the corner. Then you go home, to the mug and the list and the people in the photograph, to the life somebody behind glass is longing for tonight. You put the kettle on.`,
 `On the other side, somewhere, someone nods.`]},

E6:{end:true,t:`Please Take Only One`,p:[
 `It goes under your coat easily. Nobody's looking.`,
 `Then every bell in the museum begins to ring at once, very softly, like a hundred teacups touched with a spoon. The cases go dark. Ade stands up and sighs, as if it were his fault.`,
 `"One," says Miss Varnum, quite gently. "It says one."`,
 `You're standing on Fennick Street. Your coat is empty. Between the dry cleaner and the bookshop there's only brick, and there always will be.`,
 `You have your own life, every bit of it, exactly as before. You couldn't say why you feel you've lost something.`,
 `*The museum lends almosts. It doesn't give them away.*`]}
};

function hubOpts(s){
  const pool=[];
  if(!s.seen.unsent) pool.push([`The Gallery of Unsent Things`,`unsent`]);
  if(!s.seen.careers) pool.push([`The Room of Other Careers`,`careers`]);
  if(!s.seen.roads) pool.push([`The Long Gallery`,`roads`]);
  if(!s.f.thomas) pool.push([`The Permanent Collection`,`perm`]);
  if(!s.f.ilse) pool.push([`Knock on the curator's office door`,`office`]);
  if(s.f.ilse&&!s.f.wing) pool.push([`Use Miss Varnum's key on the narrow door`,`zero`]);
  if(s.f.wing&&!s.f.mirror) pool.push([`Go back to Room Zero and draw the curtain`,`mirror`]);
  if(!s.f.reverse) pool.push([`Turn one of the placards over`,`reverse`]);
  const o=pool.slice(0,2);
  const fill=[[`Sit on the bench in the Hall of Near Misses`,`finale`],[`Wait for the closing bell`,`finale`]];
  while(o.length<2) o.push(fill.shift());
  o.push([`Walk back to the front desk`,`finale`]);
  return o;
}

/* ---------- engine ---------- */
let state,history=[];
const fresh=()=>({scene:"start",f:{},seen:{start:1},clock:960,n:0,borrowed:null,visited:{lobby:1}});
const SAVE_KEY="tac-museum-of-almost-daily-door-v1";
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(d&&d.state&&S[d.state.scene]&&d.state.f&&d.state.seen&&d.state.visited&&Array.isArray(d.history)&&Number.isFinite(d.state.clock)&&(d.state.borrowed===null||Object.prototype.hasOwnProperty.call(OBJ,d.state.borrowed)))return d}catch(e){}return null}
const val=(x,s)=>typeof x==="function"?x(s):x;
function hm(m){m=Math.round(m);let h=Math.floor(m/60)%12||12;return h+":"+String(m%60).padStart(2,"0")}
function loadE(){try{return JSON.parse(localStorage.getItem("almost-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("almost-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(to){
  if(!S[to])return;
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  const sc=S[to], cost=sc.cost==null?8:sc.cost;
  state.scene=to; state.n++;
  if(sc.clockTo) state.clock=Math.max(state.clock,sc.clockTo);
  else if(!sc.end) state.clock=Math.min(1074,state.clock+cost);
  if(sc.end) state.clock=1080;
  if(to.startsWith("borrow_")) state.borrowed=to.slice(7);
  if(sc.room) state.visited[sc.room]=1;
  state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  persist();render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).filter(Boolean).map(t=>/^<span class="(card|vitrine)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><p class="room"><span>${sc.end?"Ending":ROOMS[sc.room]||""}</span><span>${hm(state.clock)} p.m.</span></p>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length, c=CLUES.filter(x=>state.f[x[0]]).length;
    html+=`<div class="ending-card"><p class="label2">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 18px">You discovered ${c} of 7 details across ${state.n} visits.${sc.best?"":" The truest ending opens once you've seen the view from the other side and heard the curator's story."}</p>
     <button class="begin" id="again">Walk down Fennick Street again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>`<li><button class="choice" data-i="${i}"><span class="num">${i+1}.</span><span>${smart(o[0])}${o[1].startsWith("borrow_")?`<span class="tag">You may borrow one object</span>`:o[1]==="E6"?`<span class="tag">Not permitted by the lending terms</span>`:""}</span></button></li>`).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your steps</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i][1]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".mast");if(window.scrollY>top.offsetHeight)window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
const PLAN=[["zero",8,8,52,34,"Room Zero"],["near",64,8,114,34,"Near Misses"],["office",182,8,52,34,"Curator"],
 ["unsent",8,46,72,40,"Unsent Things"],["careers",84,46,72,40,"Other Careers"],["perm",160,46,74,40,"Permanent"],
 ["roads",8,90,226,20,"The Long Gallery"],["lobby",84,114,72,28,"Lobby"]];
function side(){
  const here=S[state.scene].room;
  document.getElementById("plan").innerHTML=`<svg viewBox="0 0 242 150" role="img" aria-label="Floor plan, you are in ${ROOMS[here]||"the museum"}">${PLAN.map(([k,x,y,w,h,l])=>{
    const cls=k===here?"here":state.visited[k]?"v":"";const locked=k==="zero"&&!state.f.ilse?" locked":"";
    return `<rect class="r ${cls}${locked}" x="${x}" y="${y}" width="${w}" height="${h}"/><text class="${k===here?"here":""}" x="${x+w/2}" y="${y+h/2+3}" text-anchor="middle">${k==="zero"&&!state.f.wing?"Locked":l}</text>`}).join("")}</svg>`;
  const b=state.borrowed;
  document.getElementById("slip").innerHTML=`<div class="row"><span class="k">Borrowed</span><span class="v ${b?"on":""}">${b?OBJ[b].t.split(",")[0]:"Nothing yet"}</span></div>
   <div class="row"><span class="k">Left on deposit</span><span class="v">${b?"House key":"—"}</span></div>
   <div class="row"><span class="k">Due back</span><span class="v ${b?"on":""}">${b?"6:00 p.m.":"—"}</span></div>`;
  const left=1080-state.clock;
  document.getElementById("clock").textContent=hm(state.clock);
  document.getElementById("closing").textContent=left<=0?"Closed":`Closing in ${left} min`;
  document.getElementById("clues").innerHTML=CLUES.map((c,i)=>state.f[c[0]]?`<li><span class="no">Placard ${i+1}</span>${smart(c[1])}</li>`:`<li class="unknown"><span class="no">Placard ${i+1}</span>Not yet read</li>`).join("");
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName||""))return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){state=d&&d.state&&S[d.state.scene]?d.state:fresh();history=d&&Array.isArray(d.history)?d.history:[];persist();render(false)}
document.getElementById("ledgerToggle").addEventListener("click",()=>{const panel=document.getElementById("museumAside"),button=document.getElementById("ledgerToggle"),opened=panel.classList.toggle("ledger-open");button.setAttribute("aria-expanded",String(opened));button.textContent=opened?"Hide museum details":"View floor plan & lending slip";});
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(restore());
</script>
</body></html>
