 oduya:"Oduya: all year, the good parcels have gone up the Hill.",
 shoes:"Pim, the sorting clerk: glue on his fingers, new shoes from the Hill. 'A present from my uncle.'",

const S={
start:{t:`Your First Route`,at:"post",p:[
 `Varrow-on-Lune is an ordinary city, mostly. It has a river, a tram, a councillor, and a drought. It also has the Impossible Post, behind a narrow green door at the end of Fennick Lane, between a locksmith and a shop that sells only left-hand gloves.`,
 `You've worked there exactly one day. This morning Mrs. Oduya, the postmistress, sixty, reading glasses on a chain, hands you a canvas satchel with four parcels in it, brown paper and string, each with a label in careful capitals.`,
 rules,
 `"Everything we deliver changes the city a little," she says. "That's the job. Varrow is the way it is because of what's come through that door. So mind where things go."`,
 `Behind her, at the sorting table, the clerk Pim doesn't look up. He has glue on his fingers and very new shoes.`],
 o:[[`Ask Mrs. Oduya where the parcels come from`,`oduya`],[`Say good morning to Pim`,`pim`],[`Shoulder the satchel and set out`,`route`]]},

 `"Same place as anything that can't exist," Mrs. Oduya says. "Somebody needs it badly enough, and it turns up in the sack in the morning, wrapped and labelled. Don't ask me how. Thirty-one years I've done this job. Rain for gardens. Lost keys for locked-out people. Courage, once, in a biscuit tin."`,
 `She takes off her glasses. "But this last year, the good parcels keep going up the Hill, to the Councillor. And the Hill keeps getting taller, and the docks keep getting quieter. Maybe that's luck." She plainly doesn't think so.`],
 o:[[`Ask what happens if you open one`,`warn`],[`Say good morning to Pim`,`pim`],[`Set out`,`route`]]},

warn:{t:`Rule Two`,at:"post",p:[
 `"Then it isn't in the parcel anymore," Mrs. Oduya says. "It's in you, or in the street, or wherever it lands. Open one, and you'll live with it." She goes back to her ledger. "Open two, and the city starts shifting round you to make room."`],
 o:[[`Say good morning to Pim`,`pim`],[`Promise you won't, and set out`,`route`],[`Set out without promising anything`,`route`]]},

 `"Present," he says, before you've asked. "From my uncle."`],

route:{t:`On Your Route`,at:null,p:s=>{
 const n=["A","B","C","D"].filter(x=>!del(s,x)).length;
 return [`From the top of Fennick Lane you can see most of Varrow: the brown river Lune, the docks, the dry gardens of Kestrel Row, the tram depot, Old Market Square (a car park these days), and up on the Hill, Grail Tower, a little taller than it was last month.`,
  n?`There ${n===1?"is one parcel":"are "+["","one","two","three","four"][n]+" parcels"} left in your satchel. The lamplighters start at seven.`:`Your satchel is empty. The lamplighters start at seven.`]},
 o:s=>roadOpts(s)},

bench:{t:`The Tram-Stop Bench`,at:null,p:s=>{
 const a=[`You sit for a minute on the bench by the No. 9 stop and watch the city.`];
 if(s.seen.dA) a.push(`Over Kestrel Row there's a single grey cloud, raining politely on one street and nowhere else.`);
 if(s.seen.dBt) a.push(`From the docks, faintly, people are singing something nobody has ever heard before and everybody seems to know.`);
 if(s.seen.dBw) a.push(`A tram goes by with a loudspeaker on the roof, playing the Councillor's new campaign song. It's the most beautiful tune you've ever heard, and it makes you feel slightly sick.`);
 if(s.seen.dC) a.push(`The No. 9 tram's destination board now reads THE SEA, and the people getting on are carrying towels.`);
 if(s.seen.dDt) a.push(`Over Old Market Square the shadows are wrong: awnings, stalls and crates, cast by nothing at all.`);
 if(s.seen.dDw) a.push(`Workmen are putting up a hoarding round the old market car park: FUTURE SITE OF GRAIL TOWER II.`);
 if(a.length===1) a.push(`So far, Varrow looks the way it did this morning. That won't last.`);
 return a;},
 o:s=>{const r=roadOpts(s).filter(o=>o[1]!=="bench"&&o[1]!=="paperS");const F=[["Buy the late edition of the Evening Lune","paperS"],["Get up and walk on","route"],["Watch one more tram go by","route"]];for(const f of F){if(r.length>=3)break;if(f[1]!=="paperS"||!s.seen.paperS)r.splice(r.length-1,0,f)}return r.slice(0,3)}},

paperS:{t:`The Late Edition`,at:null,p:s=>[
 `A boy on the corner is selling the late edition of the *Evening Lune*. The ink is still wet, and the headlines are ones that weren't true this morning.`,
 `"Funny," the boy says. "Every edition today, the front page has been different."`],
 o:s=>{const r=roadOpts(s).filter(o=>o[1]!=="bench"&&o[1]!=="paperS");const F=[["Sit on the tram-stop bench and watch the city","bench"],["Fold the paper and walk on","route"],["Tuck the paper in your satchel and go","route"]];for(const f of F){if(r.length>=3)break;if(f[1]!=="bench"||!s.seen.bench)r.splice(r.length-1,0,f)}return r.slice(0,3)}},

pA:{t:`9 Kestrel Row`,at:"kestrel",p:s=>[
 `Every garden on Kestrel Row is dust. The roses are sticks. In front of No. 9, an old woman is sitting on her step with a watering can that's clearly been empty since July.`,
 `The parcel is cold in your hands, and it sloshes.`,parcel(s,"A")],o:s=>parcelOpts(s,"A")},
pB:{t:`The Second Parcel`,at:"hill",p:s=>[
 `The second parcel is flat and square, like a gramophone record, and it hums against your palm: a tune you almost know, that slips away whenever you try to catch it.`,
 `The label sends it up the Hill, to Grail Tower. It's a long climb.`,parcel(s,"B")],o:s=>parcelOpts(s,"B")},
pC:{t:`The No. 9 Tram Depot`,at:"depot",p:s=>[
 `The third parcel is tall and narrow and should be impossible to carry, but if you hold it the right way it fits under your arm like an umbrella. It has a small brass doorknob, wrapped separately.`,
 `Mrs. Lourdes Ferreira has driven the No. 9 tram for thirty-one years. The No. 9 goes round Varrow in a loop. It has never gone anywhere else, and neither has she.`,parcel(s,"C")],o:s=>parcelOpts(s,"C")},
pD:{t:`The Fourth Parcel`,at:"hill",p:s=>[
 `The fourth parcel weighs nothing at all. It's darker under the string than brown paper should be, and when you set it on a wall the stone underneath it goes cool. It smells faintly of oranges and fish and wet canvas.`,
 `The label sends it up the Hill, to Grail Tower.`,parcel(s,"D")],o:s=>parcelOpts(s,"D")},

lA:{t:`Held to the Light`,at:"kestrel",p:s=>[`You hold the label up to the sun. One label, Mrs. Oduya's capitals, nothing underneath. This one is honest.`,parcel(s,"A")],o:s=>parcelOpts(s,"A")},
lC:{t:`Held to the Light`,at:"depot",p:s=>[`You hold the label up to the sun. One label, nothing underneath. This one is honest.`,parcel(s,"C")],o:s=>parcelOpts(s,"C")},
lB:{t:`Two Labels`,at:"hill",mark:"revB",p:s=>[
 `Held up to the sun, the label isn't one label. It's two. Someone has pasted a new one over the old, very neatly, and the glue has hardly dried. Through the paper, backwards, you can read the first address.`,
 parcel(s,"B"),`<span class="found">✉ Postmark noted</span>`],
 o:s=>{const o=parcelOpts(s,"B");if(!s.seen.pimConf)o[2]=[`Take it back to the Post and show Pim`,`pimConf`];return o}},
lD:{t:`Two Labels`,at:"hill",mark:"revD",p:s=>[
 `Held to the light, there's a second label under the first, pasted over with the same neat glue. ${s.seen.lB||s.seen.oB?"The same as the song. ":""}Through the paper you can read where this shadow was really meant to go.`,
 parcel(s,"D"),`<span class="found">✉ Postmark noted</span>`],
 o:s=>{const o=parcelOpts(s,"D");if(!s.seen.pimConf)o[2]=[`Take it back to the Post and show Pim`,`pimConf`];return o}},

oA:{t:`Rule Two, Broken`,at:"kestrel",p:s=>[
 `You untie the string. Inside is a jar, and inside the jar is weather. When you lift the lid a little, a small grey cloud slips out and settles over your head, about a foot above your hat, and begins to rain on you. Gently, and only on you.`,
 `It doesn't go away. It isn't going to. Half the rain is still in the jar.`,parcel(s,"A")],
 o:[[`Screw the lid back on and deliver what's left`,`dA`],[`Put it back in the satchel for later`,`route`],[`Stand in your own rain a moment, then deliver it`,`dA`]]},
oB:{t:`Rule Two, Broken`,at:"hill",mark:"revB",p:s=>[
 `Inside the paper is a record with a plain sleeve, and the song gets out before you can stop it. You hear it once, all the way through, right there on the pavement. It's the most beautiful thing you have ever heard. You will be humming it for the rest of your life.`,
 `On the sleeve, in faded pencil: *Written and sung by Bastien Moreau. The Blue Lantern, Dock Street, 1974.* The name on the label isn't his.`,parcel(s,"B")],
 o:s=>parcelOpts(s,"B")},
oC:{t:`Rule Two, Broken`,at:"depot",p:s=>[
 `You unwrap the door and, without quite meaning to, turn the brass knob. It opens. There's no wall around it, but through it there is a beach, gulls, salt wind, and a tram stop sign that says TERMINUS: THE SEA.`,
 `You shut it fast. Your shoes are full of sand. They will be, a little, forever.`,parcel(s,"C")],
 o:[[`Wrap it again and deliver it to Mrs. Ferreira`,`dC`],[`Open it again and step through yourself`,`E4`],[`Put it back in the satchel for later`,`route`]]},
oD:{t:`Rule Two, Broken`,at:"hill",mark:"revD",p:s=>[
 `The shadow pools out of the paper onto the pavement. It's the shadow of a market stall: awning, crates, a set of scales. Standing in it, you can hear someone shouting the price of oranges in 1961. Your own shadow, from now on, will always be holding a paper bag.`,
 `Tucked in the fold is a ticket: *Property of the Traders, Old Market Square. Please return.*`,parcel(s,"D")],
 o:s=>parcelOpts(s,"D")},

dA:{t:`Signed For: Rain`,at:"kestrel",head:"RAIN FALLS ON ONE STREET ONLY: KESTREL ROW IN BLOOM",p:[
 `Mrs. Pell signs your docket in pencil, slowly.`,sig("dA"),
 `Then she unscrews the jar. Last Tuesday's rain rises out of it like steam off a kettle, gathers itself over Kestrel Row, and comes down. On this street, and only on this street, it rains. The gardens drink. By the time you reach the corner the roses have leaves.`,
 head("RAIN FALLS ON ONE STREET ONLY: KESTREL ROW IN BLOOM")],
 o:[[`Ask Mrs. Pell where last Tuesday's rain actually fell`,`pell`],[`Back to your route`,`route`],[`Stay for a cup of tea, then go`,`route`]]},
pell:{t:`Where the Rain Went`,at:"kestrel",mark:"pell",p:[
 `"Last Tuesday?" Mrs. Pell says. "Rained on the Hill all day. Only the Hill. The grass on the Councillor's lawns is a foot high." She sniffs. "His private secretary was down here last month, asking who on the Row was likely to get parcels. A Mr. Hollis Pimm. Two m's. Shiny shoes."`],
 o:[[`Back to your route`,`route`],[`Thank her and go`,`route`],[`Write the name down, and go`,`route`]]},

dBt:{t:`Signed For: A Song`,at:"docks",head:"DOCKS SING ALL NIGHT: 'MOREAU'S LOST SONG' FOUND AFTER FIFTY YEARS",p:[
 `The Blue Lantern on Dock Street is shut and has been for years, but the old man who lives above it comes down when you knock. Bastien Moreau, seventy-eight, with a voice like a gravel path.`,
 `"I wrote it in 1974," he says, looking at the label. "The night before the session I lost it. Clean out of my head. Never came back." He signs.`,sig("dBt"),
 `Then he takes the record out of its sleeve, and sings, and his voice isn't gravel anymore. The dockers stop work. By evening the whole of Dock Street is singing, and the Blue Lantern has its lights on.`,
 head("DOCKS SING ALL NIGHT: 'MOREAU'S LOST SONG' FOUND AFTER FIFTY YEARS")],
 o:[[`Ask him who would want to steal a song`,`bastien`],[`Back to your route`,`route`],[`Stay for the first chorus, then go`,`route`]]},
bastien:{t:`The Man from the Hill`,at:"docks",mark:"bastien",p:[
 `"Funny you'd ask," Bastien says. "Man came round last year from up the Hill. Very polite. Asked if I had any old songs I'd like to sell. Said the Councillor was 'collecting'." He laughs. "I told him I didn't have any. I didn't, then."`],
 o:[[`Back to your route`,`route`],[`Thank him and go`,`route`],[`Hum the tune once more, and go`,`route`]]},
dBw:{t:`Signed For: A Song`,at:"hill",mark:"signed",head:"COUNCILLOR'S NEW SONG ON EVERY RADIO: POLLS SOAR",p:[
 `Grail Tower has a doorman, a lift, and a secretary on the forty-first floor who signs for the parcel without looking at it.`,sig("dBw"),
 `By evening every radio in Varrow is playing Councillor Grail's new campaign song. It's the most beautiful tune anyone has ever heard. People cry in the street and don't know why. Down on Dock Street, the Blue Lantern stays dark.`,
 head("COUNCILLOR'S NEW SONG ON EVERY RADIO: POLLS SOAR")],
 o:[[`Back to your route`,`route`],[`Look at the signature on your docket`,`sigLook`],[`Take the stairs down, all forty-one floors`,`route`]]},
sigLook:{t:`H. Pimm`,at:"hill",p:[
 `*H. Pimm, for Cllr. Grail.* Not the Councillor. His secretary. Pimm, with two m's. You think of the sorting table, and glue on somebody's fingers.`],
 o:[[`Back to your route`,`route`],[`Go on`,`route`],[`Fold the docket away`,`route`]]},

dC:{t:`Signed For: A Door`,at:"depot",head:"No. 9 TRAM NOW RUNS TO THE SEA. 'NOBODY KNOWS HOW,' SAYS COUNCIL",p:[
 `Mrs. Ferreira signs with the pencil from behind her ear.`,sig("dC"),
 `Then she carries the door out to the end of the line, where the tracks stop at a buffer, and stands it upright between the rails, and opens it. On the other side the tracks go on, over a hill that isn't in Varrow, down to a beach.`,
 `"Thirty-one years," she says, and climbs into her cab. The No. 9's destination board clatters round and stops at THE SEA.`,
 head("No. 9 TRAM NOW RUNS TO THE SEA. 'NOBODY KNOWS HOW,' SAYS COUNCIL")],
 o:[[`Wave her off, and back to your route`,`route`],[`Step through the door yourself`,`E4`],[`Watch the first tram go through, then go`,`route`]]},

dDt:{t:`Signed For: A Shadow`,at:"market",head:"OLD MARKET RETURNS, IN SHADOW FORM. TOWER PLANS 'ON HOLD'",p:[
 `Old Market Square is a car park with a planning notice on a pole: GRAIL TOWER II. But the traders still come on Saturdays, the old ones, and stand where their stalls were. Twenty-three of them sign, one after another.`,sig("dDt"),
 `At dusk, when you open the parcel, the shadow of the Old Market falls across the car park: awnings, crates, scales, the clock on its iron post. People walk into it and find themselves smelling oranges. By lamp-lighting the traders have set out their boxes inside the shadow, and the planning notice has blown away.`,
 head("OLD MARKET RETURNS, IN SHADOW FORM. TOWER PLANS 'ON HOLD'")],
 o:[[`Ask the traders what happened to the market`,`traders`],[`Back to your route`,`route`],[`Buy an orange, and go`,`route`]]},
traders:{t:`Nobody Will Miss It`,at:"market",mark:"traders",p:[
 `"Sold," says the oldest trader, who sold eels here for sixty years. "Councillor Grail sold it to himself, through three companies. Said in the paper nobody would miss it." She looks up at the shadow of the clock. "We missed it."`],
 o:[[`Back to your route`,`route`],[`Thank her, and go`,`route`],[`Stand in the shadow a minute, and go`,`route`]]},
dDw:{t:`Signed For: A Shadow`,at:"hill",mark:"signed",head:"GRAIL TOWER II TO RISE ON OLD MARKET SITE: 'NOBODY WILL MISS IT'",p:[
 `The secretary on the forty-first floor signs again, and this time smiles.`,sig("dDw"),
 `That night the shadow of the Old Market is locked in a strongbox in Grail Tower, and the last people in Varrow who remember the market forget it, one by one, like lamps going out. By morning, nobody can say what used to be in the car park.`,
 head("GRAIL TOWER II TO RISE ON OLD MARKET SITE: 'NOBODY WILL MISS IT'")],
 o:[[`Back to your route`,`route`],[`Look at the signature on your docket`,`sigLook`],[`Take the stairs down`,`route`]]},

pimConf:{t:`Glue`,at:"post",mark:"pim",p:s=>[
 `You put the parcel on the sorting table, label up, and hold it to the window so the second address shows through.`,
 `Pim goes white, then red. "I just paste them," he says. "My uncle gives me the new labels. He works for the Councillor. Anything good that comes in, I paste the Hill over it. A pound a parcel." He looks at his shoes. "And the shoes."`,
 `"Don't tell Mrs. Oduya," he says. "Please." She's in the back room. She hasn't heard.`],
 o:[[`Tell him he'll have to tell her himself, tonight`,`route`,"pimOwn"],[`Promise nothing, and go back out`,`route`],[`Say you'll think about it, and go`,`route`]]},

post:{t:`Lamp-Lighting`,at:"post",p:s=>{
 const n=["A","B","C","D"].filter(x=>!del(s,x)).length;
 const a=[`The lamplighters are coming down Fennick Lane with their poles as you push open the green door. Mrs. Oduya is waiting at the counter with the big ledger open.`];
 a.push(n?`"Well?" she says, and looks at the satchel, which isn't empty. ${n===1?"One parcel":["","","Two","Three","Four"][n]+" parcels"} still in it.`:`"Well?" she says. Your satchel is empty. Your docket is full of signatures.`);
 if(opened(s)) a.push(`She looks at you for a long moment${s.seen.oA?", at the little cloud raining on your hat":""}${s.seen.oC?", at the sand on the floor":""}, and says nothing.`);
 if(s.f.pimOwn&&s.seen.pimConf) a.push(`Behind her, Pim is standing by the sorting table with his hands in his pockets, waiting to say something.`);
 return a;},
 o:s=>{const n=["A","B","C","D"].filter(x=>!del(s,x)).length;
  if(n) return [[`Hand in the satchel, with ${n} undelivered`,`E5`],[`Go back out before the lamps are all lit`,`route`],[`Ask what happens to undelivered parcels`,`late`]];
  return [[`Tell her about the labels`,`tell`],[`Hand in your docket and say nothing`,endFor(s)],[`Go home without a word`,endFor(s)]];}},

late:{t:`Undelivered`,at:"post",p:[
 `"They'll keep," Mrs. Oduya says. "Things that can't exist are patient. Somebody else will take them out tomorrow." She glances, just once, at Pim's table.`],
 o:[[`Hand in the satchel`,`E5`],[`Go back out after all`,`route`],[`Hand it in and go home`,`E5`]]},

tell:{t:`The Labels`,at:"post",p:s=>{
 const wrong=s.seen.dBw||s.seen.dDw, ok=s.seen.dBt&&s.seen.dDt;
 const a=[];
 if(!s.seen.pimConf){a.push(`You tell her the labels were wrong. She frowns. "Wrong how? Who would do such a thing?" Pim says nothing at all, very loudly.`);
  a.push(`"Without proof," Mrs. Oduya says, "it's your word against a clerk's, on your second day." She closes the ledger.`);}
 else{a.push(s.f.pimOwn?`Before you can speak, Pim does. All of it: the labels, his uncle, the pound a parcel, the shoes. His voice shakes. Mrs. Oduya listens without moving.`:`You tell her what Pim told you: the labels, his uncle Hollis Pimm, the pound a parcel. Pim doesn't deny it. Mrs. Oduya listens without moving.`);
  if(wrong) a.push(`"And the parcels?" she says. You tell her. Up the Hill, signed for. She shuts her eyes. "Then they're his now. What's delivered stays delivered."`);
  else if(ok) a.push(`"And the parcels?" "Where they were meant to go," you say. Mrs. Oduya lets out a breath. Then she goes into the back room and comes out with a fifth parcel. It's small, square and very heavy.`,
   `"Came this morning," she says. "I set it aside because the label made no sense. It does now."`,
   `<span class="parcel"><span class="lbl"><span class="k">THE IMPOSSIBLE POST · CONTENTS</span>One (1) Consequence<br><span class="k">DELIVER TO</span><span class="to">Cllr. Hugo Grail, Grail Tower, The Hill. In person.</span></span><span class="stamp">5d<br>JUSTICE</span></span>`);}
 return a;},
 o:s=>{const wrong=s.seen.dBw||s.seen.dDw, ok=s.seen.dBt&&s.seen.dDt;
  if(s.seen.pimConf&&ok&&!wrong) return [[`Take the fifth parcel up the Hill`,`fifth`],[`Take it, and take Pim with you`,`fifth`,"pimWith"],[`Ask her to send someone else`,`E6`]];
  if(wrong) return [[`Hand in your docket`,`E2`],[`Ask if anything can be done`,`E2`],[`Go home`,`E2`]];
  return [[`Hand in your docket`,`E6`],[`Insist`,`E6`],[`Go home`,`E6`]];}},

fifth:{t:`Grail Tower, After Dark`,at:"hill",p:s=>[
 `This time there's no secretary on the forty-first floor. ${s.f.pimWith?"Pim's uncle has gone home early, Pim says, very quietly, behind you. ":""}The Councillor himself answers his office door: a big, pink, pleasant man in a velvet jacket, humming something he can't place.`,
 `"For me?" he says. "In person? How exciting." He reaches for the parcel.`],
 o:[[`Have him sign for it, then hand it over`,`E1`],[`Read him the label aloud first, then have him sign`,`E1`],[`Leave it on his desk, unsigned, and go`,`E6`]]},

E1:{end:true,best:true,t:`Signed For`,p:s=>[
 `The Councillor signs with a gold pen. *Hugo Grail.* Then he unties the string.`,
 `There's nothing visible in the box. But that night, quietly, Grail Tower becomes exactly as tall as it deserves to be, which turns out to be two storeys and a shed. The rain on the Hill's lawns stops. A strongbox in his cellar opens on its own and a great many things, a year's worth, roll out of the door and down the Hill to where they were addressed.`,
 `${s.f.pimWith?"Pim, standing behind you, cries all the way down the stairs. ":""}${s.f.pimOwn||s.f.pimWith?"Mrs. Oduya keeps Pim on, sorting only, no glue, for a long time. He gives back the shoes.":"Pim is let go. His uncle Hollis is never seen in Varrow again."}`,
 head("GRAIL TOWER SHRINKS OVERNIGHT; COUNCILLOR 'CONSIDERING HIS POSITION'"),
 `In the morning there's a new satchel on the counter with your name on it, and the first label reads, in Mrs. Oduya's capitals: *To the Courier. Contents: One (1) Second Route.*`]},

E2:{end:true,t:`Delivered as Addressed`,p:s=>[
 `Mrs. Oduya signs off your docket. Every parcel delivered, every signature collected, every rule kept. She looks at it for a long time.`,
 `"You did the job," she says. "To the letter."`,
 `Over the next month, Grail Tower grows four more floors. Grail Tower II goes up on a car park nobody can remember being anything else. Every radio in Varrow plays the Councillor's song, and he wins the election by a street. The Hill is very green.`,
 head("GRAIL RE-ELECTED IN LANDSLIDE; 'THE CITY HAS NEVER BEEN HAPPIER'"),
 `*The labels said the Hill. The labels were lying. Rule 1 says the name on the label, but a label can be pasted over.*`]},

E3:{end:true,t:`Contents May Shift`,p:s=>[
 `You open the second parcel, and Mrs. Oduya was right.`,
 `Varrow begins, gently, to move round you to make room for what you've let out. When you turn into Fennick Lane, it's where the river used to be. When you look for the green door of the Impossible Post, it's on a different street each time, and once it's on a roof. Your rain cloud follows you. Your shadow holds a paper bag. Your shoes are full of sand.`,
 `You still deliver parcels. You're very good at it, actually: nobody knows the ways a city can rearrange itself better than you. But you never find the same street twice, and you're never quite back before the lamps.`,
 `*Rule 2 is there for a reason. You can open one, and live with it. Not two.*`]},

E4:{end:true,t:`Through the Door`,p:s=>[
 `You step through.`,
 `The other side smells of salt and hot tar. There's a beach, and gulls, and a tram stop at the end of a line that shouldn't exist, and the sun is still well up, because whatever time it is in Varrow, it's earlier here.`,
 `You sit down on the sand with your satchel${["A","B","C","D"].filter(x=>!del(s,x)).length?", which still has parcels in it,":""} and take off your shoes.`,
 `A week later, Mrs. Oduya gets a postcard with no stamp. It says: *Not back before the lamps. Sorry. Nice here.* She pins it over the sorting table, where Pim has to look at it every day.`,
 `*The door was for Mrs. Ferreira. Couriers deliver; they don't keep.*`]},

E5:{end:true,t:`Back Before the Lamps`,p:s=>[
 `You hand in the satchel with parcels still in it. Mrs. Oduya enters them in the ledger as UNDELIVERED, in red.`,
 `"They'll keep," she says.`,
 `They do. And the next morning, before anyone else is in, the sorting clerk takes them out of the sack one by one, and gets out his glue.`,
 `*You got back before the lamps, but the route wasn't finished. Every parcel needs delivering.*`]},

E6:{end:true,t:`Rerouted`,p:s=>[
 `${s.seen.fifth?"You leave the parcel on the Councillor's desk without a signature, and by morning it's gone, and nothing has happened. Rule 3: every delivery must be signed for. Unsigned, it doesn't count.":"The parcels went to the right doors. The rain is on Kestrel Row, the song is on the docks, the No. 9 runs to the sea, and the market's shadow is back on the square."}`,
 `But nothing changes at the sorting table. Next week your satchel has five parcels in it, and three of them are addressed, in fresh labels and very neat glue, to the Hill.`,
 `*You rerouted the parcels yourself, but whoever was changing the labels is still at work. Find out who it is, get a confession, and tell the Post.*`]}
};

function endFor(s){return (s.seen.dBw||s.seen.dDw)?"E2":"E6"}
function roadOpts(s){
  const und=["A","B","C","D"].filter(x=>!del(s,x));
  const o=[];
  if((rev(s,"B")||rev(s,"D"))&&!s.seen.pimConf) o.push([`Go back to the Post and ask Pim about the labels`,`pimConf`,"",`Back at Fennick Lane`]);
  und.forEach(x=>o.push([`Deliver ${P[x].name}`,"p"+x,"",P[x].truth&&rev(s,x)?`Two labels`:`To: ${P[x].to.split(",")[0]}`]));
  const r=o.slice(0,2);
  const F=[[`Sit on the tram-stop bench and watch the city`,`bench`],[`Buy the late edition of the Evening Lune`,`paperS`]];
  let fi=0; while(r.length<2) r.push(F[fi++]);
  r.push(und.length?[`Head back to the Post for lamp-lighting`,`post`,"",`${und.length} undelivered`]:[`Head back to the Post for lamp-lighting`,`post`,"",`Satchel empty`]);
  return r;
}

/* ---------- engine ---------- */
let state,history=[];
const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,at:"post",heads:HEAD0.slice(),fresh:false});
const val=(x,s)=>typeof x==="function"?x(s):x;
function loadE(){try{return JSON.parse(localStorage.getItem("courier-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("courier-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  let [,to,flag]=opt;
  if(flag) state.f[flag]=1;
  if(/^o[A-D]$/.test(to)&&!state.seen[to]&&opened(state)>=1) to="E3";
  const sc=S[to], first=!state.seen[to];
  if(sc.at) state.at=sc.at;
  state.scene=to; state.n++; state.seen[to]=1;
  state.fresh=false;
  if(first&&sc.head){state.heads.unshift(sc.head);state.fresh=true}
  if(to==="E1"&&first){state.heads.unshift("GRAIL TOWER SHRINKS OVERNIGHT; COUNCILLOR 'CONSIDERING HIS POSITION'");state.fresh=true}
  if(to==="E2"&&first){state.heads.unshift("GRAIL RE-ELECTED IN LANDSLIDE; 'THE CITY HAS NEVER BEEN HAPPIER'");state.fresh=true}
  if(sc.end) saveE(to);
  render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());state.fresh=false;render(true)}
function restart(){history=[];state=fresh();render(true)}
const SAVE_KEY="tac-courier-daily-door-v1";
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const v=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return v&&v.state&&S[v.state.scene]&&v.state.f&&v.state.seen&&Array.isArray(v.history)?v:null}catch(e){return null}}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).map(t=>/^<span class="(rules|parcel|headline|sig|found)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span><b>${sc.end?"End of the route":sc.at?PLACES[sc.at][2]:"Varrow-on-Lune"}</b></span><span>${["A","B","C","D"].filter(x=>del(state,x)).length} of 4 delivered</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length;
    const tr=(state.seen.dBt?1:0)+(state.seen.dDt?1:0);
    html+=`<div class="ending-card"><p class="label">${sc.best?"THE TRUEST ENDING":"ENDING REACHED"} · ${n} OF 6 DISCOVERED</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 16px">${["A","B","C","D"].filter(x=>del(state,x)).length} of 4 delivered · ${tr} of 2 sent to their true address · ${opened(state)} opened${state.seen.pimConf?" · Pim confessed":""}.${sc.best?"":" The truest ending: deliver every parcel to its true address, find out who's been changing the labels, and tell the Post."}</p>
     <button class="begin" id="again">Take a new satchel</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>`<li><button class="choice" data-i="${i}"><span class="num">${i+1}</span><span class="tx">${smart(o[0])}${o[3]?`<span class="tag${/Breaks|letter/.test(o[3])?" r":""}">${smart(o[3])}</span>`:""}</span></button></li>`).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".wrap");if(window.scrollY>top.offsetTop)window.scrollTo({top:top.offsetTop-10,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const s=state, H=s.heads;
  document.getElementById("paper").innerHTML=`<p class="mh">The Varrow Evening Lune</p><div class="ed"><span>${H.length===3?"Morning edition":"Late edition No. "+(H.length-3)}</span><span>One penny</span></div>
   <p class="lead${s.fresh?" new":""}">${smart(H[0])}</p><div class="subs"><p>${smart(H[1])}</p><p>${smart(H[2])}</p></div>`;
  const rows=["A","B","C","D"].map(x=>{const p=P[x],r=rev(s,x);
    let st="IN SATCHEL",pm="",sgn="";
    const k={A:"dA",C:"dC"}[x]||(s.seen["d"+x+"t"]?"d"+x+"t":s.seen["d"+x+"w"]?"d"+x+"w":null);
    if(k&&s.seen[k]){sgn=SIG[k];st="DELIVERED";pm=k.endsWith("w")?`<span class="pm bad">TO THE<br>HILL</span>`:`<span class="pm ok">SIGNED<br>FOR</span>`}
    else if(s.seen["o"+x]){st="OPENED";pm=`<span class="pm open">OPENED</span>`}
    return `<div class="drow">${pm}<span class="n">${p.name}</span><span class="a">${r?`<s>${p.to}</s><br><span class="t">${p.truth}</span>`:p.to}</span><span class="st">${st}</span>${sgn?`<span class="sg">${sgn}</span>`:""}</div>`});
  if(s.seen.fifth||s.scene==="E1") rows.push(`<div class="drow">${s.scene==="E1"?`<span class="pm ok">SIGNED<br>FOR</span>`:""}<span class="n">One (1) Consequence</span><span class="a">Cllr. Hugo Grail, in person</span><span class="st">${s.scene==="E1"?"DELIVERED":"IN HAND"}</span>${s.scene==="E1"?`<span class="sg">Hugo Grail</span>`:""}</div>`);
  document.getElementById("docket").innerHTML=rows.join("");
  document.getElementById("dCount").textContent=`${["A","B","C","D"].filter(x=>del(s,x)).length} of 4 delivered · ${opened(s)} opened`;
  const M=Object.keys(MARKS).filter(k=>Object.keys(S).some(id=>S[id].mark===k&&s.seen[id]));
  document.getElementById("marks").innerHTML=M.length?M.map(k=>`<li>${smart(MARKS[k])}</li>`).join(""):`<li class="none">Nothing yet. Keep your eyes open.</li>`;
  drawMap();
}
function drawMap(){
  const s=state, cur=s.at, sc=S[s.scene];
  const wrongs=(s.seen.dBw?1:0)+(s.seen.dDw?1:0)+(s.scene==="E2"?2:0);
  const shrunk=s.scene==="E1";
  const th=shrunk?14:46+wrongs*16, [tx,ty]=PLACES.hill;
  let g=`<path d="M0 205 Q90 190 170 196 T340 192 Q430 186 560 200 L560 220 L0 220 Z" fill="var(--sea)" opacity=".35"/>
   <path d="M20 160 Q120 150 200 170 T330 166 Q400 150 470 168" stroke="var(--sea)" stroke-width="7" fill="none" opacity=".55"/>
   <text x="300" y="150" style="font-size:10px;fill:var(--muted)">THE LUNE</text>
   <path d="M60 128 L150 60 M60 128 L262 112 M262 112 L250 176 M262 112 L395 158 M395 158 L455 70" stroke="var(--line)" stroke-width="3" fill="none"/>
   <path d="M120 140 Q260 140 395 158" stroke="var(--blue)" stroke-width="1.4" stroke-dasharray="2 3" fill="none" opacity=".7"/>`;
  g+=`<path d="M380 210 Q440 90 520 210 Z" fill="var(--line)" opacity=".5"/>`;
  g+=shrunk?`<rect x="${tx-9}" y="${ty+24-th}" width="18" height="${th}" fill="var(--ink)" opacity=".7"/>`:
    `<rect x="${tx-9}" y="${ty+24-th}" width="18" height="${th}" fill="var(--ink)"/>${[...Array(Math.floor(th/7))].map((_,i)=>`<rect x="${tx-5}" y="${ty+20-th+i*7}" width="3" height="3" fill="var(--paper)"/><rect x="${tx+2}" y="${ty+20-th+i*7}" width="3" height="3" fill="var(--paper)"/>`).join("")}`;
  if(s.seen.dA||s.seen.oA){const[x,y]=PLACES.kestrel;g+=`<g opacity=".85"><ellipse cx="${x}" cy="${y-24}" rx="24" ry="9" fill="var(--muted)"/>${[-14,-6,2,10,18].map(d=>`<path d="M${x+d} ${y-14} l-3 9" stroke="var(--blue)" stroke-width="1.4"/>`).join("")}</g>${s.seen.dA?`<circle cx="${x+18}" cy="${y+8}" r="6" fill="var(--green)" opacity=".7"/><circle cx="${x-18}" cy="${y+10}" r="5" fill="var(--green)" opacity=".7"/>`:""}`}
  const notes=(x,y)=>`<g fill="var(--red)">${[[0,0],[14,-8],[28,2]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="3"/><path d="M${x+a+3} ${y+b} v-12" stroke="var(--red)" stroke-width="1.2"/>`).join("")}</g>`;
  if(s.seen.dBt){const[x,y]=PLACES.docks;g+=notes(x-26,y-18)}
  if(s.seen.dBw) g+=notes(tx-60,ty-th+10);
  if(s.seen.dC) g+=`<path d="M395 158 Q470 170 556 182" stroke="var(--blue)" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/><text x="552" y="174" text-anchor="end" style="font-size:10px;fill:var(--blue)">TO THE SEA →</text>`;
  if(s.seen.dDt){const[x,y]=PLACES.market;g+=`<g fill="var(--ink)" opacity=".28">${[-24,-6,12].map(d=>`<path d="M${x+d} ${y-6} h16 l-3 -8 h-10 z"/><rect x="${x+d+1}" y="${y-6}" width="14" height="8"/>`).join("")}</g>`}
  if(s.seen.dDw){const[x,y]=PLACES.market;g+=`<rect x="${x-26}" y="${y-14}" width="52" height="16" fill="none" stroke="var(--red)" stroke-dasharray="3 2"/><text x="${x}" y="${y-3}" text-anchor="middle" style="font-size:7px;fill:var(--red)">TOWER II</text>`}
  g+=Object.entries(PLACES).map(([k,[x,y,n]])=>{const here=k===cur&&!sc.end;
    return `<g>${here?`<circle cx="${x}" cy="${y}" r="11" fill="var(--red)" opacity=".18"/>`:""}<circle cx="${x}" cy="${y}" r="${k==="post"?6:4.5}" fill="${k==="post"?"var(--red)":here?"var(--red)":"var(--paper)"}" stroke="var(--ink)" stroke-width="1.4"/><text x="${k==="hill"?x-16:x}" y="${k==="hill"?y+38:y+17}" text-anchor="${k==="hill"?"end":"middle"}" style="font-size:12.5px">${n}</text></g>`}).join("");
  document.getElementById("map").innerHTML=`<svg viewBox="0 0 560 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of Varrow-on-Lune showing what your deliveries have changed">${g}</svg>`;
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){const v=d&&d.state&&S[d.state.scene]?d:restore();state=v&&v.state?v.state:fresh();history=v&&Array.isArray(v.history)?v.history:[];state.fresh=false;render(false)}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>
