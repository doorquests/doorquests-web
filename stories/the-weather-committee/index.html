<style>
/* Layout: the forecast board (Mon–Sat, chalk pictograms) under the title; the Chamber (motion, speeches, rulings with effect tags); the Committee moods, the Sky's stores and the Minutes alongside. */
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#2a2733; --muted:#6c6878; --line:#ddd6c8;
  --board:#2f4a3e; --chalk:#f3f1e8; --accent:#e0533d; --accent-soft:rgba(224,83,61,.09); --sun:#f2b632; --rain:#3f86c6; --snow:#b9d6ee; --fog:#a9a6b3; --good:#2f8a5b; --good-soft:rgba(47,138,91,.1);
  --display:"Bagel Fat One","Cooper Black",Georgia,serif; --body:"Nunito",system-ui,sans-serif; --type:"Special Elite","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161c; --card:#211f28; --ink:#ece9f2; --muted:#a8a3b6; --line:#36333f;
  --board:#1f3329; --accent:#ff7a63; --accent-soft:rgba(255,122,99,.1); --good:#6fd39c; --good-soft:rgba(111,211,156,.1); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161c; --card:#211f28; --ink:#ece9f2; --muted:#a8a3b6; --line:#36333f;
  --board:#1f3329; --accent:#ff7a63; --accent-soft:rgba(255,122,99,.1); --good:#6fd39c; --good-soft:rgba(111,211,156,.1); color-scheme:dark}

html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.62;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}

.mast{max-width:1060px;margin:0 auto 26px}
.mast .pre{font-family:var(--type);font-size:.86rem;color:var(--muted);margin:0;text-align:center}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,9vw,5rem);line-height:.95;margin:4px 0 18px;text-align:center;color:var(--accent);letter-spacing:.01em}
.board{background:var(--board);border:8px solid #8a6a45;border-radius:6px;padding:12px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.day{border:1.5px dashed rgba(243,241,232,.35);border-radius:4px;padding:6px 4px 8px;text-align:center;color:var(--chalk);min-width:0}
.day.now{border-style:solid;border-color:var(--sun)}
.day .d{font-family:var(--type);font-size:.8rem;letter-spacing:.06em;opacity:.85}
.day svg{display:block;width:56%;max-width:56px;margin:4px auto 2px;height:auto}
.day .w{font-size:.72rem;line-height:1.15;opacity:.9;min-height:2.3em}
.day.empty .w{opacity:.45}
@media (max-width:520px){.board{gap:4px;padding:8px;border-width:6px}.day .w{display:none}.day svg{width:78%}}

.wrap{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:46px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);gap:32px}}
main{min-width:0}
.meta{font-family:var(--type);font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-bottom:2px}
.meta b{color:var(--accent);font-weight:400}
h2.scene-title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,2.9rem);line-height:1.02;margin:0 0 16px;color:var(--ink)}
.passage{max-width:62ch}
.passage p{margin:0 0 1em}
.result{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;margin:0 0 1.3em;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:60ch}
.result svg{width:52px;height:52px;background:var(--board);border-radius:8px;padding:4px;box-sizing:border-box}
.result .h{display:block;font-family:var(--type);font-size:.8rem;color:var(--muted)}
.result .vote{display:block;font-family:var(--type);font-size:.8rem;margin-top:4px;color:var(--good)}
.result .vote.nay{color:var(--accent)}
.speech{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start;margin:0 0 1em;max-width:60ch}
.speech svg{width:48px;height:48px}
.speech .b{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 14px;line-height:1.5}
.speech .b b{display:block;font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:.02em}
.doc{display:block;margin:0 0 1.2em;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);font-family:var(--type);font-size:.95rem;line-height:1.55;max-width:56ch}
.doc .h{display:block;font-size:.8rem;color:var(--accent);margin-bottom:4px}
.fade{animation:pop .35s ease both}
@keyframes pop{from{opacity:.3;transform:scale(.995)}to{opacity:1;transform:none}}

.choices{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:10px;max-width:62ch}
.choice{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;
  background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 14px 10px 10px;
  font:inherit;font-size:1rem;line-height:1.4;cursor:pointer;transition:border-color .15s,transform .15s}
.choice .ic{width:44px;height:44px;border-radius:8px;background:var(--board);display:grid;place-items:center;position:relative}
.choice .ic svg{width:34px;height:34px}
.choice .ic .k{position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.choice .fx{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.choice .fx span{font-size:.74rem;font-weight:700;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted)}
.choice .fx .up{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.choice .fx .dn{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.choice .fx .nt{color:var(--ink)}
.choice:hover{border-color:var(--accent);transform:translateY(-1px)}
.choice:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hint{font-family:var(--type);font-size:.82rem;color:var(--muted);margin-top:14px}
.tools{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;font-family:var(--type);font-size:.86rem;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--accent)}
.link:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.link[disabled]{opacity:.4;cursor:default;text-decoration:none}

aside{min-width:0;display:grid;gap:26px}
aside h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;line-height:1;color:var(--ink)}
aside .sub{font-family:var(--type);font-size:.8rem;color:var(--muted);margin:4px 0 12px}
.members{display:grid;gap:8px}
.mem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px}
.mem svg{width:40px;height:40px}
.mem .nm{font-weight:800;font-size:.92rem;line-height:1.15}
.mem .wt{font-size:.76rem;color:var(--muted);line-height:1.2}
.hearts{display:flex;gap:2px}
.hearts i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.hearts i.on{background:var(--good)}
.hearts.low i.on{background:var(--accent)}
.sky{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px}
.sky .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:800;font-size:.9rem}
.sky .row span:last-child{font-weight:400;color:var(--muted);font-size:.85rem}
.barrel{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:5px}
.barrel i{height:16px;border-radius:50% 50% 40% 40%;background:var(--line)}
.barrel i.on{background:var(--fog)}
.barrel.low i.on{background:var(--accent)}
.blocks{display:flex;gap:6px;margin-top:5px}
.blocks i{width:24px;height:20px;border-radius:3px;border:1.5px solid var(--snow);background:transparent}
.blocks i.on{background:var(--snow)}
.gavels{display:flex;gap:4px;margin-top:5px;font-size:1.05rem;line-height:1}
.gavels span{opacity:.2}.gavels span.on{opacity:1}
.knows{font-size:.84rem;color:var(--muted);line-height:1.4}
.knows b{color:var(--good)}
.minutes{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-family:var(--type);font-size:.85rem;line-height:1.45}
.minutes li{border-left:3px solid var(--line);padding-left:10px}
.minutes li b{font-weight:400;color:var(--accent)}
.minutes li.none{color:var(--muted)}

.ending-card{margin-top:26px;border:3px solid var(--accent);border-radius:14px;background:var(--card);padding:20px;max-width:62ch}
.ending-card .label{font-family:var(--type);font-size:.84rem;color:var(--good);margin:0 0 4px}
.ending-card h4{font-family:var(--display);font-weight:400;font-size:2.4rem;color:var(--accent);margin:0 0 12px;line-height:1}
.endings{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:.94rem}
@media (max-width:480px){.endings{grid-template-columns:minmax(0,1fr)}}
.endings li{color:var(--muted)}
.endings li.got{color:var(--ink);font-weight:700}
.endings li.got::before{content:"☀ ";color:var(--sun)}
.endings li:not(.got)::before{content:"☁ "}
.endnote{font-family:var(--type);font-size:.84rem;color:var(--muted);margin:0 0 16px;line-height:1.6}
.begin{font-family:var(--display);font-size:1.15rem;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 22px;cursor:pointer}
.begin:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.choice:hover{transform:none}}
/* The Axiom Continuum publisher identity */
.tac-brand{max-width:1060px;margin:0 auto 22px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font:700 .82rem var(--body);color:var(--muted)}
.tac-brand a{color:inherit;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.tac-brand a:hover{text-decoration:underline}
.tac-brand img{width:28px;height:28px}
.ref-fold{margin:0;min-width:0}
.ref-fold>summary{display:none;cursor:pointer}
@media(max-width:900px){.ref-fold{border:1px solid var(--line);border-radius:10px;padding:12px}.ref-fold>summary{display:list-item;font:700 1.08rem var(--body);margin:0 0 6px 16px}.ref-fold:not([open])>summary{margin-bottom:0}.ref-fold>summary+div{padding-top:8px}}
@media(min-width:901px){.ref-fold:not([open])>div{display:block!important}}
</style>
</head><body>
<div class="tac-brand"><a href="/"><img src="/assets/doorquests-icon.svg" alt="" width="28" height="28"><span>DoorQuests</span></a><span>· Daily Door #25</span></div>
<header class="mast">
  <p class="pre">The Kingdom of Little Mizzle · Population 412 · Daily Door No. 25</p>
  <h1>The Weather Committee</h1>
  <div class="board" id="board" aria-label="This week's forecast"></div>
</header>

<div class="wrap">
  <main id="main" aria-live="polite"></main>
  <aside>
    <details class="ref-fold" open><summary>The Committee</summary><div><h3>The Committee</h3><p class="sub">How pleased each member is with you</p><div class="members" id="members"></div></div></details>
    <details class="ref-fold" open><summary>The Sky</summary><div><h3>The Sky</h3><p class="sub">What Granny Nimbus has to work with</p><div class="sky" id="sky"></div></div></details>
    <details class="ref-fold" open><summary>The Minutes</summary><div><h3>The Minutes</h3><p class="sub">Hereby resolved</p><ul class="minutes" id="minutes"></ul></div></details>
  </aside>
</div>

<script>
/* ---------- weather pictograms ---------- */
const C={sun:"#f2b632",rain:"#3f86c6",snow:"#e8f2fb",fog:"#c9c6d2",cloud:"#e6e3ea",dark:"#9c98a8",chalk:"#f3f1e8",green:"#7ccf8e"};
const sunG=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${C.sun}"/>${[...Array(8)].map((_,i)=>{const a=i*Math.PI/4;return `<line x1="${x+Math.cos(a)*(r+3)}" y1="${y+Math.sin(a)*(r+3)}" x2="${x+Math.cos(a)*(r+7)}" y2="${y+Math.sin(a)*(r+7)}" stroke="${C.sun}" stroke-width="2.4" stroke-linecap="round"/>`}).join("")}`;
const cloudG=(x,y,s,c)=>`<path d="M${x-14*s} ${y+6*s} a${7*s} ${7*s} 0 0 1 ${2*s} ${-13*s} a${9*s} ${9*s} 0 0 1 ${17*s} ${-3*s} a${7*s} ${7*s} 0 0 1 ${9*s} ${16*s} z" fill="${c||C.cloud}"/>`;
const rainG=(x,y)=>[0,1,2].map(i=>`<line x1="${x-8+i*8}" y1="${y}" x2="${x-11+i*8}" y2="${y+8}" stroke="${C.rain}" stroke-width="2.6" stroke-linecap="round"/>`).join("");
const snowG=(x,y)=>[0,1,2].map(i=>`<text x="${x-9+i*9}" y="${y+8}" font-size="10" fill="${C.snow}" text-anchor="middle">✱</text>`).join("");
const fogG=(y)=>[0,1,2].map(i=>`<line x1="${8+i*3}" y1="${y+i*6}" x2="${40-i*2}" y2="${y+i*6}" stroke="${C.fog}" stroke-width="3" stroke-linecap="round"/>`).join("");
const windG=(y)=>`<path d="M6 ${y} h22 a5 5 0 1 0 -5 -5" stroke="${C.chalk}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M6 ${y+8} h30 a5 5 0 1 1 -5 5" stroke="${C.chalk}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
const ICON={
 sun:()=>sunG(24,24,9),
 rain:()=>cloudG(24,22,1)+rainG(24,30),
 rainsun:()=>sunG(31,15,6)+cloudG(22,24,1)+rainG(22,32),
 snow:()=>cloudG(24,22,1)+snowG(24,30),
 fog:()=>fogG(16),
 snowfog:()=>`<text x="15" y="22" font-size="14" fill="${C.snow}" text-anchor="middle">✱</text>`+fogG(28).replace(/x1="8"/,'x1="20"'),
 breeze:()=>windG(18),
 calm:()=>`<path d="M8 30 h32" stroke="${C.chalk}" stroke-width="2.4" stroke-linecap="round"/>`+sunG(24,18,5),
 breezecalm:()=>windG(14)+`<path d="M8 38 h32" stroke="${C.chalk}" stroke-width="2" stroke-dasharray="3 3"/>`,
 grey:()=>cloudG(18,22,.9,C.dark)+cloudG(30,28,.9,C.dark),
 borrowed:()=>cloudG(24,22,1,"#d7b7e8")+rainG(24,30),
 sleet:()=>cloudG(24,22,1,C.dark)+`<line x1="16" y1="31" x2="13" y2="39" stroke="${C.rain}" stroke-width="2.4"/><text x="27" y="40" font-size="10" fill="${C.snow}">✱</text>`,
 gale:()=>windG(14)+windG(28),
 grand:()=>`<path d="M6 34 a18 18 0 0 1 36 0" stroke="#e0533d" stroke-width="2.5" fill="none"/><path d="M10 34 a14 14 0 0 1 28 0" stroke="${C.sun}" stroke-width="2.5" fill="none"/><path d="M14 34 a10 10 0 0 1 20 0" stroke="${C.green}" stroke-width="2.5" fill="none"/><path d="M18 34 a6 6 0 0 1 12 0" stroke="${C.rain}" stroke-width="2.5" fill="none"/>`,
 none:()=>`<text x="24" y="31" font-size="18" fill="${C.chalk}" opacity=".5" text-anchor="middle">?</text>`
};
const icon=(k)=>`<svg viewBox="0 0 48 48" aria-hidden="true">${(ICON[k]||ICON.none)()}</svg>`;
const WNAME={sun:"Sunshine",rain:"Rain, buckets",rainsun:"Rain, then sun",snow:"Snow (in June)",fog:"Thick fog",snowfog:"Snow & fog, by street",breeze:"Drying breeze",calm:"Flat calm",breezecalm:"Breeze, then calm",grey:"Nothing at all",borrowed:"A borrowed cloud",sleet:"Sleet",gale:"A gale",grand:"Everything, by the hour"};

/* ---------- the committee ---------- */
const M={
 F:{n:"Mrs. Agatha Pumble",short:"Pumble",role:"Turnip Growers' Guild",wants:"Rain",col:"#5c9a4d",hat:"straw"},
 L:{n:"Mr. Horace Wringle",short:"Wringle",role:"The Laundry Collective",wants:"A drying breeze",col:"#4a7fc1",hat:"peg"},
 K:{n:"Tilly Ott, aged nine",short:"Tilly",role:"Children's Delegate",wants:"SNOW",col:"#e27aa5",hat:"bobble"},
 B:{n:"Old Barnaby Scrimm",short:"Barnaby",role:"Fishermen of the Harbour",wants:"A good thick fog",col:"#2f4a6e",hat:"souwester"},
 W:{n:"Lady Fennick",short:"Fennick",role:"Mother of the Bride",wants:"Sun on Saturday",col:"#8a5bb5",hat:"feather"}
};
function face(k,mood){const m=M[k];const smile=mood>=3?"M17 29 q7 6 14 0":mood>=2?"M17 30 h14":"M17 32 q7 -6 14 0";
  let hat="";
  if(m.hat==="straw") hat=`<ellipse cx="24" cy="13" rx="19" ry="4" fill="#e3c372"/><path d="M14 13 q10 -14 20 0" fill="#e3c372"/>`;
  if(m.hat==="peg") hat=`<path d="M12 14 q12 -12 24 0" fill="#57412f"/><rect x="33" y="30" width="3" height="10" rx="1" fill="#c9a26b"/>`;
  if(m.hat==="bobble") hat=`<path d="M12 15 q12 -14 24 0 z" fill="${m.col}"/><circle cx="24" cy="4" r="4" fill="#fff"/>`;
  if(m.hat==="souwester") hat=`<path d="M8 16 q16 -16 32 0 l-2 3 h-28 z" fill="#f2c12e"/>`;
  if(m.hat==="feather") hat=`<path d="M14 14 q10 -10 20 0 z" fill="${m.col}"/><path d="M30 10 q10 -12 4 -8 q-4 2 -4 8" fill="#e8d36a"/>`;
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="15" fill="#f2d3b5"/><circle cx="19" cy="23" r="1.8" fill="#2a2733"/><circle cx="29" cy="23" r="1.8" fill="#2a2733"/><path d="${smile}" stroke="#2a2733" stroke-width="2" fill="none" stroke-linecap="round"/>${hat}</svg>`;}
const granny=`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="15" fill="#efd0b4"/><circle cx="19" cy="24" r="4" fill="none" stroke="#2a2733" stroke-width="1.4"/><circle cx="29" cy="24" r="4" fill="none" stroke="#2a2733" stroke-width="1.4"/><path d="M18 32 q6 4 12 0" stroke="#2a2733" stroke-width="2" fill="none"/><path d="M9 20 q15 -22 30 0 q-6 -6 -15 -6 q-9 0 -15 6" fill="#e9e6ef"/></svg>`;
const say=(k,t,mood)=>`<span class="speech">${k==="G"?granny:face(k,mood??3)}<span class="b"><b>${k==="G"?"Granny Nimbus · The Weatherhouse":M[k].n}</b>${t}</span></span>`;
const doc=(h,t)=>`<span class="doc"><span class="h">${h}</span>${t}</span>`;

/* ---------- rulings ---------- */
const R={
 monRain:{d:0,w:"rain",fx:{F:2,L:-2,c:-3},min:"That it shall rain on Monday. Buckets.",res:`It rained on Monday, buckets. Mrs. Pumble danced in her turnip field. Mr. Wringle's washing hung on the line all day getting steadily wetter, like a flag of surrender.`},
 monSun:{d:0,w:"sun",fx:{L:2,F:-2,c:2},min:"That Monday shall be sunny, for the washing.",res:`Monday was glorious. Mr. Wringle's sheets dried so fast they crackled. Mrs. Pumble stood in the middle of her field and glared at the sky for nine hours without blinking.`},
 monHours:{d:0,w:"rainsun",fx:{F:1,L:1,c:-2,g:1},min:"That it shall rain from midnight till nine, and be fair and breezy thereafter.",res:`It rained from midnight till nine, then the sun came out and the wind got up. The turnips drank. The sheets were dry by four. Both Pumble and Wringle are claiming it as a personal victory, which is the best kind of compromise.`},
 monCoin:{d:0,w:"rain",fx:{F:2,L:-2,c:-3,g:-1},min:"That the Royal Coin be flipped. (Heads: rain.)",res:`You flipped the Royal Coin. Heads: rain. The committee was not impressed by the procedure. Mr. Wringle has filed a formal complaint about the coin.`},
 tueSnow:{d:1,w:"snow",fx:{K:3,B:-1,F:-1,ice:-1,c:-2},min:"That it shall snow on Tuesday. In June. (Moved by T. Ott, aged 9.)",res:`It snowed on Tuesday, in the middle of June, to a depth of eleven inches. Every child in Little Mizzle was outside by six a.m. Barnaby's boats froze to the quay, and Mrs. Pumble's turnips have gone into a sulk.`},
 tueFog:{d:1,w:"fog",fx:{B:2,K:-2},min:"That Tuesday shall be foggy, for the herring.",res:`A fog came in off the sea so thick you could lean on it. The herring practically jumped into Barnaby's nets. Tilly Ott has written you a letter in purple crayon. It is not friendly.`},
 tueStreets:{d:1,w:"snowfog",fx:{K:2,B:2,ice:-1,c:-1,g:1},min:"That snow shall fall upon the School Playground only, and fog upon the Harbour only, per Article 9.",res:`Snow fell on the school playground and nowhere else, to a depth of exactly one snowman. Down at the harbour a fog came in thick as porridge, and the herring came with it. Two streets apart, two delegates are, for once, delighted.`},
 tueCoin:{d:1,w:"sleet",fx:{K:-1,B:-1,g:-1},min:"That the Royal Coin be flipped. (It landed on its edge.)",res:`The coin landed on its edge. Granny Nimbus, reading the minutes, interpreted this as sleet. Nobody, in the whole history of Little Mizzle, has ever wanted sleet.`},
 wedGrey:{d:2,w:"grey",fx:{c:4,L:-1,K:-1},min:"That Wednesday shall have no weather whatsoever, so the barrel may refill.",res:`Wednesday had no weather at all. Not grey, exactly; just nothing, like a held breath. The barrel filled back up. Mr. Wringle said it was "the most pointless day of his life," and Tilly agreed, which has never happened before.`},
 wedBorrow:{d:2,w:"borrowed",fx:{c:5,F:1,g:-1},flag:"borrowed",min:"That one (1) cloud be borrowed from the Duchy of Gloam, to be returned in due course.",res:`You borrowed a cloud from the Duchy of Gloam next door. It rained a little, in a foreign accent. The Duchess of Gloam has sent a strongly worded letter and an invoice.`},
 wedSun:{d:2,w:"sun",fx:{c:3,B:-1,L:1},min:"That Wednesday be hot and still, that the lake may evaporate back into the barrel.",res:`Wednesday was hot and still. The lake went down an inch, and the barrel went up three. Barnaby says the fish have all gone to the bottom "in protest."`},
 thuBreeze:{d:3,w:"breeze",fx:{L:2,B:-2},min:"That Thursday shall have a good drying breeze.",res:`A brisk breeze all day. Every washing line in Little Mizzle stood out straight like a row of flags. Barnaby's boats bobbed about like corks, and so did Barnaby.`},
 thuCalm:{d:3,w:"calm",fx:{B:2,L:-1},min:"That Thursday shall be flat calm, for the boats.",res:`A flat calm, the sea like a pond. Barnaby had his best catch in years. Mr. Wringle's sheets hung limp all day "like defeated ghosts," he says.`},
 thuHours:{d:3,w:"breezecalm",fx:{L:1,B:1,g:1},min:"That there be a breeze until noon and a calm thereafter.",res:`A breeze till noon, then calm. The washing was dry by eleven. The boats went out at one. Mr. Wringle and Old Barnaby were seen, at the Drowned Duck, buying each other a drink.`},
 thuCoin:{d:3,w:"gale",fx:{L:-1,B:-2,g:-1},min:"That the Royal Coin be flipped. (Tails: a gale.)",res:`Tails. Granny Nimbus took "tails" to mean "a gale," and she wasn't wrong to. Mr. Wringle's sheets are now in the Duchy of Gloam. Barnaby lost a hat.`},
 friRain:{d:4,w:"rain",fx:{F:2,W:-2,c:-3},flag:"marquee",min:"That it shall rain on Friday, for the turnips' last drink before harvest.",res:`It rained on Friday. The turnips had their drink. The wedding marquee on the Green went up in the downpour and came down again at teatime, with a noise like a giant sitting on a whoopee cushion.`},
 friDry:{d:4,w:"sun",fx:{W:2,F:-1,c:2},min:"That Friday shall be dry, for the marquee.",res:`Friday was dry and the marquee went up beautifully, white and billowing on the Green. Mrs. Pumble says her turnips are "parched beyond speech," which is not a thing turnips can be.`},
 friStreets:{d:4,w:"rainsun",fx:{F:1,W:1,c:-2,g:1},min:"That rain shall fall upon the Fields, and not upon the Green, per Article 9.",res:`It rained on the fields and only on the fields, a neat grey curtain stopping exactly at the hedge. On the Green, ten yards away, the marquee went up in sunshine. People came from the Duchy of Gloam to stand at the hedge and put one hand in the rain and one hand out of it.`},
 friCoin:{d:4,w:"rain",fx:{F:1,W:-2,c:-3,g:-1},flag:"marquee",min:"That the Royal Coin be flipped. (It rolled under the dresser. Barnaby voted rain while everyone was looking for it.)",res:`The coin rolled under the dresser. While everybody was on their hands and knees looking for it, Barnaby called the vote for rain and won it four to nil. The marquee is in a puddle.`}
};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
const ENDINGS={E1:"A Rainbow for Everyone",E2:"Sunshine, Officially",E3:"The Barrel Runs Dry",E4:"Snow on the Wedding",E5:"Impeached",E6:"Whatever Happens"};
function fxTags(e){const t=[],sg=n=>n>0?"+"+n:"−"+Math.abs(n);
  ["F","L","K","B","W"].forEach(k=>{if(e[k])t.push([`${sg(e[k])} ${M[k].short}`,e[k]>0?"up":"dn"])});
  if(e.c)t.push([`${sg(e.c)} clouds`,e.c>0?"up":"dn"]);
  if(e.ice)t.push([`${sg(e.ice)} ice`,"dn"]);
  if(e.g)t.push([`${sg(e.g)} gravitas`,e.g>0?"up":"dn"]);
  return t;}
const lastRes=s=>s.last?`<span class="result">${icon(R[s.last].w)}<span><span class="h">Yesterday's weather · ${DAYS[R[s.last].d]}</span>${R[s.last].res}<span class="vote${s.ayes<3?" nay":""}">The committee voted ${s.ayes} to ${5-s.ayes} to approve the minutes.</span></span></span>`:"";

const S={
start:{t:`Your First Day as Speaker`,p:[
 `The Kingdom of Little Mizzle has four hundred and twelve people, a castle the size of a large barn, a harbour, some turnip fields, and an ancient, sacred, deeply inconvenient tradition: every morning, the Weather Committee votes on tomorrow's weather.`,
 `Up on Mizzle Hill, Granny Nimbus reads the minutes every evening and makes whatever they say, with a mangle, some buckets, a pair of bellows, an icehouse and a barrel of clouds.`,
 `The old Speaker of the Committee retired on Sunday, citing "nerves." You are the new one. On Saturday, Princess Posy marries a very nervous young man from the Duchy of Gloam, on the Green, outdoors.`,
 `Five delegates are already arguing in the chamber. You can hear them through the door.`],
 o:[[`Bang the gavel and open Monday's session`,`mon`],[`Read the Grand Almanac first`,`almanac`],[`Climb Mizzle Hill to the Weatherhouse first`,`granny`,{g:-1},`You'll be late`]]},

almanac:{t:`The Grand Almanac`,set:["streets"],p:[
 `The Grand Almanac of Little Mizzle, 1704, bound in calfskin and gravy. Most of it is about hats.`,
 doc(`Selected articles`,`Art. 1. The Committee shall vote upon the Weather each day.<br>Art. 4. There shall be no Weather upon the King's Birthday, out of respect.<br><b>Art. 9. Weather may be apportioned by Street, Parish, Field or Playground, at the Speaker's discretion.</b><br>Art. 12. In the event of an impasse, the Royal Coin.<br>Art. 31. Snow in June is permitted but frowned upon.`),
 `Article 9. Nobody's used Article 9 since 1711. You underline it twice.`],
 o:[[`Bang the gavel and open Monday's session`,`mon`],[`Climb Mizzle Hill to the Weatherhouse`,`granny`,{g:-1},`You'll be late`],[`Read Article 31 again, then open the session`,`mon`]]},

granny:{t:`The Weatherhouse`,set:["hours"],p:s=>[
 `The Weatherhouse is a crooked cottage at the very top of Mizzle Hill with a weathervane that turns in every direction at once. Granny Nimbus is inside, a hundred and something, mangling a small grey cloud.`,
 say("G",`Ooh, a new Speaker! Sit down, dearie, mind the drizzle. Do you know, every morning for three hundred years they've voted one weather for the whole day? Rain or shine, all day, as if the sky were a light switch. I can do it by the <i>hour</i>, love. Rain till nine, sun till four, a breeze at teatime. Nobody's asked since 1802.`),
 say("G",`And mind the barrel. ${s.c} clouds left of ten. Rain takes three, snow takes a cloud or two as well, and I can't make clouds out of nothing. Sunshine puts a bit back, mind: the lake goes up, see. And there's only two blocks of ice in the icehouse till winter, so snow's precious.`)],
 o:s=>[[`Hurry down to Monday's session`,`mon`],[`Ask her what she'd do about the wedding`,`granny2`],s.f.streets?[`Thank her and run`,`mon`]:[`Run down and read the Almanac on the way`,`almanac`]]},

granny2:{t:`"A Bit of Everything"`,p:[
 say("G",`The wedding? Oh, I'd give them a bit of everything, love, if I had the clouds and the ice to do it with. A shower first thing. Sun at noon. A rainbow after, that's rain and sun together, you see. But I'd need three clouds and a block of ice left in hand on Saturday, and I'd need the minutes to say so, hour by hour, street by street. And I'd need everybody to be <i>speaking</i> to each other by then. That's your job, not mine.`)],
 o:[[`Hurry down to Monday's session`,`mon`],[`Write it all down, then go`,`mon`],[`Promise her a rainbow, and run`,`mon`]]},

mon:{t:`Monday: Washday`,day:0,p:s=>[
 s.seen.granny?`You arrive twenty minutes late, out of breath. Mr. Wringle has been chairing in your absence. Badly.`:`You bang the gavel. The gavel's head flies off and hits a portrait of the King. The session is open.`,
 say("F",`Madam Speaker, the turnips are thirsty. I move that it rain on Monday. Buckets. Proper rain. Rain you could swim in.`,s.m.F),
 say("L",`Monday is WASHDAY. It has been washday since the Conquest. I will not have four hundred and twelve people's smalls rained upon.`,s.m.L)],
 o:s=>[[`Rule for rain, all day`,`tue`,"monRain"],[`Rule for sunshine, all day`,`tue`,"monSun"],s.f.hours?[`Rule: rain till nine, then sun and a breeze`,`tue`,"monHours"]:[`Flip the Royal Coin (Article 12)`,`tue`,"monCoin"]]},

tue:{t:`Tuesday: The Snow Question`,day:1,p:s=>[lastRes(s),
 say("K",`I move that it SNOWS. I have brought a petition. It has four hundred and twelve signatures, which is everyone, and some of them are my dog.`,s.m.K),
 say("B",`Snow in June? The child's mad. What the harbour needs is fog, Madam Speaker. A good thick fog. The herring won't come up in the sunshine, they're shy.`,s.m.B)],
 o:s=>[[s.ice>0?`Rule for snow, everywhere`:`Rule for snow (the icehouse is empty!)`,`wed`,s.ice>0?"tueSnow":"tueCoin"],[`Rule for fog, everywhere`,`wed`,"tueFog"],s.f.streets?[`Rule: snow on the playground, fog on the harbour (Article 9)`,`wed`,"tueStreets"]:[`Flip the Royal Coin (Article 12)`,`wed`,"tueCoin"]]},

wed:{t:`Wednesday: A Note from the Hill`,day:2,p:s=>[lastRes(s),
 `Before anyone can move anything, a pigeon lands on the table with a note from the Weatherhouse.`,
 doc(`From Granny Nimbus`,`Speaker, dear: the barrel is at ${s.c} of 10. ${s.c<=3?"That's very low indeed. ":""}If you want any rain or rainbows at the end of the week, you'll need to top it up. Your call, love. G.N.`),
 `For once, the committee is quiet. They're all looking at you.`],
 o:[[`Rule for a day of Nothing At All, to let the barrel fill`,`thu`,"wedGrey"],[`Borrow a cloud from the Duchy of Gloam`,`thu`,"wedBorrow"],[`Rule for hot sun, to evaporate the lake back up`,`thu`,"wedSun"]]},

thu:{t:`Thursday: The Wind Debate`,day:3,p:s=>[lastRes(s),
 say("L",`A drying breeze, Madam Speaker. Brisk. Westerly. It's the least the Committee owes the Laundry Collective after this week.`,s.m.L),
 say("B",`Breeze? I'll not have my boats bobbing about like apples in a barrel. Flat calm, if you please, Speaker. Like a millpond.`,s.m.B)],
 o:s=>[[`Rule for a drying breeze`,`fri`,"thuBreeze"],[`Rule for a flat calm`,`fri`,"thuCalm"],s.f.hours?[`Rule: breeze till noon, calm after`,`fri`,"thuHours"]:[`Flip the Royal Coin (Article 12)`,`fri`,"thuCoin"]]},

fri:{t:`Friday: The Marquee`,day:4,p:s=>[lastRes(s),
 say("F",`The turnips are lifted on Monday. They need one last drink tomorrow, Speaker, or they'll come out like wooden doorknobs.`,s.m.F),
 say("W",`The wedding marquee goes up on the Green on Friday. It is silk. It is from Gloam. If one drop of rain touches it, I will personally have Article 1 repealed.`,s.m.W)],
 o:s=>[[`Rule for rain`,`sat`,"friRain"],[`Rule for a dry day`,`sat`,"friDry"],s.f.streets?[`Rule: rain on the fields, dry on the Green (Article 9)`,`sat`,"friStreets"]:[`Flip the Royal Coin (Article 12)`,`sat`,"friCoin"]]},

sat:{t:`Saturday: The Wedding`,day:5,p:s=>{const a=[lastRes(s),`The last session of the week. Princess Posy marries at noon. Everyone is in the chamber, all five delegates, and the Princess herself, in curlers, and the very nervous young man from Gloam, holding a very small umbrella just in case.`];
  a.push(say("W",`Sun, Speaker. That is all I have ever asked. Sun.`,s.m.W));
  a.push(say("K",`But it's the LAST DAY and there hasn't been any ${s.forecast.includes("snow")||s.forecast.includes("snowfog")?"MORE ":""}snow.`,s.m.K));
  if(grandOK(s)) a.push(`You think about what Granny Nimbus said. A bit of everything. You have the clouds, the ice, Article 9 and the hours.`);
  else if(s.f.hours&&s.f.streets) a.push(`You think about what Granny Nimbus said: a bit of everything. But ${s.c<3?"the barrel's too low for a rainbow":"the icehouse is empty"}.`);
  return a;},
 o:s=>{const o=[];
  if(grandOK(s)) o.push([`Rule: a dawn shower for the fields, mist on the harbour till eight, a breeze for the washing at ten, sun at noon, a rainbow at four, and one snowflake for every child at dusk`,allHappy(s)?`E1`:`E2`,"satGrand"]);
  else o.push([`Rule for sunshine, and that's final`,`E2`,"satSun"]);
  o.push(s.ice>0?[`Rule for snow. On the wedding. For Tilly.`,`E4`,"satSnow"]:[`Rule for rain, to spite everybody`,`E5`,"satRain"]);
  o.push(grandOK(s)?[`Rule for sunshine, and that's final`,`E2`,"satSun"]:[`Resign, and let the sky do as it likes`,`E6`,"satNone"]);
  return o;}},

E1:{end:true,best:true,t:`A Rainbow for Everyone`,p:s=>[
 `Granny Nimbus reads the minutes at dusk on Friday, laughs until she has to sit down, and gets to work.`,
 `At dawn a soft shower falls on the turnip fields, and Mrs. Pumble stands in it in her nightgown. Mist lies on the harbour till eight, and Barnaby's nets come up silver. At ten a breeze gets up just long enough for every washing line in Little Mizzle to dry. At noon the sun comes out over the Green, and Princess Posy marries her nervous young man under a silk marquee without a drop on it.`,
 `At four o'clock, while the cake is being cut, the rain comes back for exactly six minutes, and the sun stays out, and over the whole of Little Mizzle there's a rainbow so complete you can see both ends: one in Mrs. Pumble's field and one, unmistakably, in Barnaby's boat.`,
 `And at dusk, as the dancing starts, it snows. One snowflake for every child in the kingdom, individually addressed. Tilly catches hers on her tongue and declares the Committee "the best it's ever been."`,
 `The motion to approve the minutes passes five votes to nil, for the first time since 1711. Granny Nimbus sends down a note: *Same again next week, dear? G.N.*`]},

E2:{end:true,t:`Sunshine, Officially`,p:s=>{const sad=Object.keys(M).filter(k=>s.m[k]<=2).map(k=>M[k].short);
 const a=[`Saturday is sunny from end to end. Princess Posy marries her nervous young man on the Green, and it's lovely, and Lady Fennick cries into a lace handkerchief.`];
 a.push(sad.length?`But it's a wedding with a grudge or two at the edges. ${sad.join(", ")} ${sad.length===1?"sits":"sit"} at the back with arms folded and ${sad.length===1?"refuses":"refuse"} to dance${s.f.marquee?", in a marquee that still smells faintly of Friday's puddle":""}.`:`Everyone is reasonably pleased. Nobody is delighted.`);
 if(s.seen.sat&&grandOK(s)&&!allHappy(s)) a.push(`You tried for a bit of everything. Granny Nimbus did her best. But somebody on the committee wasn't speaking to anybody by Saturday, and a rainbow needs everyone looking up.`);
 if(s.f.borrowed) a.push(`On Monday, the Duchess of Gloam's invoice for one (1) cloud arrives, with interest.`);
 a.push(`*Sun for the wedding is the easy answer. The truest ending gives everyone a bit of what they asked for: learn Article 9 and the hours, keep the barrel and the icehouse stocked, and keep the whole committee happy.*`);
 return a;}},

E3:{end:true,t:`The Barrel Runs Dry`,p:s=>[
 `Granny Nimbus sends down a pigeon on ${DAYS[Math.min(s.day,5)]} afternoon with a very short note: *Barrel's empty, love. G.N.*`,
 `There is no rain in Little Mizzle after that. Not for the turnips, not for the wedding, not for anything. Day after day, blue sky, hard sun. Princess Posy gets married in the Great Hall with the curtains drawn. Mrs. Pumble's turnips come out the size of marbles.`,
 `*Rain takes three clouds and snow takes some too, and sunshine only gives a few back. Watch the barrel.*`]},

E4:{end:true,t:`Snow on the Wedding`,p:s=>[
 `It snows on Saturday. In June. On the wedding. Eleven inches, by noon.`,
 `Lady Fennick faints into the cake. But Princess Posy, it turns out, has always secretly wanted a winter wedding. She arrives on a sledge pulled by the Royal Goat, the nervous young man from Gloam throws the first snowball, and the reception becomes the largest snowball fight in the history of Little Mizzle.`,
 `Tilly Ott is made a Dame. Mrs. Pumble's turnips are frozen solid, and so is Barnaby's boat. Everybody agrees it was a wedding nobody will ever forget, for one reason or another.`,
 `*Joyful, ridiculous, and not quite fair. The truest ending gives Tilly her snow and Lady Fennick her sunshine.*`]},

E5:{end:true,t:`Impeached`,p:s=>[
 `${s.last==="satRain"?"You rule for rain on the wedding. There's a long, awful silence.":"By "+DAYS[Math.min(s.day,5)]+", the committee has had enough of you."} Mrs. Pumble rises. Mr. Wringle seconds. ${Object.keys(M).filter(k=>s.m[k]<=0).map(k=>M[k].short).join(" and ")||"Everyone"} ${Object.keys(M).filter(k=>s.m[k]<=0).length===1?"has":"have"} already walked out.`,
 `"I move," says Mrs. Pumble, "that the Speaker be impeached." For the first time all week, the vote is unanimous.`,
 `The Royal Coin is appointed Speaker in your place. It does about as well as you did.`,
 `*Let two delegates hit rock bottom, or squander your gravitas on coin tosses and borrowed clouds, and the committee turns on you.*`]},

E6:{end:true,t:`Whatever Happens`,p:s=>[
 `You put down the gavel and resign. "Let the sky do as it likes," you say, and walk out into the street.`,
 `For the first time in three hundred years, nobody tells Granny Nimbus what to do. She makes herself a cup of tea, puts her feet up, and lets the weather happen.`,
 `It's drizzle, mostly. Little Mizzle is, after all, named for it. The wedding is held under umbrellas. Everybody complains, but nobody can complain to anyone, and after a while they find they don't mind as much as they expected.`,
 `*Sometimes the best ruling is none at all. But the truest ending finds a bit of everything for everyone.*`]}
};
R.satGrand={d:5,w:"grand",fx:{F:1,L:1,K:1,B:1,W:1,c:-3,ice:-1,g:1},min:"That Saturday shall have, in order: a dawn shower (Fields), mist (Harbour) till eight, a breeze (washing lines) at ten, sun (Green) at noon, a rainbow (everywhere) at four, and one snowflake per child at dusk.",res:""};
R.satSun={d:5,w:"sun",fx:{W:2,K:-1},min:"That Saturday shall be sunny. Final.",res:""};
R.satSnow={d:5,w:"snow",fx:{K:3,W:-3,ice:-1},min:"That it shall snow upon the Royal Wedding.",res:""};
R.satRain={d:5,w:"rain",fx:{F:1,W:-5,c:-3},min:"That it shall rain upon the Royal Wedding.",res:""};
R.satNone={d:5,w:"none",fx:{},min:"The Speaker resigns. The sky shall do as it likes.",res:""};
function grandOK(s){return s.f.hours&&s.f.streets&&s.c>=3&&s.ice>=1}
function allHappy(s){return Object.keys(M).every(k=>s.m[k]>=3)}

/* ---------- engine ---------- */
const SAVE_KEY="tac-weather-committee-daily-door-v1";
let state,history=[];
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return x&&x.state&&S[x.state.scene]&&Array.isArray(x.history)?x:null}catch(e){return null}}
const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,m:{F:3,L:3,K:3,B:3,W:3},c:4,ice:2,g:3,day:0,forecast:[],minutes:[],last:null,ayes:0});
const val=(x,s)=>typeof x==="function"?x(s):x;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function loadE(){try{return JSON.parse(localStorage.getItem("weather-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("weather-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function applyFx(s,e){
  ["F","L","K","B","W"].forEach(k=>{if(e[k])s.m[k]=clamp(s.m[k]+e[k],0,5)});
  if(e.c)s.c=Math.min(10,s.c+e.c); if(e.ice)s.ice=Math.max(0,s.ice+e.ice); if(e.g)s.g=clamp(s.g+e.g,0,5);
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  let [,to,x]=opt;
  if(typeof x==="string"){const r=R[x];applyFx(state,r.fx);if(r.flag)state.f[r.flag]=1;state.forecast[r.d]=r.w;state.minutes.push({d:r.d,t:r.min});state.last=x;state.day=r.d+1;
    state.ayes=Object.keys(M).filter(k=>state.m[k]>=3).length;
    if(state.c<0){state.c=0;to="E3"}
    else if(state.g<=0||Object.keys(M).filter(k=>state.m[k]<=0).length>=2) to="E5";
  } else if(x) applyFx(state,x);
  const sc=S[to];
  state.scene=to; state.n++; state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  persist();render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).filter(Boolean).map(t=>/^<span class="(result|speech|doc)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span><b>${sc.end?"Session closed":sc.day!=null?"In session":"Before the session"}</b></span><span>${sc.day!=null?["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][sc.day]+"'s motion":"Midsummer week"}</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="endnote">Moods: ${Object.keys(M).map(k=>M[k].short+" "+state.m[k]).join(" · ")}<br>Barrel ${state.c}/10 · ice ${state.ice} · gravitas ${state.g}.${sc.best?"":"<br>The truest ending: find Article 9 and the hours, keep three clouds and a block of ice for Saturday, and keep all five delegates at three hearts or more."}</p>
     <button class="begin" id="again">Convene a new week</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>{const r=typeof o[2]==="string"?R[o[2]]:null;const e=r?r.fx:(o[2]||{});const tags=fxTags(e);if(o[3])tags.push([o[3],"nt"]);
      return `<li><button class="choice" data-i="${i}"><span class="ic"><span class="k">${i+1}</span>${icon(r?r.w:"none")}</span><span>${smart(o[0])}${tags.length?`<span class="fx">${tags.map(([t,c])=>`<span class="${c}">${smart(t)}</span>`).join("")}</span>`:""}</span></button></li>`}).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to rule</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".wrap");if(window.scrollY>top.offsetTop)window.scrollTo({top:top.offsetTop-10,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const s=state, sc=S[s.scene];
  document.getElementById("board").innerHTML=DAYS.map((d,i)=>{const w=s.forecast[i];const now=!sc.end&&sc.day===i;
    return `<div class="day${w?"":" empty"}${now?" now":""}"><div class="d">${d}</div>${icon(w||"none")}<div class="w">${w?WNAME[w]||"No ruling":now?"Today's motion":i===5?"The wedding":"Undecided"}</div></div>`}).join("");
  document.getElementById("members").innerHTML=Object.keys(M).map(k=>{const v=s.m[k];
    return `<div class="mem">${face(k,v)}<div><div class="nm">${M[k].n}</div><div class="wt">${M[k].role} · wants <b>${M[k].wants}</b></div></div><div class="hearts${v<=1?" low":""}" aria-label="${v} of 5">${[0,1,2,3,4].map(i=>`<i class="${i<v?"on":""}"></i>`).join("")}</div></div>`}).join("");
  document.getElementById("sky").innerHTML=`
   <div><div class="row"><span>The Cloud Barrel</span><span>${s.c} of 10 · rain costs 3</span></div><div class="barrel${s.c<3?" low":""}">${[...Array(10)].map((_,i)=>`<i class="${i<s.c?"on":""}"></i>`).join("")}</div></div>
   <div><div class="row"><span>The Icehouse</span><span>${s.ice} block${s.ice===1?"":"s"} · snow costs 1</span></div><div class="blocks">${[0,1].map(i=>`<i class="${i<s.ice?"on":""}"></i>`).join("")}</div></div>
   <div><div class="row"><span>Your Gravitas</span><span>${s.g} of 5</span></div><div class="gavels" aria-hidden="true">${[0,1,2,3,4].map(i=>`<span class="${i<s.g?"on":""}">🔨</span>`).join("")}</div></div>
   <div class="knows">${s.f.streets?"<b>✓ Article 9:</b> weather by street.":"Article 9: <i>unread</i>."}<br>${s.f.hours?"<b>✓ The hours:</b> weather by the hour.":"The hours: <i>unknown</i>."}</div>`;
  document.getElementById("minutes").innerHTML=s.minutes.length?s.minutes.map(m=>`<li><b>${DAYS[m.d]}.</b> ${smart(m.t)}</li>`).join(""):`<li class="none">No resolutions yet.</li>`;
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){const saved=d&&d.state&&S[d.state.scene]?d:restore();state=saved?saved.state:fresh();history=saved?saved.history:[];render(false);persist();
  if(matchMedia("(max-width:900px)").matches)document.querySelectorAll(".ref-fold").forEach(x=>x.open=false);
}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
