<script>
/* parts: sole, upper, lining, charm. Each option: id, label, colour, property */
const MAT={
 moss:{name:"Moss-felt from the Old Well",col:"#5f7d47",prop:"quiet",part:"sole"},
 leather:{name:"Plain stitched leather",col:"#8a6a4a",prop:"plain",part:"sole"},
 iron:{name:"Oak-tanned leather, iron-tacked",col:"#6b4e36",prop:"iron",part:"sole"},
 cork:{name:"Cork from the inn's old barrels",col:"#c9a26b",prop:"squeak",part:"sole"},
 clover:{name:"Clover-silk, woven from dried June clover",col:"#b77fb0",prop:"june",part:"upper"},
 velvet:{name:"Crimson velvet from the Squire's curtains",col:"#9e1f3a",prop:"grand",part:"upper"},
 calf:{name:"Plain calfskin",col:"#c8a882",prop:"plain",part:"upper"},
 felt:{name:"Grey felt from an old hat",col:"#8d8f8c",prop:"plain",part:"upper"},
 wool:{name:"Wool from Widow Brannagh's black ewe",col:"#3a3530",prop:"warm",part:"lining"},
 thistle:{name:"Thistledown",col:"#efece4",prop:"itchy",part:"lining"},
 linen:{name:"Plain linen",col:"#ddd2bd",prop:"plain",part:"lining"},
 flannel:{name:"Red flannel from the rag bag",col:"#b4443c",prop:"plain",part:"lining"},
 bell:{name:"A tiny silver bell",col:"#c9ccd2",prop:"showy",part:"charm"},
 rosemary:{name:"A sprig of rosemary",col:"#6f8f6a",prop:"remember",part:"charm"},
 button:{name:"Gran's brave button",col:"#b8862d",prop:"brave",part:"charm"}
};
const GATHER=["moss","wool","clover"];
const LORE=[
 ["scratched","The Prince wrote 'brave', then scratched it out and wrote 'best'."],
 ["fair","Gran's pattern book: never iron for the fair folk. And sew in a thing freely given, that meant something to you."],
 ["button","Gran's coat still hangs by the door. She always called its top button her brave button."],
 ["lonely","Widow Brannagh hasn't danced since her husband died. She says the Revel is lonely work for the one who leads it."],
 ["secret","At dusk, on the Hill, the Prince practises the Revel's first dance alone. He falls every time. He's terrified."]
];
const ENDINGS={E1:"The First Dance",E2:"Very Nearly Perfect",E3:"Squeak",E4:"The Grandest Slippers",E5:"Iron in the Sole",E6:"A Hundred Years in the Hill"};
const scroll=(h,t)=>`<span class="scroll"><span class="h">${h}</span>${t}</span>`;

const S={
start:{t:`A Commission`,tod:"Morning",p:[
 `The village of Whispering Hill is called that because of the hill. On still nights, if you put your ear to the grass, you can hear it murmuring: music, and laughter, and very small feet.`,
 `You are Wynn Abernethy, cobbler, third of your name. Your grandmother made shoes for the fair folk once, or so the village says. You mostly mend farmers' boots.`,
 `This morning a hedgehog in a little green tabard knocks on your shop door with his nose. He unrolls a scroll the size of a bay leaf and clears his throat.`,
 `"From His Highness Prince Thistlewick of the Hollow Court," says Bramble the hedgehog, "a commission. To be delivered at the Midwinter Revel. Tonight." He sniffs. "His Highness is very particular."`],
 o:[[`Read the commission carefully`,`commission`],[`Open Gran's old pattern book`,`gran`],[`Ask Bramble what the Prince is like`,`bramble`]]},

commission:{t:`The Riddle`,tod:"Morning",set:[`scratched`],p:[
 `The scroll is written in green ink, in a spiky, impatient hand.`,
 scroll(`By Order of Prince Thistlewick`,`Slippers for the Midwinter Revel, with:<br>Soles that make no sound upon the moon,<br>Uppers that remember June,<br>A lining warm as a hen's own breast,<br>And something sewn inside to make me <s>brave</s> BEST.<br><br>Fail, and the Hill shall whisper your name backwards for a hundred years, and every shoe in Whispering Hill shall pinch.`),
 `You look at the last line for a long time. *Brave* has been scratched out so hard the nib went through the paper.`],
 o:[[`Open Gran's old pattern book`,`gran`],[`Ask Bramble about the scratched-out word`,`bramble`],[`Take your basket and go gathering`,`village`]]},

gran:{t:`Gran's Pattern Book`,tod:"Morning",set:[`fair`,`button`],p:[
 `Gran's pattern book lives on the high shelf, wrapped in a tea towel. Most of it is ordinary: boot lasts, clog patterns, a recipe for wax polish. But there's a page at the back in green ink.`,
 scroll(`For the Fair Folk`,`Never iron. Not a tack, not a buckle. They cannot bear it.<br><br>Make it light and make it kind.<br><br>And always sew in one thing freely given, that meant something to you. They can tell. It's the only payment they truly understand.`),
 `On the peg by the door, where it's hung since the winter she died, is Gran's old blue coat. The top button is brass, worn smooth by a thumb. *My brave button,* she used to say, and rub it before she did anything hard.`],
 o:[[`Read the Prince's commission`,`commission`],[`Ask Bramble about the Prince`,`bramble`],[`Take your basket and go gathering`,`village`]]},

bramble:{t:`Bramble`,tod:"Morning",p:s=>[
 `Bramble accepts a saucer of milk and becomes noticeably less formal.`,
 `"Particular? He's a *terror*," he says. "Sent back eleven pairs. Said one pair was too green, one was too quiet, one looked at him funny." He lowers his voice. "Between you and me, it isn't really about the slippers."`,
 s.f.scratched?`"He wrote *brave*," you say. Bramble's spines rise slightly. "He'd have my quills for telling you. But tonight's his first Revel. The Prince leads the first dance. Always has. Every eye in the Hill on his feet."`:`"Then what is it about?" Bramble shakes his head. "Not my place. But it's his first Revel. And the Prince leads the first dance."`,
 `He hops down from the counter. "If you want to understand him, go up the Hill at dusk. Quietly."`],
 o:[[`Read the commission carefully`,`commission`],[`Open Gran's pattern book`,`gran`],[`Take your basket and go gathering`,`village`]]},

village:{t:`Gathering`,tod:"Midday",p:s=>{
 const a=[`You take your basket and walk out into Whispering Hill. Frost on the hedges, smoke from chimneys, crows on the church roof. The days are short this close to Midwinter.`];
 const left=3-(s.visits||0);
 a.push(left>0?`There's daylight enough for ${left===3?"three":left===2?"two more":"one more"} ${left===1?"visit":"visits"} before the light goes.`:`The sun is already sliding behind the hill. That's all the gathering there's time for.`);
 return a;},
 o:s=>{
  if((s.visits||0)>=3) return [[`Head home to your bench as dusk falls`,`dusk`],[`Hurry home`,`dusk`],[`Walk home the long way, past the Hill`,`dusk`]];
  const pool=[[`The Old Well, where the moss grows thick and silent`,`well`],[`Widow Brannagh's cottage, with the black ewe`,`brannagh`],[`The beekeeper's meadow, for clover`,`meadow`],[`The Thimble & Tankard inn`,`inn`]].filter(o=>!s.seen[o[1]]);
  const o=pool.slice(0,3); while(o.length<3) o.push([`Head home early`,`dusk`]); return o;}},

well:{t:`The Old Well`,visit:1,tod:"Midday",give:"moss",p:[
 `The Old Well hasn't drawn water in a hundred years. Its stones are furred with a moss so thick and soft that when you press your hand into it, you can't hear your own heartbeat.`,
 `You peel away a long, careful strip. Felted flat, it'll make a sole that makes no sound at all. Not on stone. Not on moonlight.`],
 o:[[`Back to the village`,`village`],[`Thank the well and go`,`village`],[`Listen to the silence a moment longer`,`village`]]},

brannagh:{t:`Widow Brannagh`,visit:1,tod:"Midday",give:"wool",set:[`lonely`],p:[
 `Widow Brannagh's black ewe, Duchess, has the warmest fleece in the county, and Widow Brannagh knows it. "Shoes for the fair folk, is it?" she says, carding a handful for you. "Your gran did that. Brave woman."`,
 `She works for a while without speaking. "I led the village dance at Midsummer for thirty years, with my Tam. Haven't danced since he died. It's lonely work, leading a dance. Everyone watching your feet. Nobody beside you."`,
 `She presses the wool into your hands. Warm as a hen's own breast.`],
 o:[[`Back to the village`,`village`],[`Tell her she should dance again`,`village`],[`Hug her`,`village`]]},

meadow:{t:`The Beekeeper's Meadow`,visit:1,tod:"Midday",give:"clover",p:[
 `The beekeeper's daughter, Posy, dries June clover every summer and weaves it on a tiny loom into ribbon. She calls it clover-silk.`,
 `"It smells of June," she says, and she's right: when you hold it to your nose it's warm afternoons and bees and long grass, even in December.`,
 `She gives you enough for two small uppers, and a jar of honey you didn't ask for.`],
 o:[[`Back to the village`,`village`],[`Thank Posy`,`village`],[`Smell it one more time`,`village`]]},

inn:{t:`The Thimble & Tankard`,visit:1,tod:"Midday",give:"cork",p:[
 `The landlord of the Thimble & Tankard is happy to give you all the old barrel cork you want. "Light as anything," he says. "Bit squeaky, mind."`,
 `He also gossips for half an hour about the Squire's new curtains, which is time you won't get back.`],
 o:[[`Back to the village`,`village`],[`Escape the gossip`,`village`],[`Have a quick half, then go`,`village`]]},

dusk:{t:`Dusk`,tod:"Dusk",p:s=>[
 `The light goes blue, then grey. Lamps come on in the windows of Whispering Hill. You set your basket on the bench and light the candle.`,
 `You could start work now. Or you could walk up the Hill first, quietly, the way Bramble said.`],
 o:[[`Walk up the Hill, quietly`,`hill`],[`Start work at the bench`,`sole`],[`Sit by the fire and think it through`,`sole`]]},

hill:{t:`On the Hill`,tod:"Dusk",set:[`secret`],p:[
 `You climb the Hill in the blue dusk and crouch behind a gorse bush near the top, where the grass makes a perfect ring.`,
 `In the middle of the ring, alone, is a sprite no taller than a teacup, with wings like a dragonfly's and a crown of holly berries. He's practising a dance. He gets three steps in, trips on his own feet, and sits down hard in the frost.`,
 `He gets up. Tries again. Three steps. Falls.`,
 `On the fourth try, he doesn't get up. He just sits there in the frozen ring with his arms around his knees, and you hear a very small voice say, "I can't. I *can't*. Everyone will see."`,
 `Prince Thistlewick is not particular. He's terrified.`],
 o:[[`Creep away and go and make the slippers`,`sole`],[`Go home thinking hard`,`sole`],[`Leave a tiny mitten on the gorse for him, then go`,`sole`]]},

sole:{t:`At the Bench: The Sole`,tod:"Evening",part:"sole",p:[
 `You clear the bench, pin the Prince's riddle to the wall, and set the tiny last in front of you: a wooden foot no longer than your thumb.`,
 `First, the soles. *Soles that make no sound upon the moon.*`],
 o:s=>[ s.basket.includes("moss")?[`Felt the moss from the Old Well`,`upper`,null,"moss"]:[`Stitch a plain leather sole`,`upper`,null,"leather"],
  [`Oak-tanned leather with iron tacks, to make it last`,`upper`,null,"iron"],
  s.basket.includes("cork")?[`Barrel cork from the inn`,`upper`,null,"cork"]:s.basket.includes("moss")?[`Stitch a plain leather sole`,`upper`,null,"leather"]:[`Cut a sole from an old cork fishing float`,`upper`,null,"cork"]]},

upper:{t:`The Uppers`,tod:"Evening",part:"upper",p:[
 `Next, the uppers. *Uppers that remember June.*`,
 `On the shelf there's an offcut of crimson velvet from when the Squire had his curtains made. It's very grand. It would certainly impress a prince.`],
 o:s=>[ s.basket.includes("clover")?[`Clover-silk from the beekeeper's meadow`,`lining`,null,"clover"]:[`Plain calfskin`,`lining`,null,"calf"],
  [`The Squire's crimson velvet`,`lining`,null,"velvet"], s.basket.includes("clover")?[`Plain calfskin`,`lining`,null,"calf"]:[`Grey felt from an old hat`,`lining`,null,"felt"]]},

lining:{t:`The Lining`,tod:"Night",part:"lining",p:[
 `Now the lining. *A lining warm as a hen's own breast.* Midwinter in the Hollow Hill is cold, and those small feet will be bare inside.`],
 o:s=>[ s.basket.includes("wool")?[`Wool from Widow Brannagh's black ewe`,`charm`,null,"wool"]:[`Plain linen`,`charm`,null,"linen"],
  [`Thistledown, light as air`,`charm`,null,"thistle"], s.basket.includes("wool")?[`Plain linen`,`charm`,null,"linen"]:[`Red flannel from the rag bag`,`charm`,null,"flannel"]]},

charm:{t:`Something Sewn Inside`,tod:"Night",part:"charm",p:s=>[
 `Last of all. *Something sewn inside to make me best.* Or brave. ${s.f.scratched?"You know which word he meant.":""}`,
 s.f.button?`Gran's blue coat hangs on its peg by the door. The brass button at the top catches the candlelight.`:`You look around the shop for something that would do.`],
 o:s=>[[`A tiny silver bell, so everyone notices him`,`finale`,null,"bell"],[`A sprig of rosemary, for remembrance`,`finale`,null,"rosemary"], s.f.button?[`Snip Gran's brave button from her coat and sew it in`,`finale`,null,"button"]:[`A sprig of rosemary, tucked in the heel`,`finale`,null,"rosemary"]]},

finale:{t:`The Midwinter Revel`,tod:"Midnight",p:s=>{
 const sl=s.made;
 const a=[`At midnight Bramble leads you up the Hill with a lantern. A door opens in the side of it that was never there before, and as you step through, you shrink, until the grass stalks are as tall as trees and you're exactly the right size for the Hollow Court.`,
 `The great hall under the Hill is roots and lanterns and a thousand guests with wings. At the far end, on a throne of acorn cups, sits Prince Thistlewick, arms folded, looking furious, which you now know means frightened.`,
 `You kneel and hold out the slippers. He snatches them.`];
 if(sl.sole==="iron") a.push(`The moment his fingers touch the soles, he yelps and drops them. Iron. The whole court hisses.`);
 else{
  a.push(`He turns them over. ${sl.upper==="clover"?"He sniffs the clover-silk, and for a moment his face goes soft, like someone remembering a warm day.":sl.upper==="velvet"?"He fingers the crimson velvet, impressed despite himself.":"He looks at the plain uppers and sniffs."} He pulls them on. ${sl.lining==="wool"?"His shoulders drop an inch: they're warm.":sl.lining==="thistle"?"He wriggles: thistledown tickles.":""}`);
  if(sl.charm==="button") a.push(`Then his toes find the brass button sewn inside the left heel, and he goes very still. He looks up at you. He can tell, the way Gran said they always can, exactly what it cost.`);
  a.push(`The music begins: the first dance of the Revel. Every face in the Hollow Court turns to the Prince. He stands. His knees are shaking.`);
 }
 return a;},
 o:s=>{const sl=s.made;
  const v=sl.sole==="iron"?"E5":sl.sole==="cork"?"E3":(sl.upper==="velvet"||sl.charm==="bell")?"E4":"E2";
  const best=(sl.sole==="moss"&&sl.upper==="clover"&&sl.lining==="wool"&&sl.charm==="button")?"E1":v;
  return [[`Bow, step back, and let him dance`,v],
   s.f.secret?[`Step forward and quietly offer to dance the first steps with him`,sl.sole==="iron"?"E5":sl.sole==="cork"?"E3":best]:[`Tell him they're the finest slippers you've ever made`,v],
   [`Accept the court's invitation to stay in the Hill as royal cobbler`,sl.sole==="iron"?"E5":"E6"]];}},

E1:{end:true,best:true,t:`The First Dance`,p:s=>[
 `You step forward and bow, and say, very quietly, so only he can hear: "Nobody should have to lead a dance on their own. May I?"`,
 `Prince Thistlewick stares at you. Then, very slightly, he nods.`,
 `You take his hands. The moss-felt soles make no sound at all on the moon-pale floor. The clover-silk smells of June. His feet are warm. And with every step, his heel presses on a worn brass button that belonged to a brave old woman, and he doesn't trip once.`,
 `Three steps. Ten. The whole dance. When it ends, the Hollow Court roars, and the Prince is laughing, out of breath, holding your hands. "Again," he says. "Again!" Then he lets you go and dances the second one by himself.`,
 `In the morning you wake up at your bench at full size, with frost on the window and a hedgehog asleep in your apron pocket. The Hill is whispering your name, the right way round.`,
 `From that winter on, every shoe in Whispering Hill fits perfectly. Widow Brannagh leads the village dance again at Midsummer. You make the Prince a new pair every year, and every year, sewn in the heel, there's something freely given.`]},

E2:{end:true,t:`Very Nearly Perfect`,p:s=>[
 `You bow and step back. The Prince walks out onto the moon-pale floor alone.`,
 `The slippers are good. ${s.made.sole==="moss"?"They're perfectly silent. ":""}${s.made.lining==="wool"?"They're warm. ":""}He gets through the first dance stiffly, counting under his breath, looking at his feet the whole time. He doesn't fall. He doesn't smile, either.`,
 `Afterwards he sends Bramble with a gold acorn and a note: *Acceptable.* From Prince Thistlewick, it's practically a medal.`,
 `Your shoes don't pinch. The Hill doesn't whisper your name backwards. It doesn't whisper it at all.`,
 `*They fit his feet. ${!s.f.secret?"You never found out what he was really afraid of.":"Something sewn inside could have fitted the rest of him."}*`]},

E3:{end:true,t:`Squeak`,p:[
 `The Prince steps onto the moon-pale floor.`,
 `*Squeak.*`,
 `He freezes. The whole Hollow Court freezes. He takes another step. *Squeak. Squeak.* Someone in the gallery giggles. Then everyone does.`,
 `The Prince goes scarlet to the tips of his wings, kicks off the slippers, and flies out of the hall.`,
 `For a year and a day, the Hill whispers your name backwards (*Nnyw Yhtenreba*), and every shoe in Whispering Hill pinches. The village is very cross with you. The innkeeper keeps very quiet about where the cork came from.`,
 `*Soles that make no sound upon the moon. The Old Well's moss would have done it.*`]},

E4:{end:true,t:`The Grandest Slippers`,p:s=>[
 `The Prince steps onto the floor in the grandest slippers the Hollow Court has ever seen. ${s.made.upper==="velvet"?"Crimson velvet, glowing in the lantern light.":""} ${s.made.charm==="bell"?"A silver bell at each toe, ringing with every step.":""}`,
 `Everyone notices. That's the trouble. Every eye in the Hill is fixed on his feet, exactly as he feared. He gets four steps in, catches a toe, and goes down in a heap${s.made.charm==="bell"?" with a jingle you can hear at the back of the hall":""}.`,
 `He picks himself up with enormous dignity and finishes the dance. The court applauds politely. Bramble brings you a gold acorn and a note: *Very grand. Too grand.*`,
 `*He wrote 'best', but he meant 'brave'. Grandeur made everyone look harder.*`]},

E5:{end:true,t:`Iron in the Sole`,p:[
 `Iron. Just the little tacks in the heel, put there to make them last. But the Prince cries out as if he's been burned, and the whole Hollow Court draws back from you, hissing like a kettle.`,
 `"*Iron,*" says Bramble, horrified. "In the Hill."`,
 `You wake at dawn on the cold grass outside, full size, with the slippers in your hand. There's no door in the side of the Hill any more. There never will be again.`,
 `The Hill doesn't whisper on still nights after that. Not your name, not anyone's. The village says it's just gone quiet. You know better.`,
 `*Gran's pattern book said it first: never iron for the fair folk.*`]},

E6:{end:true,t:`A Hundred Years in the Hill`,p:s=>[
 `The Queen of the Hollow Court, pleased with the slippers, offers you a place: Royal Cobbler, a workshop under the roots, all the moonlight leather you could want. You accept.`,
 `It's wonderful. The Revel goes on and on. You make slippers for dancers with wings, boots for badgers, tiny clogs for mice. ${s.f.secret?"You teach the Prince to dance, slowly, over many nights.":""}`,
 `One evening you think you might pop home for a fresh spool of thread.`,
 `When you step out of the Hill, the village is all different. Your shop is a tea room. The church has a new tower. In the tea room, a girl with your nose and your gran's eyes is serving scones, and on the wall behind her, in a frame, is a very old blue coat with its top button missing.`,
 `A hundred years. That's how long a night in the Hill lasts.`]}
};

/* ---------- engine ---------- */
let state,history=[];
const SAVE_KEY="tac-cobbler-daily-door-v1";
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(d&&d.state&&S[d.state.scene]&&Array.isArray(d.history))return d}catch(e){}return {}}
const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,visits:0,basket:[],made:{}});
const val=(x,s)=>typeof x==="function"?x(s):x;
function loadE(){try{return JSON.parse(localStorage.getItem("cobbler-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("cobbler-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  const [label,to,,mat]=opt;
  if(mat){state.made[MAT[mat].part]=mat}
  const sc=S[to], first=!state.seen[to];
  state.scene=to; state.n++;
  if(sc.visit&&first) state.visits=(state.visits||0)+1;
  if(sc.give&&first&&!state.basket.includes(sc.give)) state.basket.push(sc.give);
  state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

const PROPTAG={quiet:"Silent",june:"Smells of June",warm:"Warm",brave:"Freely given",plain:"Ordinary",grand:"Grand",showy:"Showy",squeak:"Light, a bit squeaky",iron:"Iron",itchy:"Light, tickly",remember:"For remembrance"};
const GOOD=["quiet","june","warm","brave"];
function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).map(t=>t.startsWith("<span class=\"scroll")?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span>${sc.end?"<b>The Revel</b>":sc.part?`At the bench · <b>${sc.part}</b>`:`<b>${sc.tod||""}</b>`}</span><span>Page ${state.n+1}</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}`;
  if(sc.give&&state.basket.includes(sc.give)) html+=`<span class="got">✓ Into your basket: ${smart(MAT[sc.give].name)}</span>`;
  html+=`</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got2":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 16px">Your slippers: ${["sole","upper","lining","charm"].map(p=>state.made[p]?MAT[state.made[p]].name.toLowerCase():"—").join("; ")}.${sc.best?"":" The truest pair answers every line of the riddle, including the word he scratched out, and needs you to know what he's afraid of."}</p>
     <button class="begin" id="again">Start a new pair</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>{const m=o[3]?MAT[o[3]]:null;
      return `<li><button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${smart(o[0])}${m?`<br><span class="tag${GOOD.includes(m.prop)?"":" warn"}">${PROPTAG[m.prop]}</span>`:""}</span></button></li>`}).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".mast");if(window.scrollY>top.offsetHeight)window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const sc=S[state.scene], m=state.made;
  document.getElementById("tod").textContent=sc.end?"After midnight":sc.tod||"";
  const left=Math.max(0,3-(state.visits||0));
  document.getElementById("suns").innerHTML=[0,1,2].map(i=>`<i class="${i<left?"":"off"}"></i>`).join("");
  document.getElementById("suns").setAttribute("aria-label",`${left} gathering visits left`);
  const R=[["sole","Soles that make no sound upon the moon","quiet"],["upper","Uppers that remember June","june"],["lining","A lining warm as a hen's own breast","warm"],["charm",state.f.scratched?"Something sewn inside to make me <s>brave</s> best":"Something sewn inside to make me best","brave"]];
  document.getElementById("req").innerHTML=R.map(([p,t,need])=>{const c=m[p];const ok=c&&MAT[c].prop===need;return `<li class="${c?(ok?"ok":"bad"):""}"><span class="ck">${c?(ok?"✓":"✗"):""}</span><span>${t}</span></li>`}).join("");
  document.getElementById("bCount").textContent=`${state.basket.length} gathered`;
  const all=["moss","wool","clover","cork"];
  document.getElementById("basket").innerHTML=state.basket.length?state.basket.map(k=>`<li><span class="sw" style="background:${MAT[k].col}"></span><span>${smart(MAT[k].name)}<small>${PROPTAG[MAT[k].prop]}</small></span></li>`).join("")+(state.f.button?`<li><span class="sw" style="background:${MAT.button.col};border-radius:50%"></span><span>Gran's brave button<small>Freely given</small></span></li>`:""):`<li class="unk"><span class="sw"></span><span>Empty, for now</span></li>`;
  document.getElementById("lore").innerHTML=LORE.map(([k,t])=>state.f[k]?`<li>${smart(t)}</li>`:`<li class="unk">Not yet learned</li>`).join("");
  drawSlipper();
}
function drawSlipper(){
  const m=state.made, c=k=>m[k]?MAT[m[k]].col:"none", st=k=>m[k]?"var(--ink)":"var(--muted)", da=k=>m[k]?"":"stroke-dasharray:5 5";
  const sole=m.sole, up=m.upper, lin=m.lining, ch=m.charm;
  let tex="";
  if(up==="clover") for(let i=0;i<14;i++) tex+=`<circle cx="${110+(i*37)%220}" cy="${70+(i*23)%60}" r="3.2" fill="#f4d9ef" opacity=".85"/>`;
  if(up==="velvet") tex+=`<path d="M120 80 Q200 60 300 90" stroke="#ff8aa5" stroke-width="3" fill="none" opacity=".35"/>`;
  if(lin==="wool") for(let i=0;i<10;i++) tex+=`<circle cx="${96+i*9}" cy="${66+Math.sin(i)*3}" r="4" fill="#4a443e"/>`;
  if(lin==="thistle") for(let i=0;i<8;i++) tex+=`<path d="M${96+i*11} 64 l-3 -8 M${96+i*11} 64 l3 -8" stroke="#bbb" stroke-width="1"/>`;
  let tacks="";if(sole==="iron") for(let i=0;i<9;i++) tacks+=`<circle cx="${100+i*30}" cy="158" r="2.6" fill="#9aa3ad"/>`;
  let charm="";
  if(ch==="bell") charm=`<g transform="translate(372 108)"><path d="M-9 8 Q-9 -8 0 -9 Q9 -8 9 8 Z" fill="#c9ccd2" stroke="var(--ink)" stroke-width="1.5"/><circle cx="0" cy="11" r="2.5" fill="var(--ink)"/></g>`;
  if(ch==="rosemary") charm=`<g transform="translate(360 100) rotate(-30)"><path d="M0 0 V-34" stroke="#4f6b4a" stroke-width="2"/>${[0,1,2,3,4].map(i=>`<ellipse cx="${i%2?5:-5}" cy="${-6-i*6}" rx="5" ry="2" fill="#6f8f6a"/>`).join("")}</g>`;
  if(ch==="button") charm=`<g transform="translate(366 104)"><circle r="11" fill="#c99a3a" stroke="var(--ink)" stroke-width="1.5"/><circle cx="-3" cy="-3" r="1.6" fill="var(--ink)"/><circle cx="3" cy="-3" r="1.6" fill="var(--ink)"/><circle cx="-3" cy="3" r="1.6" fill="var(--ink)"/><circle cx="3" cy="3" r="1.6" fill="var(--ink)"/></g>`;
  const curl=up?`<path d="M392 96 q22 -10 26 -34 q2 -12 -8 -10" fill="none" stroke="${c("upper")}" stroke-width="7" stroke-linecap="round"/>`:`<path d="M392 96 q22 -10 26 -34 q2 -12 -8 -10" fill="none" stroke="var(--muted)" stroke-width="2" style="stroke-dasharray:5 5"/>`;
  document.getElementById("slipper").innerHTML=`<svg viewBox="0 0 460 200" role="img" aria-label="The slipper so far: ${["sole","upper","lining","charm"].map(p=>m[p]?MAT[m[p]].name:"no "+p).join(", ")}">
   <ellipse cx="240" cy="176" rx="190" ry="10" fill="var(--line)" opacity=".7"/>
   <path d="M70 150 Q60 165 90 168 L390 168 Q430 166 428 140 Q426 128 400 130 Z" fill="${c("sole")}" stroke="${st("sole")}" stroke-width="2.2" style="${da("sole")}"/>
   ${tacks}
   <path d="M76 150 Q70 80 120 60 Q180 46 230 70 Q300 100 360 96 Q412 94 420 132 L404 138 Q380 150 300 150 Z" fill="${c("upper")}" stroke="${st("upper")}" stroke-width="2.2" style="${da("upper")}"/>
   ${tex}
   <path d="M90 66 Q140 50 196 64 Q170 76 120 76 Q100 76 90 66 Z" fill="${c("lining")}" stroke="${st("lining")}" stroke-width="1.6" style="${da("lining")}"/>
   ${curl}
   ${charm}
   ${!sole&&!up?`<text x="240" y="118" text-anchor="middle" style="font:italic 16px var(--display);fill:var(--muted)">not yet begun</text>`:""}
  </svg>`;
}
document.getElementById("dossierToggle").addEventListener("click",()=>{
 const panel=document.getElementById("sidePanels"),btn=document.getElementById("dossierToggle");
 const collapsed=panel.dataset.collapsed!=="true";
 panel.dataset.collapsed=String(collapsed);btn.setAttribute("aria-expanded",String(!collapsed));
 btn.textContent=collapsed?"Show basket and discoveries ▾":"Hide basket and discoveries ▴";
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){state=d&&d.state&&S[d.state.scene]?d.state:fresh();history=d&&Array.isArray(d.history)?d.history:[];render(false)}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>
