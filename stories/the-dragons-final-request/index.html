<script>
const HIST=[
 ["order","The Beginning","The dragon Morvhast burned Highcairn without cause, and King Aldric swore war.","The King declared war three days before Highcairn burned."],
 ["young","Highcairn","A city of innocents, burned in the night.","The royal alchemists worked in Highcairn. The dragons came to take back their stolen young."],
 ["cages","The Hatchery","Dragon breeding caves, cleansed by heroes.","Royal cages, under the King's seal. Hatchlings were kept there and harvested."],
 ["confession","The Chronicle","Faithfully written by the monks of the Grey Quill.","King Aldric ordered the true pages cut. His deathbed confession survives."],
 ["heartfire","Heartfire","The King's physic draught, a secret of the royal physicians.","It's made from dragon hearts. It's what keeps the King alive."]
];
const PLACES={capital:[118,150,"Aldermere"],highcairn:[250,182,"Highcairn"],hatchery:[420,150,"The Hatchery"],monastery:[240,70,"Grey Quill"],cinder:[470,44,"Cinderhorn"]};
const ENDINGS={E1:"The Last Egg",E2:"She Lays Down Her Head",E3:"The Legend Holds",E4:"Half a History",E5:"The Army Marches",E6:"Keeper of the Legend"};
const burned=(h,t)=>`<span class="burned"><span class="h">${h}</span>${t}</span>`;
const leaf=(h,t)=>`<span class="leaf"><span class="h">${h}</span>${t}</span>`;

const S={
start:{t:`Words Burned in Stone`,at:"capital",p:[
 `For three hundred years the Kingdom of Aldermere has been at war with dragons. The Long Burning, the minstrels call it. Now there is only one dragon left: Ysmeral, ancient, wingspan like a sail, on the black peak of Cinderhorn in the far north.`,
 `Three nights ago she flew over the capital without burning anything at all, and in the morning there were words seared into the castle gate, in letters as tall as a man:`,
 burned(`Burned into the great gate of Aldermere`,`I am Ysmeral, the last. I will lay my head at your King's feet, if one of you climbs Cinderhorn and tells me truly how this war began. You have seven days.`),
 `King Edric laughed, wheezing, from his chair. Everybody knows how it began: Highcairn. He sent for the Royal Chronicler, who is eighty and can't climb stairs, so the Chronicler sent his apprentice. You. Sefa Marlowe. Twenty-two, ink on your fingers, and now the voice of Aldermere.`,
 `"Recite her the Legend," the King said. "Then let her keep her word." He took a sip from a small gold cup and his colour came back, briefly. The court physician calls it heartfire.`],
 o:[[`Go down to the Royal Archive before you set out`,`archive`],[`Ask your escort, old Sir Bartholomew Gant, what he knows`,`gant`],[`Ride north for Cinderhorn at once, with the Legend`,`cinder`,"go"]]},

gant:{t:`Sir Bartholomew Gant`,at:"capital",set:[`gant`],p:[
 `Sir Bartholomew has fought dragons for forty-one years. He has a burn scar from ear to collarbone and the same opinion about everything.`,
 `"Highcairn," he says. "Year of Ash. Morvhast came down out of a clear sky and burned it to the stones. Every child in Aldermere knows it." He checks his sword. "Recite it to the worm and let's be done."`,
 `Then, almost as an afterthought: "Odd thing, mind. Forty-one years, and I never once saw a dragon burn a village that didn't have a lord's tower in it. Always the towers. Never the cottages." He shrugs. "Doesn't mean anything."`],
 o:[[`Go down to the Royal Archive`,`archive`],[`Set out on the road`,`road`],[`Ride straight for Cinderhorn`,`cinder`,"go"]]},

archive:{t:`The Royal Archive`,at:"capital",set:[`order`,`heartfire`],p:[
 `The Royal Archive is under the castle: a hundred yards of shelves, three hundred years of ink. You know it better than anyone except your master.`,
 `The Chronicle for the Year of Ash has a gap. Six pages, cut out with a blade, so neatly you'd never notice unless you were a chronicler's apprentice. But kings never think about the dull books. The Proclamations Roll for that year is intact:`,
 leaf(`Proclamations Roll, Year of Ash`,`<b>Day 14 of Harvestmonth:</b> War is declared upon the dragons. <b>Day 17 of Harvestmonth:</b> Highcairn burns.`),
 `War first. Highcairn three days *later*.`,
 `And in the Treasury ledger, in a column nobody has looked at in three hundred years: *Paid to the alchemist Vellum, for heartfire: 40 crowns the heart.* The entries go on, year after year. They go on until last month.`],
 o:[[`Take to the road`,`road`],[`Ask Sir Bartholomew about this`,`gant2`],[`Go to the King with what you've found`,`king`]]},

gant2:{t:`"Doesn't Mean Anything"`,at:"capital",p:s=>[
 `You show Sir Bartholomew the Proclamations Roll. He reads it twice, very slowly, his lips moving.`,
 `"Clerk's error," he says. But his hand has gone to the burn scar on his neck, as if it hurts. "Clerk's error. Has to be."`,
 `He doesn't say anything else for a long time. Then: "Where else would a clerk make errors, chronicler?"`],
 o:[[`Take to the road`,`road`],[`Go to the King`,`king`],[`Ride straight for Cinderhorn`,`cinder`,"go"]]},

king:{t:`King Edric`,at:"capital",cost:1,p:s=>[
 `It takes a day to be granted an audience. The King receives you in his bedchamber, propped up, very old, with the little gold cup at his elbow.`,
 `You show him the Proclamations Roll${s.f.heartfire?" and the Treasury ledger":""}. He doesn't look surprised. He looks tired.`,
 `"Every king of Aldermere knows," he says. "We're told on the night we're crowned. Heartfire, Sefa. It keeps a king alive past his time. Do you know what the kingdom would do, if it learned its kings have lived on dragon hearts for three hundred years? If it learned the war was a cover for a *harvest*?"`,
 `He pushes a scroll across the coverlet: a royal warrant. "Royal Chronicler, after your master. A house. A seat on the Council. Recite the Legend on Cinderhorn, and keep the rest in the dark where it's always been."`],
 o:[[`Take the warrant`,`E6`],[`Refuse, and take to the road`,`road`],[`Refuse, and ask him what's in the royal vault`,`vaultq`]]},

vaultq:{t:`The Vault`,at:"capital",p:[
 `The King's face closes like a door. "Get out."`,
 `In the corridor, the King's granddaughter, Princess Elin, is waiting. She's fifteen and has clearly been listening at the keyhole. "There's an egg in the vault," she says quietly. "I've seen it. It's warm. Grandfather says it's the last batch of heartfire, for when he's very ill."`,
 `She presses a small iron key into your hand. "Don't tell him it was me."`],
 set:[`elinkey`],
 o:[[`Go down to the vault tonight`,`vault`],[`Take to the road`,`road`],[`Give the key back`,`road`,"nokey"]]},

road:{t:`The Road`,at:null,p:s=>{
 const a=[`Aldermere unrolls below you: the King's road north, the river, the burned country to the east where nobody farms any more.`];
 a.push(s.day<=7?`It's day ${s.day}. The dragon gave seven. The King's army, they say in the inns, will march on Cinderhorn on the eighth morning, whether you've come back or not.`:`The eighth morning has come. Somewhere north of you, the King's army is already marching.`);
 if(s.f.gantAlly) a.push(`Sir Bartholomew rides beside you in silence. He's been quiet since the Hatchery.`);
 return a;},
 o:s=>roadOpts(s)},

highcairn:{t:`Highcairn`,at:"highcairn",cost:1,set:[`young`],p:[
 `Highcairn is a hill of black stones, three centuries cold, with sheep grazing between them. At the bottom there's a village of twenty houses, built from the old city's rubble.`,
 `Old Mab, who keeps the sheep, has a song for you if you'll hold her yarn. Everyone in the village knows it. Nobody in the capital does.`,
 leaf(`The Highcairn ballad, as sung by Old Mab`,`They came in the night for the little ones, / the little ones the King took in carts. / They burned the tower where the alchemists were, / and they wept fire, and they wept fire.`),
 `"The tower," Mab says, pointing to a single blackened stump at the top of the hill. "That's what burned. The town just caught." She winds her yarn. "My granny's granny said you could hear them crying. The big ones. Calling for their babies."`],
 o:[[`Back to the road`,`road`],[`Climb up to the burned tower`,`tower`],[`Thank Mab and ride on`,`road`]]},

tower:{t:`The Alchemists' Tower`,at:"highcairn",p:[
 `At the top of the hill, in the stump of the tower, under three hundred years of nettles, there are iron rings set in the floor. Big ones. Chains, rusted solid. A bronze plate, green, stamped with a crown.`,
 `The rings are too large for a man and too small for a grown dragon. They're exactly the right size for something young.`],
 o:[[`Back to the road`,`road`],[`Sit for a while`,`road`],[`Ride on`,`road`]]},

hatchery:{t:`The Hatchery`,at:"hatchery",cost:2,set:[`cages`],p:s=>[
 `Two days east, through the burned country, the Hatchery caves open in a cliff like black mouths. The ballads say heroes cleansed them. You go in with a torch.`,
 `Cages. Hundreds of them, iron, set into the rock in rows, each one with a crowned seal on its door. Inside, small bones. Delicate, curled up. Wing bones like the ribs of a fan.`,
 `Above each cage, scratched into the stone with something sharp, are marks you can read, because a chronicler's apprentice learns all the old scripts. They're names. Someone, some dragon, came in here after, and wrote every one of their names on the wall.`,
 s.f.gant?`Behind you, Sir Bartholomew has stopped. He's looking at the cages and his face has gone very still. After a long time he takes off his helm. "Forty-one years," he says. "Forty-one years." He kneels down on the stone.`:`You copy the names, all of them, into your book. It takes hours.`],
 setIf:s=>s.f.gant?["gantAlly"]:[],
 o:[[`Copy the names, and go`,`road`],[`Take a rubbing of the crowned seal`,`road`],[`Back to the road`,`road`]]},

monastery:{t:`The Grey Quill`,at:"monastery",cost:1,set:[`confession`,`eggknown`],p:[
 `The monastery of the Grey Quill sits on a crag in the northern hills. The monks there wrote the Chronicle of Aldermere for two hundred years. Brother Anselm, who is a hundred and two and blind, receives you in the scriptorium.`,
 `"You're the chronicler's girl," he says. "You've come about the six pages." He reaches under his desk and brings out a bundle wrapped in oilcloth. "The King's men cut them out. The abbot of the day made a copy first. We've kept it three hundred years, waiting for someone to ask."`,
 leaf(`The cut pages: King Aldric's deathbed confession`,`I made a war to hide a theft. The hearts of their young kept me alive, and I could not stop. Let the people think the dragons began it. Let them never know the King of Aldermere is a thief of children. God forgive me. The dragons will not.`),
 `Anselm folds his hands. "There's one thing more. The last king's physician confessed it to me. There's an egg still. In the royal vault. Kept warm for the next draught." He turns his blind face to you. "If you mean to make an end of this, child, an end isn't only words."`],
 o:[[`Back to the road`,`road`],[`Thank him, and ride`,`road`],[`Ask his blessing, then ride`,`road`]]},

vault:{t:`The Royal Vault`,at:"capital",cost:1,p:s=>[
 s.f.elinkey?`Princess Elin's key turns in the vault door at midnight.`:`You know the castle's back passages better than its guards do. It takes all night, and a kitchen boy's help, but you get into the vault.`,
 `Among the crowns and the plate, on a cushion of red velvet inside a brazier of slow coals, there's an egg. It's the size of a man's head, dark green, and when you put your hand on it, it's warm. Something inside it moves.`,
 `Taking it is theft from the Crown. Leaving it is leaving it for the King's next draught.`],
 o:[[`Wrap it in your cloak and take it`,`road`,"egg"],[`Leave it. You can't steal from the King`,`road`],[`Take it, and leave a note for the King`,`road`,"egg"]]},

cinder:{t:`Cinderhorn`,at:"cinder",cost:1,p:s=>{
 if(s.day>8) return [];
 const a=[`The last day's climb is all black rock and wind. At the top, on a ledge like the palm of a hand, Ysmeral is waiting.`,
 `She's bigger than any ballad. Her scales are the colour of old bronze, gone grey at the edges. Her eyes are gold. She looks at you, a small person with ink on her fingers${s.f.gantAlly?", and an old knight with his helm under his arm":""}${s.f.egg?", holding a bundle in a cloak":""}, for a long time.`,
 `"Well, little chronicler," she says. Her voice is like wind across the mouth of a cave. "How did it begin?"`];
 return a;},
 o:s=>{const t=HIST.filter(h=>s.f[h[0]]).length;
  return [[`Tell her the whole truth${s.f.egg?", and unwrap the egg":""}`,t>=4?(s.f.egg?`E1`:`E2`):`E4`],[`Recite her the Legend, as the King commanded`,`E3`],[s.f.egg?`Tell her the truth, and keep the egg hidden`:`Tell her only what you're sure of`,t>=4?`E2`:`E4`]];}},

E1:{end:true,best:true,t:`The Last Egg`,p:s=>[
 `You tell her all of it: the Proclamations Roll, war three days before the burning. The tower at Highcairn and its chains. The cages in the Hatchery. King Aldric's confession. Heartfire, and the little gold cup.`,
 `Then you read her the names from the Hatchery wall, every one, in the old script, and she closes her eyes. When you reach the last name, she says it with you.`,
 `Then you unwrap your cloak.`,
 `Ysmeral goes completely still. She lowers her great head to the egg and breathes on it, very gently, and the green shell glows like a coal. Inside, something taps back.`,
 `"You were asked for words," she says at last. "You brought me words, and this." She doesn't lay down her head. Instead she spreads her wings over the egg, the way you'd shelter a candle.`,
 `${s.f.gantAlly?"Sir Bartholomew rides down the mountain ahead of you and stops the King's army at the foot of Cinderhorn with nothing but his voice and forty-one years of their trust. ":""}You carry the Two Histories back to Aldermere and read them on the steps of the cathedral, legend and truth side by side, and the city listens.`,
 `King Edric dies that winter, without his draught, and Princess Elin, crowned at fifteen, signs the first treaty with dragonkind in three hundred years. In spring, from the city walls, people see two shapes over Cinderhorn: one very large, one very small, learning to fly.`]},

E2:{end:true,t:`She Lays Down Her Head`,p:s=>[
 `You tell her all of it: the war declared before the burning, the tower, the cages, the confession, heartfire. You read her the names from the Hatchery wall.`,
 `Ysmeral listens to every word. When you finish, she's quiet for a long time.`,
 `"Thank you," she says. "That's all I wanted. For one of you to know."`,
 `Then she keeps her word. She flies south, to Aldermere, and lays her great head down in the square before the castle gate, at the King's feet, and closes her eyes, and doesn't open them again.`,
 `The truth is read aloud in the cathedral. The kingdom weeps for her. Heartfire is outlawed. ${s.f.eggknown?"But in the royal vault, an egg sits on red velvet in a brazier of coals, and nobody remembers to tell the new king it's there.":""}`,
 `*She asked for the truth, and you brought it. ${s.f.eggknown?"The monk told you an end isn't only words. There was an egg in the vault.":"There was more to find, in the vault and at the Grey Quill."}*`]},

E3:{end:true,t:`The Legend Holds`,p:s=>[
 `"In the Year of Ash," you begin, "the dragon Morvhast came out of a clear sky and burned Highcairn, without cause..."`,
 `Ysmeral listens to the whole Legend without moving. When you finish, she lowers her head until her golden eye is level with you.`,
 `"That," she says, "is what they told you. I asked how it *began*."`,
 `She doesn't burn you. She doesn't do anything. She simply spreads her wings and goes, north, over the ice, further than any map. The war doesn't end. It just has nobody left on the other side.`,
 `King Edric drinks his heartfire and lives another six years. You become Royal Chronicler. Every year, on the anniversary of Highcairn, you recite the Legend in the cathedral, and every year you remember a golden eye.`,
 `*The Legend was what you were sent to deliver. The truth was what she asked for.*`]},

E4:{end:true,t:`Half a History`,p:s=>[
 `You tell her what you know: ${HIST.filter(h=>s.f[h[0]]).map(h=>h[1].toLowerCase()).join(", ")||"very little"}. It's true, as far as it goes. It doesn't go far enough.`,
 `"Half a history," Ysmeral says, "is the same as a lie with better manners." She looks past you, south, towards Aldermere. "You didn't find the hearts. Or the cages. Or the King who confessed."`,
 `She doesn't lay down her head. She goes. And on the eighth morning the King's army marches anyway, on an empty mountain, and declares victory.`,
 `*The truth was in five places. You needed at least four of them.*`]},

E5:{end:true,t:`The Army Marches`,p:s=>[
 `You're still on the road on the eighth morning when the King's army passes you, banners up, trumpets going, five thousand men heading north for Cinderhorn.`,
 `By the time you reach the mountain, it's over. Ysmeral didn't fight. She was waiting on her ledge for a chronicler who didn't come, and when the army came instead, she simply looked at them, and let them.`,
 `They bring her head back to Aldermere on a wagon, and the city cheers. You stand in the crowd with your book full of the truth${s.f.egg?" and an egg wrapped in your cloak":""}, and nobody asks to read it.`,
 `*She gave you seven days. The road was long, and every visit cost time.*`]},

E6:{end:true,t:`Keeper of the Legend`,p:[
 `You take the warrant.`,
 `On the seventh day you climb Cinderhorn and recite the Legend, beautifully, the way your master taught you. Ysmeral listens to every word, and looks at you for a long time, and flies away north without a sound.`,
 `You become Royal Chronicler at twenty-two, the youngest in history. You have a house with a garden. You keep the Proclamations Roll locked in your own desk.`,
 `Every king of Aldermere is told on the night they're crowned. Now you're the one who tells them.`,
 `King Edric lives another six years. In the royal vault, an egg on red velvet goes slowly cold.`]}
};

function roadOpts(s){
  const P=[["highcairn","Ride to the ruins of Highcairn",1],["hatchery","Cross the burned country to the Hatchery caves",2],["monastery","Climb to the monastery of the Grey Quill",1]];
  if(s.f.eggknown||s.f.elinkey) P.push(["vault","Go back to the capital and into the royal vault",1]);
  const pool=P.filter(([k])=>!s.seen[k]).map(([k,l,d])=>[l,k,null,d]);
  const o=pool.slice(0,2);
  o.push([`Climb Cinderhorn and give her your answer`,`cinder`,null,1]);
  const F=[[`Rest a day at an inn`,`road`,"rest",1],[`Wait a day for news from the capital`,`road`,"rest",1]];let fi=0;
  while(o.length<3) o.splice(o.length-1,0,F[fi++]);
  return o;
}

/* ---------- engine ---------- */
let state,history=[];
const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,day:1,at:"capital",route:["capital"]});
const val=(x,s)=>typeof x==="function"?x(s):x;
const SAVE_KEY="tac-dragon-final-request-daily-door-v1";
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(err){}};
const restore=()=>{try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return x&&x.state&&S[x.state.scene]&&Array.isArray(x.history)?x:null}catch(err){return null}};
function loadE(){try{return JSON.parse(localStorage.getItem("dragon-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("dragon-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  let [,to,flag]=opt;
  if(flag==="egg") state.f.egg=1;
  if(flag==="nokey") delete state.f.elinkey;
  let sc=S[to]; const first=!state.seen[to];
  if(flag==="rest") state.day+=1;
  if(!sc.end&&first&&sc.cost) state.day+=sc.cost;
  if(state.day>7&&!sc.end){to="E5";sc=S.E5}
  if(sc.at&&sc.at!==state.at){state.at=sc.at;state.route.push(sc.at)}
  state.scene=to; state.n++;
  state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.setIf) sc.setIf(state).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());render(true)}
function restart(){history=[];state=fresh();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const before=new Set(HIST.filter(h=>state._prev&&state._prev[h[0]]).map(h=>h[0]));
  const paras=val(sc.p,state).map(t=>/^<span class="(burned|leaf)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span><b>${sc.end?"The end of the road":sc.at?PLACES[sc.at][2]:"On the road"}</b></span><span>Day ${state.day} · seven-day deadline</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}`;
  const newly=HIST.filter(h=>(sc.set||[]).includes(h[0]));
  newly.forEach(h=>{html+=`<span class="reveal">✦ The Truth revealed: ${h[1]}</span> `});
  html+=`</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length, c=HIST.filter(h=>state.f[h[0]]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 16px">${c} of 5 truths uncovered · day ${state.day}${state.f.egg?" · the egg in your cloak":""}.${sc.best?"":" The truest ending needs four truths at least, and an end that isn't only words."}</p>
     <button class="begin" id="again">Read the gate again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>{const t=S[o[1]];const d=o[3]!=null?o[3]:(t&&!t.end&&t.cost&&!state.seen[o[1]]?t.cost:0);
      return `<li><button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${smart(o[0])}${d?(()=>{const late=state.day+d>7;return `<span class="tag${late?" e":""}">${d} ${d===1?"day":"days"}${late?" · too late, the army will be there first":""}</span>`})():""}</span></button></li>`}).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();persist();
  if(scroll){const top=document.querySelector(".mast");if(window.scrollY>top.offsetHeight)window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const d=state.day;
  document.getElementById("suns").innerHTML=[1,2,3,4,5,6,7,8].map(i=>`<i class="${i===8?"army":i<d?"past":i===d?"now":""}">${i===8?"⚔":i}</i>`).join("");
  document.getElementById("suns").setAttribute("aria-label",`Day ${d}; army marches on day 8`);
  document.getElementById("armyNote").textContent=d>=8?"The army has marched.":d===7?"The army marches tomorrow.":d>=5?"The army is mustering.":"";
  const c=HIST.filter(h=>state.f[h[0]]).length;
  document.getElementById("hCount").textContent=`${c} of 5 truths uncovered`;
  document.getElementById("hist").innerHTML=HIST.map(([k,t,lg,tr])=>`<div class="hrow${state.f[k]?" known":""}"><div class="t">${t}</div><div class="lg">${smart(lg)}</div><div class="tr${state.f[k]?"":" unk"}">${state.f[k]?smart(tr):"Not yet uncovered"}</div></div>`).join("");
  const C=[["Sir Bartholomew Gant",state.f.gantAlly?"Knows the truth":state.f.gant?"Believes the Legend":"Your escort"],["Princess Elin",state.f.elinkey?"Gave you the vault key":"—"],["The egg",state.f.egg?"In your cloak, warm":state.f.eggknown?"In the royal vault":"—"]];
  document.getElementById("comp").innerHTML=C.map(([n,s])=>`<li><span>${n}</span><span class="s">${s}</span></li>`).join("");
  drawMap();
}
function drawMap(){
  const R=state.route, cur=state.at, sc=S[state.scene];
  let path="";for(let i=1;i<R.length;i++){const a=PLACES[R[i-1]],b=PLACES[R[i]];path+=`<path d="M${a[0]} ${a[1]} Q${(a[0]+b[0])/2} ${Math.min(a[1],b[1])-20} ${b[0]} ${b[1]}" stroke="var(--ember)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>`}
  const nodes=Object.entries(PLACES).map(([k,[x,y,n]])=>{const v=R.includes(k), here=k===cur&&!sc.end;
    return `<g>${here?`<circle cx="${x}" cy="${y}" r="12" fill="var(--ember)" opacity=".2"/>`:""}<circle cx="${x}" cy="${y}" r="${k==="capital"?7:5.5}" fill="${v?"var(--ember)":"var(--card)"}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x+(k==="cinder"?-14:0)}" y="${y+(k==="cinder"?-14:20)}" text-anchor="${k==="cinder"?"end":"middle"}" style="font-size:11px">${n}</text></g>`}).join("");
  const dragonGone=["E3","E5","E2"].includes(state.scene);
  document.getElementById("map").innerHTML=`<svg viewBox="0 0 560 220" role="img" aria-label="Map of Aldermere. Visited: ${R.map(r=>PLACES[r][2]).join(", ")}">
   <path d="M20 200 Q60 120 40 60 Q90 20 170 30 Q260 10 330 24 Q420 14 520 30 Q545 110 530 200 Z" fill="var(--hill)" opacity=".35"/>
   <path d="M60 210 Q110 170 150 175 Q200 180 230 150 Q260 120 300 128 Q360 136 380 110" stroke="var(--river)" stroke-width="3" fill="none" opacity=".7"/>
   ${[[440,40],[460,52],[490,40],[505,58],[425,58]].map(([x,y])=>`<path d="M${x-14} ${y+14} L${x} ${y-12} L${x+14} ${y+14} Z" fill="var(--ink)" opacity=".55"/>`).join("")}
   ${[[330,170],[360,150],[390,180],[300,190]].map(([x,y])=>`<path d="M${x} ${y} l4 -10 l4 10" stroke="var(--ember)" stroke-width="1.2" fill="none" opacity=".5"/>`).join("")}
   <text x="345" y="205" text-anchor="middle" style="font-size:9px;fill:var(--muted)">THE BURNED COUNTRY</text>
   ${path}${nodes}
   ${dragonGone?"":`<path d="M486 20 q8 -8 18 -2 q-6 2 -6 6 q10 -4 18 4 q-10 0 -14 6 q-8 -4 -16 -2 z" fill="var(--ember)"/>`}
   <path d="M120 150 m-6 -12 h12 v-6 h-12 z" fill="var(--ink)"/>
  </svg>`;
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
const toggleReferences=document.getElementById("toggleReferences"),referencePanels=document.getElementById("referencePanels");
toggleReferences.addEventListener("click",()=>{const open=referencePanels.classList.toggle("open");toggleReferences.setAttribute("aria-expanded",String(open));toggleReferences.textContent=open?"Hide the Two Histories and companions":"Show the Two Histories and companions"});
function start(d){const saved=d&&d.state?d:restore();state=saved&&saved.state&&S[saved.state.scene]?saved.state:fresh();history=saved&&Array.isArray(saved.history)?saved.history:[];render(false)}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>
