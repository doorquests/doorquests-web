<script>
const NAMES=[
 ["ROOK","Dead-drop servicing, Spree sector"],["HERON","Courier, Wannsee line"],["MARTEN","Clerk, Marienfelde camp"],["ORGAN","Radio operator, Lübars"],
 ["SEXTANT","Customs, Helmstedt"],["WILLOW","Translator, Allied HQ"],["KESTREL","Taxi driver, Kreuzberg"],["LINDEN","Pastor, Neukölln"],
 ["FERRY","Bargeman, Teltow Canal"],["CANTOR","Journalist, RIAS"],["DELFT","Secretary, Senate"],["ASTER","Student, Free University"]
];
const CLUES=[
 ["tin","A tobacco tin to leave in the girder at kilometre 3.4 by midnight."],
 ["names","The film lists twelve Western agents secretly working for the Stasi."],
 ["rook","ROOK services the drop at kilometre 3.4. ROOK is on the list."],
 ["phrase","Fallback: ring Westkreuz on the railway telephone. 'Points reversed for the Hamburg goods.' Ask for Fenwick."],
 ["voss","Major Voss of the MfS is hunting the tin. He has offered you an Easter pass to see Lotte."],
 ["grab","Sergeant Grabowski will cover for you. Once."],
 ["sent","The twelve names have reached Fenwick in the West."]
];
const ENDINGS={E1:"The Girder",E2:"Points Reversed",E3:"The Easter Pass",E4:"Hohenschönhausen",E5:"Ashes",E6:"The 23:50 Goods"};
const doc=t=>`<span class="doc">${t}</span>`;
function filmHTML(){return `<span class="film" aria-label="Film strip, twelve frames"><span class="holes" style="display:block"></span><span class="row">${NAMES.map(([n,r])=>`<span class="fr${n==="ROOK"?" rook":""}"><b>${n}</b>${r}</span>`).join("")}</span><span class="holes" style="display:block"></span></span>`}

/* lever colours: r = red (danger), b = blue (lock / safe), default black */
const S={
start:{t:`Twenty-Two Forty-One`,cost:0,set:[`tin`],p:[
 `Stellwerk Spf is a brick box on stilts above the tracks east of Friedrichstraße, and for eleven years it has been yours from ten at night until six in the morning. Thirty-two levers. A stove. A coffee pot. The illuminated track diagram with its little amber lamps. And six hundred metres west, where the lines cross the river, the border.`,
 `It's November 1962, fifteen months since the Wall went up. Your sister Lotte lives on the other side of it, in Wedding, close enough that on a clear night you could probably see her kitchen light. You haven't spoken to her since August of last year.`,
 `At 22:41 someone comes up the iron stairs too fast. A man in a grey coat, hatless, with his left sleeve dark and wet. He pushes a tobacco tin into your hands, and his fingers leave red on the lid.`,
 `"Kilometre three point four," he gasps. "The girder under the viaduct. Midnight. Don't open it. Don't keep it." Then he's gone down the far stairs into the dark of the yard.`,
 `A minute later, torches sweep the sidings. Whistles. Somebody shouting in the clipped voice of the Transport Police.`],
 o:[[`Hide the tin in the coal scuttle`,`hide`,`b`],[`Open the tin`,`open`],[`Go down into the yard after him`,`yard`,`r`]]},

hide:{t:`The Coal Scuttle`,p:[
 `You push the tin deep into the coal scuttle beside the stove and wipe your hands on a rag. Then you wipe the doorknob, and the top step, and the rag goes into the stove.`,
 `Your hands are shaking. You pour coffee so there's something to do with them.`,
 `Boots on the stairs. A knock you know: two short, one long.`],
 o:[[`Let Sergeant Grabowski in`,`grab`],[`Take the tin back out and open it first`,`open`],[`Pretend you're busy at the levers`,`grab`]]},

open:{t:`Inside the Tin`,p:[
 `Inside, under a layer of pipe tobacco, there's a strip of 35-millimetre film wound tight as a watch spring, and a punched S-Bahn ticket stub. The ticket is from the West: *Westkreuz*.`,
 `The frames are far too small to read by eye. But in the drawer you keep the jeweller's loupe you use for mending watches on slow nights.`,
 `The only good light in the box is the lamp over the levers, and that lamp hangs in a window that faces the yard.`],
 o:[[`Hold the film under the lamp with the loupe`,`read`,`r`],[`Put it back in the tin and hide it`,`hide`,`b`],[`Go down after the man`,`yard`,`r`]]},

read:{t:`Twelve Names`,heat:1,set:[`names`,`rook`],p:[
 `You hold the film up to the lamp and lean in with the loupe. Typed text swims into focus, frame by frame:`,
 doc(`MfS · HAUPTABTEILUNG II\nSources within Western services (doubled)\nCOPY 2 OF 3 · STRICTLY SECRET`),
 filmHTML(),
 `Twelve Western agents, each of them secretly working for the Stasi. Somebody inside the Ministry has photographed this and sent it west.`,
 `Then you read the first frame again. *ROOK. Dead-drop servicing, Spree sector.*`,
 `The man in the grey coat told you to leave the tin in the girder at kilometre 3.4, which is in the Spree sector. Whoever empties that girder at midnight will be ROOK. The list of traitors would go straight into the hands of the first traitor on it.`,
 `Down in the yard, a torch beam stops on your window. Stays there for a moment. Moves on.`],
 o:[[`Hide the tin, quickly`,`hide`,`b`],[`Go down and find the man in grey`,`yard`,`r`],[`Look at the railway telephone`,`phone`]]},

yard:{t:`The Yard`,heat:1,set:[`phrase`],p:s=>[
 `You go down the far stairs with your lantern hooded. Frost on the rails. You find him behind a line of coal wagons, sitting in the gravel with his back against a wheel and his hand pressed to his shoulder.`,
 `"You," he says. "The switchman. Did you..."`,
 s.f.rook?`"ROOK's on your list," you tell him. "The man who empties the girder."\n\nHe shuts his eyes. "Of course he is. Of course."`:`"What's in the tin?" you ask.\n\n"Better you don't know." He coughs. "Better for both of us."`,
 `He grips your sleeve. "Listen. If anything's wrong with the drop, there's a fallback. Your railway telephone still runs to the Western boxes, yes? The Reichsbahn never cut it. Ring Westkreuz. Say: *Points reversed for the Hamburg goods.* Ask for Fenwick. He'll know."`,
 `Torches again, nearer. Dogs.`].map(x=>x.replace("\n\n"," ")),
 o:[[`Hide him in the lamp hut`,`lamphut`,`r`],[`Leave him and go back up to the box`,`grab`],[`Call out to the police`,`police`]]},

lamphut:{t:`The Lamp Hut`,heat:1,set:[`hidden`],p:[
 `You half carry him to the lamp hut at the end of the platform, where the paraffin and spare signal glasses are kept, and lock him in behind the oil drums.`,
 `"Anton," he whispers through the door. It isn't his name, but it'll do. "Thank you, switchman."`,
 `You walk back to the box slowly, swinging your lantern, a man going about his duties. There's a smear of someone else's blood on your cuff.`],
 o:[[`Climb back up to the box`,`grab`],[`Scrub your cuff in the yard water butt first`,`grab`,`b`],[`Go back and ask Anton who sent him`,`anton`]]},

anton:{t:`Who Sent You`,p:[
 `"A clerk," Anton says through the lamp hut door. "Inside Normannenstraße, the Ministry. She's been copying files for two years. That film is the best thing she's ever sent us, and the most dangerous. If Voss gets it back, he'll know which copy it is, and which clerk had copy two."`,
 `"Voss?"`,
 `"Major Voss. Counter-intelligence. He's the one who shot me." A thin laugh. "He'll come and see you tonight. He's very polite. Don't let him be polite to you."`],
 o:[[`Go back up to the box`,`grab`],[`Ring Westkreuz now`,`phone`],[`Ask what will happen to him`,`anton2`]]},

anton2:{t:`What Happens to Anton`,p:[
 `"If the list gets through, I don't much matter," Anton says. "If it doesn't, I matter very much, to a lot of people, for about a week." He's quiet for a while. "I've got a daughter in Spandau. Six. She thinks I sell typewriters."`,
 `You leave him your scarf and your flask, and go.`],
 o:[[`Go back up to the box`,`grab`],[`Ring Westkreuz`,`phone`],[`Check that nobody saw you`,`grab`,`b`]]},

grab:{t:`Sergeant Grabowski`,p:s=>[
 `Sergeant Grabowski of the Transport Police comes up the stairs, red-faced from the cold, and goes straight to the coffee pot without asking. He's done this three nights a week for six years.`,
 `"A man in a grey coat," he says. "Came over a fence at Friedrichstraße. The Stasi lads winged him by the river. You seen him, Karl?"`,
 s.heat>=2?`He looks at the floor by the door, where there's a dark spot you missed. Then at your cuff. Then at your face.`:`He's watching you over the rim of his cup.`],
 o:s=>[[`"Nobody's been up here."`,`grab_lie`,s.heat>=2?`r`:``],[`"I saw someone heading for the river."`,`grab_river`],[`Tell him everything`,`police`]]},

grab_lie:{t:`Six Years of Coffee`,set:[`grab`],p:s=>[
 s.heat>=2?`"Then whose blood is that, Karl?"\n\nYou tell him you cut your hand on a point rod. He looks at your hands, which are not cut. He looks at you for a long time.`:`Grabowski nods slowly and drinks his coffee.`,
 `"I'll write you down as having seen nothing," he says at last, very quietly. "Once. Because of six years of coffee." He puts his cup down. "Voss is coming. MfS. Whatever you're doing, do it better than this."`].map(x=>x.replace("\n\n"," ")),
 o:[[`Clean up properly`,`clean`,`b`],[`Ring Westkreuz on the railway telephone`,`phone`,`r`],[`Wait for Major Voss`,`voss`]]},

grab_river:{t:`Towards the River`,p:[
 `"Towards the river," you say. "Ten minutes ago. Limping."`,
 `Grabowski finishes his coffee in one swallow and clatters back down the stairs, shouting to his men.`,
 `It buys you time. It also sends a dozen men with dogs down to the water, which is close to the viaduct, which is where kilometre post 3.4 is.`],
 o:[[`Clean up properly`,`clean`,`b`],[`Ring Westkreuz on the railway telephone`,`phone`,`r`],[`Wait for Major Voss`,`voss`]]},

police:{t:`Doing Your Duty`,p:s=>[
 `You tell Grabowski. ${s.f.hidden?"The lamp hut. The grey coat.":"The grey coat. Which way he went."} Grabowski's face does something complicated, then settles.`,
 `"Right," he says. "Right. Good man, Karl." He blows his whistle on the stairs. Ten minutes later you watch from the window as the man in grey is marched along the platform between two policemen, not looking up.`,
 `"And the thing he was carrying?" Grabowski asks. "He'll have been carrying something. They always are."`],
 o:[[`Hand him the tin`,`E3`],[`"He wasn't carrying anything."`,`voss`,`r`],[`Say nothing and pour him more coffee`,`voss`]]},

clean:{t:`Doing It Better`,heat:-1,p:[
 `You scrub the step with sand and cold water until the stain is just another shadow on old wood. You burn the bloody rag and the cuff of your shirt. You wipe the loupe and put it back in the drawer with the watch screws.`,
 `The box looks the way it always looks at half past eleven: dull, warm, and smelling of coal and coffee.`,
 `The tin is still in the scuttle.`],
 o:[[`Ring Westkreuz on the railway telephone`,`phone`,`r`],[`Wait for Major Voss`,`voss`],[`Sit by the stove and think`,`hub`]]},

phone:{t:`The Railway Telephone`,heat:1,p:s=>{
 const a=[`The railway telephone is a black Bakelite handset on a hook by the lever frame. The Reichsbahn still runs the S-Bahn on both sides of the city, so the line still runs to the Western boxes, Wall or no Wall. Everyone assumes it's listened to. Everyone uses it anyway.`];
 if(!s.f.phrase){a.push(`You ring Westkreuz. A sleepy Western signalman answers. You have no idea what to say to him. "Wrong box," you mumble, and hang up. Somewhere a reel-to-reel recorder has just logged a call from Spf at an odd hour.`);}
 else if(!s.f.names){a.push(`You ring Westkreuz. "Points reversed for the Hamburg goods," you say. A click. A new voice, English, very calm. "Fenwick. Go ahead."`,`"I have the tin. The drop is bad."`,`"Then read it to me," says Fenwick. "Every frame." But you've never looked at the film, and the loupe is in the drawer, and this line is not a line to linger on. "Ring back when you can read it," says Fenwick, and the line goes dead.`);}
 else {a.push(`You ring Westkreuz. "Points reversed for the Hamburg goods," you say. A click. A new voice, English, very calm. "Fenwick. Go ahead."`,`"The drop is bad. ROOK is on the list."`,`A short silence. "Read it to me. Slowly."`,`So you do, with the loupe in one eye and the handset under your chin: ROOK. HERON. MARTEN. ORGAN. Twelve names, twelve roles. When you're done, Fenwick says, "Got it. Now burn it, and go back to being a switchman. Good luck, Spf." The line clicks dead.`);}
 return a;},
 setIf:s=>s.f.phrase&&s.f.names?[`sent`]:[],
 o:s=>[[`Hang up and wait for Major Voss`,`voss`], s.f.phrase&&!s.f.names?[`Get out the loupe and read the film`,`read`,`r`]:[`Clean up properly`,`clean`,`b`],[`Sit by the stove and think`,`hub`]]},

voss:{t:`Major Voss`,clockTo:1410,set:[`voss`],p:s=>[
 `At 23:30 Major Dieter Voss of the Ministry for State Security climbs your stairs without hurrying. A leather coat, a good haircut, gloves he doesn't take off. He admires your lever frame. He accepts coffee.`,
 `"A man came over the fence at Friedrichstraße tonight carrying something that belongs to us," he says. "${s.f.hidden?"We haven't found him yet.":s.seen.police?"We have him now. He didn't have it.":"We'll find him. He didn't get far."} He passed close to your box, Comrade Brandt."`,
 `He looks out at the dark. "You have a sister in Wedding, I think. Charlotte. It must be hard. Easter passes are being discussed for next spring, for citizens of good standing. A day across. A lunch. I could see that your name was on the list." He smiles. "Do you have anything to tell me?"`],
 o:s=>[[`Hand him the tin`,`E3`],[`"I've seen nothing, Comrade Major."`,s.heat>=3?`E4`:`voss_gone`,s.heat>=3?`r`:``],[`Ask him about Lotte`,`voss_lotte`]]},

voss_lotte:{t:`Charlotte`,p:[
 `"What would happen to Lotte's brother if he had nothing to tell you?"`,
 `Voss sets down his cup. "Nothing at all. Tonight." He pulls on his second glove. "But files are very long, Comrade Brandt, and memories at the Ministry are even longer. I'll be back at midnight. Think about Easter."`,
 `At the door he pauses. "The 23:50 goods for Hamburg runs through your points, doesn't it? A man could do something very foolish with a train like that. I mention it only as a railway enthusiast."`],
 o:[[`Let him go, and think`,`hub`],[`Throw the points and run for the 23:50 goods`,`E6`,`r`],[`Call him back and hand over the tin`,`E3`]]},

voss_gone:{t:`Midnight, Then`,p:[
 `Voss studies you for a while. You look back at him, a tired switchman with coal under his fingernails.`,
 `"Very well," he says pleasantly. "I'll come back at midnight, when the night's quieter. Perhaps you'll have remembered something by then." He pulls on his second glove. "Think about Easter, Comrade Brandt."`,
 `You listen to his car start in the yard below.`],
 o:[[`Sit by the stove and think`,`hub`],[`Ring Westkreuz on the railway telephone`,`phone`,`r`],[`Clean up properly`,`clean`,`b`]]},

hub:{t:`Twenty to Midnight`,clockTo:1420,p:s=>{
 const a=[`The box ticks and creaks as the stove settles. On the diagram, the lamp for the 23:50 goods comes on, amber, waiting for your road. Somewhere out in the dark, kilometre post 3.4 is waiting too.`];
 if(s.f.sent) a.push(`Twelve names are in Fenwick's notebook now, on the other side of the river. The film in the scuttle is just film.`);
 else if(s.f.rook) a.push(`You know who will empty that girder. You can't stop thinking about it.`);
 if(s.f.hidden) a.push(`In the lamp hut, a man you call Anton is trying to stay awake.`);
 if(s.heat>=3) a.push(`Your hands won't stop shaking. Anyone looking closely would notice.`);
 return a;},
 o:s=>hubOpts(s)},

finale:{t:`Midnight`,cost:0,clockTo:1440,p:s=>{
 const a=[`The goods train for Hamburg grinds past below, couplings clanking, and the box shudders. Then it's gone, and it's quiet, and the clock above the lever frame says midnight.`,
 `Headlights sweep the yard. Major Voss's car. In two minutes he'll be on your stairs.`];
 if(s.f.sent) a.push(`Fenwick has the names. All that's left on this side is a strip of film and a tin.`);
 else if(s.f.rook) a.push(`The drop is at kilometre 3.4. The man who empties it is the first name on the list.`);
 else a.push(`The man in grey told you: the girder, midnight, don't open it.`);
 a.push(`The stove door is hot under your hand.`);
 return a;},
 o:s=>[[`Run down to kilometre 3.4 and make the drop`,`E1`,`r`],[`Burn the film in the stove and face Voss`, s.heat>=4?`E4`:(s.f.sent?`E2`:`E5`),`b`],[`Hand the tin to Major Voss`,`E3`]]},

E1:{end:true,t:`The Girder`,p:s=>[
 `You run along the cess beside the tracks with the tin inside your coat, to the viaduct, to the girder with the hollow in it at kilometre 3.4. You push the tin in and walk back as fast as a man can walk without running.`,
 `At ten past midnight, from your window, you see a figure in a railwayman's cap go down to the viaduct and come away again.`,
 s.f.rook?`You knew who he was. You did it anyway, because a dying man told you to, and because you didn't know what else to do.`:`You did exactly what the man in grey asked you to do.`,
 `Three weeks later Anton's name is in *Neues Deutschland*: a Western agent, tried and sentenced. The twelve on the list keep working for both sides. In a Ministry office at Normannenstraße, a clerk who once photographed a file is called in for a conversation, and doesn't come home.`,
 `Voss never comes back to your box. He doesn't need to.`,
 `*ROOK emptied the drop. The list went home to the people it was written about.*`]},

E2:{end:true,best:true,t:`Points Reversed`,p:s=>[
 `You lift the stove lid and drop in the film. It flares white, curls, and is gone, and the smell of burning celluloid is lost in the smell of coal. The tin goes into the ash pan with the clinker. Then you pour two cups of coffee.`,
 `Voss searches the box himself, gently, thoroughly, for forty minutes. The scuttle. The drawers. The loupe and the watch screws. ${s.f.grab?"Grabowski, leaning in the doorway, says you've been at your levers all night, and he should know, he drank half your coffee.":"He finds a tired switchman and a great deal of coal."} At last he pulls on his gloves. "Goodnight, Comrade Brandt."`,
 `In the West, over the following winter, twelve agents are quietly taken off the board. Western handlers leave a decoy tin at kilometre 3.4; ROOK is arrested there with a tin in his hand that contains nothing but pipe tobacco and a note: *POINTS REVERSED*. ${s.f.hidden?"Anton is smuggled west in a mail van three days later, and goes home to his daughter in Spandau.":""}`,
 `In 1992, in the reading room of the new Stasi Records Agency, you read your own file. It's very thin. The last entry is in Voss's tidy hand.`,
 doc(`BRANDT, Karl. Switchman, Stw. Spf.\nUnremarkable. No further action.`),
 `Lotte, who came with you, reads it over your shoulder and laughs until the archivist asks her to be quiet.`]},

E3:{end:true,t:`The Easter Pass`,p:s=>[
  s.seen.police&&!s.seen.voss?`You hand Grabowski the tin. He takes it straight to Major Voss, who summons you to the yard before midnight. Voss weighs it in his gloved palm and doesn't open it. "Thank you, Comrade Brandt. That was the correct choice."`:`You hand Major Voss the tin. He weighs it in his gloved palm and doesn't open it. "Thank you, Comrade Brandt. That was the correct choice."`,
 `At Easter, as promised, you're given a day pass. You queue for four hours in the new glass hall at Friedrichstraße that people have already started calling the Palace of Tears, and then Lotte is in front of you, older, crying, laughing, holding your face in both hands. You have lunch. You don't tell her anything.`,
 `Over the following year, Western agents walk into traps in Wannsee, in Helmstedt, on the Teltow Canal. In a Ministry office, a clerk who once photographed a file is called in for a conversation.`,
 s.seen.police?`You never find out what happened to the man in grey.`:`You never find out what happened to the man in grey. You try not to wonder.`,
 `*Voss knew what you wanted most and offered it to you for one evening.*`]},

E4:{end:true,t:`Hohenschönhausen`,p:[
 `Voss doesn't raise his voice. He doesn't need to. He looks at the step, and the cuff, and the loupe in the drawer, and your hands, and he nods to the two men waiting on the stairs.`,
 `Hohenschönhausen is a prison with no windows you can see out of. They're patient there. They have all the time in the world, and you have none at all.`,
 `Two years later you're one of the prisoners the West quietly buys out of the East for hard currency. A bus at dawn, curtains drawn, a border crossing you're not allowed to see. You arrive in Lotte's kitchen in Wedding thin, grey and fifty years old at forty-three.`,
 `She makes you coffee. It's terrible. You drink all of it.`,
 `*Suspicion is a lamp that doesn't go out. Too many things tonight made it brighter.*`]},

E5:{end:true,t:`Ashes`,p:[
 `You lift the stove lid and drop the film in. It flares white and is gone.`,
 `Voss searches the box for forty minutes and finds nothing, because there's nothing to find. "Goodnight, Comrade Brandt."`,
 `Nobody got the list. Not the Stasi, not the West. The twelve go on working for both sides, and ROOK goes on emptying the girder at kilometre 3.4, and somewhere a clerk who risked everything to photograph a file never learns that it ended in a signal box stove.`,
 `You keep your job. You keep your life. You sleep very badly for a very long time.`,
 `*Burning it kept you safe. Someone needed to read those names first, to a voice on the other side.*`]},

E6:{end:true,t:`The 23:50 Goods`,p:s=>[
 `You wait until the 23:50 goods begins its approach, then throw lever 14 and lever 17, and the points for the through road clunk over for the Hamburg goods: through the station, over the river, past the border at walking pace, because nobody stops a Reichsbahn freight train in the middle of the night. You've watched it go every night for eleven years.`,
 `You go down the stairs with the tin in your coat and swing up onto the brake van as it passes, the way you did as a boy.`,
 `Searchlights. A shout. Nobody fires at a train full of Reichsbahn coal. Ten minutes later you step down onto the gravel in Spandau with your heart going like a hammer.`,
 `The West Berlin police take the tin. It reaches the right people eventually${s.f.rook?", and you tell them about ROOK":", too late for some"}. Lotte opens her door at two in the morning in her dressing gown and screams, then drags you inside.`,
 `Grabowski is dismissed for negligence. A new switchman takes your box. You never go back east until the Wall comes down, and when you do, Stellwerk Spf is gone.`,
 `*You got out. Everyone you left on that side paid for it.*`]}
};

function hubOpts(s){
  const pool=[];
  if(!s.f.names) pool.push([`Read the film under the lamp`,`read`,`r`]);
  if(s.f.phrase&&s.f.names&&!s.f.sent) pool.push([`Ring Westkreuz and ask for Fenwick`,`phone`,`r`]);
  if(!s.f.phrase) pool.push([`Go down to the yard and look for the man in grey`,`yard`,`r`]);
  if(!s.seen.clean&&s.heat>=2) pool.push([`Clean up properly`,`clean`,`b`]);
  if(!s.f.voss) pool.push([`Wait for whoever comes up the stairs next`,`voss`]);
  const o=pool.slice(0,2);
  const fill=[[`Watch the 23:50 goods lamp on the diagram`,`finale`],[`Sit with your hand on the stove door`,`finale`]];
  while(o.length<2) o.push(fill.shift());
  o.push([`Wait for midnight`,`finale`]);
  return o;
}

/* ---------- engine ---------- */
let state,history=[];
const SAVE_KEY="tac-dead-drop-daily-door-v1";
const fresh=()=>({scene:"start",f:{tin:1},seen:{start:1},clock:1361,n:0,heat:0});
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(d&&d.state&&S[d.state.scene]&&d.state.f&&d.state.seen&&Number.isFinite(d.state.clock)&&Number.isFinite(d.state.heat)&&Array.isArray(d.history))return d}catch(e){}return null}
const val=(x,s)=>typeof x==="function"?x(s):x;
function hm(m){m=Math.round(m)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function loadE(){try{return JSON.parse(localStorage.getItem("deaddrop-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("deaddrop-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—\n])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—\n])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(to){
  if(!S[to])return;
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  const sc=S[to], cost=sc.cost==null?5:sc.cost;
  state.scene=to; state.n++;
  if(sc.clockTo) state.clock=Math.max(state.clock,sc.clockTo);
  else if(!sc.end) state.clock=Math.min(1435,state.clock+cost);
  if(sc.end) state.clock=Math.max(state.clock,1440);
  if(sc.heat&&!state.seen[to]) state.heat=Math.max(0,Math.min(5,state.heat+sc.heat));
  if(to==="phone"&&!state.f.phrase&&!state.seen.phone) state.heat=Math.min(5,state.heat+1);
  state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.setIf) sc.setIf(state).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  persist();render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

function leverSVG(k){
  const col=k==="r"?"var(--red)":k==="b"?"var(--blue)":"var(--steel)";
  return `<svg viewBox="0 0 34 52" aria-hidden="true"><rect x="5" y="44" width="24" height="7" rx="1.5" fill="var(--steel)" opacity=".55"/><rect x="14.5" y="8" width="5" height="38" rx="2" fill="${col}"/><rect x="10" y="4" width="14" height="7" rx="3" fill="${col}"/><rect x="12" y="20" width="10" height="4" rx="1" fill="var(--paper)" opacity=".7"/></svg>`;
}
function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).map(t=>/^<span class="(doc|film)/.test(t)?t:`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span>${sc.end?"<b>Ending</b>":`Night log · entry <b>${String(state.n+1).padStart(2,"0")}</b>`}</span><span>${hm(state.clock)}</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length, c=CLUES.filter(x=>state.f[x[0]]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 16px">You learned ${c} of 7 things in ${state.n} log entries, with suspicion at ${state.heat} of 5.${sc.best?"":" The truest ending needs the names, the fallback phrase, a call to the West, and suspicion kept low."}</p>
     <button class="begin" id="again">Start the night shift again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="levers">${opts.map((o,i)=>`<li><button class="lever ${o[2]||""}" data-i="${i}">${leverSVG(o[2])}<span>${smart(o[0])}<span class="kind">Lever ${i+1}${o[2]==="r"?" · risky":o[2]==="b"?" · keeps you covered":""}</span></span></button></li>`).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to pull a lever</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".lever").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i][1]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".mast");if(window.scrollY>top.offsetHeight)window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  document.getElementById("clock").textContent=hm(state.clock);
  const left=1440-state.clock;
  document.getElementById("due").textContent=left<=0?"Now":`in ${left} min`;
  document.getElementById("heat").innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<state.heat?"on":""}"></i>`).join("");
  document.getElementById("heat").setAttribute("aria-label",`Suspicion ${state.heat} of 5`);
  const n=CLUES.filter(c=>state.f[c[0]]).length;
  document.getElementById("clueCount").textContent=`${n} of 7`;
  document.getElementById("clues").innerHTML=CLUES.map((c,i)=>state.f[c[0]]?`<li><span class="n">${String(i+1).padStart(2,"0")}</span><span>${smart(c[1])}</span></li>`:`<li class="unknown"><span class="n">${String(i+1).padStart(2,"0")}</span><span>Not yet known</span></li>`).join("");
  const r=state.f.names;
  document.getElementById("filmCount").textContent=r?"Read under the lamp, 12 frames":"12 frames, too small to read by eye";
  document.getElementById("names").innerHTML=NAMES.map(([nm])=>`<li class="${r?(nm==="ROOK"?"rook":"read"):""}">${r?nm:"▮▮▮▮▮"}</li>`).join("");
  diagram();
}
function diagram(){
  const f=state.f, on=c=>c?"lampon":"lampoff";
  document.getElementById("diagram").innerHTML=`<svg viewBox="0 0 640 120" role="img" aria-label="Track diagram: the box, the viaduct at kilometre 3.4, and the border to the west">
   <path class="trk" d="M10 40 H630 M10 80 H630 M120 80 L170 40 M420 40 L470 80"/>
   <line class="border" x1="250" y1="14" x2="250" y2="106"/>
   <text x="256" y="22" style="fill:#ff5a4c;opacity:1">GRENZE · BORDER</text>
   <text x="14" y="30">→ WESTKREUZ</text><text x="560" y="30">OSTKREUZ →</text>
   <text x="300" y="104">SPREE VIADUCT</text>
   <rect x="296" y="84" width="70" height="8" fill="none" stroke="var(--panel-ink)" stroke-width="1" opacity=".6"/>
   <circle cx="331" cy="88" r="5" class="${state.scene==="E1"?"lampred":on(1)}"/><text x="316" y="76">km 3,4</text>
   <rect x="500" y="92" width="60" height="22" fill="none" stroke="var(--panel-ink)" opacity=".7"/><text x="508" y="107">STW Spf</text>
   <circle cx="575" cy="98" r="4" class="${state.heat>=3?"lampred":on(state.heat>0)}"/>
   <text x="584" y="101">MfS</text>
   <circle cx="510" cy="60" r="4" class="${on(f.sent)}"/><text x="518" y="63">TEL WESTKREUZ</text>
   <circle cx="150" cy="98" r="4" class="${on(state.clock>=1410)}"/><text x="60" y="101">23:50 GOODS</text>
   <rect class="train" x="${600-Math.min(560,(state.clock-1361)*7)}" y="76" width="16" height="8" rx="2" opacity="${state.clock>=1410?1:.25}"/>
  </svg>`;
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat||/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(document.activeElement?.tagName||""))return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".lever")[i]; if(b)b.click();}
});
function start(d){state=d&&d.state&&S[d.state.scene]?d.state:fresh();history=d&&Array.isArray(d.history)?d.history:[];persist();render(false)}
document.getElementById("ledgerToggle").addEventListener("click",()=>{const a=document.getElementById("intelAside"),b=document.getElementById("ledgerToggle");const open=a.classList.toggle("ledger-open");b.setAttribute("aria-expanded",String(open));b.textContent=open?"Hide intelligence dossier":"View intelligence dossier";});
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(restore());
</script>

</body></html>
