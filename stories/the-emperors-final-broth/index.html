@media (max-width:760px){.kitchen{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kitchen .stat{grid-column:1/-1}}

main{min-width:0}

.meta b{color:var(--gold)}
h2.scene-title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5.6vw,2.8rem);line-height:1.05;margin:0 0 18px;color:var(--porph);text-wrap:balance}

  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:13px 16px;
  font:inherit;font-size:1.02rem;line-height:1.42;cursor:pointer;transition:border-color .15s,background .15s}

aside h3{font-family:var(--display);font-weight:400;font-size:1.55rem;margin:0;color:var(--porph);line-height:1.1}

.ending-card{margin-top:26px;border:1px solid var(--line);border-top:4px solid var(--porph);background:var(--card);padding:20px;max-width:62ch}

  <div class="mosaic" aria-hidden="true"></div>
  <p class="pre">The Ivory Palace of Saranth · Daily Doortal No. 18</p>
  <h1>The Emperor’s Final Broth</h1>
  <div class="kitchen">
    <div class="panel"><span class="lbl">The pot</span><div id="bowl"></div></div>
    <div class="panel"><span class="lbl">Flavour</span><div id="radar"></div></div>
    <div class="panel stat">
      <div><span class="lbl">The bell</span><b id="bell">First bell</b></div>
      <div class="em"><span class="lbl">The Emperor's strength</span><div class="bar"><i id="emBar"></i></div></div>
      <div class="sus"><span class="lbl">Suspicion on you</span><div class="bar"><i id="susBar"></i></div></div>
    </div>
  </div>
</header>

<div class="wrap">
  <main id="main" aria-live="polite"></main>
  <aside><details class="tac-mobile-details" open><summary>Evidence and the three heirs</summary>
    <section><h3>Evidence</h3><p class="count" id="eCount"></p><ul class="ev" id="ev"></ul></section>
    <section style="margin-top:22px"><h3>The three heirs</h3><div class="heirs" id="heirs"></div></section>
  </details></aside>
</div>

<script>
const EV=[
 ["cups","At banquets the heir apparent drinks first from the Heir's Cup. Last night the Emperor took Theodora's cup for a toast."],
 ["sela","The poison is Sela resin, from the eastern frontier. Whoever grinds it raw cannot taste bitterness for three days."],
 ["mallow","Mother Zoe: white mallow root, steeped slow, draws Sela out of the blood."],
 ["kit","Prince Leontius's campaign chest holds a lump of Sela, the wax seal unbroken."],
 ["market","Prince Basil's valet bought 'almond paste' from an eastern trader the day before the banquet. The trader sells Sela."],
 ["debts","Basil owes forty thousand gold to the Arenzi bankers. Theodora has refused to pay them."]
];
const ENDINGS={E1:"The Final Broth",E2:"Bitter Truth",E3:"The Soldier's Head",E4:"The Cook Did It",E5:"Out Through the Drains",E6:"The Intended Victim"};
/* broth ingredients: colour + flavour vector [salt, sour, bitter, sweet, savour, aroma] */
const ING={
 capon:{n:"Clear capon stock",col:"#e9c97a",f:[3,1,0,1,4,2],step:"stock"},
 saffron:{n:"Bone-and-saffron court stock",col:"#d48a1c",f:[3,1,0,2,5,5],step:"stock"},
 fish:{n:"The Emperor's fish stock",col:"#b9b28f",f:[5,1,1,0,5,3],step:"stock"},
 seafennel:{n:"Sea-fennel, sharp and bitter",col:"#4f7a3a",f:[1,0,5,0,0,2],step:"test"},
 sweetfennel:{n:"Sweet fennel",col:"#a9c77a",f:[0,0,1,3,0,3],step:"test"},
 pepper:{n:"Long pepper",col:"#7a3b22",f:[0,0,1,0,1,4],step:"test"},
 mallow:{n:"White mallow root, steeped slow",col:"#f2ece0",f:[0,0,0,2,1,1],step:"heal"},
 honey:{n:"A spoon of thyme honey",col:"#d9a43a",f:[0,0,0,4,0,1],step:"heal"},
 wine:{n:"A splash of Chian wine",col:"#7a1f3a",f:[0,2,1,2,0,3],step:"heal"}
};
const AX=["Salt","Sour","Bitter","Sweet","Savour","Aroma"];
const HEIRS=[["Theodora","Eldest, 32. Scholar. Heir apparent.","#5b1f4a"],["Leontius","Second, 29. General of the East.","#2e5b6b"],["Basil","Youngest, 22. Poet. Charming.","#9a7520"]];

const S={
start:{t:`The Command`,bell:1,p:[
 `You are Irene Mavros, Mistress of the Imperial Kitchens of Saranth. Last night you cooked the Feast of the Vine for three hundred guests. Before the last course, the Emperor Aurelian collapsed at the high table with a goblet in his hand.`,
 `He's alive, just. This morning, from his bed, grey-faced, he sent for you.`,
 `"One of my three children did this," he whispered. "I know it as I know my own pulse. I don't know which. Tonight at the sixth bell they will dine with me, all three. Make me a broth, Irene. A broth that tells me who."`,
 `Then the Grand Chamberlain Kyros escorted you out, and said quietly in the corridor: "You cooked the feast. If the broth tells him nothing, the broth will be blamed on its cook."`],
 o:[[`Go back to the banquet hall and look at the cups`,`cups`],[`Visit Mother Zoe, the old herbalist, to learn what poison it was`,`zoe`],[`Go straight to the kitchens and start the stock`,`kitchen`]]},

cups:{t:`The Heir's Cup`,bell:2,set:[`cups`],p:[
 `The banquet hall hasn't been cleared. The high table is a mess of spilled wine and toppled candles. Your scullery boy Niko is waiting by the Emperor's chair, white-faced.`,
 `"I poured that cup myself," he says. "It wasn't the Emperor's. It was the Heir's Cup, the gold one with the vine. Princess Theodora's. The heir always drinks first, for luck."`,
 `"Then why did the Emperor have it?"`,
 `"He took it from her for the toast. He said, *to my daughter, who'll rule after me,* and drank from her cup, the way old men do to be sweet." Niko swallows. "It wasn't meant for him, mistress. It was meant for her."`],
 o:[[`Ask Princess Theodora about last night`,`theo`],[`Visit Mother Zoe the herbalist`,`zoe`],[`Go to the kitchens`,`kitchen`]]},

zoe:{t:`Mother Zoe`,bell:2,set:[`sela`,`mallow`],p:[
 `Mother Zoe has been the palace herbalist since before the Emperor had a beard. She sniffs the dregs from the gold cup and her face changes.`,
 `"Sela. Resin from the eastern hills. You can't buy it in the city. Soldiers bring it back as a curiosity." She taps her own tongue. "Grind it raw and it kills your taste for bitter. Three days, you can chew wormwood and smile. Whoever ground this is still numb, Irene. Today. Tonight."`,
 `She opens a drawer and hands you a pale knob of root. "White mallow. Steep it slow, an hour at least, and it draws Sela out of the blood. It won't cure him. It might buy him time."`],
 o:[[`Search Prince Leontius's quarters, since he's back from the east`,`leon`],[`Go to the spice market`,`market`],[`Go to the kitchens`,`kitchen`]]},

theo:{t:`Princess Theodora`,bell:3,p:s=>[
 `Theodora is in the library, as always, red-eyed, surrounded by books on poisons. "I was meant to drink it," she says before you can speak. "I know. Father took my cup. He was being *kind*."`,
 `She closes a book hard. "Leontius brought crates of eastern curiosities home last month. And Basil..." She hesitates. "Basil asked me for money last week. Forty thousand to the Arenzi bankers. I said no. I said he'd have to stop gambling first."`,
 s.f.sela?`"Princess, can you taste bitter today?" She looks at you strangely, then takes a sip of the cold black tea at her elbow and pulls a face. "Disgusting. Why?"`:`She looks at you. "You're going to find out, aren't you? Good."`],
 set:[`debts`],
 o:[[`Search Prince Leontius's quarters`,`leon`],[`Go to the spice market`,`market`],[`Go to the kitchens`,`kitchen`]]},

leon:{t:`The General's Quarters`,bell:3,sus:1,p:[
 `Prince Leontius is in the training yard, so you go through his quarters with Niko keeping watch, which is a hanging offence for a cook.`,
 `His campaign chest is full of eastern things: a carved knife, a felt hat, letters from his soldiers. And in a tin box, wrapped in oilcloth, a lump of dark resin the size of a walnut, sealed in red wax with his own signet.`,
 `The seal is unbroken. The lump is whole.`,
 `On your way out you meet the Prince himself in the corridor. He looks at you, and at Niko, and at the door. "Looking for poison, Mistress Mavros?" He laughs, hard. "Everybody assumes the soldier did it. Make your broth. I'll eat it."`],
 set:[`kit`],
 o:[[`Go to the spice market`,`market`],[`Ask Princess Theodora about last night`,`theo`],[`Go to the kitchens`,`kitchen`]]},

market:{t:`The Spice Market`,bell:4,set:[`market`],p:[
 `The eastern traders sit at the far end of the spice market under striped awnings, among sacks of pepper and dried roses. You know most of them; you buy their saffron.`,
 `Old Hamid, who sells resins, won't meet your eye. You buy his most expensive saffron without haggling, and then he talks. "A young man came on the eve of the feast. A palace valet, in Prince Basil's blue. He asked for *almond paste*." He shrugs. "We all know what that means, in the east quarter. It means Sela."`],
 o:[[`Hurry back to the kitchens`,`kitchen`],[`Ask Princess Theodora about Basil`,`theo`],[`Look for Basil's valet`,`valet`]]},

valet:{t:`The Valet`,bell:4,sus:2,p:[
 `You find Basil's valet in the laundry court. When you say *almond paste*, he goes grey and bolts, and two palace guards see you chasing a prince's servant down a corridor with a ladle in your hand.`,
 `The Grand Chamberlain hears about it within the hour. "Interesting," he says, when you pass him on the stairs. "The cook is very busy accusing people today."`],
 o:[[`Go back to the kitchens. You've no time left`,`kitchen`],[`Slip out of the palace through the kitchen drains while you still can`,`E5`],[`Ask Theodora what she knows about Basil`,`theo`]]},

kitchen:{t:`The Imperial Kitchens`,bell:4,p:s=>[
 `The kitchens are hot and roaring and full of frightened people pretending to work. You clear the big hearth, hang the copper pot, and roll up your sleeves.`,
 `The broth must be served at the sixth bell. You have time for one good stock, and whatever you put into it.`,
 s.f.sela?`You know what you're testing for: a tongue that can't taste bitter.`:`You don't know yet what you're testing for. You'll have to cook it and watch.`,
 `First, the stock.`],
 step:"stock",
 o:[[`A clear capon stock: plain, so every other flavour shows`,`test`,"capon"],[`The rich bone-and-saffron court stock, the Emperor's pride`,`test`,"saffron"],[`The salty fish stock the Emperor loves best`,`test`,"fish"]]},

test:{t:`The Second Ingredient`,bell:5,p:s=>[
 `The stock simmers. ${s.pot.stock==="capon"?"Clear as glass, golden, smelling of nothing but chicken and patience.":s.pot.stock==="saffron"?"Deep orange and heavy with saffron. It smells like a coronation.":"Grey-gold and very salty. The Emperor will love it."}`,
 `Now the thing that will do the telling.`,
 s.f.sela?`A tongue numbed by Sela can't taste bitter. Feed a bitter broth to someone who ground Sela three days ago, and they'll eat it like milk.`:`You stand over the pot thinking about what a guilty person might give away at a table.`],
 o:[[`Sea-fennel: sharp, green and very bitter`,`heal`,"seafennel"],[`Sweet fennel: gentle, kind on a sick stomach`,`heal`,"sweetfennel"],[`Long pepper: heat, to make them sweat`,`heal`,"pepper"]]},

heal:{t:`For the Emperor`,bell:5,p:s=>[
 `One last thing, for the Emperor himself. He'll be served from the same pot as his children; there's no other way to be fair.`,
 s.f.mallow?`Mother Zoe's white mallow root sits on the bench. It needs an hour's slow steeping. You have, just barely, an hour.`:`He's very weak. Something to strengthen him, then.`],
 o:s=>s.f.mallow?[[`Steep Mother Zoe's white mallow root, slowly`,`serve`,"mallow"],[`A spoon of thyme honey, for strength`,`serve`,"honey"],[`A splash of Chian wine, the Emperor's favourite`,`serve`,"wine"]]:[[`A spoon of thyme honey, for strength`,`serve`,"honey"],[`A splash of Chian wine, the Emperor's favourite`,`serve`,"wine"],[`Nothing more. Keep it simple`,`serve`,null]]},

serve:{t:`The Sixth Bell`,bell:6,p:s=>{
 const p=s.pot, valid=p.stock==="capon"&&p.test==="seafennel";
 const a=[`At the sixth bell you carry the copper pot into the Emperor's bedchamber yourself. He's propped up on pillows, grey as ash, but his eyes are sharp. The three heirs sit at a small table at the foot of his bed. The Grand Chamberlain stands by the door.`,
 `You ladle four bowls from the one pot, in front of everyone. The Emperor's first. Then the three heirs.`];
 if(p.heal==="mallow") a.push(`The Emperor sips. A little colour comes into his face. He sips again.`);
 else if(p.heal==="wine") a.push(`The Emperor sips and coughs. Wine is the last thing his poisoned blood needs. He sets the bowl down.`);
 if(valid){a.push(`Then his children taste. The capon stock is so clear that the sea-fennel's bitterness hits like a slap.`,
  `<span class="taste"><span class="row"><span class="who">Theodora</span><span>Winces, puts a hand to her mouth, and forces herself to keep eating for her father's sake.</span></span><span class="row"><span class="who">Leontius</span><span>Grimaces, then laughs. "Mistress Mavros, did you cook this out of a hedge?"</span></span><span class="row calm"><span class="who">Basil</span><span>Eats calmly, spoon after spoon. Wipes his mouth. "Delicious, Mistress. Truly."</span></span></span>`,
  `Nobody else in the room can taste that broth without flinching. Basil can.`);}
 else {a.push(`Then his children taste.`,
  `<span class="taste"><span class="row"><span class="who">Theodora</span><span>Eats quietly, watching her brothers.</span></span><span class="row"><span class="who">Leontius</span><span>Eats like a soldier, fast, without looking up.</span></span><span class="row"><span class="who">Basil</span><span>Eats elegantly, and compliments the ${p.stock==="saffron"?"saffron":p.stock==="fish"?"fish":"stock"}.</span></span></span>`,
  `${p.stock!=="capon"&&p.test==="seafennel"?"Whatever bitterness the sea-fennel carried is lost under the richness of the stock. ":""}All three eat. All three are calm. The broth has told you nothing.`);}
 a.push(`The Emperor turns his head on the pillow and looks at you. "Well, Irene?" he says. "Who?"`);
 return a;},
 o:s=>{const p=s.pot, valid=p.stock==="capon"&&p.test==="seafennel";const proof=valid||(s.f.market&&s.f.kit&&s.sus<4);const fullySolved=valid&&s.f.sela&&p.heal==="mallow";
  return [[`"Prince Basil."`,proof?(fullySolved?`E1`:`E2`):`E4`],[`"Prince Leontius."`,`E3`],[`"Princess Theodora."`,`E6`]];}},

E1:{end:true,best:true,t:`The Final Broth`,p:s=>[
 `"Prince Basil," you say. "Sela resin numbs the tongue to bitterness for three days. That broth is the most bitter thing I've ever served. He's the only one who can't taste it."`,
 `${s.f.market?"You tell them about the valet, the eastern trader and the almond paste. ":""}${s.f.kit?"You tell them about Leontius's Sela, still sealed with his signet. ":""}${s.f.cups?"And you tell them that the poison was never meant for the Emperor. It was in the Heir's Cup. It was meant for Theodora.":""}`,
 `Basil stops smiling. ${s.f.debts?"\"Forty thousand,\" Theodora says quietly. \"You'd have killed me for forty thousand gold.\"":""} He doesn't deny it. He just puts his spoon down very carefully, as if it matters where it goes.`,
 `The white mallow has done its work. The Emperor has strength enough to sit up, and to speak clearly, in front of witnesses: Basil to exile on the island of Prinkipo, for life. Theodora confirmed as heir. And the Mistress of the Kitchens cleared of all suspicion, by imperial word.`,
 `He lives eleven more days. On the last of them he asks for broth, clear capon, nothing bitter in it. You make it yourself and sit with him while he drinks it.`,
 `Empress Theodora's first decree, a month later, is that no cook in Saranth shall ever again be blamed for a meal she was ordered to make.`]},

E2:{end:true,t:`Bitter Truth`,p:s=>[
 `"Prince Basil," you say, and explain: ${s.pot.stock==="capon"&&s.pot.test==="seafennel"?"the bitterness that only one heir could ignore":"the valet, the trader, and Leontius's untouched Sela"}.`,
 `Basil doesn't deny it. The guards take him.`,
 `But the Emperor has no strength left. ${s.pot.heal==="wine"?"The wine has made his blood run faster, and the poison with it.":"Nothing in the broth could draw the Sela out of him."} He manages a nod to you, then a word to Theodora that only she can hear, and by midnight the bells are ringing for him.`,
 `Justice is done. You were right. The Emperor died knowing it, which was what he asked for.`,
 `*The broth exposed the poisoner. The herbalist's white mallow root could have bought the Emperor time to see it through.*`]},

E3:{end:true,t:`The Soldier's Head`,p:s=>[
 `"Prince Leontius," you say. "The Sela came from the east. He brought crates of eastern things home."`,
 `Leontius stands up so fast his chair falls over. "I *told* you everyone would think it was the soldier!" ${s.f.kit?"Then, to his father: \"My Sela is still in my chest, sealed. Look!\" Nobody looks.":""}`,
 `The Grand Chamberlain is very efficient. By morning the second prince of Saranth is in the Tower.`,
 `Three weeks later, after the Emperor's funeral, Princess Theodora dies of a fever nobody can explain. Prince Basil, grief-stricken, accepts the crown. His first act is to pay the Arenzi bankers forty thousand gold.`,
 `*The eastern poison pointed at the soldier, which is exactly why it was chosen. His own Sela was never touched.*`]},

E4:{end:true,t:`The Cook Did It`,p:s=>[
 `"Prince Basil," you say. But your broth has told nobody anything${s.pot.stock!=="capon"&&s.pot.test==="seafennel"?": the bitterness was drowned in the stock":""}, and you have no other proof.`,
 `Basil looks wounded. "Mistress Mavros, I've always loved your cooking." The room believes him. He has a gift for that.`,
 `The Grand Chamberlain steps forward. "The cook prepared the banquet. The cook prepared this broth. The cook accuses a prince without evidence." He nods to the guards.`,
 `You spend a long time in the palace cells. Long enough to hear the bells for the Emperor. Long enough to hear them again, for Theodora.`,
 `*A plain stock and a bitter herb would have let the tongues speak. Or two pieces of evidence from the city.*`]},

E5:{end:true,t:`Out Through the Drains`,p:[
 `You know the palace drains better than anyone, because you've spent twenty years cursing them. You go down through the scullery grating with Niko, and an hour later you come out in the fish market by the harbour, stinking, free.`,
 `You take ship for the west that night.`,
 `News reaches you months later in a port town where you've opened a small, good kitchen: the Emperor died without knowing who poisoned him. The cook was blamed, in her absence. Princess Theodora died the following spring. Emperor Basil is said to be a great patron of the arts.`,
 `You never put sea-fennel in anything again.`]},

E6:{end:true,t:`The Intended Victim`,p:s=>[
 `"Princess Theodora," you say.`,
 `She stares at you. "*Me?* It was my cup! It was meant for *me*!" ${s.f.cups?"And you knew that. You know you did. Niko told you.":""}`,
 `The Emperor turns his face to the wall. The Grand Chamberlain is very efficient.`,
 `Theodora is confined to a convent on the Bosphorus shore. Basil weeps beautifully at his father's funeral. Leontius, who suspects everything and can prove nothing, goes back to the frontier and never comes home.`,
 `*The heir apparent wasn't the poisoner. She was the target. The Heir's Cup said so.*`]}
};

/* ---------- engine ---------- */
let state,history=[];
const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,bell:1,sus:1,pot:{}});
const val=(x,s)=>typeof x==="function"?x(s):x;
const BELLS=["","First bell","Second bell","Third bell","Fourth bell","Fifth bell","Sixth bell"];
function loadE(){try{return JSON.parse(localStorage.getItem("broth-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("broth-endings",JSON.stringify(e))}catch(err){}}
const SAVE_KEY="tac-broth-daily-door-v1";
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(d&&d.state&&S[d.state.scene]&&Array.isArray(d.history))return d}catch(e){}return null}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  const [,to,ing]=opt;
  if(ing!==undefined){const cur=S[state.scene];const step=cur.step||(state.scene==="test"?"test":state.scene==="heal"?"heal":null);if(step) state.pot[step]=ing}
  const sc=S[to], first=!state.seen[to];
  state.scene=to; state.n++;
  if(sc.bell) state.bell=Math.max(state.bell,sc.bell);
  if(first&&sc.sus) state.sus=Math.min(5,state.sus+sc.sus);
  state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  persist();render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).map(t=>/^<span class="(recipe|taste)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span><b>${sc.end?"After the sixth bell":BELLS[state.bell]}</b></span><span>Folio ${state.n+1}</span></div>
   <h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length, c=EV.filter(x=>state.f[x[0]]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 16px">Your broth: ${["stock","test","heal"].map(k=>state.pot[k]?ING[state.pot[k]].n.toLowerCase():"—").join(" · ")}. ${c} of 6 pieces of evidence.${sc.best?"":" The truest broth lets a numbed tongue betray itself, and steeps something to buy the Emperor time."}</p>
     <button class="begin" id="again">Light the hearth again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>{const g=o[2]?ING[o[2]]:null;
      return `<li><button class="choice" data-i="${i}"><span class="num">${["I","II","III","IV"][i]}</span><span>${smart(o[0])}${g?`<span class="tag"><span class="sw" style="background:${g.col}"></span>${g.f.map((v,j)=>v>=3?AX[j]:"").filter(Boolean).join(" · ")||"Mild"}</span>`:""}</span></button></li>`}).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".mast");if(window.scrollY>top.offsetHeight)window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const sc=S[state.scene];
  document.getElementById("bell").textContent=sc.end?"Night":BELLS[state.bell];
  let em=Math.max(5,100-state.bell*13);
  if(state.pot.heal==="mallow"&&(state.scene==="serve"||state.scene==="E1")) em=Math.min(100,em+30);
  if(state.pot.heal==="wine") em=Math.max(3,em-12);
  if(sc.end&&state.scene!=="E1") em=0;
  document.getElementById("emBar").style.width=em+"%";
  document.getElementById("susBar").style.width=(state.sus*20)+"%";
  const c=EV.filter(x=>state.f[x[0]]).length;
  document.getElementById("eCount").textContent=`${c} of 6 gathered`;
  document.getElementById("ev").innerHTML=EV.map(([k,t])=>state.f[k]?`<li>${smart(t)}</li>`:`<li class="unk">Not yet found</li>`).join("");
  const notes={Theodora:state.f.cups?"The poison was in her cup.":"",Leontius:state.f.kit?"His Sela is sealed and whole.":"",Basil:state.f.market?(state.f.debts?"Valet bought Sela. Owes 40,000 gold.":"His valet bought Sela."):state.f.debts?"Owes 40,000 gold.":""};
  document.getElementById("heirs").innerHTML=HEIRS.map(([n,d,c])=>`<div class="heir"><span class="face" style="background:${c}">${n[0]}</span><span><b>${n}</b><small>${d}${notes[n]?"<br><span style=\"color:var(--gold)\">"+notes[n]+"</span>":""}</small></span></div>`).join("");
  drawBowl();drawRadar();
}
function mixCol(){const ks=["stock","test","heal"].map(k=>state.pot[k]).filter(Boolean);if(!ks.length) return null;
  const h=k=>[1,3,5].map(i=>parseInt(ING[k].col.slice(i,i+2),16));const w=[0.6,0.25,0.15];let r=[0,0,0],tw=0;
  ks.forEach((k,i)=>{const c=h(k),ww=w[i]||.15;r=r.map((v,j)=>v+c[j]*ww);tw+=ww});return `rgb(${r.map(v=>Math.round(v/tw)).join(",")})`}
function drawBowl(){
  const c=mixCol(), steam=c&&!S[state.scene].end;
  document.getElementById("bowl").innerHTML=`<svg viewBox="0 0 160 110" role="img" aria-label="The pot: ${["stock","test","heal"].map(k=>state.pot[k]?ING[state.pot[k]].n:"").filter(Boolean).join(", ")||"empty"}">
   ${steam?`<path d="M58 30 q-6 -10 2 -18 q6 -6 0 -14 M80 28 q-6 -10 2 -18 q6 -6 0 -14 M102 30 q-6 -10 2 -18 q6 -6 0 -14" stroke="var(--muted)" stroke-width="1.5" fill="none" opacity=".5"/>`:""}
   <ellipse cx="80" cy="44" rx="62" ry="12" fill="${c||"var(--bg)"}" stroke="var(--gold)" stroke-width="2.5"/>
   ${state.pot.test==="seafennel"?`<path d="M62 44 l6 -3 M70 46 l5 -4 M92 43 l6 -3 M100 46 l4 -4" stroke="#2f5a22" stroke-width="2"/>`:""}
   ${state.pot.heal==="mallow"?`<ellipse cx="86" cy="45" rx="6" ry="2.5" fill="#f7f2e6"/>`:""}
   <path d="M18 44 Q22 96 80 98 Q138 96 142 44" fill="var(--gold)" opacity=".9"/>
   <path d="M30 60 Q80 70 130 60" stroke="var(--card)" stroke-width="1" opacity=".5" fill="none"/>
   <rect x="64" y="96" width="32" height="6" rx="2" fill="var(--gold)"/>
   ${!c?`<text x="80" y="48" text-anchor="middle" style="font:italic 11px var(--body);fill:var(--muted)">empty</text>`:""}
  </svg>`;
}
function drawRadar(){
  const v=[0,0,0,0,0,0];["stock","test","heal"].forEach((k,i)=>{const g=state.pot[k];if(g) ING[g].f.forEach((x,j)=>v[j]+=x*(i===0?1:.9))});
  const mx=8,cx=80,cy=58,R=44,pt=(i,r)=>[cx+r*Math.sin(i*Math.PI/3),cy-r*Math.cos(i*Math.PI/3)];
  let grid="";for(const f of [.33,.66,1]){grid+=`<polygon points="${[0,1,2,3,4,5].map(i=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`}
  const poly=v.map((x,i)=>pt(i,R*Math.min(1,x/mx)).join(",")).join(" ");
  const labels=AX.map((l,i)=>{const [x,y]=pt(i,R+11);return `<text x="${x}" y="${y+3}" text-anchor="middle" style="font:600 8px var(--ui);fill:${i===2&&v[2]>=4?"var(--bitter)":"var(--muted)"};letter-spacing:.06em">${l.toUpperCase()}</text>`}).join("");
  document.getElementById("radar").innerHTML=`<svg viewBox="0 0 160 118" role="img" aria-label="Flavour profile: ${AX.map((a,i)=>a+" "+Math.round(v[i])).join(", ")}">${grid}
   ${v.some(x=>x>0)?`<polygon points="${poly}" fill="var(--porph)" fill-opacity=".22" stroke="var(--porph)" stroke-width="1.8"/>`:""}${labels}</svg>`;
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.closest("input,textarea,select,[contenteditable]"))return;
  const i=["1","2","3","4"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){const saved=d&&d.state?d:restore();state=saved&&saved.state&&S[saved.state.scene]?saved.state:fresh();history=saved&&Array.isArray(saved.history)?saved.history:[];render(false);persist();const details=document.querySelector(".tac-mobile-details");if(details&&matchMedia("(max-width:860px)").matches)details.open=false}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>
