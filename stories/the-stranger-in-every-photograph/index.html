html{background:var(--bg)}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 56px}

.mast{max-width:1060px;margin:0 auto 26px;text-align:center}

main{min-width:0}
.stage{margin:0 0 22px;display:grid;justify-items:start;gap:10px}
.print,.back,.thumb,.choice{box-sizing:border-box}
.print{background:var(--print);padding:12px 12px 40px;box-shadow:0 1px 2px var(--shadow),0 14px 28px -18px var(--shadow);position:relative;max-width:560px;width:100%;transform:rotate(-.6deg)}

.print.zoom{max-width:min(360px,100%);border-radius:50%;padding:10px;aspect-ratio:1/1;transform:none;background:#2a2622;box-shadow:0 0 0 6px #4a443d,0 16px 30px -12px var(--shadow)}

.meta{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}

.hint{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:14px;letter-spacing:.04em}
.tools{display:flex;gap:18px;margin-top:20px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;font-family:var(--mono);font-size:.76rem;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.thumb{background:var(--print);padding:4px 4px 16px;box-shadow:0 1px 2px var(--shadow);position:relative}
.thumb svg{display:block;width:100%;height:auto}

.thumb.empty{background:transparent;box-shadow:none;border:1px dashed var(--line);aspect-ratio:400/300}

.thumb.future{outline:2px solid var(--grease);outline-offset:1px}
.likeness{display:grid;gap:8px}
.lk{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;border-bottom:1px dotted var(--line);padding-bottom:6px;font-size:.95rem}
.lk .st{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.verdict{font-family:var(--pencil);font-size:1.6rem;line-height:1.05;color:var(--grease);margin-top:4px}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.notes li{font-family:var(--pencil);font-size:1.32rem;line-height:1.1;color:var(--ink)}
.notes li::before{content:"— ";color:var(--grease)}
.notes li.none{font-family:var(--body);font-style:italic;font-size:.9rem;color:var(--muted)}

.endings{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:.94rem}

.endings li{color:var(--muted)}
.endings li.got{color:var(--ink)}

.endings li:not(.got)::before{content:"○ "}
.endnote{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin:0 0 16px;line-height:1.6}
.begin{font-family:var(--mono);font-size:.84rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--page);border:0;border-radius:2px;padding:10px 18px;cursor:pointer}
.begin:focus-visible{outline:2px solid var(--grease);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
/* The Axiom Continuum publisher strip and responsive reference sections */
.publisher{max-width:1060px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 .72rem var(--mono);letter-spacing:.02em;color:var(--muted)}
.publisher a{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.publisher a:hover,.publisher a:focus-visible{color:var(--grease);text-decoration:underline}
.publisher img{display:block;width:28px;height:28px}
aside details{min-width:0}
aside summary{cursor:pointer;list-style:none}
aside summary::-webkit-details-marker{display:none}
aside summary h3{display:inline-block}
aside summary::after{content:"⌄";float:right;font-family:var(--mono);font-size:1.25rem;color:var(--grease);transition:transform .2s}
aside details[open] summary::after{transform:rotate(180deg)}
aside summary:focus-visible{outline:2px solid var(--grease);outline-offset:3px}
@media(min-width:901px){aside summary{cursor:default}aside summary::after{display:none}}
@media(max-width:900px){aside{gap:12px}aside details{border:1px solid var(--line);background:var(--page);padding:12px;border-radius:3px}aside .album{border:0}}
</style>

function fig(x,y,s,o={}){
  const h=y-62*s, c=o.col||"#3b3633";
  let g=`<path d="M${x-13*s} ${y} L${x-10*s} ${h+14*s} Q${x} ${h+8*s} ${x+10*s} ${h+14*s} L${x+13*s} ${y} Z" fill="${c}"/>`;
  if(o.dress) g=`<path d="M${x-22*s} ${y} L${x-8*s} ${h+14*s} Q${x} ${h+8*s} ${x+8*s} ${h+14*s} L${x+22*s} ${y} Z" fill="${c}"/>`;
  g+=`<circle cx="${x}" cy="${h}" r="${8*s}" fill="${SKIN}"/>`;
  g+=o.turn?`<path d="M${x-8*s} ${h} A${8*s} ${8*s} 0 0 1 ${x+8*s} ${h} L${x+8*s} ${h+4*s} Q${x+2*s} ${h-2*s} ${x-8*s} ${h+6*s} Z" fill="${o.hair||"#3a2c22"}"/>`:`<path d="M${x-8*s} ${h-1*s} A${8*s} ${8*s} 0 0 1 ${x+8*s} ${h-1*s} Q${x} ${h-5*s} ${x-8*s} ${h-1*s} Z" fill="${o.hair||"#3a2c22"}"/>`;
  if(o.stranger){
    for(let i=0;i<3;i++) g+=`<circle cx="${x+1*s}" cy="${h+22*s+i*9*s}" r="${1.4*s}" fill="${i===1?BRASS:"#4c5155"}"/>`;
    g+=`<path d="M${x-9*s} ${h+15*s} L${x} ${h+30*s} L${x+9*s} ${h+15*s}" stroke="#5d6267" stroke-width="${1.2*s}" fill="none"/>`;
  }
  if(o.locket) g+=`<ellipse cx="${x}" cy="${h+13*s}" rx="${1.6*s}" ry="${2.2*s}" fill="${BRASS}"/><path d="M${x-4*s} ${h+8*s} L${x} ${h+11*s} L${x+4*s} ${h+8*s}" stroke="${BRASS}" stroke-width="${.6*s}" fill="none"/>`;
  if(o.arm) g+=`<path d="M${x+9*s} ${h+20*s} L${o.arm[0]} ${o.arm[1]}" stroke="${c}" stroke-width="${5*s}" stroke-linecap="round"/><circle cx="${o.arm[0]}" cy="${o.arm[1]}" r="${2.6*s}" fill="${SKIN}"/>`;
  if(o.scar&&o.arm) g+=`<path d="M${o.arm[0]-2*s} ${o.arm[1]-1*s} l${4*s} ${2*s}" stroke="#f3e6d6" stroke-width="${.7*s}"/>`;
  return g;
}

  details:{face:{lbl:"Look at her face. She's facing the camera, this time",vb:"304 108 28 28",flag:"closer",note:"Facing us. She's crying. Or smiling.",text:`For the first time in any photograph, she's facing the camera. She's far off, on the other shore, ankle-deep in the lake, too small for detail. But you can see enough: she's either crying or smiling. With Agnes, you used to say, it was usually both.`},
   jetty:{lbl:"Look at the jetty",vb:"16 166 200 60",flag:"jetty",note:"The jetty at the bottom of the garden. Still there.",text:`That's the jetty at the bottom of Agnes's garden. It's still there, grey and soft, with the third board missing. You're on it, six years old, in a red jumper, holding your grandmother's hand.`}},
  back:`Mara & me, Lough Carra, August '94. She came closer this time. — A.`},
 f1:{year:2027,cap:"27·08·2027",tone:"saturate(.9)",future:1,
  draw:()=>`<rect width="400" height="300" fill="#d2e0e6"/><rect y="120" width="400" height="22" fill="#5e7a59"/><rect y="142" width="400" height="158" fill="#6f93a6"/>
   ${[0,1,2,3,4,5,6].map(i=>`<path d="M${i*60} ${124} l14 -18 l14 18 z" fill="#4c6a48"/>`).join("")}
   <rect x="20" y="196" width="190" height="12" fill="#7b6249"/>${[0,1,3,4].map(i=>`<rect x="${30+i*42}" y="206" width="5" height="40" fill="#5b4633"/>`).join("")}
   ${fig(198,196,.6,{dress:1,col:"#f0c33c",hair:"#6b4a2b"})}
   ${fig(244,262,.95,{col:COAT,stranger:1,locket:1,arm:[210,180],scar:1})}<rect x="200" y="232" width="100" height="70" fill="#6f93a6" opacity=".92"/>
   <text x="388" y="290" text-anchor="end" font-family="monospace" font-size="13" fill="#ff9a3c">27 08 '27</text>`,
  details:{face:{lbl:"Look at the woman in the water",vb:"224 176 40 40",flag:"lakeFace",note:"It's ME. Older by a year. In the water.",text:`She's waist-deep, reaching for the end of the jetty, where a little girl in a yellow dress is leaning out too far. This time there's no mistaking the face. It's yours. A year older, hair pinned up badly, mouth open, shouting.`},
   shore:{lbl:"Look along the shore for yourself",vb:"220 116 180 50",flag:"nobody",note:"Nobody on the shore. Where am I?",text:`You look along the shore, the garden, the jetty, for yourself: Lily's mother, who should be there with a towel. There's nobody. On the 27th of August next year, on the shore, there is nobody at all.`}},
  back:`(no inscription: the paper is blank, and faintly warm)`},
 f2:{year:2026,cap:"Tonight",tone:"none",future:1,

   ${fig(230,262,1.05,{col:"#5a3f3c",hair:"#1a0d0b",turn:1})}${fig(36,262,1,{col:"#5a3f3c",hair:"#1a0d0b"})}<rect x="30" y="196" width="22" height="14" fill="#1a0806"/><circle cx="46" cy="203" r="4" fill="#3a1410"/>`,

};
const ORDER=["p1","p2","p3","p4","f1","f2"];
function svg(id,vb,marks){const P=PH[id];
  return `<svg viewBox="${vb||"0 0 400 300"}" preserveAspectRatio="xMidYMid slice" style="filter:${P.tone}" role="img" aria-label="Photograph, ${P.year}: ${P.cap}">${P.draw()}${marks||""}</svg>`}
function marksFor(s,id){const P=PH[id];let m="";
  Object.values(P.details).forEach(d=>{if(s.f[d.flag]){const [x,y,w,h]=d.vb.split(" ").map(Number);m+=`<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2+4}" ry="${h/2+4}" fill="none" stroke="#c4312b" stroke-width="2.4" opacity=".9" transform="rotate(-4 ${x+w/2} ${y+h/2})"/>`}});
  return m;}
const photo=(s,id)=>`<div class="stage"><div class="print">${svg(id,null,marksFor(s,id))}<div class="cap"><span>${PH[id].cap}</span><b>${PH[id].year}</b></div></div></div>`;
const zoom=(s,id,k)=>`<div class="stage"><span class="loupe-lbl">Under the loupe · ${PH[id].year}</span><div class="print zoom">${svg(id,PH[id].details[k].vb)}</div></div>`;
const backOf=(id)=>`<div class="stage"><div class="back"><span class="stamp">REVERSE · ${PH[id].year}</span>${PH[id].back}</div></div>`;
const diary=(h,t)=>`<span class="diary"><span class="h">${h}</span>${t}</span>`;
const note=t=>`<span class="note">${t}</span>`;
const ident=s=>(s.f.coatMatch?1:0)+(s.f.locket?1:0)+(s.f.scarSeen&&s.f.cut?1:0);

const ENDINGS={E1:"In the Picture",E2:"The Woman at the Edge",E3:"Ashes",E4:"A Rational Explanation",E5:"Fogged",E6:"Left Unexplained"};
const S={
start:{t:`The Hatbox`,stage:s=>photo(s,"p1"),p:[
 `Your grandmother Agnes died in September, at eighty-seven, in the house by Lough Carra where she'd lived for sixty years. In October you drive up from Dublin to clear it. Your husband, Joe, stays home with Lily, who is eight.`,
 `The house is cold, so you take Agnes's old grey coat off the hook in the hall and wear it. Around your neck is the locket she gave you when you were six. "Found it," she said, and never told you where.`,
 `In the wardrobe there's a hatbox full of photographs. The first one you pick up is a wedding: your great-grandmother Nora, on the steps of St Brigid's, 1931. At the far left, by the railings, apart from everyone, is a woman in a long grey coat with her face turned away.`,
 `You pick up the next photograph, and she's in that one too. And the next. Every photograph.`],
 o:[[`Look at the wedding photograph properly`,`p1`],[`Spread the whole hatbox out on the kitchen table`,`album`],[`Go down to Agnes's darkroom in the cellar`,`dk`]]},

album:{t:`The Kitchen Table`,stage:s=>`<div class="stage"><div class="duo">${["p1","p2","p3","p4"].map(id=>`<div class="print">${svg(id,null,marksFor(s,id))}<div class="cap"><span>${PH[id].year}</span></div></div>`).join("")}</div></div>`,p:s=>{
 const a=[`Ninety-five years of your family, spread out under the kitchen light: weddings, birthdays, a bus stop, the lake. And in every single one, at the edge of the frame, the woman in the grey coat. Never in the middle. Never quite facing the camera. Always about forty.`];
 if(ident(s)>=2&&!s.seen.mirror) a.push(`You realise you've stopped looking at the photographs. You're looking at the coat sleeve on your own arm.`);
 return a;},
 o:s=>hub(s)},

dk:{t:`The Darkroom`,red:1,p:s=>[
 `Agnes's darkroom is a cupboard under the cellar stairs: an enlarger, three trays, a line strung with pegs, and a red safelight in a cage. ${s.f.cut?"The broken bulb is swept into the corner.":"The safelight's bulb is cracked."}`,
 `On the bench is her old folding camera, and next to it a film canister with a label in Agnes's hand: *Not yet. — A.*`,
 s.seen.dev?`The two strange prints hang on the line where you left them.`:`The film inside has been exposed. Someone has taken pictures with it and never developed them.`],
 o:s=>[s.seen.dev?[`Look at the prints from the roll again`,`dev`]:[`Develop the roll`,`dev`,null,`Not yet, she wrote`],
   s.f.cut?(s.seen.mirror?[`Sit under the red light with the 1958 photograph`,`redlight`,null,`You know what she meant now`]:[`Wrap your hand properly, and go up`,`album`]):[`Change the cracked safelight bulb`,`cut`],
   [`Go back up to the kitchen`,`album`]]},

cut:{t:`Broken Glass`,red:1,set:["cut"],p:s=>[
 `The bulb comes apart in your fingers. There's a bright, stupid pain, and then blood, a lot of it, from a clean diagonal cut across your left palm.`,
 `You wrap it in a tea towel. It'll scar, the way palm cuts do: a pale line, corner to corner.`,
 s.f.scarSeen?note(`A pale line across the left palm. Like hers. In 1958.`):`Somewhere at the back of your mind something tries to get your attention and fails.`],
 o:[[`Develop the roll, one-handed`,`dev`],[`Go up and look at the photographs again`,`album`],[`Sit down on the cellar steps for a minute`,`album`]]},

dev:{t:`Not Yet`,red:1,set:["lake","tonight"],stage:s=>`<div class="stage"><div class="duo"><div class="print">${svg("f1",null,marksFor(s,"f1"))}<div class="cap"><span>The lake</span><b>2027</b></div></div><div class="print">${svg("f2")}<div class="cap"><span>The darkroom</span><b>tonight</b></div></div></div></div>`,p:s=>[
 `Developer, stop, fix. The images come up out of the white paper the way they always do, slowly, as if they're making up their minds.`,
 `There are two frames. The first is the lake, from the garden: the jetty, a little girl in a yellow dress at the end of it, and in the water, waist-deep, a woman in a grey coat. Burned in orange in the corner is a date: *27 08 '27.* Next August. The little girl is Lily.`,
 `The second frame is this room. Tonight. You, at the bench, in Agnes's coat. And in the doorway behind you, holding a camera, a woman in a grey coat.`],
 o:s=>{const a=[[`Look at the woman in the water`,`f1face`],[`Look along the shore for yourself`,`f1shore`]];
  a.push(s.seen.ret?[`Pin the lake photograph up, and decide`,`ret`]:[`Turn around`,`turn`]);
  return a;}},

f1face:{t:`The Woman in the Water`,red:1,stage:s=>zoom(s,"f1","face"),set:["lakeFace"],p:[PH.f1.details.face.text],
 o:s=>[s.f.nobody?[`Go back to the darkroom bench`,`dk`]:[`Look along the shore for yourself`,`f1shore`],[`Turn around`,s.seen.ret?`ret`:`turn`],[`Go back up to the kitchen`,`album`]]},
f1shore:{t:`Nobody on the Shore`,red:1,stage:s=>zoom(s,"f1","shore"),set:["nobody"],p:[PH.f1.details.shore.text],
 o:s=>[s.f.lakeFace?[`Go back to the darkroom bench`,`dk`]:[`Look at the woman in the water`,`f1face`],[`Turn around`,s.seen.ret?`ret`:`turn`],[`Go back up to the kitchen`,`album`]]},

turn:{t:`The Doorway`,red:1,p:[
 `You turn around. The doorway is empty. Of course it is. The cellar stairs go up into the dark, and the house ticks the way old houses do.`,
 `Then you notice: Agnes's folding camera isn't on the bench any more. You didn't move it.`],
 o:[[`Go up to the kitchen. Quickly.`,`album`],[`Call Joe`,`joe`],[`Call your Aunt Dot`,`dot`]]},

joe:{t:`Joe`,p:s=>[
 `Joe answers on the fourth ring, half asleep. You tell him: the hatbox, the woman, the roll of film. Saying it out loud, in the kitchen, it sounds like exactly what it is.`,
 `"Mara," he says, very gently. "You've been up there on your own for four days with your gran's things. Come home. Or see someone. Please."`],
 o:[[`Make an appointment with a doctor in the morning`,`E4`],[`Tell him you're fine, and hang up`,`album`],[`Ask him to put Lily on the phone`,`lily`]]},
lily:{t:`Lily`,p:[
 `Lily is eight, and awake, and delighted. She tells you about school and the cat and, at length, about swimming lessons, which she's going to pass "by next summer, definitely, and then I can go off the end of Granny Agnes's jetty all by myself."`,
 `You hold the phone very tightly.`],
 o:[[`Go back to the photographs`,`album`],[`Tell her not to. Not without you.`,`album`,{f:["promisedLily"]}],[`Go down to the darkroom`,`dk`]]},

dot:{t:`Aunt Dot`,p:s=>[
 `Dot is Agnes's younger sister, eighty-one, sharp as a tack, and answers the phone at eleven at night as if she's been expecting you.`,
 `"The lady in the grey coat," she says, before you've finished. "Oh, love. We all saw her. Agnes most of all. We called her the Watcher, when we were small. Mam said she was a ghost. Agnes said she wasn't a ghost, she was *family*. She kept a diary about her. It'll be in the bureau."`],
 o:[[`Find Agnes's diary in the bureau`,`diary`],[`Take Dot's advice: sell the house and leave it alone`,`E6`,null,`"Some things are better left in the box"`],[`Thank her, and go back to the photographs`,`album`]]},
diary:{t:`Agnes's Diary`,set:["diaryRead"],p:[
 diary(`Agnes Halloran · diary · 1958`,`She held my arm at the bus stop and wouldn't let go. I was furious. Then the 14 went off the quay. Afterwards she was gone, but she'd said one thing to me, very quietly: "I came out of the red light, Aggie. Don't you ever sit under it too long."`),
 diary(`Agnes Halloran · diary · 1994`,`I saw her face at last, across the lake, the day Mara was six. I knew her. God help me, I knew her, and I put the camera away for twenty years.`)],
 o:[[`Go back to the photographs`,`album`],[`Go down to the darkroom`,`dk`],[`Read the 1994 entry again`,`album`]]},

kemble:{t:`Kemble & Sons`,p:[
 `Kemble & Sons, Photographers, has been on the Mall in Westport since 1922. Young Mr. Kemble, who is sixty, looks at the 1958 print under his own loupe for a long time.`,
 `"She's on the negative," he says. "Not painted in. Not double-exposed. She was standing there." He hands it back. "Your grandmother asked me the same question. 1994. I gave her the same answer."`],
 o:[[`Ask what Agnes did then`,`kemble2`],[`Go back to the photographs`,`album`],[`Ask him who he'd go and see, if he were you`,`E4`,null,`"A doctor, love"`]]},
kemble2:{t:`"Put the Camera Away"`,p:[
 `"She bought a new red bulb for her darkroom," Mr. Kemble says, "and then she came back a week later and returned it. Said she'd decided she wasn't ready. Said, 'Not yet.'" He smiles. "Funny phrase to use about a light bulb."`],
 o:[[`Go back to the photographs`,`album`],[`Go down to the darkroom`,`dk`],[`Thank him`,`album`]]},

mirror:{t:`The Hall Mirror`,set:["mirror"],p:s=>[
 `You stand up from the kitchen table and walk out into the hall, to the long mirror by the coat hooks, and look.`,
 `A woman of about forty in a long grey wool coat, three buttons, the middle one brass. ${s.f.locket?"A small oval locket at her throat. ":""}${s.f.cut&&s.f.scarSeen?"A fresh cut across her left palm, corner to corner. ":""}Dark hair, pinned up badly.`,
 note(`It's me. The stranger is me.`),
 `And you remember, now, Agnes in the hospice in September, holding your hand, saying something you thought was the morphine: "Don't sit too long under the red light, love. You'll end up somewhere."`],
 o:[[`Go down to the darkroom`,`dk`],[`Go back to the photographs`,`album`],[`Burn them. All of them. Tonight.`,`E3`,null,`The range is still lit`]]},

redlight:{t:`The Red Light`,red:1,stage:s=>photo(s,"p2"),p:[
 `You sit on the stool under the new red bulb with the 1958 photograph in your scarred hand, and look at it. The bus. Agnes at nineteen. The woman holding her arm.`,
 `You look until the red is the only colour there is. Then it's raining, and there's a smell of diesel, and the No. 14 is pulling in to the stop on Harbour Road.`],
 o:[[`Take Agnes's arm, and don't let go`,`loop58`],[`Stay in the photographs. All of them. Keep watch, forever.`,`E2`,null,`You'll never come back`],[`Pull the cord. White light.`,`E5`,null,`Ruins every print in the room`]]},

loop58:{t:`Harbour Road, 1958`,red:1,set:["loop"],p:[
 `She's nineteen and furious. "Let go of me! I'll miss it!" She's so young. She has your mother's chin and your daughter's temper.`,
 `"Don't get on the 14, Aggie," you say. You hold on. The bus pulls away from the kerb with its wipers going, down towards the quay.`,
 `When it's gone she stares at you, at your face, for a long time. "Have we met?" she says.`],
 o:[[`"Not yet." Then let go, and let the photograph go.`,`ret`,{f:["notYet"]}],[`Tell her who you are`,`ret`,{f:["toldAgnes"]}],[`Stay. There are other photographs that need you.`,`E2`,null,`You'll never come back`]]},

ret:{t:`Forty Seconds`,red:1,stage:s=>s.seen.dev?`<div class="stage"><div class="print">${svg("f1",null,marksFor(s,"f1"))}<div class="cap"><span>The lake</span><b>2027</b></div></div></div>`:photo(s,"p2"),p:s=>[
 `You're on the stool in the cellar. Forty seconds on the darkroom clock. Your palm is aching. The 1958 photograph is face-down on the floor where you dropped it.`,
 `Upstairs, in the hall, the hook where the grey coat hangs is empty. It's on you. It always was.`,
 s.seen.dev?`And on the line, still pegged, is the lake: next August, Lily at the end of the jetty, and the woman in the water. Nobody on the shore.`:`On the bench, still undeveloped, is the roll Agnes labelled *Not yet.*`],
 o:s=>s.seen.dev?[
   (s.f.lakeFace&&s.f.nobody)?[`Pin the lake photograph above Lily's calendar. Next August, you'll be on the shore.`,`E1`,null,`In person`]:[`Look properly at the lake photograph first`,s.f.lakeFace?`f1shore`:`f1face`],
   [`Go back under the red light, to the lake`,`E2`,null,`Be the woman in the water`],
   [`Burn the darkroom: the camera, the roll, the future`,`E3`]]:
  [[`Develop the roll now`,`dev`],[`Burn the darkroom: the camera, the roll, the future`,`E3`],[`Go back under the red light`,`E2`,null,`You'll never come back`]]},

E1:{end:true,best:true,stage:s=>`<div class="stage"><div class="print">${svg("f1",null,"")}<div class="cap"><span>Lough Carra</span><b>27·08·2027</b></div></div></div>`,t:`In the Picture`,p:s=>[
 `You pin the lake photograph above Lily's calendar on the kitchen wall in Dublin, where you'll see it every morning for a year. Joe asks what it is. You tell him the truth, all of it. He doesn't understand. He comes to the lake anyway.`,
 `On the 27th of August 2027 you're on the shore at Lough Carra by ten in the morning, not at the edge of anything, in the middle, in a ridiculous sunhat, with a towel. When Lily goes too far out on the end of the jetty${s.f.promisedLily?", the way you made her promise not to,":""} you're already there. You catch the back of her yellow dress with your scarred left hand.`,
 `That night you develop the roll in Agnes's darkroom one more time. The lake frame has changed. There's no woman in the water. There's a woman on the jetty in a sunhat, holding a child, both of them laughing, both of them looking straight at the camera.`,
 `The old photographs don't change. She's still there, at the edges, in 1931 and 1958 and 1979 and 1994: somebody had to be. ${s.f.toldAgnes?"Agnes knew it was you all along.":"Agnes, you think, always knew."} But from now on, in your family's photographs, you're in the middle.`]},

E2:{end:true,stage:s=>photo(s,"p1"),t:`The Woman at the Edge`,p:s=>[
 `You stay.`,
 `You're at Nora's wedding, by the railings. You're at the bus stop on Harbour Road. You're behind the hedge, holding the gate shut. You're on the far shore of the lake in 1994, close enough to see your own small face in a red jumper. You're in the water in 2027, and you catch Lily.`,
 `You're always about forty. You're never in the middle. You keep watch.`,
 `In Dublin, a man and a little girl wait for a car that never comes up the drive. Years later, going through a hatbox, Lily finds a woman in a grey coat at the edge of every photograph, and something about her face seems almost familiar.`,
 `*You became the stranger. The truest ending closes the loop and then comes home, to be in the picture instead of at its edge.*`]},

E3:{end:true,t:`Ashes`,p:s=>[
 `You burn them in Agnes's range, one by one: the wedding, the bus stop, the birthday, the lake${s.seen.dev?", the roll, next August":""}. The paper curls and the faces go last.`,
 `You sleep well, for the first time in a week. You go home to Dublin. You don't see her again.`,
 `But burning a photograph doesn't change what was in it. On the 27th of August 2027, at the lake, there's nobody on the shore, and nobody in the water either.`,
 `*The fire got rid of the stranger. It didn't get rid of the lake. The truest ending needs you to be there.*`]},

E4:{end:true,t:`A Rational Explanation`,p:[
 `The doctor in Castlebar is kind and unhurried. Grief, he says, and exhaustion, and a house full of old photographs: the mind is a pattern-finder, and finds what it's afraid of. He gives you something to help you sleep.`,
 `It helps. You sleep. You stop seeing her. You sell the house in the spring, and the hatbox goes to a charity shop in Westport.`,
 `Somebody there takes a photograph for their newsletter: the volunteers behind the counter, with the donated books and the hatbox. At the far edge of the picture, by the door, a woman in a long grey coat has turned her face away.`,
 `*There's always a rational explanation. There's always a woman at the edge. The truest ending takes the photographs seriously.*`]},

E5:{end:true,t:`Fogged`,p:[
 `You pull the cord. White light floods the cupboard: every print on the line, every sheet in the box, the roll, the paper in the trays, all of it fogs to the same flat grey in the time it takes to blink.`,
 `When you go up to the kitchen, the photographs on the table are fine, of course. Only the darkroom is ruined. But you never know, now, what was on the roll. You never know what happens at the lake next August, until it happens.`,
 `*You chose not to know. The truest ending looks, and then acts.*`]},

E6:{end:true,t:`Left Unexplained`,p:[
 `"Some things are better left in the box," Dot says, and you decide she's right.`,
 `You put the photographs back in the hatbox, and the hatbox in the boot of the car, and sell the house to a couple from Galway who want to do it up. The darkroom becomes a utility room. You never go down there.`,
 `The hatbox sits in your attic in Dublin for years. Once in a while Lily asks about "the lady," and you say it was a long time ago.`,
 `*Some mysteries are left unsolved by choice. The truest ending goes down to the darkroom.*`]}
};
// photo inspection scenes, generated
["p1","p2","p3","p4"].forEach(id=>{const P=PH[id];
  const ks=Object.keys(P.details);
  S[id]={t:`${P.year}`,stage:s=>photo(s,id),p:s=>[{p1:`Nora and Tom on the steps of St Brigid's, 14th June 1931, with the family round them in their Sunday best. And by the railings at the far left, alone, the woman in the grey coat.`,p2:`Agnes at nineteen, at the bus stop on Harbour Road in 1958, in her good dress, cross about something. The No. 14 is pulling in behind her. And holding her arm, firmly, the woman in the grey coat.`,p3:`Your mother Claire's eighth birthday, 1979: balloons, a cake, three children in the garden. Behind the hedge, half hidden, the woman in the grey coat.`,p4:`You, aged six, on the jetty with Agnes, August 1994. Across the lake, small, ankle-deep at the water's edge on the far shore, the woman in the grey coat.`}[id]],
   o:s=>[...ks.map(k=>[P.details[k].lbl,id+k,null,"Under the loupe"]),[`Turn it over`,id+"b"]]};
  ks.forEach((k,ki)=>{const d=P.details[k],other=ks[1-ki];
    S[id+k]={t:`${P.year}: Under the Loupe`,stage:s=>zoom(s,id,k),set:[d.flag],p:s=>{const a=[d.text];
       if(d.flag==="scarSeen"&&s.f.cut) a.push(note(`A pale line across her left palm. Like the cut on mine. Tonight.`));
       else a.push(note(d.note));
       return a;},
      o:s=>[[P.details[other].lbl,id+other,null,"Under the loupe"],[`Turn it over`,id+"b"],[`Back to the kitchen table`,`album`]]};});
  S[id+"b"]={t:`${P.year}: The Back`,stage:s=>backOf(id),p:[`On the back, in pencil:`],
   o:s=>{const a=ks.filter(k=>!s.f[P.details[k].flag]).map(k=>[P.details[k].lbl,id+k,null,"Under the loupe"]);a.push([`Back to the kitchen table`,`album`],[`Go down to the darkroom`,`dk`],[`Call your Aunt Dot`,`dot`]);return a.slice(0,3)}};
});
function hub(s){
  const o=[];
  if(ident(s)>=2&&!s.seen.mirror) o.push([`Go out to the hall mirror`,`mirror`,null,`You've seen enough`]);
  const P=[["p1","Look at the wedding, 1931"],["p2","Look at the bus stop, 1958"],["p3","Look at the birthday, 1979"],["p4","Look at the lake, 1994"],["dot","Call Aunt Dot"],["kemble","Take the 1958 print to Kemble's studio in Westport"]];
  P.filter(([k])=>!s.seen[k]).forEach(([k,l])=>o.push([l,k]));
  const r=o.slice(0,2);
  const F=[[`Look at the wedding again`,`p1`],[`Look at the lake again`,`p4`],[`Look at the bus stop again`,`p2`]];
  let i=0;while(r.length<2){const f=F[i++];if(!r.some(x=>x[1]===f[1]))r.push(f)}
  r.push([`Go down to the darkroom`,`dk`]);
  return r;
}

const SAVE_KEY="tac-stranger-photograph-daily-door-v1";
let state,history=[];
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return d&&d.state&&S[d.state.scene]?d:null}catch(e){return null}}
const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0});
const val=(x,s)=>typeof x==="function"?x(s):x;
function loadE(){try{return JSON.parse(localStorage.getItem("stranger-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("stranger-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  const [,to,e]=opt; (e&&e.f||[]).forEach(k=>state.f[k]=1);
  const sc=S[to];
  state.scene=to; state.n++; state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  persist();render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  document.body.classList.toggle("red",!!sc.red&&!sc.end);
  const paras=val(sc.p,state).map(t=>/^<span class="(note|diary)/.test(t)?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span><b>${sc.end?"The last print":sc.red?"The darkroom":"Agnes's house"}</b></span><span>October 2026</span></div>
   ${sc.stage?val(sc.stage,state):""}<h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"An ending"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="endnote">Likeness ${ident(state)} of 3 · ${state.f.loop?"loop closed in 1958":"1958 left open"} · ${state.seen.dev?"the roll developed":"the roll undeveloped"}.${sc.best?"":"<br>The truest ending: learn who she is, close the loop in 1958, then come back and be in the picture in 2027."}</p>
     <button class="begin" id="again">Open the hatbox again</button></div>`;
  } else {
    const opts=val(sc.o,state);
    html+=`<ol class="choices">${opts.map((o,i)=>`<li><button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${smart(o[0])}${o[3]?`<span class="tag${o[3]==="Under the loupe"?" lp":""}">${smart(o[3])}</span>`:""}</span></button></li>`).join("")}</ol>
     <p class="hint">Press 1, 2 or 3 to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".wrap");if(window.scrollY>top.offsetTop)window.scrollTo({top:top.offsetTop-10,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const s=state, id=ident(s)>=2&&s.seen.mirror;
  const have=k=>({p1:1,p2:1,p3:1,p4:1,f1:s.seen.dev,f2:s.seen.dev})[k];
  document.getElementById("album").innerHTML=ORDER.map(k=>{const P=PH[k];
    if(!have(k)) return `<div class="thumb empty"><span>${P.future?"not yet":P.year}</span></div>`;
    const ring=id&&k!=="f2"?(()=>{const t={p1:[56,210],p2:[140,200],p3:[352,196],p4:[318,128],f1:[244,215]}[k];return `<circle cx="${t[0]}" cy="${t[1]}" r="${k==="p4"?22:40}" fill="none" stroke="#c4312b" stroke-width="5"/>`})():"";
    return `<div class="thumb${P.future?" future":""}">${svg(k,null,ring+marksFor(s,k))}<span>${P.future?(k==="f1"?"2027":"tonight"):P.year}</span></div>`}).join("");
  document.getElementById("albumSub").textContent=s.seen.dev?"Six prints, two of them impossible":"Four prints · one roll undeveloped";
  const L=[["The grey coat, brass middle button",s.f.coatMatch?"yes":"no",s.f.coatMatch?"match":"unseen"],
    ["The oval locket",s.f.locket?"yes":"no",s.f.locket?"match":"unseen"],
    ["A scar across the left palm",s.f.scarSeen&&s.f.cut?"yes":s.f.scarSeen||s.f.cut?"half":"no",s.f.scarSeen&&s.f.cut?"match":s.f.scarSeen?"seen on her":s.f.cut?"on you":"unseen"]];
  const n=ident(s);
  document.getElementById("likeness").innerHTML=L.map(([t,c,l])=>`<div class="lk"><span>${t}</span><span class="st ${c}">${l}</span></div>`).join("")+
    `<div class="verdict">${n>=2?(s.seen.mirror?"She is me.":"Two of three. Go and look in the mirror."):n===1?"One of three. Coincidence?":"A stranger."}</div>`;
  const N=[];
  ["p1","p2","p3","p4","f1"].forEach(k=>Object.values(PH[k].details).forEach(d=>{if(s.f[d.flag])N.push(d.note)}));
  if(s.f.cut) N.push("Cut my left palm on the safelight.");
  if(s.f.diaryRead) N.push(`Agnes: "I came out of the red light."`);
  if(s.seen.kemble) N.push("Kemble: she's on the negative. Real.");
  if(s.f.loop) N.push("1958: I held her arm.");
  document.getElementById("notes").innerHTML=N.length?N.map(t=>`<li>${smart(t)}</li>`).join(""):`<li class="none">Nothing written yet.</li>`;
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const i=["1","2","3"].indexOf(e.key); if(i>-1){const b=document.querySelectorAll(".choice")[i]; if(b)b.click();}
});
function start(d){const saved=d&&d.state&&S[d.state.scene]?d:restore();state=saved?saved.state:fresh();history=saved&&Array.isArray(saved.history)?saved.history:[];
  document.querySelectorAll("aside details").forEach(el=>{el.open=!matchMedia("(max-width: 900px)").matches});
  render(false)}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>

</body></html>
