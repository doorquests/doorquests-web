/* Layout: a proscenium with velvet curtains and a marquee; the applause meter and plot gauge beneath; the scene as script pages in revision colours; backstage gossip in the wings. Deliberately dark: a theatre with the house lights down. */

  --velvet:#9e1b32; --velvet2:#5e0f1e; --brass:#d4a84b; --bulb:#ffe3a1; --spot:rgba(255,227,161,.08);
  --page:#f7f4ee; --page-ink:#1b1918;
  --rev-white:#f7f4ee; --rev-blue:#cfe0f5; --rev-pink:#f7d3dc; --rev-yellow:#f8eca8; --rev-green:#cfeccb; --rev-gold:#efcf7a; --rev-cherry:#e9a3ab;
  --display:"Limelight","Broadway",Georgia,serif;
  --body:"EB Garamond","Garamond",Georgia,serif;
  --script:"Courier Prime","Courier New",ui-monospace,monospace;
  --ui:"Josefin Sans","Futura","Century Gothic",sans-serif;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19.5px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}

.mast{max-width:1000px;margin:0 auto 26px}
.proscenium{position:relative;border:3px solid var(--brass);border-radius:120px 120px 4px 4px / 60px 60px 4px 4px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,rgba(255,227,161,.22),transparent 60%),#0b0809;padding:26px clamp(70px,14vw,140px) 22px;text-align:center}
.curtain{position:absolute;top:0;bottom:0;width:clamp(56px,12vw,120px);background:repeating-linear-gradient(90deg,var(--velvet2) 0 6px,var(--velvet) 6px 16px,var(--velvet2) 16px 22px);
  box-shadow:inset -12px 0 18px rgba(0,0,0,.5);transition:width 1s ease}
.curtain.l{left:0;border-radius:0 0 40% 0}
.curtain.r{right:0;border-radius:0 0 0 40%;box-shadow:inset 12px 0 18px rgba(0,0,0,.5)}
.proscenium.closed .curtain{width:52%}
.marquee{display:inline-block;position:relative;border:2px solid var(--brass);padding:10px 18px;background:#1a1214;
  background-image:radial-gradient(circle,var(--bulb) 2px,transparent 3px);background-size:16px 16px;background-position:0 0;background-repeat:repeat-x;padding-top:20px}
.marquee .tonight{font-family:var(--ui);font-weight:700;font-size:.7rem;letter-spacing:.3em;color:var(--brass);text-transform:uppercase}
.marquee h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,8vw,4.2rem);line-height:1;margin:4px 0 2px;color:var(--bulb);text-shadow:0 0 18px rgba(255,227,161,.35)}
.marquee .play{font-family:var(--body);font-style:italic;font-size:1rem;color:var(--ink)}
.slip{position:absolute;right:clamp(66px,13vw,130px);bottom:12px;transform:rotate(6deg);background:var(--rev-yellow);color:var(--page-ink);font-family:var(--script);font-size:.68rem;padding:4px 8px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
@media (max-width:560px){.slip{display:none}}

.gauges{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 26px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
@media (max-width:620px){.gauges{grid-template-columns:auto minmax(0,1fr)}.rev{grid-column:1/-1}}
.lbl{font-family:var(--ui);font-weight:600;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.applause svg{width:150px;height:auto;display:block}
.plot .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.plot .bar i{display:block;height:100%;background:var(--brass);transition:width .6s ease}
.plot .genre{font-family:var(--body);font-style:italic;font-size:1rem;margin-top:8px;color:var(--ink);line-height:1.35}

@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);gap:32px}}
main{min-width:0}
.meta{font-family:var(--ui);font-weight:600;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}
.meta b{color:var(--brass)}
h2.scene-title{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,5.4vw,2.7rem);line-height:1.05;margin:0 0 18px;color:var(--bulb);text-wrap:balance}

.passage em{font-style:italic}
.react{display:block;margin:0 0 1.2em;padding:12px 16px;border:1px solid var(--brass);background:var(--spot);max-width:62ch;font-size:1.02rem}
.react .h{display:block;font-family:var(--ui);font-weight:700;font-size:.66rem;letter-spacing:.2em;color:var(--brass);text-transform:uppercase;margin-bottom:4px}
.page{display:block;background:var(--pg,var(--page));color:var(--page-ink);font-family:var(--script);font-size:.92rem;line-height:1.5;padding:16px 20px 16px 26px;margin:0 0 1.2em;max-width:56ch;box-shadow:3px 3px 0 rgba(0,0,0,.45);position:relative}

.page .who:first-of-type{margin-top:0}

.page .note{display:block;font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive;color:#b0102a;font-size:1.02rem;transform:rotate(-1deg);margin-top:6px}
.fade{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.choices{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px;max-width:62ch}
.choice{width:100%;display:grid;grid-template-columns:2em minmax(0,1fr);gap:10px;align-items:baseline;text-align:left;
  background:var(--wing);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:13px 16px;
  font:inherit;font-size:1.04rem;line-height:1.4;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.choice .num{font-family:var(--display);color:var(--brass);font-size:1.2rem}
.choice .tag{display:inline-block;font-family:var(--ui);font-weight:700;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;margin-top:6px;padding:3px 8px;border-radius:2px;color:var(--page-ink)}
.tag.script{background:var(--rev-white)} .tag.rewrite{background:var(--tagc,var(--rev-pink))} .tag.improv{background:var(--brass)}
.choice:hover{border-color:var(--brass);background:#261d21;box-shadow:0 0 0 1px var(--brass),0 0 24px -6px var(--bulb)}
.choice:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.hint{font-family:var(--ui);font-size:.74rem;letter-spacing:.06em;color:var(--muted);margin-top:14px}
.tools{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;font-family:var(--ui);font-size:.8rem;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--bulb)}
.link:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.link[disabled]{opacity:.4;cursor:default;text-decoration:none}

aside{min-width:0;border-left:1px solid var(--line);padding-left:24px;display:grid;gap:26px}
@media (max-width:860px){aside{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}}
aside h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;color:var(--bulb);line-height:1.1}
aside .count{font-family:var(--ui);font-size:.74rem;letter-spacing:.06em;color:var(--muted);margin:4px 0 12px}
.gossip{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.gossip li{font-size:.96rem;line-height:1.38;padding:8px 10px;background:var(--wing);border-left:3px solid var(--velvet)}
.gossip li.unk{background:transparent;border-left:3px dotted var(--line);color:var(--muted);font-style:italic}
.revs{display:flex;flex-wrap:wrap;gap:5px}
.revs span{font-family:var(--script);font-size:.66rem;padding:3px 6px;color:var(--page-ink);opacity:.35}
.revs span.on{opacity:1;box-shadow:1px 1px 0 rgba(0,0,0,.5)}

.ending-card{margin-top:26px;border:2px solid var(--brass);background:var(--wing);padding:20px;max-width:62ch;text-align:center}
.ending-card .label{font-family:var(--ui);font-weight:700;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:0 0 4px}
.ending-card h4{font-family:var(--display);font-weight:400;font-size:2.3rem;color:var(--bulb);margin:0 0 12px;line-height:1.05}
.endings{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-family:var(--ui);font-size:.86rem;text-align:left}
@media (max-width:480px){.endings{grid-template-columns:minmax(0,1fr)}}
.endings li{color:var(--muted)}
.endings li.got{color:var(--ink)}
.endings li.got::before{content:"✦ ";color:var(--bulb)}
.endings li:not(.got)::before{content:"✧ "}
.begin{font-family:var(--ui);font-weight:700;font-size:.86rem;letter-spacing:.14em;text-transform:uppercase;background:var(--velvet);color:var(--ink);border:1px solid var(--brass);padding:12px 22px;cursor:pointer}
.begin:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.curtain,.plot .bar i{transition:none}}
.tac-brand{max-width:1000px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;font:600 .72rem/1.45 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tac-brand img{width:30px;height:30px;display:block;object-fit:contain}
.tac-brand a{color:inherit;text-decoration:none}
.tac-brand a:hover{text-decoration:underline}
.dossier-toggle{display:none;background:var(--wing);color:var(--bulb);border:1px solid var(--brass);padding:10px 13px;font-family:var(--ui);letter-spacing:.08em;cursor:pointer;text-align:left}
@media(max-width:860px){.dossier-toggle{display:block;width:100%}.wings[data-collapsed="true"]{display:none}}
@media(max-width:560px){.tac-brand{font-size:.65rem}.proscenium{padding-left:clamp(42px,12vw,80px);padding-right:clamp(42px,12vw,80px)}.curtain{width:clamp(35px,9vw,70px)}}
</style>

    <section><h3>Pages received</h3><p class="count">Revision colours, in order</p><div class="revs" id="revs"></div></section>

<script>
const REVS=[["WHITE","--rev-white"],["BLUE","--rev-blue"],["PINK","--rev-pink"],["YELLOW","--rev-yellow"],["GREEN","--rev-green"],["GOLDENROD","--rev-gold"],["CHERRY","--rev-cherry"]];
const GOSSIP=[
 ["tippex","The title page says 'by Ludovic Frane', written over a scrape of correction fluid."],
 ["dot","Dot, the stage manager, knows every line of every version by heart."],
 ["critic","Hester Grue of the Evening Clarion is in row F. She closes shows."],
 ["ludovic","Ludovic hasn't slept in four days. He's rewritten the ending thirty-one times."],
 ["stolen","Barnaby swears Ludovic found the play in the slush pile. 'Some stage manager wrote it.'"],
 ["props","The props table: a ukulele, a fire extinguisher, and a banana labelled GUN (TEMP)."],
 ["original","Dot's original ending, folded in her pocket for two years."]
];
const ENDINGS={E1:"Standing Ovation",E2:"The Real Ending",E3:"One Line in the Clarion",E4:"Twist Ending",E5:"The Butler Did It",E6:"Exit, Pursued by Dot"};
const pg=(rev,body)=>`<span class="page" style="--pg:var(${REVS[rev][1]})"><span class="rv">${REVS[rev][0]} PAGES</span>${body}</span>`;
const who=(n,l)=>`<span class="who">${n}</span><span class="line">${l}</span>`;
const dir=t=>`<span class="dir">(${t})</span>`;
const scrawl=t=>`<span class="note">${t}</span>`;

/* stage beat helper: [label, next, kind, reaction, {laughs,plot,genre}] */
const S={
start:{t:`Beginners, Please`,place:"Dressing room 4 · 7:25 p.m.",p:[
 `You are Pip Calloway, and you are the understudy. Technically you're the understudy for six roles in *The Duchess of Wexley Hall*, which is why you have never properly rehearsed any of them.`,
 `At 7:25, five minutes before curtain, Dot the stage manager opens your door without knocking. She is wearing a headset and the expression of a woman who has seen everything twice.`,
 `"Barnaby Vale is stuck in the stage lift between floors," she says. "With a lobster. Don't ask. You're on as Inspector Thorne. Lead role. Curtain in five."`,
 `Behind her, the director Ludovic Frane appears, holding a fountain pen like a dagger and a stack of fresh pages still warm from the photocopier. "Don't learn anything," he says. "I'm changing it."`],
 o:[[`Skim the script as fast as you can`,`skim`],[`Ask Dot what on earth is going on`,`dot1`],[`Climb out of the dressing-room window`,`E6`]]},

skim:{t:`The Script`,place:"Dressing room 4 · 7:27 p.m.",set:[`tippex`],p:[
 `You flick through the script at speed. Drawing room, library, conservatory, interval, séance, storm, the big reveal. The Inspector gathers the suspects. The butler did it. Classic.`,
 `On the title page, *by Ludovic Frane* is written in fountain pen over a lumpy white scrape of correction fluid. Someone else's name used to be under there. You can just make out a D.`,
 `"PLACES," says Dot's voice from every speaker in the building.`],
 o:[[`Go to the wings`,`peek`],[`Ask Dot about the title page`,`dot1`],[`Go straight on`,`A1`]]},

dot1:{t:`On Book`,place:"Corridor · 7:28 p.m.",set:[`dot`],p:[
 `Dot walks you to the wings at speed. "I'll be on book, stage left, all night. If you dry, look at me. I know every line." A beat. "Every line of every version. There have been a lot of versions."`,
 `"How do you know them all?"`,
 `Dot just looks at you. "Five minutes ago you were the understudy for the butler. Focus."`],
 o:[[`Peek through the curtain at the audience`,`peek`],[`Skim the script on the way`,`skim`],[`Go straight on`,`A1`]]},

peek:{t:`Six Hundred Faces`,place:"The wings · 7:29 p.m.",set:[`critic`,`ludovic`],p:[
 `Through the gap in the curtain: six hundred people in their best clothes, rustling programmes. In row F, dead centre, sits a small woman in grey with a notebook open on her knee and a pencil already sharpened.`,
 `"Hester Grue," whispers the actor beside you. "Evening Clarion. She closed *Hamlet* in a week. *Hamlet!*"`,
 `In the opposite wing, Ludovic is pacing, writing on pages pressed against the wall. His eyes are enormous. "Thirty-one endings," he mutters. "Thirty-one and none of them are *right*."`,
 `The house lights go down.`],
 o:[[`Walk on`,`A1`],[`Take a very deep breath, then walk on`,`A1`],[`Walk on and immediately trip over the rug`,`A1t`]]},

A1t:{t:`An Entrance`,place:"Act One",p:[
 `You trip on the rug on your first step, recover, and turn it into a sort of bow. Some people clap. You're not sure why. Neither are they.`],
 o:[[`Carry on`,`A1`],[`Bow again, to be safe`,`A1`],[`Pretend it was deliberate`,`A1`]]},

A1:{t:`The Drawing Room`,place:"Act One · Scene One",stage:1,rev:1,p:[
 `The curtain rises. The lights are hot. Dame Ottoline Fairweather, seventy-four and magnificent, plays the Duchess. She flings herself at you.`,
 pg(0,who(`DUCHESS`,`Inspector Thorne! Thank heaven you've come. Lord Wexley is... dead!`)+dir(`THORNE turns to the room and says:`)),
 `Your mind is completely blank. In the wings, Dot raises the prompt book. Ludovic snatches it away and holds up a sheet of blue paper instead.`,
 pg(1,scrawl(`THORNE IS NOW FRENCH. COMMIT. — L.`))],
 o:[[`"Nobody leave this room!"`,`A2`,`script`,`It's the right line. Dame Ottoline looks almost disappointed. The play lurches on, intact.`,{plot:1}],
    [`"Zut alors! Nobody... how you say... leave zis room!"`,`A2`,`rewrite`,`A woman in row C snorts so hard she drops her opera glasses. Ludovic punches the air. Dame Ottoline, without missing a beat, replies in flawless French, which nobody expected, least of all you.`,{laughs:1,plot:-1,genre:"French Farce"}],
    [`"Dead? Have we tried turning him off and on again?"`,`A2`,`improv`,`The house roars. Dame Ottoline freezes, then, a professional for fifty years, says, "Several times, Inspector." An even bigger laugh. You might survive this.`,{laughs:2,plot:-1}]]},

A2:{t:`The Library`,place:"Act One · Scene Two",stage:1,rev:2,p:[
 `The library. Lord Wexley lies on the hearthrug, played by Gerald, who has a heavy cold and is trying very hard not to breathe.`,
 pg(0,dir(`THORNE kneels and examines the body.`)+who(`THORNE`,`He's been dead about an hour. Poison. Smell that? Bitter almonds.`)),
 `Dot slides a pink page onto the side table as she sets a teacup.`,
 pg(2,scrawl(`IT IS NOW A MUSICAL. THORNE SINGS "WHO KILLED LORD WEXLEY?" (key of G). THERE IS A UKULELE. — L.`)),
 `There is, indeed, a ukulele on the bookshelf. And Gerald's nose is twitching.`],
 o:[[`Kneel and deliver the line: "Bitter almonds."`,`A3`,`script`,`Solid. Gerald sneezes, but only slightly, and only once. The plot survives.`,{plot:1}],
    [`Grab the ukulele and sing "Who Killed Lord Wexley?"`,`A3`,`rewrite`,`You know three chords. You use all of them. By the second verse the audience is clapping along, and the corpse is tapping his foot.`,{laughs:1,plot:-1,genre:"Musical"}],
    [`Gerald sneezes. "Bless you." Pause. Arrest him for being alive`,`A3`,`improv`,`The house comes apart. Gerald, fully committed, stays limp while you handcuff him to the coal scuttle. Somewhere in the stalls a man is crying with laughter.`,{laughs:2,plot:-2}]]},

A3:{t:`The Conservatory`,place:"Act One · Scene Three",stage:1,rev:3,p:[
 `The conservatory: potted ferns, a wicker chair, and Jenkins the butler, played by Rafi, who is nineteen and was told he was going on about four minutes before you were. His hands are shaking.`,
 pg(0,who(`THORNE`,`Where were you at nine o'clock, Jenkins?`)+who(`JENKINS`,`P-polishing the silver, sir.`)),
 `A yellow page flutters down from the fly gallery. Ludovic is up there with a fishing rod.`,
 pg(3,scrawl(`WE ARE NOW IN SPACE. THE CONSERVATORY IS AN AIRLOCK. — L.`))],
 o:[[`"Where were you at nine o'clock, Jenkins?"`,`interval`,`script`,`Rafi gets his line out. You both visibly relax. The curtain comes down on Act One to warm, slightly puzzled applause.`,{plot:1}],
    [`"Jenkins! The ferns! Close the airlock before they're sucked into the void!"`,`interval`,`rewrite`,`Rafi, bless him, mimes being sucked into space and clings to the wicker chair. The curtain comes down on Act One to a genuine cheer.`,{laughs:1,plot:-1,genre:"Space Opera"}],
    [`Look at Rafi, see his terror, and hug him. "We're going to be all right, Jenkins."`,`interval`,`improv`,`There's a long pause. Then a ripple of "aww" from the dress circle, and then a laugh, and then applause. The curtain comes down on Act One on a hug.`,{laughs:2,plot:-1}]]},

interval:{t:`Interval: Twenty Minutes`,place:"Backstage",curtain:1,p:s=>{
 const a=[`The curtain comes down. Backstage is pandemonium: actors gulping water, someone sewing Gerald back into his waistcoat, the smell of hot lights and panic.`];
 if((s.visits||0)===0) a.push(`"Twenty minutes," says Dot, passing at speed. "Make them count." You have time to talk to two people at most.`);
 else if(s.visits===1) a.push(`"Ten minutes," calls Dot. Time for one more conversation.`);
 else a.push(`"Beginners for Act Two, please," says Dot's voice from every speaker. That's you.`);
 return a;},
 o:s=>{
  if((s.visits||0)>=2) return [[`Go on for Act Two`,`B1`],[`Take a deep breath, then go on`,`B1`],[`Grab the ukulele, just in case, and go on`,`B1`]];
  const pool=[[`Find Dot at the prompt desk`,`dot2`],[`Knock on Ludovic's office door`,`ludo`],[`Visit Barnaby in the stuck lift`,`barnaby`],[`Check the props table`,`props`]].filter(o=>!s.seen[o[1]]);
  pool.push([`Skip the gossip and get ready for Act Two`,`B1`]); return pool;}},

dot2:{t:`The Prompt Desk`,place:"Interval · stage left",visit:1,set:[`dot`],p:s=>{
 const a=[`Dot sits at the prompt desk with the prompt book open: a fat binder with pages in every colour of the rainbow. You notice the first few pages, the oldest ones, at the very back. They're handwritten. Small, neat capitals. Exactly like the labels on every prop and cue sheet in this building.`,
 `"You wrote the first version," you say.`,
 `Dot doesn't look up. "I don't know what you mean."`];
 if(s.f.tippex||s.f.stolen){a.push(`"There was a D under the correction fluid on the title page," you say. ${s.f.stolen?`"And Barnaby says Ludovic found it in the slush pile."`:``}`,`A very long pause. Then Dot reaches into her pocket and takes out four folded white pages, soft with handling.`,`"I sent it to this theatre two years ago. It came back with a rejection slip. Six months later it went into rehearsal with his name on it." She presses the pages into your hand. "That's my ending. The real one. He cut it in the first week. He said it was 'too kind'."`);}
 else a.push(`"Did you write this play, Dot?"`,`"I'm the stage manager," Dot says, which isn't an answer, and goes back to her cue sheet.`);
 return a;},
 setIf:s=>(s.f.tippex||s.f.stolen)?[`original`]:[],
 o:[[`Back to the chaos`,`interval`],[`Thank her and get ready`,`interval`],[`Squeeze her shoulder`,`interval`]]},

ludo:{t:`Thirty-One Endings`,place:"Interval · director's office",visit:1,set:[`ludovic`],p:[
 `Ludovic's office is ankle-deep in balled-up paper. He's writing on the wall now, with a marker.`,
 `"Hester Grue," he says without turning round, "taught me playwriting at the Royal Academy. Twenty years ago. She told me I would never write a play worth the paper." He laughs, a little too high. "So tonight I have to be *perfect*."`,
 `He thrusts a stack of gold-coloured pages at you. "Ending thirty-two. THE INSPECTOR DID IT. It's never been done!" It has been done, quite often. You don't say so.`,
 `"Did you write the first version of this play, Ludovic?"`,
 `He goes very still. "I have rewritten every word of it," he says carefully. "Thirty-one times."`],
 o:[[`Back to the chaos`,`interval`],[`Back away slowly`,`interval`],[`Wish him luck`,`interval`]]},

barnaby:{t:`The Lift`,place:"Interval · between floors",visit:1,set:[`stolen`],p:[
 `Barnaby Vale's voice comes up through the gap in the lift doors, rich and resonant even from between two floors. So does a faint smell of lobster.`,
 `"Darling! Are you me tonight? How *is* it?" He doesn't wait for an answer. "Listen. Ludovic didn't write a word of that play. Found it in the slush pile two years ago. Some stage manager's. Changed the names and kept the rest." A clacking sound. "He's been rewriting it ever since because he doesn't know how it works. Ow. Gerald, the lobster, is *biting*."`,
 `"The lobster's called Gerald?"`,
 `"After the corpse. Seemed fitting."`],
 o:[[`Back to the chaos`,`interval`],[`Promise to send for an engineer`,`interval`],[`Wish Gerald the lobster well`,`interval`]]},

props:{t:`The Props Table`,place:"Interval · stage right",visit:1,set:[`props`],p:[
 `The props table is laid out on brown paper with every item's outline drawn in marker in small, neat capitals. A teacup labelled POISON. A ukulele labelled UKULELE (NEW). A fire extinguisher labelled DO NOT USE (REAL). And a banana, labelled GUN (TEMP).`,
 `"The real gun went missing in tech week," says the props assistant. "Ludovic said a banana was 'more honest'."`],
 o:[[`Back to the chaos`,`interval`],[`Pocket the banana, just in case`,`interval`],[`Admire the labelling`,`interval`]]},

B1:{t:`The Séance`,place:"Act Two · Scene One",stage:1,rev:4,curtain:0,p:[
 `Act Two. Candles. A round table. Madame Zara the medium, played tonight by Brenda from the box office, who has never acted before and is gripping the tablecloth as if it might escape.`,
 pg(0,who(`MADAME ZARA`,`The spirits are... restless.`)+who(`THORNE`,`Ask the spirit who poisoned his tea.`)),
 `A green page has been slipped under the crystal ball.`,
 pg(4,scrawl(`THORNE IS THE DUCHESS'S LONG-LOST TWIN. REVEAL NOW. — L.`)),
 `Dame Ottoline is seventy-four. You are twenty-six.`],
 o:[[`"Ask the spirit who poisoned his tea."`,`B2`,`script`,`Brenda asks. A loud knock comes from under the table, right on cue. The plot creaks forward, and Hester Grue writes something brief.`,{plot:1}],
    [`Turn to Dame Ottoline. "Sister!"`,`B2`,`rewrite`,`Dame Ottoline, without blinking, cries "Brother! Or sister! It's been so long I forget!" and clasps you to her bosom. The dress circle howls.`,{laughs:1,plot:-1,genre:"Gothic Melodrama"}],
    [`The "spirit" knocks. Knock back, then start a conversation in knocks`,`B2`,`improv`,`The stagehand under the table, delighted, knocks back. Within a minute you're having an argument in knocks. The audience is helpless.`,{laughs:2,plot:-1}]]},

B2:{t:`The Storm`,place:"Act Two · Scene Two",stage:1,rev:5,p:[
 `The great storm scene. Thunder rattles from the metal sheet in the wings. Then, midway through the first crack of lightning, every light in the theatre goes out.`,
 `Six hundred people in the dark. Somewhere, Gerald sneezes.`,
 pg(0,dir(`THORNE lights a candle.`)+who(`THORNE`,`The murderer is in this room.`)),
 `By the glow of the fire exit sign you read the goldenrod page pressed into your hand by a figure in black.`,
 pg(5,scrawl(`EVERYONE IS SECRETLY A ROBOT. — L.`))],
 o:[[`Strike a match. "The murderer is in this room."`,`finale`,`script`,`A single match flares in the black. A gasp from the house. It's the best moment of the night so far, and it's in the script.`,{plot:2}],
    [`Robot voice: "DOES. NOT. COMPUTE." Everyone joins in`,`finale`,`rewrite`,`One by one, in the dark, the cast start beeping. Dame Ottoline does a very convincing dial-up modem. When the lights come back on, six hundred people are cheering.`,{laughs:1,plot:-1,genre:"Robot Thriller"}],
    [`Hold the torch under your chin and tell the audience a ghost story`,`finale`,`improv`,`It's a terrible ghost story. You make it up as you go. It is about Gerald. By the time the lights come back on, the audience is laughing so hard nobody notices.`,{laughs:2,plot:-1}]]},

finale:{t:`The Reveal`,place:"Act Two · Final Scene",stage:1,rev:6,p:s=>{
 const a=[`The lights come up on the drawing room. Every suspect is lined up: the Duchess, Jenkins, Madame Zara, the Colonel, and Gerald, who has been propped back up on the hearthrug.`,
 `It's the moment. The Inspector names the murderer. Six hundred people lean forward. In row F, Hester Grue's pencil hovers.`,
 pg(0,who(`THORNE`,`The person who killed Lord Wexley is...`)),
 `In one wing, Ludovic is holding up the gold pages: THE INSPECTOR DID IT.`];
 if(s.f.original) a.push(`In the other wing, Dot is standing very still, looking at you. In your pocket are four soft white pages.`);
 else a.push(`In the other wing, Dot is on book, perfectly calm, waiting.`);
 return a;},
 o:s=>[[`Follow the original script: "...the butler!"`,s.laughs>=7?`E1`:s.plot>=5?`E5`:`E3`,`script`,``,{}],[`Read Ludovic's gold pages: "...me. I did it."`,`E4`,`rewrite`,``,{}], s.f.original?[`Unfold Dot's pages and read her ending`,`E2`,`script`,``,{}]:[`Improvise: "...all of you!"`,s.laughs>=6?`E1`:`E3`,`improv`,``,{}]]},

E1:{end:true,t:`Standing Ovation`,curtain:1,p:s=>[
 s.choseButler?`"The butler!" you announce. The play has been so thoroughly demolished by now that this is the funniest thing anyone has said all night.`:`"All of you!" you announce, and point at everyone, including Gerald, the audience, and the lighting box. "And the lobster!"`,
 `The house rises. Six hundred people on their feet, roaring. Dame Ottoline curtsies to you, not to the audience. Rafi is crying. Gerald sneezes in time with the applause.`,
 `The *Clarion* runs it the next morning: *"An evening of total chaos that somehow became the funniest night in the West End this year."* *The Duchess of Wexley Hall* runs for two years as a comedy.`,
 `Ludovic accepts every award, in a velvet jacket. ${s.f.stolen||s.f.original?"You know whose play it really is. So does Dot. You never quite find the right moment to say so.":"You never find out why Dot looks at him like that."}`,
 `*A triumph. Tonight's play ended up as: ${s.genres.join(" → ")}.*`]},

E2:{end:true,best:true,t:`The Real Ending`,curtain:1,p:s=>[
 `You lower Ludovic's gold pages, take the four white ones out of your pocket, unfold them, and read.`,
 `In Dot's ending, the Duchess did it. Not for money. For love: Lord Wexley was about to send their son away, and she couldn't let him. When she's found out she doesn't run. She sits down, pours tea for everyone in the room, and tells the whole truth, and the Inspector, who could arrest her, doesn't. Not yet. He sits down too, and takes a cup.`,
 `Dame Ottoline reads it over your shoulder, picks it up from your first line, and plays it as if she's rehearsed it for a year. By the end, six hundred people are completely silent. Somebody in the dress circle is crying. Then the applause starts, and doesn't stop.`,
 `At the curtain call you step forward. "Ladies and gentlemen, the ending you just saw was written by our stage manager. Please welcome the author of *The Duchess of Wexley Hall*: Dorothy Abara."`,
 `Dot walks on in her headset, blinking at the light. The house rises for her.`,
 `In row F, Hester Grue closes her notebook. Her review the next morning is one line long: *"Find out what else Dorothy Abara has written, and put it on."*${s.f.ludovic?" Ludovic, it turns out, quietly withdraws his name from the posters the following week. He sends Dot flowers. It's a start.":""}`]},

E3:{end:true,t:`One Line in the Clarion`,curtain:1,p:s=>[
 `You say it. There's a long, terrible pause. Nobody in the audience can remember who anyone is, or what century they're in, or whether this is ${s.genres[s.genres.length-1]==="Murder Mystery"?"still a murder mystery":"still a "+s.genres[s.genres.length-1].toLowerCase()}.`,
 `The curtain comes down to the sound of six hundred people politely looking for their coats.`,
 `The *Evening Clarion*, next morning, page eleven. Hester Grue's review, in full:`,
 `*"I have seen the future of theatre, and it is a fire exit."*`,
 `The show closes on Saturday. You frame the review anyway. It's the first one you've ever had.`]},

E4:{end:true,t:`Twist Ending`,curtain:1,p:s=>[
 `"The person who killed Lord Wexley," you say slowly, reading off the gold pages, "is... me. Inspector Thorne. I did it."`,
 `Silence. Dame Ottoline turns to you with real fury in her eyes. "*Why?*" she ad-libs.`,
 `You look at the gold pages. There's no explanation. Ludovic didn't write one. "I'd... rather not say," you manage.`,
 `The curtain falls on six hundred people talking at once. In the wings, Ludovic is weeping with joy. "Thirty-two," he whispers. "Thirty-two was right."`,
 `The *Clarion* calls it *"baffling, but brave."* Ludovic has that quote printed on a banner. The show runs a respectable month. People argue about the ending in pubs. Nobody can explain it, including you.`,
 s.f.original?`*Dot's pages are still in your pocket. You never unfolded them.*`:`*There was another ending, written long before this one. You'd have needed the right backstage conversations to find it.*`]},

E5:{end:true,t:`The Butler Did It`,curtain:1,p:[
 `"...the butler!"`,
 `Rafi gasps exactly on cue, confesses beautifully, and is led away by the Colonel. The play ends where the script says it ends. The applause is warm and relieved.`,
 `The *Clarion* calls it *"a sturdy revival of an old form, anchored by an understudy who held his nerve."* Barnaby Vale is freed from the lift at eleven, and is back on the following night, and never once asks how it went.`,
 `It was competent. It held together. Nobody will remember it in a year, except you.`,
 `*Steady, safe, and a little forgettable. Laughs and secrets were both available tonight.*`]},

E6:{end:true,t:`Exit, Pursued by Dot`,curtain:1,p:[
 `You open the dressing-room window and climb out onto the fire escape in your Inspector's coat.`,
 `You get as far as the second landing before Dot appears at the window above you, headset still on. "Pip," she says, very calmly. "Come back in."`,
 `You climb faster. So does she.`,
 `She catches you at the stage door. Meanwhile, Barnaby Vale has been freed from the lift by a passing fireman and goes on at 7:40, smelling faintly of lobster. The show is fine. Nobody notices you're gone.`,
 `You spend the evening in the pub over the road, where the barman, it turns out, is also an understudy. You get on very well.`,
 `*The understudy's first rule: you have to actually go on.*`]}
};

/* ---------- engine ---------- */
let state,history=[];
const SAVE_KEY="tac-understudy-daily-door-v1";
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,history}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(d&&d.state&&Object.prototype.hasOwnProperty.call(S,d.state.scene)&&Array.isArray(d.history)&&Array.isArray(d.state.genres)&&d.state.f&&d.state.seen)return d}catch(e){}return {}}

const fresh=()=>({scene:"start",f:{},seen:{start:1},n:0,laughs:2,plot:5,genres:["Murder Mystery"],rev:0,react:null,visits:0,choseButler:0});
const val=(x,s)=>typeof x==="function"?x(s):x;
function loadE(){try{return JSON.parse(localStorage.getItem("understudy-endings")||"{}")}catch(e){return {}}}
function saveE(id){const e=loadE();e[id]=1;try{localStorage.setItem("understudy-endings",JSON.stringify(e))}catch(err){}}
function smart(html){
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:
    p.replace(/(^|[\s(\[—])"/g,"$1“").replace(/"/g,"”")
     .replace(/(^|[\s(\[—])'/g,"$1‘").replace(/'/g,"’")
     .replace(/\*(.+?)\*/g,"<em>$1</em>")).join("");
}
function go(opt){
  history.push(JSON.stringify(state)); if(history.length>60) history.shift();
  const [label,to,kind,react,fx]=opt;
  if(state.scene==="finale"&&kind==="script"&&!label.includes("Dot")) state.choseButler=1;
  if(fx){state.laughs=Math.max(0,Math.min(10,state.laughs+(fx.laughs||0)));state.plot=Math.max(0,Math.min(10,state.plot+(fx.plot||0)));
    if(fx.genre) state.genres.push(fx.genre);}
  state.react=react?{t:react,kind}:null;
  const sc=S[to];
  state.scene=to; state.n++;
  if(sc.visit&&!state.seen[to]) state.visits=(state.visits||0)+1;
  if(sc.rev) state.rev=Math.max(state.rev,sc.rev);
  state.seen[to]=1;
  (sc.set||[]).forEach(k=>state.f[k]=1);
  if(sc.setIf) sc.setIf(state).forEach(k=>state.f[k]=1);
  if(sc.end) saveE(to);
  render(true);
}
function back(){if(!history.length)return;state=JSON.parse(history.pop());persist();render(true)}
function restart(){history=[];state=fresh();persist();render(true)}

const KLAB={script:"Stick to the script",rewrite:"Use the new pages",improv:"Improvise"};
function render(scroll){
  const sc=S[state.scene], main=document.getElementById("main");
  const paras=val(sc.p,state).map(t=>t.startsWith("<span class=\"page")?smart(t):`<p>${smart(t)}</p>`).join("");
  let html=`<div class="fade"><div class="meta"><span><b>${sc.end?"Curtain":sc.place||""}</b></span><span>${sc.end?"Final bow":"Cue "+String(state.n+1).padStart(2,"0")}</span></div>`;
  if(state.react) html+=`<div class="react"><span class="h">The house reacts</span>${smart(state.react.t)}</div>`;
  html+=`<h2 class="scene-title">${smart(sc.t)}</h2><div class="passage">${paras}</div>`;
  if(sc.end){
    const got=loadE(), n=Object.keys(ENDINGS).filter(k=>got[k]).length, c=GOSSIP.filter(x=>state.f[x[0]]).length;
    html+=`<div class="ending-card"><p class="label">${sc.best?"The truest ending":"Ending reached"} · ${n} of 6 discovered</p><h4>${smart(sc.t)}</h4>
     <ul class="endings">${Object.entries(ENDINGS).map(([k,v])=>`<li class="${got[k]?"got":""}">${got[k]?smart(v):"Undiscovered"}</li>`).join("")}</ul>
     <p class="hint" style="margin:0 0 16px">Applause ${state.laughs}/10 · Plot ${state.plot}/10 · ${c} of 7 pieces of gossip · genres tonight: ${state.genres.join(" → ")}.${sc.best?"":" The truest ending is hidden backstage, in the right two interval conversations."}</p>
     <button class="begin" id="again">Do it again tomorrow night</button></div>`;
  } else {
    const opts=val(sc.o,state);
    const rc=REVS[sc.rev||state.rev][1];
    html+=`<ol class="choices">${opts.map((o,i)=>`<li><button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${smart(o[0])}${o[2]?`<br><span class="tag ${o[2]}" style="--tagc:var(${rc})">${KLAB[o[2]]}</span>`:""}</span></button></li>`).join("")}</ol>
     <p class="hint">Press a number key (1–${opts.length}) to choose</p>`;
  }
  html+=`<div class="tools"><button class="link" id="back" ${history.length?"":"disabled"}>Retrace your last step</button><button class="link" id="restart">Start over</button></div></div>`;
  main.innerHTML=html;
  if(!sc.end){const opts=val(sc.o,state);main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));}
  else document.getElementById("again").onclick=restart;
  document.getElementById("back").onclick=back;
  document.getElementById("restart").onclick=restart;
  side();
  if(scroll){const top=document.querySelector(".mast");if(window.scrollY>top.offsetHeight)window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function side(){
  const sc=S[state.scene];
  document.getElementById("pros").classList.toggle("closed",!!sc.curtain||state.scene==="start"||state.scene==="skim"||state.scene==="dot1");
  const a=-90+state.laughs*18, r=52, cx=75, cy=66;
  const nx=cx+r*Math.cos((a-90)*Math.PI/180), ny=cy+r*Math.sin((a-90)*Math.PI/180);
  let ticks="";for(let i=0;i<=10;i++){const t=(-180+i*18)*Math.PI/180;ticks+=`<line x1="${cx+58*Math.cos(t)}" y1="${cy+58*Math.sin(t)}" x2="${cx+64*Math.cos(t)}" y2="${cy+64*Math.sin(t)}" stroke="${i>=7?"var(--bulb)":"var(--muted)"}" stroke-width="${i%5?1:2}"/>`}
  document.getElementById("meter").innerHTML=`<svg viewBox="0 0 150 80" role="img" aria-label="Applause ${state.laughs} of 10">
   <path d="M11 66 A64 64 0 0 1 139 66" fill="none" stroke="var(--line)" stroke-width="8"/>
   <path d="M11 66 A64 64 0 0 1 139 66" fill="none" stroke="var(--velvet)" stroke-width="8" stroke-dasharray="${(state.laughs/10)*201} 400"/>
   ${ticks}
   <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--bulb)" stroke-width="2.5" stroke-linecap="round" style="transition:all .6s"/>
   <circle cx="${cx}" cy="${cy}" r="5" fill="var(--brass)"/>
   <text x="6" y="79" style="font:600 8px var(--ui);fill:var(--muted);letter-spacing:.1em">SILENCE</text>
   <text x="112" y="79" style="font:600 8px var(--ui);fill:var(--bulb);letter-spacing:.1em">UPROAR</text></svg>`;
  document.getElementById("plotbar").style.width=state.plot*10+"%";
  document.getElementById("genre").innerHTML=`Tonight's genre: <b>${smart(state.genres[state.genres.length-1])}</b>${state.genres.length>1?` <span style="color:var(--muted);font-size:.86rem">(was ${state.genres.slice(0,-1).join(", ")})</span>`:""}`;
  const rv=REVS[state.rev];
  const chip=document.getElementById("revchip");chip.textContent=rv[0]+(state.rev?" PAGES":"");chip.style.background=`var(${rv[1]})`;
  document.getElementById("revs").innerHTML=REVS.map((r,i)=>`<span class="${i<=state.rev?"on":""}" style="background:var(${r[1]})">${r[0]}</span>`).join("");
  const c=GOSSIP.filter(g=>state.f[g[0]]).length;
  document.getElementById("gCount").textContent=`${c} of 7 overheard`;
  document.getElementById("gossip").innerHTML=GOSSIP.map(([k,t])=>state.f[k]?`<li>${smart(t)}</li>`:`<li class="unk">Not yet overheard</li>`).join("");
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target instanceof HTMLElement && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)))return;
  if(/^[1-9]$/.test(e.key)){const b=document.querySelectorAll(".choice")[Number(e.key)-1];if(b)b.click();}
});
const toggle=document.getElementById("dossierToggle"),wings=document.getElementById("wings");
toggle.addEventListener("click",()=>{const open=wings.dataset.collapsed==="true";wings.dataset.collapsed=open?"false":"true";toggle.setAttribute("aria-expanded",String(open));toggle.textContent=open?"Hide backstage notes and revisions":"Show backstage notes and revisions"});
function start(d){state=d&&d.state&&S[d.state.scene]?d.state:fresh();history=d&&Array.isArray(d.history)?d.history:[];render(false)}
window.claude?.hot?.snapshot?.(()=>({state,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??restore());
</script>
