<div id="app"><noscript><p style="padding:1rem">The Loom That Remembers needs JavaScript to weave. Everything runs in this page; nothing is sent anywhere.</p></noscript></div>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<script>
/* ---- engine.js ---- */
/* ART-001 The Loom That Remembers — weaving engine (pure functions, no DOM).
   Conventions (documented in art-001-weaving-model-and-sources.md):
   - Matrices are arrays of rows. Row p = pick p (pick 0 is the first pick woven,
     drawn at the BOTTOM of the cloth view, nearest the weaver). Column w = warp end w
     (end 0 is the leftmost end).
   - Drawdown value 1 = warp on top (the end is lifted over the pick); 0 = weft on top.
   - Shaft loom uses a rising shed: a pick's treadle lifts the shafts tied to it.
   - Yarns are single capital letters (A, B, C, D, E). Colours shown on screen are
     approximations, not calibrated reproductions of physical textiles. */
(function (root) {
  'use strict';
  const E = {};
  E.VERSION = 'art001-engine-1.0.0';

  // ---------- small utilities ----------
  const mod = (a, n) => ((a % n) + n) % n;
  E.mod = mod;
  E.gcd = function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
  E.range = (n) => Array.from({ length: n }, (_, i) => i);
  E.matrix = (rows, cols, v) => Array.from({ length: rows }, () => Array(cols).fill(v));
  E.clone = (x) => JSON.parse(JSON.stringify(x));
  E.eqMatrix = function (a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].length !== b[i].length) return false;
      for (let j = 0; j < a[i].length; j++) if (a[i][j] !== b[i][j]) return false;
    }
    return true;
  };
  // FNV-1a 32-bit hash (accidental-change detection only; NOT a security measure)
  E.hash = function (str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('0000000' + h.toString(16)).slice(-8);
  };
  // Deterministic PRNG (mulberry32)
  E.prng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  // ---------- yarn palette (screen approximations) ----------
  E.YARNS = {
    A: { name: 'Indigo', hex: '#26365f', pattern: 'diagonal' },
    B: { name: 'Undyed linen', hex: '#e6dbc1', pattern: 'dots' },
    C: { name: 'Madder', hex: '#a3402e', pattern: 'cross' },
    D: { name: 'Weld gold', hex: '#c9a13b', pattern: 'vertical' },
    E: { name: 'Walnut brown', hex: '#5f4128', pattern: 'horizontal' }
  };
  E.YARN_IDS = Object.keys(E.YARNS);
  E.isYarn = (y) => typeof y === 'string' && Object.prototype.hasOwnProperty.call(E.YARNS, y);

  // WCAG relative luminance and contrast ratio for hex colours
  E.luminance = function (hex) {
    const h = hex.replace('#', '');
    const c = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16) / 255)
      .map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  E.contrastRatio = function (hex1, hex2) {
    const a = E.luminance(hex1), b = E.luminance(hex2);
    const hi = Math.max(a, b), lo = Math.min(a, b);
    return (hi + 0.05) / (lo + 0.05);
  };
  E.mixHex = function (hex1, hex2, t) { // linear sRGB-space lerp for DISPLAY only
    const p = (h) => [0, 2, 4].map((i) => parseInt(h.replace('#', '').substr(i, 2), 16));
    const a = p(hex1), b = p(hex2);
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
  };

  // ---------- color-order sequences ----------
  // "4A 4B" or "AABB" or "A A B B" -> ['A','A','A','A','B','B','B','B']
  E.parseSeq = function (text, maxLen) {
    if (typeof text !== 'string') return null;
    const out = [];
    const tokens = text.toUpperCase().replace(/[,;]/g, ' ').trim().split(/\s+/).filter(Boolean);
    for (const t of tokens) {
      const m = /^(\d+)?([A-Z]+)$/.exec(t);
      if (!m) return null;
      const n = m[1] ? parseInt(m[1], 10) : 1;
      if (m[1] && m[2].length !== 1) return null;
      for (let k = 0; k < n; k++) for (const ch of m[2]) { if (!E.isYarn(ch)) return null; out.push(ch); if (maxLen && out.length > maxLen) return null; }
    }
    return out;
  };
  E.seqToText = function (seq) {
    const parts = []; let i = 0;
    while (i < seq.length) { let j = i; while (j < seq.length && seq[j] === seq[i]) j++; parts.push((j - i) + seq[i]); i = j; }
    return parts.join(' ');
  };

  // ---------- shaft-loom drafts ----------
  E.makeDraft = function (o) {
    const S = o.shafts, T = o.treadles, W = o.ends, P = o.picks;
    return {
      shafts: S, treadles: T,
      threading: o.threading ? o.threading.slice() : Array(W).fill(0),
      tieup: o.tieup ? o.tieup.map((r) => r.slice()) : E.matrix(T, S, 0),
      treadling: o.treadling ? o.treadling.slice() : Array(P).fill(0),
      warpColors: o.warpColors ? o.warpColors.slice() : Array(W).fill(o.warpYarn || 'A'),
      weftColors: o.weftColors ? o.weftColors.slice() : Array(P).fill(o.weftYarn || 'B')
    };
  };
  E.validateDraft = function (d, lim) {
    const errs = [];
    if (!d || typeof d !== 'object') return ['Draft missing'];
    const S = d.shafts, T = d.treadles;
    if (!Number.isInteger(S) || S < 1 || S > 16) errs.push('Bad shaft count');
    if (!Number.isInteger(T) || T < 1 || T > 16) errs.push('Bad treadle count');
    if (!Array.isArray(d.threading) || d.threading.length < 1 || d.threading.length > 48) errs.push('Bad threading length');
    if (!Array.isArray(d.treadling) || d.treadling.length < 1 || d.treadling.length > 48) errs.push('Bad treadling length');
    if (errs.length) return errs;
    if (lim) {
      if (lim.shafts && S !== lim.shafts) errs.push('Shaft count must be ' + lim.shafts);
      if (lim.treadles && T !== lim.treadles) errs.push('Treadle count must be ' + lim.treadles);
      if (lim.ends && d.threading.length !== lim.ends) errs.push('Threading must have ' + lim.ends + ' ends');
      if (lim.picks && d.treadling.length !== lim.picks) errs.push('Treadling must have ' + lim.picks + ' picks');
    }

  const THUMB = {
    1: (p, w) => [(p + w) % 2, 'A', 'B'], 2: (p, w) => [E.mod(w - p, 4) < 2 ? 1 : 0, 'A', 'B'], 3: (p, w) => [E.mod(w - 2 * p, 5) ? 1 : 0, 'C', 'B'],

    5: (p, w) => { const pt = [0, 1, 2, 3, 2, 1]; return [E.mod(pt[w % 6] - pt[p % 6], 4) < 2 ? 1 : 0, 'E', 'B']; },
    6: (p, w) => { const d = E.mod(w - p, 4) < 2 ? 1 : 0; return [d, Math.floor(w / 4) % 2 ? 'B' : (w % 12 > 9 ? 'C' : 'A'), Math.floor(p / 4) % 2 ? 'B' : 'A']; },
    7: (p, w) => [p % 2 ? (p + w) % 2 : ((Math.floor(w / 4) + Math.floor(p / 4)) % 2), 'B', p % 2 ? 'B' : 'C'],
    8: (p, w) => [1, (Math.floor(w / 6) + Math.floor(p / 6)) % 2 ? 'A' : 'B', 'B'], 9: (p, w) => [w === 6 ? (p % 3 ? 1 : 0) : (E.mod(w - p, 4) < 2 ? 1 : 0), 'A', 'B'],
    10: (p, w) => (p > 4 && p < 9 && w > 3 && w < 10 ? [null] : [E.mod(w - p, 4) < 2 ? 1 : 0, Math.floor(w / 4) % 2 ? 'B' : 'A', 'B']),
    11: (p, w) => [0, 'B', w > 3 && w < 8 ? 'A' : (p > 7 && w > 8 ? 'C' : 'B')], 12: (p, w) => [1, (w + p) % 4 < 2 ? 'A' : 'B', 'B', w < 6 ? '/' : '\\'],
    13: (p, w) => [1, Math.abs(p - 6) + Math.abs(Math.floor(w / 2) * 2 - 6) + ((w * 7) % 3 === 0 ? 1 : 0) < 6 ? 'B' : 'A', 'B'], 14: (p, w) => [1, (Math.floor(w / 4) + Math.floor(p / 4)) % 2 ? 'D' : (w % 4 < 2 ? 'A' : 'C'), 'C'],
    15: (p, w) => [Math.abs(p - 6) + Math.abs(w - 6) < 5 ? 0 : (p + w) % 2, 'B', Math.abs(p - 6) + Math.abs(w - 6) < 5 ? 'C' : 'B'], 16: (p, w) => [((w * 5 + p * 3) % 7) < 3 ? 1 : 0, 'E', 'B'],
    17: (p, w) => [E.mod(w - 3 * p, 8) ? 0 : 1, 'A', 'B'], 18: (p, w) => [(p + w) % 2, 'B', 'A'], 19: (p, w) => [E.mod(w - p, 4) < 2 ? 1 : 0, 'E', 'E'],
    20: (p, w) => { const em = T.EMBLEM[Math.floor(p * 16 / 12)][Math.floor(w * 16 / 12)]; return [em ? (E.mod(w - 3 * p, 8) ? 1 : 0) : (E.mod(w - 3 * p, 8) ? 0 : 1), 'A', 'B']; }
  };
  App.thumb = function (n, px) {
    const cv = h('canvas', { width: px * 2, height: px * 2, 'aria-hidden': 'true' });
    const ctx = cv.getContext('2d'); const N = 12; const c = (px * 2) / N;
    ctx.fillStyle = '#5a4630'; ctx.fillRect(0, 0, px * 2, px * 2);
    for (let p = 0; p < N; p++) for (let w = 0; w < N; w++) {

  App.heroCloth = function (cv) {

    // unwoven warp above the fell

  };

      const fv = C.cloth({ rows: D.length, cols: D[0].length, label: 'Fragment ' + (k + 1) + ', faded to one colour. Enter picks out a crossing.',
        cellAt: (i, j) => (seen().has(i + ',' + j) ? { D: D[i][j], y: 'E', underHex: '#2c1e12', marks: ['dot'] } : { flat: true, y: 'E', hiddenTexture: true }),
        describe: (i, j) => (seen().has(i + ',' + j) ? C.describeCrossing(i, j, D[i][j]) : 'Pick ' + (i + 1) + ', end ' + (j + 1) + ': not picked out yet'),
        onCell: (i, j) => { if (!seen().has(i + ',' + j)) { s.inspect.push([i, j]); ctx.changed(); st(); } }, text: () => D.map((r, i) => 'Pick ' + (i + 1) + ': ' + r.map((v, j) => (seen().has(i + ',' + j) ? (v ? 'W' : 'f') : '.')).join('')).join('\n') + '\n(W warp on top, f weft on top, . not picked out)' });
      const st = () => { const x = E.inspectionStats(s.inspect, { D }); stP.textContent = 'Picked out ' + x.unique + ' crossings across ' + x.rows + ' picks and ' + x.cols + ' ends (need ' + task.cfg.inspect + ', 3 and 3).'; fv.refresh(); };
      panel.appendChild(section('The fragment', h('p', { class: 'muted' }, 'Age has faded warp and weft to the same brown. Only picking out crossings shows the structure.'), fv.el, stP));
      st();
      const res = {};
      const toolRow = h('div', { class: 'stack' });
      [['fiber', 'Look at a fibre under the microscope', f.fiber], ['dye', 'Run the dye spot test', f.dye], ['ledger', 'Search the ledger', f.ledger]].forEach(([id, label, txt]) => {
        const out = h('p', { class: 'ledger', 'aria-live': 'polite' }, (s.tools[id] || 0) > 0 ? txt : '');
        if (!(s.tools[id] > 0)) out.style.display = 'none';
        toolRow.appendChild(h('div', null, C.btn(label, () => { s.tools[id] = (s.tools[id] || 0) + 1; ctx.changed(); out.textContent = txt; out.style.display = ''; }, 'quiet'), out));
        res[id] = out;
      });
      panel.appendChild(section('Evidence tools', h('p', { class: 'muted' }, h('span', { class: 'tag' }, 'Fictional workshop'), 'Results come from the house’s fictional records.'), toolRow));
      panel.appendChild(C.radios({ legend: 'Structure', name: 'sx' + k, options: T.STRUCT_OPTS, value: s.structure, onChange: (v) => { s.structure = v; ctx.changed(); } }));
      panel.appendChild(C.radios({ legend: 'Where was it made? Claim only what the evidence supports.', name: 'rg' + k, options: T.REGION_OPTS, value: s.region, onChange: (v) => { s.region = v; ctx.changed(); } }));
      panel.appendChild(C.radios({ legend: 'When?', name: 'dt' + k, options: T.DATE_OPTS, value: s.date, onChange: (v) => { s.date = v; ctx.changed(); } }));
    }
    const tabs = h('div');
    const drawTabs = () => { clear(tabs); if (task.frags.length > 1) tabs.appendChild(C.tabs(task.frags.map((_, i) => 'Fragment ' + (i + 1)), k, (i) => { k = i; drawTabs(); renderFrag(); }, 'Fragments')); };
    drawTabs(); renderFrag();
    box.appendChild(tabs); box.appendChild(panel);
    return box;
  };

  // ===================== 20 commission =====================
  B.commission = function (ctx) {
    const { task, state, lv } = ctx; const box = h('div');
    const RCOL = ['#efe6cf', '#d3a777', '#9fb1c4', '#bfcf98'];
    const BRIEFS = {
      blanket: { title: 'Blanket', text: lv === 'verify' ? 'No float longer than 4 on either face, at least three yarns, not plain weave, every thread bound.' : 'No float longer than 5 on either face, at least two yarns, every thread bound.' },
      banner: { title: 'Banner', text: lv === 'verify' ? 'The doorway emblem shows one yarn on 85% of its crossings and the ground another on 85%; yarn contrast 4.5:1; the emblem’s warp-up share differs from the ground’s by 60 points; floats 8 or less.' : 'The doorway emblem shows one yarn on 75% of its crossings and the ground another on 75%; yarn contrast 3:1; warp-up share differs by 40 points; floats 9 or less.' },
      runner: { title: 'Table runner (17 × 17)', text: lv === 'verify' ? 'Mirror-symmetric left–right and top–bottom, floats 5 or less, at least three yarns, at least three different pick patterns.' : 'Mirror-symmetric left–right and top–bottom, floats 5 or less, at least two yarns.' }
    };
    const dims = () => task.dimsFor(state.brief);
    function fitDims() {
      const d = dims(); const b = state.board;
      if (b.regions.length !== d.P || b.regions[0].length !== d.W) {
        state.board = { regions: E.matrix(d.P, d.W, 0), fills: { 0: { weave: 'plain', dx: 0, dy: 0 } }, overrides: E.matrix(d.P, d.W, null), warp: Array(d.W).fill('A'), weft: Array(d.P).fill('B') };
        state.draft = E.makeDraft({ shafts: 8, treadles: 10, ends: d.W, picks: d.P });
        return true;
      }
      return false;
    }
    const checksBox = h('div', { 'aria-live': 'polite' });
    const prevBox = h('div');
    let emblem = state.brief === 'banner';
    let brush = 1, tool = 'paint', corner = null, mirLR = false, mirTB = false;
    function cloth() { const r = T.commissionCloth(state, dims()); return r.err ? null : { D: r.D, A: E.appearance(r.D, r.warp, r.weft), warp: r.warp, weft: r.weft }; }
    function drawPreview() {
      clear(prevBox); const cl = cloth(); if (!cl) { prevBox.appendChild(h('p', { class: 'err' }, 'The design is incomplete.')); return; }
      const P = cl.D.length, W = cl.D[0].length;
      prevBox.appendChild(C.cloth({ rows: P, cols: W, label: 'Your commissioned cloth', cellAt: (i, j) => ({ D: cl.D[i][j], y: cl.A[i][j], underHex: yh(cl.D[i][j] ? cl.weft[i] : cl.warp[j]), marks: emblem && state.brief === 'banner' && T.EMBLEM[i] && T.EMBLEM[i][j] ? ['ghost'] : [] }), describe: (i, j) => C.describeCrossing(i, j, cl.D[i][j], cl.A[i][j]), text: () => C.clothText(cl.D, cl.A) }).el);
      prevBox.appendChild(C.analysis(cl.D).el);
      prevBox.appendChild(h('div', { class: 'row' }, C.btn('Download design picture (SVG)', () => App.download(App.svgFor(cl.D, cl.A), 'art001-commission.svg', 'image/svg+xml'), 'small quiet'), C.btn('Download design as text', () => App.download((state.mode === 'shaft' ? E.draftToText(state.draft) : 'Design board (rows = picks, pick 1 first; W warp up, f weft up)\n' + cl.D.map((r, i) => 'pick ' + (i + 1) + ': ' + r.map((v) => (v ? 'W' : 'f')).join('')).join('\n') + '\nwarp: ' + E.seqToText(cl.warp) + '\nweft: ' + E.seqToText(cl.weft)) + '\n\nMaker’s note:\n' + state.note + '\n', 'art001-commission.txt', 'text/plain'), 'small quiet'), C.btn('Print', () => window.print(), 'small quiet')));
      prevBox.appendChild(h('p', { class: 'muted' }, h('span', { class: 'tag' }, 'Player-created design'), 'These downloads are your editable design, not a progress record.'));
    }
    function liveChecks() { clear(checksBox); const r = T.judge(20, lv, state); checksBox.appendChild(C.checklist(r.checks)); }
    const work = h('div');
    function drawWork() { App.keep(work, drawWork0); }
    function drawWork0() {
      clear(work);
      if (state.mode === 'shaft') { work.appendChild(C.draftEditor({ draft: state.draft, onChange: () => { ctx.changed(); drawPreview(); liveChecks(); } }).el); return; }
      const b = state.board; const d = dims();
      const paintAt = (i, j, v) => { const pts = [[i, j]]; if (mirLR) pts.push([i, d.W - 1 - j]); if (mirTB) pts.push([d.P - 1 - i, j]); if (mirLR && mirTB) pts.push([d.P - 1 - i, d.W - 1 - j]); pts.forEach(([a, c]) => { if (tool === 'cell') b.overrides[a][c] = v; else b.regions[a][c] = brush; }); };
      const rv = C.cloth({ rows: d.P, cols: d.W, label: 'Design board: regions. Enter paints the current region or toggles a crossing in crossing mode.',
        cellAt: (i, j) => ({ flat: true, hex: RCOL[b.regions[i][j]], marks: (b.overrides[i][j] === 1 ? ['dot'] : b.overrides[i][j] === 0 ? ['ring'] : []).concat(corner && corner[0] === i && corner[1] === j ? ['band'] : []).concat(emblem && state.brief === 'banner' && T.EMBLEM[i] && T.EMBLEM[i][j] ? ['ghost'] : []) }),
        describe: (i, j) => 'Pick ' + (i + 1) + ', end ' + (j + 1) + ': region ' + (b.regions[i][j] + 1) + (b.overrides[i][j] === 1 ? ', forced warp up' : b.overrides[i][j] === 0 ? ', forced weft up' : '') + (state.brief === 'banner' && T.EMBLEM[i][j] ? ', inside the emblem' : ''),
        onCell: (i, j) => {
          if (tool === 'cell') { const o = b.overrides[i][j]; paintAt(i, j, o === null ? 1 : o === 1 ? 0 : null); }
          else if (tool === 'rect') { if (!corner) { corner = [i, j]; return; } for (let a = Math.min(i, corner[0]); a <= Math.max(i, corner[0]); a++) for (let c = Math.min(j, corner[1]); c <= Math.max(j, corner[1]); c++) paintAt(a, c); corner = null; }
          else paintAt(i, j);
          ctx.changed(); drawPreview(); liveChecks();
        } });
      const regPal = h('div', { class: 'palette', role: 'group', 'aria-label': 'Region to paint' }, E.range(4).map((r) => h('button', { type: 'button', style: 'background:' + RCOL[r], 'aria-pressed': brush === r ? 'true' : 'false', on: { click: () => { brush = r; drawWork(); } } }, 'Region ' + (r + 1))));
      const fills = h('div', { class: 'stack' }, E.range(4).map((r) => {
        const f = b.fills[r] || { weave: 'plain', dx: 0, dy: 0 };
        const num = (lab, key) => h('label', null, ' ' + lab + ' ', h('input', { type: 'number', min: -8, max: 8, value: f[key] || 0, style: 'width:3.5rem', 'aria-label': 'Region ' + (r + 1) + ' ' + lab, on: { change: (e) => { b.fills[r] = Object.assign({}, f, { [key]: parseInt(e.target.value, 10) || 0 }); ctx.changed(); drawPreview(); liveChecks(); } } }));
        return h('div', { class: 'row' }, h('span', { style: 'display:inline-block;width:1.2rem;height:1.2rem;background:' + RCOL[r] + ';border:1px solid #8c7a55' }), h('strong', null, 'Region ' + (r + 1)),
          h('select', { 'aria-label': 'Region ' + (r + 1) + ' weave', on: { change: (e) => { b.fills[r] = Object.assign({}, f, { weave: e.target.value }); ctx.changed(); drawPreview(); liveChecks(); } } }, Object.keys(T.FILLS).map((k) => h('option', { value: k, selected: f.weave === k }, T.FILLS[k].label))),
          num('shift ends', 'dx'), num('shift picks', 'dy'));
      }));
      const seqIn = (label, key) => { const inp = h('input', { type: 'text', value: E.seqToText(b[key]), 'aria-label': label, style: 'width:16rem' }); const m = h('span', { class: 'err' }); return h('div', { class: 'row' }, h('label', null, label + ' ', inp), C.btn('Apply', () => { const s = E.parseSeq(inp.value, 200); if (!s || !s.length) { m.textContent = 'Use yarn letters such as 4A 4B.'; return; } m.textContent = ''; b[key] = E.range(key === 'warp' ? d.W : d.P).map((i) => s[i % s.length]); ctx.changed(); drawPreview(); liveChecks(); }, 'small'), m); };
      work.appendChild(h('div', { class: 'row' }, regPal));
      work.appendChild(C.radios({ legend: 'Tool', name: 'tool20', value: tool, options: [{ id: 'paint', text: 'Paint region' }, { id: 'rect', text: 'Paint a block of region (two corners)' }, { id: 'cell', text: 'Force single crossings (warp up, weft up, then clear)' }], onChange: (v) => { tool = v; corner = null; } }));
      work.appendChild(h('div', { class: 'row' }, h('label', null, h('input', { type: 'checkbox', checked: mirLR, on: { change: (e) => { mirLR = e.target.checked; } } }), ' Mirror painting left–right'), h('label', null, h('input', { type: 'checkbox', checked: mirTB, on: { change: (e) => { mirTB = e.target.checked; } } }), ' Mirror painting top–bottom'),
        state.brief === 'banner' ? h('label', null, h('input', { type: 'checkbox', checked: emblem, on: { change: (e) => { emblem = e.target.checked; drawWork(); drawPreview(); } } }), ' Show the emblem outline') : null));
      work.appendChild(h('div', { class: 'scroller' }, rv.el));
      work.appendChild(h('h3', null, 'Weave in each region'));
      work.appendChild(fills);
      work.appendChild(h('h3', null, 'Yarns'));
      work.appendChild(seqIn('Warp colour order', 'warp'));
      work.appendChild(seqIn('Weft colour order', 'weft'));
      work.appendChild(h('p', { class: 'muted' }, 'Yarns: ' + E.YARN_IDS.map((y) => C.yarnLabel(y)).join(', ') + '.'));
    }
    const briefFs = C.radios({ legend: 'The brief', name: 'br20', value: state.brief, options: task.comm.briefs.map((b) => ({ id: b, text: BRIEFS[b].title + ': ' + BRIEFS[b].text })), onChange: (v) => { state.brief = v; const reset = fitDims(); emblem = v === 'banner'; ctx.changed(); if (reset) App.toast('The loom was reset to the ' + dims().W + ' × ' + dims().P + ' size this brief needs.'); drawWork(); drawPreview(); liveChecks(); } });
    const modeFs = C.radios({ legend: 'Loom', name: 'md20', value: state.mode, options: [{ id: 'board', text: 'Design board: paint regions and give each a weave (as a Jacquard designer would)' }, { id: 'shaft', text: 'Shaft loom: up to 8 shafts and 10 treadles' }], onChange: (v) => { state.mode = v; ctx.changed(); drawWork(); drawPreview(); liveChecks(); } });
    const note = h('textarea', { 'aria-label': 'Maker’s note', value: state.note, on: { input: (e) => { state.note = e.target.value.slice(0, 4000); wc.textContent = E.noteStats(state.note).words + ' words'; ctx.changed(); liveChecks(); } } });
    const wc = h('p', { class: 'counts' }, E.noteStats(state.note).words + ' words');
    box.appendChild(h('div', { class: 'cols' }, briefFs, modeFs));
    box.appendChild(h('details', { class: 'panel' }, h('summary', null, 'House examples (for inspiration; copies are not accepted as original)'), h('div', { class: 'row' }, task.examples.map((ex) => h('div', null, h('div', { class: 'lab' }, ex.label), structCloth(ex.D, ex.label, { cell: 8 }).el)))));
    fitDims();
    box.appendChild(h('div', { class: 'cols' }, section('Design', work), section('Woven result', prevBox)));
    box.appendChild(section('Maker’s note', h('p', { class: 'muted' }, 'Explain your choices: the structure, how it meets the brief, and (at Verify) a compromise you made. Word count alone is not enough.'), note, wc));
    box.appendChild(section('Constraint checks (live)', h('p', { class: 'muted' }, 'Only the stated, measurable constraints are checked. Taste is never scored.'), checksBox));
    drawWork(); drawPreview(); liveChecks();
    return box;
  };
})();
